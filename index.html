тся увлажнению и гниению, чем пиленый.", "rel": ["К-03", "Д-К03-20"]}, {"id": "carp-03", "num": "Фиг. 4", "title": "Раскалывание бревна", "topic": "Инструменты", "img": "assets/books/figures/p007_01_f4.png", "file": "p007_01_f4.png", "text": "Раскалывание бревна клиньями вдоль волокон: удары по линии слоя, поочерёдное забивание клиньев.", "why": "Расколотые «пластины» и половинки часто встречаются в старых перекрытиях и обрешётках. Трещины от раскалывания — путь для влаги и гнили.", "rel": ["К-03", "Д-К03-20"]}, {"id": "carp-04", "num": "Фиг. 5", "title": "Выборка шпунта", "topic": "Инструменты", "img": "assets/books/figures/p008_01_f5.png", "file": "p008_01_f5.png", "text": "Выборка прямого шпунта (паза) в брусе топором и долотом: разметка, прорубка, зачистка.", "why": "Качество шпунта определяет плотность соединения. Разработанный, «разбитый» шпунт — признак расстройства узла и потери совместной работы.", "rel": ["К-03", "Д-К03-22"]}, {"id": "carp-05", "num": "Фиг. 8—9", "title": "Долота", "topic": "Инструменты", "img": "assets/books/figures/p010_02_f8.png", "file": "p010_02_f8.png", "text": "Плоское и полукруглое долота для выборки гнёзд и очистки боковых стенок.", "why": "Гнёзда под шипы и врубки — концентраторы напряжений и влаги. Выкрошенные края гнезда указывают на перегрузку или гниение.", "rel": ["К-03", "Д-К03-22"]}, {"id": "carp-06", "num": "Фиг. 10", "title": "Медведка", "topic": "Инструменты", "img": "assets/books/figures/p010_01_f10.png", "file": "p010_01_f10.png", "text": "Медведка — тяжёлый струг для грубой обтёски брёвен; работа двумя руками.", "why": "Следы медведки (плоские «каннелюры») на бревнах — признак ручной обтёски XIX — начала XX в.", "rel": ["К-02"]}, {"id": "carp-07", "num": "Фиг. 36", "title": "Разметка косых срезов", "topic": "Инструменты", "img": "assets/books/figures/p026_01_f36.png", "file": "p026_01_f36.png", "text": "Разметка косых срезов и «изворотистых» поверхностей; плотничный циркуль и приёмы причерчивания.", "why": "По разметке видно, насколько точно выполнены сопряжения. Зазоры и перекосы в узлах объясняются ошибками разметки, а не только эксплуатацией.", "rel": ["К-05"]}, {"id": "carp-08", "num": "Фиг. 41—42", "title": "Отволока", "topic": "Инструменты", "img": "assets/books/figures/p029_01_f41.png", "file": "p029_01_f41.png", "text": "Отволока и черта — инструменты для причерчивания одной доски к другой и переноса линии.", "why": "Позволяют отличить заводскую геометрию от ручной подгонки: ручная подгонка даёт «мягкие» неровные кромки.", "rel": ["К-03"]}, {"id": "carp-09", "num": "Фиг. 50", "title": "Таскальные крючья", "topic": "Инструменты", "img": "assets/books/figures/p035_01_f50.png", "file": "p035_01_f50.png", "text": "Крючья для перемещения и подъёма брёвен; техника безопасности при работе с тяжёлым лесом.", "why": "Кованые крючья и скобы встречаются в конструкциях как крепёж; их коррозия — типовая причина ослабления узла.", "rel": ["К-05", "Д-К05-01"]}, {"id": "carp-10", "num": "Фиг. 55", "title": "Копёр", "topic": "Машины", "img": "assets/books/figures/p039_01_f55.png", "file": "p039_01_f55.png", "text": "Копёр для забивки свай: стойки, ворот, оттяжки, направляющие.", "why": "Свайные основания исторических зданий устраивались такими копрами. Обнаружение свай требует шурфов и сейсмоакустики (п. 5.2.19 ГОСТ).", "rel": ["К-01", "Д-К01-04"]}, {"id": "carp-11", "num": "Фиг. 56", "title": "Баба", "topic": "Машины", "img": "assets/books/figures/p041_01_f56.png", "file": "p041_01_f56.png", "text": "Баба — чугунный молот копра; подъём и сброс по направляющим.", "why": "Следы забивки (смятие головы сваи) видны при вскрытии и помогают оценить её состояние.", "rel": ["К-01"]}, {"id": "carp-12", "num": "Фиг. 57", "title": "Замок откосный простой", "topic": "Соединения", "img": "assets/books/figures/p042_01_f57.png", "file": "p042_01_f57.png", "text": "Соединение двух брусьев под углом со скошенными концами — простейший откосный замок.", "why": "Расстройство такого узла даёт перекос рамы или обвязки; на фото фиксируется зазор по скосу.", "rel": ["К-05", "Д-К05-04"]}, {"id": "carp-13", "num": "Фиг. 58", "title": "Откосный с прирубом", "topic": "Соединения", "img": "assets/books/figures/p043_01_f58.png", "file": "p043_01_f58.png", "text": "Откосный замок с прирубом: дополнительная площадка для упора, воспринимает сдвиг.", "why": "При потере прируба узел работает как простой — появляется подвижность и перекос.", "rel": ["К-05"]}, {"id": "carp-14", "num": "Фиг. 59", "title": "Откосный зобом", "topic": "Соединения", "img": "assets/books/figures/p044_01_f59.png", "file": "p044_01_f59.png", "text": "Замок «зобом» (кильсоновый): выступ-зоб, работающий на смятие и сдвиг.", "why": "Смятие зоба — характерный дефект исторических обвязок; видно как вмятина и закол.", "rel": ["К-05", "Д-К05-01"]}, {"id": "carp-15", "num": "Фиг. 60", "title": "Откосный в обвязках", "topic": "Соединения", "img": "assets/books/figures/p045_01_f60.png", "file": "p045_01_f60.png", "text": "Применение откосного замка в нижних и верхних обвязках, мостовых брусьях, поручнях.", "why": "Обвязки — узлы, где начинается гниение из-за застоя воды; проверять опирание и зазоры.", "rel": ["К-05", "Д-К03-20"]}, {"id": "carp-16", "num": "Фиг. 64", "title": "Сдвижной замок с шипами", "topic": "Соединения", "img": "assets/books/figures/p048_01_f64.png", "file": "p048_01_f64.png", "text": "Сдвижной замок с шипами для сращивания элементов по длине с фиксацией от сдвига.", "why": "Ослабление шипов — причина подвижности составных балок и обвязок.", "rel": ["К-05"]}, {"id": "carp-17", "num": "Фиг. 67", "title": "Сквозной сковородник", "topic": "Соединения", "img": "assets/books/figures/p050_01_f67.png", "file": "p050_01_f67.png", "text": "Сквозной сковородник: паз с уступом, работающий на растяжение и изгиб.", "why": "Применялся в стропилах и связях; трещины от уступа — признак перегрузки.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-18", "num": "Фиг. 70", "title": "Замки для обвязок и стропил", "topic": "Соединения", "img": "assets/books/figures/p053_01_f70.png", "file": "p053_01_f70.png", "text": "Замки для скрепления обвязных связей, мостовых брусьев и стропил.", "why": "Связка «балка — стропило» определяет передачу распора; её расстройство ведёт к деформациям крыши.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-19", "num": "Фиг. 72", "title": "Сращивание шпунтом", "topic": "Соединения", "img": "assets/books/figures/p055_01_f72.png", "file": "p055_01_f72.png", "text": "Сращивание торцов шпунтом: паз и гребень по торцу.", "why": "Плотное прилегание торцов критично: зазор = капилляр для влаги и начало гнили.", "rel": ["К-03", "Д-К03-20"]}, {"id": "carp-20", "num": "Фиг. 74", "title": "Торцевой замок с шипом", "topic": "Соединения", "img": "assets/books/figures/p056_01_f74.png", "file": "p056_01_f74.png", "text": "Торцевое соединение с шипом для вертикальных брусьев и стоек.", "why": "Стойки с такими узлами часто встречаются в каркасных перегородках; проверять расклинивание шипа.", "rel": ["К-05"]}, {"id": "carp-21", "num": "Фиг. 75", "title": "Крестообразный шип", "topic": "Соединения", "img": "assets/books/figures/p057_01_f75.png", "file": "p057_01_f75.png", "text": "Торцевой замок с крестообразным шипом — повышенная стойкость к сдвигу и кручению.", "why": "Сложный шип труднее выполнить; дефекты изготовления видны как неплотности и сколы.", "rel": ["К-05"]}, {"id": "carp-22", "num": "Фиг. 78", "title": "Угловой в накладку", "topic": "Соединения", "img": "assets/books/figures/p059_01_f78.png", "file": "p059_01_f78.png", "text": "Угловое соединение в накладку концами или серединой — простейший угловой замок.", "why": "Применялся в тонких досках; в несущих узлах требует крепежа. Отсутствие крепежа — дефект.", "rel": ["К-05"]}, {"id": "carp-23", "num": "Фиг. 82", "title": "Простой сковородник", "topic": "Соединения", "img": "assets/books/figures/p062_01_f82.png", "file": "p062_01_f82.png", "text": "Угловой замок «простой сковородник»: трапециевидный шип и паз.", "why": "Работает на растяжение; при усушке появляется люфт — типичная причина скрипа и подвижности.", "rel": ["К-05"]}, {"id": "carp-24", "num": "Фиг. 90", "title": "Угол с присевом", "topic": "Соединения", "img": "assets/books/figures/p070_01_f90.png", "file": "p070_01_f90.png", "text": "Рубка угла с присевом — врубка с упорной площадкой; применялась в деревянных стенах.", "why": "Углы деревянных стен — зоны увлажнения; присев гниёт первым, поэтому угол вскрывают при обследовании.", "rel": ["К-02", "Д-К02-04"]}, {"id": "carp-25", "num": "Фиг. 95", "title": "Проушинный в награду", "topic": "Соединения", "img": "assets/books/figures/p074_01_f95.png", "file": "p074_01_f95.png", "text": "Проушинный замок «в награду»: проушина и шип с посадкой.", "why": "Применялся в рамах и стойках; расстройство проушины даёт перекос створок и рам.", "rel": ["К-05"]}, {"id": "carp-26", "num": "Фиг. 114", "title": "Замок с несколькими шипами", "topic": "Соединения", "img": "assets/books/figures/p092_01_f114.png", "file": "p092_01_f114.png", "text": "Замок с несколькими шипами для вязки под углом не на конце элемента.", "why": "Многозубые соединения чувствительны к точности; зазоры между шипами — признак расстройства.", "rel": ["К-05"]}, {"id": "carp-27", "num": "Фиг. 121", "title": "Сплотка в шпунт", "topic": "Сплотка", "img": "assets/books/figures/p100_01_f121.png", "file": "p100_01_f121.png", "text": "Сплотка досок в шпунт: гребень одной доски входит в паз другой.", "why": "Так выполнялись щиты и подшивка; при усушке шпунт раскрывается, появляются щели и продувание.", "rel": ["К-03", "Д-К03-22"]}, {"id": "carp-28", "num": "Фиг. 122", "title": "Сплотка на шипах", "topic": "Сплотка", "img": "assets/books/figures/p101_01_f122.png", "file": "p101_01_f122.png", "text": "Сплотка досок с простыми шипами; кромки скашивают, чтобы не зацеплялись.", "why": "Шиповое соединение дощатых щитов и балок; выпадение шипа — признак потери совместной работы.", "rel": ["К-03"]}, {"id": "carp-29", "num": "Фиг. 125", "title": "Сплотка щитов", "topic": "Сплотка", "img": "assets/books/figures/p103_01_f125.png", "file": "p103_01_f125.png", "text": "Сплотка щитов для переборок и подшивки потолков, в том числе в судовых каютах.", "why": "Щиты перегородок и подшивок часто поражены гнилью с обратной стороны — нужен осмотр сверху и снизу.", "rel": ["К-08", "Д-К08-02"]}, {"id": "carp-30", "num": "Фиг. 127", "title": "Обшивка дома", "topic": "Дома и стены", "img": "assets/books/figures/p106_01_f127.png", "file": "p106_01_f127.png", "text": "Обшивка деревянного дома дюймовыми досками по стойкам из расколотых 2½-дюймовых досок; стойки у углов, у окон и в середине простенков.", "why": "Отсутствие вентиляционного зазора под обшивкой — главная причина гнили обшивки и венцов. Признак — вспучивание и тёмные пятна.", "rel": ["К-07", "Д-К07-01"]}, {"id": "carp-31", "num": "Фиг. 130", "title": "Обшивка сарая", "topic": "Дома и стены", "img": "assets/books/figures/p109_01_f130.png", "file": "p109_01_f130.png", "text": "Обшивка сарая досками и устройство проёмов в деревянных стенах.", "why": "Хозяйственные постройки часто служат индикатором состояния кровли и водоотвода на участке.", "rel": ["К-07"]}, {"id": "carp-32", "num": "Фиг. 138", "title": "Закладные рамы и раскосины", "topic": "Дома и стены", "img": "assets/books/figures/p118_01_f138.png", "file": "p118_01_f138.png", "text": "Закладные рамы в стенах и раскосины, обеспечивающие жёсткость и связь.", "why": "Раскосины — элементы жёсткости; их утрата при перепланировках ведёт к перекосам и трещинам.", "rel": ["К-05", "Д-К05-05"]}, {"id": "carp-33", "num": "Фиг. 169", "title": "Забор «край на край»", "topic": "Дома и стены", "img": "assets/books/figures/p150_01_f169.png", "file": "p150_01_f169.png", "text": "Временный забор «край на край» — обшивка досками впритык по столбам.", "why": "По типу ограждений и обшивки датируют переделки; гниль столбов у земли — типовой дефект.", "rel": ["К-08", "Д-К03-20"]}, {"id": "carp-34", "num": "Фиг. 141", "title": "Заделка балки в стену", "topic": "Балки", "img": "assets/books/figures/p121_01_f141.png", "file": "p121_01_f141.png", "text": "Балка в каменной стене: конец осмолён, обложен войлоком, заложен не более 6 вершков (≈27 см, «на один кирпич»), скреплён скобой со штырём.", "why": "Торец в кладке и скоба — зоны увлажнения и коррозии. Это ключевой узел для оценки «разрушения заделки» и прогибов.", "rel": ["К-03", "Д-К03-04", "О-02"]}, {"id": "carp-35", "num": "Фиг. 144", "title": "Составная балка", "topic": "Балки", "img": "assets/books/figures/p124_01_f144.png", "file": "p124_01_f144.png", "text": "Балка из двух рядов брусьев с зубьями по длине и расклиниванием.", "why": "Расстройство зубьев и выпадение клиньев — причина снижения несущей способности. Проверять соединение, а не только сечение.", "rel": ["К-03", "Д-К03-22"]}, {"id": "carp-36", "num": "Фиг. 145", "title": "Досчатая балка", "topic": "Балки", "img": "assets/books/figures/p125_01_f145.png", "file": "p125_01_f145.png", "text": "Балка из трёх досок на ребро; в книге прямо сказано: в досках видно состояние древесины, а середина бревна может быть гнилой.", "why": "При обследовании проверять расслоение досок и состояние скрытых слоёв; внешне целая балка может быть сгнившей внутри.", "rel": ["К-03", "Д-К03-20"]}, {"id": "carp-37", "num": "Фиг. 147", "title": "Надделки сверху", "topic": "Балки", "img": "assets/books/figures/p127_01_f147.png", "file": "p127_01_f147.png", "text": "Усиление балки надделками сверху: балка выправляется по шаблону, сверху крепится усиливающий элемент.", "why": "Исторические усиления — часть конструкции. Оценивать их достаточность и совместную работу (примечание к п. 5.1.11 ГОСТ).", "rel": ["К-03", "О-05"]}, {"id": "carp-38", "num": "Фиг. 150", "title": "Боковые накладки", "topic": "Балки", "img": "assets/books/figures/p130_01_f150.png", "file": "p130_01_f150.png", "text": "Усиление балки накладками с боков заподлицо с нижней гранью.", "why": "Смотреть на плотность прилегания и крепёж: зазоры и коррозия крепежа сводят усиление к нулю.", "rel": ["К-03", "Д-К03-02"]}, {"id": "carp-39", "num": "Фиг. 171", "title": "Шаг стропил", "topic": "Крыши", "img": "assets/books/figures/p152_01_f171.png", "file": "p152_01_f171.png", "text": "Расстановка стропил по ширине здания и назначение шага.", "why": "Шаг стропил — база для проверки нагрузок и обрешётки; его изменение при ремонте меняет работу крыши.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-40", "num": "Фиг. 172", "title": "Опирание стропильных ног", "topic": "Крыши", "img": "assets/books/figures/p153_01_f172.png", "file": "p153_01_f172.png", "text": "Опирание стропильных ног на короткий брус; варианты узла.", "why": "Узел опирания — место скалывания и гниения; при осмотре фиксировать зазоры и смятие.", "rel": ["К-06", "Д-К06-02"]}, {"id": "carp-41", "num": "Фиг. 174", "title": "Стропила в каменных домах", "topic": "Крыши", "img": "assets/books/figures/p155_01_f174.png", "file": "p155_01_f174.png", "text": "Устройство стропил в каменных строениях: связь, подобная балке, и опирание на кладку.", "why": "В каменных домах узел опирания контактирует с кладкой — риск конденсата и гнили концов.", "rel": ["К-06", "Д-К06-02"]}, {"id": "carp-42", "num": "Фиг. 175", "title": "Мауэрлат и прогоны", "topic": "Крыши", "img": "assets/books/figures/p156_01_f175.png", "file": "p156_01_f175.png", "text": "Два прогона (мауэрлата) под стропила; распределение нагрузки на стены.", "why": "Проверять анкеровку мауэрлата и состояние подкладок: ослабление ведёт к сдвигу крыши.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-43", "num": "Фиг. 176", "title": "Обрешётка под железо", "topic": "Крыши", "img": "assets/books/figures/p157_01_f176.png", "file": "p157_01_f176.png", "text": "Обрешётка под железную крышу досками 2½ дюйма (≈6,4 см) и шаг обрешётки.", "why": "Историческая железная кровля по деревянной обрешётке: конденсат снизу — главная причина коррозии листов и гнили досок.", "rel": ["К-06", "Д-К06-01"]}, {"id": "carp-44", "num": "Фиг. 177", "title": "Конёк", "topic": "Крыши", "img": "assets/books/figures/p158_01_f177.png", "file": "p158_01_f177.png", "text": "Конёк крыши и обрешётка под деревянную кровлю.", "why": "Протечки по коньку — типовая жалоба; проверять примыкания и вентиляцию подкровельного пространства.", "rel": ["К-06", "Д-К06-01"]}, {"id": "carp-45", "num": "Фиг. 179", "title": "Обход трубы", "topic": "Крыши", "img": "assets/books/figures/p160_01_f179.png", "file": "p160_01_f179.png", "text": "Обход крыши вокруг трубы: желоба из полулистов выше трубы, разделка.", "why": "Именно здесь чаще всего протечки и замачивание чердачного перекрытия; проверять металл и зазоры.", "rel": ["К-06", "Д-К06-01", "Д-К03-24"]}, {"id": "carp-46", "num": "Фиг. 182", "title": "Легель", "topic": "Крыши", "img": "assets/books/figures/p163_01_f182.png", "file": "p163_01_f182.png", "text": "Стропила с легелем — горизонтальным брусом посередине, соединённым со стропильными ногами замком в сковородник; чем положе крыша, тем нужнее легель.", "why": "Легель воспринимает распор. Его отсутствие или расстройство объясняет деформации скатов и трещины в узлах.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-47", "num": "Фиг. 188", "title": "Опора на капитальную стену", "topic": "Крыши", "img": "assets/books/figures/p169_01_f188.png", "file": "p169_01_f188.png", "text": "Стропила с опорой на среднюю капитальную стену — уменьшение пролёта и распора.", "why": "При утрате внутренней стены или её проёмах стропила получают дополнительный пролёт — причина прогибов.", "rel": ["К-06", "Д-К06-03"]}, {"id": "carp-48", "num": "Фиг. 200", "title": "Световой фонарь", "topic": "Крыши", "img": "assets/books/figures/p183_01_f200.png", "file": "p183_01_f200.png", "text": "Фонарь на крыше: вертикальные схватки, остекление, узел примыкания.", "why": "Фонари и зенитные окна — места протечек и конденсата; проверять примыкания и несущие стойки.", "rel": ["К-06", "Д-К06-01"]}, {"id": "carp-49", "num": "Фиг. 202", "title": "Тетива лестницы", "topic": "Лестницы", "img": "assets/books/figures/p185_01_f202.png", "file": "p185_01_f202.png", "text": "Крепление тетивы и врубка ступеней: разметка, шпунты, посадка ступени.", "why": "Исторические параметры: подъём ≈4 вершка (18 см), проступь ≥6 вершков (27 см). Отклонения — след переделок.", "rel": ["К-04", "Д-К04-12"]}, {"id": "carp-50", "num": "Фиг. 203", "title": "Мост на фермах", "topic": "Мосты", "img": "assets/books/figures/p187_01_f203.png", "file": "p187_01_f203.png", "text": "Деревянный мост кружальной системы (первый в России, 1813 г.): 7 арок, 8 ферм, свайные опоры в 5 рядов.", "why": "Термины «кружала» и ферменные схемы нужны при описании исторических большепролётных конструкций.", "rel": ["К-05"]}]}, {"id": "series", "title": "Серия 2.140-6", "sub": "Типовые узлы деревянных перекрытий, 1986", "intro": "Рабочие чертежи узлов деревянных перекрытий жилых сельских зданий: цокольное перекрытие над проветриваемым подпольем, междуэтажное и чердачное. Листы отрендерены из PDF серии; подписи на сканах читаются частично, поэтому листы подписаны по составу выпуска.", "topics": [{"name": "Узлы перекрытий", "intro": "Балки с черепными брусками, щиты наката, гидроизоляция по цоколю, продухи, звукоизоляционные прокладки, утеплитель и пароизоляция. По этим листам видно, как должно быть устроено перекрытие, и что считать отклонением.", "why": "Эталон для перекрытий сельских домов 1980-х: отсутствие продухов, гидроизоляции или черепных брусков — прямой признак дефекта и причина гнили.", "rel": ["К-03.3", "Д-К03-20", "Д-К03-22", "Д-К03-24"]}], "items": [{"id": "series-01", "num": "Лист 10", "title": "Узел 1", "topic": "Узлы перекрытий", "img": "assets/books/series/s-01.png", "file": "s-01.png", "text": "", "why": "", "rel": ["К-03.3", "Д-К03-20", "Д-К03-22", "Д-К03-24"]}, {"id": "series-02", "num": "Лист 11", "title": "Узел 2", "topic": "Узлы перекрытий", "img": "assets/books/series/s-02.png", "file": "s-02.png", "text": "", "why": "", "rel": ["К-03.3", "Д-К03-2 ro": "Атлас к курсу строительного искусства: 52 таблицы с планами, разрезами и деталями по земляным, фашинным, каменным, бетонным, деревянным, свайным и металлическим работам. Подписи чертежей на сканах читаются фрагментарно, поэтому назначение таблиц указано по разделу курса.", "topics": [{"name": "Земляные работы", "intro": "Профили выемок и насыпей, разбивка, укрепление откосов, водоотвод. Показывают, как в начале XX в. рассчитывали и устраивали земляные работы под здания и дороги.", "why": "Полезно для объектов на слабых грунтах, с подтоплением и перепадами рельефа: язык описания откосов, дренажа и укреплений. Связь с геологией — п. 5.1.12, 5.2.2 ГОСТ.", "rel": ["К-01", "Д-К01-01"]}, {"name": "Фашинные работы", "intro": "Фашины, тюфяки, укрепление берегов и откосов; материалы и порядок укладки.", "why": "Встречается в основаниях на слабых и обводнённых грунтах. Помогает распознать фашинные подушки при вскрытии.", "rel": ["К-01", "Д-К01-04"]}, {"name": "Каменные работы", "intro": "Разрезка стен (вертикальных, наклонных, цилиндрических), перевязка, углы, притыкание, столбы, простенки, пустоты, трубы, своды, смешанная кладка и облицовка.", "why": "Основной визуальный справочник по исторической кладке: по нему проверяют перевязку, опирание, толщину швов и объясняют трещины и выпучивания.", "rel": ["К-02", "Д-К02-01"]}, {"name": "Бетонные работы", "intro": "Опалубка и массивы, бетонные изделия (трубы, плитки, ступени), железобетон, бетонирование под водой.", "why": "Помогает распознать ранний железобетон и оценить защитный слой и карбонизацию — см. Д-К03-13.", "rel": ["К-03", "Д-К03-13"]}, {"name": "Деревянные работы", "intro": "Врубки и сопряжения, стены, перекрытия, стропила; плотничные и столярные работы.", "why": "Дополняет «Плотничное искусство»: те же узлы, но в общестроительном контексте.", "rel": ["К-03", "Д-К03-22"]}, {"name": "Свайные работы", "intro": "Деревянные и винтовые сваи, копры, забивка, ростверки и выдёргивание свай.", "why": "Свайные основания исторических зданий: методы выявления (шурфы, сейсмоакустика — п. 5.2.19 ГОСТ) и оценка.", "rel": ["К-01", "Д-К01-02"]}, {"name": "Металлические работы", "intro": "Клёпка и болты, узлы ферм, чугунные колонны, трубы и плиты; кузнечные и слесарные приёмы.", "why": "Позволяет назвать тип исторического соединения и его типовые дефекты: коррозия, ослабление заклёпок, трещины в чугуне.", "rel": ["К-05", "Д-К05-01"]}, {"name": "Отделочные работы", "intro": "Штукатурка по камню и дереву, карнизы, откосы, малярные составы.", "why": "Диагностика отделки: несовместимость составов, отсутствие подготовки, отслоение — см. Д-К07-01.", "rel": ["К-07", "Д-К07-01"]}], "items": [{"id": "atlas-01", "num": "Атлас", "title": "Таблица 1", "topic": "Земляные работы", "img": "assets/books/atlas/tab-02.png", "file": "tab-02.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-02", "num": "Атлас", "title": "Таблица 2", "topic": "Земляные работы", "img": "assets/books/atlas/tab-03.png", "file": "tab-03.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-03", "num": "Атлас", "title": "Таблица 3", "topic": "Земляные работы", "img": "assets/books/atlas/tab-04.png", "file": "tab-04.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-04", "num": "Атлас", "title": "Таблица 4", "topic": "Земляные работы", "img": "assets/books/atlas/tab-05.png", "file": "tab-05.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-05", "num": "Атлас", "title": "Таблица 5", "topic": "Земляные работы", "img": "assets/books/atlas/tab-06.png", "file": "tab-06.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-06", "num": "Атлас", "title": "Таблица 6", "topic": "Земляные работы", "img": "assets/books/atlas/tab-07.png", "file": "tab-07.png", "text": "", "why": "", "rel": ["К-01", "Д-К01-01"]}, {"id": "atlas-07", "num": "Атлас", "title": "Таблица 7", "topic": "Фашинные работы", "img": "assets/books/atlas/tab-08.png", "file": function renderNav(activeId){
  const nav = $('#nav');
  nav.innerHTML = '';
  let seen = 0;
  NAV_GROUPS.forEach(g => {
    const head = document.createElement('h2');
    head.textContent = g.title;
    nav.appendChild(head);
    g.keys.forEach(key => {
      const sec0 = DATA.sections.find(x => x.key === key);
      if (!sec0) return;
      const docs = DATA.docs.filter(d => d.section === key);
      if (!docs.length) return;
      const hasActive = docs.some(d => d.id === activeId);
      const sec = document.createElement('div');
      sec.className = 'sec' + (hasActive || seen === 0 ? ' open' : '');
      sec.innerHTML = `
        <button class="sec-head" aria-expanded="${hasActive}">
          <span>${esc(sec0.title)}</span>
          <span class="cnt">${docs.length}</span>
        </button>
        <ul class="sec-docs">
          ${docs.map(d => `<li><a class="doc-link ${d.id===activeId?'active':''}" href="#/doc/${d.id}">${esc(d.title)}</a></li>`).join('')}
        </ul>`;
      sec.querySelector('.sec-head').addEventListener('click', () => {
        sec.classList.toggle('open');
        sec.querySelector('.sec-head').setAttribute('aria-expanded', sec.classList.contains('open'));
      });
      nav.appendChild(sec);
      seen++;
    });
  });
  const svc = $('#serviceNav');
  const figTotal = ((DATA.figures || {}).books || []).reduce((n, b) => n + (b.items || []).length, 0);
  const figLink = figTotal
    ? `<li><a class="doc-link ${location.hash.indexOf('#/figures') === 0 ? 'active' : ''}" href="#/figures">Иллюстрации<small>${figTotal}</small></a></li>`
    : '';
  svc.innerHTML = figLink + DATA.docs.filter(d => d.section === 'journal')
    .map(d => `<li><a class="doc-link ${d.id===activeId?'active':''}" href="#/doc/${d.id}">${esc(d.title)}</a></li>`).join('');
}

    : '';

let spy = false;
window.addEventListener('scroll', () => {
  if (!current || !current.toc.length) return;
  const heads = current.toc.map(([a]) => document.getElementById(a)).filter(Boolean);
  let active = heads[0];
  heads.forEach(h => { if (h.getBoundingClientRect().top < 140) active = h; });
  document.querySelectorAll('#toc a').forEach(a => a.classList.toggle('on', a.dataset.anchor === active.id));
}, {passive: true});

/* search */
function snippet(text, q){
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return '';
  const from = Math.max(0, i - 70), to = Math.min(text.length, i + 130);
  const raw = (from > 0 ? '…' : '') + text.slice(from, to) + (to < text.length ? '…' : '');
  return esc(raw).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
}

function search(q){
  q = q.trim().toLowerCase();
  if (q.length < 2) { if (current) openDoc(current.id); else dashboard(); return; }
  const hits = DATA.docs.map(d => {
    const inTitle = d.title.toLowerCase().includes(q);
    const n = (d.plain.toLowerCase().split(q).length - 1);
    return {d, n: n + (inTitle ? 5 : 0), inTitle};
  }).filter(h => h.n > 0).sort((a, b) => b.n - a.n).slice(0, 14);

  const figAll = [].concat.apply([], ((DATA.figures || {}).books || []).map(b => b.items || []));
  const figHits = figAll.filter(it => (it.title + ' ' + it.text + ' ' + it.topic).toLowerCase().includes(q));
  if (figHits.length) figState.q = q;
  const figBlock = figHits.length ? `<a class="hit" href="#/figures">
      <b>Иллюстрации: ${figHits.length}</b>
      <small>каталог рисунков · пояснения и связи</small>
      <p>${esc(figHits.slice(0, 3).map(i => i.title + ' (' + i.topic + ')').join(' · '))}</p>
    </a>` : '';

  setWide(true);
  $('#content').innerHTML = (hits.length || figHits.length) ? `
    <div class="crumbs"><a href="#/">Обзор</a><span>·</span><span>Поиск</span></div>
    <h1 style="font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 6px">«${esc(q)}»</h1>
    <div class="meta"><span>найдено документов: ${hits.length}</span><span>Esc — сбросить</span></div>
    <div class="results">${hits.map(h => `
      <a class="hit" href="#/doc/${h.d.id}?q=${encodeURIComponent(q)}">
        <b>${esc(h.d.title)}</b>
        <small>${esc(sectionTitle(h.d.section))} · ${esc(h.d.file)} · совпадений: ${h.n}</small>
        <p>${snippet(h.d.plain, q)}</p>
      </a>`).join('')}${figBlock}</div>`
    : `<div class="empty">По запросу «${esc(q)}» ничего не найдено. Попробуйте «коррозия», «перекрытие», «31937» или «ограниченно-работоспособное».</div>`;
}

/* тень шапки при прокрутке */
window.addEventListener('scroll', () => {
  document.body.classList.toggle('scrolled', window.scrollY > 8);
}, {passive: true});

/* память позиций: возвращаемся туда, откуда ушли */
const scrollMemo = {};
window.addEventListener('scroll', () => {
  if (location.hash) scrollMemo[location.hash] = window.scrollY;
}, {passive: true});
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if (a && location.hash) scrollMemo[location.hash] = window.scrollY;
}, true);

function restoreScroll(hash, hadAnchor){
  if (hadAnchor) return;
  const y = scrollMemo[hash];
  if (y) setTimeout(() => window.scrollTo(0, y), 0);
}

/* routing */
function route(){
  const h = location.hash || '#/';
  if (h.startsWith('#/figures')) {
    const mf = h.match(/^#\/figures\/([^?]+)/);
    figuresView(mf ? decodeURIComponent(mf[1]) : null);
    restoreScroll(h, !!mf); return;
  }
  if (h.startsWith('#/objects')) {
    if (DATA.public) { location.hash = '#/'; return; }
    objectsView(); return;
  }
  const m = h.match(/^#\/doc\/([^?!]+)(?:!([^?]+))?(?:\?q=([^&]+))?/);
  if (m) {
    openDoc(decodeURIComponent(m[1]), m[2] ? decodeURIComponent(m[2]) : null);
    restoreScroll(h, !!m[2]);
    if (m[3]) {
      const q = decodeURIComponent(m[3]).toLowerCase();
      const art = document.querySelector('.doc');
      if (art) {
        const walk = document.createTreeWalker(art, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walk.nextNode()) nodes.push(walk.currentNode);
        nodes.forEach(n => {
          if (n.parentNode.nodeName === 'CODE' || n.parentNode.nodeName === 'PRE') return;
          const t = n.nodeValue, i = t.toLowerCase().indexOf(q);
          if (i < 0) return;
          const r = document.createRange();
          r.setStart(n, i); r.setEnd(n, Math.min(t.length, i + q.length));
          const mark = document.createElement('mark');
          mark.style.background = '#f7dfa8';
          r.surroundContents(mark);
          mark.scrollIntoView({block: 'center'});
        });
      }
    }
    return;
  }
  dashboard();
  renderNav(null);
  restoreScroll(h, false);
  document.title = 'Expanding Horizons — База знаний';
}


/* ---------- иллюстрации с пояснениями ---------- */
const CODE_SRC = 'Д-[А-ЯЁ]{1,2}\\d{2}-\\d{2}|К-\\d{2}(?:\\.\\d+)?|Т-\\d{3}|О-\\d{2}|Ш-[А-ЯЁ]+';

function codeChip(code){
  const t = (DATA.codes || {})[code];
  if (!t) return '<span class="ref">' + esc(code) + '</span>';
  return '<a class="ref" href="#/doc/' + t.d + '!' + t.a + '">' + esc(code) + '</a>';
}

function linkify(root){
  if (!root || !DATA.codes) return;
  const re = new RegExp('(^|[^А-ЯЁа-яё0-9])(' + CODE_SRC + ')(?![0-9])', 'g');
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  while (walk.nextNode()) nodes.push(walk.currentNode);
  nodes.forEach(n => {
    const p = n.parentNode;
    if (!p || /^(A|CODE|PRE|SCRIPT|STYLE|H1|H2|H3|H4)$/.test(p.nodeName)) return;
    const t = n.nodeValue;
    re.lastIndex = 0;
    if (!re.test(t)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(t))) {
      const start = m.index + m[1].length;
      frag.appendChild(document.createTextNode(t.slice(last, start)));
      const a = document.createElement('a');
      a.className = 'ref';
      a.textContent = m[2];
      const target = DATA.codes[m[2]];
      if (target) a.href = '#/doc/' + target.d + '!' + target.a;
      frag.appendChild(a);
      last = start + m[2].length;
    }
    frag.appendChild(document.createTextNode(t.slice(last)));
    p.replaceChild(frag, n);
  });
}

const figState = {book: '', topic: '', q: ''};

function figuresView(openId){
  setWide(true);
  current = null;
  const books = ((DATA.figures || {}).books || []);
  if (!books.length) {
    $('#content').innerHTML = '<div class="empty">Каталог иллюстраций ещё не собран.</div>';
    $('#toc').innerHTML = '';
    return;
  }
  const flat = [];
  books.forEach(b => b.items.forEach(it => flat.push({it: it, b: b})));
  const picked = openId ? flat.find(x => x.it.id === openId) : null;
  if (picked) {
    const it = picked.it, b = picked.b;
    const ti = (b.topics || []).find(t => t.name === it.topic);
    const idx = flat.findIndex(x => x.it.id === it.id);
    $('#content').innerHTML = `
      <div class="crumbs"><a href="#/">Обзор</a><span>·</span><a href="#/figures">Иллюстрации</a><span>·</span><span>${esc(it.num)}</span></div>
      <div class="figdetail">
        <a class="figdetail-img" href="${esc(it.img)}" target="_blank" rel="noopener" title="Открыть оригинал">
          <img src="${esc(it.img)}" alt="${esc(it.title)}">
        </a>
        <div class="figdetail-side">
          <div class="figmeta"><span>${esc(it.num)}</span><span>·</span><span class="figtopic">${esc(it.topic)}</span><span>·</span><span>${esc(b.title)}</span></div>
          <h1>${esc(it.title)}</h1>
          ${it.text ? `<p class="figtext">${esc(it.text)}</p>` : ''}
          ${ti ? `<p class="figtext">${esc(ti.intro)}</p>` : ''}
          ${(it.why || (ti && ti.why)) ? `<p class="figwhy"><b>Зачем эксперту.</b> ${esc(it.why || ti.why)}</p>` : ''}
          <div class="figrefs"><span>См.:</span>${(it.rel || []).map(codeChip).join('')}</div>
          <p class="figlink"><a href="${esc(it.img)}" target="_blank" rel="noopener">Открыть оригинал в новом окне</a></p>
          <div class="prevnext">
            ${idx > 0 ? `<a class="btn" href="#/figures/${flat[idx - 1].it.id}">← ${esc(flat[idx - 1].it.title)}</a>` : ''}
            ${idx < flat.length - 1 ? `<a class="btn" href="#/figures/${flat[idx + 1].it.id}">${esc(flat[idx + 1].it.title)} →</a>` : ''}
          </div>
          <p class="figlink"><a href="#/figures">← Все иллюстрации</a></p>
        </div>
      </div>`;
    renderNav(null);
    linkify($('#content'));
    document.title = it.title + ' — Иллюстрации';
    window.scrollTo(0, 0);
    return;
  }
  const book = books.find(b => b.id === figState.book) || null;
  const pool = book ? book.items : [].concat.apply([], books.map(b => b.items));
  const topics = pool.map(i => i.topic).filter((t, i, a) => a.indexOf(t) === i);
  if (figState.topic && topics.indexOf(figState.topic) < 0) figState.topic = '';

  const total = books.reduce((n, b) => n + (b.items || []).length, 0);
  const bookChips = ['<button class="chip ' + (!figState.book ? 'on' : '') + '" data-book="">Все книги <span style="opacity:.6">' + total + '</span></button>']
    .concat(books.map(b => '<button class="chip ' + (figState.book === b.id ? 'on' : '') + '" data-book="' + b.id + '">' +
      esc(b.title.split(' к ')[0]) + ' <span style="opacity:.6">' + b.items.length + '</span></button>')).join('');
  const topicChips = ['<button class="chip ' + (!figState.topic ? 'on' : '') + '" data-topic="">Все темы</button>']
    .concat(topics.map(t => '<button class="chip ' + (figState.topic === t ? 'on' : '') + '" data-topic="' + esc(t) + '">' + esc(t) + '</button>')).join('');

  $('#content').innerHTML = `
    <div class="crumbs"><a href="#/">Обзор</a><span>·</span><span>Иллюстрации</span></div>
    <h1 style="font-family:var(--serif);font-weight:400;font-size:clamp(26px,3vw,36px);margin:0 0 6px">Иллюстрации с пояснениями</h1>
    <div class="meta"><span>рисунков: ${total}</span><span>книг: ${books.length}</span><span>связи ведут в разделы библиотеки</span></div>
    <p class="note">Каждый рисунок объяснён: что на нём изображено, зачем это нужно при обследовании и с какими разделами связано. Коды <code>К-…</code> и <code>Д-…</code> кликабельны — они открывают соответствующий пункт библиотеки.</p>
    <div class="filters">
      <input id="figQ" type="search" placeholder="Поиск по рисункам: топор, свод, свая, стропило…" value="${esc(figState.q)}" aria-label="Поиск по иллюстрациям">
    </div>
    <div class="chips">${bookChips}</div>
    <div class="chips">${topicChips}</div>
    <p class="figcount" id="figCount"></p>
    <div id="figBody"></div>`;

  const card = it => `
      <article class="figcard">
        <a class="figshot" href="#/figures/${it.id}" title="Открыть пояснение">
          <img loading="lazy" src="${esc(it.img)}" alt="${esc(it.title)}">
        </a>
        <div class="figbody">
          <div class="figmeta"><span>${esc(it.num)}</span><span>·</span><span class="figtopic">${esc(it.topic)}</span></div>
          <h3>${esc(it.title)}</h3>
          ${it.text ? `<p class="figtext">${esc(it.text)}</p>` : ''}
          ${it.why ? `<p class="figwhy"><b>Зачем эксперту.</b> ${esc(it.why)}</p>` : ''}
          <div class="figrefs">${(it.rel || []).map(codeChip).join('')}</div>
        </div>
      </article>`;

  const grid = list => '<div class="figgrid">' + list.map(card).join('') + '</div>';
  const band = b => `<div class="figband"><h2>${esc(b.title)}</h2><div class="bandsub">${esc(b.sub)}</div><p>${esc(b.intro)}</p></div>`;
  const topicBand = (tn, ti) => ti
    ? `<div class="figband sub"><h3>${esc(tn)}</h3><p>${esc(ti.intro)}</p><p class="figwhy"><b>Зачем эксперту.</b> ${esc(ti.why)}</p><div class="figrefs"><span>См.:</span>${(ti.rel || []).map(codeChip).join('')}</div></div>`
    : `<div class="figband sub"><h3>${esc(tn)}</h3></div>`;

  const draw = () => {
    const q = figState.q.trim().toLowerCase();
    const body = $('#figBody');
    if (figState.topic || q) {
      const list = pool.filter(it =>
        (!figState.topic || it.topic === figState.topic) &&
        (!q || (it.title + ' ' + it.text + ' ' + (it.why || '') + ' ' + it.topic).toLowerCase().includes(q)));
      const ti = book && figState.topic ? (book.topics || []).find(t => t.name === figState.topic) : null;
      body.innerHTML = (ti
        ? `<div class="topicpanel"><h3>${esc(ti.name)}</h3><p>${esc(ti.intro)}</p><p><b>Зачем эксперту.</b> ${esc(ti.why)}</p><div class="figrefs"><span>См.:</span>${(ti.rel || []).map(codeChip).join('')}</div></div>`
        : '') + grid(list);
      $('#figCount').textContent = list.length ? 'Найдено: ' + list.length : 'Ничего не найдено. Сбросьте фильтры или запрос.';
    } else {
      const chunks = [];
      (book ? [book] : books).forEach(b => {
        chunks.push(band(b));
        b.items.map(i => i.topic).filter((t, i, a) => a.indexOf(t) === i).forEach(tn => {
          chunks.push(topicBand(tn, (b.topics || []).find(t => t.name === tn)));
          chunks.push(grid(b.items.filter(i => i.topic === tn)));
        });
      });
      body.innerHTML = chunks.join('');
      $('#figCount').textContent = 'Показаны все ' + total + ' иллюстраций: объяснение — перед каждой подборкой';
    }
    linkify(body);
  };

  document.querySelectorAll('[data-book]').forEach(ch => ch.addEventListener('click', () => {
    figState.book = ch.dataset.book;
    figState.topic = '';
    figuresView();
  }));
  document.querySelectorAll('[data-topic]').forEach(ch => ch.addEventListener('click', () => {
    figState.topic = ch.dataset.topic;
    figuresView();
  }));
  $('#figQ').addEventListener('input', e => { figState.q = e.target.value; draw(); });

  draw();
  renderNav(null);
  document.title = 'Иллюстрации — Expanding Horizons';
  window.scrollTo(0, 0);
}

/* ---------- реестр объектов ---------- */
const objState = {client: '', type: '', q: ''};

function objectsView(){
  setWide(true);
  current = null;
  const rows = DATA.registry || [];
  const clients = [...new Set(rows.map(r => r.c))].sort((a, b) => a.localeCompare(b, 'ru'));
  const tmap = {};
  rows.forEach(r => String(r.t || '').split(', ').forEach(t => { if (t) tmap[t] = (tmap[t] || 0) + 1; }));
  const tlist = Object.entries(tmap).sort((a, b) => b[1] - a[1]);

  const opts = ['<option value="">Все заказчики</option>']
    .concat(clients.map(c => `<option value="${esc(c)}" ${objState.client === c ? 'selected' : ''}>${esc(c)}</option>`)).join('');
  const chips = ['<button class="chip ' + (objState.type === '' ? 'on' : '') + '" data-type="">Все типы</button>']
    .concat(tlist.map(([t, n]) => `<button class="chip ${objState.type === t ? 'on' : ''}" data-type="${esc(t)}">${esc(t)} <span style="opacity:.6">${n}</span></button>`)).join('');

  $('#content').innerHTML = `
    <div class="crumbs"><a href="#/">Обзор</a><span>·</span><span>Реестр объектов</span></div>
    <h1 style="font-family:var(--serif);font-weight:400;font-size:32px;margin:0 0 6px">Объекты архива</h1>
    <div class="meta"><span>всего: ${rows.length}</span><span>заказчиков: ${clients.length}</span><span>тип определён по названию папки и документов</span></div>
    <div class="filters">
      <select id="objClient" aria-label="Заказчик">${opts}</select>
      <input id="objQ" type="search" placeholder="Адрес или объект…" value="${esc(objState.q)}" aria-label="Поиск по адресу">
    </div>
    <div class="chips">${chips}</div>
    <p class="count" id="objCount"></p>
    <table class="objtable">
      <thead><tr><th>Заказчик</th><th>Объект</th><th>Тип работ</th><th>Док.</th><th>DOCX</th><th>PDF</th></tr></thead>
      <tbody id="objBody"></tbody>
    </table>`;

  const draw = () => {
    const q = objState.q.trim().toLowerCase();
    const list = rows.filter(r =>
      (!objState.client || r.c === objState.client) &&
      (!objState.type || String(r.t).split(', ').includes(objState.type)) &&
      (!q || (r.o + ' ' + r.c).toLowerCase().includes(q)));
    const shown = list.slice(0, 300);
    $('#objBody').innerHTML = shown.map(r => `<tr>
        <td>${esc(r.c)}</td>
        <td>${esc(r.o)}</td>
        <td class="types">${esc(r.t)}</td>
        <td class="num">${r.d}</td><td class="num">${r.x}</td><td class="num">${r.p}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="padding:18px;color:#6f6b61">Ничего не найдено. Сбросьте фильтры.</td></tr>';
    $('#objCount').textContent = list.length === rows.length
      ? `Показаны все ${rows.length} объектов`
      : `Показано ${shown.length} из ${list.length} найденных (всего ${rows.length})`;
  };

  $('#objClient').addEventListener('change', e => { objState.client = e.target.value; draw(); });
  $('#objQ').addEventListener('input', e => { objState.q = e.target.value; draw(); });
  document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
    objState.type = ch.dataset.type;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === ch));
    draw();
  }));
  draw();
  renderNav(null);
  document.title = 'Объекты архива — Expanding Horizons';
  window.scrollTo(0, 0);
}

/* настройки */
const SET_KEY = 'eh-settings';
const SET_DEF = {theme: 'light', font: 'm', width: 'std'};
let settings = Object.assign({}, SET_DEF);
try { settings = Object.assign(settings, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) {}

function applySettings(){
  const r = document.documentElement;
  r.dataset.theme = settings.theme;
  r.dataset.font = settings.font;
  r.dataset.width = settings.width;
  document.querySelectorAll('.seg').forEach(seg => {
    const k = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.val === settings[k]));
  });
}
function saveSettings(){ try { localStorage.setItem(SET_KEY, JSON.stringify(settings)); } catch (e) {} }

applySettings();
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  settings[b.closest('.seg').dataset.key] = b.dataset.val;
  applySettings(); saveSettings();
}));
const setBtn = document.getElementById('setBtn');
const setPanel = document.getElementById('setpanel');
if (setBtn && setPanel) {
  setBtn.addEventListener('click', e => {
    e.stopPropagation();
    const open = setPanel.classList.toggle('open');
    setPanel.setAttribute('aria-hidden', String(!open));
  });
  const setClose = document.getElementById('setClose');
  if (setClose) setClose.addEventListener('click', () => {
    setPanel.classList.remove('open'); setPanel.setAttribute('aria-hidden', 'true');
  });
  document.addEventListener('click', e => {
    if (!setPanel.classList.contains('open')) return;
    if (setPanel.contains(e.target)) return;
    setPanel.classList.remove('open'); setPanel.setAttribute('aria-hidden', 'true');
  });
}

/* ui */
if (DATA.public) { const ob = document.getElementById('objBtn'); if (ob) ob.style.display = 'none'; }
$('#backBtn').addEventListener('click', () => { if (history.length > 1) history.back(); });
$('#homeBtn').addEventListener('click', () => { location.hash = '#/'; });
$('#figBtn').addEventListener('click', () => { location.hash = '#/figures'; });
$('#objBtn').addEventListener('click', () => { location.hash = '#/objects'; });

  $('#burger').setAttribute('aria-expanded', open);
});
$('#scrim').addEventListener('click', () => { document.body.classList.remove('nav-open'); });

const q = $('#q');
let timer = null;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (q.value.trim().length >= 2) search(q.value); else if (!location.hash.startsWith('#/doc/')) route();
  }, 180);
});
q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; route(); q.blur(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; route(); }
});

/* ---------- заставка ---------- */
document.addEventListener('DOMContentLoaded', function(){
  const sp = document.getElementById('splash');
  if (!sp) return;
  if (!DATA.public) { sp.remove(); return; }
  const v = document.getElementById('introVideo');
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    sp.classList.add('hide');
    if (v) { try { v.pause(); } catch(e){} }
    setTimeout(() => sp.remove(), 400);
    try { sessionStorage.setItem('eh-intro', '1'); } catch(e){}
  };
  let seen = false;
  try { seen = sessionStorage.getItem('eh-intro') === '1'; } catch(e){}
  if (seen) { sp.remove(); return; }
  document.getElementById('splashGo').addEventListener('click', close);
  document.getElementById('splashSkip').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  if (v) {
    v.play().catch(() => {});
    v.addEventListener('ended', close);
  }
  setTimeout(close, 12000);
});

window.addEventListener('hashchange', route);
route();
