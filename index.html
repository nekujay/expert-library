кильсоновый): выступ-зоб, работающий на смятие и сдвиг.</p><p><strong>Зачем эксперту.</strong> Смятие зоба — характерный дефект исторических обвязок; видно как вмятина и закол.</p><p><strong>См.:</strong> К-05 · Д-К05-01</p><h3 id=\"s18\">Фиг. 60. Откосный в обвязках</h3><figure class=\"fig\"><img src=\"assets/books/figures/p045_01_f60.png\" alt=\"Фиг. 60. Откосный в обвязках\" loading=\"lazy\"><figcaption>Фиг. 60. Откосный в обвязках</figcaption></figure><p><strong>Что изображено.</strong> Применение откосного замка в нижних и верхних обвязках, мостовых брусьях, поручнях.</p><p><strong>Зачем эксперту.</strong> Обвязки — узлы, где начинается гниение из-за застоя воды; проверять опирание и зазоры.</p><p><strong>См.:</strong> К-05 · Д-К03-20</p><h3 id=\"s19\">Фиг. 64. Сдвижной замок с шипами</h3><figure class=\"fig\"><img src=\"assets/books/figures/p048_01_f64.png\" alt=\"Фиг. 64. Сдвижной замок с шипами\" loading=\"lazy\"><figcaption>Фиг. 64. Сдвижной замок с шипами</figcaption></figure><p><strong>Что изображено.</strong> Сдвижной замок с шипами для сращивания элементов по длине с фиксацией от сдвига.</p><p><strong>Зачем эксперту.</strong> Ослабление шипов — причина подвижности составных балок и обвязок.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s20\">Фиг. 67. Сквозной сковородник</h3><figure class=\"fig\"><img src=\"assets/books/figures/p050_01_f67.png\" alt=\"Фиг. 67. Сквозной сковородник\" loading=\"lazy\"><figcaption>Фиг. 67. Сквозной сковородник</figcaption></figure><p><strong>Что изображено.</strong> Сквозной сковородник: паз с уступом, работающий на растяжение и изгиб.</p><p><strong>Зачем эксперту.</strong> Применялся в стропилах и связях; трещины от уступа — признак перегрузки.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s21\">Фиг. 70. Замки для обвязок и стропил</h3><figure class=\"fig\"><img src=\"assets/books/figures/p053_01_f70.png\" alt=\"Фиг. 70. Замки для обвязок и стропил\" loading=\"lazy\"><figcaption>Фиг. 70. Замки для обвязок и стропил</figcaption></figure><p><strong>Что изображено.</strong> Замки для скрепления обвязных связей, мостовых брусьев и стропил.</p><p><strong>Зачем эксперту.</strong> Связка «балка — стропило» определяет передачу распора; её расстройство ведёт к деформациям крыши.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s22\">Фиг. 72. Сращивание шпунтом</h3><figure class=\"fig\"><img src=\"assets/books/figures/p055_01_f72.png\" alt=\"Фиг. 72. Сращивание шпунтом\" loading=\"lazy\"><figcaption>Фиг. 72. Сращивание шпунтом</figcaption></figure><p><strong>Что изображено.</strong> Сращивание торцов шпунтом: паз и гребень по торцу.</p><p><strong>Зачем эксперту.</strong> Плотное прилегание торцов критично: зазор = капилляр для влаги и начало гнили.</p><p><strong>См.:</strong> К-03 · Д-К03-20</p><h3 id=\"s23\">Фиг. 74. Торцевой замок с шипом</h3><figure class=\"fig\"><img src=\"assets/books/figures/p056_01_f74.png\" alt=\"Фиг. 74. Торцевой замок с шипом\" loading=\"lazy\"><figcaption>Фиг. 74. Торцевой замок с шипом</figcaption></figure><p><strong>Что изображено.</strong> Торцевое соединение с шипом для вертикальных брусьев и стоек.</p><p><strong>Зачем эксперту.</strong> Стойки с такими узлами часто встречаются в каркасных перегородках; проверять расклинивание шипа.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s24\">Фиг. 75. Крестообразный шип</h3><figure class=\"fig\"><img src=\"assets/books/figures/p057_01_f75.png\" alt=\"Фиг. 75. Крестообразный шип\" loading=\"lazy\"><figcaption>Фиг. 75. Крестообразный шип</figcaption></figure><p><strong>Что изображено.</strong> Торцевой замок с крестообразным шипом — повышенная стойкость к сдвигу и кручению.</p><p><strong>Зачем эксперту.</strong> Сложный шип труднее выполнить; дефекты изготовления видны как неплотности и сколы.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s25\">Фиг. 78. Угловой в накладку</h3><figure class=\"fig\"><img src=\"assets/books/figures/p059_01_f78.png\" alt=\"Фиг. 78. Угловой в накладку\" loading=\"lazy\"><figcaption>Фиг. 78. Угловой в накладку</figcaption></figure><p><strong>Что изображено.</strong> Угловое соединение в накладку концами или серединой — простейший угловой замок.</p><p><strong>Зачем эксперту.</strong> Применялся в тонких досках; в несущих узлах требует крепежа. Отсутствие крепежа — дефект.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s26\">Фиг. 82. Простой сковородник</h3><figure class=\"fig\"><img src=\"assets/books/figures/p062_01_f82.png\" alt=\"Фиг. 82. Простой сковородник\" loading=\"lazy\"><figcaption>Фиг. 82. Простой сковородник</figcaption></figure><p><strong>Что изображено.</strong> Угловой замок «простой сковородник»: трапециевидный шип и паз.</p><p><strong>Зачем эксперту.</strong> Работает на растяжение; при усушке появляется люфт — типичная причина скрипа и подвижности.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s27\">Фиг. 90. Угол с присевом</h3><figure class=\"fig\"><img src=\"assets/books/figures/p070_01_f90.png\" alt=\"Фиг. 90. Угол с присевом\" loading=\"lazy\"><figcaption>Фиг. 90. Угол с присевом</figcaption></figure><p><strong>Что изображено.</strong> Рубка угла с присевом — врубка с упорной площадкой; применялась в деревянных стенах.</p><p><strong>Зачем эксперту.</strong> Углы деревянных стен — зоны увлажнения; присев гниёт первым, поэтому угол вскрывают при обследовании.</p><p><strong>См.:</strong> К-02 · Д-К02-04</p><h3 id=\"s28\">Фиг. 95. Проушинный в награду</h3><figure class=\"fig\"><img src=\"assets/books/figures/p074_01_f95.png\" alt=\"Фиг. 95. Проушинный в награду\" loading=\"lazy\"><figcaption>Фиг. 95. Проушинный в награду</figcaption></figure><p><strong>Что изображено.</strong> Проушинный замок «в награду»: проушина и шип с посадкой.</p><p><strong>Зачем эксперту.</strong> Применялся в рамах и стойках; расстройство проушины даёт перекос створок и рам.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s29\">Фиг. 114. Замок с несколькими шипами</h3><figure class=\"fig\"><img src=\"assets/books/figures/p092_01_f114.png\" alt=\"Фиг. 114. Замок с несколькими шипами\" loading=\"lazy\"><figcaption>Фиг. 114. Замок с несколькими шипами</figcaption></figure><p><strong>Что изображено.</strong> Замок с несколькими шипами для вязки под углом не на конце элемента.</p><p><strong>Зачем эксперту.</strong> Многозубые соединения чувствительны к точности; зазоры между шипами — признак расстройства.</p><p><strong>См.:</strong> К-05</p><h2 id=\"s30\">Сплотка</h2><h3 id=\"s31\">Фиг. 121. Сплотка в шпунт</h3><figure class=\"fig\"><img src=\"assets/books/figures/p100_01_f121.png\" alt=\"Фиг. 121. Сплотка в шпунт\" loading=\"lazy\"><figcaption>Фиг. 121. Сплотка в шпунт</figcaption></figure><p><strong>Что изображено.</strong> Сплотка досок в шпунт: гребень одной доски входит в паз другой.</p><p><strong>Зачем эксперту.</strong> Так выполнялись щиты и подшивка; при усушке шпунт раскрывается, появляются щели и продувание.</p><p><strong>См.:</strong> К-03 · Д-К03-22</p><h3 id=\"s32\">Фиг. 122. Сплотка на шипах</h3><figure class=\"fig\"><img src=\"assets/books/figures/p101_01_f122.png\" alt=\"Фиг. 122. Сплотка на шипах\" loading=\"lazy\"><figcaption>Фиг. 122. Сплотка на шипах</figcaption></figure><p><strong>Что изображено.</strong> Сплотка досок с простыми шипами; кромки скашивают, чтобы не зацеплялись.</p><p><strong>Зачем эксперту.</strong> Шиповое соединение дощатых щитов и балок; выпадение шипа — признак потери совместной работы.</p><p><strong>См.:</strong> К-03</p><h3 id=\"s33\">Фиг. 125. Сплотка щитов</h3><figure class=\"fig\"><img src=\"assets/books/figures/p103_01_f125.png\" alt=\"Фиг. 125. Сплотка щитов\" loading=\"lazy\"><figcaption>Фиг. 125. Сплотка щитов</figcaption></figure><p><strong>Что изображено.</strong> Сплотка щитов для переборок и подшивки потолков, в том числе в судовых каютах.</p><p><strong>Зачем эксперту.</strong> Щиты перегородок и подшивок часто поражены гнилью с обратной стороны — нужен осмотр сверху и снизу.</p><p><strong>См.:</strong> К-08 · Д-К08-02</p><h2 id=\"s34\">Дома и стены</h2><h3 id=\"s35\">Фиг. 127. Обшивка дома</h3><figure class=\"fig\"><img src=\"assets/books/figures/p106_01_f127.png\" alt=\"Фиг. 127. Обшивка дома\" loading=\"lazy\"><figcaption>Фиг. 127. Обшивка дома</figcaption></figure><p><strong>Что изображено.</strong> Обшивка деревянного дома дюймовыми досками по стойкам из расколотых 2½-дюймовых досок; стойки у углов, у окон и в середине простенков.</p><p><strong>Зачем эксперту.</strong> Отсутствие вентиляционного зазора под обшивкой — главная причина гнили обшивки и венцов. Признак — вспучивание и тёмные пятна.</p><p><strong>См.:</strong> К-07 · Д-К07-01</p><h3 id=\"s36\">Фиг. 130. Обшивка сарая</h3><figure class=\"fig\"><img src=\"assets/books/figures/p109_01_f130.png\" alt=\"Фиг. 130. Обшивка сарая\" loading=\"lazy\"><figcaption>Фиг. 130. Обшивка сарая</figcaption></figure><p><strong>Что изображено.</strong> Обшивка сарая досками и устройство проёмов в деревянных стенах.</p><p><strong>Зачем эксперту.</strong> Хозяйственные постройки часто служат индикатором состояния кровли и водоотвода на участке.</p><p><strong>См.:</strong> К-07</p><h3 id=\"s37\">Фиг. 138. Закладные рамы и раскосины</h3><figure class=\"fig\"><img src=\"assets/books/figures/p118_01_f138.png\" alt=\"Фиг. 138. Закладные рамы и раскосины\" loading=\"lazy\"><figcaption>Фиг. 138. Закладные рамы и раскосины</figcaption></figure><p><strong>Что изображено.</strong> Закладные рамы в стенах и раскосины, обеспечивающие жёсткость и связь.</p><p><strong>Зачем эксперту.</strong> Раскосины — элементы жёсткости; их утрата при перепланировках ведёт к перекосам и трещинам.</p><p><strong>См.:</strong> К-05 · Д-К05-05</p><h3 id=\"s38\">Фиг. 169. Забор «край на край»</h3><figure class=\"fig\"><img src=\"assets/books/figures/p150_01_f169.png\" alt=\"Фиг. 169. Забор «край на край»\" loading=\"lazy\"><figcaption>Фиг. 169. Забор «край на край»</figcaption></figure><p><strong>Что изображено.</strong> Временный забор «край на край» — обшивка досками впритык по столбам.</p><p><strong>Зачем эксперту.</strong> По типу ограждений и обшивки датируют переделки; гниль столбов у земли — типовой дефект.</p><p><strong>См.:</strong> К-08 · Д-К03-20</p><h2 id=\"s39\">Балки</h2><h3 id=\"s40\">Фиг. 141. Заделка балки в стену</h3><figure class=\"fig\"><img src=\"assets/books/figures/p121_01_f141.png\" alt=\"Фиг. 141. Заделка балки в стену\" loading=\"lazy\"><figcaption>Фиг. 141. Заделка балки в стену</figcaption></figure><p><strong>Что изображено.</strong> Балка в каменной стене: конец осмолён, обложен войлоком, заложен не более 6 вершков (≈27 см, «на один кирпич»), скреплён скобой со штырём.</p><p><strong>Зачем эксперту.</strong> Торец в кладке и скоба — зоны увлажнения и коррозии. Это ключевой узел для оценки «разрушения заделки» и прогибов.</p><p><strong>См.:</strong> К-03 · Д-К03-04 · О-02</p><h3 id=\"s41\">Фиг. 144. Составная балка</h3><figure class=\"fig\"><img src=\"assets/books/figures/p124_01_f144.png\" alt=\"Фиг. 144. Составная балка\" loading=\"lazy\"><figcaption>Фиг. 144. Составная балка</figcaption></figure><p><strong>Что изображено.</strong> Балка из двух рядов брусьев с зубьями по длине и расклиниванием.</p><p><strong>Зачем эксперту.</strong> Расстройство зубьев и выпадение клиньев — причина снижения несущей способности. Проверять соединение, а не только сечение.</p><p><strong>См.:</strong> К-03 · Д-К03-22</p><h3 id=\"s42\">Фиг. 145. Досчатая балка</h3><figure class=\"fig\"><img src=\"assets/books/figures/p125_01_f145.png\" alt=\"Фиг. 145. Досчатая балка\" loading=\"lazy\"><figcaption>Фиг. 145. Досчатая балка</figcaption></figure><p><strong>Что изображено.</strong> Балка из трёх досок на ребро; в книге прямо сказано: в досках видно состояние древесины, а середина бревна может быть гнилой.</p><p><strong>Зачем эксперту.</strong> При обследовании проверять расслоение досок и состояние скрытых слоёв; внешне целая балка может быть сгнившей внутри.</p><p><strong>См.:</strong> К-03 · Д-К03-20</p><h3 id=\"s43\">Фиг. 147. Надделки сверху</h3><figure class=\"fig\"><img src=\"assets/books/figures/p127_01_f147.png\" alt=\"Фиг. 147. Надделки сверху\" loading=\"lazy\"><figcaption>Фиг. 147. Надделки сверху</figcaption></figure><p><strong>Что изображено.</strong> Усиление балки надделками сверху: балка выправляется по шаблону, сверху крепится усиливающий элемент.</p><p><strong>Зачем эксперту.</strong> Исторические усиления — часть конструкции. Оценивать их достаточность и совместную работу (примечание к п. 5.1.11 ГОСТ).</p><p><strong>См.:</strong> К-03 · О-05</p><h3 id=\"s44\">Фиг. 150. Боковые накладки</h3><figure class=\"fig\"><img src=\"assets/books/figures/p130_01_f150.png\" alt=\"Фиг. 150. Боковые накладки\" loading=\"lazy\"><figcaption>Фиг. 150. Боковые накладки</figcaption></figure><p><strong>Что изображено.</strong> Усиление балки накладками с боков заподлицо с нижней гранью.</p><p><strong>Зачем эксперту.</strong> Смотреть на плотность прилегания и крепёж: зазоры и коррозия крепежа сводят усиление к нулю.</p><p><strong>См.:</strong> К-03 · Д-К03-02</p><h2 id=\"s45\">Крыши</h2><h3 id=\"s46\">Фиг. 171. Шаг стропил</h3><figure class=\"fig\"><img src=\"assets/books/figures/p152_01_f171.png\" alt=\"Фиг. 171. Шаг стропил\" loading=\"lazy\"><figcaption>Фиг. 171. Шаг стропил</figcaption></figure><p><strong>Что изображено.</strong> Расстановка стропил по ширине здания и назначение шага.</p><p><strong>Зачем эксперту.</strong> Шаг стропил — база для проверки нагрузок и обрешётки; его изменение при ремонте меняет работу крыши.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s47\">Фиг. 172. Опирание стропильных ног</h3><figure class=\"fig\"><img src=\"assets/books/figures/p153_01_f172.png\" alt=\"Фиг. 172. Опирание стропильных ног\" loading=\"lazy\"><figcaption>Фиг. 172. Опирание стропильных ног</figcaption></figure><p><strong>Что изображено.</strong> Опирание стропильных ног на короткий брус; варианты узла.</p><p><strong>Зачем эксперту.</strong> Узел опирания — место скалывания и гниения; при осмотре фиксировать зазоры и смятие.</p><p><strong>См.:</strong> К-06 · Д-К06-02</p><h3 id=\"s48\">Фиг. 174. Стропила в каменных домах</h3><figure class=\"fig\"><img src=\"assets/books/figures/p155_01_f174.png\" alt=\"Фиг. 174. Стропила в каменных домах\" loading=\"lazy\"><figcaption>Фиг. 174. Стропила в каменных домах</figcaption></figure><p><strong>Что изображено.</strong> Устройство стропил в каменных строениях: связь, подобная балке, и опирание на кладку.</p><p><strong>Зачем эксперту.</strong> В каменных домах узел опирания контактирует с кладкой — риск конденсата и гнили концов.</p><p><strong>См.:</strong> К-06 · Д-К06-02</p><h3 id=\"s49\">Фиг. 175. Мауэрлат и прогоны</h3><figure class=\"fig\"><img src=\"assets/books/figures/p156_01_f175.png\" alt=\"Фиг. 175. Мауэрлат и прогоны\" loading=\"lazy\"><figcaption>Фиг. 175. Мауэрлат и прогоны</figcaption></figure><p><strong>Что изображено.</strong> Два прогона (мауэрлата) под стропила; распределение нагрузки на стены.</p><p><strong>Зачем эксперту.</strong> Проверять анкеровку мауэрлата и состояние подкладок: ослабление ведёт к сдвигу крыши.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s50\">Фиг. 176. Обрешётка под железо</h3><figure class=\"fig\"><img src=\"assets/books/figures/p157_01_f176.png\" alt=\"Фиг. 176. Обрешётка под железо\" loading=\"lazy\"><figcaption>Фиг. 176. Обрешётка под железо</figcaption></figure><p><strong>Что изображено.</strong> Обрешётка под железную крышу досками 2½ дюйма (≈6,4 см) и шаг обрешётки.</p><p><strong>Зачем эксперту.</strong> Историческая железная кровля по деревянной обрешётке: конденсат снизу — главная причина коррозии листов и гнили досок.</p><p><strong>См.:</strong> К-06 · Д-К06-01</p><h3 id=\"s51\">Фиг. 177. Конёк</h3><figure class=\"fig\"><img src=\"assets/books/figures/p158_01_f177.png\" alt=\"Фиг. 177. Конёк\" loading=\"lazy\"><figcaption>Фиг. 177. Конёк</figcaption></figure><p><strong>Что изображено.</strong> Конёк крыши и обрешётка под деревянную кровлю.</p><p><strong>Зачем эксперту.</strong> Протечки по коньку — типовая жалоба; проверять примыкания и вентиляцию подкровельного пространства.</p><p><strong>См.:</strong> К-06 · Д-К06-01</p><h3 id=\"s52\">Фиг. 179. Обход трубы</h3><figure class=\"fig\"><img src=\"assets/books/figures/p160_01_f179.png\" alt=\"Фиг. 179. Обход трубы\" loading=\"lazy\"><figcaption>Фиг. 179. Обход трубы</figcaption></figure><p><strong>Что изображено.</strong> Обход крыши вокруг трубы: желоба из полулистов выше трубы, разделка.</p><p><strong>Зачем эксперту.</strong> Именно здесь чаще всего протечки и замачивание чердачного перекрытия; проверять металл и зазоры.</p><p><strong>См.:</strong> К-06 · Д-К06-01 · Д-К03-24</p><h3 id=\"s53\">Фиг. 182. Легель</h3><figure class=\"fig\"><img src=\"assets/books/figures/p163_01_f182.png\" alt=\"Фиг. 182. Легель\" loading=\"lazy\"><figcaption>Фиг. 182. Легель</figcaption></figure><p><strong>Что изображено.</strong> Стропила с легелем — горизонтальным брусом посередине, соединённым со стропильными ногами замком в сковородник; чем положе крыша, тем нужнее легель.</p><p><strong>Зачем эксперту.</strong> Легель воспринимает распор. Его отсутствие или расстройство объясняет деформации скатов и трещины в узлах.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s54\">Фиг. 188. Опора на капитальную стену</h3><figure class=\"fig\"><img src=\"assets/books/figures/p169_01_f188.png\" alt=\"Фиг. 188. Опора на капитальную стену\" loading=\"lazy\"><figcaption>Фиг. 188. Опора на капитальную стену</figcaption></figure><p><strong>Что изображено.</strong> Стропила с опорой на среднюю капитальную стену — уменьшение пролёта и распора.</p><p><strong>Зачем эксперту.</strong> При утрате внутренней стены или её проёмах стропила получают дополнительный пролёт — причина прогибов.</p><p><strong>См.:</strong> К-06 · Д-К06-03</p><h3 id=\"s55\">Фиг. 200. Световой фонарь</h3><figure class=\"fig\"><img src=\"assets/books/figures/p183_01_f200.png\" alt=\"Фиг. 200. Световой фонарь\" loading=\"lazy\"><figcaption>Фиг. 200. Световой фонарь</figcaption></figure><p><strong>Что изображено.</strong> Фонарь на крыше: вертикальные схватки, остекление, узел примыкания.</p><p><strong>Зачем эксперту.</strong> Фонари и зенитные окна — места протечек и конденсата; проверять примыкания и несущие стойки.</p><p><strong>См.:</strong> К-06 · Д-К06-01</p><h2 id=\"s56\">Лестницы</h2><h3 id=\"s57\">Фиг. 202. Тетива лестницы</h3><figure class=\"fig\"><img src=\"assets/books/figures/p185_01_f202.png\" alt=\"Фиг. 202. Тетива лестницы\" loading=\"lazy\"><figcaption>Фиг. 202. Тетива лестницы</figcaption></figure><p><strong>Что изображено.</strong> Крепление тетивы и врубка ступеней: разметка, шпунты, посадка ступени.</p><p><strong>Зачем эксперту.</strong> Исторические параметры: подъём ≈4 вершка (18 см), проступь ≥6 вершков (27 см). Отклонения — след переделок.</p><p><strong>См.:</strong> К-04 · Д-К04-12</p><h2 id=\"s58\">Мосты</h2><h3 id=\"s59\">Фиг. 203. Мост на фермах</h3><figure class=\"fig\"><img src=\"assets/books/figures/p187_01_f203.png\" alt=\"Фиг. 203. Мост на фермах\" loading=\"lazy\"><figcaption>Фиг. 203. Мост на фермах</figcaption></figure><p><strong>Что изображено.</strong> Деревянный мост кружальной системы (первый в России, 1813 г.): 7 арок, 8 ферм, свайные опоры в 5 рядов.</p><p><strong>Зачем эксперту.</strong> Термины «кружала» и ферменные схемы нужны при описании исторических большепролётных конструкций.</p><p><strong>См.:</strong> К-05</p>", "toc": [["s1", "Инструменты", 2], ["s2", "Фиг. 1. Топор", 3], ["s3", "Фиг. 2. Перерубание бревна", 3], ["s4", "Фиг. 4. Раскалывание бревна", 3], ["s5", "Фиг. 5. Выборка шпунта", 3], ["s6", "Фиг. 8—9. Долота", 3], ["s7", "Фиг. 10. Медведка", 3], ["s8", "Фиг. 36. Разметка косых срезов", 3], ["s9", "Фиг. 41—42. Отволока", 3], ["s10", "Фиг. 50. Таскальные крючья", 3], ["s11", "Машины", 2], ["s12", "Фиг. 55. Копёр", 3], ["s13", "Фиг. 56. Баба", 3], ["s14", "Соединения", 2], ["s15", "Фиг. 57. Замок откосный простой", 3], ["s16", "Фиг. 58. Откосный с прирубом", 3], ["s17", "Фиг. 59. Откосный зобом", 3], ["s18", "Фиг. 60. Откосный в обвязках", 3], ["s19", "Фиг. 64. Сдвижной замок с шипами", 3], ["s20", "Фиг. 67. Сквозной сковородник", 3], ["s21", "Фиг. 70. Замки для обвязок и стропил", 3], ["s22", "Фиг. 72. Сращивание шпунтом", 3], ["s23", "Фиг. 74. Торцевой замок с шипом", 3], ["s24", "Фиг. 75. Крестообразный шип", 3], ["s25", "Фиг. 78. Угловой в накладку", 3], ["s26", "Фиг. 82. Простой сковородник", 3], ["s27", "Фиг. 90. Угол с присевом", 3], ["s28", "Фиг. 95. Проушинный в награду", 3], ["s29", "Фиг. 114. Замок с несколькими шипами", 3], ["s30", "Сплотка", 2], ["s31", "Фиг. 121. Сплотка в шпунт", 3], ["s32", "Фиг. 122. Сплотка на шипах", 3], ["s33", "Фиг. 125. Сплотка щитов", 3], ["s34", "Дома и стены", 2], ["s35", "Фиг. 127. Обшивка дома", 3], ["s36", "Фиг. 130. Обшивка сарая", 3], ["s37", "Фиг. 138. Закладные рамы и раскосины", 3], ["s38", "Фиг. 169. Забор «край на край»", 3], ["s39", "Балки", 2], ["s40", "Фиг. 141. Заделка балки в стену", 3], ["s41", "Фиг. 144. Составная балка", 3], ["s42", "Фиг. 145. Досчатая балка", 3], ["s43", "Фиг. 147. Надделки сверху", 3], ["s44", "Фиг. 150. Боковые накладки", 3], ["s45", "Крыши", 2], ["s46", "Фиг. 171. Шаг стропил", 3], ["s47", "Фиг. 172. Опирание стропильных ног", 3], ["s48", "Фиг. 174. Стропила в каменных домах", 3], ["s49", "Фиг. 175. Мауэрлат и прогоны", 3], ["s50", "Фиг. 176. Обрешётка под железо", 3], ["s51", "Фиг. 177. Конёк", 3], ["s52", "Фиг. 179. Обход трубы", 3], ["s53", "Фиг. 182. Легель", 3], ["s54", "Фиг. 188. Опора на капитальную стену", 3], ["s55", "Фиг. 200. Световой фонарь", 3], ["s56", "Лестницы", 2], ["s57", "Фиг. 202. Тетива лестницы", 3], ["s58", "Мосты", 2], ["s59", "Фиг. 203. Мост на фермах", 3]], "chars": 17216, "plain": " РИСУНКИ КНИГИ «ПЛОТНИЧНОЕ ИСКУССТВО» Дементьев, «Плотничное искусство», 4 е изд., СПб., 1902. Здесь — 50 показательных рисунков: инструменты, врубки, балки, стропила, лестницы, мосты. Каждый рисунок сопровождается пояснением: что изображено и как это применять при обследовании. Инструменты Фиг. 1. Топор ![Фиг. 1. Топор](figures/p005 01 f1.png) Что изображено. Топор: устройство (обух, носок, лезвие) и приёмы работы. Им перерубают брёвна, отесывают стороны, выбирают четверти и шпунты, забивают гвозди и клинья. Зачем эксперту. Следы топорной обработки на брусьях и балках — признак ручной рубки. По ним отличают историческую конструкцию от поздней заводской и датируют переделку. См.: К 03 · Д К03 04 Фиг. 2. Перерубание бревна ![Фиг. 2. Перерубание бревна](figures/p006 01 f2.png) Что изображено. Последовательность зарубки: прямой и косой прорубы с двух сторон, скалывание щепы между ними. Так получали ровный торец без пилы. Зачем эксперту. Неровный, «ступенчатый» торец балки в стене — типичный результат такой рубки; он хуже сопротивляется увлажнению и гниению, чем пиленый. См.: К 03 · Д К03 20 Фиг. 4. Раскалывание бревна ![Фиг. 4. Раскалывание бревна](figures/p007 01 f4.png) Что изображено. Раскалывание бревна клиньями вдоль волокон: удары по линии слоя, поочерёдное забивание клиньев. Зачем эксперту. Расколотые «пластины» и половинки часто встречаются в старых перекрытиях и обрешётках. Трещины от раскалывания — путь для влаги и гнили. См.: К 03 · Д К03 20 Фиг. 5. Выборка шпунта ![Фиг. 5. Выборка шпунта](figures/p008 01 f5.png) Что изображено. Выборка прямого шпунта (паза) в брусе топором и долотом: разметка, прорубка, зачистка. Зачем эксперту. Качество шпунта определяет плотность соединения. Разработанный, «разбитый» шпунт — признак расстройства узла и потери совместной работы. См.: К 03 · Д К03 22 Фиг. 8—9. Долота ![Фиг. 8—9. Долота](figures/p010 02 f8.png) Что изображено. Плоское и полукруглое долота для выборки гнёзд и очистки боковых стенок. Зачем эксперту. Гнёзда под шипы и врубки — концентраторы напряжений и влаги. Выкрошенные края гнезда указывают на перегрузку или гниение. См.: К 03 · Д К03 22 Фиг. 10. Медведка ![Фиг. 10. Медведка](figures/p010 01 f10.png) Что изображено. Медведка — тяжёлый струг для грубой обтёски брёвен; работа двумя руками. Зачем эксперту. Следы медведки (плоские «каннелюры») на бревнах — признак ручной обтёски XIX — начала XX в. См.: К 02 Фиг. 36. Разметка косых срезов ![Фиг. 36. Разметка косых срезов](figures/p026 01 f36.png) Что изображено. Разметка косых срезов и «изворотистых» поверхностей; плотничный циркуль и приёмы причерчивания. Зачем эксперту. По разметке видно, насколько точно выполнены сопряжения. Зазоры и перекосы в узлах объясняются ошибками разметки, а не только эксплуатацией. См.: К 05 Фиг. 41—42. Отволока ![Фиг. 41—42. Отволока](figures/p029 01 f41.png) Что изображено. Отволока и черта — инструменты для причерчивания одной доски к другой и переноса линии. Зачем эксперту. Позволяют отличить заводскую геометрию от ручной подгонки: ручная подгонка даёт «мягкие» неровные кромки. См.: К 03 Фиг. 50. Таскальные крючья ![Фиг. 50. Таскальные крючья](figures/p035 01 f50.png) Что изображено. Крючья для перемещения и подъёма брёвен; техника безопасности при работе с тяжёлым лесом. Зачем эксперту. Кованые крючья и скобы встречаются в конструкциях как крепёж; их коррозия — типовая причина ослабления узла. См.: К 05 · Д К05 01 Машины Фиг. 55. Копёр ![Фиг. 55. Копёр](figures/p039 01 f55.png) Что изображено. Копёр для забивки свай: стойки, ворот, оттяжки, направляющие. Зачем эксперту. Свайные основания исторических зданий устраивались такими копрами. Обнаружение свай требует шурфов и сейсмоакустики (п. 5.2.19 ГОСТ). См.: К 01 · Д К01 04 Фиг. 56. Баба ![Фиг. 56. Баба](figures/p041 01 f56.png) Что изображено. Баба — чугунный молот копра; подъём и сброс по направляющим. Зачем эксперту. Следы забивки (смятие головы сваи) видны при вскрытии и помогают оценить её состояние. См.: К 01 Соединения Фиг. 57. Замок откосный простой ![Фиг. 57. Замок откосный простой](figures/p042 01 f57.png) Что изображено. Соединение двух брусьев под углом со скошенными концами — простейший откосный замок. Зачем эксперту. Расстройство такого узла даёт перекос рамы или обвязки; на фото фиксируется зазор по скосу. См.: К 05 · Д К05 04 Фиг. 58. Откосный с прирубом ![Фиг. 58. Откосный с прирубом](figures/p043 01 f58.png) Что изображено. Откосный замок с прирубом: дополнительная площадка для упора, воспринимает сдвиг. Зачем эксперту. При потере прируба узел работает как простой — появляется подвижность и перекос. См.: К 05 Фиг. 59. Откосный зобом ![Фиг. 59. Откосный зобом](figures/p044 01 f59.png) Что изображено. Замок «зобом» (кильсоновый): выступ зоб, работающий на смятие и сдвиг. Зачем эксперту. Смятие зоба — характерный дефект исторических обвязок; видно как вмятина и закол. См.: К 05 · Д К05 01 Фиг. 60. Откосный в обвязках ![Фиг. 60. Откосный в обвязках](figures/p045 01 f60.png) Что изображено. Применение откосного замка в нижних и верхних обвязках, мостовых брусьях, поручнях. Зачем эксперту. Обвязки — узлы, где начинается гниение из за застоя воды; проверять опирание и зазоры. См.: К 05 · Д К03 20 Фиг. 64. Сдвижной замок с шипами ![Фиг. 64. Сдвижной замок с шипами](figures/p048 01 f64.png) Что изображено. Сдвижной замок с шипами для сращивания элементов по длине с фиксацией от сдвига. Зачем эксперту. Ослабление шипов — причина подвижности составных балок и обвязок. См.: К 05 Фиг. 67. Сквозной сковородник ![Фиг. 67. Сквозной сковородник](figures/p050 01 f67.png) Что изображено. Сквозной сковородник: паз с уступом, работающий на растяжение и изгиб. Зачем эксперту. Применялся в стропилах и связях; трещины от уступа — признак перегрузки. См.: К 06 · Д К06 03 Фиг. 70. Замки для обвязок и стропил ![Фиг. 70. Замки для обвязок и стропил](figures/p053 01 f70.png) Что изображено. Замки для скрепления обвязных связей, мостовых брусьев и стропил. Зачем эксперту. Связка «балка — стропило» определяет передачу распора; её расстройство ведёт к деформациям крыши. См.: К 06 · Д К06 03 Фиг. 72. Сращивание шпунтом ![Фиг. 72. Сращивание шпунтом](figures/p055 01 f72.png) Что изображено. Сращивание торцов шпунтом: паз и гребень по торцу. Зачем эксперту. Плотное прилегание торцов критично: зазор = капилляр для влаги и начало гнили. См.: К 03 · Д К03 20 Фиг. 74. Торцевой замок с шипом ![Фиг. 74. Торцевой замок с шипом](figures/p056 01 f74.png) Что изображено. Торцевое соединение с шипом для вертикальных брусьев и стоек. Зачем эксперту. Стойки с такими узлами часто встречаются в каркасных перегородках; проверять расклинивание шипа. См.: К 05 Фиг. 75. Крестообразный шип ![Фиг. 75. Крестообразный шип](figures/p057 01 f75.png) Что изображено. Торцевой замок с крестообразным шипом — повышенная стойкость к сдвигу и кручению. Зачем эксперту. Сложный шип труднее выполнить; дефекты изготовления видны как неплотности и сколы. См.: К 05 Фиг. 78. Угловой в накладку ![Фиг. 78. Угловой в накладку](figures/p059 01 f78.png) Что изображено. Угловое соединение в накладку концами или серединой — простейший угловой замок. Зачем эксперту. Применялся в тонких досках; в несущих узлах требует крепежа. Отсутствие крепежа — дефект. См.: К 05 Фиг. 82. Простой сковородник ![Фиг. 82. Простой сковородник](figures/p062 01 f82.png) Что изображено. Угловой замок «простой сковородник»: трапециевидный шип и паз. Зачем эксперту. Работает на растяжение; при усушке появляется люфт — типичная причина скрипа и подвижности. См.: К 05 Фиг. 90. Угол с присевом ![Фиг. 90. Угол с присевом](figures/p070 01 f90.png) Что изображено. Рубка угла с присевом — врубка с упорной площадкой; применялась в деревянных стенах. Зачем эксперту. Углы деревянных стен — зоны увлажнения; присев гниёт первым, поэтому угол вскрывают при обследовании. См.: К 02 · Д К02 04 Фиг. 95. Проушинный в награду ![Фиг. 95. Проушинный в награду](figures/p074 01 f95.png) Что изображено. Проушинный замок «в награду»: проушина и шип с посадкой. Зачем эксперту. Применялся в рамах и стойках; расстройство проушины даёт перекос створок и рам. См.: К 05 Фиг. 114. Замок с несколькими шипами ![Фиг. 114. Замок с несколькими шипами](figures/p092 01 f114.png) Что изображено. Замок с несколькими шипами для вязки под углом не на конце элемента. Зачем эксперту. Многозубые соединения чувствительны к точности; зазоры между шипами — признак расстройства. См.: К 05 Сплотка Фиг. 121. Сплотка в шпунт ![Фиг. 121. Сплотка в шпунт](figures/p100 01 f121.png) Что изображено. Сплотка досок в шпунт: гребень одной доски входит в паз другой. Зачем эксперту. Так выполнялись щиты и подшивка; при усушке шпунт раскрывается, появляются щели и продувание. См.: К 03 · Д К03 22 Фиг. 122. Сплотка на шипах ![Фиг. 122. Сплотка на шипах](figures/p101 01 f122.png) Что изображено. Сплотка досок с простыми шипами; кромки скашивают, чтобы не зацеплялись. Зачем эксперту. Шиповое соединение дощатых щитов и балок; выпадение шипа — признак потери совместной работы. См.: К 03 Фиг. 125. Сплотка щитов ![Фиг. 125. Сплотка щитов](figures/p103 01 f125.png) Что изображено. Сплотка щитов для переборок и подшивки потолков, в том числе в судовых каютах. Зачем эксперту. Щиты перегородок и подшивок часто поражены гнилью с обратной стороны — нужен осмотр сверху и снизу. См.: К 08 · Д К08 02 Дома и стены Фиг. 127. Обшивка дома ![Фиг. 127. Обшивка дома](figures/p106 01 f127.png) Что изображено. Обшивка деревянного дома дюймовыми досками по стойкам из расколотых 2½ дюймовых досок; стойки у углов, у окон и в середине простенков. Зачем эксперту. Отсутствие вентиляционного зазора под обшивкой — главная причина гнили обшивки и венцов. Признак — вспучивание и тёмные пятна. См.: К 07 · Д К07 01 Фиг. 130. Обшивка сарая ![Фиг. 130. Обшивка сарая](figures/p109 01 f130.png) Что изображено. Обшивка сарая досками и устройство проёмов в деревянных стенах. Зачем эксперту. Хозяйственные постройки часто служат индикатором состояния кровли и водоотвода на участке. См.: К 07 Фиг. 138. Закладные рамы и раскосины ![Фиг. 138. Закладные рамы и раскосины](figures/p118 01 f138.png) Что изображено. Закладные рамы в стенах и раскосины, обеспечивающие жёсткость и связь. Зачем эксперту. Раскосины — элементы жёсткости; их утрата при перепланировках ведёт к перекосам и трещинам. См.: К 05 · Д К05 05 Фиг. 169. Забор «край на край» ![Фиг. 169. Забор «край на край»](figures/p150 01 f169.png) Что изображено. Временный забор «край на край» — обшивка досками впритык по столбам. Зачем эксперту. По типу ограждений и обшивки датируют переделки; гниль столбов у земли — типовой дефект. См.: К 08 · Д К03 20 Балки Фиг. 141. Заделка балки в стену ![Фиг. 141. Заделка балки в стену](figures/p121 01 f141.png) Что изображено. Балка в каменной стене: конец осмолён, обложен войлоком, заложен не более 6 вершков (≈27 см, «на один кирпич»), скреплён скобой со штырём. Зачем эксперту. Торец в кладке и скоба — зоны увлажнения и коррозии. Это ключевой узел для оценки «разрушения заделки» и прогибов. См.: К 03 · Д К03 04 · О 02 Фиг. 144. Составная балка ![Фиг. 144. Составная балка](figures/p124 01 f144.png) Что изображено. Балка из двух рядов брусьев с зубьями по длине и расклиниванием. Зачем эксперту. Расстройство зубьев и выпадение клиньев — причина снижения несущей способности. Проверять соединение, а не только сечение. См.: К 03 · Д К03 22 Фиг. 145. Досчатая балка ![Фиг. 145. Досчатая балка](figures/p125 01 f145.png) Что изображено. Балка из трёх досок на ребро; в книге прямо сказано: в досках видно состояние древесины, а середина бревна может быть гнилой. Зачем эксперту. При обследовании проверять расслоение досок и состояние скрытых слоёв; внешне целая балка может быть сгнившей внутри. См.: К 03 · Д К03 20 Фиг. 147. Надделки сверху ![Фиг. 147. Надделки сверху](figures/p127 01 f147.png) Что изображено. Усиление балки надделками сверху: балка выправляется по шаблону, сверху крепится усиливающий элемент. Зачем эксперту. Исторические усиления — часть конструкции. Оценивать их достаточность и совместную работу (примечание к п. 5.1.11 ГОСТ). См.: К 03 · О 05 Фиг. 150. Боковые накладки ![Фиг. 150. Боковые накладки](figures/p130 01 f150.png) Что изображено. Усиление балки накладками с боков заподлицо с нижней гранью. Зачем эксперту. Смотреть на плотность прилегания и крепёж: зазоры и коррозия крепежа сводят усиление к нулю. См.: К 03 · Д К03 02 Крыши Фиг. 171. Шаг стропил ![Фиг. 171. Шаг стропил](figures/p152 01 f171.png) Что изображено. Расстановка стропил по ширине здания и назначение шага. Зачем эксперту. Шаг стропил — база для проверки нагрузок и обрешётки; его изменение при ремонте меняет работу крыши. См.: К 06 · Д К06 03 Фиг. 172. Опирание стропильных ног ![Фиг. 172. Опирание стропильных ног](figures/p153 01 f172.png) Что изображено. Опирание стропильных ног на короткий брус; варианты узла. Зачем эксперту. Узел опирания — место скалывания и гниения; при осмотре фиксировать зазоры и смятие. См.: К 06 · Д К06 02 Фиг. 174. Стропила в каменных домах ![Фиг. 174. Стропила в каменных домах](figures/p155 01 f174.png) Что изображено. Устройство стропил в каменных строениях: связь, подобная балке, и опирание на кладку. Зачем эксперту. В каменных домах узел опирания контактирует с кладкой — риск конденсата и гнили концов. См.: К 06 · Д К06 02 Фиг. 175. Мауэрлат и прогоны ![Фиг. 175. Мауэрлат и прогоны](figures/p156 01 f175.png) Что изображено. Два прогона (мауэрлата) под стропила; распределение нагрузки на стены. Зачем эксперту. Проверять анкеровку мауэрлата и состояние подкладок: ослабление ведёт к сдвигу крыши. См.: К 06 · Д К06 03 Фиг. 176. Обрешётка под железо ![Фиг. 176. Обрешётка под железо](figures/p157 01 f176.png) Что изображено. Обрешётка под железную крышу досками 2½ дюйма (≈6,4 см) и шаг обрешётки. Зачем эксперту. Историческая железная кровля по деревянной обрешётке: конденсат снизу — главная причина коррозии листов и гнили досок. См.: К 06 · Д К06 01 Фиг. 177. Конёк ![Фиг. 177. Конёк](figures/p158 01 f177.png) Что изображено. Конёк крыши и обрешётка под деревянную кровлю. Зачем эксперту. Протечки по коньку — типовая жалоба; проверять примыкания и вентиляцию подкровельного пространства. См.: К 06 · Д К06 01 Фиг. 179. Обход трубы ![Фиг. 179. Обход трубы](figures/p160 01 f179.png) Что изображено. Обход крыши вокруг трубы: желоба из полулистов выше трубы, разделка. Зачем эксперту. Именно здесь чаще всего протечки и замачивание чердачного перекрытия; проверять металл и зазоры. См.: К 06 · Д К06 01 · Д К03 24 Фиг. 182. Легель ![Фиг. 182. Легель](figures/p163 01 f182.png) Что изображено. Стропила с легелем — горизонтальным брусом посередине, соединённым со стропильными ногами замком в сковородник; чем положе крыша, тем нужнее легель. Зачем эксперту. Легель воспринимает распор. Его отсутствие или расстройство объясняет деформации скатов и трещины в узлах. См.: К 06 · Д К06 03 Фиг. 188. Опора на капитальную стену ![Фиг. 188. Опора на капитальную стену](figures/p169 01 f188.png) Что изображено. Стропила с опорой на среднюю капитальную стену — уменьшение пролёта и распора. Зачем эксперту. При утрате внутренней стены или её проёмах стропила получают дополнительный пролёт — причина прогибов. См.: К 06 · Д К06 03 Фиг. 200. Световой фонарь ![Фиг. 200. Световой фонарь](figures/p183 01 f200.png) Что изображено. Фонарь на крыше: вертикальные схватки, остекление, узел примыкания. Зачем эксперту. Фонари и зенитные окна — места протечек и конденсата; проверять примыкания и несущие стойки. См.: К 06 · Д К06 01 Лестницы Фиг. 202. Тетива лестницы ![Фиг. 202. Тетива лестницы](figures/p185 01 f202.png) Что изображено. Крепление тетивы и врубка ступеней: разметка, шпунты, посадка ступени. Зачем эксперту. Исторические параметры: подъём ≈4 вершка (18 см), проступь ≥6 вершков (27 см). Отклонения — след переделок. См.: К 04 · Д К04 12 Мосты Фиг. 203. Мост на фермах ![Фиг. 203. Мост на фермах](figures/p187 01 f203.png) Что изображено. Деревянный мост кружальной системы (первый в России, 1813 г.): 7 арок, 8 ферм, свайные опоры в 5 рядов. Зачем эксперту. Термины «кружала» и ферменные схемы нужны при описании исторических большепролётных конструкций. См.: К 05 "}, {"id": "series-2140-6", "file": "13_Книги/СЕРИЯ_2.140-6.md", "title": "СЕРИЯ 2.140-6. УЗЛЫ ДЕРЕВЯННЫХ ПЕРЕКРЫТИЙ", "section": "13_Книги", "html": "<h1>СЕРИЯ 2.140-6. УЗЛЫ ДЕРЕВЯННЫХ ПЕРЕКРЫТИЙ</h1><blockquote><p>Типовые конструкции, изделия и узлы зданий и сооружений. Серия 2.140-6 «Узлы деревянных перекрытий жилых сельских зданий. Рабочие чертежи». Разработана ЦНИИЭПграждансельстрой, утверждена и введена Госстроем СССР (приказ № 337), взамен серии 2.140-1, выпуск 5 «Деревянные перекрытия и полы сельских зданий». 40 страниц, скан с неполным текстовым слоем.</p></blockquote><h2 id=\"s1\">1. СОСТАВ ВЫПУСКА</h2><div class=\"tablewrap\"><table><thead><tr><th>Обозначение</th><th>Наименование</th><th>Лист</th></tr></thead><tbody><tr><td>2.140-6-00ПЗ</td><td>Пояснительная записка</td><td>3—9</td></tr><tr><td><a href=\"#/figures/series-01\">2.140-6-01</a></td><td>Узел 1</td><td>10</td></tr><tr><td><a href=\"#/figures/series-02\">2.140-6-02</a></td><td>Узел 2</td><td>11</td></tr><tr><td><a href=\"#/figures/series-03\">2.140-6-03</a></td><td>Узел 3</td><td>12</td></tr><tr><td><a href=\"#/figures/series-04\">2.140-6-04</a></td><td>Узел 4</td><td>13</td></tr><tr><td><a href=\"#/figures/series-05\">2.140-6-05</a></td><td>Узел 5</td><td>14</td></tr><tr><td><a href=\"#/figures/series-06\">2.140-6-06</a></td><td>Узел 6</td><td>15</td></tr><tr><td><a href=\"#/figures/series-07\">2.140-6-07</a></td><td>Узлы 7, 8</td><td>16</td></tr><tr><td><a href=\"#/figures/series-08\">2.140-6-08</a></td><td>Узел 9</td><td>17</td></tr><tr><td><a href=\"#/figures/series-09\">2.140-6-09</a></td><td>Узел 10</td><td>18</td></tr><tr><td><a href=\"#/figures/series-10\">2.140-6-10</a></td><td>Узел 11</td><td>19</td></tr><tr><td><a href=\"#/figures/series-11\">2.140-6-11</a></td><td>Узел 12</td><td>20</td></tr><tr><td><a href=\"#/figures/series-12\">2.140-6-12</a></td><td>Узел 13</td><td>21</td></tr><tr><td><a href=\"#/figures/series-13\">2.140-6-13</a></td><td>Узел 14</td><td>22</td></tr><tr><td><a href=\"#/figures/series-14\">2.140-6-14</a></td><td>Узел 15</td><td>23</td></tr><tr><td><a href=\"#/figures/series-15\">2.140-6-15</a></td><td>Узел 16</td><td>24</td></tr><tr><td><a href=\"#/figures/series-16\">2.140-6-16</a></td><td>Узел 17</td><td>25</td></tr><tr><td><a href=\"#/figures/series-17\">2.140-6-17</a></td><td>Узел 18</td><td>26</td></tr><tr><td><a href=\"#/figures/series-18\">2.140-6-18</a></td><td>Узел 19</td><td>27</td></tr><tr><td><a href=\"#/figures/series-19\">2.140-6-19</a></td><td>Узлы 20, 21</td><td>28</td></tr><tr><td><a href=\"#/figures/series-20\">2.140-6-20</a></td><td>Узел 22</td><td>29</td></tr><tr><td><a href=\"#/figures/series-21\">2.140-6-21</a></td><td>Узел 23</td><td>30</td></tr><tr><td><a href=\"#/figures/series-22\">2.140-6-22</a></td><td>Узлы 24, 25</td><td>31</td></tr><tr><td><a href=\"#/figures/series-23\">2.140-6-23</a></td><td>Узлы 26, 27</td><td>32</td></tr><tr><td><a href=\"#/figures/series-24\">2.140-6-24</a></td><td>Узел 28</td><td>33</td></tr><tr><td><a href=\"#/figures/series-25\">2.140-6-25</a></td><td>Узел 29</td><td>34</td></tr><tr><td><a href=\"#/figures/series-26\">2.140-6-26</a></td><td>Узлы 30, 31</td><td>35</td></tr><tr><td><a href=\"#/figures/series-27\">2.140-6-27</a></td><td>АМ-1</td><td>36</td></tr><tr><td><a href=\"#/figures/series-28\">2.140-6-28</a></td><td>АМ-2, ХМ-1</td><td>37</td></tr></tbody></table></div><p>Номера листов даны по штампу; в скане 40 страниц с обложками и титулом.</p><p>Клик по обозначению листа открывает сам чертёж с пояснением к разделу.</p><h2 id=\"s2\">2. ЧТО ОХВАТЫВАЕТ СЕРИЯ</h2><p>Пояснительная записка делит узлы на три группы:</p><ul><li><strong>3.1 Цокольное перекрытие</strong> — над проветриваемым подпольем.</li><li><strong>3.2 Междуэтажное перекрытие</strong> — в том числе над первым этажом при</li></ul><p>эксплуатируемом чердаке.</p><ul><li><strong>3.3 Чердачное перекрытие</strong> — наиболее распространённые решения.</li></ul><p>Типовая конструкция — деревянные балки с <strong>черепными брусками</strong>, по которым укладываются <strong>щиты наката</strong> (ГОСТ 1005-68) или дощатый настил.</p><h2 id=\"s3\">3. КОНСТРУКТИВНЫЕ РЕШЕНИЯ (по ПЗ)</h2><p><strong>Балки.</strong> Деревянные, с черепными брусками по ГОСТ 4981-71; рекомендуемые пролёты 3,0—3,6 м, сечение — по расчёту; шаг — по расчёту и схеме раскладки.</p><p><strong>Цокольное перекрытие.</strong></p><ul><li>низ перекрытия — не менее 400 мм от планировочной отметки земли;</li><li>подполье сообщается с наружным воздухом через продухи в цоколе;</li><li>по верху цоколя по всем стенам — гидроизоляция из двух слоёв;</li><li>поверх гидроизоляции — антисептированная доска 50 мм (глубокой пропитки),</li></ul><p>на неё укладываются балки.</p><p><strong>Накат и утепление.</strong></p><ul><li>щиты наката или настил из досок 16—25 мм (допускалась горбыль);</li><li>по накату — два слоя мешочной бумаги (ГОСТ 2228-8?);</li><li>утеплитель — полужесткие минераловатные плиты на синтетическом связующем</li></ul><p>(марка П-125), один слой синтетической плёнки или толя.</p><p><strong>Междуэтажное перекрытие.</strong></p><ul><li>по щитам наката — два слоя мешочной бумаги и минераловатные плиты 25—50 мм</li></ul><p>как звукоизоляция;</p><ul><li>по балкам под полы — звукоизоляционные прокладки из древесноволокнистых плит</li></ul><p>М-4, М-12, М-20 (плотность не более 250 кг/м³).</p><p><strong>Чердачное перекрытие.</strong></p><ul><li>пароизоляция — полиэтиленовая плёнка, полистирольная плёнка или рулонный</li></ul><p>материал;</p><ul><li>утеплитель — по таблице серии: минераловатные плиты, фибролит на</li></ul><p>портландцементе, вспученный перлитовый песок, вспученный вермикулит.</p><p><strong>Примыкание к дымоходам.</strong> Диагональный настил и оклеенная гидроизоляция (узел в составе АМ).</p><h2 id=\"s4\">4. ЗАЧЕМ ЭКСПЕРТУ</h2><p>Это «эталонная» схема деревянных перекрытий сельских жилых домов 1980-х годов. По ней видно, что должно быть в норме, и что считать отклонением:</p><div class=\"tablewrap\"><table><thead><tr><th>В серии</th><th>Отклонение на объекте</th><th>Дефект</th></tr></thead><tbody><tr><td>Черепные бруски по балкам</td><td>отсутствуют, балки «в подрезку»</td><td>Д-К03-22</td></tr><tr><td>Щиты наката / настил 16—25 мм</td><td>провалы, провисание, гниль наката</td><td>Д-К03-20</td></tr><tr><td>Гидроизоляция 2 слоя по цоколю</td><td>отсутствует, балки лежат на кладке</td><td>Д-К03-24</td></tr><tr><td>Продухи в цоколе</td><td>заложены, подполье глухое</td><td>Д-К03-20</td></tr><tr><td>Антисептирование доски 50 мм</td><td>нет, древесина поражена грибком</td><td>Д-К03-20</td></tr><tr><td>Утеплитель и пароизоляция</td><td>утеплитель мокрый, плёнки нет</td><td>Д-К03-24</td></tr><tr><td>Опирание по расчёту</td><td>малая площадка, смятие</td><td>Д-К03-06</td></tr></tbody></table></div><p>Кроме того, серия даёт язык описания: «балка с черепными брусками», «щиты наката», «звукоизоляционные прокладки», «продухи», «диагональный настил у дымохода». Эти термины уместны в заключении при описании перекрытия.</p><h2 id=\"s5\">5. ЧТО ПРОВЕРЯТЬ НА ОБЪЕКТЕ</h2><ol><li>Шаг, сечение и пролёт балок; наличие черепных брусков.</li><li>Опирание балок: площадка, антисептирование, гидроизоляция, заделка в стену.</li><li>Цокольное перекрытие: 400 мм от земли, продухи, два слоя гидроизоляции.</li><li>Накат: щиты или доски, зазоры, провисание, следы гниения.</li><li>Междуэтажное: звукоизоляционные прокладки, минераловатные плиты.</li><li>Чердачное: пароизоляция, вид и влажность утеплителя, протечки.</li><li>Примыкания к дымоходам и вентиляционным каналам: разделка, диагональный</li></ol><p>настил, оклеечная гидроизоляция.</p><h2 id=\"s6\">6. СВЯЗИ</h2><ul><li>Конструктив: К-03.3 Деревянные перекрытия; К-03.1 По металлическим балкам.</li><li>Дефекты: Д-К03-20 гниль; Д-К03-21 прогиб; Д-К03-22 расстройство узлов;</li></ul><p>Д-К03-24 увлажнение утеплителя; Д-К03-06 недостаточная площадка опирания.</p><ul><li>Методики: вскрытия перекрытий, влагометрия древесины, оценка биопоражения.</li><li>Обоснования: О-05 (усиление вместо замены), О-09 (периодичность).</li></ul>", "toc": [["s1", "1. СОСТАВ ВЫПУСКА", 2], ["s2", "2. ЧТО ОХВАТЫВАЕТ СЕРИЯ", 2], ["s3", "3. КОНСТРУКТИВНЫЕ РЕШЕНИЯ (по ПЗ)", 2], ["s4", "4. ЗАЧЕМ ЭКСПЕРТУ", 2], ["s5", "5. ЧТО ПРОВЕРЯТЬ НА ОБЪЕКТЕ", 2], ["s6", "6. СВЯЗИ", 2]], "chars": 5911, "plain": " СЕРИЯ 2.140 6. УЗЛЫ ДЕРЕВЯННЫХ ПЕРЕКРЫТИЙ Типовые конструкции, изделия и узлы зданий и сооружений. Серия 2.140 6 «Узлы деревянных перекрытий жилых сельских зданий. Рабочие чертежи». Разработана ЦНИИЭПграждансельстрой, утверждена и введена Госстроем СССР (приказ № 337), взамен серии 2.140 1, выпуск 5 «Деревянные перекрытия и полы сельских зданий». 40 страниц, скан с неполным текстовым слоем. 1. СОСТАВ ВЫПУСКА Обозначение Наименование Лист 2.140 6 00ПЗ Пояснительная записка 3—9 [2.140 6 01]( /figures/series 01) Узел 1 10 [2.140 6 02]( /figures/series 02) Узел 2 11 [2.140 6 03]( /figures/series 03) Узел 3 12 [2.140 6 04]( /figures/series 04) Узел 4 13 [2.140 6 05]( /figures/series 05) Узел 5 14 [2.140 6 06]( /figures/series 06) Узел 6 15 [2.140 6 07]( /figures/series 07) Узлы 7, 8 16 [2.140 6 08]( /figures/series 08) Узел 9 17 [2.140 6 09]( /figures/series 09) Узел 10 18 [2.140 6 10]( /figures/series 10) Узел 11 19 [2.140 6 11]( /figures/series 11) Узел 12 20 [2.140 6 12]( /figures/series 12) Узел 13 21 [2.140 6 13]( /figures/series 13) Узел 14 22 [2.140 6 14]( /figures/series 14) Узел 15 23 [2.140 6 15]( /figures/series 15) Узел 16 24 [2.140 6 16]( /figures/series 16) Узел 17 25 [2.140 6 17]( /figures/series 17) Узел 18 26 [2.140 6 18]( /figures/series 18) Узел 19 27 [2.140 6 19]( /figures/series 19) Узлы 20, 21 28 [2.140 6 20]( /figures/series 20) Узел 22 29 [2.140 6 21]( /figures/series 21) Узел 23 30 [2.140 6 22]( /figures/series 22) Узлы 24, 25 31 [2.140 6 23]( /figures/series 23) Узлы 26, 27 32 [2.140 6 24]( /figures/series 24) Узел 28 33 [2.140 6 25]( /figures/series 25) Узел 29 34 [2.140 6 26]( /figures/series 26) Узлы 30, 31 35 [2.140 6 27]( /figures/series 27) АМ 1 36 [2.140 6 28]( /figures/series 28) АМ 2, ХМ 1 37 Номера листов даны по штампу; в скане 40 страниц с обложками и титулом. Клик по обозначению листа открывает сам чертёж с пояснением к разделу. 2. ЧТО ОХВАТЫВАЕТ СЕРИЯ Пояснительная записка делит узлы на три группы: 3.1 Цокольное перекрытие — над проветриваемым подпольем. 3.2 Междуэтажное перекрытие — в том числе над первым этажом при эксплуатируемом чердаке. 3.3 Чердачное перекрытие — наиболее распространённые решения. Типовая конструкция — деревянные балки с черепными брусками , по которым укладываются щиты наката (ГОСТ 1005 68) или дощатый настил. 3. КОНСТРУКТИВНЫЕ РЕШЕНИЯ (по ПЗ) Балки. Деревянные, с черепными брусками по ГОСТ 4981 71; рекомендуемые пролёты 3,0—3,6 м, сечение — по расчёту; шаг — по расчёту и схеме раскладки. Цокольное перекрытие. низ перекрытия — не менее 400 мм от планировочной отметки земли; подполье сообщается с наружным воздухом через продухи в цоколе; по верху цоколя по всем стенам — гидроизоляция из двух слоёв; поверх гидроизоляции — антисептированная доска 50 мм (глубокой пропитки), на неё укладываются балки. Накат и утепление. щиты наката или настил из досок 16—25 мм (допускалась горбыль); по накату — два слоя мешочной бумаги (ГОСТ 2228 8?); утеплитель — полужесткие минераловатные плиты на синтетическом связующем (марка П 125), один слой синтетической плёнки или толя. Междуэтажное перекрытие. по щитам наката — два слоя мешочной бумаги и минераловатные плиты 25—50 мм как звукоизоляция; по балкам под полы — звукоизоляционные прокладки из древесноволокнистых плит М 4, М 12, М 20 (плотность не более 250 кг/м³). Чердачное перекрытие. пароизоляция — полиэтиленовая плёнка, полистирольная плёнка или рулонный материал; утеплитель — по таблице серии: минераловатные плиты, фибролит на портландцементе, вспученный перлитовый песок, вспученный вермикулит. Примыкание к дымоходам. Диагональный настил и оклеенная гидроизоляция (узел в составе АМ). 4. ЗАЧЕМ ЭКСПЕРТУ Это «эталонная» схема деревянных перекрытий сельских жилых домов 1980 х годов. По ней видно, что должно быть в норме, и что считать отклонением: В серии Отклонение на объекте Дефект Черепные бруски по балкам отсутствуют, балки «в подрезку» Д К03 22 Щиты наката / настил 16—25 мм провалы, провисание, гниль наката Д К03 20 Гидроизоляция 2 слоя по цоколю отсутствует, балки лежат на кладке Д К03 24 Продухи в цоколе заложены, подполье глухое Д К03 20 Антисептирование доски 50 мм нет, древесина поражена грибком Д К03 20 Утеплитель и пароизоляция утеплитель мокрый, плёнки нет Д К03 24 Опирание по расчёту малая площадка, смятие Д К03 06 Кроме того, серия даёт язык описания: «балка с черепными брусками», «щиты наката», «звукоизоляционные прокладки», «продухи», «диагональный настил у дымохода». Эти термины уместны в заключении при описании перекрытия. 5. ЧТО ПРОВЕРЯТЬ НА ОБЪЕКТЕ 1. Шаг, сечение и пролёт балок; наличие черепных брусков. 2. Опирание балок: площадка, антисептирование, гидроизоляция, заделка в стену. 3. Цокольное перекрытие: 400 мм от земли, продухи, два слоя гидроизоляции. 4. Накат: щиты или доски, зазоры, провисание, следы гниения. 5. Междуэтажное: звукоизоляционные прокладки, минераловатные плиты. 6. Чердачное: пароизоляция, вид и влажность утеплителя, протечки. 7. Примыкания к дымоходам и вентиляционным каналам: разделка, диагональный настил, оклеечная гидроизоляция. 6. СВЯЗИ Конструктив: К 03.3 Деревянные перекрытия; К 03.1 По металлическим балкам. Дефекты: Д К03 20 гниль; Д К03 21 прогиб; Д К03 22 расстройство узлов; Д К03 24 увлажнение утеплителя; Д К03 06 недостаточная площадка опирания. Методики: вскрытия перекрытий, влагометрия древесины, оценка биопоражения. Обоснования: О 05 (усиление вместо замены), О 09 (периодичность). "}, {"id": "book-construction", "file": "13_Книги/СТРОИТЕЛЬНОЕ_ИСКУССТВО.md", "title": "СТРОИТЕЛЬНОЕ ИСКУССТВО (1900) — разбор книги и атласа", "section": "13_Книги", "html": "<h1>СТРОИТЕЛЬНОЕ ИСКУССТВО (1900) — разбор книги и атласа</h1><blockquote><p>В. И. Радивановский. <strong>Строительное искусство</strong> (курс). — С.-Петербург: Типография и литография В. А. Тиханова, 1900. 128 с. текста, 169 чертежей в тексте. <strong>Атлас чертежей к курсу строительного искусства</strong>. 2-е изд. — С.-Петербург: издание Н. П. Карбасникова, 1900. 52 таблицы. Файлы: <code>Книги и Техническая литература\\Строительное искусство (с атласом).pdf</code>, <code>Атлас_чертежей_к_курсу_строительнаго_искусства__(52_таблицы).pdf</code>. Галерея таблиц — <code>АТЛАС.md</code> (52 таблицы, <code>atlas\\</code>).</p></blockquote><hr><h2 id=\"s1\">1. ЧТО ЭТО ЗА КНИГА</h2><p>Полный курс строительных работ начала XX века: от земляных работ и фашин до каменной кладки, бетона, свай, металла, штукатурки и малярных работ. В отличие от «Плотничного искусства», это <strong>общестроительный</strong> курс: он объясняет, как в исторической застройке устроены фундаменты, кладка, своды, бетонные массивы, сваи и металлические конструкции.</p><p>Для эксперта ценность в трёх вещах:</p><ol><li><strong>Технология.</strong> Как именно велась кладка, какие правила перевязки соблюдались,</li></ol><p>как устраивались углы, столбы, простенки, трубы, пустоты.</p><ol><li><strong>Диагностика.</strong> Отступления от правил курса (отсутствие перевязки, пустоты</li></ol><p>в кладке, тонкие швы, слабый раствор) — прямые причины дефектов, которые мы фиксируем сегодня.</p><ol><li><strong>Атлас.</strong> 52 таблицы с чертежами: разрезы стен, узлы, детали, механизмы.</li></ol><p>Это готовый визуальный справочник для описания конструкций в заключении.</p><hr><h2 id=\"s2\">2. СТРУКТУРА КУРСА (по оглавлению книги)</h2><div class=\"tablewrap\"><table><thead><tr><th>Раздел</th><th>Содержание</th><th>Таблицы атласа</th></tr></thead><tbody><tr><td>Земляные работы</td><td>свойства грунтов, инструменты, проект и разбивка, перемещение земли, выемки и насыпи, одежда и укрепление откосов, планировка, урок, исследование грунтов</td><td>1—6</td></tr><tr><td>Фашинные работы</td><td>материалы, устройство фашинных сооружений, укрепление откосов и берегов</td><td>7—9</td></tr><tr><td>Каменные работы</td><td>тёсовая кладка (форма камней, разрезка вертикальных, наклонных и цилиндрических стен), бутовая, кирпичная (правила, виды кладок, углы, притыкание, массивы, столбы, круглые стены, простенки, пустоты, трубы), смешанная кладка, облицовка, инструменты, краны, производство и отделка</td><td>10—25</td></tr><tr><td>Бетонные работы</td><td>воздушные бетоны, капитальные работы, изделия (трубы, плитки, ступени), железобетон, бетон под водой</td><td>26—30</td></tr><tr><td>Деревянные работы</td><td>выбор пород, плотничные работы, врубки, столярные</td><td>31—40</td></tr><tr><td>Свайные работы</td><td>деревянные сваи, погружение, винтовые сваи, забивка, выдёргивание и спиливание</td><td>41—45</td></tr><tr><td>Металлические работы</td><td>железные (кузнечные, слесарные, сборка), чугунные (отливка, соединение плит, труб, колонн)</td><td>46—51</td></tr><tr><td>Штукатурные работы</td><td>оштукатуривание каменных, деревянных, сырцовых и глинобитных стен, карнизы, откосы, перетирка</td><td>52</td></tr><tr><td>Малярные работы</td><td>приготовление красок, подготовка, клеевая и масляная окраска, крыши, полы, печи, обои, вставка стёкол</td><td>52</td></tr></tbody></table></div><hr><h2 id=\"s3\">3. ЧТО ВЗЯТЬ ЭКСПЕРТУ</h2><h3 id=\"s4\">3.1 Каменная кладка (с. 52—113)</h3><ul><li><strong>Тёсовая кладка</strong>: форма камней, разрезка стен вертикальных, наклонных</li></ul><p>и цилиндрических, соединение камней. Позволяет описать историческую облицовку и массивные стены.</p><ul><li><strong>Бутовая кладка</strong>: как укладывали бут, чем заполняли пустоты, почему</li></ul><p>современные вскрытия дают «пустоты и расстройство швов».</p><ul><li><strong>Кирпичная кладка</strong>: правила перевязки, кладка прямых стен, **сопряжение под</li></ul><p>углом<strong>, притыкание стен, массивы, столбы, круглые стены, простенки, </strong>стены с пустотами<strong>, </strong>кладка труб**.</p><ul><li><strong>Смешанная кладка</strong> и облицовка бетона кирпичом.</li><li><strong>Краны и инструменты</strong> — по ним видно, какие технологии были доступны</li></ul><p>на момент постройки (важно для датировки).</p><p><strong>Что даёт:</strong> обоснование дефектов «отступление от правил перевязки», «пустоты в кладке», «недостаточная площадь опирания», «разрушение угла». См. <code>04_Дефекты</code>, Д-К02-01…Д-К02-15.</p><h3 id=\"s5\">3.2 Бетонные работы (с. 113—137)</h3><ul><li>Воздушные бетоны, капитальные работы, <strong>изделия</strong>: трубы, плитки, ступени.</li><li><strong>Железобетонные сооружения</strong> — ранний период применения железобетона</li></ul><p>в России; полезно для датировки и понимания конструкций начала XX века.</p><ul><li><strong>Бетон под водой</strong> — исторические приёмы.</li></ul><p><strong>Что даёт:</strong> распознавание раннего железобетона и оценка его состояния (защитный слой, карбонизация), см. Д-К03-13.</p><h3 id=\"s6\">3.3 Свайные работы (с. 161—188)</h3><ul><li>Деревянные сваи, погружение, <strong>винтовые сваи</strong>, забивка, выдёргивание</li></ul><p>и спиливание.</p><ul><li>В связке с «Плотничным искусством» (копёр, баба) даёт полную картину</li></ul><p>свайных оснований исторических зданий.</p><p><strong>Что даёт:</strong> идентификация свайных фундаментов, оценка их состояния, обоснование обследования (шурфы, сейсмоакустика — п. 5.2.19 ГОСТ 31937-2024).</p><h3 id=\"s7\">3.4 Металлические работы (с. 188—222)</h3><ul><li>Кузнечные и слесарные работы, сборка частей.</li><li>Чугунные отливки, соединение плит, труб и колонн.</li><li>Атлас, таблицы 46—51: клёпка, болты, узлы ферм, чугунные колонны и трубы.</li></ul><p><strong>Что даёт:</strong> понимание исторических соединений (заклёпки, кованые скобы, чугунные колонны) — и типовых дефектов: коррозия, ослабление заклёпок, трещины в чугуне.</p><h3 id=\"s8\">3.5 Земляные и фашинные работы (с. 3—52)</h3><ul><li>Свойства грунтов, исследование грунтов, укрепление откосов, фашины и тюфяки.</li><li>Полезно для объектов на слабых грунтах, у воды, с подтоплением.</li></ul><p><strong>Что даёт:</strong> язык описания оснований и мероприятий (дренаж, укрепление откосов), обоснование геологических изысканий (п. 5.1.12, 5.2.2 ГОСТ).</p><h3 id=\"s9\">3.6 Штукатурные и малярные работы (с. 223—250)</h3><ul><li>Оштукатуривание по камню, дереву, сырцу и глинобиту; карнизы, откосы.</li><li>Малярные составы: клеевые, масляные, окраска крыш, полов, печей.</li></ul><p><strong>Что даёт:</strong> идентификация отделки и причин её разрушения (несовместимость составов, отсутствие подготовки), см. Д-К07-01.</p><hr><h2 id=\"s10\">4. АТЛАС: КАК ПОЛЬЗОВАТЬСЯ</h2><p>52 таблицы с чертежами; нумерация чертежей в тексте книги (<strong>чер. N</strong>) соответствует таблицам атласа. В каждой таблице — от 3 до 15 чертежей.</p><div class=\"tablewrap\"><table><thead><tr><th>Таблицы</th><th>Тема</th><th>Что искать</th></tr></thead><tbody><tr><td>1—6</td><td>Земляные работы</td><td>профили выемок и насыпей, откосы, укрепления</td></tr><tr><td>7—9</td><td>Фашинные работы</td><td>фашины, тюфяки, укрепление берегов</td></tr><tr><td>10—25</td><td>Каменные работы</td><td>разрезка стен, перевязка, углы, столбы, своды, трубы</td></tr><tr><td>26—30</td><td>Бетонные работы</td><td>опалубка, массивы, изделия, железобетон</td></tr><tr><td>31—40</td><td>Деревянные работы</td><td>врубки, сопряжения, стропила, полы</td></tr><tr><td>41—45</td><td>Свайные работы</td><td>сваи, копры, винтовые сваи, ростверки</td></tr><tr><td>46—51</td><td>Металлические работы</td><td>клёпка, болты, узлы ферм, чугунные колонны</td></tr><tr><td>52</td><td>Отделочные работы</td><td>штукатурка, карнизы, откосы</td></tr></tbody></table></div><p>Галерея: <code>АТЛАС.md</code>, файлы — <code>atlas\\tab-NN.png</code> (1600 px, ч/б).</p><p><strong>Практика:</strong> при обследовании сфотографировать узел и сравнить с таблицей — это даёт точное название конструкции и корректную формулировку в заключении.</p><hr><h2 id=\"s11\">5. СВЯЗЬ С БИБЛИОТЕКОЙ И НОРМАМИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Тема книги</th><th>Раздел библиотеки</th><th>Норма</th></tr></thead><tbody><tr><td>Каменная кладка</td><td><code>03_Конструктив</code> К-02, <code>04_Дефекты</code> Д-К02</td><td>СП 15.13330.2020</td></tr><tr><td>Бетон, железобетон</td><td>К-03, Д-К03-10…16</td><td>СП 63.13330.2018</td></tr><tr><td>Сваи, основания</td><td>К-01, Д-К01</td><td>СП 24.13330.2021, СП 22.13330.2016</td></tr><tr><td>Деревянные работы</td><td>К-03, К-06, Д-К03-20…24</td><td>СП 64.13330.2017</td></tr><tr><td>Металл</td><td>К-05, Д-К05</td><td>СП 16.13330.2017</td></tr><tr><td>Штукатурка, фасад</td><td>К-07, Д-К07</td><td>СП 71.13330.2017</td></tr><tr><td>Обследование и категории</td><td><code>06_Оценка_состояния</code></td><td>ГОСТ 31937-2024</td></tr></tbody></table></div><hr><h2 id=\"s12\">6. ОГРАНИЧЕНИЯ</h2><ul><li>Курс 1900 г.: нормы, нагрузки и расчёты не соответствуют современным.</li><li>Старая орфография и терминология; часть подписей атласа распознана с ошибками.</li><li>Иллюстрации — сканы; использовать как справочные, не как чертежи для расчёта.</li><li>Атлас содержит 52 таблицы; в галерее — все 52 (включая титульный лист курса</li></ul><p>как отдельную страницу не включён).</p><ul><li>Для расчётов — только действующие СП; книга даёт конструктивное и историческое</li></ul><p>понимание.</p>", "toc": [["s1", "1. ЧТО ЭТО ЗА КНИГА", 2], ["s2", "2. СТРУКТУРА КУРСА (по оглавлению книги)", 2], ["s3", "3. ЧТО ВЗЯТЬ ЭКСПЕРТУ", 2], ["s4", "3.1 Каменная кладка (с. 52—113)", 3], ["s5", "3.2 Бетонные работы (с. 113—137)", 3], ["s6", "3.3 Свайные работы (с. 161—188)", 3], ["s7", "3.4 Металлические работы (с. 188—222)", 3], ["s8", "3.5 Земляные и фашинные работы (с. 3—52)", 3], ["s9", "3.6 Штукатурные и малярные работы (с. 223—250)", 3], ["s10", "4. АТЛАС: КАК ПОЛЬЗОВАТЬСЯ", 2], ["s11", "5. СВЯЗЬ С БИБЛИОТЕКОЙ И НОРМАМИ", 2], ["s12", "6. ОГРАНИЧЕНИЯ", 2]], "chars": 7621, "plain": " СТРОИТЕЛЬНОЕ ИСКУССТВО (1900) — разбор книги и атласа В. И. Радивановский. Строительное искусство (курс). — С. Петербург: Типография и литография В. А. Тиханова, 1900. 128 с. текста, 169 чертежей в тексте. Атлас чертежей к курсу строительного искусства . 2 е изд. — С. Петербург: издание Н. П. Карбасникова, 1900. 52 таблицы. Файлы: Книги и Техническая литература\\Строительное искусство (с атласом).pdf , Атлас чертежей к курсу строительнаго искусства (52 таблицы).pdf . Галерея таблиц — АТЛАС.md (52 таблицы, atlas\\ ). 1. ЧТО ЭТО ЗА КНИГА Полный курс строительных работ начала XX века: от земляных работ и фашин до каменной кладки, бетона, свай, металла, штукатурки и малярных работ. В отличие от «Плотничного искусства», это общестроительный курс: он объясняет, как в исторической застройке устроены фундаменты, кладка, своды, бетонные массивы, сваи и металлические конструкции. Для эксперта ценность в трёх вещах: 1. Технология. Как именно велась кладка, какие правила перевязки соблюдались, как устраивались углы, столбы, простенки, трубы, пустоты. 2. Диагностика. Отступления от правил курса (отсутствие перевязки, пустоты в кладке, тонкие швы, слабый раствор) — прямые причины дефектов, которые мы фиксируем сегодня. 3. Атлас. 52 таблицы с чертежами: разрезы стен, узлы, детали, механизмы. Это готовый визуальный справочник для описания конструкций в заключении. 2. СТРУКТУРА КУРСА (по оглавлению книги) Раздел Содержание Таблицы атласа Земляные работы свойства грунтов, инструменты, проект и разбивка, перемещение земли, выемки и насыпи, одежда и укрепление откосов, планировка, урок, исследование грунтов 1—6 Фашинные работы материалы, устройство фашинных сооружений, укрепление откосов и берегов 7—9 Каменные работы тёсовая кладка (форма камней, разрезка вертикальных, наклонных и цилиндрических стен), бутовая, кирпичная (правила, виды кладок, углы, притыкание, массивы, столбы, круглые стены, простенки, пустоты, трубы), смешанная кладка, облицовка, инструменты, краны, производство и отделка 10—25 Бетонные работы воздушные бетоны, капитальные работы, изделия (трубы, плитки, ступени), железобетон, бетон под водой 26—30 Деревянные работы выбор пород, плотничные работы, врубки, столярные 31—40 Свайные работы деревянные сваи, погружение, винтовые сваи, забивка, выдёргивание и спиливание 41—45 Металлические работы железные (кузнечные, слесарные, сборка), чугунные (отливка, соединение плит, труб, колонн) 46—51 Штукатурные работы оштукатуривание каменных, деревянных, сырцовых и глинобитных стен, карнизы, откосы, перетирка 52 Малярные работы приготовление красок, подготовка, клеевая и масляная окраска, крыши, полы, печи, обои, вставка стёкол 52 3. ЧТО ВЗЯТЬ ЭКСПЕРТУ 3.1 Каменная кладка (с. 52—113) Тёсовая кладка : форма камней, разрезка стен вертикальных, наклонных и цилиндрических, соединение камней. Позволяет описать историческую облицовку и массивные стены. Бутовая кладка : как укладывали бут, чем заполняли пустоты, почему современные вскрытия дают «пустоты и расстройство швов». Кирпичная кладка : правила перевязки, кладка прямых стен, сопряжение под углом , притыкание стен, массивы, столбы, круглые стены, простенки, стены с пустотами , кладка труб . Смешанная кладка и облицовка бетона кирпичом. Краны и инструменты — по ним видно, какие технологии были доступны на момент постройки (важно для датировки). Что даёт: обоснование дефектов «отступление от правил перевязки», «пустоты в кладке», «недостаточная площадь опирания», «разрушение угла». См. 04 Дефекты , Д К02 01…Д К02 15. 3.2 Бетонные работы (с. 113—137) Воздушные бетоны, капитальные работы, изделия : трубы, плитки, ступени. Железобетонные сооружения — ранний период применения железобетона в России; полезно для датировки и понимания конструкций начала XX века. Бетон под водой — исторические приёмы. Что даёт: распознавание раннего железобетона и оценка его состояния (защитный слой, карбонизация), см. Д К03 13. 3.3 Свайные работы (с. 161—188) Деревянные сваи, погружение, винтовые сваи , забивка, выдёргивание и спиливание. В связке с «Плотничным искусством» (копёр, баба) даёт полную картину свайных оснований исторических зданий. Что даёт: идентификация свайных фундаментов, оценка их состояния, обоснование обследования (шурфы, сейсмоакустика — п. 5.2.19 ГОСТ 31937 2024). 3.4 Металлические работы (с. 188—222) Кузнечные и слесарные работы, сборка частей. Чугунные отливки, соединение плит, труб и колонн. Атлас, таблицы 46—51: клёпка, болты, узлы ферм, чугунные колонны и трубы. Что даёт: понимание исторических соединений (заклёпки, кованые скобы, чугунные колонны) — и типовых дефектов: коррозия, ослабление заклёпок, трещины в чугуне. 3.5 Земляные и фашинные работы (с. 3—52) Свойства грунтов, исследование грунтов, укрепление откосов, фашины и тюфяки. Полезно для объектов на слабых грунтах, у воды, с подтоплением. Что даёт: язык описания оснований и мероприятий (дренаж, укрепление откосов), обоснование геологических изысканий (п. 5.1.12, 5.2.2 ГОСТ). 3.6 Штукатурные и малярные работы (с. 223—250) Оштукатуривание по камню, дереву, сырцу и глинобиту; карнизы, откосы. Малярные составы: клеевые, масляные, окраска крыш, полов, печей. Что даёт: идентификация отделки и причин её разрушения (несовместимость составов, отсутствие подготовки), см. Д К07 01. 4. АТЛАС: КАК ПОЛЬЗОВАТЬСЯ 52 таблицы с чертежами; нумерация чертежей в тексте книги ( чер. N ) соответствует таблицам атласа. В каждой таблице — от 3 до 15 чертежей. Таблицы Тема Что искать 1—6 Земляные работы профили выемок и насыпей, откосы, укрепления 7—9 Фашинные работы фашины, тюфяки, укрепление берегов 10—25 Каменные работы разрезка стен, перевязка, углы, столбы, своды, трубы 26—30 Бетонные работы опалубка, массивы, изделия, железобетон 31—40 Деревянные работы врубки, сопряжения, стропила, полы 41—45 Свайные работы сваи, копры, винтовые сваи, ростверки 46—51 Металлические работы клёпка, болты, узлы ферм, чугунные колонны 52 Отделочные работы штукатурка, карнизы, откосы Галерея: АТЛАС.md , файлы — atlas\\tab NN.png (1600 px, ч/б). Практика: при обследовании сфотографировать узел и сравнить с таблицей — это даёт точное название конструкции
