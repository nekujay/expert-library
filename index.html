ов и повреждений с фиксацией их мест и характера; описание фотографий дефектных участков; результаты проверки наличия характерных деформаций отдельных строительных конструкций; обмеры конструкций. На основании полученных результатов были разработаны выводы и рекомендации по обеспечению безопасной дальнейшей эксплуатации основных несущих конструкций. На момент обследования: <помещение эксплуатируется как … ; <помещения … фактически объединены ; <арочный проезд действующий . Исходные данные: техническое задание на обследование …; поэтажные планы ПИБ; технический паспорт. Нормативная документация: ГОСТ 31937 2024 «Здания и сооружения. Правила обследования и мониторинга технического состояния»; ГОСТ Р 55567 2013 (для объектов культурного наследия); СП 13 102 2003 «Правила обследования несущих строительных конструкций зданий и сооружений»; СП 20.13330.2016 «Нагрузки и воздействия»; СП 70.13330.2012 «Несущие и ограждающие конструкции»; СП 15.13330.2020 «Каменные и армокаменные конструкции»; СП 16.13330.2017 «Стальные конструкции»; СП 63.13330.2018 «Бетонные и железобетонные конструкции» (при ж. б.); СП 64.13330.2017 «Деревянные конструкции» (при дереве); СП 22.13330.2016 «Основания зданий и сооружений» (при фундаментах); Классификатор основных видов дефектов в строительстве и промышленности строительных материалов (17.11.1993); Федеральный закон от 30.12.2009 № 384 ФЗ «Технический регламент о безопасности зданий и сооружений». Таблица приборов: Наименование и тип прибора или инструмента Назначение Рулетка 5 м Определение размеров конструкций Штангенциркуль WDK MC20005 Измерение толщины конструкций Толщиномер ультразвуковой А 1207 Измерение толщины металла Лупа ЛИ 3 10х № … Измерение ширины раскрытия трещин Линейка стальная Определение геометрических параметров Цифровая фотокамера Canon EOS Фотофиксация дефектов и повреждений Молоток Вскрытие отделочных слоёв Зубило Вскрытие отделочных слоёв 5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш РЕЗ) Результаты обследования Зона проведения обследования: строительные конструкции <объект в границах осей <1 5/А Г . Разбивка помещений: подвальное помещение под кв. № 24 примем за Помещение № 1 на отм. 0.000 в осях 1 2/А Г; подвальное помещение под арочным проездом примем за Помещение № 2 на отм. 0.000 в осях 2 3/А Г; … Принимаем уровень земли за отметку 0.000. Помещение № 1 на отм. 0.000 в осях 1 2/А Г Надподвальное перекрытие в границах помещения № 1 выполнено по металлическим балкам двутаврового сечения. Балки перекрывают пролёт <3,7 м в свету и опираются <на несущие кирпичные стены с шагом <1100 мм. Выявлена <сквозная коррозия балок (до <100 %). Сортамент балок определить невозможно ввиду полного разрушения конструкций. Межбалочное заполнение — бетонное на кирпичном бое, покрытие выполнено из <… . В совокупности выявленные дефекты указывают на исчерпание несущей способности надподвального перекрытия. В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние надподвального перекрытия. Признаков аварийного технического состояния выше отм. 0.000 в осях 1 2/А Г не выявлено. 5.1 Обязательные элементы описания каждого элемента 1. Местоположение (помещение, отметка, оси). 2. Конструкция и материал (тип, сечение, пролёт, шаг, опирание). 3. Заполнение и покрытие. 4. Дефекты с параметрами. 5. Фраза связка о причинах/исчерпании. 6. Вывод со ссылкой на норму и категорией. 7. Контрольная фраза об отсутствии аварийности выше/ниже. 6. ВЫВОДЫ (Ш ВЫВ) Выводы Основными причинами повреждений конструкций являются: длительный срок эксплуатации; отсутствие противокоррозионной обработки металлических балок; недостаточная вентиляция подвального помещения; систематическое затопление помещений подвала. В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние: надподвального перекрытия под помещением 2 Н, 3 Н на отм. 0.000 в осях 3 4/А В; надподвального перекрытия под арочным проездом на отм. 0.000 в осях 2 3/А Г; лестничной площадки ЛК № 1 на отм. 0.000 в осях 4 5/А Б; участка стены в уровне подвала в осях 2/В Г. В соответствии с ГОСТ 31937 2024 установлено ограниченно работоспособное техническое состояние: лестничного марша ЛК № 1 от отм. +0.660 до отм. +2.945 в осях 4 5/Б Г; лестничной площадки ЛК № 1 на отм. +0.660 в осях 4 5/А Б. При визуальном обследовании несущих кирпичных стен в осях 1 5/А Г дефекты не наблюдаются, уклон отсутствует. В соответствии с ГОСТ 31937 2024 дефектов аварийного состояния конструкций несущих кирпичных стен в осях 1 5/А Г не установлено. Типовые причины (выбирать по объекту): длительный срок эксплуатации; отсутствие противокоррозионной обработки металлических балок; недостаточная вентиляция подвального помещения; систематическое затопление помещений подвала; протечки кровли и водостоков; отсутствие или разрушение гидроизоляции; перегрузка конструкций (изменение назначения, установка оборудования); механические воздействия при перепланировках; дефекты строительства и монтажа. 7. РЕКОМЕНДАЦИИ (Ш РЕК) Рекомендации Выполнить замену всех балок надподвального перекрытия на отм. 0.000 в осях 1 5/А Г. Выполнить замену всех перемычек в уровне подвала в осях 2/В Г; 3/В Г; 3 4/В; 3 4/Г; 4 5/Б. Выполнить восстановление лестничного марша от отм. 1.480 до отм. 0.000 в осях 3 4/В Г. Выполнить замену косоуров лестничного марша от отм. 0.000 до отм. +0.660. Работы выполнять по отдельно разработанному проекту в рамках капитального ремонта общего имущества многоквартирных домов. С учётом совокупности всех дефектов проектно сметной документацией следует предусмотреть выполнение работ по замене всех строительных конструкций надподвального перекрытия от отм. 0.000 до отм. +0.660 в осях 1 5/А Г; лестничной клетки № 1 от отм. 0.000 до отм. +0.660; лестничной клетки от отм. 1.480 до отм. +0.660. Управляющей организацией произвести контраварийные мероприятия путём установки стоечных креплений из металла под аварийной зоной. Необходимо проводить систематическое наблюдение противоаварийных мероприятий с целью обеспечения безопасности проживания граждан. Рекомендуемый срок следующего обследования — <не позднее 20 г. (п. 4.2 ГОСТ 31937 2024). Словарь действий: замена; восстановление; усиление; ремонт; защита от коррозии; восстановление гидроизоляции; восстановление водоотвода и вентиляции; установка страховочных креплений; ограничение эксплуатации; разработка проекта. 8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам) 8.1 Категория «В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние …» «… установлено ограниченно работоспособное техническое состояние …» «… установлено работоспособное техническое состояние …» «… состояние конструкций оценено как нормативное …» 8.2 Причина и механизм «В совокупности выявленные дефекты указывают на исчерпание несущей способности …» «Выявлена сквозная коррозия (до 100 %) с участками частичного обрушения.» «Выявлена поверхностная коррозия (до 11 %).» «Сортамент … определить невозможно ввиду полного разрушения конструкций.» «Основными причинами повреждений конструкций являются: …» «Дефекты носят эксплуатационный характер и обусловлены …» «Причиной образования трещин является неравномерная осадка основания, о чём свидетельствует характер их раскрытия …» 8.3 Отсутствие дефектов «При визуальном обследовании … дефекты не наблюдаются, уклон отсутствует.» «Признаков аварийного технического состояния выше отм. … в осях … не выявлено.» «Дефектов аварийного состояния конструкций … не установлено.» 8.4 Обоснование отказа от расчёта «По причине выявления значительных коррозий и полной утраты несущей способности строительных конструкций … выполнение поверочных расчётов не требуется.» «Несущая способность конструкций не подтверждается поверочными расчётами» — для ОР. 8.5 ОКН «Объект имеет статус выявленного объекта культурного наследия … на основании распоряжения КГИОП от . . № .» «Работы выполнять в соответствии с ГОСТ Р 55567 2013 и заданием КГИОП.» 8.6 Ограничения «Заключение составлено по результатам визуального и инструментального обследования в объёме, предусмотренном техническим заданием.» «Выводы относятся к конструкциям, доступным осмотру на момент обследования.» «Скрытые дефекты, не выявленные при вскрытиях, настоящим заключением не оцениваются.» 9. ПРИЛОЖЕНИЕ П 1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ Термины в точной редакции ГОСТ 31937 2024 : обследование (3.16), специализированная организация (3.24), категория (3.8), критерий (3.10), оценка (3.19), четыре категории (3.15, 3.21, 3.18, 3.1), поверочный расчёт (3.20), мониторинг (3.12—3.14, 3.17), восстановление (3.3), усиление (3.27). Не копировать формулировки ГОСТ 31937 2011 — они отличаются (см. разбор эталонных заключений, раздел 7). 10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б) 10.1 Приложение А (обследование) — 16 позиций 1. Адрес объекта. 2. Время проведения обследования. 3. Организация, проводившая обследование. 4. Статус объекта (памятник архитектуры, исторический памятник). 5. Тип проекта (типовой с серией / индивидуальный). 6. Проектная организация. 7. Строительная организация. 8. Год возведения. 9. Год и характер последнего капремонта или реконструкции. 10. Собственник. 11. Форма собственности. 12. Конструктивный тип (каркас, смешанный каркас, с несущими стенами). 13. Число этажей. 14. Период основного тона собственных колебаний / предельное значение. 15. Крен (вдоль продольной и поперечной осей) / предельное значение. 16. Установленная категория технического состояния объекта, отдельных типов конструкций. Приложение: фотографии; описание местности; описание состояния по визуальному обследованию; описание конструкций; чертежи с обмерами; ведомость дефектов; схемы мест измерений и вскрытий; результаты измерений и показатели для расчётов; нагрузки и поверочные расчёты; планы обмеров и разрезы, планы шурфов и скважин; геология и гидрогеология; фото повреждений; анализ причин; рекомендации по восстановлению или усилению. 10.2 Приложение Б (комплексное обследование) — 15 позиций Позиции 1—12 аналогичны, плюс оценка: лифтового оборудования; электросетей и связи; водостоков; ГВС; отопления; ХВС; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции; теплотехнического состояния ограждающих конструкций. 11. ЧЕК ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ [ ] Шифр сквозной: титул, содержание, ТЗ. [ ] Содержание совпадает с фактическими приложениями. [ ] Нормативы указаны с годами; нет «ГОСТ Р 31937 2011». [ ] ГОСТ 31937 2024 указан везде, включая выводы. [ ] Каждый элемент привязан к осям и отметке. [ ] Категории только из четырёх; обоснованы дефектами или расчётом. [ ] Для аварийного состояния — противоаварийные мероприятия и информирование. [ ] Для ОР — мониторинг/восстановление/усиление. [ ] Указан рекомендуемый срок следующего обследования. [ ] Дефектная ведомость согласована с фото и схемами. [ ] Приборы с поверкой, специалисты с аттестацией. [ ] Ограничения и объём обследования оговорены. [ ] Проверены орфография и терминология («надподвальное», «ограниченно работоспособное»). "}, {"id": "grounds", "file": "08_Обоснования/ОБОСНОВАНИЯ.md", "title": "ОБОСНОВАНИЯ «НОРМА → ВЫВОД»", "section": "08_Обоснования", "html": "<h1>ОБОСНОВАНИЯ «НОРМА → ВЫВОД»</h1><blockquote><p>Типовые обоснования решений в заключении: почему назначена категория, почему нужна замена, почему расчёт не требуется, почему выбрано усиление. Каждое — со ссылкой на норму. Формулировки — в <code>07_Шаблоны</code>, категории — в <code>06_Оценка</code>.</p></blockquote><hr><h2 id=\"s1\">О-01. Обоснование аварийного состояния при сквозной коррозии металлических балок</h2><p><strong>Ситуация:</strong> балки перекрытия поражены коррозией насквозь, сечение не восстанавливается, сортамент не идентифицируется.</p><p><strong>Обоснование:</strong></p><ol><li>Выявлены повреждения, свидетельствующие об исчерпании несущей способности (п. 3.1 ГОСТ</li></ol><p>31937-2024 — определение аварийного состояния).</p><ol><li>Перекрытие относится к несущим конструкциям; его отказ создаёт непосредственную угрозу</li></ol><p>жизни и здоровью (п. 3.11 — механическая безопасность).</p><ol><li>Согласно п. 4.5, эксплуатация при аварийном состоянии не допускается; требуются</li></ol><p>противоаварийные мероприятия и обязательный мониторинг.</p><ol><li>Поверочный расчёт не выполняется, так как сечение утрачено и расчётная модель</li></ol><p>не может быть построена по фактическим данным (п. 3.20 — расчёт по фактическим параметрам).</p><p><strong>Вывод:</strong> «В соответствии с ГОСТ 31937-2024 установлено аварийное техническое состояние надподвального перекрытия».</p><p><strong>См.:</strong> Д-К03-01, Д-К10-02, Т-001.</p><hr><h2 id=\"s2\">О-02. Обоснование аварийного состояния при разрушении заделки балки в стену</h2><p><strong>Ситуация:</strong> опорная часть балки разрушена, кладка под опорой выкрошена, балка смещена.</p><p><strong>Обоснование:</strong></p><ol><li>Приложение В, п. 1.12 — уменьшение площадок опирания против проекта → аварийное состояние</li></ol><p>(обосновывается расчётом).</p><ol><li>Приложение В, п. 2.13 — трещины и раздробление кладки под опорами.</li><li>Потеря опирания — прямой путь к обрушению (п. 3.1).</li></ol><p><strong>Вывод:</strong> аварийное; немедленные страховочные крепления.</p><p><strong>См.:</strong> Д-К03-04, Д-К02-11.</p><hr><h2 id=\"s3\">О-03. Обоснование ограниченно-работоспособного состояния при поверхностной коррозии</h2><p><strong>Ситуация:</strong> коррозия поверхностная, сечение сохранено, но снижено; прогибы в норме.</p><p><strong>Обоснование:</strong></p><ol><li>Приложение Г — «разрушение защитных покрытий, коррозия металла» → ограниченно-</li></ol><p>работоспособное состояние.</p><ol><li>Снижение несущей способности есть, но опасности внезапного разрушения нет (п. 3.18).</li><li>Необходимы антикоррозионная защита и мониторинг (п. 4.5).</li></ol><p><strong>Вывод:</strong> ОР; рекомендации — очистка, защитное покрытие, наблюдение.</p><p><strong>См.:</strong> Д-К03-02.</p><hr><h2 id=\"s4\">О-04. Обоснование замены конструкций вместо усиления</h2><p><strong>Ситуация:</strong> коррозия сквозная, сечение утрачено на большей части длины, узлы разрушены.</p><p><strong>Обоснование:</strong></p><ol><li>Усиление (п. 3.27) повышает несущую способность существующей конструкции; при утрате</li></ol><p>сечения усиливать нечего — конструкция не может быть включена в работу.</p><ol><li>Восстановление (п. 3.3) предполагает доведение до первоначального уровня; при полной</li></ol><p>утрате это фактически новое строительство.</p><ol><li>Экономически и технически замена равна восстановлению, но обеспечивает нормируемую</li></ol><p>надёжность.</p><p><strong>Вывод:</strong> «Выполнить замену … по отдельно разработанному проекту».</p><p><strong>См.:</strong> Ш-РЕК, Т-003, Т-022.</p><hr><h2 id=\"s5\">О-05. Обоснование усиления (когда замена невозможна)</h2><p><strong>Ситуация:</strong> историческое здание, ОКН, замена недопустима; сечение снижено частично.</p><p><strong>Обоснование:</strong></p><ol><li>Усиление — повышение несущей способности по сравнению с фактическим состоянием (п. 3.27).</li><li>Для ОКН — сохранение подлинности, работы по ГОСТ Р 55567-2013 и заданию КГИОП.</li><li>Требуется поверочный расчёт усиленного элемента (п. 3.20) и проект усиления.</li></ol><p><strong>Вывод:</strong> «Выполнить усиление … по специально разработанному проекту, согласованному с КГИОП».</p><p><strong>См.:</strong> О-07, Т-022.</p><hr><h2 id=\"s6\">О-06. Обоснование отказа от поверочного расчёта</h2><p><strong>Ситуация:</strong> конструкция полностью разрушена или утрачена.</p><p><strong>Обоснование:</strong></p><ol><li>Поверочный расчёт выполняется по фактическим геометрии, прочности и расчётной схеме</li></ol><p>(п. 3.20); при утрате сечения эти данные отсутствуют.</p><ol><li>Категория устанавливается по признакам исчерпания несущей способности (п. 3.1,</li></ol><p>приложения В—Д).</p><ol><li>Практика: «выполнение поверочных расчётов не требуется» (архив ТЗ).</li></ol><p><strong>Вывод:</strong> категория А без расчёта; обоснование — в тексте.</p><p><strong>См.:</strong> Д-К10-02.</p><hr><h2 id=\"s7\">О-07. Обоснование применения ГОСТ Р 55567-2013 для ОКН</h2><p><strong>Ситуация:</strong> объект — выявленный объект культурного наследия.</p><p><strong>Обоснование:</strong></p><ol><li>ГОСТ 31937-2024 регулирует обследование конструкций, но не учитывает режим ОКН.</li><li>ГОСТ Р 55567-2013 устанавливает порядок инженерно-технических исследований на объектах</li></ol><p>культурного наследия.</p><ol><li>Работы ведутся по заданию КГИОП; выводы формулируются со ссылкой на оба документа.</li></ol><p><strong>Вывод:</strong> двойная ссылка в выводах; историческая справка в разделе «Результаты».</p><p><strong>См.:</strong> Т-111, Ш-ОП.</p><hr><h2 id=\"s8\">О-08. Обоснование категории «работоспособное» при наличии дефектов</h2><p><strong>Ситуация:</strong> есть отделочные повреждения, не влияющие на несущую способность.</p><p><strong>Обоснование:</strong></p><ol><li>Работоспособное состояние — часть параметров не отвечает нормам, но работоспособность</li></ol><p>и механическая безопасность обеспечены (п. 3.21).</p><ol><li>Дефекты не снижают несущую способность; расчёт не требуется.</li><li>Эксплуатация без ограничений (п. 4.5).</li></ol><p><strong>Вывод:</strong> работоспособное; рекомендации — косметический ремонт.</p><p><strong>См.:</strong> КРИТЕРИИ, п. 6.</p><hr><h2 id=\"s9\">О-09. Обоснование периодичности следующего обследования</h2><p><strong>Обоснование:</strong></p><ol><li>Первое обследование — не позднее 2 лет после ввода; далее не реже 1 раза в 10 лет;</li></ol><p>для неблагоприятных условий — 1 раз в 5 лет (п. 4.2).</p><ol><li>Рекомендуемый срок следующего обследования указывают в отчёте (п. 4.2).</li><li>Для аварийных и ОР — мониторинг до устранения (пп. 4.5, 6.3).</li></ol><p><strong>Вывод:</strong> «Рекомендуемый срок следующего обследования — не позднее 20__ г.»</p><p><strong>См.:</strong> КРИТЕРИИ, п. 1.</p><hr><h2 id=\"s10\">О-10. Обоснование письменного информирования при аварии</h2><p><strong>Обоснование:</strong></p><ol><li>П. 4.6 обязывает письменно информировать заказчика, собственника, эксплуатирующую</li></ol><p>организацию при выявлении дефектов, способных привести к обрушению.</p><ol><li>Информирование — не рекомендация, а требование стандарта.</li><li>Факт информирования фиксируется в заключении.</li></ol><p><strong>Вывод:</strong> отдельный абзац в выводах + письмо.</p><p><strong>См.:</strong> КРИТЕРИИ, п. 1.2.</p><hr><h2 id=\"s11\">О-11. Обоснование недостаточности визуального обследования</h2><p><strong>Ситуация:</strong> визуально выявлены дефекты, снижающие несущую способность.</p><p><strong>Обоснование:</strong></p><ol><li>П. 5.1.11: если выявлены дефекты, снижающие прочность, устойчивость и жёсткость,</li></ol><p>и требуется оценка несущей способности — детальное обследование проводится.</p><ol><li>П. 5.1.12: при характерных трещинах и перекосах — дополнительные инженерно-геологические</li></ol><p>изыскания.</p><ol><li>Без детального обследования нельзя установить категорию ОР или А обоснованно.</li></ol><p><strong>Вывод:</strong> назначить детальное обследование, вскрытия, испытания материалов.</p><p><strong>См.:</strong> МЕТОДИКИ, п. 1.</p><hr><h2 id=\"s12\">О-12. Обоснование причин трещин по их рисунку</h2><p><strong>Обоснование (приложение В, пп. 2.6—2.9):</strong></p><ol><li>Параболические трещины, расходящиеся книзу от средней части здания — просадка грунта</li></ol><p>в средней части.</p><ol><li>Раскрытие, увеличивающееся кверху, наклонные/параболические от краёв — просадка крайних</li></ol><p>частей или твёрдое включение под средней частью.</p><ol><li>Близкая к вертикальной с раскрытием кверху — разлом из-за жёсткой опоры в грунте.</li><li>Одинаковое раскрытие по высоте со смещением части здания — просадка части здания.</li></ol><p><strong>Вывод:</strong> причина — неравномерная осадка; требуется проверка основания (шурфы, геология).</p><p><strong>См.:</strong> Д-К02-06…09, Д-К01-01.</p><hr><h2 id=\"s13\">О-13. Обоснование требований к объёму испытаний бетона</h2><p><strong>Обоснование:</strong></p><ol><li>Число участков: 3 / 6 / 9 в зависимости от задачи (п. 5.3.1.8).</li><li>Число конструкций — не менее трёх (п. 5.3.1.8).</li><li>Участки — в местах наименьшей прочности, в зонах, определяющих несущую способность,</li></ol><p>и в местах дефектов (п. 5.3.1.7).</p><ol><li>Средства измерений — поверены (п. 4.10).</li></ol><p><strong>Вывод:</strong> объём испытаний соответствует ГОСТ; результаты представительны.</p><p><strong>См.:</strong> МЕТОДИКИ, п. 5.1.</p><hr><h2 id=\"s14\">О-14. Обоснование запрета оценки стали по твёрдости</h2><p><strong>Обоснование:</strong></p><ol><li>П. 5.3.3.10 прямо запрещает определять предел текучести и предел прочности по косвенным</li></ol><p>характеристикам (твёрдости).</p><ol><li>П. 5.3.3.11 запрещает портативные РФА там, где нет точности по C, S, P.</li><li>Требуются испытания образцов (ГОСТ 1497, 9454) и спектральный анализ (ГОСТ 18895 /</li></ol><p>ГОСТ Р 54153-2010).</p><p><strong>Вывод:</strong> при отсутствии документации — отбор проб и лабораторные испытания.</p><p><strong>См.:</strong> МЕТОДИКИ, п. 5.4.</p><hr><h2 id=\"s15\">О-15. Обоснование мероприятий по вентиляции и гидроизоляции подвала</h2><p><strong>Обоснование:</strong></p><ol><li>Причины коррозии и гнили — увлажнение и отсутствие вентиляции (практика архива;</li></ol><p>п. 5.3.6.6 — причины конденсата).</p><ol><li>Без устранения причин замена конструкций даст повторное поражение.</li><li>Мероприятия: восстановление гидроизоляции, водоотвода, вентиляции (п. 5.4, 5.4.8).</li></ol><p><strong>Вывод:</strong> включить в рекомендации как обязательные сопутствующие работы.</p><p><strong>См.:</strong> Д-К09-01, Д-К01-03.</p>", "toc": [["s1", "О-01. Обоснование аварийного состояния при сквозной коррозии металлических балок", 2], ["s2", "О-02. Обоснование аварийного состояния при разрушении заделки балки в стену", 2], ["s3", "О-03. Обоснование ограниченно-работоспособного состояния при поверхностной коррозии", 2], ["s4", "О-04. Обоснование замены конструкций вместо усиления", 2], ["s5", "О-05. Обоснование усиления (когда замена невозможна)", 2], ["s6", "О-06. Обоснование отказа от поверочного расчёта", 2], ["s7", "О-07. Обоснование применения ГОСТ Р 55567-2013 для ОКН", 2], ["s8", "О-08. Обоснование категории «работоспособное» при наличии дефектов", 2], ["s9", "О-09. Обоснование периодичности следующего обследования", 2], ["s10", "О-10. Обоснование письменного информирования при аварии", 2], ["s11", "О-11. Обоснование недостаточности визуального обследования", 2], ["s12", "О-12. Обоснование причин трещин по их рисунку", 2], ["s13", "О-13. Обоснование требований к объёму испытаний бетона", 2], ["s14", "О-14. Обоснование запрета оценки стали по твёрдости", 2], ["s15", "О-15. Обоснование мероприятий по вентиляции и гидроизоляции подвала", 2]], "chars": 8734, "plain": " ОБОСНОВАНИЯ «НОРМА → ВЫВОД» Типовые обоснования решений в заключении: почему назначена категория, почему нужна замена, почему расчёт не требуется, почему выбрано усиление. Каждое — со ссылкой на норму. Формулировки — в 07 Шаблоны , категории — в 06 Оценка . О 01. Обоснование аварийного состояния при сквозной коррозии металлических балок Ситуация: балки перекрытия поражены коррозией насквозь, сечение не восстанавливается, сортамент не идентифицируется. Обоснование: 1. Выявлены повреждения, свидетельствующие об исчерпании несущей способности (п. 3.1 ГОСТ 31937 2024 — определение аварийного состояния). 2. Перекрытие относится к несущим конструкциям; его отказ создаёт непосредственную угрозу жизни и здоровью (п. 3.11 — механическая безопасность). 3. Согласно п. 4.5, эксплуатация при аварийном состоянии не допускается; требуются противоаварийные мероприятия и обязательный мониторинг. 4. Поверочный расчёт не выполняется, так как сечение утрачено и расчётная модель не может быть построена по фактическим данным (п. 3.20 — расчёт по фактическим параметрам). Вывод: «В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние надподвального перекрытия». См.: Д К03 01, Д К10 02, Т 001. О 02. Обоснование аварийного состояния при разрушении заделки балки в стену Ситуация: опорная часть балки разрушена, кладка под опорой выкрошена, балка смещена. Обоснование: 1. Приложение В, п. 1.12 — уменьшение площадок опирания против проекта → аварийное состояние (обосновывается расчётом). 2. Приложение В, п. 2.13 — трещины и раздробление кладки под опорами. 3. Потеря опирания — прямой путь к обрушению (п. 3.1). Вывод: аварийное; немедленные страховочные крепления. См.: Д К03 04, Д К02 11. О 03. Обоснование ограниченно работоспособного состояния при поверхностной коррозии Ситуация: коррозия поверхностная, сечение сохранено, но снижено; прогибы в норме. Обоснование: 1. Приложение Г — «разрушение защитных покрытий, коррозия металла» → ограниченно работоспособное состояние. 2. Снижение несущей способности есть, но опасности внезапного разрушения нет (п. 3.18). 3. Необходимы антикоррозионная защита и мониторинг (п. 4.5). Вывод: ОР; рекомендации — очистка, защитное покрытие, наблюдение. См.: Д К03 02. О 04. Обоснование замены конструкций вместо усиления Ситуация: коррозия сквозная, сечение утрачено на большей части длины, узлы разрушены. Обоснование: 1. Усиление (п. 3.27) повышает несущую способность существующей конструкции; при утрате сечения усиливать нечего — конструкция не может быть включена в работу. 2. Восстановление (п. 3.3) предполагает доведение до первоначального уровня; при полной утрате это фактически новое строительство. 3. Экономически и технически замена равна восстановлению, но обеспечивает нормируемую надёжность. Вывод: «Выполнить замену … по отдельно разработанному проекту». См.: Ш РЕК, Т 003, Т 022. О 05. Обоснование усиления (когда замена невозможна) Ситуация: историческое здание, ОКН, замена недопустима; сечение снижено частично. Обоснование: 1. Усиление — повышение несущей способности по сравнению с фактическим состоянием (п. 3.27). 2. Для ОКН — сохранение подлинности, работы по ГОСТ Р 55567 2013 и заданию КГИОП. 3. Требуется поверочный расчёт усиленного элемента (п. 3.20) и проект усиления. Вывод: «Выполнить усиление … по специально разработанному проекту, согласованному с КГИОП». См.: О 07, Т 022. О 06. Обоснование отказа от поверочного расчёта Ситуация: конструкция полностью разрушена или утрачена. Обоснование: 1. Поверочный расчёт выполняется по фактическим геометрии, прочности и расчётной схеме (п. 3.20); при утрате сечения эти данные отсутствуют. 2. Категория устанавливается по признакам исчерпания несущей способности (п. 3.1, приложения В—Д). 3. Практика: «выполнение поверочных расчётов не требуется» (архив ТЗ). Вывод: категория А без расчёта; обоснование — в тексте. См.: Д К10 02. О 07. Обоснование применения ГОСТ Р 55567 2013 для ОКН Ситуация: объект — выявленный объект культурного наследия. Обоснование: 1. ГОСТ 31937 2024 регулирует обследование конструкций, но не учитывает режим ОКН. 2. ГОСТ Р 55567 2013 устанавливает порядок инженерно технических исследований на объектах культурного наследия. 3. Работы ведутся по заданию КГИОП; выводы формулируются со ссылкой на оба документа. Вывод: двойная ссылка в выводах; историческая справка в разделе «Результаты». См.: Т 111, Ш ОП. О 08. Обоснование категории «работоспособное» при наличии дефектов Ситуация: есть отделочные повреждения, не влияющие на несущую способность. Обоснование: 1. Работоспособное состояние — часть параметров не отвечает нормам, но работоспособность и механическая безопасность обеспечены (п. 3.21). 2. Дефекты не снижают несущую способность; расчёт не требуется. 3. Эксплуатация без ограничений (п. 4.5). Вывод: работоспособное; рекомендации — косметический ремонт. См.: КРИТЕРИИ, п. 6. О 09. Обоснование периодичности следующего обследования Обоснование: 1. Первое обследование — не позднее 2 лет после ввода; далее не реже 1 раза в 10 лет; для неблагоприятных условий — 1 раз в 5 лет (п. 4.2). 2. Рекомендуемый срок следующего обследования указывают в отчёте (п. 4.2). 3. Для аварийных и ОР — мониторинг до устранения (пп. 4.5, 6.3). Вывод: «Рекомендуемый срок следующего обследования — не позднее 20 г.» См.: КРИТЕРИИ, п. 1. О 10. Обоснование письменного информирования при аварии Обоснование: 1. П. 4.6 обязывает письменно информировать заказчика, собственника, эксплуатирующую организацию при выявлении дефектов, способных привести к обрушению. 2. Информирование — не рекомендация, а требование стандарта. 3. Факт информирования фиксируется в заключении. Вывод: отдельный абзац в выводах + письмо. См.: КРИТЕРИИ, п. 1.2. О 11. Обоснование недостаточности визуального обследования Ситуация: визуально выявлены дефекты, снижающие несущую способность. Обоснование: 1. П. 5.1.11: если выявлены дефекты, снижающие прочность, устойчивость и жёсткость, и требуется оценка несущей способности — детальное обследование проводится. 2. П. 5.1.12: при характерных трещинах и перекосах — дополнительные инженерно геологические изыскания. 3. Без детального обследования нельзя установить категорию ОР или А обоснованно. Вывод: назначить детальное обследование, вскрытия, испытания материалов. См.: МЕТОДИКИ, п. 1. О 12. Обоснование причин трещин по их рисунку Обоснование (приложение В, пп. 2.6—2.9): 1. Параболические трещины, расходящиеся книзу от средней части здания — просадка грунта в средней части. 2. Раскрытие, увеличивающееся кверху, наклонные/параболические от краёв — просадка крайних частей или твёрдое включение под средней частью. 3. Близкая к вертикальной с раскрытием кверху — разлом из за жёсткой опоры в грунте. 4. Одинаковое раскрытие по высоте со смещением части здания — просадка части здания. Вывод: причина — неравномерная осадка; требуется проверка основания (шурфы, геология). См.: Д К02 06…09, Д К01 01. О 13. Обоснование требований к объёму испытаний бетона Обоснование: 1. Число участков: 3 / 6 / 9 в зависимости от задачи (п. 5.3.1.8). 2. Число конструкций — не менее трёх (п. 5.3.1.8). 3. Участки — в местах наименьшей прочности, в зонах, определяющих несущую способность, и в местах дефектов (п. 5.3.1.7). 4. Средства измерений — поверены (п. 4.10). Вывод: объём испытаний соответствует ГОСТ; результаты представительны. См.: МЕТОДИКИ, п. 5.1. О 14. Обоснование запрета оценки стали по твёрдости Обоснование: 1. П. 5.3.3.10 прямо запрещает определять предел текучести и предел прочности по косвенным характеристикам (твёрдости). 2. П. 5.3.3.11 запрещает портативные РФА там, где нет точности по C, S, P. 3. Требуются испытания образцов (ГОСТ 1497, 9454) и спектральный анализ (ГОСТ 18895 / ГОСТ Р 54153 2010). Вывод: при отсутствии документации — отбор проб и лабораторные испытания. См.: МЕТОДИКИ, п. 5.4. О 15. Обоснование мероприятий по вентиляции и гидроизоляции подвала Обоснование: 1. Причины коррозии и гнили — увлажнение и отсутствие вентиляции (практика архива; п. 5.3.6.6 — причины конденсата). 2. Без устранения причин замена конструкций даст повторное поражение. 3. Мероприятия: восстановление гидроизоляции, водоотвода, вентиляции (п. 5.4, 5.4.8). Вывод: включить в рекомендации как обязательные сопутствующие работы. См.: Д К09 01, Д К01 03. "}, {"id": "reference", "file": "09_Справочники/СПРАВОЧНИК.md", "title": "СПРАВОЧНИК", "section": "09_Справочники", "html": "<h1>СПРАВОЧНИК</h1><blockquote><p>Прикладные данные для заключений: сортаменты, материалы, приборы, сроки службы, типовые значения. Часть — из практики архива, часть — нормативная. <strong>Внимание:</strong> таблицы проката и материалов приведены как ориентир для полевой идентификации. Точные значения принимать по действующим стандартам (ГОСТ 8239, ГОСТ 5781, СП 15.13330.2020 и т. д.) и указывать ссылку в заключении.</p></blockquote><hr><h2 id=\"s1\">1. СОРТАМЕНТЫ, ВСТРЕЧАЮЩИЕСЯ В ИСТОРИЧЕСКОЙ ЗАСТРОЙКЕ</h2><h3 id=\"s2\">1.1 Двутавры по ОСТ 16-1926</h3><p>Исторический сортамент, встречается в перекрытиях и лестницах до 1940-х гг. В заключениях указывают как «двутавр № … по ОСТ 16-1926».</p><div class=\"tablewrap\"><table><thead><tr><th>№ профиля</th><th>Высота, мм</th><th>Ширина полки, мм</th><th>Масса 1 м, кг</th></tr></thead><tbody><tr><td>10</td><td>100</td><td>68</td><td>11,0</td></tr><tr><td>12</td><td>120</td><td>74</td><td>13,7</td></tr><tr><td>14</td><td>140</td><td>80</td><td>16,9</td></tr><tr><td>16</td><td>160</td><td>85</td><td>20,1</td></tr><tr><td>18</td><td>180</td><td>90</td><td>23,4</td></tr><tr><td>20</td><td>200</td><td>95</td><td>27,0</td></tr><tr><td>22</td><td>220</td><td>100</td><td>31,0</td></tr><tr><td>24</td><td>240</td><td>106</td><td>36,0</td></tr><tr><td>27</td><td>270</td><td>112</td><td>42,0</td></tr><tr><td>30</td><td>300</td><td>120</td><td>51,0</td></tr></tbody></table></div><blockquote><p>Значения ориентировочные (по историческому сортаменту); при идентификации измерять фактические размеры и сверять по первоисточнику. <code>[требует проверки по официальному тексту ОСТ 16-1926]</code></p></blockquote><h3 id=\"s3\">1.2 Современные двутавры (ГОСТ 8239-89, ГОСТ Р 57837-2017)</h3><ul><li>20Б1, 18Б1 и др. — балочные нормальные (ГОСТ Р 57837-2017).</li><li>20, 22, 24 — по ГОСТ 8239-89.</li><li>В архиве встречаются расчёты на «балку металл 20Б1» — ТехЭкспертиза, Блохина, 15.</li></ul><h3 id=\"s4\">1.3 Швеллеры</h3><ul><li>ГОСТ 8240-97 — современные.</li><li>Старые — по ОСТ/ГОСТ довоенных лет; идентифицировать по фактическим размерам.</li></ul><hr><h2 id=\"s5\">2. МАТЕРИАЛЫ</h2><h3 id=\"s6\">2.1 Кирпич и кладочный раствор</h3><ul><li>Кирпич керамический — ГОСТ 530-2012.</li><li>Камни стеновые из горных пород — ГОСТ 4001.</li><li>Растворы строительные — ГОСТ 5802; раствор кладочный — ГОСТ 28013.</li><li>Марки раствора в исторической застройке: известково-песчаный, цементно-известковый,</li></ul><p>реже цементный.</p><ul><li>Прочность кладки — СП 15.13330.2020 (таблицы расчётных сопротивлений).</li></ul><h3 id=\"s7\">2.2 Бетон</h3><ul><li>ГОСТ 26633-2015 — тяжёлые и мелкозернистые бетоны.</li><li>ГОСТ 10180 — прочность по контрольным образцам.</li><li>ГОСТ 22690 — неразрушающий контроль.</li><li>ГОСТ 17624 — ультразвуковой метод.</li><li>ГОСТ 28570 — керны.</li><li>ГОСТ 12730.0—12730.5 — плотность, влажность, водопоглощение, пористость, водонепроницаемость.</li><li>ГОСТ 10060 — морозостойкость.</li></ul><h3 id=\"s8\">2.3 Арматура</h3><ul><li>ГОСТ 5781-82 — горячекатаная для ж.-б. (А240, А300, А400, А500 и др.).</li><li>ГОСТ 12004 — методы испытаний на растяжение.</li><li>Классы и нормативные сопротивления менялись по годам: при обследовании обязательно</li></ul><p>устанавливать год проектирования и постройки (п. 5.3.1.13 ГОСТ 31937-2024).</p><h3 id=\"s9\">2.4 Сталь</h3><ul><li>ГОСТ 27751-2014 — надёжность строительных конструкций.</li><li>ГОСТ 1497, 9454, 28870 — механические испытания.</li><li>ГОСТ 23118-2019 — металлоконструкции, допуски и дефекты.</li><li>ГОСТ Р 54153-2010 — атомно-эмиссионный анализ стали.</li></ul><h3 id=\"s10\">2.5 Древесина</h3><ul><li>ГОСТ 16483.1 — плотность; 16483.7 — влажность; 16483.10 — сжатие вдоль волокон;</li></ul><p>16483.11 — поперёк; 16483.3 — статический изгиб; 16483.9 — модуль упругости; 16483.2 — смятие; 16483.5 и 16483.12 — скалывание.</p><ul><li>ГОСТ 18610 — стойкость к биоразрушению; ГОСТ 20022.0 — защищённость.</li><li>Нормативная влажность для несущих конструкций — до 12—15 % (уточнять по СП 64.13330.2017).</li></ul><hr><h2 id=\"s11\">3. НОРМАТИВНЫЕ ЗНАЧЕНИЯ, ЧАСТО НУЖНЫЕ В ТЕКСТЕ</h2><div class=\"tablewrap\"><table><thead><tr><th>Параметр</th><th>Значение</th><th>Норма</th></tr></thead><tbody><tr><td>Глубина шурфа у фундамента</td><td>подошва + 0,15 м</td><td>ГОСТ 31937-2024, 5.2.7</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (А240)</td><td>0,5 мм</td><td>прил. В, 1.6</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (А300—А600)</td><td>0,4 мм</td><td>прил. В, 1.6</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (прочие)</td><td>0,3 мм</td><td>прил. В, 1.6</td></tr><tr><td>Трещины вдоль арматуры</td><td>3 мм (на опоре — аварийное)</td><td>прил. В, 1.4</td></tr><tr><td>Прогиб плит перекрытий</td><td>1/150</td><td>прил. В, 1.9</td></tr><tr><td>Прогиб преднапряжённых балок</td><td>1/300</td><td>прил. В, 1.9</td></tr><tr><td>Прогиб преднапряжённых ферм</td><td>1/700</td><td>прил. В, 1.9</td></tr><tr><td>Трещины кладки (вертикальные)</td><td>0,1—0,5 мм; ≥ 2 на 1 м</td><td>прил. В, 2.10</td></tr><tr><td>Срок первого обследования</td><td>≤ 2 лет после ввода</td><td>4.2</td></tr><tr><td>Периодичность обследования</td><td>10 лет; 5 лет — неблагоприятные условия</td><td>4.2</td></tr><tr><td>Число участков испытания бетона</td><td>3 / 6 / 9</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке бетона</td><td>не менее 3</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке армирования</td><td>не менее 3</td><td>5.3.1.10</td></tr><tr><td>Число стержней для испытаний</td><td>не менее 3</td><td>5.3.1.11</td></tr><tr><td>Число участков по рисунку профиля</td><td>не менее 5</td><td>5.3.1.12</td></tr><tr><td>Сечения при измерении коррозии</td><td>не менее 3 по длине, по 3 измерения</td><td>5.3.3.13</td></tr></tbody></table></div><hr><h2 id=\"s12\">4. СРОКИ СЛУЖБЫ (ориентировочно, для оценки «длительной эксплуатации»)</h2><div class=\"tablewrap\"><table><thead><tr><th>Конструкция</th><th>Ориентировочный срок</th></tr></thead><tbody><tr><td>Металлические балки перекрытия без защиты от коррозии</td><td>30—50 лет до существенного поражения</td></tr><tr><td>Деревянные перекрытия при нормальном режиме</td><td>50—80 лет; при протечках — 10—20</td></tr><tr><td>Кирпичная кладка</td><td>100—150 лет (при отсутствии замачивания)</td></tr><tr><td>Штукатурный фасад</td><td>20—30 лет</td></tr><tr><td>Кровля из наплавляемых материалов</td><td>10—15 лет</td></tr><tr><td>Гидроизоляция подвала</td><td>20—30 лет</td></tr></tbody></table></div><blockquote><p>Ориентировочные значения для формулировки «длительный срок эксплуатации»; точные нормативы в заключении не обязательны, достаточно факта превышения срока службы.</p></blockquote><hr><h2 id=\"s13\">5. ПРИБОРЫ И ИХ ПРИМЕНЕНИЕ</h2><div class=\"tablewrap\"><table><thead><tr><th>Прибор</th><th>Что измеряет</th><th>Метод</th><th>Норма</th></tr></thead><tbody><tr><td>Молоток Физделя</td><td>прочность бетона</td><td>пластическая деформация</td><td>экспертный, предварительный</td></tr><tr><td>Склерометр (Кашкарова, Шмидта)</td><td>прочность бетона</td><td>отскок/внедрение</td><td>ГОСТ 22690</td></tr><tr><td>Ультразвуковой прибор (ПУЛЬСАР и др.)</td><td>прочность бетона</td><td>скорость распространения</td><td>ГОСТ 17624</td></tr><tr><td>Толщиномер А 1207</td><td>толщина металла</td><td>ультразвук</td><td>поверка</td></tr><tr><td>Магнитный искатель (например, ИПА)</td><td>защитный слой, диаметр арматуры</td><td>магнитный</td><td>ГОСТ 22904</td></tr><tr><td>Влагомер</td><td>влажность древесины</td><td>резистивный/диэлектрический</td><td>ГОСТ 16483.7</td></tr><tr><td>Лупа ЛИ-3-10х</td><td>ширина трещин</td><td>визуальный</td><td>—</td></tr><tr><td>Щупы калиброванные</td><td>ширина трещин</td><td>визуальный</td><td>—</td></tr><tr><td>Нивелир/тахеометр</td><td>прогибы, крены, осадки</td><td>геометрическое нивелирование</td><td>ГОСТ 24846</td></tr><tr><td>Тепловизор</td><td>теплопотери, мостики холода</td><td>инфракрасный</td><td>ГОСТ 26629 (уточнить)</td></tr></tbody></table></div><hr><h2 id=\"s14\">6. ТИПОВЫЕ КОНСТРУКТИВНЫЕ РЕШЕНИЯ ИЗ АРХИВА</h2><h3 id=\"s15\">6.1 Перекрытие по металлическим балкам</h3><ul><li>Балки — двутавр (ОСТ 16-1926), шаг 850—1100 мм, пролёт 1,6—4,25 м.</li><li>Опирание — на кирпичные стены (заделка) и металлические перемычки.</li><li>Межбалочное заполнение — бетон на кирпичном бое, сводики, деревянные щиты.</li><li>Покрытие — цементно-песчаная стяжка, метлахская плитка, асфальтобетон, дощатый настил.</li><li>Типовые дефекты — сквозная коррозия, разрушение заделки, прогибы.</li></ul><h3 id=\"s16\">6.2 Лестницы</h3><ul><li>Площадки — по металлическим балкам, заделанным в стены.</li><li>Марши — по двум металлическим косоурам, ступени сборные каменные.</li><li>Встречаются бескосоурные консольные каменные ступени.</li><li>Типовые дефекты — коррозия косоуров, разрушение заделки, износ ступеней, утрата маршей.</li></ul><h3 id=\"s17\">6.3 Балконы и эркеры</h3><ul><li>Плиты по металлическим консольным балкам, заделанным в кладку.</li><li>Ограждение — металл, бетон, дерево.</li><li>Типовые дефекты — коррозия консольных балок, разрушение плиты, потеря заделки,</li></ul><p>отсутствие гидроизоляции.</p><h3 id=\"s18\">6.4 Кирпичные стены</h3><ul><li>Толщина 760—880 мм (историческая застройка), кладка из красного глиняного кирпича</li></ul><p>на известково-песчаном растворе.</p><ul><li>Перемычки — металлические двутавровые, клинчатые, арочные.</li><li>Типовые дефекты — трещины от осадок, увлажнение, деструкция, выпучивание.</li></ul><hr><h2 id=\"s19\">7. ФОРМАТЫ ШИФРОВ И ОБОЗНАЧЕНИЙ</h2><ul><li>Шифр работы: <code>06/1-08-2026-АВР</code> — <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>.</li><li>Разделы: <code>.../С</code> — содержание, <code>.../ТЗ</code> — техзадание.</li><li>Оси: <code>1-5/А-Г</code>; отметки: <code>0.000</code>, <code>+0.660</code>, <code>-1.480</code>.</li><li>Помещения: <code>кв. № 24</code>, <code>пом. 2-Н</code>, <code>3-Н</code>, <code>ЛК № 1</code>.</li></ul><hr><h2 id=\"s20\">8. ПОЛЕЗНЫЕ ССЫЛКИ НА ВНУТРЕННИЕ РАЗДЕЛЫ</h2><div class=\"tablewrap\"><table><thead><tr><th>Вопрос</th><th>Раздел</th></tr></thead><tbody><tr><td>Что означает термин</td><td><code>02_Термины\\ТЕЗАУРУС.md</code></td></tr><tr><td>Что проверять в элементе</td><td><code>03_Конструктив\\ИНДЕКС_КОНСТРУКТИВА.md</code></td></tr><tr><td>Какой дефект и какая категория</td><td><code>04_Дефекты\\КАТАЛОГ_ДЕФЕКТОВ.md</code></td></tr><tr><td>Как измерять</td><td><code>05_Методики_обследования\\МЕТОДИКИ.md</code></td></tr><tr><td>Какую категорию ставить</td><td><code>06_Оценка_состояния\\КРИТЕРИИ_ОЦЕНКИ.md</code></td></tr><tr><td>Как написать</td><td><code>07_Шаблоны_заключений\\ШАБЛОНЫ.md</code></td></tr><tr><td>Как обосновать</td><td><code>08_Обоснования\\ОБОСНОВАНИЯ.md</code></td></tr></tbody></table></div>", "toc": [["s1", "1. СОРТАМЕНТЫ, ВСТРЕЧ
