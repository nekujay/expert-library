, "Д-К09-02. Разрушение трубопроводов, протечки", 3], ["s81", "К-10. Аварийные ситуации", 2], ["s82", "Д-К10-01. Прогрессирующее обрушение", 3], ["s83", "Д-К10-02. Исчерпание несущей способности", 3], ["s84", "БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ»", 2]], "chars": 17781, "plain": " КАТАЛОГ ДЕФЕКТОВ (Д …) Дефект → признаки → причины → категория состояния → норма → источник. Основа: ГОСТ 31937 2024, приложения В (ж. б. и каменные), Г (стальные), Д (деревянные), пп. 5.2—5.3, плюс практика архива ТЗ. Категории: Н — нормативное, Р — работоспособное, ОР — ограниченно работоспособное, А — аварийное. Для капремонта: признаки износа — приложение А [СП 547]( /doc/sp547); дефекты к устранению — приложение Г [СП 368]( /doc/sp368). К 01. Основания и фундаменты Д К01 01. Неравномерная осадка основания Признаки: перекос здания, трещины в стенах с характерным рисунком, отклонение от вертикали, расхождение швов, деформации в надфундаментных конструкциях. Причины: слабые/неоднородные грунты, подтопление, утечки из сетей, дополнительная нагрузка, разуплотнение грунта. Категория: ОР; при прогрессирующем развитии и исчерпании несущей способности — А. Норма: ГОСТ 31937 2024, п. 5.2.14; приложение В (2.1, 2.3). Источник: архив ТЗ (178 файлов с «осадк»). Д К01 02. Разрушение тела фундамента Признаки: выветривание, выкрашивание, отколы, обнажение бутовой кладки, каверны, потеря сечения. Причины: агрессивные воды, замачивание, замораживание, долгий срок эксплуатации. Категория: ОР → А при потере несущей способности. Норма: п. 5.2.13, 5.2.15. Д К01 03. Отсутствие или разрушение гидроизоляции Признаки: сырость, высолы, подтопление подвала, коррозия металла, гниль дерева. Категория: ОР (по совокупности), сама по себе — дефект условий эксплуатации. Норма: п. 5.2.3, 5.2.15. Д К01 04. Разуплотнение грунта Признаки: просадки полов, крены, локальные провалы. Диагностика: статическое/динамическое зондирование, геофизика (п. 5.2.6). Категория: ОР. Д К01 05. Крен здания/фундамента Признаки: отклонение от вертикали, неравномерные осадки. Категория: ОР; при угрозе потери устойчивости — А (п. 3.1). Норма: п. 5.2.14; форма заключения, поз. 15 приложения А. К 02. Каменные (кирпичные) стены Д К02 01. Трещины вертикальные и наклонные Признаки: раскрытие, протяжённость, направление, пересечение рядов кладки. Причины: перегрузка, просадка, температурные деформации, недостаточное армирование. Порог: вертикальные трещины раскрытием 0,1—0,5 мм , пересекающие два ряда кладки и более, при двух и более трещинах на 1 м вертикально нагруженной стены → ОР (приложение В, п. 2.10). Норма: приложение В, пп. 2.6—2.14. Д К02 02. Выпучивание (деформация стены) Причины: боковое давление грунта и материалов, распорные конструкции, увеличение эксцентриситетов, большая гибкость из за разрыва связей, смещение опор балок к краю стены, одностороннее оттаивание кладки, температурные деформации (приложение В, п. 2.2). Категория: ОР. Д К02 03. Отклонение стены от вертикали Причины: неравномерные осадки, недостаточность или разрыв поперечных связей. Категория: ОР. Д К02 04. Отколы углов, пробоины, выбоины, борозды Причины: дефекты строительства, механические воздействия. Категория: ОР (при значительном снижении сечения — расчётом). Д К02 05. Увлажнение кладки, высолы, капиллярный подсос Причины: атмосферные осадки, конденсация, брызги, отсутствие гидроизоляции. Категория: ОР в сочетании с деструкцией; отдельно — фактор риска. Д К02 06…09. Трещины как диагностика причины (приложение В, пп. 2.6—2.9) Рисунок трещин Причина Параболические, ветви расходятся книзу от средней части здания просадка грунта в средней части Раскрытие увеличивается кверху; наклонные/параболические от краёв просадка крайних частей или твёрдое включение под средней частью Близкая к вертикальной, раскрытие увеличивается кверху разлом из за жёсткой опоры в грунте под трещиной Близкая к вертикальной, одинаковое раскрытие по высоте со смещением части здания просадка части здания Категория: ОР с обязательным расчётом. Д К02 10. Разрушение перемычек Признаки: горизонтальные и косые трещины по швам рядовых, клинчатых, арочных перемычек; вертикальные трещины в середине пролёта; выпадение камней; сквозная коррозия металлических перемычек. Причины: перегрузка, низкая прочность материалов, недостаточное армирование, коррозия. Категория: ОР; при сквозной коррозии и выпадении камней — А. Норма: приложение В, п. 2.11; практика архива (перемычки из двутавров). Д К02 11. Трещины под опорами и опорными подушками Признаки: веерообразные трещины, скалывание и раздробление кладки под опорами балок, ферм, перемычек, козырьков. Причины: перегрузка, недостаточная глубина опирания, недостаточная несущая способность подушки. Категория: ОР. Д К02 12. Шелушение, выветривание, деструкция кладки Причины: агрессивные среды, высокий нагрев, пожар, попеременное замораживание оттаивание, увлажнение высыхание, биопоражения (приложение В, п. 2.15). Категория: ОР. К 03. Перекрытия Д К03 01. Сквозная коррозия металлических балок Признаки: полное поражение сечения («до 100 %»), отслоение продуктов коррозии, провисание, потеря геометрии, обрушение участков. Причины: длительный срок эксплуатации без противокоррозионной защиты, протечки, затопление подвала, недостаточная вентиляция. Категория: А (исчерпание несущей способности). Норма: приложение Г; п. 5.3.3.12—5.3.3.13. Источник: практика обследований; последние экспертизы (объект исторической застройки). Д К03 02. Поверхностная коррозия металла Признаки: поражение без потери сечения насквозь, указание процента (например, «до 11 %»). Категория: ОР при снижении сечения; при незначительном — Р. Норма: приложение Г («разрушение защитных покрытий, коррозия металла» → ОР). Д К03 03. Прогиб балок перекрытия Признаки: видимое провисание, отклонение от горизонтали, зыбкость пола. Порог: относительные прогибы, превышающие для плит перекрытий и покрытий 1/150 , для преднапряжённых стропильных балок 1/300 , ферм 1/700 → основание для А (приложение В, п. 1.9). Категория: ОР; при превышении порогов — А (с расчётом). Д К03 04. Разрушение заделки балки в стену Признаки: трещины у опоры, выпадение кладки, коррозия опорной части, смещение балки. Причины: протечки, коррозия, недостаточная глубина заделки, перегрузка. Категория: А при потере опирания; иначе ОР. Д К03 05. Обрушение участка перекрытия Признаки: падение балок и заполнения, провалы. Категория: А ; немедленные противоаварийные меры (п. 4.5, 4.6). Д К03 06. Недостаточная площадка опирания Признаки: смещение балки к краю стены, опирание менее проектного. Норма: приложение В, п. 1.12 — «уменьшение площадок опирания по сравнению с проектными» → А (обосновывается расчётом). Категория: А (по расчёту). Д К03 07. Промерзание, протечки, конденсат Причины: разрушение кровли, гидроизоляции, вентиляции; недостаточное утепление. Следствие: коррозия металла, гниль дерева. Категория: ОР по совокупности. Д К03 10. Трещины в железобетоне Пороги (приложение В, п. 1.6): нормальные трещины в изгибаемых и растянутых элементах шириной более: А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм → ОР. Опасные: наклонные со смещением участков бетона, трещины, пересекающие арматуру → А (п. 1.8); трещины с разветвлёнными концами при перегрузке → А (п. 1.7). Трещины вдоль арматуры: до 3 мм → ОР; на опорных участках — А (п. 1.4). Д К03 11. Сколы бетона в сжатой зоне Причина: механические воздействия. Категория: ОР (приложение В, п. 1.2). Д К03 12. Отслоение защитного слоя Причина: коррозия арматуры. Категория: ОР; на опорном участке — А (приложение В, п. 1.5). Д К03 13. Коррозия арматуры и закладных деталей Признаки: волосяные трещины вдоль арматуры, ржавые потёки, уменьшение сечения стержней. Оценка: площадь поражения, глубина, остаточное сечение (п. 5.3.1.18). Категория: ОР; при разрыве арматуры, выпучивании сжатой арматуры — А (пп. 1.10—1.13). Д К03 14. Выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона Категория: А (приложение В, п. 1.11). Д К03 15. Разрыв или смещение поперечной арматуры в зоне наклонных трещин Категория: А (п. 1.13). Д К03 16. Отрыв анкеров от пластин закладных деталей, расстройство стыков Категория: А (п. 1.14). Д К03 20. Гниль деревянных элементов Признаки: размягчение, потеря сечения, грибок, запах, влажность выше нормы. Причины: протечки, конденсат, отсутствие гидроизоляции между деревом и камнем, недостаточная вентиляция. Норма: п. 5.3.4.3 (ГОСТ 18610), 5.3.6.7; приложение Д. Категория: ОР; при потере сечения и целостности наката — А (приложение Д). Д К03 21. Прогиб деревянных балок Категория: ОР; при превышении предельного — А (обосновывается расчётом). Д К03 22. Расстройство узлов сопряжения дерева Признаки: сдвиги, обмятие во врубках, ослабление скруток, хомутов. Категория: ОР; при потере связи — А. Д К03 23. Отсутствие элемента наката, потеря целостности Категория: А (приложение Д, п. 1). Д К03 24. Увлажнение утеплителя, отсутствие пароизоляции Норма: п. 5.3.6.11. Следствие: промерзание, гниль, коррозия. Категория: ОР по совокупности. К 04. Балконы, лоджии, эркеры, лестницы Д К04 01. Разрушение балконной плиты Признаки: трещины, отколы бетона, обнажение и коррозия арматуры, провалы, разрушение ограждения. Категория: ОР → А при потере сечения и опирания. Д К04 02. Коррозия консольных балок, подкосов, подвесок Категория: ОР; сквозная коррозия — А. Д К04 03. Разрушение заделки несущих элементов балкона в стену Признаки: трещины у примыкания, наклон плиты, выпадение кладки. Категория: А при потере заделки. Д К04 04. Отсутствие или разрушение гидроизоляции балкона Следствие: коррозия арматуры, протечки в нижележащие помещения. Д К04 05. Разрушение ограждения балкона/лоджии Категория: ОР (опасность для людей — приоритет). Д К04 06. Трещины в месте примыкания эркера к зданию Норма: п. 5.3.6.1 (обязательно проверять). Категория: ОР → А при раскрытии и потере связи. Д К04 10. Сквозная коррозия косоуров лестницы Признаки: полное поражение сечения, провисание марша, разрушение ступеней. Категория: А . Источник: последние экспертизы (объект культурного наследия; объект исторической застройки). Д К04 11. Разрушение лестничной площадки Признаки: коррозия балок, провал покрытия, уклон, обрушение. Категория: А при исчерпании несущей способности. Д К04 12. Трещины и износ ступеней Категория: ОР. Д К04 13. Утрата лестничного марша Признаки: физическое отсутствие марша, замена временной металлической лестницей. Категория: А (для утраченного элемента — фиксируется как утрата). Д К04 14. Отрыв элементов стальной лестницы, деформация узлов крепления Норма: п. 5.3.6.3. Категория: ОР → А при потере крепления. К 05. Стальной каркас Д К05 01. Коррозия с уменьшением сечения Измерения: не менее 3 наиболее повреждённых сечений, в каждом не менее 3 измерений (п. 5.3.3.13); назначать редуцированные сечения (5.3.3.12). Категория: ОР; при критическом снижении — А (расчётом). Д К05 02. Искривления элементов, превышающие допустимые Категория: А (приложение Г; обосновывается расчётом). Д К05 03. Дефекты сварных швов (трещины и недопустимые дефекты) Норма: ГОСТ 23118 2019, подраздел 5.2. Категория: А для элементов группы 1 (приложение Г). Д К05 04. Зазоры в болтовых соединениях Фрикционные, группа 1 → А; группы 2—4 → ОР. Срезные → ОР. Фланцевые растянутые/сжато изогнутые (группа 1) → А по результатам контроля зазоров. Фланцевые сжатые, группы 2—4 → ОР (приложение Г). Д К05 05. Изменение статической схемы Причины: включение непредусмотренных элементов, заклинивание опор, выключение элементов из работы. Категория: А (обосновывается расчётом по действительной схеме). Д К05 06. Хрупкие или усталостные трещины в основном металле Категория: А (приложение Г). Д К05 07. Выпучивание стенок замкнутых сечений Категория: ОР при отсутствии трещин и разрывов. Д К05 08. Местные погибы Категория: ОР, если не влияют на работу конструкции. Д К05 09. Разрушение защитных (в том числе огнезащитных) покрытий Категория: ОР; риск последующей коррозии. К 06. Кровля и стропила Д К06 01. Протечки кровли Причины: разрушение покрытия, засорение водостока, нарушение примыканий, конденсат. Следствие: коррозия металла, гниль дерева, промерзание. Норма: п. 5.3.6.5; СП 17.13330.2017. Д К06 02. Гниль стропил, обрешётки, мауэрлата Категория: ОР → А при потере сечения. Норма: приложение Д; п. 5.3.6.7. Д К06 03. Прогиб стропильной системы, деформации ферм Признаки: прогибы, удлинение пролёта, углы наклона сечений и узлов, смещения податливых соединений, трещины скалывания, складки сжатия (п. 5.3.6.5). Категория: ОР → А при потере устойчивости. Д К06 04. Разрушение кровельного покрытия Категория: ОР; при массовых протечках — ОР по совокупности. Д К06 05. Засорение или разрушение водостока Норма: п. 5.4.8. Следствие: замачивание стен и перекрытий. Д К06 06. Конденсат и наледи на свесах и водостоках Причины (5.3.6.6): разрушение венткоробов и шахт; отсутствие/разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов дверей и люков. Категория: ОР по совокупности. К 07. Фасад Д К07 01. Отслоение штукатурки, разрушение отделочного слоя Признаки: трещины, «бухты», простукивание даёт глухой звук, отслоение. Категория: ОР; при угрозе падения — А для участка. Д К07 02. Разрушение облицовки (в том числе вентилируемого фасада) Признаки: сколы, смещения, нарушение линий швов, зыбкость, пустоты. Норма: п. 5.3.5.4, 5.3.5.6. Категория: ОР → А при угрозе обрушения. Д К07 03. Коррозия креплений и подконструкций Норма: п. 5.3.5.6. Категория: ОР; при потере анкеровки — А. Д К07 04. Выветривание, деструкция кладки фасада Категория: ОР. Д К07 05. Зыбкость облицовки, подвижные элементы Норма: п. 5.3.5.4 («контроль наличия подвижных элементов с оценкой общей зыбкости»). Категория: А для участка (угроза падения). Д К07 06. Промерзание, сверхнормативные теплопотери, конденсат Норма: п. 5.7. Категория: ОР (энергоэффективность), не путать с механической безопасностью. К 08. Полы, проёмы, перегородки Д К08 01. Просадка и разрушение полов, стяжек Причины: просадка основания, протечки, коррозия балок. Категория: ОР. Д К08 02. Трещины перегородок Категория: ОР (эксплуатационный дефект). Д К08 03. Перекос оконных и дверных блоков Причины: осадка, деформации стен. Категория: ОР. Д К08 04. Разрушение откосов, отливов Следствие: замачивание стен. Категория: ОР. К 09. Инженерные системы Д К09 01. Затопление подвала, отсутствие вентиляции Причины: неисправность сетей, отсутствие водоотвода, засорение. Следствие: коррозия металла и гниль дерева — главные причины аварийных перекрытий в архиве. Норма: п. 5.4, 5.4.8. Категория: фактор, усиливающий дефекты К 03. Д К09 02. Разрушение трубопроводов, протечки Норма: пп. 5.4.1—5.4.7. Категория: ОР системы. К 10. Аварийные ситуации Д К10 01. Прогрессирующее обрушение Признаки: цепное разрушение элементов, потеря устойчивости, обрушение участков. Норма: п. 4.3 (обследование после аварий), 4.5, 4.6. Действия: немедленное информирование, ограждение, противоаварийные мероприятия, мониторинг. Д К10 02. Исчерпание несущей способности Признаки: «сортамент определить невозможно», сквозная коррозия 100 %, разрывы арматуры, выпучивание сжатой арматуры, наклонные трещины со смещением. Категория: А . Норма: п. 3.1; приложения В—Д. БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ» Дефект Категория Норма Наклонные трещины со смещением бетона А В, 1.8 Выпучивание сжатой арматуры А В, 1.11 Уменьшение площадок опирания А В, 1.12 Разрыв/смещение поперечной арматуры А В, 1.13 Отрыв анкеров, расстройство стыков А В, 1.14 Трещины вдоль арматуры 3 мм на опоре А В, 1.4 Отслоение защитного слоя на опоре А В, 1.5 Прогиб плит 1/150 А (расчёт) В, 1.9 Вертикальные трещины кладки 0,1—0,5 мм, ≥ 2 на 1 м ОР В, 2.10 Выпучивание стены ОР В, 2.2 Отклонение стены от вертикали ОР В, 2.3 Трещины в перемычках ОР В, 2.11 Трещины под опорами ОР В, 2.13 Сквозная коррозия балок А практика Поверхностная коррозия ОР Г Искривления металла сверх допустимых А (расчёт) Г Зазоры фрикционных соединений группы 1 А Г Зазоры фрикционных соединений групп 2—4 ОР Г Хрупкие/усталостные трещины металла А Г Отсутствие наката, потеря целостности А Д Гниль с потерей сечения ОР → А Д Зыбкость облицовки фасада А для участка 5.3.5.4 "}, {"id": "methods", "file": "05_Методики_обследования/МЕТОДИКИ.md", "title": "МЕТОДИКИ ОБСЛЕДОВАНИЯ", "section": "05_Методики_обследования", "html": "<h1>МЕТОДИКИ ОБСЛЕДОВАНИЯ</h1><blockquote><p>Как обследовать: этапы, методы, приборы, объёмы, что фиксировать. Основа — ГОСТ 31937-2024, разделы 5.1—5.7; практика архива ТЗ и последних экспертиз. Категории и пороги — в <code>06_Оценка_состояния</code>, дефекты — в <code>04_Дефекты</code>.</p></blockquote><hr><h2 id=\"s1\">1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2)</h2><ol><li><strong>Подготовка</strong> (5.1.6—5.1.8): сбор документации, программа работ, приборы, доступы.</li><li><strong>Предварительное (визуальное) обследование</strong> (5.1.9—5.1.12): сплошной осмотр,</li></ol><p>ведомость дефектов, фотофиксация, проверка деформаций, предварительная категория.</p><ol><li><strong>Детальное (инструментальное) обследование</strong> (5.1.13 и далее): обмеры, прочность</li></ol><p>материалов, армирование, прогибы, вскрытия, лабораторные испытания.</p><ol><li><strong>Поверочные расчёты</strong> (при необходимости): по фактическим данным (п. 3.20).</li><li><strong>Оценка категорий</strong> (4.5) и оформление заключения (приложения А, Б).</li></ol><p><strong>Когда детальное не проводится (5.1.11):</strong> визуально установлено нормативное или работоспособное состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования хватает для решения задач ТЗ.</p><p><strong>Когда детальное обязательно:</strong> выявлено ограниченно-работоспособное состояние и нужна оценка несущей способности; нужны исходные данные для проекта; оценка влияния нового строительства; характерные трещины и перекосы, указывающие на просадку основания (тогда ещё и дополнительные инженерно-геологические изыскания — 5.1.12).</p><hr><h2 id=\"s2\">2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ</h2><p><strong>Документы (5.1.7):</strong> поэтажные планы, технический паспорт, акты осмотров и ведомости дефектов эксплуатирующей организации, отчёты предыдущих обследований, проектная и исполнительная документация, сведения о перестройках и ремонтах, геоподоснова, материалы изысканий, протокол доступа, документы о вводах сетей.</p><p><strong>Установить по документам (5.1.8):</strong> автор и год проекта, конструктивную схему, применённые конструкции, монтажные схемы, время возведения, геометрию, расчётную схему, проектные нагрузки, характеристики материалов, паспорта изделий, характеристики грунтов, замены и отклонения от проекта, внешние воздействия, дефекты.</p><p><strong>Программа работ (5.1.8 б):</strong> перечень конструкций; перечень инженерного оборудования; места и методы инструментальных измерений; места вскрытий и отбора проб; необходимость изысканий; перечень поверочных расчётов.</p><hr><h2 id=\"s3\">3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ</h2><h3 id=\"s4\">3.1 Порядок</h3><ol><li>Обход здания, фотофиксация фасадов и общих видов.</li><li>Осмотр помещений по этажам и по зонам, привязка к осям и отметкам.</li><li>Сплошной осмотр конструкций: стены, перекрытия, лестницы, балконы, кровля.</li><li>Проверка деформаций: прогибы, крены, перекосы, разломы, неравномерные осадки.</li><li>Замеры дефектов: ширина раскрытия трещин, протяжённость, площади поражения.</li><li>Ведомость дефектов + схемы + фото.</li></ol><h3 id=\"s5\">3.2 Инструменты визуального этапа</h3><p>Щупы калиброванные, лупа измерительная ЛИ-3-10х, рулетка, линейка стальная, отвес, уровень, фотоаппарат. Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование (5.1.9).</p><h3 id=\"s6\">3.3 Что фиксировать (5.1.10)</h3><p>Схемы и ведомости дефектов (место, характер, параметры); описания и фото дефектных участков; результаты проверки деформаций; аварийные участки; уточнённую конструктивную схему; схему мест вскрытий; описание территории и водоотвода; оценку подпора в каналах; предварительную категорию; отчёт.</p><hr><h2 id=\"s7\">4. ОБМЕРНЫЕ РАБОТЫ</h2><ul><li>Пролёты в свету, шаг балок, сечения, толщины, отметки, высоты этажей.</li><li>Привязка к осям и отметкам, «уровень земли принять за 0.000».</li><li>Для металла: сечение по факту, с учётом коррозии (редуцированное сечение, 5.3.3.12).</li><li>Для кладки: толщина стен, тип кладки, размеры изделий.</li><li>Для ж.-б.: защитный слой, диаметр и шаг арматуры.</li><li>Инструмент: рулетка 5 м, штангенциркуль (WDK-MC20005), линейка, лазерный дальномер,</li></ul><p>нивелир/тахеометр для прогибов и кренов.</p><hr><h2 id=\"s8\">5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ</h2><h3 id=\"s9\">5.1 Бетон (5.3.1.5—5.3.1.8)</h3><ul><li>Методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570.</li><li>Предварительно — экспертный метод: молоток Физделя, ультразвуковое прозвучивание.</li><li>Участки: наименьшей прочности; в зонах, определяющих несущую способность; в местах</li></ul><p>дефектов.</p><ul><li><strong>Число участков не менее:</strong> 3 — зона/средняя прочность; 6 — средняя прочность</li></ul><p>и коэффициент изменчивости; 9 — группа однотипных конструкций.</p><ul><li><strong>Число конструкций — не менее трёх.</strong></li><li>Дополнительно: плотность, влажность, водопоглощение, пористость, водонепроницаемость —</li></ul><p>ГОСТ 12730.0—12730.5; морозостойкость — ГОСТ 10060; щёлочность — ГОСТ 5382.</p><h3 id=\"s10\">5.2 Арматура (5.3.1.10—5.3.1.13)</h3><ul><li>Магнитный метод (ГОСТ 22904), радиационный (ГОСТ 17625), вскрытие, георадиолокация,</li></ul><p>ультразвук.</p><ul><li><strong>Число конструкций — не менее трёх.</strong></li><li>Прочность: образцы по ГОСТ 12004, <strong>не менее трёх стержней</strong> одного диаметра и профиля.</li><li>По рисунку профиля — <strong>не менее пяти участков</strong>.</li><li>Обязательно устанавливать год проектирования и постройки (нормативные сопротивления</li></ul><p>менялись).</p><h3 id=\"s11\">5.3 Кирпич и раствор (5.3.2.2—5.3.2.4)</h3><ul><li>Лабораторные испытания образцов из кладки.</li><li>Для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной</li></ul><p>зависимости (ГОСТ 22690).</p><ul><li>Комплексное обследование: ГОСТ 8462 (в РФ ГОСТ Р 58527-2019), ГОСТ 5802, ГОСТ 24992;</li></ul><p>керны бетона — ГОСТ 28570; бут — ГОСТ 4001.</p><ul><li>Места с пластинчатой деструкцией для испытаний непригодны.</li></ul><h3 id=\"s12\">5.4 Сталь (5.3.3.4—5.3.3.11)</h3><ul><li>Химсостав: фотоэлектрический или атомно-эмиссионный анализ (ГОСТ 18895 / ГОСТ Р 54153-2010).</li><li>Механика: ГОСТ 1497, ГОСТ 9454, ГОСТ 28870.</li><li>Крепёж: ГОСТ ISO 898-1, 898-2, ГОСТ 11371, ГОСТ 32484.1—32484.6.</li><li><strong>Запрещено</strong> определять σт и σв по твёрдости (5.3.3.10).</li><li><strong>Запрещено</strong> применять портативные РФА там, где нет точности по C, S, P (5.3.3.11).</li><li>Пробы — на участках, не влияющих на безопасность; иначе разгрузка или страховочные опоры.</li></ul><h3 id=\"s13\">5.5 Древесина (5.3.4.2—5.3.4.5)</h3><ul><li>Влажность — ГОСТ 16483.7, 16588; плотность — ГОСТ 16483.1.</li><li>Биостойкость — ГОСТ 18610; защищённость — ГОСТ 20022.0.</li><li>Прочность: сжатие вдоль — 16483.10, поперёк — 16483.11, изгиб — 16483.3, модуль —</li></ul><p>16483.9, смятие — 16483.2, скалывание — 16483.5, 16483.12.</p><ul><li>Влажность и температура в полостях — термометры, психрометры; воздухообмен — анемометры.</li></ul><hr><h2 id=\"s14\">6. КОРРОЗИЯ МЕТАЛЛА</h2><ul><li>Толщину измерять <strong>не менее чем в трёх наиболее повреждённых сечениях</strong> по длине элемента,</li></ul><p>в каждом — <strong>не менее трёх измерений</strong> (5.3.3.13).</p><ul><li>Назначать редуцированные сечения (5.3.3.12).</li><li>Фиксировать: вид коррозии (сплошная, язвенная, точечная, щелевая), площадь, глубину,</li></ul><p>остаточное сечение.</p><ul><li>Приборы: толщиномер ультразвуковой (например, А 1207), штангенциркуль, линейка.</li><li>Оценка процента поражения — для заключения, но решающий критерий — остаточное сечение</li></ul><p>и несущая способность.</p><hr><h2 id=\"s15\">7. ВСКРЫТИЯ</h2><p><strong>Цель:</strong> установить сечения, армирование, состояние заделки, узлы, наличие гидроизоляции.</p><p><strong>Места:</strong></p><ul><li>балконы и эркеры — по расчётной схеме (5.3.6.2);</li><li>лестницы — заделка площадок в стены, опоры маршей, заделка балок (5.3.6.4);</li><li>перекрытия — у опор, в пролёте, в местах протечек;</li><li>стены — зондирование кладки, отбор проб из слоёв (5.3.2.1);</li><li>фасады — подоблицовочное пространство (5.3.5.6).</li></ul><p><strong>Правило:</strong> вскрытия не должны снижать несущую способность; после — восстановление отделки (по согласованию с заказчиком).</p><hr><h2 id=\"s16\">8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ</h2><ul><li>Прогибы — геометрическое и гидростатическое нивелирование; допускается тригонометрическое</li></ul><p>нивелирование электронными тахеометрами (5.3.1.20).</p><ul><li>Крены — геодезические методы, отвесы, лазерные уровни.</li><li>Осадки — по ГОСТ 24846 (мониторинг).</li><li>Фиксировать: схему измерений, точки, дату, температуру, результат в мм и в долях пролёта.</li></ul><hr><h2 id=\"s17\">9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ</h2><ul><li>Статические испытания — при необходимости подтверждения несущей способности (5.3.1.23).</li><li>Испытания анкеров фасадов — натурные, по ГОСТ Р 56731-2023, ГОСТ Р 58387-2019,</li></ul><p>ГОСТ Р 58430-2019 (5.3.5.10).</p><ul><li>Вибрационные обследования — при динамических нагрузках (5.2.16—5.2.17), ГОСТ Р 52892-2007.</li><li>Тепловизионная съёмка — теплотехника (5.7).</li><li>Акустические измерения — звукоизоляция и шум (5.6).</li></ul><hr><h2 id=\"s18\">10. ПОВЕРОЧНЫЕ РАСЧЁТЫ</h2><p><strong>Когда:</strong> ограниченно-работоспособное состояние; необходимость оценки несущей способности; проектирование усиления; изменение нагрузок; оценка влияния нового строительства.</p><p><strong>Исходные данные (п. 3.20):</strong> фактические геометрия и сечения; фактическая прочность материалов; фактические нагрузки; уточнённая расчётная схема с учётом дефектов.</p><p><strong>Что считать:</strong> изгиб, срез, устойчивость, прогиб, узлы опирания, анкеровка, кладка на внецентренное сжатие, сварные и болтовые соединения.</p><p><strong>Оформление:</strong> методы, формулы, исходные данные, результат, вывод о достаточности или недостаточности несущей способности, ссылка на СП.</p><p><strong>Важно:</strong> при полном разрушении элемента расчёт не выполняется — фиксируется исчерпание несущей способности (практика архива).</p><hr><h2 id=\"s19\">11. ФОТОФИКСАЦИЯ</h2><ul><li>Общие виды объекта, фасады, зоны обследования.</li><li>Каждый дефект — общий план + крупный план с масштабной линейкой.</li><li>Привязка фото к осям/помещениям.</li><li>Нумерация фото в соответствии с дефектной ведомостью.</li><li>Формат: JPEG, разрешение не ниже 1920×1080, без обработки, дата в метаданных.</li></ul><hr><h2 id=\"s20\">12. ДЕФЕКТНАЯ ВЕДОМОСТЬ</h2><p><strong>Колонки:</strong> № | элемент (оси, отметка) | вид дефекта | параметры (мм, %, м) | причина | категория состояния | ссылка на норму | № фото.</p><p><strong>Правила:</strong></p><ul><li>каждая строка — один дефект;</li><li>параметры — измеримые, не «сильная коррозия», а «сквозная коррозия, поражение сечения</li></ul><p>до 100 %»;</p><ul><li>причина — из диагностической таблицы (Д-К02-06…09 и др.);</li><li>категория — только из четырёх по ГОСТ;</li><li>фото — обязательна.</li></ul><hr><h2 id=\"s21\">13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива)</h2><div class=\"tablewrap\"><table><thead><tr><th>Прибор</th><th>Назначение</th><th>Поверка</th></tr></thead><tbody><tr><td>Рулетка 5 м</td><td>размеры конструкций</td><td>да</td></tr><tr><td>Штангенциркуль WDK-MC20005</td><td>толщина, сечения</td><td>да</td></tr><tr><td>Толщиномер ультразвуковой А 1207</td><td>толщина металла</td><td>да</td></tr><tr><td>Лупа ЛИ-3-10х</td><td>ширина трещин</td><td>да</td></tr><tr><td>Линейка стальная</td><td>геометрия</td><td>да</td></tr><tr><td>Цифровая фотокамера Canon EOS</td><td>фотофиксация</td><td>—</td></tr><tr><td>Молоток, зубило</td><td>вскрытие отделки</td><td>—</td></tr><tr><td>Влагомер</td><td>влажность древесины</td><td>да</td></tr><tr><td>Склерометр / молоток Кашкарова</td><td>прочность бетона</td><td>да</td></tr><tr><td>Нивелир / тахеометр</td><td>прогибы, крены</td><td>да</td></tr></tbody></table></div><p><strong>Требование (4.10):</strong> все средства измерений — с метрологическим обеспечением, поверены; новые типы — аттестованы, методика согласована в программе работ.</p><hr><h2 id=\"s22\">14. ОХРАНА ТРУДА (раздел 7)</h2><ul><li>Работы — по ВСН 48-86(р), СНиП 12-03-2001, СНиП 12-04-2002 (в РФ).</li><li>Каски (ГОСТ 12.4.087), страховочные канаты (ГОСТ 12.4.107).</li><li>Работа в подвалах — контроль воздушной среды, освещение, страховка.</li><li>Вскрытия — с проверкой скрытых коммуникаций.</li><li>Аварийные зоны — ограждение, запрет доступа.</li></ul>", "toc": [["s1", "1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2)", 2], ["s2", "2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ", 2], ["s3", "3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ", 2], ["s4", "3.1 Порядок", 3], ["s5", "3.2 Инструменты визуального этапа", 3], ["s6", "3.3 Что фиксировать (5.1.10)", 3], ["s7", "4. ОБМЕРНЫЕ РАБОТЫ", 2], ["s8", "5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ", 2], ["s9", "5.1 Бетон (5.3.1.5—5.3.1.8)", 3], ["s10", "5.2 Арматура (5.3.1.10—5.3.1.13)", 3], ["s11", "5.3 Кирпич и раствор (5.3.2.2—5.3.2.4)", 3], ["s12", "5.4 Сталь (5.3.3.4—5.3.3.11)", 3], ["s13", "5.5 Древесина (5.3.4.2—5.3.4.5)", 3], ["s14", "6. КОРРОЗИЯ МЕТАЛЛА", 2], ["s15", "7. ВСКРЫТИЯ", 2], ["s16", "8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ", 2], ["s17", "9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ", 2], ["s18", "10. ПОВЕРОЧНЫЕ РАСЧЁТЫ", 2], ["s19", "11. ФОТОФИКСАЦИЯ", 2], ["s20", "12. ДЕФЕКТНАЯ ВЕДОМОСТЬ", 2], ["s21", "13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива)", 2], ["s22", "14. ОХРАНА ТРУДА (раздел 7)", 2]], "chars": 10738, "plain": " МЕТОДИКИ ОБСЛЕДОВАНИЯ Как обследовать: этапы, методы, приборы, объёмы, что фиксировать. Основа — ГОСТ 31937 2024, разделы 5.1—5.7; практика архива ТЗ и последних экспертиз. Категории и пороги — в 06 Оценка состояния , дефекты — в 04 Дефекты . 1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2) 1. Подготовка (5.1.6—5.1.8): сбор документации, программа работ, приборы, доступы. 2. Предварительное (визуальное) обследование (5.1.9—5.1.12): сплошной осмотр, ведомость дефектов, фотофиксация, проверка деформаций, предварительная категория. 3. Детальное (инструментальное) обследование (5.1.13 и далее): обмеры, прочность материалов, армирование, прогибы, вскрытия, лабораторные испытания. 4. Поверочные расчёты (при необходимости): по фактическим данным (п. 3.20). 5. Оценка категорий (4.5) и оформление заключения (приложения А, Б). Когда детальное не проводится (5.1.11): визуально установлено нормативное или работоспособное состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования хватает для решения задач ТЗ. Когда детальное обязательно: выявлено ограниченно работоспособное состояние и нужна оценка несущей способности; нужны исходные данные для проекта; оценка влияния нового строительства; характерные трещины и перекосы, указывающие на просадку основания (тогда ещё и дополнительные инженерно геологические изыскания — 5.1.12). 2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ Документы (5.1.7): поэтажные планы, технический паспорт, акты осмотров и ведомости дефектов эксплуатирующей организации, отчёты предыдущих обследований, проектная и исполнительная документация, сведения о перестройках и ремонтах, геоподоснова, материалы изысканий, протокол доступа, документы о вводах сетей. Установить по документам (5.1.8): автор и год проекта, конструктивную схему, применённые конструкции, монтажные схемы, время возведения, геометрию, расчётную схему, проектные нагрузки, характеристики материалов, паспорта изделий, характеристики грунтов, замены и отклонения от проекта, внешние воздействия, дефекты. Программа работ (5.1.8 б): перечень конструкций; перечень инженерного оборудования; места и методы инструментальных измерений; места вскрытий и отбора проб; необходимость изысканий; перечень поверочных расчётов. 3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ 3.1 Порядок 1. Обход здания, фотофиксация фасадов и общих видов. 2. Осмотр помещений по этажам и по зонам, привязка к осям и отметкам. 3. Сплошной осмотр конструкций: стены, перекрытия, лестницы, балконы, кровля. 4. Проверка деформаций: прогибы, крены, перекосы, разломы, неравномерные осадки. 5. Замеры дефектов: ширина раскрытия трещин, протяжённость, площади поражения. 6. Ведомость дефектов + схемы + фото. 3.2 Инструменты визуального этапа Щупы калиброванные, лупа измерительная ЛИ 3 10х, рулетка, линейка стальная, отвес, уровень, фотоаппарат. Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование (5.1.9). 3.3 Что фиксировать (5.1.10) Схемы и ведомости дефектов (место, характер, параметры); описания и фото дефектных участков; результаты проверки деформаций; аварийные участки; уточнённую конструктивную схему; схему мест вскрытий; описание территории и водоотвода; оценку подпора в каналах; предварительную категорию; отчёт. 4. ОБМЕРНЫЕ РАБОТЫ Пролёты в свету, шаг балок, сечения, толщины, отметки, высоты этажей. Привязка к осям и отметкам, «уровень земли принять за 0.000». Для металла: сечение по факту, с учётом коррозии (редуцированное сечение, 5.3.3.12). Для кладки: толщина стен, тип кладки, размеры изделий. Для ж. б.: защитный слой, диаметр и шаг арматуры. Инструмент: рулетка 5 м, штангенциркуль (WDK MC20005), линейка, лазерный дальномер, нивелир/тахеометр для прогибов и кренов. 5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ 5.1 Бетон (5.3.1.5—5.3.1.8) Методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570. Предварительно — экспертный метод: молоток Физделя, ультразвуковое прозвучивание. Участки: наименьшей прочности; в зонах, определяющих несущую способность; в местах дефектов. Число участков не менее: 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций. Число конструкций — не менее трёх. Дополнительно: плотность, влажность, водопоглощение, пористость, водонепроницаемость — ГОСТ 12730.0—12730.5; морозостойкость — ГОСТ 10060; щёлочность — ГОСТ 5382. 5.2 Арматура (5.3.1.10—5.3.1.13) Магнитный метод (ГОСТ 22904), радиационный (ГОСТ 17625), вскрытие, георадиолокация, ультразвук. Число конструкций — не менее трёх. Прочность: образцы по ГОСТ 12004, не менее трёх стержней одного диаметра и профиля. По рисунку профиля — не менее пяти участков . Обязательно устанавливать год проектирования и постройки (нормативные сопротивления менялись). 5.3 Кирпич и раствор (5.3.2.2—5.3.2.4) Лабораторные испытания образцов из кладки. Для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690). Комплексное обследование: ГОСТ 8462 (в РФ ГОСТ Р 58527 2019), ГОСТ 5802, ГОСТ 24992; керны бетона — ГОСТ 28570; бут — ГОСТ 4001. Места с пластинчатой деструкцией для испытаний непригодны. 5.4 Сталь (5.3.3.4—5.3.3.11) Химсостав: фотоэлектрический или атомно эмиссионный анализ (ГОСТ 18895 / ГОСТ Р 54153 2010). Механика: ГОСТ 1497, ГОСТ 9454, ГОСТ 28870. Крепёж: ГОСТ ISO 898 1, 898 2, ГОСТ 11371, ГОСТ 32484.1—32484.6. Запрещено определять σт и σв по твёрдости (5.3.3.10). Запрещено применять портативные РФА там, где нет точности по C, S, P (5.3.3.11). Пробы — на участках, не влияющих на безопасность; иначе разгрузка или страховочные опоры. 5.5 Древесина (5.3.4.2—5.3.4.5) Влажность — ГОСТ 16483.7, 16588; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610; защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль — 16483.10, поперёк — 16483.11, изгиб — 16483.3, модуль — 16483.9, смятие — 16483.2, скалывание — 16483.5, 16483.12. Влажность и температура в полостях — термометры, психрометры; воздухообмен — анемометры. 6. КОРРОЗИЯ МЕТАЛЛА Толщину измерять не менее чем в трёх наиболее повреждённых сечениях по длине элемента, в каждом — не менее трёх измерений (5.3.3.13). Назначать редуцированные сечения (5.3.3.12). Фиксировать: вид коррозии (сплошная, язвенная, точечная, щелевая), площадь, глубину, остаточное сечение. Приборы: толщиномер ультразвуковой (например, А 1207), штангенциркуль, линейка. Оценка процента поражения — для заключения, но решающий критерий — остаточное сечение и несущая способность. 7. ВСКРЫТИЯ Цель: установить сечения, армирование, состояние заделки, узлы, наличие гидроизоляции. Места: балконы и эркеры — по расчётной схеме (5.3.6.2); лестницы — заделка площадок в стены, опоры маршей, заделка балок (5.3.6.4); перекрытия — у опор, в пролёте, в местах протечек; стены — зондирование кладки, отбор проб из слоёв (5.3.2.1); фасады — подоблицовочное пространство (5.3.5.6). Правило: вскрытия не должны снижать несущую способность; после — восстановление отделки (по согласованию с заказчиком). 8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ Прогибы — геометрическое и гидростатическое нивелирование; допускается тригонометрическое нивелирование электронными тахеометрами (5.3.1.20). Крены — геодезические методы, отвесы, лазерные уровни. Осадки — по ГОСТ 24846 (мониторинг). Фиксировать: схему измерений, точки, дату, температуру, результат в мм и в долях пролёта. 9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ Статические испытания — при необходимости подтверждения несущей способности (5.3.1.23). Испытания анкеров фасадов — натурные, по ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019 (5.3.5.10). Вибрационные обследования — при динамических нагрузках (5.2.16—5.2.17), ГОСТ Р 52892 2007. Тепловизионная съёмка — теплотехника (5.7). Акустические измерения — звукоизоляция и шум (5.6). 10. ПОВЕРОЧНЫЕ РАСЧЁТЫ Когда: ограниченно работоспособное состояние; необходимость оценки несущей способности; проектирование усиления; изменение нагрузок; оценка влияния нового строительства. Исходные данные (п. 3.20): фактические геометрия и сечения; фактическая прочность материалов; фактические нагрузки; уточнённая расчётная схема с учётом дефектов. Что считать: изгиб, срез, устойчивость, прогиб, узлы опирания, анкеровка, кладка на внецентренное сжатие, сварные и болтовые соединения. Оформление: методы, формулы, исходные данные, результат, вывод о достаточности или недостаточности несущей способности, ссылка на СП. Важно: при полном разрушении элемента расчёт не выполняется — фиксируется исчерпание несущей способности (практика архива). 11. ФОТОФИКСАЦИЯ Общие виды объекта, фасады, зоны обследования. Каждый дефект — общий план + крупный план с масштабной линейкой. Привязка фото к осям/помещениям. Нумерация фото в соответствии с дефектной ведомостью. Формат: JPEG, разрешение не ниже 1920×1080, без обработки, дата в метаданных. 12. ДЕФЕКТНАЯ ВЕДОМОСТЬ Колонки: № элемент (оси, отметка) вид дефекта параметры (мм, %, м) причина категория состояния ссылка на норму № фото. Правила: каждая строка — один дефект; параметры — измеримые, не «сильная коррозия», а «сквозная коррозия, поражение сечения до 100 %»; причина — из диагностической таблицы (Д К02 06…09 и др.); категория — только из четырёх по ГОСТ; фото — обязательна. 13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива) Прибор Назначение Поверка Рулетка 5 м размеры конструкций да Штангенциркуль WDK MC20005 толщина, сечения да Толщиномер ультразвуковой А 1207 толщина металла да Лупа ЛИ 3 10х ширина трещин да Линейка стальная геометрия да Цифровая фотокамера Canon EOS фотофиксация — Молоток, зубило вскрытие отделки — Влагомер влажность древесины да Склерометр / молоток Кашкарова прочность бетона да Нивелир / тахеометр прогибы, крены да Требование (4.10): все средства измерений — с метрологическим обеспечением, поверены; новые типы — аттестованы, методика согласована в программе работ. 14. ОХРАНА ТРУДА (раздел 7) Работы — по ВСН 48 86(р), СНиП 12 03 2001, СНиП 12 04 2002 (в РФ). Каски (ГОСТ 12.4.087), страховочные канаты (ГОСТ 12.4.107). Работа в подвалах — контроль воздушной среды, освещение, страховка. Вскрытия — с проверкой скрытых коммуникаций. Аварийные зоны — ограждение, запрет доступа. "}, {"id": "criteria", "file": "06_Оценка_состояния/КРИТЕРИИ_ОЦЕНКИ.md", "title": "КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ", "section": "06_Оценка_состояния", "html": "<h1>КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ</h1><blockquote><p>Четыре категории, их признаки, пороги и что делать дальше. Основа — ГОСТ 31937-2024, пп. 3.1, 3.15, 3.18, 3.21, 4.5, приложения В—Д. Дефекты — в <code>04_Дефекты</code>, формулировки — в <code>07_Шаблоны</code>.</p></blockquote><p><strong>Связь с капремонтом:</strong> <a href=\"#/doc/sp547\">СП 547</a> переводит физический износ в категорию необходимости ремонта; <a href=\"#/doc/sp368\">СП 368</a> — проектирование работ.</p><hr><h2 id=\"s1\">1. ЧЕТЫРЕ КАТЕГОРИИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Категория</th><th>Определение (сжато)</th><th>Норма</th><th>Режим эксплуатации</th></tr></thead><tbody><tr><td><strong>Нормативное</strong></td><td>Все параметры соответствуют проекту и действующим нормам на момент обследования</td><td>п. 3.15</td><td>Без ограничений</td></tr><tr><td><strong>Работоспособное</strong></td><td>Часть параметров не отвечает проекту/нормам, но нарушения не мешают работоспособности; несущая способность и механическая безопасность обеспечены</td><td>п. 3.21</td><td>Без ограничений</td></tr><tr><td><strong>Ограниченно-работоспособное</strong></td><td>Есть крены, дефекты и повреждения, снизившие несущую способность, и/или достаточность несущей способности не подтверждена расчётом; опасности внезапного разрушения нет</td><td>п. 3.18</td><td>Контроль (мониторинг) и/или мероприятия по восстановлению/усилению, затем мониторинг</td></tr><tr><td><strong>Аварийное</strong></td><td>Повреждения и деформации свидетельствуют об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости</td><td>п. 3.1</td><td><strong>Не допускается</strong>; противоаварийные мероприятия; обязательный мониторинг</td></tr></tbody></table></div><h3 id=\"s2\">1.1 Что следует из категории (п. 4.5)</h3><ul><li>нормативное/работоспособное → эксплуатация при фактических нагрузках и воздействиях</li></ul><p><strong>без ограничений</strong>;</p><ul><li>ограниченно-работоспособное → <strong>контроль состояния</strong>, мероприятия по восстановлению</li></ul><p>или усилению конструкций и/или грунтов, последующий мониторинг (при необходимости);</p><ul><li>аварийное → <strong>эксплуатация не допускается</strong>, разработать и выполнить **противоаварийные</li></ul><p>мероприятия<strong>, до приведения в работоспособное состояние — </strong>обязательный режим мониторинга**.</p><h3 id=\"s3\">1.2 Информирование (п. 4.6)</h3><p>При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — <strong>письменно</strong> информировать заказчика, при возможности собственника, лиц, в чьём хозяйственном ведении находится объект, эксплуатирующую организацию, иных ответственных за эксплуатацию.</p><hr><h2 id=\"s4\">2. КАК ОПРЕДЕЛЯТЬ (алгоритм)</h2><ol><li>Установить фактическое состояние элемента по внешним признакам (приложения В—Д,</li></ol><p>п. 5.1.9—5.1.10).</p><ol><li>Сопоставить с критериями: геометрия, сечения, ширина раскрытия трещин, прогибы,</li></ol><p>коррозия, прочность материалов.</p><ol><li>При необходимости — поверочный расчёт по фактическим данным (п. 3.20).</li><li>Определить долю снижения несущей способности (п. 3.8): нет снижения — нормативное/</li></ol><p>работоспособное; снижение есть, но без опасности внезапного разрушения — ограниченно- работоспособное; исчерпание — аварийное.</p><ol><li>Зафиксировать в выводах: категория + элемент + оси/отметка + основание (дефект или расчёт).</li><li>Назначить мероприятия и срок следующего обследования (п. 4.2).</li></ol><p><strong>Правило:</strong> категория ставится <strong>по элементу</strong>, а не «по зданию в целом»; итоговая категория объекта — по совокупности, с перечислением элементов каждой категории.</p><hr><h2 id=\"s5\">3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ</h2><h3 id=\"s6\">3.1 Железобетон (приложение В)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Порог</th><th>Категория</th></tr></thead><tbody><tr><td>Нормальные трещины в изгибаемых и растянутых элементах</td><td>А240 — &gt; 0,5 мм; А300/А400/А500/А600 — &gt; 0,4 мм; прочие — &gt; 0,3 мм</td><td>ОР</td></tr><tr><td>Трещины вдоль арматуры</td><td>≤ 3 мм</td><td>ОР; <strong>на опорных участках — А</strong></td></tr><tr><td>Отслоение защитного слоя</td><td>—</td><td>ОР; <strong>на опоре — А</strong></td></tr><tr><td>Сколы бетона в сжатой зоне</td><td>—</td><td>ОР</td></tr><tr><td>Наклонные трещины со смещением бетона; трещины, пересекающие арматуру</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Выпучивание сжатой арматуры; продольные трещины в сжатой зоне; шелушение</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Уменьшение площадок опирания против проекта</td><td>—</td><td><strong>А</strong> (расчёт)</td></tr><tr><td>Разрыв/смещение поперечной арматуры в зоне наклонных трещин</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Отрыв анкеров, расстройство стыков</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Относительные прогибы</td><td>фермы 1/700; балки 1/300; плиты 1/150</td><td>А (расчёт)</td></tr><tr><td>Волосяные трещины вдоль арматуры, следы ржавчины</td><td>—</td><td>ОР (при обосновании расчётом отсутствия опасности)</td></tr><tr><td>Промасливание бетона</td><td>—</td><td>А по результатам расчётов и оценки влияния</td></tr></tbody></table></div><h3 id=\"s7\">3.2 Каменные конструкции (приложение В)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Порог</th><th>Категория</th></tr></thead><tbody><tr><td>Вертикальные трещины, пересекающие ≥ 2 ряда кладки</td><td>раскрытие 0,1—0,5 мм, ≥ 2 трещин на 1 м стены</td><td>ОР</td></tr><tr><td>Искривление горизонтальных/вертикальных линий стен</td><td>—</td><td>ОР</td></tr><tr><td>Выпучивание стен</td><td>—</td><td>ОР</td></tr><tr><td>Отклонение от вертикали</td><td>—</td><td>ОР</td></tr><tr><td>Отколы углов, пробоины, выбоины, борозды</td><td>—</td><td>ОР</td></tr><tr><td>Увлажнение кладки</td><td>—</td><td>ОР</td></tr><tr><td>Трещины в перемычках</td><td>—</td><td>ОР</td></tr><tr><td>Трещины под опорами и подушками</td><td>—</td><td>ОР</td></tr><tr><td>Шелушение, выветривание, деструкция</td><td>—</td><td>ОР</td></tr></tbody></table></div><p><strong>Диагностика причины по рисунку трещин:</strong> см. <code>04_Дефекты</code>, Д-К02-06…09.</p><h3 id=\"s8\">3.3 Стальные конструкции (приложение Г)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Категория</th></tr></thead><tbody><tr><td>Деформации, выявленные обмерами/съёмкой</td><td>А (расчёт)</td></tr><tr><td>Отклонения геометрии от проекта</td><td>А (расчёт)</td></tr><tr><td>Отклонения от проектного положения</td><td>А (расчёт)</td></tr><tr><td>Расцентровка и неточная подгонка в узлах</td><td>А (расчёт)</td></tr><tr><td>Уменьшение сечения (вырезы, смятия, коррозия)</td><td>А (расчёт)</td></tr><tr><td>Изменение статической схемы</td><td>А (расчёт)</td></tr><tr><td>Зазоры/срывы контакта во фрикционных соединениях группы 1</td><td>А</td></tr><tr><td>То же, группы 2—4</td><td>ОР</td></tr><tr><td>Зазоры в срезных болтовых соединениях</td><td>ОР</td></tr><tr><td>Зазоры в растянутых, сжато-изогнутых, изгибаемо-растянутых фланцевых соединениях (группа 1)</td><td>А</td></tr><tr><td>Зазоры в сжатых фланцевых соединениях (группы 1, 2—4)</td><td>ОР</td></tr><tr><td>Недопустимые дефекты кромок (группа 1)</td><td>А</td></tr><tr><td>Недопустимые дефекты кромок (группы 2—4)</td><td>А (расчёт)</td></tr><tr><td>Искривления сверх допустимых</td><td>А (расчёт)</td></tr><tr><td>Хрупкие/усталостные трещины в основном металле</td><td>А</td></tr><tr><td>Недопустимые дефекты сварных швов (группа 1)</td><td>А</td></tr><tr><td>То же, группы 2—4</td><td>А (расчёт)</td></tr><tr><td>Выпучивание стенок замкнутых сечений (без трещин)</td><td>ОР</td></tr><tr><td>Местные погибы (не влияют на работу)</td><td>ОР</td></tr><tr><td>Разрушение защитных покрытий, коррозия</td><td>ОР</td></tr></tbody></table></div><h3 id=\"s9\">3.4 Деревянные конструкции (приложение Д)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Категория</th></tr></thead><tbody><tr><td>Отсутствие элемента наката, потеря целостности</td><td>А</td></tr><tr><td>Отклонение от проектного положения</td><td>А (расчёт)</td></tr><tr><td>Местное выпучивание простенков брусчатых стен</td><td>А (расчёт)</td></tr><tr><td>Расстройство горизонтальных связей между брёвнами</td><td>А (расчёт)</td></tr><tr><td>Осадка элементов сборно-щитовых и каркасных стен с перекосами и щелями</td><td>А (расчёт)</td></tr><tr><td>Продольные трещины</td><td>А (расчёт)</td></tr><tr><td>Прогиб элементов</td><td>А (расчёт)</td></tr></tbody></table></div><hr><h2 id=\"s10\">4. ПОРОГИ, КОТОРЫЕ ЧАЩЕ ВСЕГО СПРАШИВАЮТ</h2><div class=\"tablewrap\"><table><thead><tr><th>Показатель</th><th>Значение</th><th>Источник</th></tr></thead><tbody><tr><td>Глубина шурфа у фундамента</td><td>на 0,15 м ниже подошвы</td><td>5.2.7</td></tr><tr><td>Число участков определения прочности бетона</td><td>3 / 6 / 9</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке прочности</td><td>≥ 3</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при определении армирования</td><td>≥ 3</td><td>5.3.1.10</td></tr><tr><td>Число стержней для испытаний</td><td>≥ 3</td><td>5.3.1.11</td></tr><tr><td>Число участков по рисунку профиля</td><td>≥ 5</td><td>5.3.1.12</td></tr><tr><td>Сечения при измерении коррозии</td><td>≥ 3, в каждом ≥ 3 измерений</td><td>5.3.3.13</td></tr><tr><td>Ширина раскрытия трещин в ж.-б.</td><td>0,3 / 0,4 / 0,5 мм</td><td>В, 1.6</td></tr><tr><td>Трещины вдоль арматуры</td><td>≤ 3 мм</td><td>В, 1.4</td></tr><tr><td>Прогибы</td><td>1/150; 1/300; 1/700</td><td>В, 1.9</td></tr><tr><td>Трещины кладки</td><td>0,1—0,5 мм, ≥ 2 на 1 м</td><td>В, 2.10</td></tr><tr><td>Первое обследование</td><td>≤ 2 лет после ввода</td><td>4.2</td></tr><tr><td>Периодичность</td><td>1 раз в 10 лет; 5 лет — неблагоприятные условия</td><td>4.2</td></tr></tbody></table></div><hr><h2 id=\"s11\">5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ</h2><p>Форма приложения Б требует отдельной оценки:</p><ul><li>лифтового оборудования;</li><li>электрических сетей и средств связи;</li><li>водостоков;</li><li>горячего водоснабжения;</li><li>отопления;</li><li>холодного водоснабжения;</li><li>канализации;</li><li>вентиляции;</li><li>мусороудаления;</li><li>газоснабжения;</li><li>звукоизоляции конструкций;</li><li>теплотехнического состояния ограждающих конструкций.</li></ul><p>Для каждой — своя категория и свои дефекты (раздел 5.4—5.7 ГОСТ).</p><hr><h2 id=\"s12\">6. ЧЕГО НЕ ДЕЛАТЬ</h2><ol><li>Не ставить «ограниченно-работоспособное» при отсутствии дефектов и подтверждённой</li></ol><p>несущей способности — это противоречит п. 3.18 и 3.21.</p><ol><li>Не ставить «аварийное» только потому, что «выглядит плохо»: нужны признаки исчерпания</li></ol><p>несущей способности или крен, угрожающий устойчивости.</p><ol><li>Не подменять категорию «физическим износом» (п. 3.28) — это разные понятия.</li><li>Не указывать категорию без привязки к элементу, осям и отметке.</li><li>Не ссылаться на ГОСТ 31937 без года; действующая редакция — 2024.</li><li>Не забывать рекомендуемый срок следующего обследования (п. 4.2).</li></ol>", "toc": [["s1", "1. ЧЕТЫРЕ КАТЕГОРИИ", 2], ["s2", "1.1 Что следует из категории (п. 4.5)", 3], ["s3", "1.2 Информирование (п. 4.6)", 3], ["s4", "2. КАК ОПРЕДЕЛЯТЬ (алгоритм)", 2], ["s5", "3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ", 2], ["s6", "3.1 Железобетон (приложение В)", 3], ["s7", "3.2 Каменные конструкции (приложение В)", 3], ["s8", "3.3 Стальные конструкции (приложение Г)", 3], ["s9", "3.4 Деревянные конструкции (приложение Д)", 3], ["s10", "4. ПОРОГИ, КОТОРЫЕ ЧАЩЕ ВСЕГО СПРАШИВАЮТ", 2], ["s11", "5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ", 2], ["s12", "6. ЧЕГО НЕ ДЕЛАТЬ", 2]], "chars": 8390, "plain": " КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ Четыре категории, их признаки, пороги и что делать дальше. Основа — ГОСТ 31937 2024, пп. 3.1, 3.15, 3.18, 3.21, 4.5, приложения В—Д. Дефекты — в 04 Дефекты , формулировки — в 07 Шаблоны . Связь с капремонтом: [СП 547]( /doc/sp547) переводит физический износ в категорию необходимости ремонта; [СП 368]( /doc/sp368) — проектирование работ. 1. ЧЕТЫРЕ КАТЕГОРИИ Категория Определение (сжато) Норма Режим эксплуатации Нормативное Все параметры соответствуют проекту и действующим нормам на момент обследования п. 3.15 Без ограничений Работоспособное Часть параметров не отвечает проекту/нормам, но нарушения не мешают работоспособности; несущая способность и механическая безопасность обеспечены п. 3.21 Без ограничений Ограниченно работоспособное Есть крены, дефекты и повреждения, снизившие несущую способность, и/или достаточность несущей способности не подтверждена расчётом; опасности внезапного разрушения нет п. 3.18 Контроль (мониторинг) и/или мероприятия по восстановлению/усилению, затем мониторинг Аварийное Повреждения и деформации свидетельствуют об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости п. 3.1 Не допускается ; противоаварийные мероприятия; обязательный мониторинг 1.1 Что следует из категории (п. 4.5) нормативное/работоспособное → эксплуатация при фактических нагрузках и воздействиях без ограничений ; ограниченно работоспособное → контроль состояния , мероприятия по восстановлению или усилению конструкций и/или грунтов, последующий мониторинг (при необходимости); аварийное → эксплуатация не допускается , разработать и выполнить противоаварийные мероприятия , до приведения в работоспособное состояние — обязательный режим мониторинга . 1.2 Информирование (п. 4.6) При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — письменно информировать заказчика, при возможности собственника, лиц, в чьём хозяйственном ведении находится объект, эксплуатирующую организацию, иных ответственных за эксплуатацию. 2. КАК ОПРЕДЕЛЯТЬ (алгоритм) 1. Установить фактическое состояние элемента по внешним признакам (приложения В—Д, п. 5.1.9—5.1.10). 2. Сопоставить с критериями: геометрия, сечения, ширина раскрытия трещин, прогибы, коррозия, прочность материалов. 3. При необходимости — поверочный расчёт по фактическим данным (п. 3.20). 4. Определить долю снижения несущей способности (п. 3.8): нет снижения — нормативное/ работоспособное; снижение есть, но без опасности внезапного разрушения — ограниченно работоспособное; исчерпание — аварийное. 5. Зафиксировать в выводах: категория + элемент + оси/отметка + основание (дефект или расчёт). 6. Назначить мероприятия и срок следующего обследования (п. 4.2). Правило: категория ставится по элементу , а не «по зданию в целом»; итоговая категория объекта — по совокупности, с перечислением элементов каждой категории. 3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ 3.1 Железобетон (приложение В) Признак Порог Категория Нормальные трещины в изгибаемых и растянутых элементах А240 — 0,5 мм; А300/А400/А500/А600 — 0,4 мм; прочие — 0,3 мм ОР Трещины вдоль арматуры ≤ 3 мм ОР; на опорных участках — А Отслоение защитного слоя — ОР; на опоре — А Сколы бетона в сжатой зоне — ОР Наклонные трещины со смещением бетона; трещины, пересекающие арматуру — А Выпучивание сжатой арматуры; продольные трещины в сжатой зоне; шелушение — А Уменьшение площадок опирания против проекта — А (расчёт) Разрыв/смещение поперечной арматуры в зоне наклонных трещин — А Отрыв анкеров, расстройство стыков — А Относительные прогибы фермы 1/700; балки 1/300; плиты 1/150 А (расчёт) Волосяные трещины вдоль арматуры, следы ржавчины — ОР (при обосновании расчётом отсутствия опасности) Промасливание бетона — А по ВСЕГО СПРАШИВАЮТ Показатель Значение Источник Глубина шурфа у фундамента на 0,15 м ниже подошвы 5.2.7 Число участков определения прочности бетона 3 / 6 / 9 5.3.1.8 Число конструкций при оценке прочности ≥ 3 5.3.1.8 Число конструкций при определении армирования ≥ 3 5.3.1.10 Число стержней для испытаний ≥ 3 5.3.1.11 Число участков по рисунку профиля ≥ 5 5.3.1.12 Сечения при измерении коррозии ≥ 3, в каждом ≥ 3 измерений 5.3.3.13 Ширина раскрытия трещин в ж. б. 0,3 / 0,4 / 0,5 мм В, 1.6 Трещины вдоль арматуры ≤ 3 мм В, 1.4 Прогибы 1/150; 1/300; 1/700 В, 1.9 Трещины кладки 0,1—0,5 мм, ≥ 2 на 1 м В, 2.10 Первое обследование ≤ 2 лет после ввода 4.2 Периодичность 1 раз в 10 лет; 5 лет — неблагоприятные условия 4.2 5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ Форма приложения Б требует отдельной оценки: лифтового оборудования; электрических сетей и средств связи; водостоков; горячего водоснабжения; отопления; холодного водоснабжения; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции конструкций; теплотехнического состояния ограждающих конструкций. Для каждой — своя категория и свои дефекты (раздел 5.4—5.7 ГОСТ). 6. ЧЕГО НЕ ДЕЛАТЬ 1. Не ставить «ограниченно работоспособное» при отсутствии дефектов и подтверждённой несущей способности — это противоречит п. 3.18 и 3.21. 2. Не ставить «аварийное» только потому, что «выглядит плохо»: нужны признаки исчерпания несущей способности или крен, угрожающий устойчивости. 3. Не подменять категорию «физическим износом» (п. 3.28) — это разные понятия. 4. Не указывать категорию без привязки к элементу, осям и отметке. 5. Не ссылаться на ГОСТ 31937 без года; действующая редакция — 2024. 6. Не забывать рекомендуемый срок следующего обследования (п. 4.2). "}, {"id": "templates", "file": "07_Шаблоны_заключений/ШАБЛОНЫ.md", "title": "ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ", "section": "07_Шаблоны_заключений", "html": "<h1>ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ</h1><blockquote><p>Готовые к вставке структуры и фразы. Основа — 6 последних экспертиз (эталон) и требования ГОСТ 31937-2024 (приложения А, Б). Формулировки — рабочие, проверены практикой. Категории — <code>06_Оценка_состояния</code>, обоснования — <code>08_Обоснования</code>.</p></blockquote><p><strong>Формы:</strong> заключение о необходимости капремонта — приложение Б <a href=\"#/doc/sp547\">СП 547</a>; проект — <a href=\"#/doc/sp368\">СП 368</a>.</p><hr><h2 id=\"s1\">1. СТРУКТУРА ТОМА (эталон)</h2><div class=\"tablewrap\"><table><thead><tr><th>№</th><th>Документ</th><th>Шифр</th></tr></thead><tbody><tr><td>1</td><td>Титульный лист</td><td>—</td></tr><tr><td>2</td><td>Содержание тома</td><td><code>&lt;шифр&gt;/С</code></td></tr><tr><td>3</td><td>Выписка из реестра членов СРО</td><td>—</td></tr><tr><td>4</td><td>Техническое задание</td><td><code>&lt;шифр&gt;/ТЗ</code></td></tr><tr><td>5</td><td>Заключение (Общие положения; Результаты; Выводы и рекомендации)</td><td>—</td></tr><tr><td>6</td><td>Приложение № 1. Методика оценки (ГОСТ 31937-2024)</td><td>—</td></tr><tr><td>7</td><td>Приложение № 2. Графические материалы</td><td>—</td></tr><tr><td>8</td><td>Приложение № 3. Фотофиксация</td><td>—</td></tr><tr><td>9</td><td>Приложение № 4. Дефектная ведомость</td><td>—</td></tr><tr><td>10</td><td>Приложение № 5. Поверочные расчёты</td><td>—</td></tr><tr><td>11</td><td>Приложение № 6. Толщинометрия</td><td>—</td></tr><tr><td>12</td><td>Приложение № 7. Техническая документация</td><td>—</td></tr><tr><td>13</td><td>Приложение № 8. Аттестация специалистов</td><td>—</td></tr></tbody></table></div><p><strong>Шифр:</strong> <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>, например <code>06/1-08-2026-АВР</code>.</p><hr><h2 id=\"s2\">2. ТИТУЛЬНЫЙ ЛИСТ (Ш-ТИТ)</h2><pre><code>Техническое заключение\nпо результатам обследования технического состояния\nстроительных конструкций\n&lt;объект: надподвального перекрытия под арочным проездом, кв. № 24, помещением 2-Н; 3-Н и ЛК № 1&gt;\nпо адресу:\nг. Санкт-Петербург, &lt;улица&gt;, дом &lt;N&gt;, литера &lt;А&gt;\n\nШифр - &lt;06/1-08-2026-АВР&gt;\n\nГенеральный директор        &lt;И. О. Фамилия&gt;\n\n&lt;год&gt;</code></pre><hr><h2 id=\"s3\">3. ТЕХНИЧЕСКОЕ ЗАДАНИЕ (Ш-ТЗ)</h2><pre><code>Техническое задание\nна выполнение обследования технического состояния строительных конструкций\n&lt;объект&gt; по адресу: &lt;адрес&gt;\n\nНаименование и местонахождение объекта:\nжилой многоквартирный дом по адресу: &lt;адрес&gt;\n\nЦель обследования:\nвыявление технического состояния строительных конструкций &lt;объект&gt;\n\nРаботы по обследованию:\n- обследование технического состояния конструкций;\n- фотофиксация;\n- оформление отчётной документации в виде технического заключения по результатам\n  визуального обследования с выдачей рекомендаций по дальнейшей безопасной эксплуатации\n  конструкций и необходимому ремонту.\n\nОсобые условия:\nтехническое заключение передаётся Заказчику на бумажном носителе в 2-х экземплярах.\n\nСОГЛАСОВАНО\nГенеральный директор\n&lt;ООО «…»&gt;\n______________ &lt;И. О. Фамилия&gt;\nМ. П.\n«__» ________ 20__ г.</code></pre><hr><h2 id=\"s4\">4. ОБЩИЕ ПОЛОЖЕНИЯ (Ш-ОП)</h2><pre><code>Объект (жилой многоквартирный дом) расположен по адресу: &lt;адрес&gt;. Здание многоквартирного\nжилого дома было построено в &lt;год&gt; году по индивидуальному проекту &lt;архитектор&gt;.\n[Рисунок 1. Ситуационный план участка]\n\nЦель обследования:\nоценка технического состояния строительных конструкций &lt;объект&gt;.\n\nОценка технического состояния строительных конструкций выполнена путём визуального\nосвидетельствования и инструментальных измерений.\n\nВ процессе проведения обследования для выполнения поставленных задач были выполнены:\n- визуальное освидетельствование технического состояния строительных конструкций &lt;объект&gt;;\n- схемы и ведомости дефектов и повреждений с фиксацией их мест и характера;\n- описание фотографий дефектных участков;\n- результаты проверки наличия характерных деформаций отдельных строительных конструкций;\n- обмеры конструкций.\n\nНа основании полученных результатов были разработаны выводы и рекомендации по обеспечению\nбезопасной дальнейшей эксплуатации основных несущих конструкций.\n\nНа момент обследования:\n- &lt;помещение эксплуатируется как …&gt;;\n- &lt;помещения … фактически объединены&gt;;\n- &lt;арочный проезд действующий&gt;.\n\nИсходные данные:\n- техническое задание на обследование …;\n- поэтажные планы ПИБ;\n- технический паспорт.\n\nНормативная документация:\n- ГОСТ 31937-2024 «Здания и сооружения. Правила обследования и мониторинга технического\n  состояния»;\n- ГОСТ Р 55567-2013 (для объектов культурного наследия);\n- СП 13-102-2003 «Правила обследования несущих строительных конструкций зданий и сооружений»;\n- СП 20.13330.2016 «Нагрузки и воздействия»;\n- СП 70.13330.2012 «Несущие и ограждающие конструкции»;\n- СП 15.13330.2020 «Каменные и армокаменные конструкции»;\n- СП 16.13330.2017 «Стальные конструкции»;\n- СП 63.13330.2018 «Бетонные и железобетонные конструкции» (при ж.-б.);\n- СП 64.13330.2017 «Деревянные конструкции» (при дереве);\n- СП 22.13330.2016 «Основания зданий и сооружений» (при фундаментах);\n- Классификатор основных видов дефектов в строительстве и промышленности строительных\n  материалов (17.11.1993);\n- Федеральный закон от 30.12.2009 № 384-ФЗ «Технический регламент о безопасности зданий\n  и сооружений».</code></pre><p><strong>Таблица приборов:</strong></p><pre><code>| Наименование и тип прибора или инструмента | Назначение |\n| Рулетка 5 м | Определение размеров конструкций |\n| Штангенциркуль WDK-MC20005 | Измерение толщины конструкций |\n| Толщиномер ультразвуковой А 1207 | Измерение толщины металла |\n| Лупа ЛИ-3-10х № … | Измерение ширины раскрытия трещин |\n| Линейка стальная | Определение геометрических параметров |\n| Цифровая фотокамера Canon EOS | Фотофиксация дефектов и повреждений |\n| Молоток | Вскрытие отделочных слоёв |\n| Зубило | Вскрытие отделочных слоёв |</code></pre><hr><h2 id=\"s5\">5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш-РЕЗ)</h2><pre><code>Результаты обследования\n\nЗона проведения обследования:\nстроительные конструкции &lt;объект&gt; в границах осей &lt;1-5/А-Г&gt;.\n\nРазбивка помещений:\n- подвальное помещение под кв. № 24 примем за Помещение № 1 на отм. 0.000 в осях 1-2/А-Г;\n- подвальное помещение под арочным проездом примем за Помещение № 2 на отм. 0.000\n  в осях 2-3/А-Г;\n- …\nПринимаем уровень земли за отметку 0.000.\n\nПомещение № 1 на отм. 0.000 в осях 1-2/А-Г\nНадподвальное перекрытие в границах помещения № 1 выполнено по металлическим балкам\nдвутаврового сечения. Балки перекрывают пролёт &lt;3,7&gt; м в свету и опираются &lt;на несущие\nкирпичные стены&gt; с шагом &lt;1100&gt; мм. Выявлена &lt;сквозная&gt; коррозия балок (до &lt;100&gt; %).\nСортамент балок определить невозможно ввиду полного разрушения конструкций.\nМежбалочное заполнение — бетонное на кирпичном бое, покрытие выполнено из &lt;…&gt;.\nВ совокупности выявленные дефекты указывают на исчерпание несущей способности\nнадподвального перекрытия. В соответствии с ГОСТ 31937-2024 установлено аварийное\nтехническое состояние надподвального перекрытия.\nПризнаков аварийного технического состояния выше отм. 0.000 в осях 1-2/А-Г не выявлено.</code></pre><h3 id=\"s6\">5.1 Обязательные элементы описания каждого элемента</h3><ol><li>Местоположение (помещение, отметка, оси).</li><li>Конструкция и материал (тип, сечение, пролёт, шаг, опирание).</li><li>Заполнение и покрытие.</li><li>Дефекты с параметрами.</li><li>Фраза-связка о причинах/исчерпании.</li><li>Вывод со ссылкой на норму и категорией.</li><li>Контрольная фраза об отсутствии аварийности выше/ниже.</li></ol><hr><h2 id=\"s7\">6. ВЫВОДЫ (Ш-ВЫВ)</h2><pre><code>Выводы\n\nОсновными причинами повреждений конструкций являются:\n- длительный срок эксплуатации;\n- отсутствие противокоррозионной обработки металлических балок;\n- недостаточная вентиляция подвального помещения;\n- систематическое затопление помещений подвала.\n\nВ соответствии с ГОСТ 31937-2024 установлено аварийное техническое состояние:\n- надподвального перекрытия под помещением 2-Н, 3-Н на отм. 0.000 в осях 3-4/А-В;\n- надподвального перекрытия под арочным проездом на отм. 0.000 в осях 2-3/А-Г;\n- лестничной площадки ЛК № 1 на отм. 0.000 в осях 4-5/А-Б;\n- участка стены в уровне подвала в осях 2/В-Г.\n\nВ соответствии с ГОСТ 31937-2024 установлено ограниченно-работоспособное техническое\nсостояние:\n- лестничного марша ЛК № 1 от отм. +0.660 до отм. +2.945 в осях 4-5/Б-Г;\n- лестничной площадки ЛК № 1 на отм. +0.660 в осях 4-5/А-Б.\n\nПри визуальном обследовании несущих кирпичных стен в осях 1-5/А-Г дефекты не наблюдаются,\nуклон отсутствует. В соответствии с ГОСТ 31937-2024 дефектов аварийного состояния\nконструкций несущих кирпичных стен в осях 1-5/А-Г не установлено.</code></pre><p><strong>Типовые причины (выбирать по объекту):</strong></p><ul><li>длительный срок эксплуатации;</li><li>отсутствие противокоррозионной обработки металлических балок;</li><li>недостаточная вентиляция подвального помещения;</li><li>систематическое затопление помещений подвала;</li><li>протечки кровли и водостоков;</li><li>отсутствие или разрушение гидроизоляции;</li><li>перегрузка конструкций (изменение назначения, установка оборудования);</li><li>механические воздействия при перепланировках;</li><li>дефекты строительства и монтажа.</li></ul><hr><h2 id=\"s8\">7. РЕКОМЕНДАЦИИ (Ш-РЕК)</h2><pre><code>Рекомендации\n\n- Выполнить замену всех балок надподвального перекрытия на отм. 0.000 в осях 1-5/А-Г.\n- Выполнить замену всех перемычек в уровне подвала в осях 2/В-Г; 3/В-Г; 3-4/В; 3-4/Г; 4-5/Б.\n- Выполнить восстановление лестничного марша от отм. -1.480 до отм. 0.000 в осях 3-4/В-Г.\n- Выполнить замену косоуров лестничного марша от отм. 0.000 до отм. +0.660.\n\nРаботы выполнять по отдельно разработанному проекту в рамках капитального ремонта общего\nимущества многоквартирных домов.\n\nС учётом совокупности всех дефектов проектно-сметной документацией следует предусмотреть\nвыполнение работ по замене всех строительных конструкций надподвального перекрытия\nот отм. 0.000 до отм. +0.660 в осях 1-5/А-Г; лестничной клетки № 1 от отм. 0.000\nдо отм. +0.660; лестничной клетки от отм. -1.480 до отм. +0.660.\n\nУправляющей организацией произвести контраварийные мероприятия путём установки стоечных\nкреплений из металла под аварийной зоной.\n\nНеобходимо проводить систематическое наблюдение противоаварийных мероприятий с целью\nобеспечения безопасности проживания граждан.\n\nРекомендуемый срок следующего обследования — &lt;не позднее 20__ г.&gt; (п. 4.2 ГОСТ 31937-2024).</code></pre><p><strong>Словарь действий:</strong> замена; восстановление; усиление; ремонт; защита от коррозии; восстановление гидроизоляции; восстановление водоотвода и вентиляции; установка страховочных креплений; ограничение эксплуатации; разработка проекта.</p><hr><h2 id=\"s9\">8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам)</h2><h3 id=\"s10\">8.1 Категория</h3><ul><li>«В соответствии с ГОСТ 31937-2024 установлено <strong>аварийное</strong> техническое состояние …»</li><li>«… установлено <strong>ограниченно-работоспособное</strong> техническое состояние …»</li><li>«… установлено <strong>работоспособное</strong> техническое состояние …»</li><li>«… состояние конструкций оценено как <strong>нормативное</strong> …»</li></ul><h3 id=\"s11\">8.2 Причина и механизм</h3><ul><li>«В совокупности выявленные дефекты указывают на исчерпание несущей способности …»</li><li>«Выявлена сквозная коррозия (до 100 %) с участками частичного обрушения.»</li><li>«Выявлена поверхностная коррозия (до 11 %).»</li><li>«Сортамент … определить невозможно ввиду полного разрушения конструкций.»</li><li>«Основными причинами повреждений конструкций являются: …»</li><li>«Дефекты носят эксплуатационный характер и обусловлены …»</li><li>«Причиной образования трещин является неравномерная осадка основания, о чём</li></ul><p>свидетельствует характер их раскрытия …»</p><h3 id=\"s12\">8.3 Отсутствие дефектов</h3><ul><li>«При визуальном обследовании … дефекты не наблюдаются, уклон отсутствует.»</li><li>«Признаков аварийного технического состояния выше отм. … в осях … не выявлено.»</li><li>«Дефектов аварийного состояния конструкций … не установлено.»</li></ul><h3 id=\"s13\">8.4 Обоснование отказа от расчёта</h3><ul><li>«По причине выявления значительных коррозий и полной утраты несущей способности</li></ul><p>строительных конструкций … выполнение поверочных расчётов не требуется.»</p><ul><li>«Несущая способность конструкций не подтверждается поверочными расчётами» — для ОР.</li></ul><h3 id=\"s14\">8.5 ОКН</h3><ul><li>«Объект имеет статус выявленного объекта культурного наследия … на основании</li></ul><p>распоряжения КГИОП от __.__.____ № ___.»</p><ul><li>«Работы выполнять в соответствии с ГОСТ Р 55567-2013 и заданием КГИОП.»</li></ul><h3 id=\"s15\">8.6 Ограничения</h3><ul><li>«Заключение составлено по результатам визуального и инструментального обследования</li></ul><p>в объёме, предусмотренном техническим заданием.»</p><ul><li>«Выводы относятся к конструкциям, доступным осмотру на момент обследования.»</li><li>«Скрытые дефекты, не выявленные при вскрытиях, настоящим заключением не оцениваются.»</li></ul><hr><h2 id=\"s16\">9. ПРИЛОЖЕНИЕ П-1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ</h2><p>Термины в <strong>точной редакции ГОСТ 31937-2024</strong>: обследование (3.16), специализированная организация (3.24), категория (3.8), критерий (3.10), оценка (3.19), четыре категории (3.15, 3.21, 3.18, 3.1), поверочный расчёт (3.20), мониторинг (3.12—3.14, 3.17), восстановление (3.3), усиление (3.27).</p><p><strong>Не копировать</strong> формулировки ГОСТ 31937-2011 — они отличаются (см. разбор эталонных заключений, раздел 7).</p><hr><h2 id=\"s17\">10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б)</h2><h3 id=\"s18\">10.1 Приложение А (обследование) — 16 позиций</h3><ol><li>Адрес объекта.</li><li>Время проведения обследования.</li><li>Организация, проводившая обследование.</li><li>Статус объекта (памятник архитектуры, исторический памятник).</li><li>Тип проекта (типовой с серией / индивидуальный).</li><li>Проектная организация.</li><li>Строительная организация.</li><li>Год возведения.</li><li>Год и характер последнего капремонта или реконструкции.</li><li>Собственник.</li><li>Форма собственности.</li><li>Конструктивный тип (каркас, смешанный каркас, с несущими стенами).</li><li>Число этажей.</li><li>Период основного тона собственных колебаний / предельное значение.</li><li>Крен (вдоль продольной и поперечной осей) / предельное значение.</li><li>Установленная категория технического состояния объекта, отдельных типов конструкций.</li></ol><p>Приложение: фотографии; описание местности; описание состояния по визуальному обследованию; описание конструкций; чертежи с обмерами; ведомость дефектов; схемы мест измерений и вскрытий; результаты измерений и показатели для расчётов; нагрузки и поверочные расчёты; планы обмеров и разрезы, планы шурфов и скважин; геология и гидрогеология; фото повреждений; анализ причин; рекомендации по восстановлению или усилению.</p><h3 id=\"s19\">10.2 Приложение Б (комплексное обследование) — 15 позиций</h3><p>Позиции 1—12 аналогичны, плюс оценка: лифтового оборудования; электросетей и связи; водостоков; ГВС; отопления; ХВС; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции; теплотехнического состояния ограждающих конструкций.</p><hr><h2 id=\"s20\">11. ЧЕК-ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ</h2><ul><li>[ ] Шифр сквозной: титул, содержание, ТЗ.</li><li>[ ] Содержание совпадает с фактическими приложениями.</li><li>[ ] Нормативы указаны с годами; нет «ГОСТ Р 31937-2011».</li><li>[ ] ГОСТ 31937-2024 указан везде, включая выводы.</li><li>[ ] Каждый элемент привязан к осям и отметке.</li><li>[ ] Категории только из четырёх; обоснованы дефектами или расчётом.</li><li>[ ] Для аварийного состояния — противоаварийные мероприятия и информирование.</li><li>[ ] Для ОР — мониторинг/восстановление/усиление.</li><li>[ ] Указан рекомендуемый срок следующего обследования.</li><li>[ ] Дефектная ведомость согласована с фото и схемами.</li><li>[ ] Приборы с поверкой, специалисты с аттестацией.</li><li>[ ] Ограничения и объём обследования оговорены.</li><li>[ ] Проверены орфография и терминология («надподвальное», «ограниченно-работоспособное»).</li></ul>", "toc": [["s1", "1. СТРУКТУРА ТОМА (эталон)", 2], ["s2", "2. ТИТУЛЬНЫЙ ЛИСТ (Ш-ТИТ)", 2], ["s3", "3. ТЕХНИЧЕСКОЕ ЗАДАНИЕ (Ш-ТЗ)", 2], ["s4", "4. ОБЩИЕ ПОЛОЖЕНИЯ (Ш-ОП)", 2], ["s5", "5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш-РЕЗ)", 2], ["s6", "5.1 Обязательные элементы описания каждого элемента", 3], ["s7", "6. ВЫВОДЫ (Ш-ВЫВ)", 2], ["s8", "7. РЕКОМЕНДАЦИИ (Ш-РЕК)", 2], ["s9", "8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам)", 2], ["s10", "8.1 Категория", 3], ["s11", "8.2 Причина и механизм", 3], ["s12", "8.3 Отсутствие дефектов", 3], ["s13", "8.4 Обоснование отказа от расчёта", 3], ["s14", "8.5 ОКН", 3], ["s15", "8.6 Ограничения", 3], ["s16", "9. ПРИЛОЖЕНИЕ П-1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ", 2], ["s17", "10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б)", 2], ["s18", "10.1 Приложение А (обследование) — 16 позиций", 3], ["s19", "10.2 Приложение Б (комплексное обследование) — 15 позиций", 3], ["s20", "11. ЧЕК-ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ", 2]], "chars": 14427, "plain": " ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ Готовые к вставке структуры и фразы. Основа — 6 последних экспертиз (эталон) и требования ГОСТ 31937 2024 (приложения А, Б). Формулировки — рабочие, проверены практикой. Категории — 06 Оценка состояния , обоснования — 08 Обоснования . Формы: заключение о необходимости капремонта — приложение Б [СП 547]( /doc/sp547); проект — [СП 368]( /doc/sp368). 1. СТРУКТУРА ТОМА (эталон) № Документ Шифр 1 Титульный лист — 2 Содержание тома <шифр /С 3 Выписка из реестра членов СРО — 4 Техническое задание <шифр /ТЗ 5 Заключение (Общие положения; Результаты; Выводы и рекомендации) — 6 Приложение № 1. Методика оценки (ГОСТ 31937 2024) — 7 Приложение № 2. Графические материалы — 8 Приложение № 3. Фотофиксация — 9 Приложение № 4. Дефектная ведомость — 1
