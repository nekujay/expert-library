ие несущую способность, и/или достаточность несущей способности не подтверждена расчётом; опасности внезапного разрушения нет</td><td>п. 3.18</td><td>Контроль (мониторинг) и/или мероприятия по восстановлению/усилению, затем мониторинг</td></tr><tr><td><strong>Аварийное</strong></td><td>Повреждения и деформации свидетельствуют об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости</td><td>п. 3.1</td><td><strong>Не допускается</strong>; противоаварийные мероприятия; обязательный мониторинг</td></tr></tbody></table></div><h3 id=\"s2\">1.1 Что следует из категории (п. 4.5)</h3><ul><li>нормативное/работоспособное → эксплуатация при фактических нагрузках и воздействиях</li></ul><p><strong>без ограничений</strong>;</p><ul><li>ограниченно-работоспособное → <strong>контроль состояния</strong>, мероприятия по восстановлению</li></ul><p>или усилению конструкций и/или грунтов, последующий мониторинг (при необходимости);</p><ul><li>аварийное → <strong>эксплуатация не допускается</strong>, разработать и выполнить **противоаварийные</li></ul><p>мероприятия<strong>, до приведения в работоспособное состояние — </strong>обязательный режим мониторинга**.</p><h3 id=\"s3\">1.2 Информирование (п. 4.6)</h3><p>При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — <strong>письменно</strong> информировать заказчика, при возможности собственника, лиц, в чьём хозяйственном ведении находится объект, эксплуатирующую организацию, иных ответственных за эксплуатацию.</p><hr><h2 id=\"s4\">2. КАК ОПРЕДЕЛЯТЬ (алгоритм)</h2><ol><li>Установить фактическое состояние элемента по внешним признакам (приложения В—Д,</li></ol><p>п. 5.1.9—5.1.10).</p><ol><li>Сопоставить с критериями: геометрия, сечения, ширина раскрытия трещин, прогибы,</li></ol><p>коррозия, прочность материалов.</p><ol><li>При необходимости — поверочный расчёт по фактическим данным (п. 3.20).</li><li>Определить долю снижения несущей способности (п. 3.8): нет снижения — нормативное/</li></ol><p>работоспособное; снижение есть, но без опасности внезапного разрушения — ограниченно- работоспособное; исчерпание — аварийное.</p><ol><li>Зафиксировать в выводах: категория + элемент + оси/отметка + основание (дефект или расчёт).</li><li>Назначить мероприятия и срок следующего обследования (п. 4.2).</li></ol><p><strong>Правило:</strong> категория ставится <strong>по элементу</strong>, а не «по зданию в целом»; итоговая категория объекта — по совокупности, с перечислением элементов каждой категории.</p><hr><h2 id=\"s5\">3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ</h2><h3 id=\"s6\">3.1 Железобетон (приложение В)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Порог</th><th>Категория</th></tr></thead><tbody><tr><td>Нормальные трещины в изгибаемых и растянутых элементах</td><td>А240 — &gt; 0,5 мм; А300/А400/А500/А600 — &gt; 0,4 мм; прочие — &gt; 0,3 мм</td><td>ОР</td></tr><tr><td>Трещины вдоль арматуры</td><td>≤ 3 мм</td><td>ОР; <strong>на опорных участках — А</strong></td></tr><tr><td>Отслоение защитного слоя</td><td>—</td><td>ОР; <strong>на опоре — А</strong></td></tr><tr><td>Сколы бетона в сжатой зоне</td><td>—</td><td>ОР</td></tr><tr><td>Наклонные трещины со смещением бетона; трещины, пересекающие арматуру</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Выпучивание сжатой арматуры; продольные трещины в сжатой зоне; шелушение</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Уменьшение площадок опирания против проекта</td><td>—</td><td><strong>А</strong> (расчёт)</td></tr><tr><td>Разрыв/смещение поперечной арматуры в зоне наклонных трещин</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Отрыв анкеров, расстройство стыков</td><td>—</td><td><strong>А</strong></td></tr><tr><td>Относительные прогибы</td><td>фермы 1/700; балки 1/300; плиты 1/150</td><td>А (расчёт)</td></tr><tr><td>Волосяные трещины вдоль арматуры, следы ржавчины</td><td>—</td><td>ОР (при обосновании расчётом отсутствия опасности)</td></tr><tr><td>Промасливание бетона</td><td>—</td><td>А по результатам расчётов и оценки влияния</td></tr></tbody></table></div><h3 id=\"s7\">3.2 Каменные конструкции (приложение В)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Порог</th><th>Категория</th></tr></thead><tbody><tr><td>Вертикальные трещины, пересекающие ≥ 2 ряда кладки</td><td>раскрытие 0,1—0,5 мм, ≥ 2 трещин на 1 м стены</td><td>ОР</td></tr><tr><td>Искривление горизонтальных/вертикальных линий стен</td><td>—</td><td>ОР</td></tr><tr><td>Выпучивание стен</td><td>—</td><td>ОР</td></tr><tr><td>Отклонение от вертикали</td><td>—</td><td>ОР</td></tr><tr><td>Отколы углов, пробоины, выбоины, борозды</td><td>—</td><td>ОР</td></tr><tr><td>Увлажнение кладки</td><td>—</td><td>ОР</td></tr><tr><td>Трещины в перемычках</td><td>—</td><td>ОР</td></tr><tr><td>Трещины под опорами и подушками</td><td>—</td><td>ОР</td></tr><tr><td>Шелушение, выветривание, деструкция</td><td>—</td><td>ОР</td></tr></tbody></table></div><p><strong>Диагностика причины по рисунку трещин:</strong> см. <code>04_Дефекты</code>, Д-К02-06…09.</p><h3 id=\"s8\">3.3 Стальные конструкции (приложение Г)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Категория</th></tr></thead><tbody><tr><td>Деформации, выявленные обмерами/съёмкой</td><td>А (расчёт)</td></tr><tr><td>Отклонения геометрии от проекта</td><td>А (расчёт)</td></tr><tr><td>Отклонения от проектного положения</td><td>А (расчёт)</td></tr><tr><td>Расцентровка и неточная подгонка в узлах</td><td>А (расчёт)</td></tr><tr><td>Уменьшение сечения (вырезы, смятия, коррозия)</td><td>А (расчёт)</td></tr><tr><td>Изменение статической схемы</td><td>А (расчёт)</td></tr><tr><td>Зазоры/срывы контакта во фрикционных соединениях группы 1</td><td>А</td></tr><tr><td>То же, группы 2—4</td><td>ОР</td></tr><tr><td>Зазоры в срезных болтовых соединениях</td><td>ОР</td></tr><tr><td>Зазоры в растянутых, сжато-изогнутых, изгибаемо-растянутых фланцевых соединениях (группа 1)</td><td>А</td></tr><tr><td>Зазоры в сжатых фланцевых соединениях (группы 1, 2—4)</td><td>ОР</td></tr><tr><td>Недопустимые дефекты кромок (группа 1)</td><td>А</td></tr><tr><td>Недопустимые дефекты кромок (группы 2—4)</td><td>А (расчёт)</td></tr><tr><td>Искривления сверх допустимых</td><td>А (расчёт)</td></tr><tr><td>Хрупкие/усталостные трещины в основном металле</td><td>А</td></tr><tr><td>Недопустимые дефекты сварных швов (группа 1)</td><td>А</td></tr><tr><td>То же, группы 2—4</td><td>А (расчёт)</td></tr><tr><td>Выпучивание стенок замкнутых сечений (без трещин)</td><td>ОР</td></tr><tr><td>Местные погибы (не влияют на работу)</td><td>ОР</td></tr><tr><td>Разрушение защитных покрытий, коррозия</td><td>ОР</td></tr></tbody></table></div><h3 id=\"s9\">3.4 Деревянные конструкции (приложение Д)</h3><div class=\"tablewrap\"><table><thead><tr><th>Признак</th><th>Категория</th></tr></thead><tbody><tr><td>Отсутствие элемента наката, потеря целостности</td><td>А</td></tr><tr><td>Отклонение от проектного положения</td><td>А (расчёт)</td></tr><tr><td>Местное выпучивание простенков брусчатых стен</td><td>А (расчёт)</td></tr><tr><td>Расстройство горизонтальных связей между брёвнами</td><td>А (расчёт)</td></tr><tr><td>Осадка элементов сборно-щитовых и каркасных стен с перекосами и щелями</td><td>А (расчёт)</td></tr><tr><td>Продольные трещины</td><td>А (расчёт)</td></tr><tr><td>Прогиб элементов</td><td>А (расчёт)</td></tr></tbody></table></div><hr><h2 id=\"s10\">4. ПОРОГИ, КОТОРЫЕ ЧАЩЕ ВСЕГО СПРАШИВАЮТ</h2><div class=\"tablewrap\"><table><thead><tr><th>Показатель</th><th>Значение</th><th>Источник</th></tr></thead><tbody><tr><td>Глубина шурфа у фундамента</td><td>на 0,15 м ниже подошвы</td><td>5.2.7</td></tr><tr><td>Число участков определения прочности бетона</td><td>3 / 6 / 9</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке прочности</td><td>≥ 3</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при определении армирования</td><td>≥ 3</td><td>5.3.1.10</td></tr><tr><td>Число стержней для испытаний</td><td>≥ 3</td><td>5.3.1.11</td></tr><tr><td>Число участков по рисунку профиля</td><td>≥ 5</td><td>5.3.1.12</td></tr><tr><td>Сечения при измерении коррозии</td><td>≥ 3, в каждом ≥ 3 измерений</td><td>5.3.3.13</td></tr><tr><td>Ширина раскрытия трещин в ж.-б.</td><td>0,3 / 0,4 / 0,5 мм</td><td>В, 1.6</td></tr><tr><td>Трещины вдоль арматуры</td><td>≤ 3 мм</td><td>В, 1.4</td></tr><tr><td>Прогибы</td><td>1/150; 1/300; 1/700</td><td>В, 1.9</td></tr><tr><td>Трещины кладки</td><td>0,1—0,5 мм, ≥ 2 на 1 м</td><td>В, 2.10</td></tr><tr><td>Первое обследование</td><td>≤ 2 лет после ввода</td><td>4.2</td></tr><tr><td>Периодичность</td><td>1 раз в 10 лет; 5 лет — неблагоприятные условия</td><td>4.2</td></tr></tbody></table></div><hr><h2 id=\"s11\">5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ</h2><p>Форма приложения Б требует отдельной оценки:</p><ul><li>лифтового оборудования;</li><li>электрических сетей и средств связи;</li><li>водостоков;</li><li>горячего водоснабжения;</li><li>отопления;</li><li>холодного водоснабжения;</li><li>канализации;</li><li>вентиляции;</li><li>мусороудаления;</li><li>газоснабжения;</li><li>звукоизоляции конструкций;</li><li>теплотехнического состояния ограждающих конструкций.</li></ul><p>Для каждой — своя категория и свои дефекты (раздел 5.4—5.7 ГОСТ).</p><hr><h2 id=\"s12\">6. ЧЕГО НЕ ДЕЛАТЬ</h2><ol><li>Не ставить «ограниченно-работоспособное» при отсутствии дефектов и подтверждённой</li></ol><p>несущей способности — это противоречит п. 3.18 и 3.21.</p><ol><li>Не ставить «аварийное» только потому, что «выглядит плохо»: нужны признаки исчерпания</li></ol><p>несущей способности или крен, угрожающий устойчивости.</p><ol><li>Не подменять категорию «физическим износом» (п. 3.28) — это разные понятия.</li><li>Не указывать категорию без привязки к элементу, осям и отметке.</li><li>Не ссылаться на ГОСТ 31937 без года; действующая редакция — 2024.</li><li>Не забывать рекомендуемый срок следующего обследования (п. 4.2).</li></ol>", "toc": [["s1", "1. ЧЕТЫРЕ КАТЕГОРИИ", 2], ["s2", "1.1 Что следует из категории (п. 4.5)", 3], ["s3", "1.2 Информирование (п. 4.6)", 3], ["s4", "2. КАК ОПРЕДЕЛЯТЬ (алгоритм)", 2], ["s5", "3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ", 2], ["s6", "3.1 Железобетон (приложение В)", 3], ["s7", "3.2 Каменные конструкции (приложение В)", 3], ["s8", "3.3 Стальные конструкции (приложение Г)", 3], ["s9", "3.4 Деревянные конструкции (приложение Д)", 3], ["s10", "4. ПОРОГИ, КОТОРЫЕ ЧАЩЕ ВСЕГО СПРАШИВАЮТ", 2], ["s11", "5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ", 2], ["s12", "6. ЧЕГО НЕ ДЕЛАТЬ", 2]], "chars": 8234, "plain": " КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ Четыре категории, их признаки, пороги и что делать дальше. Основа — ГОСТ 31937 2024, пп. 3.1, 3.15, 3.18, 3.21, 4.5, приложения В—Д. Дефекты — в 04 Дефекты , формулировки — в 07 Шаблоны . 1. ЧЕТЫРЕ КАТЕГОРИИ Категория Определение (сжато) Норма Режим эксплуатации Нормативное Все параметры соответствуют проекту и действующим нормам на момент обследования п. 3.15 Без ограничений Работоспособное Часть параметров не отвечает проекту/нормам, но нарушения не мешают работоспособности; несущая способность и механическая безопасность обеспечены п. 3.21 Без ограничений Ограниченно работоспособное Есть крены, дефекты и повреждения, снизившие несущую способность, и/или достаточность несущей способности не подтверждена расчётом; опасности внезапного разрушения нет п. 3.18 Контроль (мониторинг) и/или мероприятия по восстановлению/усилению, затем мониторинг Аварийное Повреждения и деформации свидетельствуют об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости п. 3.1 Не допускается ; противоаварийные мероприятия; обязательный мониторинг 1.1 Что следует из категории (п. 4.5) нормативное/работоспособное → эксплуатация при фактических нагрузках и воздействиях без ограничений ; ограниченно работоспособное → контроль состояния , мероприятия по восстановлению или усилению конструкций и/или грунтов, последующий мониторинг (при необходимости); аварийное → эксплуатация не допускается , разработать и выполнить противоаварийные мероприятия , до приведения в работоспособное состояние — обязательный режим мониторинга . 1.2 Информирование (п. 4.6) При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — письменно информировать заказчика, при возможности собственника, лиц, в чьём хозяйственном ведении находится объект, эксплуатирующую организацию, иных ответственных за эксплуатацию. 2. КАК ОПРЕДЕЛЯТЬ (алгоритм) 1. Установить фактическое состояние элемента по внешним признакам (приложения В—Д, п. 5.1.9—5.1.10). 2. Сопоставить с критериями: геометрия, сечения, ширина раскрытия трещин, прогибы, коррозия, прочность материалов. 3. При необходимости — поверочный расчёт по фактическим данным (п. 3.20). 4. Определить долю снижения несущей способности (п. 3.8): нет снижения — нормативное/ работоспособное; снижение есть, но без опасности внезапного разрушения — ограниченно работоспособное; исчерпание — аварийное. 5. Зафиксировать в выводах: категория + элемент + оси/отметка + основание (дефект или расчёт). 6. Назначить мероприятия и срок следующего обследования (п. 4.2). Правило: категория ставится по элементу , а не «по зданию в целом»; итоговая категория объекта — по совокупности, с перечислением элементов каждой категории. 3. ПОРОГИ И ПРИЗНАКИ ПО МАТЕРИАЛАМ 3.1 Железобетон (приложение В) Признак Порог Категория Нормальные трещины в изгибаемых и растянутых элементах А240 — 0,5 мм; А300/А400/А500/А600 — 0,4 мм; прочие — 0,3 мм ОР Трещины вдоль арматуры ≤ 3 мм ОР; на опорных участках — А Отслоение защитного слоя — ОР; на опоре — А Сколы бетона в сжатой зоне — ОР Наклонные трещины со смещением бетона; трещины, пересекающие арматуру — А Выпучивание сжатой арматуры; продольные трещины в сжатой зоне; шелушение — А Уменьшение площадок опирания против проекта — А (расчёт) Разрыв/смещение поперечной арматуры в зоне наклонных трещин — А Отрыв анкеров, расстройство стыков — А Относительные прогибы фермы 1/700; балки 1/300; плиты 1/150 А (расчёт) Волосяные трещины вдоль арматуры, следы ржавчины — ОР (при обосновании расчётом отсутствия опасности) Промасливание бетона — А по результатам расчётов и оценки влияния 3.2 Каменные конструкции (приложение В) Признак Порог Категория Вертикальные трещины, пересекающие ≥ 2 ряда кладки раскрытие 0,1—0,5 мм, ≥ 2 трещин на 1 м стены ОР Искривление горизонтальных/вертикальных линий стен — ОР Выпучивание стен — ОР Отклонение от вертикали — ОР Отколы углов, пробоины, выбоины, борозды — ОР Увлажнение кладки — ОР Трещины в перемычках — ОР Трещины под опорами и подушками — ОР Шелушение, выветривание, деструкция — ОР Диагностика причины по рисунку трещин: см. 04 Дефекты , Д К02 06…09. 3.3 Стальные конструкции (приложение Г) Признак Категория Деформации, выявленные обмерами/съёмкой А (расчёт) Отклонения геометрии от проекта А (расчёт) Отклонения от проектного положения А (расчёт) Расцентровка и неточная подгонка в узлах А (расчёт) Уменьшение сечения (вырезы, смятия, коррозия) А (расчёт) Изменение статической схемы А (расчёт) Зазоры/срывы контакта во фрикционных соединениях группы 1 А То же, группы 2—4 ОР Зазоры в срезных болтовых соединениях ОР Зазоры в растянутых, сжато изогнутых, изгибаемо растянутых фланцевых соединениях (группа 1) А Зазоры в сжатых фланцевых соединениях (группы 1, 2—4) ОР Недопустимые дефекты кромок (группа 1) А Недопустимые дефекты кромок (группы 2—4) А (расчёт) Искривления сверх допустимых А (расчёт) Хрупкие/усталостные трещины в основном металле А Недопустимые дефекты сварных швов (группа 1) А То же, группы 2—4 А (расчёт) Выпучивание стенок замкнутых сечений (без трещин) ОР Местные погибы (не влияют на работу) ОР Разрушение защитных покрытий, коррозия ОР 3.4 Деревянные конструкции (приложение Д) Признак Категория Отсутствие элемента наката, потеря целостности А Отклонение от проектного положения А (расчёт) Местное выпучивание простенков брусчатых стен А (расчёт) Расстройство горизонтальных связей между брёвнами А (расчёт) Осадка элементов сборно щитовых и каркасных стен с перекосами и щелями А (расчёт) Продольные трещины А (расчёт) Прогиб элементов А (расчёт) 4. ПОРОГИ, КОТОРЫЕ ЧАЩЕ ВСЕГО СПРАШИВАЮТ Показатель Значение Источник Глубина шурфа у фундамента на 0,15 м ниже подошвы 5.2.7 Число участков определения прочности бетона 3 / 6 / 9 5.3.1.8 Число конструкций при оценке прочности ≥ 3 5.3.1.8 Число конструкций при определении армирования ≥ 3 5.3.1.10 Число стержней для испытаний ≥ 3 5.3.1.11 Число участков по рисунку профиля ≥ 5 5.3.1.12 Сечения при измерении коррозии ≥ 3, в каждом ≥ 3 измерений 5.3.3.13 Ширина раскрытия трещин в ж. б. 0,3 / 0,4 / 0,5 мм В, 1.6 Трещины вдоль арматуры ≤ 3 мм В, 1.4 Прогибы 1/150; 1/300; 1/700 В, 1.9 Трещины кладки 0,1—0,5 мм, ≥ 2 на 1 м В, 2.10 Первое обследование ≤ 2 лет после ввода 4.2 Периодичность 1 раз в 10 лет; 5 лет — неблагоприятные условия 4.2 5. ОЦЕНКА ПО СИСТЕМАМ ИНЖЕНЕРНОГО ОБЕСПЕЧЕНИЯ Форма приложения Б требует отдельной оценки: лифтового оборудования; электрических сетей и средств связи; водостоков; горячего водоснабжения; отопления; холодного водоснабжения; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции конструкций; теплотехнического состояния ограждающих конструкций. Для каждой — своя категория и свои дефекты (раздел 5.4—5.7 ГОСТ). 6. ЧЕГО НЕ ДЕЛАТЬ 1. Не ставить «ограниченно работоспособное» при отсутствии дефектов и подтверждённой несущей способности — это противоречит п. 3.18 и 3.21. 2. Не ставить «аварийное» только потому, что «выглядит плохо»: нужны признаки исчерпания несущей способности или крен, угрожающий устойчивости. 3. Не подменять категорию «физическим износом» (п. 3.28) — это разные понятия. 4. Не указывать категорию без привязки к элементу, осям и отметке. 5. Не ссылаться на ГОСТ 31937 без года; действующая редакция — 2024. 6. Не забывать рекомендуемый срок следующего обследования (п. 4.2). "}, {"id": "templates", "file": "07_Шаблоны_заключений/ШАБЛОНЫ.md", "title": "ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ", "section": "07_Шаблоны_заключений", "html": "<h1>ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ</h1><blockquote><p>Готовые к вставке структуры и фразы. Основа — 6 последних экспертиз (эталон) и требования ГОСТ 31937-2024 (приложения А, Б). Формулировки — рабочие, проверены практикой. Категории — <code>06_Оценка_состояния</code>, обоснования — <code>08_Обоснования</code>.</p></blockquote><hr><h2 id=\"s1\">1. СТРУКТУРА ТОМА (эталон)</h2><div class=\"tablewrap\"><table><thead><tr><th>№</th><th>Документ</th><th>Шифр</th></tr></thead><tbody><tr><td>1</td><td>Титульный лист</td><td>—</td></tr><tr><td>2</td><td>Содержание тома</td><td><code>&lt;шифр&gt;/С</code></td></tr><tr><td>3</td><td>Выписка из реестра членов СРО</td><td>—</td></tr><tr><td>4</td><td>Техническое задание</td><td><code>&lt;шифр&gt;/ТЗ</code></td></tr><tr><td>5</td><td>Заключение (Общие положения; Результаты; Выводы и рекомендации)</td><td>—</td></tr><tr><td>6</td><td>Приложение № 1. Методика оценки (ГОСТ 31937-2024)</td><td>—</td></tr><tr><td>7</td><td>Приложение № 2. Графические материалы</td><td>—</td></tr><tr><td>8</td><td>Приложение № 3. Фотофиксация</td><td>—</td></tr><tr><td>9</td><td>Приложение № 4. Дефектная ведомость</td><td>—</td></tr><tr><td>10</td><td>Приложение № 5. Поверочные расчёты</td><td>—</td></tr><tr><td>11</td><td>Приложение № 6. Толщинометрия</td><td>—</td></tr><tr><td>12</td><td>Приложение № 7. Техническая документация</td><td>—</td></tr><tr><td>13</td><td>Приложение № 8. Аттестация специалистов</td><td>—</td></tr></tbody></table></div><p><strong>Шифр:</strong> <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>, например <code>06/1-08-2026-АВР</code>.</p><hr><h2 id=\"s2\">2. ТИТУЛЬНЫЙ ЛИСТ (Ш-ТИТ)</h2><pre><code>Техническое заключение\nпо результатам обследования технического состояния\nстроительных конструкций\n&lt;объект: надподвального перекрытия под арочным проездом, кв. № 24, помещением 2-Н; 3-Н и ЛК № 1&gt;\nпо адресу:\nг. Санкт-Петербург, &lt;улица&gt;, дом &lt;N&gt;, литера &lt;А&gt;\n\nШифр - &lt;06/1-08-2026-АВР&gt;\n\nГенеральный директор        &lt;И. О. Фамилия&gt;\n\n&lt;год&gt;</code></pre><hr><h2 id=\"s3\">3. ТЕХНИЧЕСКОЕ ЗАДАНИЕ (Ш-ТЗ)</h2><pre><code>Техническое задание\nна выполнение обследования технического состояния строительных конструкций\n&lt;объект&gt; по адресу: &lt;адрес&gt;\n\nНаименование и местонахождение объекта:\nжилой многоквартирный дом по адресу: &lt;адрес&gt;\n\nЦель обследования:\nвыявление технического состояния строительных конструкций &lt;объект&gt;\n\nРаботы по обследованию:\n- обследование технического состояния конструкций;\n- фотофиксация;\n- оформление отчётной документации в виде технического заключения по результатам\n  визуального обследования с выдачей рекомендаций по дальнейшей безопасной эксплуатации\n  конструкций и необходимому ремонту.\n\nОсобые условия:\nтехническое заключение передаётся Заказчику на бумажном носителе в 2-х экземплярах.\n\nСОГЛАСОВАНО\nГенеральный директор\n&lt;ООО «…»&gt;\n______________ &lt;И. О. Фамилия&gt;\nМ. П.\n«__» ________ 20__ г.</code></pre><hr><h2 id=\"s4\">4. ОБЩИЕ ПОЛОЖЕНИЯ (Ш-ОП)</h2><pre><code>Объект (жилой многоквартирный дом) расположен по адресу: &lt;адрес&gt;. Здание многоквартирного\nжилого дома было построено в &lt;год&gt; году по индивидуальному проекту &lt;архитектор&gt;.\n[Рисунок 1. Ситуационный план участка]\n\nЦель обследования:\nоценка технического состояния строительных конструкций &lt;объект&gt;.\n\nОценка технического состояния строительных конструкций выполнена путём визуального\nосвидетельствования и инструментальных измерений.\n\nВ процессе проведения обследования для выполнения поставленных задач были выполнены:\n- визуальное освидетельствование технического состояния строительных конструкций &lt;объект&gt;;\n- схемы и ведомости дефектов и повреждений с фиксацией их мест и характера;\n- описание фотографий дефектных участков;\n- результаты проверки наличия характерных деформаций отдельных строительных конструкций;\n- обмеры конструкций.\n\nНа основании полученных результатов были разработаны выводы и рекомендации по обеспечению\nбезопасной дальнейшей эксплуатации основных несущих конструкций.\n\nНа момент обследования:\n- &lt;помещение эксплуатируется как …&gt;;\n- &lt;помещения … фактически объединены&gt;;\n- &lt;арочный проезд действующий&gt;.\n\nИсходные данные:\n- техническое задание на обследование …;\n- поэтажные планы ПИБ;\n- технический паспорт.\n\nНормативная документация:\n- ГОСТ 31937-2024 «Здания и сооружения. Правила обследования и мониторинга технического\n  состояния»;\n- ГОСТ Р 55567-2013 (для объектов культурного наследия);\n- СП 13-102-2003 «Правила обследования несущих строительных конструкций зданий и сооружений»;\n- СП 20.13330.2016 «Нагрузки и воздействия»;\n- СП 70.13330.2012 «Несущие и ограждающие конструкции»;\n- СП 15.13330.2020 «Каменные и армокаменные конструкции»;\n- СП 16.13330.2017 «Стальные конструкции»;\n- СП 63.13330.2018 «Бетонные и железобетонные конструкции» (при ж.-б.);\n- СП 64.13330.2017 «Деревянные конструкции» (при дереве);\n- СП 22.13330.2016 «Основания зданий и сооружений» (при фундаментах);\n- Классификатор основных видов дефектов в строительстве и промышленности строительных\n  материалов (17.11.1993);\n- Федеральный закон от 30.12.2009 № 384-ФЗ «Технический регламент о безопасности зданий\n  и сооружений».</code></pre><p><strong>Таблица приборов:</strong></p><pre><code>| Наименование и тип прибора или инструмента | Назначение |\n| Рулетка 5 м | Определение размеров конструкций |\n| Штангенциркуль WDK-MC20005 | Измерение толщины конструкций |\n| Толщиномер ультразвуковой А 1207 | Измерение толщины металла |\n| Лупа ЛИ-3-10х № … | Измерение ширины раскрытия трещин |\n| Линейка стальная | Определение геометрических параметров |\n| Цифровая фотокамера Canon EOS | Фотофиксация дефектов и повреждений |\n| Молоток | Вскрытие отделочных слоёв |\n| Зубило | Вскрытие отделочных слоёв |</code></pre><hr><h2 id=\"s5\">5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш-РЕЗ)</h2><pre><code>Результаты обследования\n\nЗона проведения обследования:\nстроительные конструкции &lt;объект&gt; в границах осей &lt;1-5/А-Г&gt;.\n\nРазбивка помещений:\n- подвальное помещение под кв. № 24 примем за Помещение № 1 на отм. 0.000 в осях 1-2/А-Г;\n- подвальное помещение под арочным проездом примем за Помещение № 2 на отм. 0.000\n  в осях 2-3/А-Г;\n- …\nПринимаем уровень земли за отметку 0.000.\n\nПомещение № 1 на отм. 0.000 в осях 1-2/А-Г\nНадподвальное перекрытие в границах помещения № 1 выполнено по металлическим балкам\nдвутаврового сечения. Балки перекрывают пролёт &lt;3,7&gt; м в свету и опираются &lt;на несущие\nкирпичные стены&gt; с шагом &lt;1100&gt; мм. Выявлена &lt;сквозная&gt; коррозия балок (до &lt;100&gt; %).\nСортамент балок определить невозможно ввиду полного разрушения конструкций.\nМежбалочное заполнение — бетонное на кирпичном бое, покрытие выполнено из &lt;…&gt;.\nВ совокупности выявленные дефекты указывают на исчерпание несущей способности\nнадподвального перекрытия. В соответствии с ГОСТ 31937-2024 установлено аварийное\nтехническое состояние надподвального перекрытия.\nПризнаков аварийного технического состояния выше отм. 0.000 в осях 1-2/А-Г не выявлено.</code></pre><h3 id=\"s6\">5.1 Обязательные элементы описания каждого элемента</h3><ol><li>Местоположение (помещение, отметка, оси).</li><li>Конструкция и материал (тип, сечение, пролёт, шаг, опирание).</li><li>Заполнение и покрытие.</li><li>Дефекты с параметрами.</li><li>Фраза-связка о причинах/исчерпании.</li><li>Вывод со ссылкой на норму и категорией.</li><li>Контрольная фраза об отсутствии аварийности выше/ниже.</li></ol><hr><h2 id=\"s7\">6. ВЫВОДЫ (Ш-ВЫВ)</h2><pre><code>Выводы\n\nОсновными причинами повреждений конструкций являются:\n- длительный срок эксплуатации;\n- отсутствие противокоррозионной обработки металлических балок;\n- недостаточная вентиляция подвального помещения;\n- систематическое затопление помещений подвала.\n\nВ соответствии с ГОСТ 31937-2024 установлено аварийное техническое состояние:\n- надподвального перекрытия под помещением 2-Н, 3-Н на отм. 0.000 в осях 3-4/А-В;\n- надподвального перекрытия под арочным проездом на отм. 0.000 в осях 2-3/А-Г;\n- лестничной площадки ЛК № 1 на отм. 0.000 в осях 4-5/А-Б;\n- участка стены в уровне подвала в осях 2/В-Г.\n\nВ соответствии с ГОСТ 31937-2024 установлено ограниченно-работоспособное техническое\nсостояние:\n- лестничного марша ЛК № 1 от отм. +0.660 до отм. +2.945 в осях 4-5/Б-Г;\n- лестничной площадки ЛК № 1 на отм. +0.660 в осях 4-5/А-Б.\n\nПри визуальном обследовании несущих кирпичных стен в осях 1-5/А-Г дефекты не наблюдаются,\nуклон отсутствует. В соответствии с ГОСТ 31937-2024 дефектов аварийного состояния\nконструкций несущих кирпичных стен в осях 1-5/А-Г не установлено.</code></pre><p><strong>Типовые причины (выбирать по объекту):</strong></p><ul><li>длительный срок эксплуатации;</li><li>отсутствие противокоррозионной обработки металлических балок;</li><li>недостаточная вентиляция подвального помещения;</li><li>систематическое затопление помещений подвала;</li><li>протечки кровли и водостоков;</li><li>отсутствие или разрушение гидроизоляции;</li><li>перегрузка конструкций (изменение назначения, установка оборудования);</li><li>механические воздействия при перепланировках;</li><li>дефекты строительства и монтажа.</li></ul><hr><h2 id=\"s8\">7. РЕКОМЕНДАЦИИ (Ш-РЕК)</h2><pre><code>Рекомендации\n\n- Выполнить замену всех балок надподвального перекрытия на отм. 0.000 в осях 1-5/А-Г.\n- Выполнить замену всех перемычек в уровне подвала в осях 2/В-Г; 3/В-Г; 3-4/В; 3-4/Г; 4-5/Б.\n- Выполнить восстановление лестничного марша от отм. -1.480 до отм. 0.000 в осях 3-4/В-Г.\n- Выполнить замену косоуров лестничного марша от отм. 0.000 до отм. +0.660.\n\nРаботы выполнять по отдельно разработанному проекту в рамках капитального ремонта общего\nимущества многоквартирных домов.\n\nС учётом совокупности всех дефектов проектно-сметной документацией следует предусмотреть\nвыполнение работ по замене всех строительных конструкций надподвального перекрытия\nот отм. 0.000 до отм. +0.660 в осях 1-5/А-Г; лестничной клетки № 1 от отм. 0.000\nдо отм. +0.660; лестничной клетки от отм. -1.480 до отм. +0.660.\n\nУправляющей организацией произвести контраварийные мероприятия путём установки стоечных\nкреплений из металла под аварийной зоной.\n\nНеобходимо проводить систематическое наблюдение противоаварийных мероприятий с целью\nобеспечения безопасности проживания граждан.\n\nРекомендуемый срок следующего обследования — &lt;не позднее 20__ г.&gt; (п. 4.2 ГОСТ 31937-2024).</code></pre><p><strong>Словарь действий:</strong> замена; восстановление; усиление; ремонт; защита от коррозии; восстановление гидроизоляции; восстановление водоотвода и вентиляции; установка страховочных креплений; ограничение эксплуатации; разработка проекта.</p><hr><h2 id=\"s9\">8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам)</h2><h3 id=\"s10\">8.1 Категория</h3><ul><li>«В соответствии с ГОСТ 31937-2024 установлено <strong>аварийное</strong> техническое состояние …»</li><li>«… установлено <strong>ограниченно-работоспособное</strong> техническое состояние …»</li><li>«… установлено <strong>работоспособное</strong> техническое состояние …»</li><li>«… состояние конструкций оценено как <strong>нормативное</strong> …»</li></ul><h3 id=\"s11\">8.2 Причина и механизм</h3><ul><li>«В совокупности выявленные дефекты указывают на исчерпание несущей способности …»</li><li>«Выявлена сквозная коррозия (до 100 %) с участками частичного обрушения.»</li><li>«Выявлена поверхностная коррозия (до 11 %).»</li><li>«Сортамент … определить невозможно ввиду полного разрушения конструкций.»</li><li>«Основными причинами повреждений конструкций являются: …»</li><li>«Дефекты носят эксплуатационный характер и обусловлены …»</li><li>«Причиной образования трещин является неравномерная осадка основания, о чём</li></ul><p>свидетельствует характер их раскрытия …»</p><h3 id=\"s12\">8.3 Отсутствие дефектов</h3><ul><li>«При визуальном обследовании … дефекты не наблюдаются, уклон отсутствует.»</li><li>«Признаков аварийного технического состояния выше отм. … в осях … не выявлено.»</li><li>«Дефектов аварийного состояния конструкций … не установлено.»</li></ul><h3 id=\"s13\">8.4 Обоснование отказа от расчёта</h3><ul><li>«По причине выявления значительных коррозий и полной утраты несущей способности</li></ul><p>строительных конструкций … выполнение поверочных расчётов не требуется.»</p><ul><li>«Несущая способность конструкций не подтверждается поверочными расчётами» — для ОР.</li></ul><h3 id=\"s14\">8.5 ОКН</h3><ul><li>«Объект имеет статус выявленного объекта культурного наследия … на основании</li></ul><p>распоряжения КГИОП от __.__.____ № ___.»</p><ul><li>«Работы выполнять в соответствии с ГОСТ Р 55567-2013 и заданием КГИОП.»</li></ul><h3 id=\"s15\">8.6 Ограничения</h3><ul><li>«Заключение составлено по результатам визуального и инструментального обследования</li></ul><p>в объёме, предусмотренном техническим заданием.»</p><ul><li>«Выводы относятся к конструкциям, доступным осмотру на момент обследования.»</li><li>«Скрытые дефекты, не выявленные при вскрытиях, настоящим заключением не оцениваются.»</li></ul><hr><h2 id=\"s16\">9. ПРИЛОЖЕНИЕ П-1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ</h2><p>Термины в <strong>точной редакции ГОСТ 31937-2024</strong>: обследование (3.16), специализированная организация (3.24), категория (3.8), критерий (3.10), оценка (3.19), четыре категории (3.15, 3.21, 3.18, 3.1), поверочный расчёт (3.20), мониторинг (3.12—3.14, 3.17), восстановление (3.3), усиление (3.27).</p><p><strong>Не копировать</strong> формулировки ГОСТ 31937-2011 — они отличаются (см. разбор эталонных заключений, раздел 7).</p><hr><h2 id=\"s17\">10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б)</h2><h3 id=\"s18\">10.1 Приложение А (обследование) — 16 позиций</h3><ol><li>Адрес объекта.</li><li>Время проведения обследования.</li><li>Организация, проводившая обследование.</li><li>Статус объекта (памятник архитектуры, исторический памятник).</li><li>Тип проекта (типовой с серией / индивидуальный).</li><li>Проектная организация.</li><li>Строительная организация.</li><li>Год возведения.</li><li>Год и характер последнего капремонта или реконструкции.</li><li>Собственник.</li><li>Форма собственности.</li><li>Конструктивный тип (каркас, смешанный каркас, с несущими стенами).</li><li>Число этажей.</li><li>Период основного тона собственных колебаний / предельное значение.</li><li>Крен (вдоль продольной и поперечной осей) / предельное значение.</li><li>Установленная категория технического состояния объекта, отдельных типов конструкций.</li></ol><p>Приложение: фотографии; описание местности; описание состояния по визуальному обследованию; описание конструкций; чертежи с обмерами; ведомость дефектов; схемы мест измерений и вскрытий; результаты измерений и показатели для расчётов; нагрузки и поверочные расчёты; планы обмеров и разрезы, планы шурфов и скважин; геология и гидрогеология; фото повреждений; анализ причин; рекомендации по восстановлению или усилению.</p><h3 id=\"s19\">10.2 Приложение Б (комплексное обследование) — 15 позиций</h3><p>Позиции 1—12 аналогичны, плюс оценка: лифтового оборудования; электросетей и связи; водостоков; ГВС; отопления; ХВС; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции; теплотехнического состояния ограждающих конструкций.</p><hr><h2 id=\"s20\">11. ЧЕК-ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ</h2><ul><li>[ ] Шифр сквозной: титул, содержание, ТЗ.</li><li>[ ] Содержание совпадает с фактическими приложениями.</li><li>[ ] Нормативы указаны с годами; нет «ГОСТ Р 31937-2011».</li><li>[ ] ГОСТ 31937-2024 указан везде, включая выводы.</li><li>[ ] Каждый элемент привязан к осям и отметке.</li><li>[ ] Категории только из четырёх; обоснованы дефектами или расчётом.</li><li>[ ] Для аварийного состояния — противоаварийные мероприятия и информирование.</li><li>[ ] Для ОР — мониторинг/восстановление/усиление.</li><li>[ ] Указан рекомендуемый срок следующего обследования.</li><li>[ ] Дефектная ведомость согласована с фото и схемами.</li><li>[ ] Приборы с поверкой, специалисты с аттестацией.</li><li>[ ] Ограничения и объём обследования оговорены.</li><li>[ ] Проверены орфография и терминология («надподвальное», «ограниченно-работоспособное»).</li></ul>", "toc": [["s1", "1. СТРУКТУРА ТОМА (эталон)", 2], ["s2", "2. ТИТУЛЬНЫЙ ЛИСТ (Ш-ТИТ)", 2], ["s3", "3. ТЕХНИЧЕСКОЕ ЗАДАНИЕ (Ш-ТЗ)", 2], ["s4", "4. ОБЩИЕ ПОЛОЖЕНИЯ (Ш-ОП)", 2], ["s5", "5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш-РЕЗ)", 2], ["s6", "5.1 Обязательные элементы описания каждого элемента", 3], ["s7", "6. ВЫВОДЫ (Ш-ВЫВ)", 2], ["s8", "7. РЕКОМЕНДАЦИИ (Ш-РЕК)", 2], ["s9", "8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам)", 2], ["s10", "8.1 Категория", 3], ["s11", "8.2 Причина и механизм", 3], ["s12", "8.3 Отсутствие дефектов", 3], ["s13", "8.4 Обоснование отказа от расчёта", 3], ["s14", "8.5 ОКН", 3], ["s15", "8.6 Ограничения", 3], ["s16", "9. ПРИЛОЖЕНИЕ П-1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ", 2], ["s17", "10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б)", 2], ["s18", "10.1 Приложение А (обследование) — 16 позиций", 3], ["s19", "10.2 Приложение Б (комплексное обследование) — 15 позиций", 3], ["s20", "11. ЧЕК-ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ", 2]], "chars": 14307, "plain": " ШАБЛОНЫ ЗАКЛЮЧЕНИЙ И ФОРМУЛИРОВКИ Готовые к вставке структуры и фразы. Основа — 6 последних экспертиз (эталон) и требования ГОСТ 31937 2024 (приложения А, Б). Формулировки — рабочие, проверены практикой. Категории — 06 Оценка состояния , обоснования — 08 Обоснования . 1. СТРУКТУРА ТОМА (эталон) № Документ Шифр 1 Титульный лист — 2 Содержание тома <шифр /С 3 Выписка из реестра членов СРО — 4 Техническое задание <шифр /ТЗ 5 Заключение (Общие положения; Результаты; Выводы и рекомендации) — 6 Приложение № 1. Методика оценки (ГОСТ 31937 2024) — 7 Приложение № 2. Графические материалы — 8 Приложение № 3. Фотофиксация — 9 Приложение № 4. Дефектная ведомость — 10 Приложение № 5. Поверочные расчёты — 11 Приложение № 6. Толщинометрия — 12 Приложение № 7. Техническая документация — 13 Приложение № 8. Аттестация специалистов — Шифр: <номер /<месяц <год АВР , например 06/1 08 2026 АВР . 2. ТИТУЛЬНЫЙ ЛИСТ (Ш ТИТ) Техническое заключение по результатам обследования технического состояния строительных конструкций <объект: надподвального перекрытия под арочным проездом, кв. № 24, помещением 2 Н; 3 Н и ЛК № 1 по адресу: г. Санкт Петербург, <улица , дом <N , литера <А Шифр <06/1 08 2026 АВР Генеральный директор <И. О. Фамилия <год 3. ТЕХНИЧЕСКОЕ ЗАДАНИЕ (Ш ТЗ) Техническое задание на выполнение обследования технического состояния строительных конструкций <объект по адресу: <адрес Наименование и местонахождение объекта: жилой многоквартирный дом по адресу: <адрес Цель обследования: выявление технического состояния строительных конструкций <объект Работы по обследованию: обследование технического состояния конструкций; фотофиксация; оформление отчётной документации в виде технического заключения по результатам визуального обследования с выдачей рекомендаций по дальнейшей безопасной эксплуатации конструкций и необходимому ремонту. Особые условия: техническое заключение передаётся Заказчику на бумажном носителе в 2 х экземплярах. СОГЛАСОВАНО Генеральный директор <ООО «…» <И. О. Фамилия М. П. « » 20 г. 4. ОБЩИЕ ПОЛОЖЕНИЯ (Ш ОП) Объект (жилой многоквартирный дом) расположен по адресу: <адрес . Здание многоквартирного жилого дома было построено в <год году по индивидуальному проекту <архитектор . [Рисунок 1. Ситуационный план участка] Цель обследования: оценка технического состояния строительных конструкций <объект . Оценка технического состояния строительных конструкций выполнена путём визуального освидетельствования и инструментальных измерений. В процессе проведения обследования для выполнения поставленных задач были выполнены: визуальное освидетельствование технического состояния строительных конструкций <объект ; схемы и ведомости дефектов и повреждений с фиксацией их мест и характера; описание фотографий дефектных участков; результаты проверки наличия характерных деформаций отдельных строительных конструкций; обмеры конструкций. На основании полученных результатов были разработаны выводы и рекомендации по обеспечению безопасной дальнейшей эксплуатации основных несущих конструкций. На момент обследования: <помещение эксплуатируется как … ; <помещения … фактически объединены ; <арочный проезд действующий . Исходные данные: техническое задание на обследование …; поэтажные планы ПИБ; технический паспорт. Нормативная документация: ГОСТ 31937 2024 «Здания и сооружения. Правила обследования и мониторинга технического состояния»; ГОСТ Р 55567 2013 (для объектов культурного наследия); СП 13 102 2003 «Правила обследования несущих строительных конструкций зданий и сооружений»; СП 20.13330.2016 «Нагрузки и воздействия»; СП 70.13330.2012 «Несущие и ограждающие конструкции»; СП 15.13330.2020 «Каменные и армокаменные конструкции»; СП 16.13330.2017 «Стальные конструкции»; СП 63.13330.2018 «Бетонные и железобетонные конструкции» (при ж. б.); СП 64.13330.2017 «Деревянные конструкции» (при дереве); СП 22.13330.2016 «Основания зданий и сооружений» (при фундаментах); Классификатор основных видов дефектов в строительстве и промышленности строительных материалов (17.11.1993); Федеральный закон от 30.12.2009 № 384 ФЗ «Технический регламент о безопасности зданий и сооружений». Таблица приборов: Наименование и тип прибора или инструмента Назначение Рулетка 5 м Определение размеров конструкций Штангенциркуль WDK MC20005 Измерение толщины конструкций Толщиномер ультразвуковой А 1207 Измерение толщины металла Лупа ЛИ 3 10х № … Измерение ширины раскрытия трещин Линейка стальная Определение геометрических параметров Цифровая фотокамера Canon EOS Фотофиксация дефектов и повреждений Молоток Вскрытие отделочных слоёв Зубило Вскрытие отделочных слоёв 5. РЕЗУЛЬТАТЫ ОБСЛЕДОВАНИЯ (Ш РЕЗ) Результаты обследования Зона проведения обследования: строительные конструкции <объект в границах осей <1 5/А Г . Разбивка помещений: подвальное помещение под кв. № 24 примем за Помещение № 1 на отм. 0.000 в осях 1 2/А Г; подвальное помещение под арочным проездом примем за Помещение № 2 на отм. 0.000 в осях 2 3/А Г; … Принимаем уровень земли за отметку 0.000. Помещение № 1 на отм. 0.000 в осях 1 2/А Г Надподвальное перекрытие в границах помещения № 1 выполнено по металлическим балкам двутаврового сечения. Балки перекрывают пролёт <3,7 м в свету и опираются <на несущие кирпичные стены с шагом <1100 мм. Выявлена <сквозная коррозия балок (до <100 %). Сортамент балок определить невозможно ввиду полного разрушения конструкций. Межбалочное заполнение — бетонное на кирпичном бое, покрытие выполнено из <… . В совокупности выявленные дефекты указывают на исчерпание несущей способности надподвального перекрытия. В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние надподвального перекрытия. Признаков аварийного технического состояния выше отм. 0.000 в осях 1 2/А Г не выявлено. 5.1 Обязательные элементы описания каждого элемента 1. Местоположение (помещение, отметка, оси). 2. Конструкция и материал (тип, сечение, пролёт, шаг, опирание). 3. Заполнение и покрытие. 4. Дефекты с параметрами. 5. Фраза связка о причинах/исчерпании. 6. Вывод со ссылкой на норму и категорией. 7. Контрольная фраза об отсутствии аварийности выше/ниже. 6. ВЫВОДЫ (Ш ВЫВ) Выводы Основными причинами повреждений конструкций являются: длительный срок эксплуатации; отсутствие противокоррозионной обработки металлических балок; недостаточная вентиляция подвального помещения; систематическое затопление помещений подвала. В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние: надподвального перекрытия под помещением 2 Н, 3 Н на отм. 0.000 в осях 3 4/А В; надподвального перекрытия под арочным проездом на отм. 0.000 в осях 2 3/А Г; лестничной площадки ЛК № 1 на отм. 0.000 в осях 4 5/А Б; участка стены в уровне подвала в осях 2/В Г. В соответствии с ГОСТ 31937 2024 установлено ограниченно работоспособное техническое состояние: лестничного марша ЛК № 1 от отм. +0.660 до отм. +2.945 в осях 4 5/Б Г; лестничной площадки ЛК № 1 на отм. +0.660 в осях 4 5/А Б. При визуальном обследовании несущих кирпичных стен в осях 1 5/А Г дефекты не наблюдаются, уклон отсутствует. В соответствии с ГОСТ 31937 2024 дефектов аварийного состояния конструкций несущих кирпичных стен в осях 1 5/А Г не установлено. Типовые причины (выбирать по объекту): длительный срок эксплуатации; отсутствие противокоррозионной обработки металлических балок; недостаточная вентиляция подвального помещения; систематическое затопление помещений подвала; протечки кровли и водостоков; отсутствие или разрушение гидроизоляции; перегрузка конструкций (изменение назначения, установка оборудования); механические воздействия при перепланировках; дефекты строительства и монтажа. 7. РЕКОМЕНДАЦИИ (Ш РЕК) Рекомендации Выполнить замену всех балок надподвального перекрытия на отм. 0.000 в осях 1 5/А Г. Выполнить замену всех перемычек в уровне подвала в осях 2/В Г; 3/В Г; 3 4/В; 3 4/Г; 4 5/Б. Выполнить восстановление лестничного марша от отм. 1.480 до отм. 0.000 в осях 3 4/В Г. Выполнить замену косоуров лестничного марша от отм. 0.000 до отм. +0.660. Работы выполнять по отдельно разработанному проекту в рамках капитального ремонта общего имущества многоквартирных домов. С учётом совокупности всех дефектов проектно сметной документацией следует предусмотреть выполнение работ по замене всех строительных конструкций надподвального перекрытия от отм. 0.000 до отм. +0.660 в осях 1 5/А Г; лестничной клетки № 1 от отм. 0.000 до отм. +0.660; лестничной клетки от отм. 1.480 до отм. +0.660. Управляющей организацией произвести контраварийные мероприятия путём установки стоечных креплений из металла под аварийной зоной. Необходимо проводить систематическое наблюдение противоаварийных мероприятий с целью обеспечения безопасности проживания граждан. Рекомендуемый срок следующего обследования — <не позднее 20 г. (п. 4.2 ГОСТ 31937 2024). Словарь действий: замена; восстановление; усиление; ремонт; защита от коррозии; восстановление гидроизоляции; восстановление водоотвода и вентиляции; установка страховочных креплений; ограничение эксплуатации; разработка проекта. 8. БИБЛИОТЕКА ФОРМУЛИРОВОК (по типам) 8.1 Категория «В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние …» «… установлено ограниченно работоспособное техническое состояние …» «… установлено работоспособное техническое состояние …» «… состояние конструкций оценено как нормативное …» 8.2 Причина и механизм «В совокупности выявленные дефекты указывают на исчерпание несущей способности …» «Выявлена сквозная коррозия (до 100 %) с участками частичного обрушения.» «Выявлена поверхностная коррозия (до 11 %).» «Сортамент … определить невозможно ввиду полного разрушения конструкций.» «Основными причинами повреждений конструкций являются: …» «Дефекты носят эксплуатационный характер и обусловлены …» «Причиной образования трещин является неравномерная осадка основания, о чём свидетельствует характер их раскрытия …» 8.3 Отсутствие дефектов «При визуальном обследовании … дефекты не наблюдаются, уклон отсутствует.» «Признаков аварийного технического состояния выше отм. … в осях … не выявлено.» «Дефектов аварийного состояния конструкций … не установлено.» 8.4 Обоснование отказа от расчёта «По причине выявления значительных коррозий и полной утраты несущей способности строительных конструкций … выполнение поверочных расчётов не требуется.» «Несущая способность конструкций не подтверждается поверочными расчётами» — для ОР. 8.5 ОКН «Объект имеет статус выявленного объекта культурного наследия … на основании распоряжения КГИОП от . . № .» «Работы выполнять в соответствии с ГОСТ Р 55567 2013 и заданием КГИОП.» 8.6 Ограничения «Заключение составлено по результатам визуального и инструментального обследования в объёме, предусмотренном техническим заданием.» «Выводы относятся к конструкциям, доступным осмотру на момент обследования.» «Скрытые дефекты, не выявленные при вскрытиях, настоящим заключением не оцениваются.» 9. ПРИЛОЖЕНИЕ П 1 «МЕТОДИКА» — ЧТО ВКЛЮЧАТЬ Термины в точной редакции ГОСТ 31937 2024 : обследование (3.16), специализированная организация (3.24), категория (3.8), критерий (3.10), оценка (3.19), четыре категории (3.15, 3.21, 3.18, 3.1), поверочный расчёт (3.20), мониторинг (3.12—3.14, 3.17), восстановление (3.3), усиление (3.27). Не копировать формулировки ГОСТ 31937 2011 — они отличаются (см. разбор эталонных заключений, раздел 7). 10. ФОРМА ЗАКЛЮЧЕНИЯ ПО ГОСТ (приложения А и Б) 10.1 Приложение А (обследование) — 16 позиций 1. Адрес объекта. 2. Время проведения обследования. 3. Организация, проводившая обследование. 4. Статус объекта (памятник архитектуры, исторический памятник). 5. Тип проекта (типовой с серией / индивидуальный). 6. Проектная организация. 7. Строительная организация. 8. Год возведения. 9. Год и характер последнего капремонта или реконструкции. 10. Собственник. 11. Форма собственности. 12. Конструктивный тип (каркас, смешанный каркас, с несущими стенами). 13. Число этажей. 14. Период основного тона собственных колебаний / предельное значение. 15. Крен (вдоль продольной и поперечной осей) / предельное значение. 16. Установленная категория технического состояния объекта, отдельных типов конструкций. Приложение: фотографии; описание местности; описание состояния по визуальному обследованию; описание конструкций; чертежи с обмерами; ведомость дефектов; схемы мест измерений и вскрытий; результаты измерений и показатели для расчётов; нагрузки и поверочные расчёты; планы обмеров и разрезы, планы шурфов и скважин; геология и гидрогеология; фото повреждений; анализ причин; рекомендации по восстановлению или усилению. 10.2 Приложение Б (комплексное обследование) — 15 позиций Позиции 1—12 аналогичны, плюс оценка: лифтового оборудования; электросетей и связи; водостоков; ГВС; отопления; ХВС; канализации; вентиляции; мусороудаления; газоснабжения; звукоизоляции; теплотехнического состояния ограждающих конструкций. 11. ЧЕК ЛИСТ ПЕРЕД СДАЧЕЙ ЗАКЛЮЧЕНИЯ [ ] Шифр сквозной: титул, содержание, ТЗ. [ ] Содержание совпадает с фактическими приложениями. [ ] Нормативы указаны с годами; нет «ГОСТ Р 31937 2011». [ ] ГОСТ 31937 2024 указан везде, включая выводы. [ ] Каждый элемент привязан к осям и отметке. [ ] Категории только из четырёх; обоснованы дефектами или расчётом. [ ] Для аварийного состояния — противоаварийные мероприятия и информирование. [ ] Для ОР — мониторинг/восстановление/усиление. [ ] Указан рекомендуемый срок следующего обследования. [ ] Дефектная ведомость согласована с фото и схемами. [ ] Приборы с поверкой, специалисты с аттестацией. [ ] Ограничения и объём обследования оговорены. [ ] Проверены орфография и терминология («надподвальное», «ограниченно работоспособное»). "}, {"id": "grounds", "file": "08_Обоснования/ОБОСНОВАНИЯ.md", "title": "ОБОСНОВАНИЯ «НОРМА → ВЫВОД»", "section": "08_Обоснования", "html": "<h1>ОБОСНОВАНИЯ «НОРМА → ВЫВОД»</h1><blockquote><p>Типовые обоснования решений в заключении: почему назначена категория, почему нужна замена, почему расчёт не требуется, почему выбрано усиление. Каждое — со ссылкой на норму. Формулировки — в <code>07_Шаблоны</code>, категории — в <code>06_Оценка</code>.</p></blockquote><hr><h2 id=\"s1\">О-01. Обоснование аварийного состояния при сквозной коррозии металлических балок</h2><p><strong>Ситуация:</strong> балки перекрытия поражены коррозией насквозь, сечение не восстанавливается, сортамент не идентифицируется.</p><p><strong>Обоснование:</strong></p><ol><li>Выявлены повреждения, свидетельствующие об исчерпании несущей способности (п. 3.1 ГОСТ</li></ol><p>31937-2024 — определение аварийного состояния).</p><ol><li>Перекрытие относится к несущим конструкциям; его отказ создаёт непосредственную угрозу</li></ol><p>жизни и здоровью (п. 3.11 — механическая безопасность).</p><ol><li>Согласно п. 4.5, эксплуатация при аварийном состоянии не допускается; требуются</li></ol><p>противоаварийные мероприятия и обязательный мониторинг.</p><ol><li>Поверочный расчёт не выполняется, так как сечение утрачено и расчётная модель</li></ol><p>не может быть построена по фактическим данным (п. 3.20 — расчёт по фактическим параметрам).</p><p><strong>Вывод:</strong> «В соответствии с ГОСТ 31937-2024 установлено аварийное техническое состояние надподвального перекрытия».</p><p><strong>Связано:</strong> Д-К03-01, Д-К10-02, Т-001.</p><hr><h2 id=\"s2\">О-02. Обоснование аварийного состояния при разрушении заделки балки в стену</h2><p><strong>Ситуация:</strong> опорная часть балки разрушена, кладка под опорой выкрошена, балка смещена.</p><p><strong>Обоснование:</strong></p><ol><li>Приложение В, п. 1.12 — уменьшение площадок опирания против проекта → аварийное состояние</li></ol><p>(обосновывается расчётом).</p><ol><li>Приложение В, п. 2.13 — трещины и раздробление кладки под опорами.</li><li>Потеря опирания — прямой путь к обрушению (п. 3.1).</li></ol><p><strong>Вывод:</strong> аварийное; немедленные страховочные крепления.</p><p><strong>Связано:</strong> Д-К03-04, Д-К02-11.</p><hr><h2 id=\"s3\">О-03. Обоснование ограниченно-работоспособного состояния при поверхностной коррозии</h2><p><strong>Ситуация:</strong> коррозия поверхностная, сечение сохранено, но снижено; прогибы в норме.</p><p><strong>Обоснование:</strong></p><ol><li>Приложение Г — «разрушение защитных покрытий, коррозия металла» → ограниченно-</li></ol><p>работоспособное состояние.</p><ol><li>Снижение несущей способности есть, но опасности внезапного разрушения нет (п. 3.18).</li><li>Необходимы антикоррозионная защита и мониторинг (п. 4.5).</li></ol><p><strong>Вывод:</strong> ОР; рекомендации — очистка, защитное покрытие, наблюдение.</p><p><strong>Связано:</strong> Д-К03-02.</p><hr><h2 id=\"s4\">О-04. Обоснование замены конструкций вместо усиления</h2><p><strong>Ситуация:</strong> коррозия сквозная, сечение утрачено на большей части длины, узлы разрушены.</p><p><strong>Обоснование:</strong></p><ol><li>Усиление (п. 3.27) повышает несущую способность существующей конструкции; при утрате</li></ol><p>сечения усиливать нечего — конструкция не может быть включена в работу.</p><ol><li>Восстановление (п. 3.3) предполагает доведение до первоначального уровня; при полной</li></ol><p>утрате это фактически новое строительство.</p><ol><li>Экономически и технически замена равна восстановлению, но обеспечивает нормируемую</li></ol><p>надёжность.</p><p><strong>Вывод:</strong> «Выполнить замену … по отдельно разработанному проекту».</p><p><strong>Связано:</strong> Ш-РЕК, Т-003, Т-022.</p><hr><h2 id=\"s5\">О-05. Обоснование усиления (когда замена невозможна)</h2><p><strong>Ситуация:</strong> историческое здание, ОКН, замена недопустима; сечение снижено частично.</p><p><strong>Обоснование:</strong></p><ol><li>Усиление — повышение несущей способности по сравнению с фактическим состоянием (п. 3.27).</li><li>Для ОКН — сохранение подлинности, работы по ГОСТ Р 55567-2013 и заданию КГИОП.</li><li>Требуется поверочный расчёт усиленного элемента (п. 3.20) и проект усиления.</li></ol><p><strong>Вывод:</strong> «Выполнить усиление … по специально разработанному проекту, согласованному с КГИОП».</p><p><strong>Связано:</strong> О-07, Т-022.</p><hr><h2 id=\"s6\">О-06. Обоснование отказа от поверочного расчёта</h2><p><strong>Ситуация:</strong> конструкция полностью разрушена или утрачена.</p><p><strong>Обоснование:</strong></p><ol><li>Поверочный расчёт выполняется по фактическим геометрии, прочности и расчётной схеме</li></ol><p>(п. 3.20); при утрате сечения эти данные отсутствуют.</p><ol><li>Категория устанавливается по признакам исчерпания несущей способности (п. 3.1,</li></ol><p>приложения В—Д).</p><ol><li>Практика: «выполнение поверочных расчётов не требуется» (архив ТЗ).</li></ol><p><strong>Вывод:</strong> категория А без расчёта; обоснование — в тексте.</p><p><strong>Связано:</strong> Д-К10-02.</p><hr><h2 id=\"s7\">О-07. Обоснование применения ГОСТ Р 55567-2013 для ОКН</h2><p><strong>Ситуация:</strong> объект — выявленный объект культурного наследия.</p><p><strong>Обоснование:</strong></p><ol><li>ГОСТ 31937-2024 регулирует обследование конструкций, но не учитывает режим ОКН.</li><li>ГОСТ Р 55567-2013 устанавливает порядок инженерно-технических исследований на объектах</li></ol><p>культурного наследия.</p><ol><li>Работы ведутся по заданию КГИОП; выводы формулируются со ссылкой на оба документа.</li></ol><p><strong>Вывод:</strong> двойная ссылка в выводах; историческая справка в разделе «Результаты».</p><p><strong>Связано:</strong> Т-111, Ш-ОП.</p><hr><h2 id=\"s8\">О-08. Обоснование категории «работоспособное» при наличии дефектов</h2><p><strong>Ситуация:</strong> есть отделочные повреждения, не влияющие на несущую способность.</p><p><strong>Обоснование:</strong></p><ol><li>Работоспособное состояние — часть параметров не отвечает нормам, но работоспособность</li></ol><p>и механическая безопасность обеспечены (п. 3.21).</p><ol><li>Дефекты не снижают несущую способность; расчёт не требуется.</li><li>Эксплуатация без ограничений (п. 4.5).</li></ol><p><strong>Вывод:</strong> работоспособное; рекомендации — косметический ремонт.</p><p><strong>Связано:</strong> КРИТЕРИИ, п. 6.</p><hr><h2 id=\"s9\">О-09. Обоснование периодичности следующего обследования</h2><p><strong>Обоснование:</strong></p><ol><li>Первое обследование — не позднее 2 лет после ввода; далее не реже 1 раза в 10 лет;</li></ol><p>для неблагоприятных условий — 1 раз в 5 лет (п. 4.2).</p><ol><li>Рекомендуемый срок следующего обследования указывают в отчёте (п. 4.2).</li><li>Для аварийных и ОР — мониторинг до устранения (пп. 4.5, 6.3).</li></ol><p><strong>Вывод:</strong> «Рекомендуемый срок следующего обследования — не позднее 20__ г.»</p><p><strong>Связано:</strong> КРИТЕРИИ, п. 1.</p><hr><h2 id=\"s10\">О-10. Обоснование письменного информирования при аварии</h2><p><strong>Обоснование:</strong></p><ol><li>П. 4.6 обязывает письменно информировать заказчика, собственника, эксплуатирующую</li></ol><p>организацию при выявлении дефектов, способных привести к обрушению.</p><ol><li>Информирование — не рекомендация, а требование стандарта.</li><li>Факт информирования фиксируется в заключении.</li></ol><p><strong>Вывод:</strong> отдельный абзац в выводах + письмо.</p><p><strong>Связано:</strong> КРИТЕРИИ, п. 1.2.</p><hr><h2 id=\"s11\">О-11. Обоснование недостаточности визуального обследования</h2><p><strong>Ситуация:</strong> визуально выявлены дефекты, снижающие несущую способность.</p><p><strong>Обоснование:</strong></p><ol><li>П. 5.1.11: если выявлены дефекты, снижающие прочность, устойчивость и жёсткость,</li></ol><p>и требуется оценка несущей способности — детальное обследование проводится.</p><ol><li>П. 5.1.12: при характерных трещинах и перекосах — дополнительные инженерно-геологические</li></ol><p>изыскания.</p><ol><li>Без детального обследования нельзя установить категорию ОР или А обоснованно.</li></ol><p><strong>Вывод:</strong> назначить детальное обследование, вскрытия, испытания материалов.</p><p><strong>Связано:</strong> МЕТОДИКИ, п. 1.</p><hr><h2 id=\"s12\">О-12. Обоснование причин трещин по их рисунку</h2><p><strong>Обоснование (приложение В, пп. 2.6—2.9):</strong></p><ol><li>Параболические трещины, расходящиеся книзу от средней части здания — просадка грунта</li></ol><p>в средней части.</p><ol><li>Раскрытие, увеличивающееся кверху, наклонные/параболические от краёв — просадка крайних</li></ol><p>частей или твёрдое включение под средней частью.</p><ol><li>Близкая к вертикальной с раскрытием кверху — разлом из-за жёсткой опоры в грунте.</li><li>Одинаковое раскрытие по высоте со смещением части здания — просадка части здания.</li></ol><p><strong>Вывод:</strong> причина — неравномерная осадка; требуется проверка основания (шурфы, геология).</p><p><strong>Связано:</strong> Д-К02-06…09, Д-К01-01.</p><hr><h2 id=\"s13\">О-13. Обоснование требований к объёму испытаний бетона</h2><p><strong>Обоснование:</strong></p><ol><li>Число участков: 3 / 6 / 9 в зависимости от задачи (п. 5.3.1.8).</li><li>Число конструкций — не менее трёх (п. 5.3.1.8).</li><li>Участки — в местах наименьшей прочности, в зонах, определяющих несущую способность,</li></ol><p>и в местах дефектов (п. 5.3.1.7).</p><ol><li>Средства измерений — поверены (п. 4.10).</li></ol><p><strong>Вывод:</strong> объём испытаний соответствует ГОСТ; результаты представительны.</p><p><strong>Связано:</strong> МЕТОДИКИ, п. 5.1.</p><hr><h2 id=\"s14\">О-14. Обоснование запрета оценки стали по твёрдости</h2><p><strong>Обоснование:</strong></p><ol><li>П. 5.3.3.10 прямо запрещает определять предел текучести и предел прочности по косвенным</li></ol><p>характеристикам (твёрдости).</p><ol><li>П. 5.3.3.11 запрещает портативные РФА там, где нет точности по C, S, P.</li><li>Требуются испытания образцов (ГОСТ 1497, 9454) и спектральный анализ (ГОСТ 18895 /</li></ol><p>ГОСТ Р 54153-2010).</p><p><strong>Вывод:</strong> при отсутствии документации — отбор проб и лабораторные испытания.</p><p><strong>Связано:</strong> МЕТОДИКИ, п. 5.4.</p><hr><h2 id=\"s15\">О-15. Обоснование мероприятий по вентиляции и гидроизоляции подвала</h2><p><strong>Обоснование:</strong></p><ol><li>Причины коррозии и гнили — увлажнение и отсутствие вентиляции (практика архива;</li></ol><p>п. 5.3.6.6 — причины конденсата).</p><ol><li>Без устранения причин замена конструкций даст повторное поражение.</li><li>Мероприятия: восстановление гидроизоляции, водоотвода, вентиляции (п. 5.4, 5.4.8).</li></ol><p><strong>Вывод:</strong> включить в рекомендации как обязательные сопутствующие работы.</p><p><strong>Связано:</strong> Д-К09-01, Д-К01-03.</p>", "toc": [["s1", "О-01. Обоснование аварийного состояния при сквозной коррозии металлических балок", 2], ["s2", "О-02. Обоснование аварийного состояния при разрушении заделки балки в стену", 2], ["s3", "О-03. Обоснование ограниченно-работоспособного состояния при поверхностной коррозии", 2], ["s4", "О-04. Обоснование замены конструкций вместо усиления", 2], ["s5", "О-05. Обоснование усиления (когда замена невозможна)", 2], ["s6", "О-06. Обоснование отказа от поверочного расчёта", 2], ["s7", "О-07. Обоснование применения ГОСТ Р 55567-2013 для ОКН", 2], ["s8", "О-08. Обоснование категории «работоспособное» при наличии дефектов", 2], ["s9", "О-09. Обоснование периодичности следующего обследования", 2], ["s10", "О-10. Обоснование письменного информирования при аварии", 2], ["s11", "О-11. Обоснование недостаточности визуального обследования", 2], ["s12", "О-12. Обоснование причин трещин по их рисунку", 2], ["s13", "О-13. Обоснование требований к объёму испытаний бетона", 2], ["s14", "О-14. Обоснование запрета оценки стали по твёрдости", 2], ["s15", "О-15. Обоснование мероприятий по вентиляции и гидроизоляции подвала", 2]], "chars": 8794, "plain": " ОБОСНОВАНИЯ «НОРМА → ВЫВОД» Типовые обоснования решений в заключении: почему назначена категория, почему нужна замена, почему расчёт не требуется, почему выбрано усиление. Каждое — со ссылкой на норму. Формулировки — в 07 Шаблоны , категории — в 06 Оценка . О 01. Обоснование аварийного состояния при сквозной коррозии металлических балок Ситуация: балки перекрытия поражены коррозией насквозь, сечение не восстанавливается, сортамент не идентифицируется. Обоснование: 1. Выявлены повреждения, свидетельствующие об исчерпании несущей способности (п. 3.1 ГОСТ 31937 2024 — определение аварийного состояния). 2. Перекрытие относится к несущим конструкциям; его отказ создаёт непосредственную угрозу жизни и здоровью (п. 3.11 — механическая безопасность). 3. Согласно п. 4.5, эксплуатация при аварийном состоянии не допускается; требуются противоаварийные мероприятия и обязательный мониторинг. 4. Поверочный расчёт не выполняется, так как сечение утрачено и расчётная модель не может быть построена по фактическим данным (п. 3.20 — расчёт по фактическим параметрам). Вывод: «В соответствии с ГОСТ 31937 2024 установлено аварийное техническое состояние надподвального перекрытия». Связано: Д К03 01, Д К10 02, Т 001. О 02. Обоснование аварийного состояния при разрушении заделки балки в стену Ситуация: опорная часть балки разрушена, кладка под опорой выкрошена, балка смещена. Обоснование: 1. Приложение В, п. 1.12 — уменьшение площадок опирания против проекта → аварийное состояние (обосновывается расчётом). 2. Приложение В, п. 2.13 — трещины и раздробление кладки под опорами. 3. Потеря опирания — прямой путь к обрушению (п. 3.1). Вывод: аварийное; немедленные страховочные крепления. Связано: Д К03 04, Д К02 11. О 03. Обоснование ограниченно работоспособного состояния при поверхностной коррозии Ситуация: коррозия поверхностная, сечение сохранено, но снижено; прогибы в норме. Обоснование: 1. Приложение Г — «разрушение защитных покрытий, коррозия металла» → ограниченно работоспособное состояние. 2. Снижение несущей способности есть, но опасности внезапного разрушения нет (п. 3.18). 3. Необходимы антикоррозионная защита и мониторинг (п. 4.5). Вывод: ОР; рекомендации — очистка, защитное покрытие, наблюдение. Связано: Д К03 02. О 04. Обоснование замены конструкций вместо усиления Ситуация: коррозия сквозная, сечение утрачено на большей части длины, узлы разрушены. Обоснование: 1. Усиление (п. 3.27) повышает несущую способность существующей конструкции; при утрате сечения усиливать нечего — конструкция не может быть включена в работу. 2. Восстановление (п. 3.3) предполагает доведение до первоначального уровня; при полной утрате это фактически новое строительство. 3. Экономически и технически замена равна восстановлению, но обеспечивает нормируемую надёжность. Вывод: «Выполнить замену … по отдельно разработанному проекту». Связано: Ш РЕК, Т 003, Т 022. О 05. Обоснование усиления (когда замена невозможна) Ситуация: историческое здание, ОКН, замена недопустима; сечение снижено частично. Обоснование: 1. Усиление — повышение несущей способности по сравнению с фактическим состоянием (п. 3.27). 2. Для ОКН — сохранение подлинности, работы по ГОСТ Р 55567 2013 и заданию КГИОП. 3. Требуется поверочный расчёт усиленного элемента (п. 3.20) и проект усиления. Вывод: «Выполнить усиление … по специально разработанному проекту, согласованному с КГИОП». Связано: О 07, Т 022. О 06. Обоснование отказа от поверочного расчёта Ситуация: конструкция полностью разрушена или утрачена. Обоснование: 1. Поверочный расчёт выполняется по фактическим геометрии, прочности и расчётной схеме (п. 3.20); при утрате сечения эти данные отсутствуют. 2. Категория устанавливается по признакам исчерпания несущей способности (п. 3.1, приложения В—Д). 3. Практика: «выполнение поверочных расчётов не требуется» (архив ТЗ). Вывод: категория А без расчёта; обоснование — в тексте. Связано: Д К10 02. О 07. Обоснование применения ГОСТ Р 55567 2013 для ОКН Ситуация: объект — выявленный объект культурного наследия. Обоснование: 1. ГОСТ 31937 2024 регулирует обследование конструкций, но не учитывает режим ОКН. 2. ГОСТ Р 55567 2013 устанавливает порядок инженерно технических исследований на объектах культурного наследия. 3. Работы ведутся по заданию КГИОП; выводы формулируются со ссылкой на оба документа. Вывод: двойная ссылка в выводах; историческая справка в разделе «Результаты». Связано: Т 111, Ш ОП. О 08. Обоснование категории «работоспособное» при наличии дефектов Ситуация: есть отделочные повреждения, не влияющие на несущую способность. Обоснование: 1. Работоспособное состояние — часть параметров не отвечает нормам, но работоспособность и механическая безопасность обеспечены (п. 3.21). 2. Дефекты не снижают несущую способность; расчёт не требуется. 3. Эксплуатация без ограничений (п. 4.5). Вывод: работоспособное; рекомендации — косметический ремонт. Связано: КРИТЕРИИ, п. 6. О 09. Обоснование периодичности следующего обследования Обоснование: 1. Первое обследование — не позднее 2 лет после ввода; далее не реже 1 раза в 10 лет; для неблагоприятных условий — 1 раз в 5 лет (п. 4.2). 2. Рекомендуемый срок следующего обследования указывают в отчёте (п. 4.2). 3. Для аварийных и ОР — мониторинг до устранения (пп. 4.5, 6.3). Вывод: «Рекомендуемый срок следующего обследования — не позднее 20 г.» Связано: КРИТЕРИИ, п. 1. О 10. Обоснование письменного информирования при аварии Обоснование: 1. П. 4.6 обязывает письменно информировать заказчика, собственника, эксплуатирующую организацию при выявлении дефектов, способных привести к обрушению. 2. Информирование — не рекомендация, а требование стандарта. 3. Факт информирования фиксируется в заключении. Вывод: отдельный абзац в выводах + письмо. Связано: КРИТЕРИИ, п. 1.2. О 11. Обоснование недостаточности визуального обследования Ситуация: визуально выявлены дефекты, снижающие несущую способность. Обоснование: 1. П. 5.1.11: если выявлены дефекты, снижающие прочность, устойчивость и жёсткость, и требуется оценка несущей способности — детальное обследование проводится. 2. П. 5.1.12: при характерных трещинах и перекосах — дополнительные инженерно геологические изыскания. 3. Без детального обследования нельзя установить категорию ОР или А обоснованно. Вывод: назначить детальное обследование, вскрытия, испытания материалов. Связано: МЕТОДИКИ, п. 1. О 12. Обоснование причин трещин по их рисунку Обоснование (приложение В, пп. 2.6—2.9): 1. Параболические трещины, расходящиеся книзу от средней части здания — просадка грунта в средней части. 2. Раскрытие, увеличивающееся кверху, наклонные/параболические от краёв — просадка крайних частей или твёрдое включение под средней частью. 3. Близкая к вертикальной с раскрытием кверху — разлом из за жёсткой опоры в грунте. 4. Одинаковое раскрытие по высоте со смещением части здания — просадка части здания. Вывод: причина — неравномерная осадка; требуется проверка основания (шурфы, геология). Связано: Д К02 06…09, Д К01 01. О 13. Обоснование требований к объёму испытаний бетона Обоснование: 1. Число участков: 3 / 6 / 9 в зависимости от задачи (п. 5.3.1.8). 2. Число конструкций — не менее трёх (п. 5.3.1.8). 3. Участки — в местах наименьшей прочности, в зонах, определяющих несущую способность, и в местах дефектов (п. 5.3.1.7). 4. Средства измерений — поверены (п. 4.10). Вывод: объём испытаний соответствует ГОСТ; результаты представительны. Связано: МЕТОДИКИ, п. 5.1. О 14. Обоснование запрета оценки стали по твёрдости Обоснование: 1. П. 5.3.3.10 прямо запрещает определять предел текучести и предел прочности по косвенным характеристикам (твёрдости). 2. П. 5.3.3.11 запрещает портативные РФА там, где нет точности по C, S, P. 3. Требуются испытания образцов (ГОСТ 1497, 9454) и спектральный анализ (ГОСТ 18895 / ГОСТ Р 54153 2010). Вывод: при отсутствии документации — отбор проб и лабораторные испытания. Связано: МЕТОДИКИ, п. 5.4. О 15. Обоснование мероприятий по вентиляции и гидроизоляции подвала Обоснование: 1. Причины коррозии и гнили — увлажнение и отсутствие вентиляции (практика архива; п. 5.3.6.6 — причины конденсата). 2. Без устранения причин замена конструкций даст повторное поражение. 3. Мероприятия: восстановление гидроизоляции, водоотвода, вентиляции (п. 5.4, 5.4.8). Вывод: включить в рекомендации как обязательные сопутствующие работы. Связано: Д К09 01, Д К01 03. "}, {"id": "reference", "file": "09_Справочники/СПРАВОЧНИК.md", "title": "СПРАВОЧНИК", "section": "09_Справочники", "html": "<h1>СПРАВОЧНИК</h1><blockquote><p>Прикладные данные для заключений: сортаменты, материалы, приборы, сроки службы, типовые значения. Часть — из практики архива, часть — нормативная. <strong>Внимание:</strong> таблицы проката и материалов приведены как ориентир для полевой идентификации. Точные значения принимать по действующим стандартам (ГОСТ 8239, ГОСТ 5781, СП 15.13330.2020 и т. д.) и указывать ссылку в заключении.</p></blockquote><hr><h2 id=\"s1\">1. СОРТАМЕНТЫ, ВСТРЕЧАЮЩИЕСЯ В ИСТОРИЧЕСКОЙ ЗАСТРОЙКЕ</h2><h3 id=\"s2\">1.1 Двутавры по ОСТ 16-1926</h3><p>Исторический сортамент, встречается в перекрытиях и лестницах до 1940-х гг. В заключениях указывают как «двутавр № … по ОСТ 16-1926».</p><div class=\"tablewrap\"><table><thead><tr><th>№ профиля</th><th>Высота, мм</th><th>Ширина полки, мм</th><th>Масса 1 м, кг</th></tr></thead><tbody><tr><td>10</td><td>100</td><td>68</td><td>11,0</td></tr><tr><td>12</td><td>120</td><td>74</td><td>13,7</td></tr><tr><td>14</td><td>140</td><td>80</td><td>16,9</td></tr><tr><td>16</td><td>160</td><td>85</td><td>20,1</td></tr><tr><td>18</td><td>180</td><td>90</td><td>23,4</td></tr><tr><td>20</td><td>200</td><td>95</td><td>27,0</td></tr><tr><td>22</td><td>220</td><td>100</td><td>31,0</td></tr><tr><td>24</td><td>240</td><td>106</td><td>36,0</td></tr><tr><td>27</td><td>270</td><td>112</td><td>42,0</td></tr><tr><td>30</td><td>300</td><td>120</td><td>51,0</td></tr></tbody></table></div><blockquote><p>Значения ориентировочные (по историческому сортаменту); при идентификации измерять фактические размеры и сверять по первоисточнику. <code>[требует проверки по официальному тексту ОСТ 16-1926]</code></p></blockquote><h3 id=\"s3\">1.2 Современные двутавры (ГОСТ 8239-89, ГОСТ Р 57837-2017)</h3><ul><li>20Б1, 18Б1 и др. — балочные нормальные (ГОСТ Р 57837-2017).</li><li>20, 22, 24 — по ГОСТ 8239-89.</li><li>В архиве встречаются расчёты на «балку металл 20Б1» — ТехЭкспертиза, Блохина, 15.</li></ul><h3 id=\"s4\">1.3 Швеллеры</h3><ul><li>ГОСТ 8240-97 — современные.</li><li>Старые — по ОСТ/ГОСТ довоенных лет; идентифицировать по фактическим размерам.</li></ul><hr><h2 id=\"s5\">2. МАТЕРИАЛЫ</h2><h3 id=\"s6\">2.1 Кирпич и кладочный раствор</h3><ul><li>Кирпич керамический — ГОСТ 530-2012.</li><li>Камни стеновые из горных пород — ГОСТ 4001.</li><li>Растворы строительные — ГОСТ 5802; раствор кладочный — ГОСТ 28013.</li><li>Марки раствора в исторической застройке: известково-песчаный, цементно-известковый,</li></ul><p>реже цементный.</p><ul><li>Прочность кладки — СП 15.13330.2020 (таблицы расчётных сопротивлений).</li></ul><h3 id=\"s7\">2.2 Бетон</h3><ul><li>ГОСТ 26633-2015 — тяжёлые и мелкозернистые бетоны.</li><li>ГОСТ 10180 — прочность по контрольным образцам.</li><li>ГОСТ 22690 — неразрушающий контроль.</li><li>ГОСТ 17624 — ультразвуковой метод.</li><li>ГОСТ 28570 — керны.</li><li>ГОСТ 12730.0—12730.5 — плотность, влажность, водопоглощение, пористость, водонепроницаемость.</li><li>ГОСТ 10060 — морозостойкость.</li></ul><h3 id=\"s8\">2.3 Арматура</h3><ul><li>ГОСТ 5781-82 — горячекатаная для ж.-б. (А240, А300, А400, А500 и др.).</li><li>ГОСТ 12004 — методы испытаний на растяжение.</li><li>Классы и нормативные сопротивления менялись по годам: при обследовании обязательно</li></ul><p>устанавливать год проектирования и постройки (п. 5.3.1.13 ГОСТ 31937-2024).</p><h3 id=\"s9\">2.4 Сталь</h3><ul><li>ГОСТ 27751-2014 — надёжность строительных конструкций.</li><li>ГОСТ 1497, 9454, 28870 — механические испытания.</li><li>ГОСТ 23118-2019 — металлоконструкции, допуски и дефекты.</li><li>ГОСТ Р 54153-2010 — атомно-эмиссионный анализ стали.</li></ul><h3 id=\"s10\">2.5 Древесина</h3><ul><li>ГОСТ 16483.1 — плотность; 16483.7 — влажность; 16483.10 — сжатие вдоль волокон;</li></ul><p>16483.11 — поперёк; 16483.3 — статический изгиб; 16483.9 — модуль упругости; 16483.2 — смятие; 16483.5 и 16483.12 — скалывание.</p><ul><li>ГОСТ 18610 — стойкость к биоразрушению; ГОСТ 20022.0 — защищённость.</li><li>Нормативная влажность для несущих конструкций — до 12—15 % (уточнять по СП 64.13330.2017).</li></ul><hr><h2 id=\"s11\">3. НОРМАТИВНЫЕ ЗНАЧЕНИЯ, ЧАСТО НУЖНЫЕ В ТЕКСТЕ</h2><div class=\"tablewrap\"><table><thead><tr><th>Параметр</th><th>Значение</th><th>Норма</th></tr></thead><tbody><tr><td>Глубина шурфа у фундамента</td><td>подошва + 0,15 м</td><td>ГОСТ 31937-2024, 5.2.7</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (А240)</td><td>0,5 мм</td><td>прил. В, 1.6</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (А300—А600)</td><td>0,4 мм</td><td>прил. В, 1.6</td></tr><tr><td>Ширина раскрытия трещин ж.-б. (прочие)</td><td>0,3 мм</td><td>прил. В, 1.6</td></tr><tr><td>Трещины вдоль арматуры</td><td>3 мм (на опоре — аварийное)</td><td>прил. В, 1.4</td></tr><tr><td>Прогиб плит перекрытий</td><td>1/150</td><td>прил. В, 1.9</td></tr><tr><td>Прогиб преднапряжённых балок</td><td>1/300</td><td>прил. В, 1.9</td></tr><tr><td>Прогиб преднапряжённых ферм</td><td>1/700</td><td>прил. В, 1.9</td></tr><tr><td>Трещины кладки (вертикальные)</td><td>0,1—0,5 мм; ≥ 2 на 1 м</td><td>прил. В, 2.10</td></tr><tr><td>Срок первого обследования</td><td>≤ 2 лет после ввода</td><td>4.2</td></tr><tr><td>Периодичность обследования</td><td>10 лет; 5 лет — неблагоприятные условия</td><td>4.2</td></tr><tr><td>Число участков испытания бетона</td><td>3 / 6 / 9</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке бетона</td><td>не менее 3</td><td>5.3.1.8</td></tr><tr><td>Число конструкций при оценке армирования</td><td>не менее 3</td><td>5.3.1.10</td></tr><tr><td>Число стержней для испытаний</td><td>не менее 3</td><td>5.3.1.11</td></tr><tr><td>Число участков по рисунку профиля</td><td>не менее 5</td><td>5.3.1.12</td></tr><tr><td>Сечения при измерении коррозии</td><td>не менее 3 по длине, по 3 измерения</td><td>5.3.3.13</td></tr></tbody></table></div><hr><h2 id=\"s12\">4. СРОКИ СЛУЖБЫ (ориентировочно, для оценки «длительной эксплуатации»)</h2><div class=\"tablewrap\"><table><thead><tr><th>Конструкция</th><th>Ориентировочный срок</th></tr></thead><tbody><tr><td>Металлические балки перекрытия без защиты от коррозии</td><td>30—50 лет до существенного поражения</td></tr><tr><td>Деревянные перекрытия при нормальном режиме</td><td>50—80 лет; при протечках — 10—20</td></tr><tr><td>Кирпичная кладка</td><td>100—150 лет (при отсутствии замачивания)</td></tr><tr><td>Штукатурный фасад</td><td>20—30 лет</td></tr><tr><td>Кровля из наплавляемых материалов</td><td>10—15 лет</td></tr><tr><td>Гидроизоляция подвала</td><td>20—30 лет</td></tr></tbody></table></div><blockquote><p>Ориентировочные значения для формулировки «длительный срок эксплуатации»; точные нормативы в заключении не обязательны, достаточно факта превышения срока службы.</p></blockquote><hr><h2 id=\"s13\">5. ПРИБОРЫ И ИХ ПРИМЕНЕНИЕ</h2><div class=\"tablewrap\"><table><thead><tr><th>Прибор</th><th>Что измеряет</th><th>Метод</th><th>Норма</th></tr></thead><tbody><tr><td>Молоток Физделя</td><td>прочность бетона</td><td>пластическая деформация</td><td>экспертный, предварительный</td></tr><tr><td>Склерометр (Кашкарова, Шмидта)</td><td>прочность бетона</td><td>отскок/внедрение</td><td>ГОСТ 22690</td></tr><tr><td>Ультразвуковой прибор (ПУЛЬСАР и др.)</td><td>прочность бетона</td><td>скорость распространения</td><td>ГОСТ 17624</td></tr><tr><td>Толщиномер А 1207</td><td>толщина металла</td><td>ультразвук</td><td>поверка</td></tr><tr><td>Магнитный искатель (например, ИПА)</td><td>защитный слой, диаметр арматуры</td><td>магнитный</td><td>ГОСТ 22904</td></tr><tr><td>Влагомер</td><td>влажность древесины</td><td>резистивный/диэлектрический</td><td>ГОСТ 16483.7</td></tr><tr><td>Лупа ЛИ-3-10х</td><td>ширина трещин</td><td>визуальный</td><td>—</td></tr><tr><td>Щупы калиброванные</td><td>ширина трещин</td><td>визуальный</td><td>—</td></tr><tr><td>Нивелир/тахеометр</td><td>прогибы, крены, осадки</td><td>геометрическое нивелирование</td><td>ГОСТ 24846</td></tr><tr><td>Тепловизор</td><td>теплопотери, мостики холода</td><td>инфракрасный</td><td>ГОСТ 26629 (уточнить)</td></tr></tbody></table></div><hr><h2 id=\"s14\">6. ТИПОВЫЕ КОНСТРУКТИВНЫЕ РЕШЕНИЯ ИЗ АРХИВА</h2><h3 id=\"s15\">6.1 Перекрытие по металлическим балкам</h3><ul><li>Балки — двутавр (ОСТ 16-1926), шаг 850—1100 мм, пролёт 1,6—4,25 м.</li><li>Опирание — на кирпичные стены (заделка) и металлические перемычки.</li><li>Межбалочное заполнение — бетон на кирпичном бое, сводики, деревянные щиты.</li><li>Покрытие — цементно-песчаная стяжка, метлахская плитка, асфальтобетон, дощатый настил.</li><li>Типовые дефекты — сквозная коррозия, разрушение заделки, прогибы.</li></ul><h3 id=\"s16\">6.2 Лестницы</h3><ul><li>Площадки — по металлическим балкам, заделанным в стены.</li><li>Марши — по двум металлическим косоурам, ступени сборные каменные.</li><li>Встречаются бескосоурные консольные каменные ступени.</li><li>Типовые дефекты — коррозия косоуров, разрушение заделки, износ ступеней, утрата маршей.</li></ul><h3 id=\"s17\">6.3 Балконы и эркеры</h3><ul><li>Плиты по металлическим консольным балкам, заделанным в кладку.</li><li>Ограждение — металл, бетон, дерево.</li><li>Типовые дефекты — коррозия консольных балок, разрушение плиты, потеря заделки,</li></ul><p>отсутствие гидроизоляции.</p><h3 id=\"s18\">6.4 Кирпичные стены</h3><ul><li>Толщина 760—880 мм (историческая застройка), кладка из красного глиняного кирпича</li></ul><p>на известково-песчаном растворе.</p><ul><li>Перемычки — металлические двутавровые, клинчатые, арочные.</li><li>Типовые дефекты — трещины от осадок, увлажнение, деструкция, выпучивание.</li></ul><hr><h2 id=\"s19\">7. ФОРМАТЫ ШИФРОВ И ОБОЗНАЧЕНИЙ</h2><ul><li>Шифр работы: <code>06/1-08-2026-АВР</code> — <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>.</li><li>Разделы: <code>.../С</code> — содержание, <code>.../ТЗ</code> — техзадание.</li><li>Оси: <code>1-5/А-Г</code>; отметки: <code>0.000</code>, <code>+0.660</code>, <code>-1.480</code>.</li><li>Помещения: <code>кв. № 24</code>, <code>пом. 2-Н</code>, <code>3-Н</code>, <code>ЛК № 1</code>.</li></ul><hr><h2 id=\"s20\">8. ПОЛЕЗНЫЕ ССЫЛКИ НА ВНУТРЕННИЕ РАЗДЕЛЫ</h2><div class=\"tablewrap\"><table><thead><tr><th>Вопрос</th><th>Раздел</th></tr></thead><tbody><tr><td>Что означает термин</td><td><code>02_Термины\\ТЕЗАУРУС.md</code></td></tr><tr><td>Что проверять в элементе</td><td><code>03_Конструктив\\ИНДЕКС_КОНСТРУКТИВА.md</code></td></tr><tr><td>Какой дефект и какая категория</td><td><code>04_Дефекты\\КАТАЛОГ_ДЕФЕКТОВ.md</code></td></tr><tr><td>Как измерять</td><td><code>05_Методики_обследования\\МЕТОДИКИ.md</code></td></tr><tr><td>Какую категорию ставить</td><td><code>06_Оценка_состояния\\КРИТЕРИИ_ОЦЕНКИ.md</code></td></tr><tr><td>Как написать</td><td><code>07_Шаблоны_заключений\\ШАБЛОНЫ.md</code></td></tr><tr>
