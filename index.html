<td>Как обосновать</td><td><code>08_Обоснования\\ОБОСНОВАНИЯ.md</code></td></tr></tbody></table></div>", "toc": [["s1", "1. СОРТАМЕНТЫ, ВСТРЕЧАЮЩИЕСЯ В ИСТОРИЧЕСКОЙ ЗАСТРОЙКЕ", 2], ["s2", "1.1 Двутавры по ОСТ 16-1926", 3], ["s3", "1.2 Современные двутавры (ГОСТ 8239-89, ГОСТ Р 57837-2017)", 3], ["s4", "1.3 Швеллеры", 3], ["s5", "2. МАТЕРИАЛЫ", 2], ["s6", "2.1 Кирпич и кладочный раствор", 3], ["s7", "2.2 Бетон", 3], ["s8", "2.3 Арматура", 3], ["s9", "2.4 Сталь", 3], ["s10", "2.5 Древесина", 3], ["s11", "3. НОРМАТИВНЫЕ ЗНАЧЕНИЯ, ЧАСТО НУЖНЫЕ В ТЕКСТЕ", 2], ["s12", "4. СРОКИ СЛУЖБЫ (ориентировочно, для оценки «длительной эксплуатации»)", 2], ["s13", "5. ПРИБОРЫ И ИХ ПРИМЕНЕНИЕ", 2], ["s14", "6. ТИПОВЫЕ КОНСТРУКТИВНЫЕ РЕШЕНИЯ ИЗ АРХИВА", 2], ["s15", "6.1 Перекрытие по металлическим балкам", 3], ["s16", "6.2 Лестницы", 3], ["s17", "6.3 Балконы и эркеры", 3], ["s18", "6.4 Кирпичные стены", 3], ["s19", "7. ФОРМАТЫ ШИФРОВ И ОБОЗНАЧЕНИЙ", 2], ["s20", "8. ПОЛЕЗНЫЕ ССЫЛКИ НА ВНУТРЕННИЕ РАЗДЕЛЫ", 2]], "chars": 8039, "plain": " СПРАВОЧНИК Прикладные данные для заключений: сортаменты, материалы, приборы, сроки службы, типовые значения. Часть — из практики архива, часть — нормативная. Внимание: таблицы проката и материалов приведены как ориентир для полевой идентификации. Точные значения принимать по действующим стандартам (ГОСТ 8239, ГОСТ 5781, СП 15.13330.2020 и т. д.) и указывать ссылку в заключении. 1. СОРТАМЕНТЫ, ВСТРЕЧАЮЩИЕСЯ В ИСТОРИЧЕСКОЙ ЗАСТРОЙКЕ 1.1 Двутавры по ОСТ 16 1926 Исторический сортамент, встречается в перекрытиях и лестницах до 1940 х гг. В заключениях указывают как «двутавр № … по ОСТ 16 1926». № профиля Высота, мм Ширина полки, мм Масса 1 м, кг 10 100 68 11,0 12 120 74 13,7 14 140 80 16,9 16 160 85 20,1 18 180 90 23,4 20 200 95 27,0 22 220 100 31,0 24 240 106 36,0 27 270 112 42,0 30 300 120 51,0 Значения ориентировочные (по историческому сортаменту); при идентификации измерять фактические размеры и сверять по первоисточнику. [требует проверки по официальному тексту ОСТ 16 1926] 1.2 Современные двутавры (ГОСТ 8239 89, ГОСТ Р 57837 2017) 20Б1, 18Б1 и др. — балочные нормальные (ГОСТ Р 57837 2017). 20, 22, 24 — по ГОСТ 8239 89. В архиве встречаются расчёты на «балку металл 20Б1» — ТехЭкспертиза, Блохина, 15. 1.3 Швеллеры ГОСТ 8240 97 — современные. Старые — по ОСТ/ГОСТ довоенных лет; идентифицировать по фактическим размерам. 2. МАТЕРИАЛЫ 2.1 Кирпич и кладочный раствор Кирпич керамический — ГОСТ 530 2012. Камни стеновые из горных пород — ГОСТ 4001. Растворы строительные — ГОСТ 5802; раствор кладочный — ГОСТ 28013. Марки раствора в исторической застройке: известково песчаный, цементно известковый, реже цементный. Прочность кладки — СП 15.13330.2020 (таблицы расчётных сопротивлений). 2.2 Бетон ГОСТ 26633 2015 — тяжёлые и мелкозернистые бетоны. ГОСТ 10180 — прочность по контрольным образцам. ГОСТ 22690 — неразрушающий контроль. ГОСТ 17624 — ультразвуковой метод. ГОСТ 28570 — керны. ГОСТ 12730.0—12730.5 — плотность, влажность, водопоглощение, пористость, водонепроницаемость. ГОСТ 10060 — морозостойкость. 2.3 Арматура ГОСТ 5781 82 — горячекатаная для ж. б. (А240, А300, А400, А500 и др.). ГОСТ 12004 — методы испытаний на растяжение. Классы и нормативные сопротивления менялись по годам: при обследовании обязательно устанавливать год проектирования и постройки (п. 5.3.1.13 ГОСТ 31937 2024). 2.4 Сталь ГОСТ 27751 2014 — надёжность строительных конструкций. ГОСТ 1497, 9454, 28870 — механические испытания. ГОСТ 23118 2019 — металлоконструкции, допуски и дефекты. ГОСТ Р 54153 2010 — атомно эмиссионный анализ стали. 2.5 Древесина ГОСТ 16483.1 — плотность; 16483.7 — влажность; 16483.10 — сжатие вдоль волокон; 16483.11 — поперёк; 16483.3 — статический изгиб; 16483.9 — модуль упругости; 16483.2 — смятие; 16483.5 и 16483.12 — скалывание. ГОСТ 18610 — стойкость к биоразрушению; ГОСТ 20022.0 — защищённость. Нормативная влажность для несущих конструкций — до 12—15 % (уточнять по СП 64.13330.2017). 3. НОРМАТИВНЫЕ ЗНАЧЕНИЯ, ЧАСТО НУЖНЫЕ В ТЕКСТЕ Параметр Значение Норма Глубина шурфа у фундамента подошва + 0,15 м ГОСТ 31937 2024, 5.2.7 Ширина раскрытия трещин ж. б. (А240) 0,5 мм прил. В, 1.6 Ширина раскрытия трещин ж. б. (А300—А600) 0,4 мм прил. В, 1.6 Ширина раскрытия трещин ж. б. (прочие) 0,3 мм прил. В, 1.6 Трещины вдоль арматуры 3 мм (на опоре — аварийное) прил. В, 1.4 Прогиб плит перекрытий 1/150 прил. В, 1.9 Прогиб преднапряжённых балок 1/300 прил. В, 1.9 Прогиб преднапряжённых ферм 1/700 прил. В, 1.9 Трещины кладки (вертикальные) 0,1—0,5 мм; ≥ 2 на 1 м прил. В, 2.10 Срок первого обследования ≤ 2 лет после ввода 4.2 Периодичность обследования 10 лет; 5 лет — неблагоприятные условия 4.2 Число участков испытания бетона 3 / 6 / 9 5.3.1.8 Число конструкций при оценке бетона не менее 3 5.3.1.8 Число конструкций при оценке армирования не менее 3 5.3.1.10 Число стержней для испытаний не менее 3 5.3.1.11 Число участков по рисунку профиля не менее 5 5.3.1.12 Сечения при измерении коррозии не менее 3 по длине, по 3 измерения 5.3.3.13 4. СРОКИ СЛУЖБЫ (ориентировочно, для оценки «длительной эксплуатации») Конструкция Ориентировочный срок Металлические балки перекрытия без защиты от коррозии 30—50 лет до существенного поражения Деревянные перекрытия при нормальном режиме 50—80 лет; при протечках — 10—20 Кирпичная кладка 100—150 лет (при отсутствии замачивания) Штукатурный фасад 20—30 лет Кровля из наплавляемых материалов 10—15 лет Гидроизоляция подвала 20—30 лет Ориентировочные значения для формулировки «длительный срок эксплуатации»; точные нормативы в заключении не обязательны, достаточно факта превышения срока службы. 5. ПРИБОРЫ И ИХ ПРИМЕНЕНИЕ Прибор Что измеряет Метод Норма Молоток Физделя прочность бетона пластическая деформация экспертный, предварительный Склерометр (Кашкарова, Шмидта) прочность бетона отскок/внедрение ГОСТ 22690 Ультразвуковой прибор (ПУЛЬСАР и др.) прочность бетона скорость распространения ГОСТ 17624 Толщиномер А 1207 толщина металла ультразвук поверка Магнитный искатель (например, ИПА) защитный слой, диаметр арматуры магнитный ГОСТ 22904 Влагомер влажность древесины резистивный/диэлектрический ГОСТ 16483.7 Лупа ЛИ 3 10х ширина трещин визуальный — Щупы калиброванные ширина трещин визуальный — Нивелир/тахеометр прогибы, крены, осадки геометрическое нивелирование ГОСТ 24846 Тепловизор теплопотери, мостики холода инфракрасный ГОСТ 26629 (уточнить) 6. ТИПОВЫЕ КОНСТРУКТИВНЫЕ РЕШЕНИЯ ИЗ АРХИВА 6.1 Перекрытие по металлическим балкам Балки — двутавр (ОСТ 16 1926), шаг 850—1100 мм, пролёт 1,6—4,25 м. Опирание — на кирпичные стены (заделка) и металлические перемычки. Межбалочное заполнение — бетон на кирпичном бое, сводики, деревянные щиты. Покрытие — цементно песчаная стяжка, метлахская плитка, асфальтобетон, дощатый настил. Типовые дефекты — сквозная коррозия, разрушение заделки, прогибы. 6.2 Лестницы Площадки — по металлическим балкам, заделанным в стены. Марши — по двум металлическим косоурам, ступени сборные каменные. Встречаются бескосоурные консольные каменные ступени. Типовые дефекты — коррозия косоуров, разрушение заделки, износ ступеней, утрата маршей. 6.3 Балконы и эркеры Плиты по металлическим консольным балкам, заделанным в кладку. Ограждение — металл, бетон, дерево. Типовые дефекты — коррозия консольных балок, разрушение плиты, потеря заделки, отсутствие гидроизоляции. 6.4 Кирпичные стены Толщина 760—880 мм (историческая застройка), кладка из красного глиняного кирпича на известково песчаном растворе. Перемычки — металлические двутавровые, клинчатые, арочные. Типовые дефекты — трещины от осадок, увлажнение, деструкция, выпучивание. 7. ФОРМАТЫ ШИФРОВ И ОБОЗНАЧЕНИЙ Шифр работы: 06/1 08 2026 АВР — <номер /<месяц <год АВР . Разделы: .../С — содержание, .../ТЗ — техзадание. Оси: 1 5/А Г ; отметки: 0.000 , +0.660 , 1.480 . Помещения: кв. № 24 , пом. 2 Н , 3 Н , ЛК № 1 . 8. ПОЛЕЗНЫЕ ССЫЛКИ НА ВНУТРЕННИЕ РАЗДЕЛЫ Вопрос Раздел Что означает термин 02 Термины\\ТЕЗАУРУС.md Что проверять в элементе 03 Конструктив\\ИНДЕКС КОНСТРУКТИВА.md Какой дефект и какая категория 04 Дефекты\\КАТАЛОГ ДЕФЕКТОВ.md Как измерять 05 Методики обследования\\МЕТОДИКИ.md Какую категорию ставить 06 Оценка состояния\\КРИТЕРИИ ОЦЕНКИ.md Как написать 07 Шаблоны заключений\\ШАБЛОНЫ.md Как обосновать 08 Обоснования\\ОБОСНОВАНИЯ.md "}, {"id": "monitoring", "file": "11_Мониторинг/МОНИТОРИНГ.md", "title": "МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ", "section": "11_Мониторинг", "html": "<h1>МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ</h1><blockquote><p>Раздел 6 ГОСТ 31937-2024 и обязательные формы приложений Ж, И, К, Л, М. Когда мониторинг обязателен, что измерять, как оформлять этап. Связано: <code>06_Оценка_состояния</code>, <code>07_Шаблоны_заключений</code>, <code>04_Дефекты</code>.</p></blockquote><hr><h2 id=\"s1\">1. КОГДА МОНИТОРИНГ НУЖЕН</h2><div class=\"tablewrap\"><table><thead><tr><th>Ситуация</th><th>Вид мониторинга</th><th>Норма</th></tr></thead><tbody><tr><td>Объект в ограниченно-работоспособном или аварийном состоянии</td><td>Мониторинг ограниченно-работоспособных и аварийных</td><td>п. 6.3, 4.5</td></tr><tr><td>Объект в зоне влияния нового строительства, реконструкции, природно-техногенных воздействий</td><td>Мониторинг зоны влияния</td><td>п. 6.4</td></tr><tr><td>Уникальные (высотные, большепролётные) здания</td><td>Мониторинг уникальных</td><td>п. 6.5</td></tr><tr><td>Значительные изменения НДС или крена, требуется обследование</td><td>Общий мониторинг</td><td>п. 6.2</td></tr><tr><td>Ликвидация последствий аварии, угроза прогрессирующего обрушения</td><td>Мониторинг до приведения в работоспособное состояние</td><td>п. 4.5</td></tr></tbody></table></div><p><strong>Ключевое правило (п. 4.5):</strong> при аварийном состоянии эксплуатация не допускается, а обязательный режим мониторинга устанавливается <strong>до приведения конструкций в работоспособное состояние</strong>.</p><hr><h2 id=\"s2\">2. ОБЩИЕ ТРЕБОВАНИЯ (6.1)</h2><ol><li><strong>Программа мониторинга</strong> разрабатывается под задачи; в ней определяют состав, объём,</li></ol><p>периодичность, средства измерений (6.1.2).</p><ol><li><strong>Выбор системы наблюдений</strong> — по цели мониторинга, виду объекта, характеру воздействий</li></ol><p>(6.1.3).</p><ol><li><strong>Достаточность</strong> — методика и объём измерений должны обеспечивать достоверность</li></ol><p>и сопоставимость результатов (6.1.4).</p><ol><li><strong>Сопоставимость при длительных наблюдениях</strong> — одинаковые условия, средства и точки</li></ol><p>измерений; при изменении внешних условий это фиксируется (6.1.5).</p><ol><li><strong>Результат каждого этапа</strong> — информация, достаточная для оценки состояния</li></ol><p>и решения о мерах (6.1.6).</p><ol><li><strong>Первый этап</strong> — как правило, обследование для фиксации начального (нулевого) состояния</li></ol><p>(6.1.7).</p><ol><li><strong>Ухудшение</strong> — при данных, указывающих на ухудшение, назначают внеочередное обследование</li></ol><p>и решают вопрос о мерах (6.1.8).</p><hr><h2 id=\"s3\">3. ОБЩИЙ МОНИТОРИНГ (6.2)</h2><p><strong>Назначение:</strong> выявить объекты, конструкции которых изменили НДС и требуют обследования. Программа утверждается заказчиком (п. 3.17).</p><p><strong>Что измеряют:</strong></p><ul><li>крен вдоль продольной и поперечной осей;</li><li>период основного тона собственных колебаний (продольная, поперечная, вертикальная оси);</li><li>логарифмический декремент колебаний по тем же осям;</li><li>для уникальных объектов — по отдельной программе.</li></ul><p><strong>Логика (6.2.4—6.2.7):</strong></p><ol><li>Предварительная оценка категории по динамическим параметрам.</li><li>Если изменения параметров не подтверждаются повторными измерениями — объект снимается</li></ol><p>с дальнейшего наблюдения по этой процедуре.</p><ol><li>Если категория ограниченно-работоспособная или аварийная — назначается обследование</li></ol><p>и (или) мониторинг по 6.3.</p><ol><li>По результатам этапа — заключение по форме приложения Ж; сводное — по форме К.</li></ol><p><strong>Документы общего мониторинга:</strong></p><ul><li><strong>приложение И</strong> — паспорт здания (22 позиции, включая степень ответственности,</li></ul><p>форму в плане, категорию деформационного состояния, периоды и декременты колебаний, крены);</p><ul><li><strong>приложение Ж</strong> — заключение по этапу (21 позиция: предыдущие и текущие значения крена,</li></ul><p>периода и декремента по трём осям, категория, собственник);</p><ul><li><strong>приложение К</strong> — сводное заключение по этапу общего мониторинга группы объектов</li></ul><p>(9 позиций: перечень адресов, перечень организаций, перечни объектов ОР и А, общая оценка, информация, требующая экстренного решения).</p><hr><h2 id=\"s4\">4. МОНИТОРИНГ ОГРАНИЧЕННО-РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3)</h2><p><strong>Цель:</strong> отслеживать степень и скорость изменения параметров и вовремя принимать экстренные меры против обрушения или опрокидывания (п. 3.12).</p><p><strong>Состав наблюдений (по программе):</strong></p><ul><li>изменение ранее выявленных дефектов и повреждений;</li><li>появление новых дефектов;</li><li>крены (предыдущее/текущее значение и предельное);</li><li>периоды и декременты собственных колебаний;</li><li>осадки и деформации основания, уровни и состав подземных вод, деструктивные процессы</li></ul><p>(эрозия, оползни, карстово-суффозионные явления, оседание поверхности).</p><p><strong>Оформление — приложение Л (24 позиции).</strong> Обязательные приложения:</p><ol><li>дефектная ведомость с изменениями ранее выявленных и новыми дефектами, включая осадки;</li><li>результаты измерений состояния грунтов, уровней и состава подземных вод,</li></ol><p>деструктивных процессов.</p><p><strong>Частота</strong> устанавливается программой; при аварийном состоянии — до устранения причин.</p><hr><h2 id=\"s5\">5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4)</h2><p><strong>Назначение:</strong> обеспечить безопасную эксплуатацию объектов, попадающих в зону влияния нового строительства, реконструкции, природно-техногенных воздействий (п. 3.13).</p><p><strong>Что делают:</strong></p><ul><li>определяют радиус зоны влияния и перечень объектов в ней;</li><li>ведут наблюдения за деформациями земной поверхности и зданий;</li><li>осадки оснований — по ГОСТ 24846 (6.4.4);</li><li>при погружении свай и ударных воздействиях — усиленный контроль (6.4.2);</li><li>сопоставляют результаты с предыдущими этапами.</li></ul><p><strong>Оформление — приложение М (11 позиций).</strong> Обязательные приложения:</p><ul><li>заключения по каждому объекту: для ОР/А — по форме Л, для остальных — по форме Ж;</li><li>совмещённый план наблюдательной системы реперов и подземного сооружения;</li><li>вертикальные геологические разрезы по профильным линиям;</li><li>ведомости сдвижений реперов в вертикальной и горизонтальной плоскостях;</li><li>ведомости скоростей смещения реперов;</li><li>ведомости осадок реперов и измеренных длин интервалов;</li><li>результаты вычислений деформаций земной поверхности (наклоны, кривизны, радиусы</li></ul><p>кривизны, горизонтальные деформации);</p><ul><li>план расположения марок и эпюры перемещений, графики давления на основание и развития</li></ul><p>перемещений — по ГОСТ 24846-2019 (приложение Б).</p><hr><h2 id=\"s6\">6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5)</h2><ul><li>Постоянный режим наблюдений; автоматизированные стационарные системы (станции)</li></ul><p>мониторинга (6.5.4).</p><ul><li>Контроль и ранняя диагностика состояния основания и конструкций (6.5.3).</li><li>При выявлении мест изменения НДС — детальное обследование этих зон (6.5.5).</li><li>Мониторинг систем инженерно-технического обеспечения уникальных объектов (6.5.7—6.5.8).</li><li>Результат — заключения по формам Ж, И, К.</li></ul><hr><h2 id=\"s7\">7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК-ЛИСТ)</h2><ul><li>[ ] Номер этапа, дата и время, температура и условия (для сопоставимости).</li><li>[ ] Организация, специалисты, приборы (с поверкой).</li><li>[ ] Схема точек измерений — та же, что на предыдущем этапе.</li><li>[ ] Крен по двум осям: предыдущее / текущее / предельное.</li><li>[ ] Периоды и декременты колебаний по трём осям (если предусмотрено).</li><li>[ ] Дефекты: что изменилось, что появилось, что развилось.</li><li>[ ] Осадки и деформации основания; уровни и состав подземных вод.</li><li>[ ] Категория состояния на дату этапа.</li><li>[ ] Вывод: динамика (стабильно / ухудшение / резкое ухудшение).</li><li>[ ] Решение: продолжать / усилить контроль / противоаварийные меры.</li></ul><hr><h2 id=\"s8\">8. ТИПОВЫЕ ОШИБКИ</h2><ol><li><strong>Нет нулевого этапа.</strong> Без начальных значений кренов и периодов колебаний динамику</li></ol><p>оценить нельзя (6.1.7).</p><ol><li><strong>Разные точки и приборы</strong> на этапах — результаты несопоставимы (6.1.5).</li><li><strong>Этап без категории.</strong> Формы Ж, Л, М требуют установленной категории состояния.</li><li><strong>Нет дефектной ведомости</strong> с изменениями — форма Л неполная.</li><li><strong>Мониторинг без программы</strong>, утверждённой заказчиком (3.17, 6.1.2).</li><li><strong>Отсутствие реакции на ухудшение</strong> — нарушение 6.1.8.</li><li><strong>Смешение видов мониторинга</strong> — общий (6.2) не заменяет мониторинг аварийного объекта (6.3).</li><li><strong>Приборы без поверки</strong> — результаты недействительны (4.10).</li></ol><hr><h2 id=\"s9\">9. ИСТОЧНИКИ</h2><ul><li>ГОСТ 31937-2024: раздел 6, пп. 3.12—3.14, 3.17, 4.5; приложения Ж, И, К, Л, М.</li><li>ГОСТ 24846 — наблюдения за деформациями оснований.</li><li>ГОСТ 34081 — параметры основного тона собственных колебаний.</li><li>ГОСТ Р 52892-2007 — вибрация зданий.</li></ul>", "toc": [["s1", "1. КОГДА МОНИТОРИНГ НУЖЕН", 2], ["s2", "2. ОБЩИЕ ТРЕБОВАНИЯ (6.1)", 2], ["s3", "3. ОБЩИЙ МОНИТОРИНГ (6.2)", 2], ["s4", "4. МОНИТОРИНГ ОГРАНИЧЕННО-РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3)", 2], ["s5", "5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4)", 2], ["s6", "6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5)", 2], ["s7", "7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК-ЛИСТ)", 2], ["s8", "8. ТИПОВЫЕ ОШИБКИ", 2], ["s9", "9. ИСТОЧНИКИ", 2]], "chars": 7686, "plain": " МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ Раздел 6 ГОСТ 31937 2024 и обязательные формы приложений Ж, И, К, Л, М. Когда мониторинг обязателен, что измерять, как оформлять этап. Связано: 06 Оценка состояния , 07 Шаблоны заключений , 04 Дефекты . 1. КОГДА МОНИТОРИНГ НУЖЕН Ситуация Вид мониторинга Норма Объект в ограниченно работоспособном или аварийном состоянии Мониторинг ограниченно работоспособных и аварийных п. 6.3, 4.5 Объект в зоне влияния нового строительства, реконструкции, природно техногенных воздействий Мониторинг зоны влияния п. 6.4 Уникальные (высотные, большепролётные) здания Мониторинг уникальных п. 6.5 Значительные изменения НДС или крена, требуется обследование Общий мониторинг п. 6.2 Ликвидация последствий аварии, угроза прогрессирующего обрушения Мониторинг до приведения в работоспособное состояние п. 4.5 Ключевое правило (п. 4.5): при аварийном состоянии эксплуатация не допускается, а обязательный режим мониторинга устанавливается до приведения конструкций в работоспособное состояние . 2. ОБЩИЕ ТРЕБОВАНИЯ (6.1) 1. Программа мониторинга разрабатывается под задачи; в ней определяют состав, объём, периодичность, средства измерений (6.1.2). 2. Выбор системы наблюдений — по цели мониторинга, виду объекта, характеру воздействий (6.1.3). 3. Достаточность — методика и объём измерений должны обеспечивать достоверность и сопоставимость результатов (6.1.4). 4. Сопоставимость при длительных наблюдениях — одинаковые условия, средства и точки измерений; при изменении внешних условий это фиксируется (6.1.5). 5. Результат каждого этапа — информация, достаточная для оценки состояния и решения о мерах (6.1.6). 6. Первый этап — как правило, обследование для фиксации начального (нулевого) состояния (6.1.7). 7. Ухудшение — при данных, указывающих на ухудшение, назначают внеочередное обследование и решают вопрос о мерах (6.1.8). 3. ОБЩИЙ МОНИТОРИНГ (6.2) Назначение: выявить объекты, конструкции которых изменили НДС и требуют обследования. Программа утверждается заказчиком (п. 3.17). Что измеряют: крен вдоль продольной и поперечной осей; период основного тона собственных колебаний (продольная, поперечная, вертикальная оси); логарифмический декремент колебаний по тем же осям; для уникальных объектов — по отдельной программе. Логика (6.2.4—6.2.7): 1. Предварительная оценка категории по динамическим параметрам. 2. Если изменения параметров не подтверждаются повторными измерениями — объект снимается с дальнейшего наблюдения по этой процедуре. 3. Если категория ограниченно работоспособная или аварийная — назначается обследование и (или) мониторинг по 6.3. 4. По результатам этапа — заключение по форме приложения Ж; сводное — по форме К. Документы общего мониторинга: приложение И — паспорт здания (22 позиции, включая степень ответственности, форму в плане, категорию деформационного состояния, периоды и декременты колебаний, крены); приложение Ж — заключение по этапу (21 позиция: предыдущие и текущие значения крена, периода и декремента по трём осям, категория, собственник); приложение К — сводное заключение по этапу общего мониторинга группы объектов (9 позиций: перечень адресов, перечень организаций, перечни объектов ОР и А, общая оценка, информация, требующая экстренного решения). 4. МОНИТОРИНГ ОГРАНИЧЕННО РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3) Цель: отслеживать степень и скорость изменения параметров и вовремя принимать экстренные меры против обрушения или опрокидывания (п. 3.12). Состав наблюдений (по программе): изменение ранее выявленных дефектов и повреждений; появление новых дефектов; крены (предыдущее/текущее значение и предельное); периоды и декременты собственных колебаний; осадки и деформации основания, уровни и состав подземных вод, деструктивные процессы (эрозия, оползни, карстово суффозионные явления, оседание поверхности). Оформление — приложение Л (24 позиции). Обязательные приложения: 1. дефектная ведомость с изменениями ранее выявленных и новыми дефектами, включая осадки; 2. результаты измерений состояния грунтов, уровней и состава подземных вод, деструктивных процессов. Частота устанавливается программой; при аварийном состоянии — до устранения причин. 5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4) Назначение: обеспечить безопасную эксплуатацию объектов, попадающих в зону влияния нового строительства, реконструкции, природно техногенных воздействий (п. 3.13). Что делают: определяют радиус зоны влияния и перечень объектов в ней; ведут наблюдения за деформациями земной поверхности и зданий; осадки оснований — по ГОСТ 24846 (6.4.4); при погружении свай и ударных воздействиях — усиленный контроль (6.4.2); сопоставляют результаты с предыдущими этапами. Оформление — приложение М (11 позиций). Обязательные приложения: заключения по каждому объекту: для ОР/А — по форме Л, для остальных — по форме Ж; совмещённый план наблюдательной системы реперов и подземного сооружения; вертикальные геологические разрезы по профильным линиям; ведомости сдвижений реперов в вертикальной и горизонтальной плоскостях; ведомости скоростей смещения реперов; ведомости осадок реперов и измеренных длин интервалов; результаты вычислений деформаций земной поверхности (наклоны, кривизны, радиусы кривизны, горизонтальные деформации); план расположения марок и эпюры перемещений, графики давления на основание и развития перемещений — по ГОСТ 24846 2019 (приложение Б). 6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5) Постоянный режим наблюдений; автоматизированные стационарные системы (станции) мониторинга (6.5.4). Контроль и ранняя диагностика состояния основания и конструкций (6.5.3). При выявлении мест изменения НДС — детальное обследование этих зон (6.5.5). Мониторинг систем инженерно технического обеспечения уникальных объектов (6.5.7—6.5.8). Результат — заключения по формам Ж, И, К. 7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК ЛИСТ) [ ] Номер этапа, дата и время, температура и условия (для сопоставимости). [ ] Организация, специалисты, приборы (с поверкой). [ ] Схема точек измерений — та же, что на предыдущем этапе. [ ] Крен по двум осям: предыдущее / текущее / предельное. [ ] Периоды и декременты колебаний по трём осям (если предусмотрено). [ ] Дефекты: что изменилось, что появилось, что развилось. [ ] Осадки и деформации основания; уровни и состав подземных вод. [ ] Категория состояния на дату этапа. [ ] Вывод: динамика (стабильно / ухудшение / резкое ухудшение). [ ] Решение: продолжать / усилить контроль / противоаварийные меры. 8. ТИПОВЫЕ ОШИБКИ 1. Нет нулевого этапа. Без начальных значений кренов и периодов колебаний динамику оценить нельзя (6.1.7). 2. Разные точки и приборы на этапах — результаты несопоставимы (6.1.5). 3. Этап без категории. Формы Ж, Л, М требуют установленной категории состояния. 4. Нет дефектной ведомости с изменениями — форма Л неполная. 5. Мониторинг без программы , утверждённой заказчиком (3.17, 6.1.2). 6. Отсутствие реакции на ухудшение — нарушение 6.1.8. 7. Смешение видов мониторинга — общий (6.2) не заменяет мониторинг аварийного объекта (6.3). 8. Приборы без поверки — результаты недействительны (4.10). 9. ИСТОЧНИКИ ГОСТ 31937 2024: раздел 6, пп. 3.12—3.14, 3.17, 4.5; приложения Ж, И, К, Л, М. ГОСТ 24846 — наблюдения за деформациями оснований. ГОСТ 34081 — параметры основного тона собственных колебаний. ГОСТ Р 52892 2007 — вибрация зданий. "}, {"id": "qc", "file": "12_Контроль_качества/КОНТРОЛЬ_КАЧЕСТВА.md", "title": "КОНТРОЛЬ КАЧЕСТВА ЗАКЛЮЧЕНИЯ", "section": "12_Контроль_качества", "html": "<h1>КОНТРОЛЬ КАЧЕСТВА ЗАКЛЮЧЕНИЯ</h1><blockquote><p>Проверка перед сдачей: полнота, соответствие ГОСТ 31937-2024, качество формулировок. Основано на аудите архива (700+ отчётов) и разборе 6 эталонных заключений. Связано: <code>07_Шаблоны_заключений</code>, <code>06_Оценка_состояния</code>, <code>08_Обоснования</code>.</p></blockquote><hr><h2 id=\"s1\">1. ТРИ УРОВНЯ ПРОВЕРКИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Уровень</th><th>Что проверяем</th><th>Кто</th></tr></thead><tbody><tr><td>1. Полнота</td><td>все разделы и приложения на месте, содержание совпадает</td><td>исполнитель</td></tr><tr><td>2. Соответствие норме</td><td>объёмы, методы, ссылки, формы А/Б, сроки</td><td>нормоконтроль</td></tr><tr><td>3. Доказательность</td><td>категория обоснована, выводы не противоречат фактам, нет опечаток</td><td>руководитель / ГИП</td></tr></tbody></table></div><hr><h2 id=\"s2\">2. ЧЕК-ЛИСТ ПО РАЗДЕЛАМ</h2><h3 id=\"s3\">2.1 Титул и содержание</h3><ul><li>[ ] Наименование объекта совпадает с ТЗ дословно.</li><li>[ ] Адрес полный: город, улица, дом, литера.</li><li>[ ] Шифр единый: <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>; в содержании — <code>/С</code>, <code>/ТЗ</code>.</li><li>[ ] Год на титуле соответствует дате работ.</li><li>[ ] Содержание совпадает с фактическими приложениями (номера и названия).</li></ul><h3 id=\"s4\">2.2 Техническое задание</h3><ul><li>[ ] Указаны заказчик, объект, цель.</li><li>[ ] Перечень работ соответствует фактически выполненным (визуальные + инструментальные).</li><li>[ ] Особые условия и порядок передачи.</li><li>[ ] Согласование и подпись заказчика.</li></ul><h3 id=\"s5\">2.3 Общие положения</h3><ul><li>[ ] Год постройки и автор проекта (или указано, что сведения отсутствуют).</li><li>[ ] Конструктивная схема описана.</li><li>[ ] Перечень исходных данных и нормативных документов.</li><li>[ ] Таблица приборов с указанием поверки.</li><li>[ ] Состояние объекта на момент обследования (эксплуатация, перепланировки).</li></ul><h3 id=\"s6\">2.4 Результаты обследования</h3><ul><li>[ ] Каждый элемент привязан к осям и отметкам.</li><li>[ ] Указаны материал, сечения, пролёты, шаг, опирание.</li><li>[ ] Дефекты с измеримыми параметрами (мм, %, площадь), а не «сильная коррозия».</li><li>[ ] По каждому элементу — категория со ссылкой на норму.</li><li>[ ] Зафиксировано отсутствие аварийности там, где её нет.</li><li>[ ] Вскрытия и измерения описаны с местами и объёмами.</li></ul><h3 id=\"s7\">2.5 Выводы</h3><ul><li>[ ] Причины повреждений перечислены.</li><li>[ ] Перечень элементов по категориям (А, ОР, Р) с локализацией.</li><li>[ ] Нет противоречия: ОР без дефектов и без расчёта — ошибка.</li><li>[ ] Ссылка на ГОСТ 31937-2024 с годом (не «ГОСТ 31937» и не «ГОСТ Р 31937-2011»).</li><li>[ ] Для аварийного состояния — указание на недопустимость эксплуатации.</li><li>[ ] Указан рекомендуемый срок следующего обследования (п. 4.2).</li></ul><h3 id=\"s8\">2.6 Рекомендации</h3><ul><li>[ ] Мероприятия конкретные: замена / восстановление / усиление / ремонт.</li><li>[ ] Указано, по какому проекту выполнять работы.</li><li>[ ] Противоаварийные мероприятия (при А и ОР).</li><li>[ ] Сопутствующие работы: гидроизоляция, водоотвод, вентиляция.</li><li>[ ] Наблюдение / мониторинг с периодичностью.</li></ul><h3 id=\"s9\">2.7 Приложения</h3><ul><li>[ ] Графические материалы: планы, разрезы, схемы с осями.</li><li>[ ] Фотофиксация: общий вид + каждый дефект с масштабом.</li><li>[ ] Дефектная ведомость: параметры, причина, категория, фото.</li><li>[ ] Поверочные расчёты (или обоснование, почему не выполнялись).</li><li>[ ] Толщинометрия / прочность материалов — протоколы.</li><li>[ ] Техническая документация (планы ПИБ, паспорт).</li><li>[ ] Аттестация специалистов, выписка СРО.</li></ul><hr><h2 id=\"s10\">3. ТИПОВЫЕ ОШИБКИ (НАЙДЕНЫ В АРХИВЕ)</h2><h3 id=\"s11\">3.1 Нормативные ссылки</h3><ol><li><strong>ГОСТ 31937-2011</strong> — устарел, заменён с 01.05.2024 (в архиве 2 135 упоминаний против</li></ol><p>1 514 у редакции 2024).</p><ol><li><strong>«ГОСТ Р 31937-2011»</strong> — такого обозначения не существует (79 упоминаний).</li><li><strong>СП 15.13330.2012</strong> вместо действующего СП 15.13330.2020 (470 против 224).</li><li><strong>СП 16.13330.2011</strong> вместо СП 16.13330.2017 (180 упоминаний).</li><li><strong>СП 63.13330.2012</strong> вместо СП 63.13330.2018 (139 упоминаний).</li><li><strong>СП 64.13330.2011</strong> вместо СП 64.13330.2017 (93 упоминания).</li><li>Ссылка на <strong>СП 13-102-2003</strong> без оговорки о приоритете ГОСТ 31937-2024 (1 007 упоминаний).</li></ol><h3 id=\"s12\">3.2 Логика выводов</h3><ol><li><strong>ОР при отсутствии дефектов</strong> и подтверждённой несущей способности — противоречит</li></ol><p>пп. 3.18 и 3.21.</p><ol><li><strong>Аварийное состояние без признаков исчерпания несущей способности</strong> — не обосновано.</li><li><strong>Категория без привязки</strong> к элементу, осям, отметке.</li><li><strong>Смешение</strong> физического износа (п. 3.28) и категории технического состояния.</li><li><strong>Нет срока следующего обследования</strong> (требование п. 4.2).</li><li><strong>Поверочный расчёт без исходных данных</strong> обследования (п. 3.20 требует фактические</li></ol><p>геометрию, прочность, нагрузки).</p><h3 id=\"s13\">3.3 Текст и оформление</h3><ol><li><strong>«над подвальное»</strong> раздельно — правильно «надподвальное».</li><li><strong>Опечатки в осях</strong> («4-5/Ва-Г»), в адресах и наименованиях.</li><li><strong>Разные шрифты и кегли</strong> в таблицах и подписях.</li><li><strong>Фото без привязки</strong> к ведомости и без масштабной линейки.</li></ol><h3 id=\"s14\">3.4 Организационные</h3><ol><li><strong>Дубли версий</strong> (<code>нов.docx</code>, <code>нов+.docx</code>, <code>мусор1.docx</code>) — риск отправить не ту версию.</li><li><strong>Приборы без действующей поверки</strong> (п. 4.10).</li><li><strong>Нет письменного информирования</strong> при аварийном состоянии (п. 4.6).</li></ol><hr><h2 id=\"s15\">4. БЫСТРАЯ САМОПРОВЕРКА (15 ВОПРОСОВ)</h2><ol><li>Все ли элементы, указанные в ТЗ, описаны?</li><li>У каждого элемента есть оси и отметка?</li><li>Есть ли измеренные параметры дефектов, а не качественные оценки?</li><li>Каждая категория обоснована дефектом или расчётом?</li><li>Нет ли ОР без дефектов?</li><li>Есть ли ссылка на пункт ГОСТ, а не только на стандарт целиком?</li><li>Все нормы — с годами и актуальных редакций?</li><li>Есть ли вывод о причинах, а не только перечень дефектов?</li><li>Указан ли срок следующего обследования?</li><li>Для аварийного состояния — есть ли запрет эксплуатации и противоаварийные меры?</li><li>Указано ли, по какому проекту выполнять работы?</li><li>Совпадает ли содержание с приложениями?</li><li>Все ли фото привязаны к дефектной ведомости?</li><li>Есть ли протоколы приборов, поверка, аттестация?</li><li>Нет ли опечаток в адресе, осях, шифре?</li></ol><hr><h2 id=\"s16\">5. МАТРИЦА «КАТЕГОРИЯ → МЕРОПРИЯТИЯ → ДОКУМЕНТЫ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Категория</th><th>Эксплуатация</th><th>Мероприятия</th><th>Документы</th></tr></thead><tbody><tr><td>Нормативное</td><td>Без ограничений</td><td>Плановое обслуживание</td><td>Заключение по форме А/Б</td></tr><tr><td>Работоспособное</td><td>Без ограничений</td><td>Устранение дефектов по регламенту</td><td>Заключение, дефектная ведомость</td></tr><tr><td>Ограниченно-работоспособное</td><td>С контролем (мониторинг)</td><td>Восстановление/усиление, затем мониторинг</td><td>Заключение, программа мониторинга, проект</td></tr><tr><td>Аварийное</td><td><strong>Не допускается</strong></td><td>Противоаварийные меры, проект замены/усиления, обязательный мониторинг</td><td>Заключение, письменное информирование, программа мониторинга, проект</td></tr></tbody></table></div><hr><h2 id=\"s17\">6. ПОРЯДОК ПРИЁМКИ (ПРАКТИКА)</h2><ol><li>Сверить комплектность с содержанием тома.</li><li>Прогнать чек-лист раздела 2.</li><li>Проверить все ссылки на нормы (год, редакция) — поиском по тексту.</li><li>Проверить единство терминов и обозначений (оси, отметки, шифр).</li><li>Сверить выводы с дефектной ведомостью (нет ли расхождений).</li><li>Проверить математику: объёмы, проценты поражения, пролёты, шаг.</li><li>Проверить орфографию и вёрстку (таблицы не рвутся, подписи на месте).</li><li>Убедиться, что версия файла финальная (нет «мусор», «нов+», «Old»).</li></ol><hr><h2 id=\"s18\">7. ИСТОЧНИКИ</h2><ul><li>ГОСТ 31937-2024: пп. 3.1, 3.15, 3.18, 3.21, 3.28, 4.2, 4.5, 4.6, 4.10, 5.1.10, 5.1.11.</li><li>Аудит архива: <co /* search */
function snippet(text, q){
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return '';
  const from = Math.max(0, i - 70), to = Math.min(text.length, i + 130);
  const raw = (from > 0 ? '…' : '') + text.slice(from, to) + (to < text.length ? '…' : '');
  return esc(raw).replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>');
}

function search(q){
  q = q.trim().toLowerCase();
  if (q.length < 2) { if (current) openDoc(current.id); else dashboard(); return; }
  const hits = DATA.docs.map(d => {
    const inTitle = d.title.toLowerCase().includes(q);
    const n = (d.plain.toLowerCase().split(q).length - 1);
    return {d, n: n + (inTitle ? 5 : 0), inTitle};
  }).filter(h => h.n > 0).sort((a, b) => b.n - a.n).slice(0, 14);

  setWide(true);
  $('#content').innerHTML = hits.length ? `
    <div class="crumbs"><a href="#/">Обзор</a><span>·</span><span>Поиск</span></div>
    <h1 style="font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 6px">«${esc(q)}»</h1>
    <div class="meta"><span>найдено документов: ${hits.length}</span><span>Esc — сбросить</span></div>
    <div class="results">${hits.map(h => `
      <a class="hit" href="#/doc/${h.d.id}?q=${encodeURIComponent(q)}">
        <b>${esc(h.d.title)}</b>
        <small>${esc(sectionTitle(h.d.section))} · ${esc(h.d.file)} · совпадений: ${h.n}</small>
        <p>${snippet(h.d.plain, q)}</p>
      </a>`).join('')}</div>`
    : `<div class="empty">По запросу «${esc(q)}» ничего не найдено. Попробуйте «коррозия», «перекрытие», «31937» или «ограниченно-работоспособное».</div>`;
}

/* routing */
function route(){
  const h = location.hash || '#/';
  if (h.startsWith('#/objects')) {
    if (DATA.public) { location.hash = '#/'; return; }
    objectsView(); return;
  }
  const m = h.match(/^#\/doc\/([^?]+)(?:\?q=([^&]+))?/);
  if (m) {
    openDoc(decodeURIComponent(m[1]));
    if (m[2]) {
      const q = decodeURIComponent(m[2]).toLowerCase();
      const art = document.querySelector('.doc');
      if (art) {
        const walk = document.createTreeWalker(art, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walk.nextNode()) nodes.push(walk.currentNode);
        nodes.forEach(n => {
          if (n.parentNode.nodeName === 'CODE' || n.parentNode.nodeName === 'PRE') return;
          const t = n.nodeValue, i = t.toLowerCase().indexOf(q);
          if (i < 0) return;
          const r = document.createRange();
          r.setStart(n, i); r.setEnd(n, Math.min(t.length, i + q.length));
          const mark = document.createElement('mark');
          mark.style.background = '#f7dfa8';
          r.surroundContents(mark);
          mark.scrollIntoView({block: 'center'});
        });
      }
    }
    return;
  }
  dashboard();
  renderNav(null);
  document.title = 'Expanding Horizons — База знаний';
}

    .concat(tlist.map(([t, n]) => `<button class="chip ${objState.type === t ? 'on' : ''}" data-type="${esc(t)}">${esc(t)} <span style="opacity:.6">${n}</span></button>`)).join('');

    </div>
    <div class="chips">${chips}</div>
    <p class="count" id="objCount"></p>
    <table class="objtable">
      <thead><tr><th>Заказчик</th><th>Объект</th><th>Тип работ</th><th>Док.</th><th>DOCX</th><th>PDF</th></tr></thead>
      <tbody id="objBody"></tbody>
    </table>`;

  const draw = () => {
    const q = objState.q.trim().toLowerCase();
    const list = rows.filter(r =>
      (!objState.client || r.c === objState.client) &&
      (!objState.type || String(r.t).split(', ').includes(objState.type)) &&
      (!q || (r.o + ' ' + r.c).toLowerCase().includes(q)));
    const shown = list.slice(0, 300);
    $('#objBody').innerHTML = shown.map(r => `<tr>
        <td>${esc(r.c)}</td>
        <td>${esc(r.o)}</td>
        <td class="types">${esc(r.t)}</td>
        <td class="num">${r.d}</td><td class="num">${r.x}</td><td class="num">${r.p}</td>
      </tr>`).join('') || '<tr><td colspan="6" style="padding:18px;color:#6f6b61">Ничего не найдено. Сбросьте фильтры.</td></tr>';
    $('#objCount').textContent = list.length === rows.length
      ? `Показаны все ${rows.length} объектов`
      : `Показано ${shown.length} из ${list.length} найденных (всего ${rows.length})`;
  };

  $('#objClient').addEventListener('change', e => { objState.client = e.target.value; draw(); });
  $('#objQ').addEventListener('input', e => { objState.q = e.target.value; draw(); });
  document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => {
    objState.type = ch.dataset.type;
    document.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === ch));
    draw();
  }));
  draw();
  renderNav(null);
  document.title = 'Объекты архива — Expanding Horizons';
  window.scrollTo(0, 0);
}

  const open = document.body.classList.toggle('nav-open');
  $('#burger').setAttribute('aria-expanded', open);
});
$('#scrim').addEventListener('click', () => { document.body.classList.remove('nav-open'); });

const q = $('#q');
let timer = null;
q.addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (q.value.trim().length >= 2) search(q.value); else if (!location.hash.startsWith('#/doc/')) route();
  }, 180);
});
q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; route(); q.blur(); } });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; route(); }
});

/* ---------- заставка ---------- */
document.addEventListener('DOMContentLoaded', function(){
  const sp = document.getElementById('splash');
  if (!sp) return;
  if (!DATA.public) { sp.remove(); return; }
  const v = document.getElementById('introVideo');
  let closed = false;
  const close = () => {
    if (closed) return;
    closed = true;
    sp.classList.add('hide');
    if (v) { try { v.pause(); } catch(e){} }
    setTimeout(() => sp.remove(), 400);
    try { sessionStorage.setItem('eh-intro', '1'); } catch(e){}
  };
  let seen = false;
  try { seen = sessionStorage.getItem('eh-intro') === '1'; } catch(e){}
  if (seen) { sp.remove(); return; }
  document.getElementById('splashGo').addEventListener('click', close);
  document.getElementById('splashSkip').addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  if (v) {
    v.play().catch(() => {});
    v.addEventListener('ended', close);
  }
  setTimeout(close, 12000);
});

window.addEventListener('hashchange', route);
route();
</script>

<div class="splash" id="splash" aria-label="Заставка Expanding Horizons">
  <video id="introVideo" src="assets/intro.mp4" muted autoplay playsinline preload="auto"></video>
  <button class="skip" id="splashSkip">Пропустить</button>
  <div class="splash-in">
    <img src="assets/logo-large.png" alt="">
    <h2>Expanding Horizons</h2>
    <p>База знаний</p>
    <button class="go" id="splashGo">Открыть библиотеку</button>
  </div>
</div>
</body>
</html>
