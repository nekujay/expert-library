 козырьки", 2], ["s10", "К-04.1 Балконы, эркеры, лоджии", 3], ["s11", "К-04.2 Лестницы", 3], ["s12", "К-05. Каркас: колонны, балки, ригели, связи", 2], ["s13", "К-06. Крыша, кровля, стропила, водосток", 2], ["s14", "К-07. Фасад: отделка, штукатурка, облицовка, утепление, швы", 2], ["s15", "К-08. Полы, проёмы, перегородки, заполнение проёмов", 2], ["s16", "К-09. Инженерные системы, влияющие на конструктив", 2], ["s17", "К-10. Аварийные ситуации", 2], ["s18", "СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ»", 2]], "chars": 14008, "plain": " ИНДЕКС КОНСТРУКТИВА (К 01…К 10) Что обследовать по каждому элементу: состав работ, параметры, типовые дефекты, ссылки на норму. Основа — ГОСТ 31937 2024, разделы 5.2—5.7, и практика архива ТЗ (~700 прочитанных отчётов; перекрытия — 627, кирпичные стены — 551, металл — 515). Дефекты — в 04 Дефекты , методики — в 05 Методики , критерии — в 06 Оценка . К 01. Основания и фундаменты, грунты, осадки Норма: ГОСТ 31937 2024, п. 5.2; СП 22.13330.2016; СП 24.13330.2021; СП 446.1325800.2019. Состав работ (5.2.2): изучение фондовых изысканий на участке и соседних, планировки и благоустройства; изучение материалов по конструктивному решению фундаментов; проходка шурфов вблизи фундаментов; проведение или актуализация инженерно геологических изысканий; обследование свайных фундаментов, определение фактической длины и состояния свай. Что устанавливают (5.2.3): геологическое строение участка; тип фундаментов, форма в плане, размер, глубина заложения, ранее выполненные усиления; повреждения фундаментов, прочность материалов; пробы материалов фундаментов и грунтов из под подошвы; наличие и состояние гидроизоляции, УГВ, температура и агрессивность вод. Ключевые цифры: глубина шурфа — на 0,15 м ниже подошвы (5.2.7); число шурфов — по величинам нагрузок на фундаменты (5.2.6); при деформациях стен и фундаментов шурфы обязательны (5.2.6); после работ — засыпка с трамбованием, восстановление покрытия и отмостки (5.2.18). Критерии визуальной оценки (5.2.14): неравномерная осадка; деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции. Типовые дефекты: Д К01 01 неравномерная осадка; Д К01 02 разрушение тела фундамента; Д К01 03 отсутствие/разрушение гидроизоляции; Д К01 04 разуплотнение грунта; Д К01 05 крен. Признак в заключении: «Неравномерная осадка … подтверждается …»; трещины в стенах с раскрытием кверху/книзу — диагностический признак (см. Д К02 06…Д К02 09). К 02. Стены несущие (каменные, панельные, монолитные) Норма: ГОСТ 31937 2024, пп. 5.3.2, 5.3.1; СП 15.13330.2020; СП 63.13330.2018. К 02.1 Каменные (кирпичные) стены — основа архива Что устанавливают (5.3.2.1): материал конструкций; дефекты и деформации: отклонения от вертикали, неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки и штукатурки, выпадение кирпичей, капиллярный подсос; выборочное контрольное зондирование кладки, отбор проб из разных слоёв (влажность, объёмная масса); наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек. Прочность (5.3.2.2—5.3.2.4): лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690); керны бетона — ГОСТ 28570; бут — ГОСТ 4001; расчётные сопротивления — по СП 15.13330.2020. Типовые дефекты: Д К02 01 трещины вертикальные/наклонные; Д К02 02 выпучивание; Д К02 03 отклонение от вертикали; Д К02 04 отколы, пробоины; Д К02 05 увлажнение, высолы; Д К02 06…09 трещины как признак просадки; Д К02 10 разрушение перемычек. К 02.2 Панельные и монолитные стены Норма: п. 5.3.1 (ж. б.), для панельных — обязательная проверка стыков, сварки, закладных (5.3.1.25). Типовые дефекты: раскрытие трещин по швам, коррозия закладных, разрушение герметизации, отклонения от вертикали. К 03. Перекрытия и покрытия Норма: ГОСТ 31937 2024, пп. 5.3.1 (ж. б.), 5.3.3 (сталь), 5.3.4 (дерево); СП 63.13330.2018, СП 16.13330.2017, СП 64.13330.2017, СП 20.13330.2016. К 03.1 По металлическим балкам (доминирующий тип в архиве) Что устанавливают: схема: пролёт в свету, шаг балок, опирание (на кирпичную стену, на перемычку, заделка); сечение и сортамент (двутавр, швеллер; ОСТ 16 1926, старые ГОСТ); межбалочное заполнение (бетон на кирпичном бое, сводики, деревянные щиты); покрытие (стяжка, плитка, асфальтобетон, дощатый настил); состояние балок: коррозия (поверхностная/сквозная), прогиб, деформации, состояние опорных узлов и заделки. Ключевые нормы (5.3.3): толщину корродированных элементов измерять не менее чем в трёх наиболее повреждённых сечениях , в каждом — не менее трёх измерений (5.3.3.13); назначать редуцированные сечения (5.3.3.12). Типовые дефекты: Д К03 01 сквозная коррозия балок; Д К03 02 прогиб; Д К03 03 разрушение заделки в стену; Д К03 04 коррозия перемычек; Д К03 05 обрушение участка; Д К03 06 промерзание/протечки; Д К03 07 недостаточная площадка опирания. Диагностический признак аварийности: «сортамент определить невозможно ввиду полного разрушения конструкций» + «исчерпание несущей способности» → аварийное. К 03.2 Железобетонные (сборные и монолитные) Что устанавливают (5.3.1.1, 5.3.1.21): геометрия и сечения; сопоставление с проектом; соответствие статической схемы; трещины, отколы, разрушения; ширина раскрытия; защитный слой; прогибы; сцепление арматуры с бетоном; разрыв арматуры; анкеровка; коррозия бетона и арматуры. Число участков (5.3.1.8): 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций; конструкций — не менее трёх. Типовые дефекты: Д К03 10 трещины (нормальные, наклонные); Д К03 11 сколы в сжатой зоне; Д К03 12 отслоение защитного слоя; Д К03 13 коррозия арматуры; Д К03 14 прогиб сверх нормативного. К 03.3 Деревянные перекрытия Норма: п. 5.3.4; СП 64.13330.2017. Что устанавливают (5.3.4.1, 5.3.6.11): схема, сечения, пролёты, условия опирания; влажность (ГОСТ 16483.7, 16588); биоповреждения (ГОСТ 18610); прогибы; состояние узлов; наличие и состояние утеплителя, пароизоляции; протечки. Важно (5.3.4.5): расчётные сопротивления древесины, не поражённой гнилью, — как для новой; при поверхностном разрушении гнилью сечение уменьшают. Типовые дефекты: Д К03 20 гниль; Д К03 21 прогиб; Д К03 22 расстройство узлов; Д К03 23 отсутствие/утрата элемента наката. К 04. Балконы, лоджии, эркеры, крыльца, лестницы, козырьки Норма: ГОСТ 31937 2024, п. 5.3.6.1—5.3.6.4. К 04.1 Балконы, эркеры, лоджии Что устанавливают (5.3.6.1): расчётная схема и материал несущих конструкций; размеры: длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками; состояние несущих конструкций: трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит; состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, гидроизоляция; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия (5.3.6.2): для установления сечений несущих элементов и оценки заделки в стену; места — по расчётной схеме. Типовые дефекты: Д К04 01 разрушение плиты; Д К04 02 коррозия консольных балок; Д К04 03 разрушение заделки; Д К04 04 отсутствие/разрушение гидроизоляции; Д К04 05 разрушение ограждения; Д К04 06 трещины в месте примыкания эркера. К 04.2 Лестницы Что устанавливают (5.3.6.3): конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления. Обязательно: осмотру сверху и снизу — все марши и площадки в здании (5.3.6.3). Вскрытия (5.3.6.4): места заделки площадок в стены, опор маршей; для каменных по косоурам — заделка балок площадок; для бескосоурных консольных — глубина заделки ступеней; для деревянных — вскрытие заделки балок и зондирование. Типовые дефекты: Д К04 10 сквозная коррозия косоуров; Д К04 11 разрушение площадки; Д К04 12 трещины ступеней; Д К04 13 утрата марша; Д К04 14 отрыв узла крепления. К 05. Каркас: колонны, балки, ригели, связи Норма: п. 5.3.3; СП 16.13330.2017. Что устанавливают (5.3.3.1): фактические размеры сечений и габариты; отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; защитные и огнезащитные покрытия; характеристики стали и химсостав; пространственное положение; отсутствие элемента; смещения опорных узлов. Типовые дефекты: Д К05 01 коррозия с уменьшением сечения; Д К05 02 искривление; Д К05 03 дефекты сварных швов; Д К05 04 зазоры в болтовых соединениях; Д К05 05 изменение статической схемы; Д К05 06 трещины в основном металле. К 06. Крыша, кровля, стропила, водосток Норма: п. 5.3.6.5—5.3.6.11; СП 17.13330.2017. Что устанавливают: тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу; состояние кровли и водостоков; наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; деформации системы (прогибы, удлинение пролёта, углы наклона сечений и узлов ферм); смещения податливых соединений (сдвиги, обмятие во врубках); вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины и гидроизоляции между деревом и камнем; состояние раствора в карнизах; узлы опирания; ведомость дефектов; вскрытия при необходимости. Причины конденсата и наледей (5.3.6.6): разрушение венткоробов и шахт; отсутствие или разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов чердачных дверей и люков. Типовые дефекты: Д К06 01 протечки; Д К06 02 гниль стропил; Д К06 03 прогиб стропил; Д К06 04 разрушение кровельного покрытия; Д К06 05 засорение/разрушение водостока; Д К06 06 конденсат и наледи. К 07. Фасад: отделка, штукатурка, облицовка, утепление, швы Норма: п. 5.3.5; ГОСТ 34379 (светопрозрачные). Оценка (5.3.5.1): механическая безопасность, пожарная безопасность, долговечность, энергоэффективность. Визуальный контроль (5.3.5.4): плоскостность «поля» облицовки; трещины в штукатурном и лицевом слое; сколы, смещения, нарушение линий швов; каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия; целостность откосов, фартуков, отливов; подвижные элементы и зыбкость. Вскрытия (5.3.5.6—5.3.5.7): узлы крепления подконструкций и облицовки; анкеры; коррозия; заклёпочные и болтовые соединения; перекрытие деформационных швов; теплоизоляция; состояние облицовываемой конструкции. Места проб — поле стены, углы, цоколь, сопряжение с отмосткой, откосы, перемычки, парапеты, декоративные элементы, зоны крепления оборудования. Анкеры (5.3.5.10): несущая способность — по натурным испытаниям. Типовые дефекты: Д К07 01 отслоение штукатурки; Д К07 02 разрушение облицовки; Д К07 03 коррозия креплений; Д К07 04 выветривание кладки; Д К07 05 зыбкость облицовки; Д К07 06 промерзание/сверхнормативные теплопотери. К 08. Полы, проёмы, перегородки, заполнение проёмов Норма: п. 5.3.6 (элементы), п. 5.3.4.7—5.3.4.9 (деревянные перегородки). Что устанавливают: состояние полов и стяжек, уклоны; перегородки — материал, крепление, трещины; заполнение проёмов — перекосы, неплотности, состояние креплений; светопрозрачные конструкции — по ГОСТ 34379. Типовые дефекты: Д К08 01 просадка/разрушение пола; Д К08 02 трещины перегородок; Д К08 03 перекос оконных/дверных блоков; Д К08 04 разрушение откосов. К 09. Инженерные системы, влияющие на конструктив Норма: п. 5.4, 5.5, 5.7. Почему в конструктиве: протечки, конденсат, затопление подвалов — главные причины коррозии металла и гнили дерева (по архиву: недостаточная вентиляция подвала и систематическое затопление — типовые причины повреждений перекрытий). Что проверять: водостоки (5.4.8), отопление (5.4.2), ГВС (5.4.1), ХВС (5.4.3), канализацию (5.4.4), вентиляцию (5.4.5), мусороудаление (5.4.6), газоснабжение (5.4.7); электросети и связь (5.5); теплотехнику ограждений (5.7). Связано: Д К03 01 (коррозия из за протечек), Д К09 01. К 10. Аварийные ситуации Норма: п. 4.5, 4.6; приложения В—Д. Признаки: исчерпание несущей способности; опасность обрушения; крены, угрожающие устойчивости; прогрессирующее обрушение; «сортамент определить невозможно». Действия по стандарту: 1. категория — аварийное; 2. эксплуатация не допускается (4.5); 3. письменное информирование заказчика, собственника, эксплуатирующей организации (4.6); 4. противоаварийные мероприятия; 5. обязательный мониторинг до приведения в работоспособное состояние (4.5). Мероприятия из практики архива: стоечные крепления из металла под аварийной зоной; ограждение опасной зоны; запрет эксплуатации помещений; немедленная разработка проекта усиления/замены. СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ» Элемент Обязательные измерения Инструмент К 01 фундамент размеры в плане, глубина заложения, прочность материала, УГВ рулетка, шурф, молоток Кашкарова/склерометр К 02 кладка геометрия, отклонение от вертикали, ширина трещин, прочность кирпича и раствора отвес, щупы, лупа, лабораторные испытания К 03 металл сечение (с учётом коррозии), пролёт, шаг, прогиб штангенциркуль, толщиномер, нивелир К 03 ж. б. защитный слой, диаметр и шаг арматуры, прочность бетона, ширина трещин магнитный/радиационный метод, склерометр К 03 дерево сечение, влажность, глубина гнили, прогиб влагомер, зондирование, линейка К 04 лестницы сечения косоуров, заделка, износ ступеней штангенциркуль, вскрытие К 04 балконы толщина плиты, сечения балок/подкосов, уклоны штангенциркуль, уклономер К 06 кровля уклоны, сечения стропил, влажность уклономер, влагомер К 07 фасад плоскостность, зыбкость, анкеры правило, простукивание, испытания анкеров "}, {"id": "defects", "file": "04_Дефекты/КАТАЛОГ_ДЕФЕКТОВ.md", "title": "КАТАЛОГ ДЕФЕКТОВ (Д-…)", "section": "04_Дефекты", "html": "<h1>КАТАЛОГ ДЕФЕКТОВ (Д-…)</h1><blockquote><p>Дефект → признаки → причины → категория состояния → норма → источник. Основа: ГОСТ 31937-2024, приложения В (ж.-б. и каменные), Г (стальные), Д (деревянные), пп. 5.2—5.3, плюс практика архива ТЗ. Категории: Н — нормативное, Р — работоспособное, ОР — ограниченно-работоспособное, А — аварийное.</p></blockquote><hr><h2 id=\"s1\">К-01. Основания и фундаменты</h2><h3 id=\"s2\">Д-К01-01. Неравномерная осадка основания</h3><ul><li><strong>Признаки:</strong> перекос здания, трещины в стенах с характерным рисунком, отклонение от</li></ul><p>вертикали, расхождение швов, деформации в надфундаментных конструкциях.</p><ul><li><strong>Причины:</strong> слабые/неоднородные грунты, подтопление, утечки из сетей, дополнительная</li></ul><p>нагрузка, разуплотнение грунта.</p><ul><li><strong>Категория:</strong> ОР; при прогрессирующем развитии и исчерпании несущей способности — А.</li><li><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.2.14; приложение В (2.1, 2.3).</li><li><strong>Источник:</strong> архив ТЗ (178 файлов с «осадк»).</li></ul><h3 id=\"s3\">Д-К01-02. Разрушение тела фундамента</h3><ul><li><strong>Признаки:</strong> выветривание, выкрашивание, отколы, обнажение бутовой кладки, каверны,</li></ul><p>потеря сечения.</p><ul><li><strong>Причины:</strong> агрессивные воды, замачивание, замораживание, долгий срок эксплуатации.</li><li><strong>Категория:</strong> ОР → А при потере несущей способности.</li><li><strong>Норма:</strong> п. 5.2.13, 5.2.15.</li></ul><h3 id=\"s4\">Д-К01-03. Отсутствие или разрушение гидроизоляции</h3><ul><li><strong>Признаки:</strong> сырость, высолы, подтопление подвала, коррозия металла, гниль дерева.</li><li><strong>Категория:</strong> ОР (по совокупности), сама по себе — дефект условий эксплуатации.</li><li><strong>Норма:</strong> п. 5.2.3, 5.2.15.</li></ul><h3 id=\"s5\">Д-К01-04. Разуплотнение грунта</h3><ul><li><strong>Признаки:</strong> просадки полов, крены, локальные провалы.</li><li><strong>Диагностика:</strong> статическое/динамическое зондирование, геофизика (п. 5.2.6).</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s6\">Д-К01-05. Крен здания/фундамента</h3><ul><li><strong>Признаки:</strong> отклонение от вертикали, неравномерные осадки.</li><li><strong>Категория:</strong> ОР; при угрозе потери устойчивости — А (п. 3.1).</li><li><strong>Норма:</strong> п. 5.2.14; форма заключения, поз. 15 приложения А.</li></ul><hr><h2 id=\"s7\">К-02. Каменные (кирпичные) стены</h2><h3 id=\"s8\">Д-К02-01. Трещины вертикальные и наклонные</h3><ul><li><strong>Признаки:</strong> раскрытие, протяжённость, направление, пересечение рядов кладки.</li><li><strong>Причины:</strong> перегрузка, просадка, температурные деформации, недостаточное армирование.</li><li><strong>Порог:</strong> вертикальные трещины раскрытием <strong>0,1—0,5 мм</strong>, пересекающие два ряда кладки</li></ul><p>и более, при <strong>двух и более</strong> трещинах на 1 м вертикально нагруженной стены → ОР (приложение В, п. 2.10).</p><ul><li><strong>Норма:</strong> приложение В, пп. 2.6—2.14.</li></ul><h3 id=\"s9\">Д-К02-02. Выпучивание (деформация стены)</h3><ul><li><strong>Причины:</strong> боковое давление грунта и материалов, распорные конструкции, увеличение</li></ul><p>эксцентриситетов, большая гибкость из-за разрыва связей, смещение опор балок к краю стены, одностороннее оттаивание кладки, температурные деформации (приложение В, п. 2.2).</p><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s10\">Д-К02-03. Отклонение стены от вертикали</h3><ul><li><strong>Причины:</strong> неравномерные осадки, недостаточность или разрыв поперечных связей.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s11\">Д-К02-04. Отколы углов, пробоины, выбоины, борозды</h3><ul><li><strong>Причины:</strong> дефекты строительства, механические воздействия.</li><li><strong>Категория:</strong> ОР (при значительном снижении сечения — расчётом).</li></ul><h3 id=\"s12\">Д-К02-05. Увлажнение кладки, высолы, капиллярный подсос</h3><ul><li><strong>Причины:</strong> атмосферные осадки, конденсация, брызги, отсутствие гидроизоляции.</li><li><strong>Категория:</strong> ОР в сочетании с деструкцией; отдельно — фактор риска.</li></ul><h3 id=\"s13\">Д-К02-06…09. Трещины как диагностика причины (приложение В, пп. 2.6—2.9)</h3><div class=\"tablewrap\"><table><thead><tr><th>Рисунок трещин</th><th>Причина</th></tr></thead><tbody><tr><td>Параболические, ветви расходятся книзу от средней части здания</td><td>просадка грунта в средней части</td></tr><tr><td>Раскрытие увеличивается кверху; наклонные/параболические от краёв</td><td>просадка крайних частей или твёрдое включение под средней частью</td></tr><tr><td>Близкая к вертикальной, раскрытие увеличивается кверху</td><td>разлом из-за жёсткой опоры в грунте под трещиной</td></tr><tr><td>Близкая к вертикальной, одинаковое раскрытие по высоте со смещением части здания</td><td>просадка части здания</td></tr></tbody></table></div><ul><li><strong>Категория:</strong> ОР с обязательным расчётом.</li></ul><h3 id=\"s14\">Д-К02-10. Разрушение перемычек</h3><ul><li><strong>Признаки:</strong> горизонтальные и косые трещины по швам рядовых, клинчатых, арочных перемычек;</li></ul><p>вертикальные трещины в середине пролёта; выпадение камней; сквозная коррозия металлических перемычек.</p><ul><li><strong>Причины:</strong> перегрузка, низкая прочность материалов, недостаточное армирование, коррозия.</li><li><strong>Категория:</strong> ОР; при сквозной коррозии и выпадении камней — А.</li><li><strong>Норма:</strong> приложение В, п. 2.11; практика архива (перемычки из двутавров).</li></ul><h3 id=\"s15\">Д-К02-11. Трещины под опорами и опорными подушками</h3><ul><li><strong>Признаки:</strong> веерообразные трещины, скалывание и раздробление кладки под опорами балок,</li></ul><p>ферм, перемычек, козырьков.</p><ul><li><strong>Причины:</strong> перегрузка, недостаточная глубина опирания, недостаточная несущая способность</li></ul><p>подушки.</p><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s16\">Д-К02-12. Шелушение, выветривание, деструкция кладки</h3><ul><li><strong>Причины:</strong> агрессивные среды, высокий нагрев, пожар, попеременное замораживание-оттаивание,</li></ul><p>увлажнение-высыхание, биопоражения (приложение В, п. 2.15).</p><ul><li><strong>Категория:</strong> ОР.</li></ul><hr><h2 id=\"s17\">К-03. Перекрытия</h2><h3 id=\"s18\">Д-К03-01. Сквозная коррозия металлических балок</h3><ul><li><strong>Признаки:</strong> полное поражение сечения («до 100 %»), отслоение продуктов коррозии,</li></ul><p>провисание, потеря геометрии, обрушение участков.</p><ul><li><strong>Причины:</strong> длительный срок эксплуатации без противокоррозионной защиты, протечки,</li></ul><p>затопление подвала, недостаточная вентиляция.</p><ul><li><strong>Категория:</strong> <strong>А</strong> (исчерпание несущей способности).</li><li><strong>Норма:</strong> приложение Г; п. 5.3.3.12—5.3.3.13.</li><li><strong>Источник:</strong> практика обследований; последние экспертизы (объект исторической застройки).</li></ul><h3 id=\"s19\">Д-К03-02. Поверхностная коррозия металла</h3><ul><li><strong>Признаки:</strong> поражение без потери сечения насквозь, указание процента (например, «до 11 %»).</li><li><strong>Категория:</strong> ОР при снижении сечения; при незначительном — Р.</li><li><strong>Норма:</strong> приложение Г («разрушение защитных покрытий, коррозия металла» → ОР).</li></ul><h3 id=\"s20\">Д-К03-03. Прогиб балок перекрытия</h3><ul><li><strong>Признаки:</strong> видимое провисание, отклонение от горизонтали, зыбкость пола.</li><li><strong>Порог:</strong> относительные прогибы, превышающие для плит перекрытий и покрытий <strong>1/150</strong>,</li></ul><p>для преднапряжённых стропильных балок <strong>1/300</strong>, ферм <strong>1/700</strong> → основание для А (приложение В, п. 1.9).</p><ul><li><strong>Категория:</strong> ОР; при превышении порогов — А (с расчётом).</li></ul><h3 id=\"s21\">Д-К03-04. Разрушение заделки балки в стену</h3><ul><li><strong>Признаки:</strong> трещины у опоры, выпадение кладки, коррозия опорной части, смещение балки.</li><li><strong>Причины:</strong> протечки, коррозия, недостаточная глубина заделки, перегрузка.</li><li><strong>Категория:</strong> А при потере опирания; иначе ОР.</li></ul><h3 id=\"s22\">Д-К03-05. Обрушение участка перекрытия</h3><ul><li><strong>Признаки:</strong> падение балок и заполнения, провалы.</li><li><strong>Категория:</strong> <strong>А</strong>; немедленные противоаварийные меры (п. 4.5, 4.6).</li></ul><h3 id=\"s23\">Д-К03-06. Недостаточная площадка опирания</h3><ul><li><strong>Признаки:</strong> смещение балки к краю стены, опирание менее проектного.</li><li><strong>Норма:</strong> приложение В, п. 1.12 — «уменьшение площадок опирания по сравнению с проектными»</li></ul><p>→ А (обосновывается расчётом).</p><ul><li><strong>Категория:</strong> А (по расчёту).</li></ul><h3 id=\"s24\">Д-К03-07. Промерзание, протечки, конденсат</h3><ul><li><strong>Причины:</strong> разрушение кровли, гидроизоляции, вентиляции; недостаточное утепление.</li><li><strong>Следствие:</strong> коррозия металла, гниль дерева.</li><li><strong>Категория:</strong> ОР по совокупности.</li></ul><h3 id=\"s25\">Д-К03-10. Трещины в железобетоне</h3><ul><li><strong>Пороги (приложение В, п. 1.6):</strong> нормальные трещины в изгибаемых и растянутых элементах</li></ul><p>шириной более: <strong>А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм</strong> → ОР.</p><ul><li><strong>Опасные:</strong> наклонные со смещением участков бетона, трещины, пересекающие арматуру →</li></ul><p><strong>А</strong> (п. 1.8); трещины с разветвлёнными концами при перегрузке → А (п. 1.7).</p><ul><li><strong>Трещины вдоль арматуры:</strong> до 3 мм → ОР; <strong>на опорных участках — А</strong> (п. 1.4).</li></ul><h3 id=\"s26\">Д-К03-11. Сколы бетона в сжатой зоне</h3><ul><li><strong>Причина:</strong> механические воздействия.</li><li><strong>Категория:</strong> ОР (приложение В, п. 1.2).</li></ul><h3 id=\"s27\">Д-К03-12. Отслоение защитного слоя</h3><ul><li><strong>Причина:</strong> коррозия арматуры.</li><li><strong>Категория:</strong> ОР; <strong>на опорном участке — А</strong> (приложение В, п. 1.5).</li></ul><h3 id=\"s28\">Д-К03-13. Коррозия арматуры и закладных деталей</h3><ul><li><strong>Признаки:</strong> волосяные трещины вдоль арматуры, ржавые потёки, уменьшение сечения стержней.</li><li><strong>Оценка:</strong> площадь поражения, глубина, остаточное сечение (п. 5.3.1.18).</li><li><strong>Категория:</strong> ОР; при разрыве арматуры, выпучивании сжатой арматуры — А (пп. 1.10—1.13).</li></ul><h3 id=\"s29\">Д-К03-14. Выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение В, п. 1.11).</li></ul><h3 id=\"s30\">Д-К03-15. Разрыв или смещение поперечной арматуры в зоне наклонных трещин</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (п. 1.13).</li></ul><h3 id=\"s31\">Д-К03-16. Отрыв анкеров от пластин закладных деталей, расстройство стыков</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (п. 1.14).</li></ul><h3 id=\"s32\">Д-К03-20. Гниль деревянных элементов</h3><ul><li><strong>Признаки:</strong> размягчение, потеря сечения, грибок, запах, влажность выше нормы.</li><li><strong>Причины:</strong> протечки, конденсат, отсутствие гидроизоляции между деревом и камнем,</li></ul><p>недостаточная вентиляция.</p><ul><li><strong>Норма:</strong> п. 5.3.4.3 (ГОСТ 18610), 5.3.6.7; приложение Д.</li><li><strong>Категория:</strong> ОР; при потере сечения и целостности наката — А (приложение Д).</li></ul><h3 id=\"s33\">Д-К03-21. Прогиб деревянных балок</h3><ul><li><strong>Категория:</strong> ОР; при превышении предельного — А (обосновывается расчётом).</li></ul><h3 id=\"s34\">Д-К03-22. Расстройство узлов сопряжения дерева</h3><ul><li><strong>Признаки:</strong> сдвиги, обмятие во врубках, ослабление скруток, хомутов.</li><li><strong>Категория:</strong> ОР; при потере связи — А.</li></ul><h3 id=\"s35\">Д-К03-23. Отсутствие элемента наката, потеря целостности</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение Д, п. 1).</li></ul><h3 id=\"s36\">Д-К03-24. Увлажнение утеплителя, отсутствие пароизоляции</h3><ul><li><strong>Норма:</strong> п. 5.3.6.11.</li><li><strong>Следствие:</strong> промерзание, гниль, коррозия.</li><li><strong>Категория:</strong> ОР по совокупности.</li></ul><hr><h2 id=\"s37\">К-04. Балконы, лоджии, эркеры, лестницы</h2><h3 id=\"s38\">Д-К04-01. Разрушение балконной плиты</h3><ul><li><strong>Признаки:</strong> трещины, отколы бетона, обнажение и коррозия арматуры, провалы, разрушение</li></ul><p>ограждения.</p><ul><li><strong>Категория:</strong> ОР → А при потере сечения и опирания.</li></ul><h3 id=\"s39\">Д-К04-02. Коррозия консольных балок, подкосов, подвесок</h3><ul><li><strong>Категория:</strong> ОР; сквозная коррозия — А.</li></ul><h3 id=\"s40\">Д-К04-03. Разрушение заделки несущих элементов балкона в стену</h3><ul><li><strong>Признаки:</strong> трещины у примыкания, наклон плиты, выпадение кладки.</li><li><strong>Категория:</strong> А при потере заделки.</li></ul><h3 id=\"s41\">Д-К04-04. Отсутствие или разрушение гидроизоляции балкона</h3><ul><li><strong>Следствие:</strong> коррозия арматуры, протечки в нижележащие помещения.</li></ul><h3 id=\"s42\">Д-К04-05. Разрушение ограждения балкона/лоджии</h3><ul><li><strong>Категория:</strong> ОР (опасность для людей — приоритет).</li></ul><h3 id=\"s43\">Д-К04-06. Трещины в месте примыкания эркера к зданию</h3><ul><li><strong>Норма:</strong> п. 5.3.6.1 (обязательно проверять).</li><li><strong>Категория:</strong> ОР → А при раскрытии и потере связи.</li></ul><h3 id=\"s44\">Д-К04-10. Сквозная коррозия косоуров лестницы</h3><ul><li><strong>Признаки:</strong> полное поражение сечения, провисание марша, разрушение ступеней.</li><li><strong>Категория:</strong> <strong>А</strong>.</li><li><strong>Источник:</strong> последние экспертизы (объект культурного наследия; объект исторической застройки).</li></ul><h3 id=\"s45\">Д-К04-11. Разрушение лестничной площадки</h3><ul><li><strong>Признаки:</strong> коррозия балок, провал покрытия, уклон, обрушение.</li><li><strong>Категория:</strong> А при исчерпании несущей способности.</li></ul><h3 id=\"s46\">Д-К04-12. Трещины и износ ступеней</h3><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s47\">Д-К04-13. Утрата лестничного марша</h3><ul><li><strong>Признаки:</strong> физическое отсутствие марша, замена временной металлической лестницей.</li><li><strong>Категория:</strong> <strong>А</strong> (для утраченного элемента — фиксируется как утрата).</li></ul><h3 id=\"s48\">Д-К04-14. Отрыв элементов стальной лестницы, деформация узлов крепления</h3><ul><li><strong>Норма:</strong> п. 5.3.6.3.</li><li><strong>Категория:</strong> ОР → А при потере крепления.</li></ul><hr><h2 id=\"s49\">К-05. Стальной каркас</h2><h3 id=\"s50\">Д-К05-01. Коррозия с уменьшением сечения</h3><ul><li><strong>Измерения:</strong> не менее 3 наиболее повреждённых сечений, в каждом не менее 3 измерений</li></ul><p>(п. 5.3.3.13); назначать редуцированные сечения (5.3.3.12).</p><ul><li><strong>Категория:</strong> ОР; при критическом снижении — А (расчётом).</li></ul><h3 id=\"s51\">Д-К05-02. Искривления элементов, превышающие допустимые</h3><ul><li><strong>Категория:</strong> А (приложение Г; обосновывается расчётом).</li></ul><h3 id=\"s52\">Д-К05-03. Дефекты сварных швов (трещины и недопустимые дефекты)</h3><ul><li><strong>Норма:</strong> ГОСТ 23118-2019, подраздел 5.2.</li><li><strong>Категория:</strong> А для элементов группы 1 (приложение Г).</li></ul><h3 id=\"s53\">Д-К05-04. Зазоры в болтовых соединениях</h3><ul><li><strong>Фрикционные, группа 1</strong> → А; <strong>группы 2—4</strong> → ОР.</li><li><strong>Срезные</strong> → ОР.</li><li><strong>Фланцевые растянутые/сжато-изогнутые (группа 1)</strong> → А по результатам контроля зазоров.</li><li><strong>Фланцевые сжатые, группы 2—4</strong> → ОР (приложение Г).</li></ul><h3 id=\"s54\">Д-К05-05. Изменение статической схемы</h3><ul><li><strong>Причины:</strong> включение непредусмотренных элементов, заклинивание опор, выключение элементов</li></ul><p>из работы.</p><ul><li><strong>Категория:</strong> А (обосновывается расчётом по действительной схеме).</li></ul><h3 id=\"s55\">Д-К05-06. Хрупкие или усталостные трещины в основном металле</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение Г).</li></ul><h3 id=\"s56\">Д-К05-07. Выпучивание стенок замкнутых сечений</h3><ul><li><strong>Категория:</strong> ОР при отсутствии трещин и разрывов.</li></ul><h3 id=\"s57\">Д-К05-08. Местные погибы</h3><ul><li><strong>Категория:</strong> ОР, если не влияют на работу конструкции.</li></ul><h3 id=\"s58\">Д-К05-09. Разрушение защитных (в том числе огнезащитных) покрытий</h3><ul><li><strong>Категория:</strong> ОР; риск последующей коррозии.</li></ul><hr><h2 id=\"s59\">К-06. Кровля и стропила</h2><h3 id=\"s60\">Д-К06-01. Протечки кровли</h3><ul><li><strong>Причины:</strong> разрушение покрытия, засорение водостока, нарушение примыканий, конденсат.</li><li><strong>Следствие:</strong> коррозия металла, гниль дерева, промерзание.</li><li><strong>Норма:</strong> п. 5.3.6.5; СП 17.13330.2017.</li></ul><h3 id=\"s61\">Д-К06-02. Гниль стропил, обрешётки, мауэрлата</h3><ul><li><strong>Категория:</strong> ОР → А при потере сечения.</li><li><strong>Норма:</strong> приложение Д; п. 5.3.6.7.</li></ul><h3 id=\"s62\">Д-К06-03. Прогиб стропильной системы, деформации ферм</h3><ul><li><strong>Признаки:</strong> прогибы, удлинение пролёта, углы наклона сечений и узлов, смещения податливых</li></ul><p>соединений, трещины скалывания, складки сжатия (п. 5.3.6.5).</p><ul><li><strong>Категория:</strong> ОР → А при потере устойчивости.</li></ul><h3 id=\"s63\">Д-К06-04. Разрушение кровельного покрытия</h3><ul><li><strong>Категория:</strong> ОР; при массовых протечках — ОР по совокупности.</li></ul><h3 id=\"s64\">Д-К06-05. Засорение или разрушение водостока</h3><ul><li><strong>Норма:</strong> п. 5.4.8.</li><li><strong>Следствие:</strong> замачивание стен и перекрытий.</li></ul><h3 id=\"s65\">Д-К06-06. Конденсат и наледи на свесах и водостоках</h3><ul><li><strong>Причины (5.3.6.6):</strong> разрушение венткоробов и шахт; отсутствие/разрушение теплоизоляции</li></ul><p>трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов дверей и люков.</p><ul><li><strong>Категория:</strong> ОР по совокупности.</li></ul><hr><h2 id=\"s66\">К-07. Фасад</h2><h3 id=\"s67\">Д-К07-01. Отслоение штукатурки, разрушение отделочного слоя</h3><ul><li><strong>Признаки:</strong> трещины, «бухты», простукивание даёт глухой звук, отслоение.</li><li><strong>Категория:</strong> ОР; при угрозе падения — А для участка.</li></ul><h3 id=\"s68\">Д-К07-02. Разрушение облицовки (в том числе вентилируемого фасада)</h3><ul><li><strong>Признаки:</strong> сколы, смещения, нарушение линий швов, зыбкость, пустоты.</li><li><strong>Норма:</strong> п. 5.3.5.4, 5.3.5.6.</li><li><strong>Категория:</strong> ОР → А при угрозе обрушения.</li></ul><h3 id=\"s69\">Д-К07-03. Коррозия креплений и подконструкций</h3><ul><li><strong>Норма:</strong> п. 5.3.5.6.</li><li><strong>Категория:</strong> ОР; при потере анкеровки — А.</li></ul><h3 id=\"s70\">Д-К07-04. Выветривание, деструкция кладки фасада</h3><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s71\">Д-К07-05. Зыбкость облицовки, подвижные элементы</h3><ul><li><strong>Норма:</strong> п. 5.3.5.4 («контроль наличия подвижных элементов с оценкой общей зыбкости»).</li><li><strong>Категория:</strong> А для участка (угроза падения).</li></ul><h3 id=\"s72\">Д-К07-06. Промерзание, сверхнормативные теплопотери, конденсат</h3><ul><li><strong>Норма:</strong> п. 5.7.</li><li><strong>Категория:</strong> ОР (энергоэффективность), не путать с механической безопасностью.</li></ul><hr><h2 id=\"s73\">К-08. Полы, проёмы, перегородки</h2><h3 id=\"s74\">Д-К08-01. Просадка и разрушение полов, стяжек</h3><ul><li><strong>Причины:</strong> просадка основания, протечки, коррозия балок.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s75\">Д-К08-02. Трещины перегородок</h3><ul><li><strong>Категория:</strong> ОР (эксплуатационный дефект).</li></ul><h3 id=\"s76\">Д-К08-03. Перекос оконных и дверных блоков</h3><ul><li><strong>Причины:</strong> осадка, деформации стен.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s77\">Д-К08-04. Разрушение откосов, отливов</h3><ul><li><strong>Следствие:</strong> замачивание стен.</li><li><strong>Категория:</strong> ОР.</li></ul><hr><h2 id=\"s78\">К-09. Инженерные системы</h2><h3 id=\"s79\">Д-К09-01. Затопление подвала, отсутствие вентиляции</h3><ul><li><strong>Причины:</strong> неисправность сетей, отсутствие водоотвода, засорение.</li><li><strong>Следствие:</strong> коррозия металла и гниль дерева — главные причины аварийных перекрытий</li></ul><p>в архиве.</p><ul><li><strong>Норма:</strong> п. 5.4, 5.4.8.</li><li><strong>Категория:</strong> фактор, усиливающий дефекты К-03.</li></ul><h3 id=\"s80\">Д-К09-02. Разрушение трубопроводов, протечки</h3><ul><li><strong>Норма:</strong> пп. 5.4.1—5.4.7.</li><li><strong>Категория:</strong> ОР системы.</li></ul><hr><h2 id=\"s81\">К-10. Аварийные ситуации</h2><h3 id=\"s82\">Д-К10-01. Прогрессирующее обрушение</h3><ul><li><strong>Признаки:</strong> цепное разрушение элементов, потеря устойчивости, обрушение участков.</li><li><strong>Норма:</strong> п. 4.3 (обследование после аварий), 4.5, 4.6.</li><li><strong>Действия:</strong> немедленное информирование, ограждение, противоаварийные мероприятия,</li></ul><p>мониторинг.</p><h3 id=\"s83\">Д-К10-02. Исчерпание несущей способности</h3><ul><li><strong>Признаки:</strong> «сортамент определить невозможно», сквозная коррозия 100 %, разрывы арматуры,</li></ul><p>выпучивание сжатой арматуры, наклонные трещины со смещением.</p><ul><li><strong>Категория:</strong> <strong>А</strong>.</li><li><strong>Норма:</strong> п. 3.1; приложения В—Д.</li></ul><hr><h2 id=\"s84\">БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Дефект</th><th>Категория</th><th>Норма</th></tr></thead><tbody><tr><td>Наклонные трещины со смещением бетона</td><td>А</td><td>В, 1.8</td></tr><tr><td>Выпучивание сжатой арматуры</td><td>А</td><td>В, 1.11</td></tr><tr><td>Уменьшение площадок опирания</td><td>А</td><td>В, 1.12</td></tr><tr><td>Разрыв/смещение поперечной арматуры</td><td>А</td><td>В, 1.13</td></tr><tr><td>Отрыв анкеров, расстройство стыков</td><td>А</td><td>В, 1.14</td></tr><tr><td>Трещины вдоль арматуры &gt; 3 мм на опоре</td><td>А</td><td>В, 1.4</td></tr><tr><td>Отслоение защитного слоя на опоре</td><td>А</td><td>В, 1.5</td></tr><tr><td>Прогиб плит &gt; 1/150</td><td>А (расчёт)</td><td>В, 1.9</td></tr><tr><td>Вертикальные трещины кладки 0,1—0,5 мм, ≥ 2 на 1 м</td><td>ОР</td><td>В, 2.10</td></tr><tr><td>Выпучивание стены</td><td>ОР</td><td>В, 2.2</td></tr><tr><td>Отклонение стены от вертикали</td><td>ОР</td><td>В, 2.3</td></tr><tr><td>Трещины в перемычках</td><td>ОР</td><td>В, 2.11</td></tr><tr><td>Трещины под опорами</td><td>ОР</td><td>В, 2.13</td></tr><tr><td>Сквозная коррозия балок</td><td>А</td><td>практика</td></tr><tr><td>Поверхностная коррозия</td><td>ОР</td><td>Г</td></tr><tr><td>Искривления металла сверх допустимых</td><td>А (расчёт)</td><td>Г</td></tr><tr><td>Зазоры фрикционных соединений группы 1</td><td>А</td><td>Г</td></tr><tr><td>Зазоры фрикционных соединений групп 2—4</td><td>ОР</td><td>Г</td></tr><tr><td>Хрупкие/усталостные трещины металла</td><td>А</td><td>Г</td></tr><tr><td>Отсутствие наката, потеря целостности</td><td>А</td><td>Д</td></tr><tr><td>Гниль с потерей сечения</td><td>ОР → А</td><td>Д</td></tr><tr><td>Зыбкость облицовки фасада</td><td>А для участка</td><td>5.3.5.4</td></tr>< тслоение штукатурки, разрушение отделочного слоя", 3], ["s68", "Д-К07-02. Разрушение облицовки (в том числе вентилируемого фасада)", 3], ["s69", "Д-К07-03. Коррозия креплений и подконструкций", 3], ["s70", "Д-К07-04. Выветривание, деструкция кладки фасада", 3], ["s71", "Д-К07-05. Зыбкость облицовки, подвижные элементы", 3], ["s72", "Д-К07-06. Промерзание, сверхнормативные теплопотери, конденсат", 3], ["s73", "К-08. Полы, проёмы, перегородки", 2], ["s74", "Д-К08-01. Просадка и разрушение полов, стяжек", 3], ["s75", "Д-К08-02. Трещины перегородок", 3], ["s76", "Д-К08-03. Перекос оконных и дверных блоков", 3], ["s77", "Д-К08-04. Разрушение откосов, отливов", 3], ["s78", "К-09. Инженерные системы", 2], ["s79", "Д-К09-01. Затопление подвала, отсутствие вентиляции", 3], ["s80", "Д-К09-02. Разрушение трубопроводов, протечки", 3], ["s81", "К-10. Аварийные ситуации", 2], ["s82", "Д-К10-01. Прогрессирующее обрушение", 3], ["s83", "Д-К10-02. Исчерпание несущей способности", 3], ["s84", "БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ»", 2]], "chars": 17647, "plain": " КАТАЛОГ ДЕФЕКТОВ (Д …) Дефект → признаки → причины → категория состояния → норма → источник. Основа: ГОСТ 31937 2024, приложения В (ж. б. и каменные), Г (стальные), Д (деревянные), пп. 5.2—5.3, плюс практика архива ТЗ. Категории: Н — нормативное, Р — работоспособное, ОР — ограниченно работоспособное, А — аварийное. К 01. Основания и фундаменты Д К01 01. Неравномерная осадка основания Признаки: перекос здания, трещины в стенах с характерным рисунком, отклонение от вертикали, расхождение швов, деформации в надфундаментных конструкциях. Причины: слабые/неоднородные грунты, подтопление, утечки из сетей, дополнительная нагрузка, разуплотнение грунта. Категория: ОР; при прогрессирующем развитии и исчерпании несущей способности — А. Норма: ГОСТ 31937 2024, п. 5.2.14; приложение В (2.1, 2.3). Источник: архив ТЗ (178 файлов с «осадк»). Д К01 02. Разрушение тела фундамента Признаки: выветривание, выкрашивание, отколы, обнажение бутовой кладки, каверны, потеря сечения. Причины: агрессивные воды, замачивание, замораживание, долгий срок эксплуатации. Категория: ОР → А при потере несущей способности. Норма: п. 5.2.13, 5.2.15. Д К01 03. Отсутствие или разрушение гидроизоляции Признаки: сырость, высолы, подтопление подвала, коррозия металла, гниль дерева. Категория: ОР (по совокупности), сама по себе — дефект условий эксплуатации. Норма: п. 5.2.3, 5.2.15. Д К01 04. Разуплотнение грунта Признаки: просадки полов, крены, локальные провалы. Диагностика: статическое/динамическое зондирование, геофизика (п. 5.2.6). Категория: ОР. Д К01 05. Крен здания/фундамента Признаки: отклонение от вертикали, неравномерные осадки. Категория: ОР; при угрозе потери устойчивости — А (п. 3.1). Норма: п. 5.2.14; форма заключения, поз. 15 приложения А. К 02. Каменные (кирпичные) стены Д К02 01. Трещины вертикальные и наклонные Признаки: раскрытие, протяжённость, направление, пересечение рядов кладки. Причины: перегрузка, просадка, температурные деформации, недостаточное армирование. Порог: вертикальные трещины раскрытием 0,1—0,5 мм , пересекающие два ряда кладки и более, при двух и более трещинах на 1 м вертикально нагруженной стены → ОР (приложение В, п. 2.10). Норма: приложение В, пп. 2.6—2.14. Д К02 02. Выпучивание (деформация стены) Причины: боковое давление грунта и материалов, распорные конструкции, увеличение эксцентриситетов, большая гибкость из за разрыва связей, смещение опор балок к краю стены, одностороннее оттаивание кладки, температурные деформации (приложение В, п. 2.2). Категория: ОР. Д К02 03. Отклонение стены от вертикали Причины: неравномерные осадки, недостаточность или разрыв поперечных связей. Категория: ОР. Д К02 04. Отколы углов, пробоины, выбоины, борозды Причины: дефекты строительства, механические воздействия. Категория: ОР (при значительном снижении сечения — расчётом). Д К02 05. Увлажнение кладки, высолы, капиллярный подсос Причины: атмосферные осадки, конденсация, брызги, отсутствие гидроизоляции. Категория: ОР в сочетании с деструкцией; отдельно — фактор риска. Д К02 06…09. Трещины как диагностика причины (приложение В, пп. 2.6—2.9) Рисунок трещин Причина Параболические, ветви расходятся книзу от средней части здания просадка грунта в средней части Раскрытие увеличивается кверху; наклонные/параболические от краёв просадка крайних частей или твёрдое включение под средней частью Близкая к вертикальной, раскрытие увеличивается кверху разлом из за жёсткой опоры в грунте под трещиной Близкая к вертикальной, одинаковое раскрытие по высоте со смещением части здания просадка части здания Категория: ОР с обязательным расчётом. Д К02 10. Разрушение перемычек Признаки: горизонтальные и косые трещины по швам рядовых, клинчатых, арочных перемычек; вертикальные трещины в середине пролёта; выпадение камней; сквозная коррозия металлических перемычек. Причины: перегрузка, низкая прочность материалов, недостаточное армирование, коррозия. Категория: ОР; при сквозной коррозии и выпадении камней — А. Норма: приложение В, п. 2.11; практика архива (перемычки из двутавров). Д К02 11. Трещины под опорами и опорными подушками Признаки: веерообразные трещины, скалывание и раздробление кладки под опорами балок, ферм, перемычек, козырьков. Причины: перегрузка, недостаточная глубина опирания, недостаточная несущая способность подушки. Категория: ОР. Д К02 12. Шелушение, выветривание, деструкция кладки Причины: агрессивные среды, высокий нагрев, пожар, попеременное замораживание оттаивание, увлажнение высыхание, биопоражения (приложение В, п. 2.15). Категория: ОР. К 03. Перекрытия Д К03 01. Сквозная коррозия металлических балок Признаки: полное поражение сечения («до 100 %»), отслоение продуктов коррозии, провисание, потеря геометрии, обрушение участков. Причины: длительный срок эксплуатации без противокоррозионной защиты, протечки, затопление подвала, недостаточная вентиляция. Категория: А (исчерпание несущей способности). Норма: приложение Г; п. 5.3.3.12—5.3.3.13. Источник: практика обследований; последние экспертизы (объект исторической застройки). Д К03 02. Поверхностная коррозия металла Признаки: поражение без потери сечения насквозь, указание процента (например, «до 11 %»). Категория: ОР при снижении сечения; при незначительном — Р. Норма: приложение Г («разрушение защитных покрытий, коррозия металла» → ОР). Д К03 03. Прогиб балок перекрытия Признаки: видимое провисание, отклонение от горизонтали, зыбкость пола. Порог: относительные прогибы, превышающие для плит перекрытий и покрытий 1/150 , для преднапряжённых стропильных балок 1/300 , ферм 1/700 → основание для А (приложение В, п. 1.9). Категория: ОР; при превышении порогов — А (с расчётом). Д К03 04. Разрушение заделки балки в стену Признаки: трещины у опоры, выпадение кладки, коррозия опорной части, смещение балки. Причины: протечки, коррозия, недостаточная глубина заделки, перегрузка. Категория: А при потере опирания; иначе ОР. Д К03 05. Обрушение участка перекрытия Признаки: падение балок и заполнения, провалы. Категория: А ; немедленные противоаварийные меры (п. 4.5, 4.6). Д К03 06. Недостаточная площадка опирания Признаки: смещение балки к краю стены, опирание менее проектного. Норма: приложение В, п. 1.12 — «уменьшение площадок опирания по сравнению с проектными» → А (обосновывается расчётом). Категория: А (по расчёту). Д К03 07. Промерзание, протечки, конденсат Причины: разрушение кровли, гидроизоляции, вентиляции; недостаточное утепление. Следствие: коррозия металла, гниль дерева. Категория: ОР по совокупности. Д К03 10. Трещины в железобетоне Пороги (приложение В, п. 1.6): нормальные трещины в изгибаемых и растянутых элементах шириной более: А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм → ОР. Опасные: наклонные со смещением участков бетона, трещины, пересекающие арматуру → А (п. 1.8); трещины с разветвлёнными концами при перегрузке → А (п. 1.7). Трещины вдоль арматуры: до 3 мм → ОР; на опорных участках — А (п. 1.4). Д К03 11. Сколы бетона в сжатой зоне Причина: механические воздействия. Категория: ОР (приложение В, п. 1.2). Д К03 12. Отслоение защитного слоя Причина: коррозия арматуры. Категория: ОР; на опорном участке — А (приложение В, п. 1.5). Д К03 13. Коррозия арматуры и закладных деталей Признаки: волосяные трещины вдоль арматуры, ржавые потёки, уменьшение сечения стержней. Оценка: площадь поражения, глубина, остаточное сечение (п. 5.3.1.18). Категория: ОР; при разрыве арматуры, выпучивании сжатой арматуры — А (пп. 1.10—1.13). Д К03 14. Выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона Категория: А (приложение В, п. 1.11). Д К03 15. Разрыв или смещение поперечной арматуры в зоне наклонных трещин Категория: А (п. 1.13). Д К03 16. Отрыв анкеров от пластин закладных деталей, расстройство стыков Категория: А (п. 1.14). Д К03 20. Гниль деревянных элементов Признаки: размягчение, потеря сечения, грибок, запах, влажность выше нормы. Причины: протечки, конденсат, отсутствие гидроизоляции между деревом и камнем, недостаточная вентиляция. Норма: п. 5.3.4.3 (ГОСТ 18610), 5.3.6.7; приложение Д. Категория: ОР; при потере сечения и целостности наката — А (приложение Д). Д К03 21. Прогиб деревянных балок Категория: ОР; при превышении предельного — А (обосновывается расчётом). Д К03 22. Расстройство узлов сопряжения дерева Признаки: сдвиги, обмятие во врубках, ослабление скруток, хомутов. Категория: ОР; при потере связи — А. Д К03 23. Отсутствие элемента наката, потеря целостности Категория: А (приложение Д, п. 1). Д К03 24. Увлажнение утеплителя, отсутствие пароизоляции Норма: п. 5.3.6.11. Следствие: промерзание, гниль, коррозия. Категория: ОР по совокупности. К 04. Балконы, лоджии, эркеры, лестницы Д К04 01. Разрушение балконной плиты Признаки: трещины, отколы бетона, обнажение и коррозия арматуры, провалы, разрушение ограждения. Категория: ОР → А при потере сечения и опирания. Д К04 02. Коррозия консольных балок, подкосов, подвесок Категория: ОР; сквозная коррозия — А. Д К04 03. Разрушение заделки несущих элементов балкона в стену Признаки: трещины у примыкания, наклон плиты, выпадение кладки. Категория: А при потере заделки. Д К04 04. Отсутствие или разрушение гидроизоляции балкона Следствие: коррозия арматуры, протечки в нижележащие помещения. Д К04 05. Разрушение ограждения балкона/лоджии Категория: ОР (опасность для людей — приоритет). Д К04 06. Трещины в месте примыкания эркера к зданию Норма: п. 5.3.6.1 (обязательно проверять). Категория: ОР → А при раскрытии и потере связи. Д К04 10. Сквозная коррозия косоуров лестницы Признаки: полное поражение сечения, провисание марша, разрушение ступеней. Категория: А . Источник: последние экспертизы (объект культурного наследия; объект исторической застройки). Д К04 11. Разрушение лестничной площадки Признаки: коррозия балок, провал покрытия, уклон, обрушение. Категория: А при исчерпании несущей способности. Д К04 12. Трещины и износ ступеней Категория: ОР. Д К04 13. Утрата лестничного марша Признаки: физическое отсутствие марша, замена временной металлической лестницей. Категория: А (для утраченного элемента — фиксируется как утрата). Д К04 14. Отрыв элементов стальной лестницы, деформация узлов крепления Норма: п. 5.3.6.3. Категория: ОР → А при потере крепления. К 05. Стальной каркас Д К05 01. Коррозия с уменьшением сечения Измерения: не менее 3 наиболее повреждённых сечений, в каждом не менее 3 измерений (п. 5.3.3.13); назначать редуцированные сечения (5.3.3.12). Категория: ОР; при критическом снижении — А (расчётом). Д К05 02. Искривления элементов, превышающие допустимые Категория: А (приложение Г; обосновывается расчётом). Д К05 03. Дефекты сварных швов (трещины и недопустимые дефекты) Норма: ГОСТ 23118 2019, подраздел 5.2. Категория: А для элементов группы 1 (приложение Г). Д К05 04. Зазоры в болтовых соединениях Фрикционные, группа 1 → А; группы 2—4 → ОР. Срезные → ОР. Фланцевые растянутые/сжато изогнутые (группа 1) → А по результатам контроля зазоров. Фланцевые сжатые, группы 2—4 → ОР (приложение Г). Д К05 05. Изменение статической схемы Причины: включение непредусмотренных элементов, заклинивание опор, выключение элементов из работы. Категория: А (обосновывается расчётом по действительной схеме). Д К05 06. Хрупкие или усталостные трещины в основном металле Категория: А (приложение Г). Д К05 07. Выпучивание стенок замкнутых сечений Категория: ОР при отсутствии трещин и разрывов. Д К05 08. Местные погибы Категория: ОР, если не влияют на работу конструкции. Д К05 09. Разрушение защитных (в том числе огнезащитных) покрытий Категория: ОР; риск последующей коррозии. К 06. Кровля и стропила Д К06 01. Протечки кровли Причины: разрушение покрытия, засорение водостока, нарушение примыканий, конденсат. Следствие: коррозия металла, гниль дерева, промерзание. Норма: п. 5.3.6.5; СП 17.13330.2017. Д К06 02. Гниль стропил, обрешётки, мауэрлата Категория: ОР → А при потере сечения. Норма: приложение Д; п. 5.3.6.7. Д К06 03. Прогиб стропильной системы, деформации ферм Признаки: прогибы, удлинение пролёта, углы наклона сечений и узлов, смещения податливых соединений, трещины скалывания, складки сжатия (п. 5.3.6.5). Категория: ОР → А при потере устойчивости. Д К06 04. Разрушение кровельного покрытия Категория: ОР; при массовых протечках — ОР по совокупности. Д К06 05. Засорение или разрушение водостока Норма: п. 5.4.8. Следствие: замачивание стен и перекрытий. Д К06 06. Конденсат и наледи на свесах и водостоках Причины (5.3.6.6): разрушение венткоробов и шахт; отсутствие/разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов дверей и люков. Категория: ОР по совокупности. К 07. Фасад Д К07 01. Отслоение штукатурки, разрушение отделочного слоя Признаки: трещины, «бухты», простукивание даёт глухой звук, отслоение. Категория: ОР; при угрозе падения — А для участка. Д К07 02. Разрушение облицовки (в том числе вентилируемого фасада) Признаки: сколы, смещения, нарушение линий швов, зыбкость, пустоты. Норма: п. 5.3.5.4, 5.3.5.6. Категория: ОР → А при угрозе обрушения. Д К07 03. Коррозия креплений и подконструкций Норма: п. 5.3.5.6. Категория: ОР; при потере анкеровки — А. Д К07 04. Выветривание, деструкция кладки фасада Категория: ОР. Д К07 05. Зыбкость облицовки, подвижные элементы Норма: п. 5.3.5.4 («контроль наличия подвижных элементов с оценкой общей зыбкости»). Категория: А для участка (угроза падения). Д К07 06. Промерзание, сверхнормативные теплопотери, конденсат Норма: п. 5.7. Категория: ОР (энергоэффективность), не путать с механической безопасностью. К 08. Полы, проёмы, перегородки Д К08 01. Просадка и разрушение полов, стяжек Причины: просадка основания, протечки, коррозия балок. Категория: ОР. Д К08 02. Трещины перегородок Категория: ОР (эксплуатационный дефект). Д К08 03. Перекос оконных и дверных блоков Причины: осадка, деформации стен. Категория: ОР. Д К08 04. Разрушение откосов, отливов Следствие: замачивание стен. Категория: ОР. К 09. Инженерные системы Д К09 01. Затопление подвала, отсутствие вентиляции Причины: неисправность сетей, отсутствие водоотвода, засорение. Следствие: коррозия металла и гниль дерева — главные причины аварийных перекрытий в архиве. Норма: п. 5.4, 5.4.8. Категория: фактор, усиливающий дефекты К 03. Д К09 02. Разрушение трубопроводов, протечки Норма: пп. 5.4.1—5.4.7. Категория: ОР системы. К 10. Аварийные ситуации Д К10 01. Прогрессирующее обрушение Признаки: цепное разрушение элементов, потеря устойчивости, обрушение участков. Норма: п. 4.3 (обследование после аварий), 4.5, 4.6. Действия: немедленное информирование, ограждение, противоаварийные мероприятия, мониторинг. Д К10 02. Исчерпание несущей способности Признаки: «сортамент определить невозможно», сквозная коррозия 100 %, разрывы арматуры, выпучивание сжатой арматуры, наклонные трещины со смещением. Категория: А . Норма: п. 3.1; приложения В—Д. БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ» Дефект Категория Норма Наклонные трещины со смещением бетона А В, 1.8 Выпучивание сжатой арматуры А В, 1.11 Уменьшение площадок опирания А В, 1.12 Разрыв/смещение поперечной арматуры А В, 1.13 Отрыв анкеров, расстройство стыков А В, 1.14 Трещины вдоль арматуры 3 мм на опоре А В, 1.4 Отслоение защитного слоя на опоре А В, 1.5 Прогиб плит 1/150 А (расчёт) В, 1.9 Вертикальные трещины кладки 0,1—0,5 мм, ≥ 2 на 1 м ОР В, 2.10 Выпучивание стены ОР В, 2.2 Отклонение стены от вертикали ОР В, 2.3 Трещины в перемычках ОР В, 2.11 Трещины под опорами ОР В, 2.13 Сквозная коррозия балок А практика Поверхностная коррозия ОР Г Искривления металла сверх допустимых А (расчёт) Г Зазоры фрикционных соединений группы 1 А Г Зазоры фрикционных соединений групп 2—4 ОР Г Хрупкие/усталостные трещины металла А Г Отсутствие наката, потеря целостности А Д Гниль с потерей сечения ОР → А Д Зыбкость облицовки фасада А для участка 5.3.5.4 "}, {"id": "methods", "file": "05_Методики_обследования/МЕТОДИКИ.md", "title": "МЕТОДИКИ ОБСЛЕДОВАНИЯ", "section": "05_Методики_обследования", "html": "<h1>МЕТОДИКИ ОБСЛЕДОВАНИЯ</h1><blockquote><p>Как обследовать: этапы, методы, приборы, объёмы, что фиксировать. Основа — ГОСТ 31937-2024, разделы 5.1—5.7; практика архива ТЗ и последних экспертиз. Категории и пороги — в <code>06_Оценка_состояния</code>, дефекты — в <code>04_Дефекты</code>.</p></blockquote><hr><h2 id=\"s1\">1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2)</h2><ol><li><strong>Подготовка</strong> (5.1.6—5.1.8): сбор документации, программа работ, приборы, доступы.</li><li><strong>Предварительное (визуальное) обследование</strong> (5.1.9—5.1.12): сплошной осмотр,</li></ol><p>ведомость дефектов, фотофиксация, проверка деформаций, предварительная категория.</p><ol><li><strong>Детальное (инструментальное) обследование</strong> (5.1.13 и далее): обмеры, прочность</li></ol><p>материалов, армирование, прогибы, вскрытия, лабораторные испытания.</p><ol><li><strong>Поверочные расчёты</strong> (при необходимости): по фактическим данным (п. 3.20).</li><li><strong>Оценка категорий</strong> (4.5) и оформление заключения (приложения А, Б).</li></ol><p><strong>Когда детальное не проводится (5.1.11):</strong> визуально установлено нормативное или работоспособное состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования хватает для решения задач ТЗ.</p><p><strong>Когда детальное обязательно:</strong> выявлено ограниченно-работоспособное состояние и нужна оценка несущей способности; нужны исходные данные для проекта; оценка влияния нового строительства; характерные трещины и перекосы, указывающие на просадку основания (тогда ещё и дополнительные инженерно-геологические изыскания — 5.1.12).</p><hr><h2 id=\"s2\">2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ</h2><p><strong>Документы (5.1.7):</strong> поэтажные планы, технический паспорт, акты осмотров и ведомости дефектов эксплуатирующей организации, отчёты предыдущих обследований, проектная и исполнительная документация, сведения о перестройках и ремонтах, геоподоснова, материалы изысканий, протокол доступа, документы о вводах сетей.</p><p><strong>Установить по документам (5.1.8):</strong> автор и год проекта, конструктивную схему, применённые конструкции, монтажные схемы, время возведения, геометрию, расчётную схему, проектные нагрузки, характеристики материалов, паспорта изделий, характеристики грунтов, замены и отклонения от проекта, внешние воздействия, дефекты.</p><p><strong>Программа работ (5.1.8 б):</strong> перечень конструкций; перечень инженерного оборудования; места и методы инструментальных измерений; места вскрытий и отбора проб; необходимость изысканий; перечень поверочных расчётов.</p><hr><h2 id=\"s3\">3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ</h2><h3 id=\"s4\">3.1 Порядок</h3><ol><li>Обход здания, фотофиксация фасадов и общих видов.</li><li>Осмотр помещений по этажам и по зонам, привязка к осям и отметкам.</li><li>Сплошной осмотр конструкций: стены, перекрытия, лестницы, балконы, кровля.</li><li>Проверка деформаций: прогибы, крены, перекосы, разломы, неравномерные осадки.</li><li>Замеры дефектов: ширина раскрытия трещин, протяжённость, площади поражения.</li><li>Ведомость дефектов + схемы + фото.</li></ol><h3 id=\"s5\">3.2 Инструменты визуального этапа</h3><p>Щупы калиброванные, лупа измерительная ЛИ-3-10х, рулетка, линейка стальная, отвес, уровень, фотоаппарат. Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование (5.1.9).</p><h3 id=\"s6\">3.3 Что фиксировать (5.1.10)</h3><p>Схемы и ведомости дефектов (место, характер, параметры); описания и фото дефектных участков; результаты проверки деформаций; аварийные участки; уточнённую конструктивную схему; схему мест вскрытий; описание территории и водоотвода; оценку подпора в каналах; предварительную категорию; отчёт.</p><hr><h2 id=\"s7\">4. ОБМЕРНЫЕ РАБОТЫ</h2><ul><li>Пролёты в свету, шаг балок, сечения, толщины, отметки, высоты этажей.</li><li>Привязка к осям и отметкам, «уровень земли принять за 0.000».</li><li>Для металла: сечение по факту, с учётом коррозии (редуцированное сечение, 5.3.3.12).</li><li>Для кладки: толщина стен, тип кладки, размеры изделий.</li><li>Для ж.-б.: защитный слой, диаметр и шаг арматуры.</li><li>Инструмент: рулетка 5 м, штангенциркуль (WDK-MC20005), линейка, лазерный дальномер,</li></ul><p>нивелир/тахеометр для прогибов и кренов.</p><hr><h2 id=\"s8\">5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ</h2><h3 id=\"s9\">5.1 Бетон (5.3.1.5—5.3.1.8)</h3><ul><li>Методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570.</li><li>Предварительно — экспертный метод: молоток Физделя, ультразвуковое прозвучивание.</li><li>Участки: наименьшей прочности; в зонах, определяющих несущую способность; в местах</li></ul><p>дефектов.</p><ul><li><strong>Число участков не менее:</strong> 3 — зона/средняя прочность; 6 — средняя прочность</li></ul><p>и коэффициент изменчивости; 9 — группа однотипных конструкций.</p><ul><li><strong>Число конструкций — не менее трёх.</strong></li><li>Дополнительно: плотность, влажность, водопоглощение, пористость, водонепроницаемость —</li></ul><p>ГОСТ 12730.0—12730.5; морозостойкость — ГОСТ 10060; щёлочность — ГОСТ 5382.</p><h3 id=\"s10\">5.2 Арматура (5.3.1.10—5.3.1.13)</h3><ul><li>Магнитный метод (ГОСТ 22904), радиационный (ГОСТ 17625), вскрытие, георадиолокация,</li></ul><p>ультразвук.</p><ul><li><strong>Число конструкций — не менее трёх.</strong></li><li>Прочность: образцы по ГОСТ 12004, <strong>не менее трёх стержней</strong> одного диаметра и профиля.</li><li>По рисунку профиля — <strong>не менее пяти участков</strong>.</li><li>Обязательно устанавливать год проектирования и постройки (нормативные сопротивления</li></ul><p>менялись).</p><h3 id=\"s11\">5.3 Кирпич и раствор (5.3.2.2—5.3.2.4)</h3><ul><li>Лабораторные испытания образцов из кладки.</li><li>Для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной</li></ul><p>зависимости (ГОСТ 22690).</p><ul><li>Комплексное обследование: ГОСТ 8462 (в РФ ГОСТ Р 58527-2019), ГОСТ 5802, ГОСТ 24992;</li></ul><p>керны бетона — ГОСТ 28570; бут — ГОСТ 4001.</p><ul><li>Места с пластинчатой деструкцией для испытаний непригодны.</li></ul><h3 id=\"s12\">5.4 Сталь (5.3.3.4—5.3.3.11)</h3><ul><li>Химсостав: фотоэлектрический или атомно-эмиссионный анализ (ГОСТ 18895 / ГОСТ Р 54153-2010).</li><li>Механика: ГОСТ 1497, ГОСТ 9454, ГОСТ 28870.</li><li>Крепёж: ГОСТ ISO 898-1, 898-2, ГОСТ 11371, ГОСТ 32484.1—32484.6.</li><li><strong>Запрещено</strong> определять σт и σв по твёрдости (5.3.3.10).</li><li><strong>Запрещено</strong> применять портативные РФА там, где нет точности по C, S, P (5.3.3.11).</li><li>Пробы — на участках, не влияющих на безопасность; иначе разгрузка или страховочные опоры.</li></ul><h3 id=\"s13\">5.5 Древесина (5.3.4.2—5.3.4.5)</h3><ul><li>Влажность — ГОСТ 16483.7, 16588; плотность — ГОСТ 16483.1.</li><li>Биостойкость — ГОСТ 18610; защищённость — ГОСТ 20022.0.</li><li>Прочность: сжатие вдоль — 16483.10, поперёк — 16483.11, изгиб — 16483.3, модуль —</li></ul><p>16483.9, смятие — 16483.2, скалывание — 16483.5, 16483.12.</p><ul><li>Влажность и температура в полостях — термометры, психрометры; воздухообмен — анемометры.</li></ul><hr><h2 id=\"s14\">6. КОРРОЗИЯ МЕТАЛЛА</h2><ul><li>Толщину измерять <strong>не менее чем в трёх наиболее повреждённых сечениях</strong> по длине элемента,</li></ul><p>в каждом — <strong>не менее трёх измерений</strong> (5.3.3.13).</p><ul><li>Назначать редуцированные сечения (5.3.3.12).</li><li>Фиксировать: вид коррозии (сплошная, язвенная, точечная, щелевая), площадь, глубину,</li></ul><p>остаточное сечение.</p><ul><li>Приборы: толщиномер ультразвуковой (например, А 1207), штангенциркуль, линейка.</li><li>Оценка процента поражения — для заключения, но решающий критерий — остаточное сечение</li></ul><p>и несущая способность.</p><hr><h2 id=\"s15\">7. ВСКРЫТИЯ</h2><p><strong>Цель:</strong> установить сечения, армирование, состояние заделки, узлы, наличие гидроизоляции.</p><p><strong>Места:</strong></p><ul><li>балконы и эркеры — по расчётной схеме (5.3.6.2);</li><li>лестницы — заделка площадок в стены, опоры маршей, заделка балок (5.3.6.4);</li><li>перекрытия — у опор, в пролёте, в местах протечек;</li><li>стены — зондирование кладки, отбор проб из слоёв (5.3.2.1);</li><li>фасады — подоблицовочное пространство (5.3.5.6).</li></ul><p><strong>Правило:</strong> вскрытия не должны снижать несущую способность; после — восстановление отделки (по согласованию с заказчиком).</p><hr><h2 id=\"s16\">8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ</h2><ul><li>Прогибы — геометрическое и гидростатическое нивелирование; допускается тригонометрическое</li></ul><p>нивелирование электронными тахеометрами (5.3.1.20).</p><ul><li>Крены — геодезические методы, отвесы, лазерные уровни.</li><li>Осадки — по ГОСТ 24846 (мониторинг).</li><li>Фиксировать: схему измерений, точки, дату, температуру, результат в мм и в долях пролёта.</li></ul><hr><h2 id=\"s17\">9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ</h2><ul><li>Статические испытания — при необходимости подтверждения несущей способности (5.3.1.23).</li><li>Испытания анкеров фасадов — натурные, по ГОСТ Р 56731-2023, ГОСТ Р 58387-2019,</li></ul><p>ГОСТ Р 58430-2019 (5.3.5.10).</p><ul><li>Вибрационные обследования — при динамических нагрузках (5.2.16—5.2.17), ГОСТ Р 52892-2007.</li><li>Тепловизионная съёмка — теплотехника (5.7).</li><li>Акустические измерения — звукоизоляция и шум (5.6).</li></ul><hr><h2 id=\"s18\">10. ПОВЕРОЧНЫЕ РАСЧЁТЫ</h2><p><strong>Когда:</strong> ограниченно-работоспособное состояние; необходимость оценки несущей способности; проектирование усиления; изменение нагрузок; оценка влияния нового строительства.</p><p><strong>Исходные данные (п. 3.20):</strong> фактические геометрия и сечения; фактическая прочность материалов; фактические нагрузки; уточнённая расчётная схема с учётом дефектов.</p><p><strong>Что считать:</strong> изгиб, срез, устойчивость, прогиб, узлы опирания, анкеровка, кладка на внецентренное сжатие, сварные и болтовые соединения.</p><p><strong>Оформление:</strong> методы, формулы, исходные данные, результат, вывод о достаточности или недостаточности несущей способности, ссылка на СП.</p><p><strong>Важно:</strong> при полном разрушении элемента расчёт не выполняется — фиксируется исчерпание несущей способности (практика архива).</p><hr><h2 id=\"s19\">11. ФОТОФИКСАЦИЯ</h2><ul><li>Общие виды объекта, фасады, зоны обследования.</li><li>Каждый дефект — общий план + крупный план с масштабной линейкой.</li><li>Привязка фото к осям/помещениям.</li><li>Нумерация фото в соответствии с дефектной ведомостью.</li><li>Формат: JPEG, разрешение не ниже 1920×1080, без обработки, дата в метаданных.</li></ul><hr><h2 id=\"s20\">12. ДЕФЕКТНАЯ ВЕДОМОСТЬ</h2><p><strong>Колонки:</strong> № | элемент (оси, отметка) | вид дефекта | параметры (мм, %, м) | причина | категория состояния | ссылка на норму | № фото.</p><p><strong>Правила:</strong></p><ul><li>каждая строка — один дефект;</li><li>параметры — измеримые, не «сильная коррозия», а «сквозная коррозия, поражение сечения</li></ul><p>до 100 %»;</p><ul><li>причина — из диагностической таблицы (Д-К02-06…09 и др.);</li><li>категория — только из четырёх по ГОСТ;</li><li>фото — обязательна.</li></ul><hr><h2 id=\"s21\">13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива)</h2><div class=\"tablewrap\"><table><thead><tr><th>Прибор</th><th>Назначение</th><th>Поверка</th></tr></thead><tbody><tr><td>Рулетка 5 м</td><td>размеры конструкций</td><td>да</td></tr><tr><td>Штангенциркуль WDK-MC20005</td><td>толщина, сечения</td><td>да</td></tr><tr><td>Толщиномер ультразвуковой А 1207</td><td>толщина металла</td><td>да</td></tr><tr><td>Лупа ЛИ-3-10х</td><td>ширина трещин</td><td>да</td></tr><tr><td>Линейка стальная</td><td>геометрия</td><td>да</td></tr><tr><td>Цифровая фотокамера Canon EOS</td><td>фотофиксация</td><td>—</td></tr><tr><td>Молоток, зубило</td><td>вскрытие отделки</td><td>—</td></tr><tr><td>Влагомер</td><td>влажность древесины</td><td>да</td></tr><tr><td>Склерометр / молоток Кашкарова</td><td>прочность бетона</td><td>да</td></tr><tr><td>Нивелир / тахеометр</td><td>прогибы, крены</td><td>да</td></tr></tbody></table></div><p><strong>Требование (4.10):</strong> все средства измерений — с метрологическим обеспечением, поверены; новые типы — аттестованы, методика согласована в программе работ.</p><hr><h2 id=\"s22\">14. ОХРАНА ТРУДА (раздел 7)</h2><ul><li>Работы — по ВСН 48-86(р), СНиП 12-03-2001, СНиП 12-04-2002 (в РФ).</li><li>Каски (ГОСТ 12.4.087), страховочные канаты (ГОСТ 12.4.107).</li><li>Работа в подвалах — контроль воздушной среды, освещение, страховка.</li><li>Вскрытия — с проверкой скрытых коммуникаций.</li><li>Аварийные зоны — ограждение, запрет доступа.</li></ul>", "toc": [["s1", "1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2)", 2], ["s2", "2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ", 2], ["s3", "3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ", 2], ["s4", "3.1 Порядок", 3], ["s5", "3.2 Инструменты визуального этапа", 3], ["s6", "3.3 Что фиксировать (5.1.10)", 3], ["s7", "4. ОБМЕРНЫЕ РАБОТЫ", 2], ["s8", "5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ", 2], ["s9", "5.1 Бетон (5.3.1.5—5.3.1.8)", 3], ["s10", "5.2 Арматура (5.3.1.10—5.3.1.13)", 3], ["s11", "5.3 Кирпич и раствор (5.3.2.2—5.3.2.4)", 3], ["s12", "5.4 Сталь (5.3.3.4—5.3.3.11)", 3], ["s13", "5.5 Древесина (5.3.4.2—5.3.4.5)", 3], ["s14", "6. КОРРОЗИЯ МЕТАЛЛА", 2], ["s15", "7. ВСКРЫТИЯ", 2], ["s16", "8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ", 2], ["s17", "9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ", 2], ["s18", "10. ПОВЕРОЧНЫЕ РАСЧЁТЫ", 2], ["s19", "11. ФОТОФИКСАЦИЯ", 2], ["s20", "12. ДЕФЕКТНАЯ ВЕДОМОСТЬ", 2], ["s21", "13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива)", 2], ["s22", "14. ОХРАНА ТРУДА (раздел 7)", 2]], "chars": 10738, "plain": " МЕТОДИКИ ОБСЛЕДОВАНИЯ Как обследовать: этапы, методы, приборы, объёмы, что фиксировать. Основа — ГОСТ 31937 2024, разделы 5.1—5.7; практика архива ТЗ и последних экспертиз. Категории и пороги — в 06 Оценка состояния , дефекты — в 04 Дефекты . 1. ОБЩАЯ ПОСЛЕДОВАТЕЛЬНОСТЬ (п. 5.1.2) 1. Подготовка (5.1.6—5.1.8): сбор документации, программа работ, приборы, доступы. 2. Предварительное (визуальное) обследование (5.1.9—5.1.12): сплошной осмотр, ведомость дефектов, фотофиксация, проверка деформаций, предварительная категория. 3. Детальное (инструментальное) обследование (5.1.13 и далее): обмеры, прочность материалов, армирование, прогибы, вскрытия, лабораторные испытания. 4. Поверочные расчёты (при необходимости): по фактическим данным (п. 3.20). 5. Оценка категорий (4.5) и оформление заключения (приложения А, Б). Когда детальное не проводится (5.1.11): визуально установлено нормативное или работоспособное состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования хватает для решения задач ТЗ. Когда детальное обязательно: выявлено ограниченно работоспособное состояние и нужна оценка несущей способности; нужны исходные данные для проекта; оценка влияния нового строительства; характерные трещины и перекосы, указывающие на просадку основания (тогда ещё и дополнительные инженерно геологические изыскания — 5.1.12). 2. ПОДГОТОВКА: ЧТО ЗАПРОСИТЬ И ПРОВЕРИТЬ Документы (5.1.7): поэтажные планы, технический паспорт, акты осмотров и ведомости дефектов эксплуатирующей организации, отчёты предыдущих обследований, проектная и исполнительная документация, сведения о перестройках и ремонтах, геоподоснова, материалы изысканий, протокол доступа, документы о вводах сетей. Установить по документам (5.1.8): автор и год проекта, конструктивную схему, применённые конструкции, монтажные схемы, время возведения, геометрию, расчётную схему, проектные нагрузки, характеристики материалов, паспорта изделий, характеристики грунтов, замены и отклонения от проекта, внешние воздействия, дефекты. Программа работ (5.1.8 б): перечень конструкций; перечень инженерного оборудования; места и методы инструментальных измерений; места вскрытий и отбора проб; необходимость изысканий; перечень поверочных расчётов. 3. ВИЗУАЛЬНОЕ ОБСЛЕДОВАНИЕ 3.1 Порядок 1. Обход здания, фотофиксация фасадов и общих видов. 2. Осмотр помещений по этажам и по зонам, привязка к осям и отметкам. 3. Сплошной осмотр конструкций: стены, перекрытия, лестницы, балконы, кровля. 4. Проверка деформаций: прогибы, крены, перекосы, разломы, неравномерные осадки. 5. Замеры дефектов: ширина раскрытия трещин, протяжённость, площади поражения. 6. Ведомость дефектов + схемы + фото. 3.2 Инструменты визуального этапа Щупы калиброванные, лупа измерительная ЛИ 3 10х, рулетка, линейка стальная, отвес, уровень, фотоаппарат. Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование (5.1.9). 3.3 Что фиксировать (5.1.10) Схемы и ведомости дефектов (место, характер, параметры); описания и фото дефектных участков; результаты проверки деформаций; аварийные участки; уточнённую конструктивную схему; схему мест вскрытий; описание территории и водоотвода; оценку подпора в каналах; предварительную категорию; отчёт. 4. ОБМЕРНЫЕ РАБОТЫ Пролёты в свету, шаг балок, сечения, толщины, отметки, высоты этажей. Привязка к осям и отметкам, «уровень земли принять за 0.000». Для металла: сечение по факту, с учётом коррозии (редуцированное сечение, 5.3.3.12). Для кладки: толщина стен, тип кладки, размеры изделий. Для ж. б.: защитный слой, диаметр и шаг арматуры. Инструмент: рулетка 5 м, штангенциркуль (WDK MC20005), линейка, лазерный дальномер, нивелир/тахеометр для прогибов и кренов. 5. ОПРЕДЕЛЕНИЕ ПРОЧНОСТИ МАТЕРИАЛОВ 5.1 Бетон (5.3.1.5—5.3.1.8) Методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570. Предварительно — экспертный метод: молоток Физделя, ультразвуковое прозвучивание. Участки: наименьшей прочности; в зонах, определяющих несущую способность; в местах дефектов. Число участков не менее: 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций. Число конструкций — не менее трёх. Дополнительно: плотность, влажность, водопоглощение, пористость, водонепроницаемость — ГОСТ 12730.0—12730.5; морозостойкость — ГОСТ 10060; щёлочность — ГОСТ 5382. 5.2 Арматура (5.3.1.10—5.3.1.13) Магнитный метод (ГОСТ 22904), радиационный (ГОСТ 17625), вскрытие, георадиолокация, ультразвук. Число конструкций — не менее трёх. Прочность: образцы по ГОСТ 12004, не менее трёх стержней одного диаметра и профиля. По рисунку профиля — не менее пяти участков . Обязательно устанавливать год проектирования и постройки (нормативные сопротивления менялись). 5.3 Кирпич и раствор (5.3.2.2—5.3.2.4) Лабораторные испытания образцов из кладки. Для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690). Комплексное обследование: ГОСТ 8462 (в РФ ГОСТ Р 58527 2019), ГОСТ 5802, ГОСТ 24992; керны бетона — ГОСТ 28570; бут — ГОСТ 4001. Места с пластинчатой деструкцией для испытаний непригодны. 5.4 Сталь (5.3.3.4—5.3.3.11) Химсостав: фотоэлектрический или атомно эмиссионный анализ (ГОСТ 18895 / ГОСТ Р 54153 2010). Механика: ГОСТ 1497, ГОСТ 9454, ГОСТ 28870. Крепёж: ГОСТ ISO 898 1, 898 2, ГОСТ 11371, ГОСТ 32484.1—32484.6. Запрещено определять σт и σв по твёрдости (5.3.3.10). Запрещено применять портативные РФА там, где нет точности по C, S, P (5.3.3.11). Пробы — на участках, не влияющих на безопасность; иначе разгрузка или страховочные опоры. 5.5 Древесина (5.3.4.2—5.3.4.5) Влажность — ГОСТ 16483.7, 16588; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610; защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль — 16483.10, поперёк — 16483.11, изгиб — 16483.3, модуль — 16483.9, смятие — 16483.2, скалывание — 16483.5, 16483.12. Влажность и температура в полостях — термометры, психрометры; воздухообмен — анемометры. 6. КОРРОЗИЯ МЕТАЛЛА Толщину измерять не менее чем в трёх наиболее повреждённых сечениях по длине элемента, в каждом — не менее трёх измерений (5.3.3.13). Назначать редуцированные сечения (5.3.3.12). Фиксировать: вид коррозии (сплошная, язвенная, точечная, щелевая), площадь, глубину, остаточное сечение. Приборы: толщиномер ультразвуковой (например, А 1207), штангенциркуль, линейка. Оценка процента поражения — для заключения, но решающий критерий — остаточное сечение и несущая способность. 7. ВСКРЫТИЯ Цель: установить сечения, армирование, состояние заделки, узлы, наличие гидроизоляции. Места: балконы и эркеры — по расчётной схеме (5.3.6.2); лестницы — заделка площадок в стены, опоры маршей, заделка балок (5.3.6.4); перекрытия — у опор, в пролёте, в местах протечек; стены — зондирование кладки, отбор проб из слоёв (5.3.2.1); фасады — подоблицовочное пространство (5.3.5.6). Правило: вскрытия не должны снижать несущую способность; после — восстановление отделки (по согласованию с заказчиком). 8. ГЕОДЕЗИЯ: ПРОГИБЫ, КРЕНЫ, ОСАДКИ Прогибы — геометрическое и гидростатическое нивелирование; допускается тригонометрическое нивелирование электронными тахеометрами (5.3.1.20). Крены — геодезические методы, отвесы, лазерные уровни. Осадки — по ГОСТ 24846 (мониторинг). Фиксировать: схему измерений, точки, дату, температуру, результат в мм и в долях пролёта. 9. ИНСТРУМЕНТАЛЬНЫЕ ИСПЫТАНИЯ КОНСТРУКЦИЙ Статические испытания — при необходимости подтверждения несущей способности (5.3.1.23). Испытания анкеров фасадов — натурные, по ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019 (5.3.5.10). Вибрационные обследования — при динамических нагрузках (5.2.16—5.2.17), ГОСТ Р 52892 2007. Тепловизионная съёмка — теплотехника (5.7). Акустические измерения — звукоизоляция и шум (5.6). 10. ПОВЕРОЧНЫЕ РАСЧЁТЫ Когда: ограниченно работоспособное состояние; необходимость оценки несущей способности; проектирование усиления; изменение нагрузок; оценка влияния нового строительства. Исходные данные (п. 3.20): фактические геометрия и сечения; фактическая прочность материалов; фактические нагрузки; уточнённая расчётная схема с учётом дефектов. Что считать: изгиб, срез, устойчивость, прогиб, узлы опирания, анкеровка, кладка на внецентренное сжатие, сварные и болтовые соединения. Оформление: методы, формулы, исходные данные, результат, вывод о достаточности или недостаточности несущей способности, ссылка на СП. Важно: при полном разрушении элемента расчёт не выполняется — фиксируется исчерпание несущей способности (практика архива). 11. ФОТОФИКСАЦИЯ Общие виды объекта, фасады, зоны обследования. Каждый дефект — общий план + крупный план с масштабной линейкой. Привязка фото к осям/помещениям. Нумерация фото в соответствии с дефектной ведомостью. Формат: JPEG, разрешение не ниже 1920×1080, без обработки, дата в метаданных. 12. ДЕФЕКТНАЯ ВЕДОМОСТЬ Колонки: № элемент (оси, отметка) вид дефекта параметры (мм, %, м) причина категория состояния ссылка на норму № фото. Правила: каждая строка — один дефект; параметры — измеримые, не «сильная коррозия», а «сквозная коррозия, поражение сечения до 100 %»; причина — из диагностической таблицы (Д К02 06…09 и др.); категория — только из четырёх по ГОСТ; фото — обязательна. 13. ПРИБОРЫ: ТИПОВОЙ КОМПЛЕКТ (из архива) Прибор Назначение Поверка Рулетка 5 м размеры конструкций да Штангенциркуль WDK MC20005 толщина, сечения да Толщиномер ультразвуковой А 1207 толщина металла да Лупа ЛИ 3 10х ширина трещин да Линейка стальная геометрия да Цифровая фотокамера Canon EOS фотофиксация — Молоток, зубило вскрытие отделки — Влагомер влажность древесины да Склерометр / молоток Кашкарова прочность бетона да Нивелир / тахеометр прогибы, крены да Требование (4.10): все средства измерений — с метрологическим обеспечением, поверены; новые типы — аттестованы, методика согласована в программе работ. 14. ОХРАНА ТРУДА (раздел 7) Работы — по ВСН 48 86(р), СНиП 12 03 2001, СНиП 12 04 2002 (в РФ). Каски (ГОСТ 12.4.087), страховочные канаты (ГОСТ 12.4.107). Работа в подвалах — контроль воздушной среды, освещение, страховка. Вскрытия — с проверкой скрытых коммуникаций. Аварийные зоны — ограждение, запрет доступа. "}, {"id": "criteria", "file": "06_Оценка_состояния/КРИТЕРИИ_ОЦЕНКИ.md", "title": "КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ", "section": "06_Оценка_состояния", "html": "<h1>КРИТЕРИИ ОЦЕНКИ ТЕХНИЧЕСКОГО СОСТОЯНИЯ</h1><blockquote><p>Четыре категории, их признаки, пороги и что делать дальше. Основа — ГОСТ 31937-2024, пп. 3.1, 3.15, 3.18, 3.21, 4.5, приложения В—Д. Дефекты — в <code>04_Дефекты</code>, формулировки — в <code>07_Шаблоны</code>.</p></blockquote><hr><h2 id=\"s1\">1. ЧЕТЫРЕ КАТЕГОРИИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Категория</th><th>Определение (сжато)</th><th>Норма</th><th>Режим эксплуатации</th></tr></thead><tbody><tr><td><strong>Нормативное</strong></td><td>Все параметры соответствуют проекту и действующим нормам на момент обследования</td><td>п. 3.15</td><td>Без ограничений</td></tr><tr><td><strong>Работоспособное</strong></td><td>Часть параметров не отвечает проекту/нормам, но нарушения не мешают работоспособности; несущая способность и механическая безопасность обеспечены</td><td>п. 3.21</td><td>Без ограничений</td></tr><tr><td><strong>Ограниченно-работоспособное</strong></td><td>Есть крены, дефекты и повреждения, снизивш
