 1.6 Ширина раскрытия трещин ж. б. (А300—А600) 0,4 мм прил. В, 1.6 Ширина раскрытия трещин ж. б. (прочие) 0,3 мм прил. В, 1.6 Трещины вдоль арматуры 3 мм (на опоре — аварийное) прил. В, 1.4 Прогиб плит перекрытий 1/150 прил. В, 1.9 Прогиб преднапряжённых балок 1/300 прил. В, 1.9 Прогиб преднапряжённых ферм 1/700 прил. В, 1.9 Трещины кладки (вертикальные) 0,1—0,5 мм; ≥ 2 на 1 м прил. В, 2.10 Срок первого обследования ≤ 2 лет после ввода 4.2 Периодичность обследования 10 лет; 5 лет — неблагоприятные условия 4.2 Число участков испытания бетона 3 / 6 / 9 5.3.1.8 Число конструкций при оценке бетона не менее 3 5.3.1.8 Число конструкций при оценке армирования не менее 3 5.3.1.10 Число стержней для испытаний не менее 3 5.3.1.11 Число участков по рисунку профиля не менее 5 5.3.1.12 Сечения при измерении коррозии не менее 3 по длине, по 3 измерения 5.3.3.13 4. СРОКИ СЛУЖБЫ (ориентировочно, для оценки «длительной эксплуатации») Конструкция Ориентировочный срок Металлические балки перекрытия без защиты от коррозии 30—50 лет до существенного поражения Деревянные перекрытия при нормальном режиме 50—80 лет; при протечках — 10—20 Кирпичная кладка 100—150 лет (при отсутствии замачивания) Штукатурный фасад 20—30 лет Кровля из наплавляемых материалов 10—15 лет Гидроизоляция подвала 20—30 лет Ориентировочные значения для формулировки «длительный срок эксплуатации»; точные нормативы в заключении не обязательны, достаточно факта превышения срока службы. 5. ПРИБОРЫ И ИХ ПРИМЕНЕНИЕ Прибор Что измеряет Метод Норма Молоток Физделя прочность бетона пластическая деформация экспертный, предварительный Склерометр (Кашкарова, Шмидта) прочность бетона отскок/внедрение ГОСТ 22690 Ультразвуковой прибор (ПУЛЬСАР и др.) прочность бетона скорость распространения ГОСТ 17624 Толщиномер А 1207 толщина металла ультразвук поверка Магнитный искатель (например, ИПА) защитный слой, диаметр арматуры магнитный ГОСТ 22904 Влагомер влажность древесины резистивный/диэлектрический ГОСТ 16483.7 Лупа ЛИ 3 10х ширина трещин визуальный — Щупы калиброванные ширина трещин визуальный — Нивелир/тахеометр прогибы, крены, осадки геометрическое нивелирование ГОСТ 24846 Тепловизор теплопотери, мостики холода инфракрасный ГОСТ 26629 (уточнить) 6. ТИПОВЫЕ КОНСТРУКТИВНЫЕ РЕШЕНИЯ ИЗ АРХИВА 6.1 Перекрытие по металлическим балкам Балки — двутавр (ОСТ 16 1926), шаг 850—1100 мм, пролёт 1,6—4,25 м. Опирание — на кирпичные стены (заделка) и металлические перемычки. Межбалочное заполнение — бетон на кирпичном бое, сводики, деревянные щиты. Покрытие — цементно песчаная стяжка, метлахская плитка, асфальтобетон, дощатый настил. Типовые дефекты — сквозная коррозия, разрушение заделки, прогибы. 6.2 Лестницы Площадки — по металлическим балкам, заделанным в стены. Марши — по двум металлическим косоурам, ступени сборные каменные. Встречаются бескосоурные консольные каменные ступени. Типовые дефекты — коррозия косоуров, разрушение заделки, износ ступеней, утрата маршей. 6.3 Балконы и эркеры Плиты по металлическим консольным балкам, заделанным в кладку. Ограждение — металл, бетон, дерево. Типовые дефекты — коррозия консольных балок, разрушение плиты, потеря заделки, отсутствие гидроизоляции. 6.4 Кирпичные стены Толщина 760—880 мм (историческая застройка), кладка из красного глиняного кирпича на известково песчаном растворе. Перемычки — металлические двутавровые, клинчатые, арочные. Типовые дефекты — трещины от осадок, увлажнение, деструкция, выпучивание. 7. ФОРМАТЫ ШИФРОВ И ОБОЗНАЧЕНИЙ Шифр работы: 06/1 08 2026 АВР — <номер /<месяц <год АВР . Разделы: .../С — содержание, .../ТЗ — техзадание. Оси: 1 5/А Г ; отметки: 0.000 , +0.660 , 1.480 . Помещения: кв. № 24 , пом. 2 Н , 3 Н , ЛК № 1 . 8. ПОЛЕЗНЫЕ ССЫЛКИ НА ВНУТРЕННИЕ РАЗДЕЛЫ Вопрос Раздел Что означает термин 02 Термины\\ТЕЗАУРУС.md Что проверять в элементе 03 Конструктив\\ИНДЕКС КОНСТРУКТИВА.md Какой дефект и какая категория 04 Дефекты\\КАТАЛОГ ДЕФЕКТОВ.md Как измерять 05 Методики обследования\\МЕТОДИКИ.md Какую категорию ставить 06 Оценка состояния\\КРИТЕРИИ ОЦЕНКИ.md Как написать 07 Шаблоны заключений\\ШАБЛОНЫ.md Как обосновать 08 Обоснования\\ОБОСНОВАНИЯ.md "}, {"id": "monitoring", "file": "11_Мониторинг/МОНИТОРИНГ.md", "title": "МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ", "section": "11_Мониторинг", "html": "<h1>МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ</h1><blockquote><p>Раздел 6 ГОСТ 31937-2024 и обязательные формы приложений Ж, И, К, Л, М. Когда мониторинг обязателен, что измерять, как оформлять этап. Связано: <code>06_Оценка_состояния</code>, <code>07_Шаблоны_заключений</code>, <code>04_Дефекты</code>.</p></blockquote><hr><h2 id=\"s1\">1. КОГДА МОНИТОРИНГ НУЖЕН</h2><div class=\"tablewrap\"><table><thead><tr><th>Ситуация</th><th>Вид мониторинга</th><th>Норма</th></tr></thead><tbody><tr><td>Объект в ограниченно-работоспособном или аварийном состоянии</td><td>Мониторинг ограниченно-работоспособных и аварийных</td><td>п. 6.3, 4.5</td></tr><tr><td>Объект в зоне влияния нового строительства, реконструкции, природно-техногенных воздействий</td><td>Мониторинг зоны влияния</td><td>п. 6.4</td></tr><tr><td>Уникальные (высотные, большепролётные) здания</td><td>Мониторинг уникальных</td><td>п. 6.5</td></tr><tr><td>Значительные изменения НДС или крена, требуется обследование</td><td>Общий мониторинг</td><td>п. 6.2</td></tr><tr><td>Ликвидация последствий аварии, угроза прогрессирующего обрушения</td><td>Мониторинг до приведения в работоспособное состояние</td><td>п. 4.5</td></tr></tbody></table></div><p><strong>Ключевое правило (п. 4.5):</strong> при аварийном состоянии эксплуатация не допускается, а обязательный режим мониторинга устанавливается <strong>до приведения конструкций в работоспособное состояние</strong>.</p><hr><h2 id=\"s2\">2. ОБЩИЕ ТРЕБОВАНИЯ (6.1)</h2><ol><li><strong>Программа мониторинга</strong> разрабатывается под задачи; в ней определяют состав, объём,</li></ol><p>периодичность, средства измерений (6.1.2).</p><ol><li><strong>Выбор системы наблюдений</strong> — по цели мониторинга, виду объекта, характеру воздействий</li></ol><p>(6.1.3).</p><ol><li><strong>Достаточность</strong> — методика и объём измерений должны обеспечивать достоверность</li></ol><p>и сопоставимость результатов (6.1.4).</p><ol><li><strong>Сопоставимость при длительных наблюдениях</strong> — одинаковые условия, средства и точки</li></ol><p>измерений; при изменении внешних условий это фиксируется (6.1.5).</p><ol><li><strong>Результат каждого этапа</strong> — информация, достаточная для оценки состояния</li></ol><p>и решения о мерах (6.1.6).</p><ol><li><strong>Первый этап</strong> — как правило, обследование для фиксации начального (нулевого) состояния</li></ol><p>(6.1.7).</p><ol><li><strong>Ухудшение</strong> — при данных, указывающих на ухудшение, назначают внеочередное обследование</li></ol><p>и решают вопрос о мерах (6.1.8).</p><hr><h2 id=\"s3\">3. ОБЩИЙ МОНИТОРИНГ (6.2)</h2><p><strong>Назначение:</strong> выявить объекты, конструкции которых изменили НДС и требуют обследования. Программа утверждается заказчиком (п. 3.17).</p><p><strong>Что измеряют:</strong></p><ul><li>крен вдоль продольной и поперечной осей;</li><li>период основного тона собственных колебаний (продольная, поперечная, вертикальная оси);</li><li>логарифмический декремент колебаний по тем же осям;</li><li>для уникальных объектов — по отдельной программе.</li></ul><p><strong>Логика (6.2.4—6.2.7):</strong></p><ol><li>Предварительная оценка категории по динамическим параметрам.</li><li>Если изменения параметров не подтверждаются повторными измерениями — объект снимается</li></ol><p>с дальнейшего наблюдения по этой процедуре.</p><ol><li>Если категория ограниченно-работоспособная или аварийная — назначается обследование</li></ol><p>и (или) мониторинг по 6.3.</p><ol><li>По результатам этапа — заключение по форме приложения Ж; сводное — по форме К.</li></ol><p><strong>Документы общего мониторинга:</strong></p><ul><li><strong>приложение И</strong> — паспорт здания (22 позиции, включая степень ответственности,</li></ul><p>форму в плане, категорию деформационного состояния, периоды и декременты колебаний, крены);</p><ul><li><strong>приложение Ж</strong> — заключение по этапу (21 позиция: предыдущие и текущие значения крена,</li></ul><p>периода и декремента по трём осям, категория, собственник);</p><ul><li><strong>приложение К</strong> — сводное заключение по этапу общего мониторинга группы объектов</li></ul><p>(9 позиций: перечень адресов, перечень организаций, перечни объектов ОР и А, общая оценка, информация, требующая экстренного решения).</p><hr><h2 id=\"s4\">4. МОНИТОРИНГ ОГРАНИЧЕННО-РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3)</h2><p><strong>Цель:</strong> отслеживать степень и скорость изменения параметров и вовремя принимать экстренные меры против обрушения или опрокидывания (п. 3.12).</p><p><strong>Состав наблюдений (по программе):</strong></p><ul><li>изменение ранее выявленных дефектов и повреждений;</li><li>появление новых дефектов;</li><li>крены (предыдущее/текущее значение и предельное);</li><li>периоды и декременты собственных колебаний;</li><li>осадки и деформации основания, уровни и состав подземных вод, деструктивные процессы</li></ul><p>(эрозия, оползни, карстово-суффозионные явления, оседание поверхности).</p><p><strong>Оформление — приложение Л (24 позиции).</strong> Обязательные приложения:</p><ol><li>дефектная ведомость с изменениями ранее выявленных и новыми дефектами, включая осадки;</li><li>результаты измерений состояния грунтов, уровней и состава подземных вод,</li></ol><p>деструктивных процессов.</p><p><strong>Частота</strong> устанавливается программой; при аварийном состоянии — до устранения причин.</p><hr><h2 id=\"s5\">5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4)</h2><p><strong>Назначение:</strong> обеспечить безопасную эксплуатацию объектов, попадающих в зону влияния нового строительства, реконструкции, природно-техногенных воздействий (п. 3.13).</p><p><strong>Что делают:</strong></p><ul><li>определяют радиус зоны влияния и перечень объектов в ней;</li><li>ведут наблюдения за деформациями земной поверхности и зданий;</li><li>осадки оснований — по ГОСТ 24846 (6.4.4);</li><li>при погружении свай и ударных воздействиях — усиленный контроль (6.4.2);</li><li>сопоставляют результаты с предыдущими этапами.</li></ul><p><strong>Оформление — приложение М (11 позиций).</strong> Обязательные приложения:</p><ul><li>заключения по каждому объекту: для ОР/А — по форме Л, для остальных — по форме Ж;</li><li>совмещённый план наблюдательной системы реперов и подземного сооружения;</li><li>вертикальные геологические разрезы по профильным линиям;</li><li>ведомости сдвижений реперов в вертикальной и горизонтальной плоскостях;</li><li>ведомости скоростей смещения реперов;</li><li>ведомости осадок реперов и измеренных длин интервалов;</li><li>результаты вычислений деформаций земной поверхности (наклоны, кривизны, радиусы</li></ul><p>кривизны, горизонтальные деформации);</p><ul><li>план расположения марок и эпюры перемещений, графики давления на основание и развития</li></ul><p>перемещений — по ГОСТ 24846-2019 (приложение Б).</p><hr><h2 id=\"s6\">6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5)</h2><ul><li>Постоянный режим наблюдений; автоматизированные стационарные системы (станции)</li></ul><p>мониторинга (6.5.4).</p><ul><li>Контроль и ранняя диагностика состояния основания и конструкций (6.5.3).</li><li>При выявлении мест изменения НДС — детальное обследование этих зон (6.5.5).</li><li>Мониторинг систем инженерно-технического обеспечения уникальных объектов (6.5.7—6.5.8).</li><li>Результат — заключения по формам Ж, И, К.</li></ul><hr><h2 id=\"s7\">7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК-ЛИСТ)</h2><ul><li>[ ] Номер этапа, дата и время, температура и условия (для сопоставимости).</li><li>[ ] Организация, специалисты, приборы (с поверкой).</li><li>[ ] Схема точек измерений — та же, что на предыдущем этапе.</li><li>[ ] Крен по двум осям: предыдущее / текущее / предельное.</li><li>[ ] Периоды и декременты колебаний по трём осям (если предусмотрено).</li><li>[ ] Дефекты: что изменилось, что появилось, что развилось.</li><li>[ ] Осадки и деформации основания; уровни и состав подземных вод.</li><li>[ ] Категория состояния на дату этапа.</li><li>[ ] Вывод: динамика (стабильно / ухудшение / резкое ухудшение).</li><li>[ ] Решение: продолжать / усилить контроль / противоаварийные меры.</li></ul><hr><h2 id=\"s8\">8. ТИПОВЫЕ ОШИБКИ</h2><ol><li><strong>Нет нулевого этапа.</strong> Без начальных значений кренов и периодов колебаний динамику</li></ol><p>оценить нельзя (6.1.7).</p><ol><li><strong>Разные точки и приборы</strong> на этапах — результаты несопоставимы (6.1.5).</li><li><strong>Этап без категории.</strong> Формы Ж, Л, М требуют установленной категории состояния.</li><li><strong>Нет дефектной ведомости</strong> с изменениями — форма Л неполная.</li><li><strong>Мониторинг без программы</strong>, утверждённой заказчиком (3.17, 6.1.2).</li><li><strong>Отсутствие реакции на ухудшение</strong> — нарушение 6.1.8.</li><li><strong>Смешение видов мониторинга</strong> — общий (6.2) не заменяет мониторинг аварийного объекта (6.3).</li><li><strong>Приборы без поверки</strong> — результаты недействительны (4.10).</li></ol><hr><h2 id=\"s9\">9. ИСТОЧНИКИ</h2><ul><li>ГОСТ 31937-2024: раздел 6, пп. 3.12—3.14, 3.17, 4.5; приложения Ж, И, К, Л, М.</li><li>ГОСТ 24846 — наблюдения за деформациями оснований.</li><li>ГОСТ 34081 — параметры основного тона собственных колебаний.</li><li>ГОСТ Р 52892-2007 — вибрация зданий.</li></ul>", "toc": [["s1", "1. КОГДА МОНИТОРИНГ НУЖЕН", 2], ["s2", "2. ОБЩИЕ ТРЕБОВАНИЯ (6.1)", 2], ["s3", "3. ОБЩИЙ МОНИТОРИНГ (6.2)", 2], ["s4", "4. МОНИТОРИНГ ОГРАНИЧЕННО-РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3)", 2], ["s5", "5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4)", 2], ["s6", "6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5)", 2], ["s7", "7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК-ЛИСТ)", 2], ["s8", "8. ТИПОВЫЕ ОШИБКИ", 2], ["s9", "9. ИСТОЧНИКИ", 2]], "chars": 7686, "plain": " МОНИТОРИНГ ТЕХНИЧЕСКОГО СОСТОЯНИЯ Раздел 6 ГОСТ 31937 2024 и обязательные формы приложений Ж, И, К, Л, М. Когда мониторинг обязателен, что измерять, как оформлять этап. Связано: 06 Оценка состояния , 07 Шаблоны заключений , 04 Дефекты . 1. КОГДА МОНИТОРИНГ НУЖЕН Ситуация Вид мониторинга Норма Объект в ограниченно работоспособном или аварийном состоянии Мониторинг ограниченно работоспособных и аварийных п. 6.3, 4.5 Объект в зоне влияния нового строительства, реконструкции, природно техногенных воздействий Мониторинг зоны влияния п. 6.4 Уникальные (высотные, большепролётные) здания Мониторинг уникальных п. 6.5 Значительные изменения НДС или крена, требуется обследование Общий мониторинг п. 6.2 Ликвидация последствий аварии, угроза прогрессирующего обрушения Мониторинг до приведения в работоспособное состояние п. 4.5 Ключевое правило (п. 4.5): при аварийном состоянии эксплуатация не допускается, а обязательный режим мониторинга устанавливается до приведения конструкций в работоспособное состояние . 2. ОБЩИЕ ТРЕБОВАНИЯ (6.1) 1. Программа мониторинга разрабатывается под задачи; в ней определяют состав, объём, периодичность, средства измерений (6.1.2). 2. Выбор системы наблюдений — по цели мониторинга, виду объекта, характеру воздействий (6.1.3). 3. Достаточность — методика и объём измерений должны обеспечивать достоверность и сопоставимость результатов (6.1.4). 4. Сопоставимость при длительных наблюдениях — одинаковые условия, средства и точки измерений; при изменении внешних условий это фиксируется (6.1.5). 5. Результат каждого этапа — информация, достаточная для оценки состояния и решения о мерах (6.1.6). 6. Первый этап — как правило, обследование для фиксации начального (нулевого) состояния (6.1.7). 7. Ухудшение — при данных, указывающих на ухудшение, назначают внеочередное обследование и решают вопрос о мерах (6.1.8). 3. ОБЩИЙ МОНИТОРИНГ (6.2) Назначение: выявить объекты, конструкции которых изменили НДС и требуют обследования. Программа утверждается заказчиком (п. 3.17). Что измеряют: крен вдоль продольной и поперечной осей; период основного тона собственных колебаний (продольная, поперечная, вертикальная оси); логарифмический декремент колебаний по тем же осям; для уникальных объектов — по отдельной программе. Логика (6.2.4—6.2.7): 1. Предварительная оценка категории по динамическим параметрам. 2. Если изменения параметров не подтверждаются повторными измерениями — объект снимается с дальнейшего наблюдения по этой процедуре. 3. Если категория ограниченно работоспособная или аварийная — назначается обследование и (или) мониторинг по 6.3. 4. По результатам этапа — заключение по форме приложения Ж; сводное — по форме К. Документы общего мониторинга: приложение И — паспорт здания (22 позиции, включая степень ответственности, форму в плане, категорию деформационного состояния, периоды и декременты колебаний, крены); приложение Ж — заключение по этапу (21 позиция: предыдущие и текущие значения крена, периода и декремента по трём осям, категория, собственник); приложение К — сводное заключение по этапу общего мониторинга группы объектов (9 позиций: перечень адресов, перечень организаций, перечни объектов ОР и А, общая оценка, информация, требующая экстренного решения). 4. МОНИТОРИНГ ОГРАНИЧЕННО РАБОТОСПОСОБНЫХ И АВАРИЙНЫХ (6.3) Цель: отслеживать степень и скорость изменения параметров и вовремя принимать экстренные меры против обрушения или опрокидывания (п. 3.12). Состав наблюдений (по программе): изменение ранее выявленных дефектов и повреждений; появление новых дефектов; крены (предыдущее/текущее значение и предельное); периоды и декременты собственных колебаний; осадки и деформации основания, уровни и состав подземных вод, деструктивные процессы (эрозия, оползни, карстово суффозионные явления, оседание поверхности). Оформление — приложение Л (24 позиции). Обязательные приложения: 1. дефектная ведомость с изменениями ранее выявленных и новыми дефектами, включая осадки; 2. результаты измерений состояния грунтов, уровней и состава подземных вод, деструктивных процессов. Частота устанавливается программой; при аварийном состоянии — до устранения причин. 5. МОНИТОРИНГ ЗОНЫ ВЛИЯНИЯ (6.4) Назначение: обеспечить безопасную эксплуатацию объектов, попадающих в зону влияния нового строительства, реконструкции, природно техногенных воздействий (п. 3.13). Что делают: определяют радиус зоны влияния и перечень объектов в ней; ведут наблюдения за деформациями земной поверхности и зданий; осадки оснований — по ГОСТ 24846 (6.4.4); при погружении свай и ударных воздействиях — усиленный контроль (6.4.2); сопоставляют результаты с предыдущими этапами. Оформление — приложение М (11 позиций). Обязательные приложения: заключения по каждому объекту: для ОР/А — по форме Л, для остальных — по форме Ж; совмещённый план наблюдательной системы реперов и подземного сооружения; вертикальные геологические разрезы по профильным линиям; ведомости сдвижений реперов в вертикальной и горизонтальной плоскостях; ведомости скоростей смещения реперов; ведомости осадок реперов и измеренных длин интервалов; результаты вычислений деформаций земной поверхности (наклоны, кривизны, радиусы кривизны, горизонтальные деформации); план расположения марок и эпюры перемещений, графики давления на основание и развития перемещений — по ГОСТ 24846 2019 (приложение Б). 6. МОНИТОРИНГ УНИКАЛЬНЫХ ОБЪЕКТОВ (6.5) Постоянный режим наблюдений; автоматизированные стационарные системы (станции) мониторинга (6.5.4). Контроль и ранняя диагностика состояния основания и конструкций (6.5.3). При выявлении мест изменения НДС — детальное обследование этих зон (6.5.5). Мониторинг систем инженерно технического обеспечения уникальных объектов (6.5.7—6.5.8). Результат — заключения по формам Ж, И, К. 7. ЧТО ФИКСИРОВАТЬ НА КАЖДОМ ЭТАПЕ (ПРАКТИЧЕСКИЙ ЧЕК ЛИСТ) [ ] Номер этапа, дата и время, температура и условия (для сопоставимости). [ ] Организация, специалисты, приборы (с поверкой). [ ] Схема точек измерений — та же, что на предыдущем этапе. [ ] Крен по двум осям: предыдущее / текущее / предельное. [ ] Периоды и декременты колебаний по трём осям (если предусмотрено). [ ] Дефекты: что изменилось, что появилось, что развилось. [ ] Осадки и деформации основания; уровни и состав подземных вод. [ ] Категория состояния на дату этапа. [ ] Вывод: динамика (стабильно / ухудшение / резкое ухудшение). [ ] Решение: продолжать / усилить контроль / противоаварийные меры. 8. ТИПОВЫЕ ОШИБКИ 1. Нет нулевого этапа. Без начальных значений кренов и периодов колебаний динамику оценить нельзя (6.1.7). 2. Разные точки и приборы на этапах — результаты несопоставимы (6.1.5). 3. Этап без категории. Формы Ж, Л, М требуют установленной категории состояния. 4. Нет дефектной ведомости с изменениями — форма Л неполная. 5. Мониторинг без программы , утверждённой заказчиком (3.17, 6.1.2). 6. Отсутствие реакции на ухудшение — нарушение 6.1.8. 7. Смешение видов мониторинга — общий (6.2) не заменяет мониторинг аварийного объекта (6.3). 8. Приборы без поверки — результаты недействительны (4.10). 9. ИСТОЧНИКИ ГОСТ 31937 2024: раздел 6, пп. 3.12—3.14, 3.17, 4.5; приложения Ж, И, К, Л, М. ГОСТ 24846 — наблюдения за деформациями оснований. ГОСТ 34081 — параметры основного тона собственных колебаний. ГОСТ Р 52892 2007 — вибрация зданий. "}, {"id": "qc", "file": "12_Контроль_качества/КОНТРОЛЬ_КАЧЕСТВА.md", "title": "КОНТРОЛЬ КАЧЕСТВА ЗАКЛЮЧЕНИЯ", "section": "12_Контроль_качества", "html": "<h1>КОНТРОЛЬ КАЧЕСТВА ЗАКЛЮЧЕНИЯ</h1><blockquote><p>Проверка перед сдачей: полнота, соответствие ГОСТ 31937-2024, качество формулировок. Основано на аудите архива (700+ отчётов) и разборе 6 эталонных заключений. Связано: <code>07_Шаблоны_заключений</code>, <code>06_Оценка_состояния</code>, <code>08_Обоснования</code>.</p></blockquote><hr><h2 id=\"s1\">1. ТРИ УРОВНЯ ПРОВЕРКИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Уровень</th><th>Что проверяем</th><th>Кто</th></tr></thead><tbody><tr><td>1. Полнота</td><td>все разделы и приложения на месте, содержание совпадает</td><td>исполнитель</td></tr><tr><td>2. Соответствие норме</td><td>объёмы, методы, ссылки, формы А/Б, сроки</td><td>нормоконтроль</td></tr><tr><td>3. Доказательность</td><td>категория обоснована, выводы не противоречат фактам, нет опечаток</td><td>руководитель / ГИП</td></tr></tbody></table></div><hr><h2 id=\"s2\">2. ЧЕК-ЛИСТ ПО РАЗДЕЛАМ</h2><h3 id=\"s3\">2.1 Титул и содержание</h3><ul><li>[ ] Наименование объекта совпадает с ТЗ дословно.</li><li>[ ] Адрес полный: город, улица, дом, литера.</li><li>[ ] Шифр единый: <code>&lt;номер&gt;/&lt;месяц&gt;-&lt;год&gt;-АВР</code>; в содержании — <code>/С</code>, <code>/ТЗ</code>.</li><li>[ ] Год на титуле соответствует дате работ.</li><li>[ ] Содержание совпадает с фактическими приложениями (номера и названия).</li></ul><h3 id=\"s4\">2.2 Техническое задание</h3><ul><li>[ ] Указаны заказчик, объект, цель.</li><li>[ ] Перечень работ соответствует фактически выполненным (визуальные + инструментальные).</li><li>[ ] Особые условия и порядок передачи.</li><li>[ ] Согласование и подпись заказчика.</li></ul><h3 id=\"s5\">2.3 Общие положения</h3><ul><li>[ ] Год постройки и автор проекта (или указано, что сведения отсутствуют).</li><li>[ ] Конструктивная схема описана.</li><li>[ ] Перечень исходных данных и нормативных документов.</li><li>[ ] Таблица приборов с указанием поверки.</li><li>[ ] Состояние объекта на момент обследования (эксплуатация, перепланировки).</li></ul><h3 id=\"s6\">2.4 Результаты обследования</h3><ul><li>[ ] Каждый элемент привязан к осям и отметкам.</li><li>[ ] Указаны материал, сечения, пролёты, шаг, опирание.</li><li>[ ] Дефекты с измеримыми параметрами (мм, %, площадь), а не «сильная коррозия».</li><li>[ ] По каждому элементу — категория со ссылкой на норму.</li><li>[ ] Зафиксировано отсутствие аварийности там, где её нет.</li><li>[ ] Вскрытия и измерения описаны с местами и объёмами.</li></ul><h3 id=\"s7\">2.5 Выводы</h3><ul><li>[ ] Причины повреждений перечислены.</li><li>[ ] Перечень элементов по категориям (А, ОР, Р) с локализацией.</li><li>[ ] Нет противоречия: ОР без дефектов и без расчёта — ошибка.</li><li>[ ] Ссылка на ГОСТ 31937-2024 с годом (не «ГОСТ 31937» и не «ГОСТ Р 31937-2011»).</li><li>[ ] Для аварийного состояния — указание на недопустимость эксплуатации.</li><li>[ ] Указан рекомендуемый срок следующего обследования (п. 4.2).</li></ul><h3 id=\"s8\">2.6 Рекомендации</h3><ul><li>[ ] Мероприятия конкретные: замена / восстановление / усиление / ремонт.</li><li>[ ] Указано, по какому проекту выполнять работы.</li><li>[ ] Противоаварийные мероприятия (при А и ОР).</li><li>[ ] Сопутствующие работы: гидроизоляция, водоотвод, вентиляция.</li><li>[ ] Наблюдение / мониторинг с периодичностью.</li></ul><h3 id=\"s9\">2.7 Приложения</h3><ul><li>[ ] Графические материалы: планы, разрезы, схемы с осями.</li><li>[ ] Фотофиксация: общий вид + каждый дефект с масштабом.</li><li>[ ] Дефектная ведомость: параметры, причина, категория, фото.</li><li>[ ] Поверочные расчёты (или обоснование, почему не выполнялись).</li><li>[ ] Толщинометрия / прочность материалов — протоколы.</li><li>[ ] Техническая документация (планы ПИБ, паспорт).</li><li>[ ] Аттестация специалистов, выписка СРО.</li></ul><hr><h2 id=\"s10\">3. ТИПОВЫЕ ОШИБКИ (НАЙДЕНЫ В АРХИВЕ)</h2><h3 id=\"s11\">3.1 Нормативные ссылки</h3><ol><li><strong>ГОСТ 31937-2011</strong> — устарел, заменён с 01.05.2024 (в архиве 2 135 упоминаний против</li></ol><p>1 514 у редакции 2024).</p><ol><li><strong>«ГОСТ Р 31937-2011»</strong> — такого обозначения не существует (79 упоминаний).</li><li><strong>СП 15.13330.2012</strong> вместо действующего СП 15.13330.2020 (470 против 224).</li><li><strong>СП 16.13330.2011</strong> вместо СП 16.13330.2017 (180 упоминаний).</li><li><strong>СП 63.13330.2012</strong> вместо СП 63.13330.2018 (139 упоминаний).</li><li><strong>СП 64.13330.2011</strong> вместо СП 64.13330.2017 (93 упоминания).</li><li>Ссылка на <strong>СП 13-102-2003</strong> без оговорки о приоритете ГОСТ 31937-2024 (1 007 упоминаний).</li></ol><h3 id=\"s12\">3.2 Логика выводов</h3><ol><li><strong>ОР при отсутствии дефектов</strong> и подтверждённой несущей способности — противоречит</li></ol><p>пп. 3.18 и 3.21.</p><ol><li><strong>Аварийное состояние без признаков исчерпания несущей способности</strong> — не обосновано.</li><li><strong>Категория без привязки</strong> к элементу, осям, отметке.</li><li><strong>Смешение</strong> физического износа (п. 3.28) и категории технического состояния.</li><li><strong>Нет срока следующего обследования</strong> (требование п. 4.2).</li><li><strong>Поверочный расчёт без исходных данных</strong> обследования (п. 3.20 требует фактические</li></ol><p>геометрию, прочность, нагрузки).</p><h3 id=\"s13\">3.3 Текст и оформление</h3><ol><li><strong>«над подвальное»</strong> раздельно — правильно «надподвальное».</li><li><strong>Опечатки в осях</strong> («4-5/Ва-Г»), в адресах и наименованиях.</li><li><strong>Разные шрифты и кегли</strong> в таблицах и подписях.</li><li><strong>Фото без привязки</strong> к ведомости и без масштабной линейки.</li></ol><h3 id=\"s14\">3.4 Организационные</h3><ol><li><strong>Дубли версий</strong> (<code>нов.docx</code>, <code>нов+.docx</code>, <code>мусор1.docx</code>) — риск отправить не ту версию.</li><li><strong>Приборы без действующей поверки</strong> (п. 4.10).</li><li><strong>Нет письменного информирования</strong> при аварийном состоянии (п. 4.6).</li></ol><hr><h2 id=\"s15\">4. БЫСТРАЯ САМОПРОВЕРКА (15 ВОПРОСОВ)</h2><ol><li>Все ли элементы, указанные в ТЗ, описаны?</li><li>У каждого элемента есть оси и отметка?</li><li>Есть ли измеренные параметры дефектов, а не качественные оценки?</li><li>Каждая категория обоснована дефектом или расчётом?</li><li>Нет ли ОР без дефектов?</li><li>Есть ли ссылка на пункт ГОСТ, а не только на стандарт целиком?</li><li>Все нормы — с годами и актуальных редакций?</li><li>Есть ли вывод о причинах, а не только перечень дефектов?</li><li>Указан ли срок следующего обследования?</li><li>Для аварийного состояния — есть ли запрет эксплуатации и противоаварийные меры?</li><li>Указано ли, по какому проекту выполнять работы?</li><li>Совпадает ли содержание с приложениями?</li><li>Все ли фото привязаны к дефектной ведомости?</li><li>Есть ли протоколы приборов, поверка, аттестация?</li><li>Нет ли опечаток в адресе, осях, шифре?</li></ol><hr><h2 id=\"s16\">5. МАТРИЦА «КАТЕГОРИЯ → МЕРОПРИЯТИЯ → ДОКУМЕНТЫ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Категория</th><th>Эксплуатация</th><th>Мероприятия</th><th>Документы</th></tr></thead><tbody><tr><td>Нормативное</td><td>Без ограничений</td><td>Плановое обслуживание</td><td>Заключение по форме А/Б</td></tr><tr><td>Работоспособное</td><td>Без ограничений</td><td>Устранение дефектов по регламенту</td><td>Заключение, дефектная ведомость</td></tr><tr><td>Ограниченно-работоспособное</td><td>С контролем (мониторинг)</td><td>Восстановление/усиление, затем мониторинг</td><td>Заключение, программа мониторинга, проект</td></tr><tr><td>Аварийное</td><td><strong>Не допускается</strong></td><td>Противоаварийные меры, проект замены/усиления, обязательный мониторинг</td><td>Заключение, письменное информирование, программа мониторинга, проект</td></tr></tbody></table></div><hr><h2 id=\"s17\">6. ПОРЯДОК ПРИЁМКИ (ПРАКТИКА)</h2><ol><li>Сверить комплектность с содержанием тома.</li><li>Прогнать чек-лист раздела 2.</li><li>Проверить все ссылки на нормы (год, редакция) — поиском по тексту.</li><li>Проверить единство терминов и обозначений (оси, отметки, шифр).</li><li>Сверить выводы с дефектной ведомостью (нет ли расхождений).</li><li>Проверить математику: объёмы, проценты поражения, пролёты, шаг.</li><li>Проверить орфографию и вёрстку (таблицы не рвутся, подписи на месте).</li><li>Убедиться, что версия файла финальная (нет «мусор», «нов+», «Old»).</li></ol><hr>", "toc": [["s1", "1. ТРИ УРОВНЯ ПРОВЕРКИ", 2], ["s2", "2. ЧЕК-ЛИСТ ПО РАЗДЕЛАМ", 2], ["s3", "2.1 Титул и содержание", 3], ["s4", "2.2 Техническое задание", 3], ["s5", "2.3 Общие положения", 3], ["s6", "2.4 Результаты обследования", 3], ["s7", "2.5 Выводы", 3], ["s8", "2.6 Рекомендации", 3], ["s9", "2.7 Приложения", 3], ["s10", "3. ТИПОВЫЕ ОШИБКИ (НАЙДЕНЫ В АРХИВЕ)", 2], ["s11", "3.1 Нормативные ссылки", 3], ["s12", "3.2 Логика выводов", 3], ["s13", "3.3 Текст и оформление", 3], ["s14", "3.4 Организационные", 3], ["s15", "4. БЫСТРАЯ САМОПРОВЕРКА (15 ВОПРОСОВ)", 2], ["s16", "5. МАТРИЦА «КАТЕГОРИЯ → МЕРОПРИЯТИЯ → ДОКУМЕНТЫ»", 2], ["s17", "6. ПОРЯДОК ПРИЁМКИ (ПРАКТИКА)", 2]], "chars": 6803, "plain": " КОНТРОЛЬ КАЧЕСТВА ЗАКЛЮЧЕНИЯ Проверка перед сдачей: полнота, соответствие ГОСТ 31937 2024, качество формулировок. Основано на аудите архива (700+ отчётов) и разборе 6 эталонных заключений. Связано: 07 Шаблоны заключений , 06 Оценка состояния , 08 Обоснования . 1. ТРИ УРОВНЯ ПРОВЕРКИ Уровень Что проверяем Кто 1. Полнота все разделы и приложения на месте, содержание совпадает исполнитель 2. Соответствие норме объёмы, методы, ссылки, формы А/Б, сроки нормоконтроль 3. Доказательность категория обоснована, выводы не противоречат фактам, нет опечаток руководитель / ГИП 2. ЧЕК ЛИСТ ПО РАЗДЕЛАМ 2.1 Титул и содержание [ ] Наименование объекта совпадает с ТЗ дословно. [ ] Адрес полный: город, улица, дом, литера. [ ] Шифр единый: <номер /<месяц <год АВР ; в содержании — /С , /ТЗ . [ ] Год на титуле соответствует дате работ. [ ] Содержание совпадает с фактическими приложениями (номера и названия). 2.2 Техническое задание [ ] Указаны заказчик, объект, цель. [ ] Перечень работ соответствует фактически выполненным (визуальные + инструментальные). [ ] Особые условия и порядок передачи. [ ] Согласование и подпись заказчика. 2.3 Общие положения [ ] Год постройки и автор проекта (или указано, что сведения отсутствуют). [ ] Конструктивная схема описана. [ ] Перечень исходных данных и нормативных документов. [ ] Таблица приборов с указанием поверки. [ ] Состояние объекта на момент обследования (эксплуатация, перепланировки). 2.4 Результаты обследования [ ] Каждый элемент привязан к осям и отметкам. [ ] Указаны материал, сечения, пролёты, шаг, опирание. [ ] Дефекты с измеримыми параметрами (мм, %, площадь), а не «сильная коррозия». [ ] По каждому элементу — категория со ссылкой на норму. [ ] Зафиксировано отсутствие аварийности там, где её нет. [ ] Вскрытия и измерения описаны с местами и объёмами. 2.5 Выводы [ ] Причины повреждений перечислены. [ ] Перечень элементов по категориям (А, ОР, Р) с локализацией. [ ] Нет противоречия: ОР без дефектов и без расчёта — ошибка. [ ] Ссылка на ГОСТ 31937 2024 с годом (не «ГОСТ 31937» и не «ГОСТ Р 31937 2011»). [ ] Для аварийного состояния — указание на недопустимость эксплуатации. [ ] Указан рекомендуемый срок следующего обследования (п. 4.2). 2.6 Рекомендации [ ] Мероприятия конкретные: замена / восстановление / усиление / ремонт. [ ] Указано, по какому проекту выполнять работы. [ ] Противоаварийные мероприятия (при А и ОР). [ ] Сопутствующие работы: гидроизоляция, водоотвод, вентиляция. [ ] Наблюдение / мониторинг с периодичностью. 2.7 Приложения [ ] Графические материалы: планы, разрезы, схемы с осями. [ ] Фотофиксация: общий вид + каждый дефект с масштабом. [ ] Дефектная ведомость: параметры, причина, категория, фото. [ ] Поверочные расчёты (или обоснование, почему не выполнялись). [ ] Толщинометрия / прочность материалов — протоколы. [ ] Техническая документация (планы ПИБ, паспорт). [ ] Аттестация специалистов, выписка СРО. 3. ТИПОВЫЕ ОШИБКИ (НАЙДЕНЫ В АРХИВЕ) 3.1 Нормативные ссылки 1. ГОСТ 31937 2011 — устарел, заменён с 01.05.2024 (в архиве 2 135 упоминаний против 1 514 у редакции 2024). 2. «ГОСТ Р 31937 2011» — такого обозначения не существует (79 упоминаний). 3. СП 15.13330.2012 вместо действующего СП 15.13330.2020 (470 против 224). 4. СП 16.13330.2011 вместо СП 16.13330.2017 (180 упоминаний). 5. СП 63.13330.2012 вместо СП 63.13330.2018 (139 упоминаний). 6. СП 64.13330.2011 вместо СП 64.13330.2017 (93 упоминания). 7. Ссылка на СП 13 102 2003 без оговорки о приоритете ГОСТ 31937 2024 (1 007 упоминаний). 3.2 Логика выводов 8. ОР при отсутствии дефектов и подтверждённой несущей способности — противоречит пп. 3.18 и 3.21. 9. Аварийное состояние без признаков исчерпания несущей способности — не обосновано. 10. Категория без привязки к элементу, осям, отметке. 11. Смешение физического износа (п. 3.28) и категории технического состояния. 12. Нет срока следующего обследования (требование п. 4.2). 13. Поверочный расчёт без исходных данных обследования (п. 3.20 требует фактические геометрию, прочность, нагрузки). 3.3 Текст и оформление 14. «над подвальное» раздельно — правильно «надподвальное». 15. Опечатки в осях («4 5/Ва Г»), в адресах и наименованиях. 16. Разные шрифты и кегли в таблицах и подписях. 17. Фото без привязки к ведомости и без масштабной линейки. 3.4 Организационные 18. Дубли версий ( нов.docx , нов+.docx , мусор1.docx ) — риск отправить не ту версию. 19. Приборы без действующей поверки (п. 4.10). 20. Нет письменного информирования при аварийном состоянии (п. 4.6). 4. БЫСТРАЯ САМОПРОВЕРКА (15 ВОПРОСОВ) 1. Все ли элементы, указанные в ТЗ, описаны? 2. У каждого элемента есть оси и отметка? 3. Есть ли измеренные параметры дефектов, а не качественные оценки? 4. Каждая категория обоснована дефектом или расчётом? 5. Нет ли ОР без дефектов? 6. Есть ли ссылка на пункт ГОСТ, а не только на стандарт целиком? 7. Все нормы — с годами и актуальных редакций? 8. Есть ли вывод о причинах, а не только перечень дефектов? 9. Указан ли срок следующего обследования? 10. Для аварийного состояния — есть ли запрет эксплуатации и противоаварийные меры? 11. Указано ли, по какому проекту выполнять работы? 12. Совпадает ли содержание с приложениями? 13. Все ли фото привязаны к дефектной ведомости? 14. Есть ли протоколы приборов, поверка, аттестация? 15. Нет ли опечаток в адресе, осях, шифре? 5. МАТРИЦА «КАТЕГОРИЯ → МЕРОПРИЯТИЯ → ДОКУМЕНТЫ» Категория Эксплуатация Мероприятия Документы Нормативное Без ограничений Плановое обслуживание Заключение по форме А/Б Работоспособное Без ограничений Устранение дефектов по регламенту Заключение, дефектная ведомость Ограниченно работоспособное С контролем (мониторинг) Восстановление/усиление, затем мониторинг Заключение, программа мониторинга, проект Аварийное Не допускается Противоаварийные меры, проект замены/усиления, обязательный мониторинг Заключение, письменное информирование, программа мониторинга, проект 6. ПОРЯДОК ПРИЁМКИ (ПРАКТИКА) 1. Сверить комплектность с содержанием тома. 2. Прогнать чек лист раздела 2. 3. Проверить все ссылки на нормы (год, редакция) — поиском по тексту. 4. Проверить единство терминов и обозначений (оси, отметки, шифр). 5. Сверить выводы с дефектной ведомостью (нет ли расхождений). 6. Проверить математику: объёмы, проценты поражения, пролёты, шаг. 7. Проверить орфографию и вёрстку (таблицы не рвутся, подписи на месте). 8. Убедиться, что версия файла финальная (нет «мусор», «нов+», «Old»). "}, {"id": "atlas", "file": "13_Книги/АТЛАС.md", "title": "АТЛАС ЧЕРТЕЖЕЙ К КУРСУ СТРОИТЕЛЬНОГО ИСКУССТВА", "section": "13_Книги", "html": "<h1>АТЛАС ЧЕРТЕЖЕЙ К КУРСУ СТРОИТЕЛЬНОГО ИСКУССТВА</h1><blockquote><p>В. И. Радивановский. Атлас чертежей к курсу строительного искусства. 2-е изд. С.-Петербург: издание Н. П. Карбасникова, 1900. 52 таблицы. Таблицы — планы, разрезы и детали: земляные, фашинные, каменные, бетонные, деревянные, свайные и металлические работы.</p></blockquote><h2 id=\"s1\">Земляные работы</h2><p>Профили выемок и насыпей, разбивка, укрепление откосов, водоотвод. Показывают, как в начале XX в. рассчитывали и устраивали земляные работы под здания и дороги.</p><p><strong>Зачем эксперту.</strong> Полезно для объектов на слабых грунтах, с подтоплением и перепадами рельефа: язык описания откосов, дренажа и укреплений. Связь с геологией — п. 5.1.12, 5.2.2 ГОСТ.</p><p><strong>См.:</strong> К-01 · Д-К01-01</p><h4 id=\"s2\">Таблица 1</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-02.png\" alt=\"Таблица 1\" loading=\"lazy\"><figcaption>Таблица 1</figcaption></figure><h4 id=\"s3\">Таблица 2</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-03.png\" alt=\"Таблица 2\" loading=\"lazy\"><figcaption>Таблица 2</figcaption></figure><h4 id=\"s4\">Таблица 3</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-04.png\" alt=\"Таблица 3\" loading=\"lazy\"><figcaption>Таблица 3</figcaption></figure><h4 id=\"s5\">Таблица 4</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-05.png\" alt=\"Таблица 4\" loading=\"lazy\"><figcaption>Таблица 4</figcaption></figure><h4 id=\"s6\">Таблица 5</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-06.png\" alt=\"Таблица 5\" loading=\"lazy\"><figcaption>Таблица 5</figcaption></figure><h4 id=\"s7\">Таблица 6</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-07.png\" alt=\"Таблица 6\" loading=\"lazy\"><figcaption>Таблица 6</figcaption></figure><h2 id=\"s8\">Фашинные работы</h2><p>Фашины, тюфяки, укрепление берегов и откосов; материалы и порядок укладки.</p><p><strong>Зачем эксперту.</strong> Встречается в основаниях на слабых и обводнённых грунтах. Помогает распознать фашинные подушки при вскрытии.</p><p><strong>См.:</strong> К-01 · Д-К01-04</p><h4 id=\"s9\">Таблица 7</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-08.png\" alt=\"Таблица 7\" loading=\"lazy\"><figcaption>Таблица 7</figcaption></figure><h4 id=\"s10\">Таблица 8</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-09.png\" alt=\"Таблица 8\" loading=\"lazy\"><figcaption>Таблица 8</figcaption></figure><h4 id=\"s11\">Таблица 9</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-10.png\" alt=\"Таблица 9\" loading=\"lazy\"><figcaption>Таблица 9</figcaption></figure><h2 id=\"s12\">Каменные работы</h2><p>Разрезка стен (вертикальных, наклонных, цилиндрических), перевязка, углы, притыкание, столбы, простенки, пустоты, трубы, своды, смешанная кладка и облицовка.</p><p><strong>Зачем эксперту.</strong> Основной визуальный справочник по исторической кладке: по нему проверяют перевязку, опирание, толщину швов и объясняют трещины и выпучивания.</p><p><strong>См.:</strong> К-02 · Д-К02-01</p><h4 id=\"s13\">Таблица 10</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-11.png\" alt=\"Таблица 10\" loading=\"lazy\"><figcaption>Таблица 10</figcaption></figure><h4 id=\"s14\">Таблица 11</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-12.png\" alt=\"Таблица 11\" loading=\"lazy\"><figcaption>Таблица 11</figcaption></figure><h4 id=\"s15\">Таблица 12</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-13.png\" alt=\"Таблица 12\" loading=\"lazy\"><figcaption>Таблица 12</figcaption></figure><h4 id=\"s16\">Таблица 13</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-14.png\" alt=\"Таблица 13\" loading=\"lazy\"><figcaption>Таблица 13</figcaption></figure><h4 id=\"s17\">Таблица 14</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-15.png\" alt=\"Таблица 14\" loading=\"lazy\"><figcaption>Таблица 14</figcaption></figure><h4 id=\"s18\">Таблица 15</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-16.png\" alt=\"Таблица 15\" loading=\"lazy\"><figcaption>Таблица 15</figcaption></figure><h4 id=\"s19\">Таблица 16</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-17.png\" alt=\"Таблица 16\" loading=\"lazy\"><figcaption>Таблица 16</figcaption></figure><h4 id=\"s20\">Таблица 17</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-18.png\" alt=\"Таблица 17\" loading=\"lazy\"><figcaption>Таблица 17</figcaption></figure><h4 id=\"s21\">Таблица 18</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-19.png\" alt=\"Таблица 18\" loading=\"lazy\"><figcaption>Таблица 18</figcaption></figure><h4 id=\"s22\">Таблица 19</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-20.png\" alt=\"Таблица 19\" loading=\"lazy\"><figcaption>Таблица 19</figcaption></figure><h4 id=\"s23\">Таблица 20</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-21.png\" alt=\"Таблица 20\" loading=\"lazy\"><figcaption>Таблица 20</figcaption></figure><h4 id=\"s24\">Таблица 21</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-22.png\" alt=\"Таблица 21\" loading=\"lazy\"><figcaption>Таблица 21</figcaption></figure><h4 id=\"s25\">Таблица 22</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-23.png\" alt=\"Таблица 22\" loading=\"lazy\"><figcaption>Таблица 22</figcaption></figure><h4 id=\"s26\">Таблица 23</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-24.png\" alt=\"Таблица 23\" loading=\"lazy\"><figcaption>Таблица 23</figcaption></figure><h4 id=\"s27\">Таблица 24</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-25.png\" alt=\"Таблица 24\" loading=\"lazy\"><figcaption>Таблица 24</figcaption></figure><h4 id=\"s28\">Таблица 25</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-26.png\" alt=\"Таблица 25\" loading=\"lazy\"><figcaption>Таблица 25</figcaption></figure><h2 id=\"s29\">Бетонные работы</h2><p>Опалубка и массивы, бетонные изделия (трубы, плитки, ступени), железобетон, бетонирование под водой.</p><p><strong>Зачем эксперту.</strong> Помогает распознать ранний железобетон и оценить защитный слой и карбонизацию — см. Д-К03-13.</p><p><strong>См.:</strong> К-03 · Д-К03-13</p><h4 id=\"s30\">Таблица 26</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-27.png\" alt=\"Таблица 26\" loading=\"lazy\"><figcaption>Таблица 26</figcaption></figure><h4 id=\"s31\">Таблица 27</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-28.png\" alt=\"Таблица 27\" loading=\"lazy\"><figcaption>Таблица 27</figcaption></figure><h4 id=\"s32\">Таблица 28</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-29.png\" alt=\"Таблица 28\" loading=\"lazy\"><figcaption>Таблица 28</figcaption></figure><h4 id=\"s33\">Таблица 29</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-30.png\" alt=\"Таблица 29\" loading=\"lazy\"><figcaption>Таблица 29</figcaption></figure><h4 id=\"s34\">Таблица 30</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-31.png\" alt=\"Таблица 30\" loading=\"lazy\"><figcaption>Таблица 30</figcaption></figure><h2 id=\"s35\">Деревянные работы</h2><p>Врубки и сопряжения, стены, перекрытия, стропила; плотничные и столярные работы.</p><p><strong>Зачем эксперту.</strong> Дополняет «Плотничное искусство»: те же узлы, но в общестроительном контексте.</p><p><strong>См.:</strong> К-03 · Д-К03-22</p><h4 id=\"s36\">Таблица 31</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-32.png\" alt=\"Таблица 31\" loading=\"lazy\"><figcaption>Таблица 31</figcaption></figure><h4 id=\"s37\">Таблица 32</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-33.png\" alt=\"Таблица 32\" loading=\"lazy\"><figcaption>Таблица 32</figcaption></figure><h4 id=\"s38\">Таблица 33</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-34.png\" alt=\"Таблица 33\" loading=\"lazy\"><figcaption>Таблица 33</figcaption></figure><h4 id=\"s39\">Таблица 34</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-35.png\" alt=\"Таблица 34\" loading=\"lazy\"><figcaption>Таблица 34</figcaption></figure><h4 id=\"s40\">Таблица 35</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-36.png\" alt=\"Таблица 35\" loading=\"lazy\"><figcaption>Таблица 35</figcaption></figure><h4 id=\"s41\">Таблица 36</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-37.png\" alt=\"Таблица 36\" loading=\"lazy\"><figcaption>Таблица 36</figcaption></figure><h4 id=\"s42\">Таблица 37</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-38.png\" alt=\"Таблица 37\" loading=\"lazy\"><figcaption>Таблица 37</figcaption></figure><h4 id=\"s43\">Таблица 38</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-39.png\" alt=\"Таблица 38\" loading=\"lazy\"><figcaption>Таблица 38</figcaption></figure><h4 id=\"s44\">Таблица 39</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-40.png\" alt=\"Таблица 39\" loading=\"lazy\"><figcaption>Таблица 39</figcaption></figure><h4 id=\"s45\">Таблица 40</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-41.png\" alt=\"Таблица 40\" loading=\"lazy\"><figcaption>Таблица 40</figcaption></figure><h2 id=\"s46\">Свайные работы</h2><p>Деревянные и винтовые сваи, копры, забивка, ростверки и выдёргивание свай.</p><p><strong>Зачем эксперту.</strong> Свайные основания исторических зданий: методы выявления (шурфы, сейсмоакустика — п. 5.2.19 ГОСТ) и оценка.</p><p><strong>См.:</strong> К-01 · Д-К01-02</p><h4 id=\"s47\">Таблица 41</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-42.png\" alt=\"Таблица 41\" loading=\"lazy\"><figcaption>Таблица 41</figcaption></figure><h4 id=\"s48\">Таблица 42</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-43.png\" alt=\"Таблица 42\" loading=\"lazy\"><figcaption>Таблица 42</figcaption></figure><h4 id=\"s49\">Таблица 43</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-44.png\" alt=\"Таблица 43\" loading=\"lazy\"><figcaption>Таблица 43</figcaption></figure><h4 id=\"s50\">Таблица 44</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-45.png\" alt=\"Таблица 44\" loading=\"lazy\"><figcaption>Таблица 44</figcaption></figure><h4 id=\"s51\">Таблица 45</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-46.png\" alt=\"Таблица 45\" loading=\"lazy\"><figcaption>Таблица 45</figcaption></figure><h2 id=\"s52\">Металлические работы</h2><p>Клёпка и болты, узлы ферм, чугунные колонны, трубы и плиты; кузнечные и слесарные приёмы.</p><p><strong>Зачем эксперту.</strong> Позволяет назвать тип исторического соединения и его типовые дефекты: коррозия, ослабление заклёпок, трещины в чугуне.</p><p><strong>См.:</strong> К-05 · Д-К05-01</p><h4 id=\"s53\">Таблица 46</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-47.png\" alt=\"Таблица 46\" loading=\"lazy\"><figcaption>Таблица 46</figcaption></figure><h4 id=\"s54\">Таблица 47</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-48.png\" alt=\"Таблица 47\" loading=\"lazy\"><figcaption>Таблица 47</figcaption></figure><h4 id=\"s55\">Таблица 48</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-49.png\" alt=\"Таблица 48\" loading=\"lazy\"><figcaption>Таблица 48</figcaption></figure><h4 id=\"s56\">Таблица 49</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-50.png\" alt=\"Таблица 49\" loading=\"lazy\"><figcaption>Таблица 49</figcaption></figure><h4 id=\"s57\">Таблица 50</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-51.png\" alt=\"Таблица 50\" loading=\"lazy\"><figcaption>Таблица 50</figcaption></figure><h4 id=\"s58\">Таблица 51</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-52.png\" alt=\"Таблица 51\" loading=\"lazy\"><figcaption>Таблица 51</figcaption></figure><h2 id=\"s59\">Отделочные работы</h2><p>Штукатурка по камню и дереву, карнизы, откосы, малярные составы.</p><p><strong>Зачем эксперту.</strong> Диагностика отделки: несовместимость составов, отсутствие подготовки, отслоение — см. Д-К07-01.</p><p><strong>См.:</strong> К-07 · Д-К07-01</p><h4 id=\"s60\">Таблица 52</h4><figure class=\"fig\"><img src=\"assets/books/atlas/tab-53.png\" alt=\"Таблица 52\" loading=\"lazy\"><figcaption>Таблица 52</figcaption></figure>", "toc": [["s1", "Земляные работы", 2], ["s8", "Фашинные работы", 2], ["s12", "Каменные работы", 2], ["s29", "Бетонные работы", 2], ["s35", "Деревянные работы", 2], ["s46", "Свайные работы", 2], ["s52", "Металлические работы", 2], ["s59", "Отделочные работы", 2]], "chars": 5174, "plain": " АТЛАС ЧЕРТЕЖЕЙ К КУРСУ СТРОИТЕЛЬНОГО ИСКУССТВА В. И. Радивановский. Атлас чертежей к курсу строительного искусства. 2 е изд. С. Петербург: издание Н. П. Карбасникова, 1900. 52 таблицы. Таблицы — планы, разрезы и детали: земляные, фашинные, каменные, бетонные, деревянные, свайные и металлические работы. Земляные работы Профили выемок и насыпей, разбивка, укрепление откосов, водоотвод. Показывают, как в начале XX в. рассчитывали и устраивали земляные работы под здания и дороги. Зачем эксперту. Полезно для объектов на слабых грунтах, с подтоплением и перепадами рельефа: язык описания откосов, дренажа и укреплений. Связь с геологией — п. 5.1.12  52](atlas/tab 53.png) "}, {"id": "book-carpentry", "file": "13_Книги/ПЛОТНИЧНОЕ_ИСКУССТВО.md", "title": "ПЛОТНИЧНОЕ ИСКУССТВО (1902) — разбор книги", "section": "13_Книги", "html": "<h1>ПЛОТНИЧНОЕ ИСКУССТВО (1902) — разбор книги</h1><blockquote><p>Дементьев. <strong>Плотничное искусство</strong>, изложенное полковником Дементьевым. Издание четвёртое. — С.-Петербург: Книжный склад В. И. Губинского, 1902. 191 с., 212 рисунков. Файл: <code>Книги и Техническая литература\\Плотничное искусство lib2135.pdf</code> (скан с текстовым слоем ABBYY FineReader). Рисунки: <code>figures\\</code> (196 извлечено, 46 в галерее <code>РИСУНКИ.md</code>).</p></blockquote><hr><h2 id=\"s1\">1. ЗАЧЕМ ЭТА КНИГА ЭКСПЕРТУ</h2><p>Санкт-Петербург — город исторической деревянной и смешанной застройки: деревянные перекрытия по металлическим и деревянным балкам, наслонные стропила, обшивка по стойкам, врубки в обвязках. Книга 1902 года описывает <strong>именно те узлы</strong>, которые встречаются в обследованиях: как балка заделана в стену, как устроены стропила, какие врубки применялись, где скапливается влага и начинается гниль.</p><p>Практическая ценность:</p><ol><li><strong>Идентификация конструкций.</strong> По рисунку узла можно определить тип соединения</li></ol><p>и период постройки, а значит — ожидаемые дефекты.</p><ol><li><strong>Объяснение дефектов.</strong> Многие современные повреждения (гниль торца балки, коррозия</li></ol><p>скоб, разрыв врубки) заложены самой конструкцией: заделка в стену без воздушного зазора, дерево в каменной кладке, отсутствие гидроизоляции.</p><ol><li><strong>Обоснование решений.</strong> Когда замена, а когда усиление: книга показывает, какие</li></ol><p>элементы изначально составные (досчатые балки, надделки), и почему их ремонт по исторической технологии допустим.</p><ol><li><strong>Терминология.</strong> Старые названия («замок», «сковородник», «присев», «легель»)</li></ol><p>встречаются в архивных документах и заключениях; без словаря их не прочитать.</p><p><strong>Ограничение:</strong> книга дорасчётная. Размеры в вершках и дюймах, нормы прочности не сопоставимы с современными; использовать как исторический и конструктивный источник, а не как расчётное пособие. Расчёты — по СП 64.13330.2017 и СП 16.13330.2017.</p><hr><h2 id=\"s2\">2. СТРУКТУРА КНИГИ</h2><div class=\"tablewrap\"><table><thead><tr><th>Страницы</th><th>Раздел</th><th>Содержание</th><th>Рисунки</th></tr></thead><tbody><tr><td>3—4</td><td>Введение</td><td>Зачем изданы рисунки; польза для помещиков и сельских хозяев</td><td>—</td></tr><tr><td>5—35</td><td>Инструменты</td><td>Топор, пила, долото, бурав, струг, циркуль, отволока, черта, крючья</td><td>фиг. 1—50</td></tr><tr><td>36—41</td><td>Машины</td><td>Ворот, полиспаст, копёр, баба для забивки свай</td><td>фиг. 51—56</td></tr><tr><td>42—98</td><td>Замки и врубки</td><td>Откосные, торцевые, угловые, проушинные, сковородники, шипы</td><td>фиг. 57—100</td></tr><tr><td>99—105</td><td>Сплотка</td><td>Соединение досок в шпунт, на шипах, щиты</td><td>фиг. 121—125</td></tr><tr><td>106—120</td><td>Деревянные дома</td><td>Обшивка, стойки, закладные рамы, сараи</td><td>фиг. 127—138</td></tr><tr><td>121—135</td><td>Балки и перекрытия</td><td>Заделка в стену, составные и досчатые балки, надделки, накладки</td><td>фиг. 141—150</td></tr><tr><td>136—150</td><td>Ограды и фасады</td><td>Заборы, ворота, калитки, палисад, обшивка</td><td>фиг. 159—169</td></tr><tr><td>151—183</td><td>Крыши и стропила</td><td>Шаг стропил, мауэрлат, легель, обрешётка, конёк, трубы, мансарда</td><td>фиг. 170—200</td></tr><tr><td>184—186</td><td>Лестницы</td><td>Тетивы, врубка ступеней, крепление</td><td>фиг. 201—202</td></tr><tr><td>187—189</td><td>Мосты и арки</td><td>Кружальная система, фермы, свайные опоры</td><td>фиг. 203</td></tr><tr><td>190—191</td><td>Указатель</td><td>Перечень замков и терминов</td><td>—</td></tr></tbody></table></div><hr><h2 id=\"s3\">3. КЛЮЧЕВЫЕ ТЕХНИЧЕСКИЕ РЕШЕНИЯ</h2><h3 id=\"s4\">3.1 Заделка балки в каменную стену (с. 121, фиг. 141)</h3><ul><li>Конец балки <strong>осмолён</strong> и <strong>обложен войлоком</strong>, закладывается в стену **не более</li></ul><p>6 вершков** (≈ 26,7 см, «на один кирпич»).</p><ul><li>Для связи со стеной и восприятия нагрузки концы закреплялись **железными скобами</li></ul><p>со штырём**.</p><ul><li><strong>Что это значит при обследовании:</strong> торец в кладке — зона постоянного увлажнения</li></ul><p>и гниения; скоба — зона коррозии. Именно здесь появляются «разрушение заделки» и «прогиб балки». См. <code>04_Дефекты</code>, Д-К03-04.</p><h3 id=\"s5\">3.2 Составные и досчатые балки (с. 124—125, фиг. 144, 145)</h3><ul><li>При больших нагрузках балку делали из <strong>двух рядов брусьев</strong> с зубьями по длине</li></ul><p>и расклиниванием (фиг. 144).</p><ul><li>Досчатые балки — <strong>три доски на ребро</strong> (фиг. 145); причина прямо названа в книге:</li></ul><p>в досках <strong>видно состояние древесины</strong>, тогда как середина бревна может быть гнилой.</p><ul><li><strong>Вывод для эксперта:</strong> «составная» балка — не дефект сама по себе; дефект — расстройство</li></ul><p>зубьев, выпадение клиньев, сдвиг рядов. Проверять соединение, а не только сечение.</p><h3 id=\"s6\">3.3 Усиление балок (с. 127—130, фиг. 147, 150)</h3><ul><li><strong>Надделки сверху</strong> (фиг. 147): балка выправляется по шаблону, сверху крепится</li></ul><p>усиливающий элемент.</p><ul><li><strong>Боковые накладки</strong> заподлицо с нижней гранью (фиг. 150).</li><li><strong>Вывод:</strong> исторические усиления — часть конструкции. При обследовании оценивать</li></ul><p>их достаточность и совместную работу (примечание к п. 5.1.11 ГОСТ 31937-2024).</p><h3 id=\"s7\">3.4 Стропила (с. 151—163, фиг. 170—182)</h3><ul><li>Стропильные ноги ставятся поперёк здания с шагом, нижними концами упираются</li></ul><p>в балку <strong>в прирубной и шиповый замок</strong> (с. 151).</p><ul><li>Для подкрёпа — горизонтальный брус <strong>легель</strong> посередине, соединённый со стропильными</li></ul><p>ногами <strong>замком в сковородник</strong>; чем положе крыша, тем нужнее легель (с. 163).</p><ul><li>Сечение стропил — брусья <strong>4—5 вершков</strong> (17,8—22,2 см).</li><li>В каменных строениях — <strong>мауэрлат и прогоны</strong> (фиг. 174—175).</li><li>Обрешётка: под железную крышу — доски 2½ дюйма (≈ 6,4 см), под деревянную — свои</li></ul><p>правила; конёк и обход труб — отдельные узлы (фиг. 176—179).</p><ul><li><strong>Вывод:</strong> распор и работа легеля объясняют трещины в коньковых узлах и «разъезд»</li></ul><p>скатов; при утрате легеля крыша работает иначе.</p><h3 id=\"s8\">3.5 Обшивка и стены (с. 106—120, фиг. 127—138)</h3><ul><li>Обшивка дома — <strong>дюймовые доски по стойкам</strong> из расколотых 2½-дюймовых досок;</li></ul><p>стойки у углов, у оконных рам и в середине простенков.</p><ul><li><strong>Закладные рамы</strong> и <strong>раскосины</strong> — жёсткость и связь.</li><li><strong>Вывод:</strong> вентиляционный зазор под обшивкой — критичен; его отсутствие даёт гниль</li></ul><p>обшивки и венцов.</p><h3 id=\"s9\">3.6 Лестницы (с. 184—186, фиг. 201—202)</h3><ul><li>Тетивы — две доски 2½ дюйма; разметка ступеней: <strong>подъём около 4 вершков</strong> (≈ 17,8 см),</li></ul><p><strong>проступь не менее 6 вершков</strong> (≈ 26,7 см).</p><ul><li>В тетиве выбираются <strong>шпунты</strong> шириной 2½ дюйма и глубиной 1 дюйм.</li><li><strong>Вывод:</strong> исторические параметры близки к современным комфортным (подъём 150—180 мм,</li></ul><p>проступь 270—300 мм); отклонения — признак переделок.</p><h3 id=\"s10\">3.7 Мосты и арки (с. 187—189, фиг. 203)</h3><ul><li>Описан деревянный мост <strong>кружальной системы</strong> (первый в России, 1813 г.): 7 арок,</li></ul><p>8 ферм, свайные опоры в 5 рядов.</p><ul><li><strong>Вывод:</strong> термин «кружала» и ферменные схемы полезны при описании исторических</li></ul><p>большепролётных конструкций.</p><hr><h2 id=\"s11\">4. ТИПЫ СОЕДИНЕНИЙ (СЛОВАРЬ «ЗАМКОВ»)</h2><div class=\"tablewrap\"><table><thead><tr><th>Название в книге</th><th>Что это</th><th>Где применялось</th></tr></thead><tbody><tr><td>Замок откосный простой</td><td>Соединение под углом со скосом</td><td>Обвязки, рамы</td></tr><tr><td>Замок откосный с прирубом</td><td>Скос с прирубом</td><td>Углы, стойки</td></tr><tr><td>Замок откосный зобом (кильсоновый)</td><td>Скос с «зобом» для упора</td><td>Ответственные узлы</td></tr><tr><td>Замок сдвижной (с шипами)</td><td>Сдвиг по пазу с шипами</td><td>Сращивание по длине</td></tr><tr><td>Замок сквозной сковородник</td><td>Сквозной паз с уступом</td><td>Стропила, обвязки</td></tr><tr><td>Замок угловой в накладку</td><td>Накладка концами или серединой</td><td>Углы, тонкие доски</td></tr><tr><td>Замок проушинный (в награду)</td><td>Проушина и шип</td><td>Рамы, стойки</td></tr><tr><td>Угол с присевом</td><td>Врубка с присевом</td><td>Рубка деревянных стен</td></tr><tr><td>Шпунт, шип, фальц</td><td>Паз, шип, четверть</td><td>Сплотка, обшивка</td></tr><tr><td>Стулья, надделки, накладки</td><td>Опоры и усиления</td><td>Полы, балки</td></tr></tbody></table></div><p>По этим названиям читаются старые описи и дефектные ведомости.</p><hr><h2 id=\"s12\">5. СТАРЫЕ ТЕРМИНЫ → СОВРЕМЕННЫЕ</h2><div class=\"tablewrap\"><table><thead><tr><th>В книге</th><th>Сейчас</th></tr></thead><tbody><tr><td>Балка, брус</td><td>Балка, брус</td></tr><tr><td>Стропильная нога</td><td>Стропильная нога</td></tr><tr><td>Легель</td><td>Подкос/ригель стропильной системы (горизонтальный элемент)</td></tr><tr><td>Затяжка</td><td>Затяжка (нижний пояс)</td></tr><tr><td>Мауэрлат, прогон</td><td>Мауэрлат, прогон</td></tr><tr><td>Рѣшетина, рѣшётка</td><td>Обрешётка</td></tr><tr><td>Конёк</td><td>Конёк</td></tr><tr><td>Ендова</td><td>Ендова</td></tr><tr><td>Стул</td><td>Опорный столбик (стул)</td></tr><tr><td>Надделка</td><td>Усиление накладкой сверху</td></tr><tr><td>Присев</td><td>Врубка с упором (присев)</td></tr><tr><td>Сковородник</td><td>Соединение «сковородник» (паз с уступом)</td></tr><tr><td>Тетива</td><td>Тетива лестницы</td></tr><tr><td>Кружала, ферма</td><td>Кружала, ферма</td></tr><tr><td>Баба</td><td>Падающий молот копра</td></tr><tr><td>Отволока, черта</td><td>Разметочные инструменты</td></tr></tbody></table></div><hr><h2 id=\"s13\">6. ЕДИНИЦЫ ИЗМЕРЕНИЯ (для перевода в текст заключения)</h2><div class=\"tablewrap\"><table><thead><tr><th>Единица</th><th>Значение</th></tr></thead><tbody><tr><td>Дюйм</td><td>2,54 см</td></tr><tr><td>Вершок</td><td>4,445 см</td></tr><tr><td>Аршин</td><td>71,12 см</td></tr><tr><td>Сажень</td><td>213,36 см</td></tr></tbody></table></div><p>Пример: «заложены в стену не более 6 вершков» = около <strong>27 см</strong>, «стропила 4—5 вершков» = <strong>18—22 см</strong>, «проступь не менее 6 вершков» = <strong>27 см</strong>, «подъём около 4 вершков» = <strong>18 см</strong>.</p><hr><h2 id=\"s14\">7. ГДЕ ЭТО ПРИГОДИТСЯ В РАБОТЕ</h2><ol><li><strong>Идентификация узла</strong> при обследовании: сфотографировать узел, сравнить с рисунком,</li></ol><p>назвать тип соединения. Это усиливает описательную часть заключения.</p><ol><li><strong>Обоснование причины дефекта:</strong> «заделка торца балки в кладку без зазора и</li></ol><p>гидроизоляции (с. 121, фиг. 141) → увлажнение → гниль/коррозия скобы».</p><ol><li><strong>Оценка исторических усилений:</strong> надделки и накладки (фиг. 147, 150) — оценивать</li></ol><p>совместную работу, а не считать «посторонним элементом».</p><ol><li><strong>Стропильные системы:</strong> легель и затяжка объясняют распор; отсутствие легеля —</li></ol><p>причина деформаций скатов.</p><ol><li><strong>Лестницы:</strong> исторические параметры ступеней — база для оценки «соответствия».</li><li><strong>Терминология</strong> в актах и старых заключениях.</li></ol><p>Связи с библиотекой: <code>03_Конструктив</code> (К-02, К-03, К-04, К-06), <code>04_Дефекты</code> (Д-К03-01, Д-К03-04, Д-К03-20, Д-К04-10, Д-К06-02), <code>08_Обоснования</code> (О-01, О-04).</p><hr><h2 id=\"s15\">8. ОГРАНИЧЕНИЯ</h2><ul><li>Нет расчётов и норм прочности; размеры — эмпирические.</li><li>Дореволюционная орфография в тексте; термины могут отличаться от современных.</li><li>Изображения — сканы с просветом; часть рисунков утрачена при извлечении</li></ul><p>(196 из 212; отсутствующие — в PDF на своих страницах).</p><ul><li>Не использовать как нормативный документ; только как историко-технический источник.</li></ul><hr><h2 id=\"s16\">9. ГАЛЕРЕЯ</h2><p>46 рисунков с подписями — в файле <code>РИСУНКИ.md</code> (раздел «Книги и литература» в просмотрщике).</p>", "toc": [["s1", "1. ЗАЧЕМ ЭТА КНИГА ЭКСПЕРТУ", 2], ["s2", "2. СТРУКТУРА КНИГИ", 2], ["s3", "3. КЛЮЧЕВЫЕ ТЕХНИЧЕСКИЕ РЕШЕНИЯ", 2], ["s4", "3.1 Заделка балки в каменную стену (с. 121, фиг. 141)", 3], ["s5", "3.2 Составные и досчатые балки (с. 124—125, фиг. 144, 145)", 3], ["s6", "3.3 Усиление балок (с. 127—130, фиг. 147, 150)", 3], ["s7", "3.4 Стропила (с. 151—163, фиг. 170—182)", 3], ["s8", "3.5 Обшивка и стены (с. 106—120, фиг. 127—138)", 3], ["s9", "3.6 Лестницы (с. 184—186, фиг. 201—202)", 3], ["s10", "3.7 Мосты и арки (с. 187—189, фиг. 203)", 3], ["s11", "4. ТИПЫ СОЕДИНЕНИЙ (СЛОВАРЬ «ЗАМКОВ»)", 2], ["s12", "5. СТАРЫЕ ТЕРМИНЫ → СОВРЕМЕННЫЕ", 2], ["s13", "6. ЕДИНИЦЫ ИЗМЕРЕНИЯ (для перевода в текст заключения)", 2], ["s14", "7. ГДЕ ЭТО ПРИГОДИТСЯ В РАБОТЕ", 2], ["s15", "8. ОГРАНИЧЕНИЯ", 2], ["s16", "9. ГАЛЕРЕЯ", 2]], "chars": 9559, "plain": " ПЛОТНИЧНОЕ ИСКУССТВО (1902) — разбор книги Дементьев. Плотничное искусство , изложенное полковником Дементьевым. Издание четвёртое. — С. Петербург: Книжный склад В. И. Губинского, 1902. 191 с., 212 рисунков. Файл: Книги и Техническая литература\\Плотничное искусство lib2135.pdf (скан с текстовым слоем ABBYY FineReader). Рисунки: figures\\ (196 извлечено, 46 в галерее РИСУНКИ.md ). 1. ЗАЧЕМ ЭТА КНИГА ЭКСПЕРТУ Санкт Петербург — город исторической деревянной и смешанной застройки: деревянные перекрытия по металлическим и деревянным балкам, наслонные стропила, обшивка по стойкам, врубки в обвязках. Книга 1902 года описывает именно те узлы , которые встречаются в обследованиях: как балка заделана в стену, как устроены стропила, какие врубки применялись, где скапливается влага и начинается гниль. Практическая ценность: 1. Идентификация конструкций. По рисунку узла можно определить тип соединения и период постройки, а значит — ожидаемые дефекты. 2. Объяснение дефектов. Многие современные повреждения (гниль торца балки, коррозия скоб, разрыв врубки) заложены самой конструкцией: заделка в стену без воздушного зазора, дерево в каменной кладке, отсутствие гидроизоляции. 3. Обоснование решений. Когда замена, а когда усиление: книга показывает, какие элементы изначально составные (досчатые балки, надделки), и почему их ремонт по исторической технологии допустим. 4. Терминология. Старые названия («замок», «сковородник», «присев», «легель») встречаются в архивных документах и заключениях; без словаря их не прочитать. Ограничение: книга дорасчётная. Размеры в вершках и дюймах, нормы прочности не сопоставимы с современными; использовать как исторический и конструктивный источник, а не как расчётное пособие. Расчёты — по СП 64.13330.2017 и СП 16.13330.2017. 2. СТРУКТУРА КНИГИ Страницы Раздел Содержание Рисунки 3—4 Введение Зачем изданы рисунки; польза для помещиков и сельских хозяев — 5—35 Инструменты Топор, пила, долото, бурав, струг, циркуль, отволока, черта, крючья фиг. 1—50 36—41 Машины Ворот, полиспаст, копёр, баба для забивки свай фиг. 51—56 42—98 Замки и врубки Откосные, торцевые, угловые, проушинные, сковородники, шипы фиг. 57—100 99—105 Сплотка Соединение досок в шпунт, на шипах, щиты фиг. 121—125 106—120 Деревянные дома Обшивка, стойки, закладные рамы, сараи фиг. 127—138 121—135 Балки и перекрытия Заделка в стену, составные и досчатые балки, надделки, накладки фиг. 141—150 136—150 Ограды и фасады Заборы, ворота, калитки, палисад, обшивка фиг. 159—169 151—183 Крыши и стропила Шаг стропил, мауэрлат, легель, обрешётка, конёк, трубы, мансарда фиг. 170—200 184—186 Лестницы Тетивы, врубка ступеней, крепление фиг. 201—202 187—189 Мосты и арки Кружальная система, фермы, свайные опоры фиг. 203 190—191 Указатель Перечень замков и терминов — 3. КЛЮЧЕВЫЕ ТЕХНИЧЕСКИЕ РЕШЕНИЯ 3.1 Заделка балки в каменную стену (с. 121, фиг. 141) Конец балки осмолён и обложен войлоком , закладывается в стену не более 6 вершков (≈ 26,7 см, «на один кирпич»). Для связи со стеной и восприятия нагрузки концы закреплялись железными скобами со штырём . Что это значит при обследовании: торец в кладке — зона постоянного увлажнения и гниения; скоба — зона коррозии. Именно здесь появляются «разрушение заделки» и «прогиб балки». См. 04 Дефекты , Д К03 04. 3.2 Составные и досчатые балки (с. 124—125, фиг. 144, 145) При больших нагрузках балку делали из двух рядов брусьев с зубьями по длине и расклиниванием (фиг. 144). Досчатые балки — три доски на ребро (фиг. 145); причина прямо названа в книге: в досках видно состояние древесины , тогда как середина бревна может быть гнилой. Вывод для эксперта: «составная» балка — не дефект сама по себе; дефект — расстройство зубьев, выпадение клиньев, сдвиг рядов. Проверять соединение, а не только сечение. 3.3 Усиление балок (с. 127—130, фиг. 147, 150) Надделки сверху (фиг. 147): балка выправляется по шаблону, сверху крепится усиливающий элемент. Боковые накладки заподлицо с нижней гранью (фиг. 150). Вывод: исторические усиления — часть конструкции. При обследовании оценивать их достаточность и совместную работу (примечание к п. 5.1.11 ГОСТ 31937 2024). 3.4 Стропила (с. 151—163, фиг. 170—182) Стропильные ноги ставятся поперёк здания с шагом, нижними концами упираются в балку в прирубной и шиповый замок (с. 151). Для подкрёпа — горизонтальный брус легель посередине, соединённый со стропильными ногами замком в сковородник ; чем положе крыша, тем нужнее легель (с. 163). Сечение стропил — брусья 4—5 вершков (17,8—22,2 см). В каменных строениях — мауэрлат и прогоны (фиг. 174—175). Обрешётка: под железную крышу — доски 2½ дюйма (≈ 6,4 см), под деревянную — свои правила; конёк и обход труб — отдельные узлы (фиг. 176—179). Вывод: распор и работа легеля объясняют трещины в коньковых узлах и «разъезд» скатов; при утрате легеля крыша работает иначе. 3.5 Обшивка и стены (с. 106—120, фиг. 127—138) Обшивка дома — дюймовые доски по стойкам из расколотых 2½ дюймовых досок; стойки у углов, у оконных рам и в середине простенков. Закладные рамы и раскосины — жёсткость и связь. Вывод: вентиляционный зазор под обшивкой — критичен; его отсутствие даёт гниль обшивки и венцов. 3.6 Лестницы (с. 184—186, фиг. 201—202) Тетивы — две доски 2½ дюйма; разметка ступеней: подъём около 4 вершков (≈ 17,8 см), проступь не менее 6 вершков (≈ 26,7 см). В тетиве выбираются шпунты шириной 2½ дюйма и глубиной 1 дюйм. Вывод: исторические параметры близки к современным комфортным (подъём 150—180 мм, проступь 270—300 мм); отклонения — признак переделок. 3.7 Мосты и арки (с. 187—189, фиг. 203) Описан деревянный мост кружальной системы (первый в России, 1813 г.): 7 арок, 8 ферм, свайные опоры в 5 рядов. Вывод: термин «кружала» и ферменные схемы полезны при описании исторических большепролётных конструкций. 4. ТИПЫ СОЕДИНЕНИЙ (СЛОВАРЬ «ЗАМКОВ») Название в книге Что это Где применялось Замок откосный простой Соединение под углом со скосом Обвязки, рамы Замок откосный с прирубом Скос с прирубом Углы, стойки Замок откосный зобом (кильсоновый) Скос с «зобом» для упора Ответственные узлы Замок сдвижной (с шипами) Сдвиг по пазу с шипами Сращивание по длине Замок сквозной сковородник Сквозной паз с уступом Стропила, обвязки Замок угловой в накладку Накладка концами или серединой Углы, тонкие доски Замок проушинный (в награду) Проушина и шип Рамы, стойки Угол с присевом Врубка с присевом Рубка деревянных стен Шпунт, шип, фальц Паз, шип, четверть Сплотка, обшивка Стулья, надделки, накладки Опоры и усиления Полы, балки По этим названиям читаются старые описи и дефектные ведомости. 5. СТАРЫЕ ТЕРМИНЫ → СОВРЕМЕННЫЕ В книге Сейчас Балка, брус Балка, брус Стропильная нога Стропильная нога Легель Подкос/ригель стропильной системы (горизонтальный элемент) Затяжка Затяжка (нижний пояс) Мауэрлат, прогон Мауэрлат, прогон Рѣшетина, рѣшётка Обрешётка Конёк Конёк Ендова Ендова Стул Опорный столбик (стул) Надделка Усиление накладкой сверху Присев Врубка с упором (присев) Сковородник Соединение «сковородник» (паз с уступом) Тетива Тетива лестницы Кружала, ферма Кружала, ферма Баба Падающий молот копра Отволока, черта Разметочные инструменты 6. ЕДИНИЦЫ ИЗМЕРЕНИЯ (для перевода в текст заключения) Единица Значение Дюйм 2,54 см Вершок 4,445 см Аршин 71,12 см Сажень 213,36 см Пример: «заложены в стену не более 6 вершков» = около 27 см , «стропила 4—5 вершков» = 18—22 см , «проступь не менее 6 вершков» = 27 см , «подъём около 4 вершков» = 18 см . 7. ГДЕ ЭТО ПРИГОДИТСЯ В РАБОТЕ 1. Идентификация узла при обследовании: сфотографировать узел, сравнить с рисунком, назвать тип соединения. Это усиливает описательную часть заключения. 2. Обоснование причины дефекта: «заделка торца балки в кладку без зазора и гидроизоляции (с. 121, фиг. 141) → увлажнение → гниль/коррозия скобы». 3. Оценка исторических усилений: надделки и накладки (фиг. 147, 150) — оценивать совместную работу, а не считать «посторонним элементом». 4. Стропильные системы: легель и затяжка объясняют распор; отсутствие легеля — причина деформаций скатов. 5. Лестницы: исторические параметры ступеней — база для оценки «соответствия». 6. Терминология в актах и старых заключениях. Связи с библиотекой: 03 Конструктив (К 02, К 03, К 04, К 06), 04 Дефекты (Д К03 01, Д К03 04, Д К03 20, Д К04 10, Д К06 02), 08 Обоснования (О 01, О 04). 8. ОГРАНИЧЕНИЯ Нет расчётов и норм прочности; размеры — эмпирические. Дореволюционная орфография в тексте; термины могут отличаться от современных. Изображения — сканы с просветом; часть рисунков утрачена при извлечении (196 из 212; отсутствующие — в PDF на своих страницах). Не использовать как нормативный документ; только как историко технический источник. 9. ГАЛЕРЕЯ 46 рисунков с подписями — в файле РИСУНКИ.md (раздел «Книги и литература» в просмотрщике). "}, {"id": "book-figures", "file": "13_Книги/РИСУНКИ.md", "title": "РИСУНКИ КНИГИ «ПЛОТНИЧНОЕ ИСКУССТВО»", "section": "13_Книги", "html": "<h1>РИСУНКИ КНИГИ «ПЛОТНИЧНОЕ ИСКУССТВО»</h1><blockquote><p>Дементьев, «Плотничное искусство», 4-е изд., СПб., 1902. Здесь — 50 показательных рисунков: инструменты, врубки, балки, стропила, лестницы, мосты. Каждый рисунок сопровождается пояснением: что изображено и как это применять при обследовании.</p></blockquote><h2 id=\"s1\">Инструменты</h2><h3 id=\"s2\">Фиг. 1. Топор</h3><figure class=\"fig\"><img src=\"assets/books/figures/p005_01_f1.png\" alt=\"Фиг. 1. Топор\" loading=\"lazy\"><figcaption>Фиг. 1. Топор</figcaption></figure><p><strong>Что изображено.</strong> Топор: устройство (обух, носок, лезвие) и приёмы работы. Им перерубают брёвна, отесывают стороны, выбирают четверти и шпунты, забивают гвозди и клинья.</p><p><strong>Зачем эксперту.</strong> Следы топорной обработки на брусьях и балках — признак ручной рубки. По ним отличают историческую конструкцию от поздней заводской и датируют переделку.</p><p><strong>См.:</strong> К-03 · Д-К03-04</p><h3 id=\"s3\">Фиг. 2. Перерубание бревна</h3><figure class=\"fig\"><img src=\"assets/books/figures/p006_01_f2.png\" alt=\"Фиг. 2. Перерубание бревна\" loading=\"lazy\"><figcaption>Фиг. 2. Перерубание бревна</figcaption></figure><p><strong>Что изображено.</strong> Последовательность зарубки: прямой и косой прорубы с двух сторон, скалывание щепы между ними. Так получали ровный торец без пилы.</p><p><strong>Зачем эксперту.</strong> Неровный, «ступенчатый» торец балки в стене — типичный результат такой рубки; он хуже сопротивляется увлажнению и гниению, чем пиленый.</p><p><strong>См.:</strong> К-03 · Д-К03-20</p><h3 id=\"s4\">Фиг. 4. Раскалывание бревна</h3><figure class=\"fig\"><img src=\"assets/books/figures/p007_01_f4.png\" alt=\"Фиг. 4. Раскалывание бревна\" loading=\"lazy\"><figcaption>Фиг. 4. Раскалывание бревна</figcaption></figure><p><strong>Что изображено.</strong> Раскалывание бревна клиньями вдоль волокон: удары по линии слоя, поочерёдное забивание клиньев.</p><p><strong>Зачем эксперту.</strong> Расколотые «пластины» и половинки часто встречаются в старых перекрытиях и обрешётках. Трещины от раскалывания — путь для влаги и гнили.</p><p><strong>См.:</strong> К-03 · Д-К03-20</p><h3 id=\"s5\">Фиг. 5. Выборка шпунта</h3><figure class=\"fig\"><img src=\"assets/books/figures/p008_01_f5.png\" alt=\"Фиг. 5. Выборка шпунта\" loading=\"lazy\"><figcaption>Фиг. 5. Выборка шпунта</figcaption></figure><p><strong>Что изображено.</strong> Выборка прямого шпунта (паза) в брусе топором и долотом: разметка, прорубка, зачистка.</p><p><strong>Зачем эксперту.</strong> Качество шпунта определяет плотность соединения. Разработанный, «разбитый» шпунт — признак расстройства узла и потери совместной работы.</p><p><strong>См.:</strong> К-03 · Д-К03-22</p><h3 id=\"s6\">Фиг. 8—9. Долота</h3><figure class=\"fig\"><img src=\"assets/books/figures/p010_02_f8.png\" alt=\"Фиг. 8—9. Долота\" loading=\"lazy\"><figcaption>Фиг. 8—9. Долота</figcaption></figure><p><strong>Что изображено.</strong> Плоское и полукруглое долота для выборки гнёзд и очистки боковых стенок.</p><p><strong>Зачем эксперту.</strong> Гнёзда под шипы и врубки — концентраторы напряжений и влаги. Выкрошенные края гнезда указывают на перегрузку или гниение.</p><p><strong>См.:</strong> К-03 · Д-К03-22</p><h3 id=\"s7\">Фиг. 10. Медведка</h3><figure class=\"fig\"><img src=\"assets/books/figures/p010_01_f10.png\" alt=\"Фиг. 10. Медведка\" loading=\"lazy\"><figcaption>Фиг. 10. Медведка</figcaption></figure><p><strong>Что изображено.</strong> Медведка — тяжёлый струг для грубой обтёски брёвен; работа двумя руками.</p><p><strong>Зачем эксперту.</strong> Следы медведки (плоские «каннелюры») на бревнах — признак ручной обтёски XIX — начала XX в.</p><p><strong>См.:</strong> К-02</p><h3 id=\"s8\">Фиг. 36. Разметка косых срезов</h3><figure class=\"fig\"><img src=\"assets/books/figures/p026_01_f36.png\" alt=\"Фиг. 36. Разметка косых срезов\" loading=\"lazy\"><figcaption>Фиг. 36. Разметка косых срезов</figcaption></figure><p><strong>Что изображено.</strong> Разметка косых срезов и «изворотистых» поверхностей; плотничный циркуль и приёмы причерчивания.</p><p><strong>Зачем эксперту.</strong> По разметке видно, насколько точно выполнены сопряжения. Зазоры и перекосы в узлах объясняются ошибками разметки, а не только эксплуатацией.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s9\">Фиг. 41—42. Отволока</h3><figure class=\"fig\"><img src=\"assets/books/figures/p029_01_f41.png\" alt=\"Фиг. 41—42. Отволока\" loading=\"lazy\"><figcaption>Фиг. 41—42. Отволока</figcaption></figure><p><strong>Что изображено.</strong> Отволока и черта — инструменты для причерчивания одной доски к другой и переноса линии.</p><p><strong>Зачем эксперту.</strong> Позволяют отличить заводскую геометрию от ручной подгонки: ручная подгонка даёт «мягкие» неровные кромки.</p><p><strong>См.:</strong> К-03</p><h3 id=\"s10\">Фиг. 50. Таскальные крючья</h3><figure class=\"fig\"><img src=\"assets/books/figures/p035_01_f50.png\" alt=\"Фиг. 50. Таскальные крючья\" loading=\"lazy\"><figcaption>Фиг. 50. Таскальные крючья</figcaption></figure><p><strong>Что изображено.</strong> Крючья для перемещения и подъёма брёвен; техника безопасности при работе с тяжёлым лесом.</p><p><strong>Зачем эксперту.</strong> Кованые крючья и скобы встречаются в конструкциях как крепёж; их коррозия — типовая причина ослабления узла.</p><p><strong>См.:</strong> К-05 · Д-К05-01</p><h2 id=\"s11\">Машины</h2><h3 id=\"s12\">Фиг. 55. Копёр</h3><figure class=\"fig\"><img src=\"assets/books/figures/p039_01_f55.png\" alt=\"Фиг. 55. Копёр\" loading=\"lazy\"><figcaption>Фиг. 55. Копёр</figcaption></figure><p><strong>Что изображено.</strong> Копёр для забивки свай: стойки, ворот, оттяжки, направляющие.</p><p><strong>Зачем эксперту.</strong> Свайные основания исторических зданий устраивались такими копрами. Обнаружение свай требует шурфов и сейсмоакустики (п. 5.2.19 ГОСТ).</p><p><strong>См.:</strong> К-01 · Д-К01-04</p><h3 id=\"s13\">Фиг. 56. Баба</h3><figure class=\"fig\"><img src=\"assets/books/figures/p041_01_f56.png\" alt=\"Фиг. 56. Баба\" loading=\"lazy\"><figcaption>Фиг. 56. Баба</figcaption></figure><p><strong>Что изображено.</strong> Баба — чугунный молот копра; подъём и сброс по направляющим.</p><p><strong>Зачем эксперту.</strong> Следы забивки (смятие головы сваи) видны при вскрытии и помогают оценить её состояние.</p><p><strong>См.:</strong> К-01</p><h2 id=\"s14\">Соединения</h2><h3 id=\"s15\">Фиг. 57. Замок откосный простой</h3><figure class=\"fig\"><img src=\"assets/books/figures/p042_01_f57.png\" alt=\"Фиг. 57. Замок откосный простой\" loading=\"lazy\"><figcaption>Фиг. 57. Замок откосный простой</figcaption></figure><p><strong>Что изображено.</strong> Соединение двух брусьев под углом со скошенными концами — простейший откосный замок.</p><p><strong>Зачем эксперту.</strong> Расстройство такого узла даёт перекос рамы или обвязки; на фото фиксируется зазор по скосу.</p><p><strong>См.:</strong> К-05 · Д-К05-04</p><h3 id=\"s16\">Фиг. 58. Откосный с прирубом</h3><figure class=\"fig\"><img src=\"assets/books/figures/p043_01_f58.png\" alt=\"Фиг. 58. Откосный с прирубом\" loading=\"lazy\"><figcaption>Фиг. 58. Откосный с прирубом</figcaption></figure><p><strong>Что изображено.</strong> Откосный замок с прирубом: дополнительная площадка для упора, воспринимает сдвиг.</p><p><strong>Зачем эксперту.</strong> При потере прируба узел работает как простой — появляется подвижность и перекос.</p><p><strong>См.:</strong> К-05</p><h3 id=\"s17\">Фиг. 59. Откосный зобом</h3><figure class=\"fig\"><img src=\"assets/books/figures/p044_01_f59.png\" alt=\"Фиг. 59. Откосный зобом\" loading=\"lazy\"><figcaption>Фиг. 59. Откосный зобом</figcaption></figure><p><strong>Что изображено.</strong> Замок «зобом» (
