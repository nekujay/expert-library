</li></ul><h3 id=\"s23\">Т-022. Усиление</h3><ul><li><strong>Определение:</strong> комплекс мероприятий, обеспечивающих повышение несущей способности</li></ul><p>и эксплуатационных свойств конструкции или здания в целом, включая грунты основания, по сравнению с фактическим состоянием или проектными показателями.</p><ul><li><strong>Норма:</strong> п. 3.27. <strong>См.:</strong> Т-003, О-05.</li></ul><h3 id=\"s24\">Т-023. Физический износ здания</h3><ul><li><strong>Определение:</strong> ухудшение технических и связанных с ними эксплуатационных показателей</li></ul><p>здания, вызванное объективными причинами.</p><ul><li><strong>Норма:</strong> п. 3.28.</li></ul><hr><h2 id=\"s25\">2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ)</h2><h3 id=\"s26\">Т-101. Надподвальное перекрытие</h3><ul><li><strong>Смысл:</strong> перекрытие над подвалом/техподпольем, отделяющее подвал от первого этажа.</li><li><strong>Практика:</strong> в архивных заключениях пишется ошибочно раздельно — «над подвальное</li></ul><p>перекрытие». Правильно: <strong>надподвальное</strong>.</p><ul><li><strong>См.:</strong> К-03, Д-К03.</li></ul><h3 id=\"s27\">Т-102. Чердачное перекрытие</h3><ul><li><strong>Смысл:</strong> перекрытие над верхним этажом, отделяющее его от чердака.</li><li><strong>См.:</strong> К-03.</li></ul><h3 id=\"s28\">Т-103. Межбалочное заполнение</h3><ul><li><strong>Смысл:</strong> заполнение между металлическими/деревянными балками: бетон на кирпичном бое,</li></ul><p>сводики, деревянные щиты, монолитный бетон.</p><ul><li><strong>Практика:</strong> от типа заполнения зависит нагрузка и характер разрушения; при сквозной</li></ul><p>коррозии балок заполнение часто сохраняется и представляет опасность обрушения.</p><ul><li><strong>См.:</strong> К-03.</li></ul><h3 id=\"s29\">Т-104. Сквозная коррозия</h3><ul><li><strong>Смысл:</strong> коррозия, поразившая сечение элемента насквозь, с потерей несущей способности</li></ul><p>(в заключениях — «до 100 %»).</p><ul><li><strong>Практика:</strong> при сквозной коррозии сортамент определить невозможно; поверочный расчёт</li></ul><p>не выполняется, состояние аварийное.</p><ul><li><strong>См.:</strong> Д-К05, Д-К03.</li></ul><h3 id=\"s30\">Т-105. Поверхностная коррозия</h3><ul><li><strong>Смысл:</strong> коррозия без потери сечения насквозь, с поверхностным поражением.</li><li><strong>Практика:</strong> в архивных заключениях указывают процент поражения (например, «до 11 %»).</li></ul><h3 id=\"s31\">Т-106. Сортамент</h3><ul><li><strong>Смысл:</strong> типоразмер прокатного профиля (двутавр № 10 по ОСТ 16-1926, 20Б1 и т. п.).</li><li><strong>Практика:</strong> в исторической застройке — профили по ОСТ 16-1926 и старым ГОСТ; при</li></ul><p>невозможности идентификации писать «сортамент определить невозможно».</p><ul><li><strong>См.:</strong> СПРАВОЧНИК.</li></ul><h3 id=\"s32\">Т-107. Косоур</h3><ul><li><strong>Смысл:</strong> наклонная несущая балка лестницы, на которую опираются ступени/площадки.</li><li><strong>См.:</strong> К-04.</li></ul><h3 id=\"s33\">Т-108. Перемычка</h3><ul><li><strong>Смысл:</strong> конструкция над проёмом, перекрывающая его и передающая нагрузку на стены.</li></ul><p>В исторической застройке — металлические двутавровые балки, клинчатые и арочные кирпичные перемычки.</p><ul><li><strong>См.:</strong> К-02, Д-К02.</li></ul><h3 id=\"s34\">Т-109. Дефектная ведомость</h3><ul><li><strong>Смысл:</strong> таблица выявленных дефектов с локализацией, параметрами, причиной и ссылкой</li></ul><p>на фото. Обязательное приложение к заключению (приложение А/Б ГОСТ 31937-2024).</p><ul><li><strong>См.:</strong> Ш-РЕЗ.</li></ul><h3 id=\"s35\">Т-110. Шифр</h3><ul><li><strong>Смысл:</strong> обозначение работы, например <code>06/1-08-2026-АВР</code>; в содержании —</li></ul><p><code>.../С</code>, <code>.../ТЗ</code>.</p><ul><li><strong>См.:</strong> Ш-ТЗ.</li></ul><h3 id=\"s36\">Т-111. ОКН (объект культурного наследия)</h3><ul><li><strong>Смысл:</strong> объект, включённый в реестр (или выявленный), с особым режимом работ;</li></ul><p>ссылки — ГОСТ Р 55567-2013 и задание КГИОП.</p><ul><li><strong>См.:</strong> О-07, Ш-ОП.</li></ul><h3 id=\"s37\">Т-112. Крен</h3><ul><li><strong>Смысл:</strong> отклонение здания или конструкции от вертикали; нормируется и измеряется</li></ul><p>геодезически; в форме заключения ГОСТ — «крен вдоль продольной и поперечной осей / предельное значение».</p><ul><li><strong>См.:</strong> Д-К01, КРИТЕРИИ.</li></ul><h3 id=\"s38\">Т-113. Прогиб</h3><ul><li><strong>Смысл:</strong> вертикальное перемещение элемента под нагрузкой; нормируется в долях пролёта</li></ul><p>(например, 1/150 для плит, 1/300 и 1/700 для преднапряжённых балок и ферм).</p><ul><li><strong>См.:</strong> Д-К03, КРИТЕРИИ.</li></ul><h3 id=\"s39\">Т-114. Рабочая арматура / анкеровка</h3><ul><li><strong>Смысл:</strong> продольная арматура, воспринимающая растягивающие усилия; анкеровка — заделка</li></ul><p>арматуры в бетоне/узле.</p><ul><li><strong>См.:</strong> К-03, МЕТОДИКИ.</li></ul><h3 id=\"s40\">Т-115. Вскрытие (контрольное)</h3><ul><li><strong>Смысл:</strong> локальное удаление отделочных слоёв/бетона для измерения сечений, армирования,</li></ul><p>состояния узлов; обязательный элемент детального обследования.</p><ul><li><strong>См.:</strong> МЕТОДИКИ.</li></ul><hr><h2 id=\"s41\">3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ</h2><div class=\"tablewrap\"><table><thead><tr><th>Неверно</th><th>Верно</th><th>Норма</th></tr></thead><tbody><tr><td>«над подвальное перекрытие»</td><td>надподвальное перекрытие</td><td>практика</td></tr><tr><td>«ГОСТ 31937» без года</td><td>ГОСТ 31937-2024</td><td>п. 1</td></tr><tr><td>«ГОСТ Р 31937-2011»</td><td>ГОСТ 31937-2011 (межгосударственный)</td><td>обозначение</td></tr><tr><td>«ограниченно работоспособное»</td><td>ограниченно-работоспособное</td><td>п. 3.18</td></tr><tr><td>«аварийное состояние» как «плохое»</td><td>аварийное = исчерпание несущей способности</td><td>п. 3.1</td></tr><tr><td>«износ» = «категория состояния»</td><td>физический износ ≠ категория</td><td>п. 3.28</td></tr><tr><td>«обследование» = «экспертиза»</td><td>обследование — изыскания; судебная экспертиза — вне ГОСТ</td><td>раздел 1</td></tr><tr><td>«усиление» = «восстановление»</td><td>усиление повышает, восстановление возвращает</td><td>пп. 3.3, 3.27</td></tr></tbody></table></div><hr><h2 id=\"s42\">4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок)</h2><div class=\"tablewrap\"><table><thead><tr><th>Русский</th><th>English</th></tr></thead><tbody><tr><td>обследование технического состояния</td><td>technical inspection / condition survey</td></tr><tr><td>техническое заключение</td><td>technical report / expert opinion</td></tr><tr><td>аварийное состояние</td><td>emergency (unsafe) condition</td></tr><tr><td>ограниченно-работоспособное</td><td>limited serviceable condition</td></tr><tr><td>работоспособное</td><td>serviceable condition</td></tr><tr><td>нормативное</td><td>normal (design-compliant) condition</td></tr><tr><td>несущая способность</td><td>load-bearing capacity</td></tr><tr><td>дефект / повреждение</td><td>defect / damage</td></tr><tr><td>поверочный расчёт</td><td>verification (checking) calculation</td></tr><tr><td>мониторинг</td><td>monitoring</td></tr><tr><td>усиление</td><td>strengthening</td></tr><tr><td>восстановление</td><td>restoration / rehabilitation</td></tr></tbody></table></div>", "toc": [["s1", "1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937-2024, раздел 3)", 2], ["s2", "Т-001. Аварийное техническое состояние", 3], ["s3", "Т-002. Безопасность эксплуатации здания (сооружения)", 3], ["s4", "Т-003. Восстановление", 3], ["s5", "Т-004. Дефект (повреждение) системы инженерно-технического обеспечения", 3], ["s6", "Т-005. Дефект (повреждение) строительной конструкции", 3], ["s7", "Т-006. Динамические параметры зданий (сооружений)", 3], ["s8", "Т-007. Заказчик", 3], ["s9", "Т-008. Категория технического состояния", 3], ["s10", "Т-009. Комплексное обследование технического состояния", 3], ["s11", "Т-010. Критерий оценки технического состояния", 3], ["s12", "Т-011. Механическая безопасность здания (сооружения)", 3], ["s13", "Т-012. Мониторинг технического состояния (виды)", 3], ["s14", "Т-013. Нормативное техническое состояние", 3], ["s15", "Т-014. Обследование технического состояния здания (сооружения)", 3], ["s16", "Т-015. Ограниченно-работоспособное техническое состояние", 3], ["s17", "Т-016. Оценка технического состояния", 3], ["s18", "Т-017. Поверочный расчёт", 3], ["s19", "Т-018. Работоспособное техническое состояние", 3], ["s20", "Т-019. Система мониторинга инженерно-технического обеспечения / несущих конструкций", 3], ["s21", "Т-020. Специализированная организация", 3], ["s22", "Т-021. Текущее техническое состояние / текущие динамические параметры", 3], ["s23", "Т-022. Усиление", 3], ["s24", "Т-023. Физический износ здания", 3], ["s25", "2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ)", 2], ["s26", "Т-101. Надподвальное перекрытие", 3], ["s27", "Т-102. Чердачное перекрытие", 3], ["s28", "Т-103. Межбалочное заполнение", 3], ["s29", "Т-104. Сквозная коррозия", 3], ["s30", "Т-105. Поверхностная коррозия", 3], ["s31", "Т-106. Сортамент", 3], ["s32", "Т-107. Косоур", 3], ["s33", "Т-108. Перемычка", 3], ["s34", "Т-109. Дефектная ведомость", 3], ["s35", "Т-110. Шифр", 3], ["s36", "Т-111. ОКН (объект культурного наследия)", 3], ["s37", "Т-112. Крен", 3], ["s38", "Т-113. Прогиб", 3], ["s39", "Т-114. Рабочая арматура / анкеровка", 3], ["s40", "Т-115. Вскрытие (контрольное)", 3], ["s41", "3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ", 2], ["s42", "4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок)", 2]], "chars": 14815, "plain": " ТЕЗАУРУС Единый словарь терминов для заключений. Основа — ГОСТ 31937 2024 (раздел 3), дополнено терминами практики из архива ТЗ и последних экспертиз. Формулировки государственного стандарта приводятся как нормативные; практические — как рабочие. Связанные разделы: 06 Оценка состояния , 04 Дефекты , 03 Конструктив . 1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937 2024, раздел 3) Т 001. Аварийное техническое состояние Определение: категория технического состояния строительной конструкции или здания (сооружения) в целом, включая состояние грунтов основания, характеризующаяся повреждениями и деформациями, свидетельствующими об исчерпании несущей способности и опасности обрушения, и/или характеризующаяся кренами, которые могут вызвать потерю устойчивости объекта. Норма: ГОСТ 31937 2024, п. 3.1. Практика: эксплуатация не допускается; противоаварийные мероприятия; обязательный мониторинг до приведения в работоспособное состояние (п. 4.5). См.: О 01, Ш ВЫВ. Т 002. Безопасность эксплуатации здания (сооружения) Определение: комплексное свойство объекта, не позволяющее ему перейти в аварийное состояние; определяется проектным решением и степенью его реального воплощения, текущим остаточным ресурсом и техническим состоянием, степенью изменения объекта и окружающей среды, совокупностью антитеррористических мероприятий и нормативами по эксплуатации. Норма: п. 3.2. Т 003. Восстановление Определение: комплекс мероприятий, обеспечивающих доведение эксплуатационных качеств конструкций, пришедших в ограниченно работоспособное состояние, до уровня их первоначального состояния, определяемого требованиями нормативных документов на момент проектирования восстановления объекта. Норма: п. 3.3. Отличие от усиления: восстановление — до исходного уровня, усиление — выше исходного. См.: Т 014 (усиление). Т 004. Дефект (повреждение) системы инженерно технического обеспечения Определение: отдельное несоответствие системы или её части какому либо параметру, установленному проектом или нормами, приводящее к ухудшению технического состояния системы. Норма: п. 3.4. Т 005. Дефект (повреждение) строительной конструкции Определение: отдельное несоответствие строительной конструкции какому либо параметру, установленному проектом или нормами, приводящее к ухудшению технического состояния конструкции или здания (сооружения). Норма: п. 3.5. Практика: «дефект» и «повреждение» в стандарте используются как синонимы; в заключении допустимо писать «дефекты (повреждения)». Т 006. Динамические параметры зданий (сооружений) Определение: параметры, характеризующие динамические свойства: периоды и декременты собственных колебаний основного тона и обертонов, передаточные функции объектов, их частей и элементов. Норма: п. 3.6. Т 007. Заказчик Определение: собственник здания (сооружения) или иное лицо, определённое собственником ответственным за заключение договора со специализированной организацией. Норма: п. 3.7. Т 008. Категория технического состояния Определение: степень эксплуатационной пригодности и обеспечения механической безопасности строительной конструкции или здания (сооружения) в целом, а также грунтов их основания, установленная в зависимости от доли снижения несущей способности и эксплуатационных характеристик. Норма: п. 3.8. См.: КРИТЕРИИ ОЦЕНКИ. Т 009. Комплексное обследование технического состояния Определение: специальный вид инженерных изысканий: комплекс мероприятий по определению и оценке фактических значений контролируемых параметров грунтов основания, строительных конструкций, инженерного обеспечения, характеризующих функциональную работоспособность объекта и определяющих возможность дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта; включает обследование конструкций, теплотехнических и акустических свойств, систем инженерного обеспечения, за исключением технологического оборудования. Норма: п. 3.9. Т 010. Критерий оценки технического состояния Определение: установленное проектом или нормативным документом количественное или качественное значение параметра, характеризующего переход в предельное состояние и другие нормируемые характеристики конструкции, свойств материалов, грунтов основания и систем инженерно технического обеспечения. Норма: п. 3.10. Т 011. Механическая безопасность здания (сооружения) Определение: состояние строительных конструкций и основания, при котором отсутствует недопустимый риск, связанный с причинением вреда жизни или здоровью граждан, имуществу, окружающей среде, жизни и здоровью животных и растений вследствие разрушения или потери устойчивости здания (сооружения) или его части. Норма: п. 3.11. См.: 384 ФЗ. Т 012. Мониторинг технического состояния (виды) 3.12 — ограниченно работоспособных и аварийных: наблюдение и контроль по программе за степенью и скоростью изменения параметров, экстренные меры против обрушения или опрокидывания, до приведения в работоспособное состояние. 3.13 — зоны влияния строительства и природно техногенных воздействий. 3.14 — уникальных зданий: раннее обнаружение негативных изменений НДС, крена. 3.17 — общий мониторинг: для объектов со значительными изменениями НДС или крена. Норма: пп. 3.12—3.14, 3.17; раздел 6. Т 013. Нормативное техническое состояние Определение: категория, при которой количественные и качественные значения параметров всех критериев оценки соответствуют установленным в проектной документации значениям и действующим нормам на момент обследования. Норма: п. 3.15. Т 014. Обследование технического состояния здания (сооружения) Определение: специальный вид инженерных изысканий: комплекс мероприятий по определению и оценке фактических значений контролируемых параметров, характеризующих работоспособность объекта и определяющих возможность его дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта, демонтажа (сноса); включает обследование грунтов основания и строительных конструкций на предмет выявления изменения свойств грунтов, деформационных повреждений, дефектов несущих и ограждающих конструкций и определения их фактической несущей способности. Норма: п. 3.16. Т 015. Ограниченно работоспособное техническое состояние Определение: категория, при которой имеются крены, дефекты и повреждения, приведшие к снижению несущей способности, и/или достаточность несущей способности не подтверждается поверочными расчётами, но отсутствует опасность внезапного разрушения, потери устойчивости или опрокидывания; функционирование конструкций и эксплуатация возможны либо при контроле (мониторинге), либо при проведении мероприятий по обеспечению механической безопасности, восстановлению или усилению конструкций и/или грунтов основания и последующем мониторинге (при необходимости). Норма: п. 3.18. Практическое правило: ставить эту категорию только при наличии дефектов, снизивших несущую способность, либо при неподтверждённой расчётом несущей способности. Если дефектов нет — «работоспособное». Т 016. Оценка технического состояния Определение: установление степени повреждения и категории технического состояния конструкций или зданий (сооружений) в целом, включая грунты основания, на основе сопоставления фактических значений количественно оцениваемых признаков со значениями этих же признаков, установленных проектом или нормативным документом. Норма: п. 3.19. Т 017. Поверочный расчёт Определение: расчёт существующей конструкции и/или грунтов основания по действующим нормам проектирования с введением в расчёт полученных при обследовании геометрических параметров, прочности материалов и грунтов, действующих нагрузок, уточнённой расчётной схемы с учётом имеющихся дефектов и повреждений. Норма: п. 3.20. Т 018. Работоспособное техническое состояние Определение: категория, при которой некоторые из оцениваемых контролируемых параметров не отвечают требованиям проекта или норм, но нарушения в конкретных условиях эксплуатации не приводят к нарушению работоспособности; необходимая несущая способность конструкций и грунтов основания с учётом влияния дефектов и механическая безопасность обеспечиваются. Норма: п. 3.21. Т 019. Система мониторинга инженерно технического обеспечения / несущих конструкций 3.22 — технические и программные средства сбора и обработки информации о параметрах работы системы ИТО, контроль дестабилизирующих факторов и передача сообщений об аварийных ситуациях. 3.23 — средства сбора и обработки информации о геодезических, динамических, деформационных и других параметрах конструкций и скорости их изменения. Норма: пп. 3.22—3.23. Т 020. Специализированная организация Определение: организация, имеющая право выполнения работ по обследованию и мониторингу зданий (сооружений) в соответствии с требованиями действующего национального законодательства. Норма: п. 3.24. Т 021. Текущее техническое состояние / текущие динамические параметры Определение: состояние (динамические параметры) на момент обследования или проводимого этапа мониторинга. Норма: пп. 3.25—3.26. Т 022. Усиление Определение: комплекс мероприятий, обеспечивающих повышение несущей способности и эксплуатационных свойств конструкции или здания в целом, включая грунты основания, по сравнению с фактическим состоянием или проектными показателями. Норма: п. 3.27. См.: Т 003, О 05. Т 023. Физический износ здания Определение: ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами. Норма: п. 3.28. 2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ) Т 101. Надподвальное перекрытие Смысл: перекрытие над подвалом/техподпольем, отделяющее подвал от первого этажа. Практика: в архивных заключениях пишется ошибочно раздельно — «над подвальное перекрытие». Правильно: надподвальное . См.: К 03, Д К03. Т 102. Чердачное перекрытие Смысл: перекрытие над верхним этажом, отделяющее его от чердака. См.: К 03. Т 103. Межбалочное заполнение Смысл: заполнение между металлическими/деревянными балками: бетон на кирпичном бое, сводики, деревянные щиты, монолитный бетон. Практика: от типа заполнения зависит нагрузка и характер разрушения; при сквозной коррозии балок заполнение часто сохраняется и представляет опасность обрушения. См.: К 03. Т 104. Сквозная коррозия Смысл: коррозия, поразившая сечение элемента насквозь, с потерей несущей способности (в заключениях — «до 100 %»). Практика: при сквозной коррозии сортамент определить невозможно; поверочный расчёт не выполняется, состояние аварийное. См.: Д К05, Д К03. Т 105. Поверхностная коррозия Смысл: коррозия без потери сечения насквозь, с поверхностным поражением. Практика: в архивных заключениях указывают процент поражения (например, «до 11 %»). Т 106. Сортамент Смысл: типоразмер прокатного профиля (двутавр № 10 по ОСТ 16 1926, 20Б1 и т. п.). Практика: в исторической застройке — профили по ОСТ 16 1926 и старым ГОСТ; при невозможности идентификации писать «сортамент определить невозможно». См.: СПРАВОЧНИК. Т 107. Косоур Смысл: наклонная несущая балка лестницы, на которую опираются ступени/площадки. См.: К 04. Т 108. Перемычка Смысл: конструкция над проёмом, перекрывающая его и передающая нагрузку на стены. В исторической застройке — металлические двутавровые балки, клинчатые и арочные кирпичные перемычки. См.: К 02, Д К02. Т 109. Дефектная ведомость Смысл: таблица выявленных дефектов с локализацией, параметрами, причиной и ссылкой на фото. Обязательное приложение к заключению (приложение А/Б ГОСТ 31937 2024). См.: Ш РЕЗ. Т 110. Шифр Смысл: обозначение работы, например 06/1 08 2026 АВР ; в содержании — .../С , .../ТЗ . См.: Ш ТЗ. Т 111. ОКН (объект культурного наследия) Смысл: объект, включённый в реестр (или выявленный), с особым режимом работ; ссылки — ГОСТ Р 55567 2013 и задание КГИОП. См.: О 07, Ш ОП. Т 112. Крен Смысл: отклонение здания или конструкции от вертикали; нормируется и измеряется геодезически; в форме заключения ГОСТ — «крен вдоль продольной и поперечной осей / предельное значение». См.: Д К01, КРИТЕРИИ. Т 113. Прогиб Смысл: вертикальное перемещение элемента под нагрузкой; нормируется в долях пролёта (например, 1/150 для плит, 1/300 и 1/700 для преднапряжённых балок и ферм). См.: Д К03, КРИТЕРИИ. Т 114. Рабочая арматура / анкеровка Смысл: продольная арматура, воспринимающая растягивающие усилия; анкеровка — заделка арматуры в бетоне/узле. См.: К 03, МЕТОДИКИ. Т 115. Вскрытие (контрольное) Смысл: локальное удаление отделочных слоёв/бетона для измерения сечений, армирования, состояния узлов; обязательный элемент детального обследования. См.: МЕТОДИКИ. 3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ Неверно Верно Норма «над подвальное перекрытие» надподвальное перекрытие практика «ГОСТ 31937» без года ГОСТ 31937 2024 п. 1 «ГОСТ Р 31937 2011» ГОСТ 31937 2011 (межгосударственный) обозначение «ограниченно работоспособное» ограниченно работоспособное п. 3.18 «аварийное состояние» как «плохое» аварийное = исчерпание несущей способности п. 3.1 «износ» = «категория состояния» физический износ ≠ категория п. 3.28 «обследование» = «экспертиза» обследование — изыскания; судебная экспертиза — вне ГОСТ раздел 1 «усиление» = «восстановление» усиление повышает, восстановление возвращает пп. 3.3, 3.27 4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок) Русский English обследование технического состояния technical inspection / condition survey техническое заключение technical report / expert opinion аварийное состояние emergency (unsafe) condition ограниченно работоспособное limited serviceable condition работоспособное serviceable condition нормативное normal (design compliant) condition несущая способность load bearing capacity дефект / повреждение defect / damage поверочный расчёт verification (checking) calculation мониторинг monitoring усиление strengthening восстановление restoration / rehabilitation "}, {"id": "construct", "file": "03_Конструктив/ИНДЕКС_КОНСТРУКТИВА.md", "title": "ИНДЕКС КОНСТРУКТИВА (К-01…К-10)", "section": "03_Конструктив", "html": "<h1>ИНДЕКС КОНСТРУКТИВА (К-01…К-10)</h1><blockquote><p>Что обследовать по каждому элементу: состав работ, параметры, типовые дефекты, ссылки на норму. Основа — ГОСТ 31937-2024, разделы 5.2—5.7, и практика архива ТЗ (~700 прочитанных отчётов; перекрытия — 627, кирпичные стены — 551, металл — 515). Дефекты — в <code>04_Дефекты</code>, методики — в <code>05_Методики</code>, критерии — в <code>06_Оценка</code>.</p></blockquote><p><strong>Смежные:</strong> <a href=\"#/doc/sp368\">СП 368</a> — проектирование усиления и замены; <a href=\"#/doc/sp547\">СП 547</a> — оценка износа.</p><hr><h2 id=\"s1\">К-01. Основания и фундаменты, грунты, осадки</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.2; СП 22.13330.2016; СП 24.13330.2021; СП 446.1325800.2019.</p><p><strong>Состав работ (5.2.2):</strong></p><ul><li>изучение фондовых изысканий на участке и соседних, планировки и благоустройства;</li><li>изучение материалов по конструктивному решению фундаментов;</li><li>проходка шурфов вблизи фундаментов;</li><li>проведение или актуализация инженерно-геологических изысканий;</li><li>обследование свайных фундаментов, определение фактической длины и состояния свай.</li></ul><p><strong>Что устанавливают (5.2.3):</strong></p><ul><li>геологическое строение участка;</li><li>тип фундаментов, форма в плане, размер, глубина заложения, ранее выполненные усиления;</li><li>повреждения фундаментов, прочность материалов;</li><li>пробы материалов фундаментов и грунтов из-под подошвы;</li><li>наличие и состояние гидроизоляции, УГВ, температура и агрессивность вод.</li></ul><p><strong>Ключевые цифры:</strong></p><ul><li>глубина шурфа — <strong>на 0,15 м ниже подошвы</strong> (5.2.7);</li><li>число шурфов — по величинам нагрузок на фундаменты (5.2.6);</li><li>при деформациях стен и фундаментов шурфы <strong>обязательны</strong> (5.2.6);</li><li>после работ — засыпка с трамбованием, восстановление покрытия и отмостки (5.2.18).</li></ul><p><strong>Критерии визуальной оценки (5.2.14):</strong> неравномерная осадка; деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции.</p><p><strong>Типовые дефекты:</strong> Д-К01-01 неравномерная осадка; Д-К01-02 разрушение тела фундамента; Д-К01-03 отсутствие/разрушение гидроизоляции; Д-К01-04 разуплотнение грунта; Д-К01-05 крен.</p><p><strong>Признак в заключении:</strong> «Неравномерная осадка … подтверждается …»; трещины в стенах с раскрытием кверху/книзу — диагностический признак (см. Д-К02-06…Д-К02-09).</p><hr><h2 id=\"s2\">К-02. Стены несущие (каменные, панельные, монолитные)</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, пп. 5.3.2, 5.3.1; СП 15.13330.2020; СП 63.13330.2018.</p><h3 id=\"s3\">К-02.1 Каменные (кирпичные) стены — основа архива</h3><p><strong>Что устанавливают (5.3.2.1):</strong></p><ul><li>материал конструкций;</li><li>дефекты и деформации: отклонения от вертикали, неравномерные осадки, выпучивания,</li></ul><p>выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки и штукатурки, выпадение кирпичей, капиллярный подсос;</p><ul><li>выборочное контрольное зондирование кладки, отбор проб из разных слоёв (влажность,</li></ul><p>объёмная масса);</p><ul><li>наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек.</li></ul><p><strong>Прочность (5.3.2.2—5.3.2.4):</strong> лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690); керны бетона — ГОСТ 28570; бут — ГОСТ 4001; расчётные сопротивления — по СП 15.13330.2020.</p><p><strong>Типовые дефекты:</strong> Д-К02-01 трещины вертикальные/наклонные; Д-К02-02 выпучивание; Д-К02-03 отклонение от вертикали; Д-К02-04 отколы, пробоины; Д-К02-05 увлажнение, высолы; Д-К02-06…09 трещины как признак просадки; Д-К02-10 разрушение перемычек.</p><h3 id=\"s4\">К-02.2 Панельные и монолитные стены</h3><p><strong>Норма:</strong> п. 5.3.1 (ж.-б.), для панельных — обязательная проверка стыков, сварки, закладных (5.3.1.25). <strong>Типовые дефекты:</strong> раскрытие трещин по швам, коррозия закладных, разрушение герметизации, отклонения от вертикали.</p><hr><h2 id=\"s5\">К-03. Перекрытия и покрытия</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, пп. 5.3.1 (ж.-б.), 5.3.3 (сталь), 5.3.4 (дерево); СП 63.13330.2018, СП 16.13330.2017, СП 64.13330.2017, СП 20.13330.2016.</p><h3 id=\"s6\">К-03.1 По металлическим балкам (доминирующий тип в архиве)</h3><p><strong>Что устанавливают:</strong></p><ul><li>схема: пролёт в свету, шаг балок, опирание (на кирпичную стену, на перемычку, заделка);</li><li>сечение и сортамент (двутавр, швеллер; ОСТ 16-1926, старые ГОСТ);</li><li>межбалочное заполнение (бетон на кирпичном бое, сводики, деревянные щиты);</li><li>покрытие (стяжка, плитка, асфальтобетон, дощатый настил);</li><li>состояние балок: коррозия (поверхностная/сквозная), прогиб, деформации, состояние</li></ul><p>опорных узлов и заделки.</p><p><strong>Ключевые нормы (5.3.3):</strong> толщину корродированных элементов измерять <strong>не менее чем в трёх наиболее повреждённых сечениях</strong>, в каждом — <strong>не менее трёх измерений</strong> (5.3.3.13); назначать редуцированные сечения (5.3.3.12).</p><p><strong>Типовые дефекты:</strong> Д-К03-01 сквозная коррозия балок; Д-К03-02 поверхностная коррозия; Д-К03-03 прогиб; Д-К03-04 разрушение заделки в стену; Д-К03-05 обрушение участка; Д-К03-06 недостаточная площадка опирания; Д-К03-07 промерзание/протечки.</p><p><strong>Диагностический признак аварийности:</strong> «сортамент определить невозможно ввиду полного разрушения конструкций» + «исчерпание несущей способности» → аварийное.</p><h3 id=\"s7\">К-03.2 Железобетонные (сборные и монолитные)</h3><p><strong>Что устанавливают (5.3.1.1, 5.3.1.21):</strong> геометрия и сечения; сопоставление с проектом; соответствие статической схемы; трещины, отколы, разрушения; ширина раскрытия; защитный слой; прогибы; сцепление арматуры с бетоном; разрыв арматуры; анкеровка; коррозия бетона и арматуры.</p><p><strong>Число участков (5.3.1.8):</strong> 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций; конструкций — не менее трёх.</p><p><strong>Типовые дефекты:</strong> Д-К03-10 трещины (нормальные, наклонные); Д-К03-11 сколы в сжатой зоне; Д-К03-12 отслоение защитного слоя; Д-К03-13 коррозия арматуры; Д-К03-14 выпучивание сжатой арматуры и шелушение бетона; прогиб сверх нормативного — Д-К03-03.</p><h3 id=\"s8\">К-03.3 Деревянные перекрытия</h3><p><strong>Норма:</strong> п. 5.3.4; СП 64.13330.2017. <strong>Что устанавливают (5.3.4.1, 5.3.6.11):</strong> схема, сечения, пролёты, условия опирания; влажность (ГОСТ 16483.7, 16588); биоповреждения (ГОСТ 18610); прогибы; состояние узлов; наличие и состояние утеплителя, пароизоляции; протечки. <strong>Важно (5.3.4.5):</strong> расчётные сопротивления древесины, не поражённой гнилью, — как для новой; при поверхностном разрушении гнилью сечение уменьшают. <strong>Типовые дефекты:</strong> Д-К03-20 гниль; Д-К03-21 прогиб; Д-К03-22 расстройство узлов; Д-К03-23 отсутствие/утрата элемента наката.</p><p><strong>Типовые узлы (серия 2.140-6):</strong> <a href=\"#/figures/series-01\">Узел 1</a> и <a href=\"#/figures/series-02\">Узел 2</a> — цокольное перекрытие; остальные узлы, включая <a href=\"#/figures/series-27\">АМ-1</a>, — в разделе «Иллюстрации» → «Серия 2.140-6». На листах: черепные бруски, щиты наката, гидроизоляция, продухи, утеплитель и пароизоляция.</p><hr><h2 id=\"s9\">К-04. Балконы, лоджии, эркеры, крыльца, лестницы, козырьки</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.3.6.1—5.3.6.4.</p><h3 id=\"s10\">К-04.1 Балконы, эркеры, лоджии</h3><p><strong>Что устанавливают (5.3.6.1):</strong></p><ul><li>расчётная схема и материал несущих конструкций;</li><li>размеры: длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов,</li></ul><p>бортовых балок, расстояния между несущими балками;</p><ul><li>состояние несущих конструкций: трещины на плитах, прогибы, коррозия стальных балок</li></ul><p>и арматуры, сохранность покрытий и стяжек, уклоны плит;</p><ul><li>состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий,</li></ul><p>трещины в местах примыкания эркеров, гидроизоляция;</p><ul><li>состояние стоек, консолей, подкосов, кронштейнов, подвесок.</li></ul><p><strong>Вскрытия (5.3.6.2):</strong> для установления сечений несущих элементов и оценки заделки в стену; места — по расчётной схеме.</p><p><strong>Типовые дефекты:</strong> Д-К04-01 разрушение плиты; Д-К04-02 коррозия консольных балок; Д-К04-03 разрушение заделки; Д-К04-04 отсутствие/разрушение гидроизоляции; Д-К04-05 разрушение ограждения; Д-К04-06 трещины в месте примыкания эркера.</p><h3 id=\"s11\">К-04.2 Лестницы</h3><p><strong>Что устанавливают (5.3.6.3):</strong></p><ul><li>конструкция и материалы;</li><li>состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций</li></ul><p>в стены, креплений решёток;</p><ul><li>деформации несущих конструкций;</li><li>трещины и повреждения площадок, балок, маршей, ступеней;</li><li>коррозионный износ ступеней;</li><li>участки отрыва элементов в стальных лестницах и деформации узлов крепления.</li></ul><p><strong>Обязательно:</strong> осмотру сверху и снизу — <strong>все</strong> марши и площадки в здании (5.3.6.3). <strong>Вскрытия (5.3.6.4):</strong> места заделки площадок в стены, опор маршей; для каменных по косоурам — заделка балок площадок; для бескосоурных консольных — глубина заделки ступеней; для деревянных — вскрытие заделки балок и зондирование.</p><p><strong>Типовые дефекты:</strong> Д-К04-10 сквозная коррозия косоуров; Д-К04-11 разрушение площадки; Д-К04-12 трещины ступеней; Д-К04-13 утрата марша; Д-К04-14 отрыв узла крепления.</p><hr><h2 id=\"s12\">К-05. Каркас: колонны, балки, ригели, связи</h2><p><strong>Норма:</strong> п. 5.3.3; СП 16.13330.2017. <strong>Что устанавливают (5.3.3.1):</strong> фактические размеры сечений и габариты; отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; защитные и огнезащитные покрытия; характеристики стали и химсостав; пространственное положение; отсутствие элемента; смещения опорных узлов. <strong>Типовые дефекты:</strong> Д-К05-01 коррозия с уменьшением сечения; Д-К05-02 искривление; Д-К05-03 дефекты сварных швов; Д-К05-04 зазоры в болтовых соединениях; Д-К05-05 изменение статической схемы; Д-К05-06 трещины в основном металле.</p><hr><h2 id=\"s13\">К-06. Крыша, кровля, стропила, водосток</h2><p><strong>Норма:</strong> п. 5.3.6.5—5.3.6.11; СП 17.13330.2017. <strong>Что устанавливают:</strong> тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу; состояние кровли и водостоков; наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; деформации системы (прогибы, удлинение пролёта, углы наклона сечений и узлов ферм); смещения податливых соединений (сдвиги, обмятие во врубках); вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины и гидроизоляции между деревом и камнем; состояние раствора в карнизах; узлы опирания; ведомость дефектов; вскрытия при необходимости.</p><p><strong>Причины конденсата и наледей (5.3.6.6):</strong> разрушение венткоробов и шахт; отсутствие или разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов чердачных дверей и люков.</p><p><strong>Типовые дефекты:</strong> Д-К06-01 протечки; Д-К06-02 гниль стропил; Д-К06-03 прогиб стропил; Д-К06-04 разрушение кровельного покрытия; Д-К06-05 засорение/разрушение водостока; Д-К06-06 конденсат и наледи.</p><hr><h2 id=\"s14\">К-07. Фасад: отделка, штукатурка, облицовка, утепление, швы</h2><p><strong>Норма:</strong> п. 5.3.5; ГОСТ 34379 (светопрозрачные). <strong>Оценка (5.3.5.1):</strong> механическая безопасность, пожарная безопасность, долговечность, энергоэффективность. <strong>Визуальный контроль (5.3.5.4):</strong> плоскостность «поля» облицовки; трещины в штукатурном и лицевом слое; сколы, смещения, нарушение линий швов; каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия; целостность откосов, фартуков, отливов; подвижные элементы и зыбкость. <strong>Вскрытия (5.3.5.6—5.3.5.7):</strong> узлы крепления подконструкций и облицовки; анкеры; коррозия; заклёпочные и болтовые соединения; перекрытие деформационных швов; теплоизоляция; состояние облицовываемой конструкции. Места проб — поле стены, углы, цоколь, сопряжение с отмосткой, откосы, перемычки, парапеты, декоративные элементы, зоны крепления оборудования. <strong>Анкеры (5.3.5.10):</strong> несущая способность — по натурным испытаниям. <strong>Типовые дефекты:</strong> Д-К07-01 отслоение штукатурки; Д-К07-02 разрушение облицовки; Д-К07-03 коррозия креплений; Д-К07-04 выветривание кладки; Д-К07-05 зыбкость облицовки; Д-К07-06 промерзание/сверхнормативные теплопотери.</p><hr><h2 id=\"s15\">К-08. Полы, проёмы, перегородки, заполнение проёмов</h2><p><strong>Норма:</strong> п. 5.3.6 (элементы), п. 5.3.4.7—5.3.4.9 (деревянные перегородки). <strong>Что устанавливают:</strong> состояние полов и стяжек, уклоны; перегородки — материал, крепление, трещины; заполнение проёмов — перекосы, неплотности, состояние креплений; светопрозрачные конструкции — по ГОСТ 34379. <strong>Типовые дефекты:</strong> Д-К08-01 просадка/разрушение пола; Д-К08-02 трещины перегородок; Д-К08-03 перекос оконных/дверных блоков; Д-К08-04 разрушение откосов.</p><hr><h2 id=\"s16\">К-09. Инженерные системы, влияющие на конструктив</h2><p><strong>Норма:</strong> п. 5.4, 5.5, 5.7. <strong>Почему в конструктиве:</strong> протечки, конденсат, затопление подвалов — главные причины коррозии металла и гнили дерева (по архиву: недостаточная вентиляция подвала и систематическое затопление — типовые причины повреждений перекрытий). <strong>Что проверять:</strong> водостоки (5.4.8), отопление (5.4.2), ГВС (5.4.1), ХВС (5.4.3), канализацию (5.4.4), вентиляцию (5.4.5), мусороудаление (5.4.6), газоснабжение (5.4.7); электросети и связь (5.5); теплотехнику ограждений (5.7). <strong>См.:</strong> Д-К03-01 (коррозия из-за протечек), Д-К09-01.</p><hr><h2 id=\"s17\">К-10. Аварийные ситуации</h2><p><strong>Норма:</strong> п. 4.5, 4.6; приложения В—Д. <strong>Признаки:</strong> исчерпание несущей способности; опасность обрушения; крены, угрожающие устойчивости; прогрессирующее обрушение; «сортамент определить невозможно». <strong>Действия по стандарту:</strong></p><ol><li>категория — аварийное;</li><li>эксплуатация не допускается (4.5);</li><li>письменное информирование заказчика, собственника, эксплуатирующей организации (4.6);</li><li>противоаварийные мероприятия;</li><li>обязательный мониторинг до приведения в работоспособное состояние (4.5).</li></ol><p><strong>Мероприятия из практики архива:</strong> стоечные крепления из металла под аварийной зоной; ограждение опасной зоны; запрет эксплуатации помещений; немедленная разработка проекта усиления/замены.</p><hr><h2 id=\"s18\">СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Элемент</th><th>Обязательные измерения</th><th>Инструмент</th></tr></thead><tbody><tr><td>К-01 фундамент</td><td>размеры в плане, глубина заложения, прочность материала, УГВ</td><td>рулетка, шурф, молоток Кашкарова/склерометр</td></tr><tr><td>К-02 кладка</td><td>геометрия, отклонение от вертикали, ширина трещин, прочность кирпича и раствора</td><td>отвес, щупы, лупа, лабораторные испытания</td></tr><tr><td>К-03 металл</td><td>сечение (с учётом коррозии), пролёт, шаг, прогиб</td><td>штангенциркуль, толщиномер, нивелир</td></tr><tr><td>К-03 ж.-б.</td><td>защитный слой, диаметр и шаг арматуры, прочность бетона, ширина трещин</td><td>магнитный/радиационный метод, склерометр</td></tr><tr><td>К-03 дерево</td><td>сечение, влажность, глубина гнили, прогиб</td><td>влагомер, зондирование, линейка</td></tr><tr><td>К-04 лестницы</td><td>сечения косоуров, заделка, износ ступеней</td><td>штангенциркуль, вскрытие</td></tr><tr><td>К-04 балконы</td><td>толщина плиты, сечения балок/подкосов, уклоны</td><td>штангенциркуль, уклономер</td></tr><tr><td>К-06 кровля</td><td>уклоны, сечения стропил, влажность</td><td>уклономер, влагомер</td></tr><tr><td>К-07 фасад</td><td>плоскостность, зыбкость, анкеры</td><td>правило, простукивание, испытания анкеров</td></tr></tbody></table></div>", "toc": [["s1", "К-01. Основания и фундаменты, грунты, осадки", 2], ["s2", "К-02. Стены несущие (каменные, панельные, монолитные)", 2], ["s3", "К-02.1 Каменные (кирпичные) стены — основа архива", 3], ["s4", "К-02.2 Панельные и монолитные стены", 3], ["s5", "К-03. Перекрытия и покрытия", 2], ["s6", "К-03.1 По металлическим балкам (доминирующий тип в архиве)", 3], ["s7", "К-03.2 Железобетонные (сборные и монолитные)", 3], ["s8", "К-03.3 Деревянные перекрытия", 3], ["s9", "К-04. Балконы, лоджии, эркеры, крыльца, лестницы, козырьки", 2], ["s10", "К-04.1 Балконы, эркеры, лоджии", 3], ["s11", "К-04.2 Лестницы", 3], ["s12", "К-05. Каркас: колонны, балки, ригели, связи", 2], ["s13", "К-06. Крыша, кровля, стропила, водосток", 2], ["s14", "К-07. Фасад: отделка, штукатурка, облицовка, утепление, швы", 2], ["s15", "К-08. Полы, проёмы, перегородки, заполнение проёмов", 2], ["s16", "К-09. Инженерные системы, влияющие на конструктив", 2], ["s17", "К-10. Аварийные ситуации", 2], ["s18", "СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ»", 2]], "chars": 14489, "plain": " ИНДЕКС КОНСТРУКТИВА (К 01…К 10) Что обследовать по каждому элементу: состав работ, параметры, типовые дефекты, ссылки на норму. Основа — ГОСТ 31937 2024, разделы 5.2—5.7, и практика архива ТЗ (~700 прочитанных отчётов; перекрытия — 627, кирпичные стены — 551, металл — 515). Дефекты — в 04 Дефекты , методики — в 05 Методики , критерии — в 06 Оценка . Смежные: [СП 368]( /doc/sp368) — проектирование усиления и замены; [СП 547]( /doc/sp547) — оценка износа. К 01. Основания и фундаменты, грунты, осадки Норма: ГОСТ 31937 2024, п. 5.2; СП 22.13330.2016; СП 24.13330.2021; СП 446.1325800.2019. Состав работ (5.2.2): изучение фондовых изысканий на участке и соседних, планировки и благоустройства; изучение материалов по конструктивному решению фундаментов; проходка шурфов вблизи фундаментов; проведение или актуализация инженерно геологических изысканий; обследование свайных фундаментов, определение фактической длины и состояния свай. Что устанавливают (5.2.3): геологическое строение участка; тип фундаментов, форма в плане, размер, глубина заложения, ранее выполненные усиления; повреждения фундаментов, прочность материалов; пробы материалов фундаментов и грунтов из под подошвы; наличие и состояние гидроизоляции, УГВ, температура и агрессивность вод. Ключевые цифры: глубина шурфа — на 0,15 м ниже подошвы (5.2.7); число шурфов — по величинам нагрузок на фундаменты (5.2.6); при деформациях стен и фундаментов шурфы обязательны (5.2.6); после работ — засыпка с трамбованием, восстановление покрытия и отмостки (5.2.18). Критерии визуальной оценки (5.2.14): неравномерная осадка; деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции. Типовые дефекты: Д К01 01 неравномерная осадка; Д К01 02 разрушение тела фундамента; Д К01 03 отсутствие/разрушение гидроизоляции; Д К01 04 разуплотнение грунта; Д К01 05 крен. Признак в заключении: «Неравномерная осадка … подтверждается …»; трещины в стенах с раскрытием кверху/книзу — диагностический признак (см. Д К02 06…Д К02 09). К 02. Стены несущие (каменные, панельные, монолитные) Норма: ГОСТ 31937 2024, пп. 5.3.2, 5.3.1; СП 15.13330.2020; СП 63.13330.2018. К 02.1 Каменные (кирпичные) стены — основа архива Что устанавливают (5.3.2.1): материал конструкций; дефекты и деформации: отклонения от вертикали, неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки и штукатурки, выпадение кирпичей, капиллярный подсос; выборочное контрольное зондирование кладки, отбор проб из разных слоёв (влажность, объёмная масса); наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек. Прочность (5.3.2.2—5.3.2.4): лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690); керны бетона — ГОСТ 28570; бут — ГОСТ 4001; расчётные сопротивления — по СП 15.13330.2020. Типовые дефекты: Д К02 01 трещины вертикальные/наклонные; Д К02 02 выпучивание; Д К02 03 отклонение от вертикали; Д К02 04 отколы, пробоины; Д К02 05 увлажнение, высолы; Д К02 06…09 трещины как признак просадки; Д К02 10 разрушение перемычек. К 02.2 Панельные и монолитные стены Норма: п. 5.3.1 (ж. б.), для панельных — обязательная проверка стыков, сварки, закладных (5.3.1.25). Типовые дефекты: раскрытие трещин по швам, коррозия закладных, разрушение герметизации, отклонения от вертикали. К 03. Перекрытия и покрытия Норма: ГОСТ 31937 2024, пп. 5.3.1 (ж. б.), 5.3.3 (сталь), 5.3.4 (дерево); СП 63.13330.2018, СП 16.13330.2017, СП 64.13330.2017, СП 20.13330.2016. К 03.1 По металлическим балкам (доминирующий тип в архиве) Что устанавливают: схема: пролёт в свету, шаг балок, опирание (на кирпичную стену, на перемычку, заделка); сечение и сортамент (двутавр, швеллер; ОСТ 16 1926, старые ГОСТ); межбалочное заполнение (бетон на кирпичном бое, сводики, деревянные щиты); покрытие (стяжка, плитка, асфальтобетон, дощатый настил); состояние балок: коррозия (поверхностная/сквозная), прогиб, деформации, состояние опорных узлов и заделки. Ключевые нормы (5.3.3): толщину корродированных элементов измерять не менее чем в трёх наиболее повреждённых сечениях , в каждом — не менее трёх измерений (5.3.3.13); назначать редуцированные сечения (5.3.3.12). Типовые дефекты: Д К03 01 сквозная коррозия балок; Д К03 02 поверхностная коррозия; Д К03 03 прогиб; Д К03 04 разрушение заделки в стену; Д К03 05 обрушение участка; Д К03 06 недостаточная площадка опирания; Д К03 07 промерзание/протечки. Диагностический признак аварийности: «сортамент определить невозможно ввиду полного разрушения конструкций» + «исчерпание несущей способности» → аварийное. К 03.2 Железобетонные (сборные и монолитные) Что устанавливают (5.3.1.1, 5.3.1.21): геометрия и сечения; сопоставление с проектом; соответствие статической схемы; трещины, отколы, разрушения; ширина раскрытия; защитный слой; прогибы; сцепление арматуры с бетоном; разрыв арматуры; анкеровка; коррозия бетона и арматуры. Число участков (5.3.1.8): 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций; конструкций — не менее трёх. Типовые дефекты: Д К03 10 трещины (нормальные, наклонные); Д К03 11 сколы в сжатой зоне; Д К03 12 отслоение защитного слоя; Д К03 13 коррозия арматуры; Д К03 14 выпучивание сжатой арматуры и шелушение бетона; прогиб сверх нормативного — Д К03 03. К 03.3 Деревянные перекрытия Норма: п. 5.3.4; СП 64.13330.2017. Что устанавливают (5.3.4.1, 5.3.6.11): схема, сечения, пролёты, условия опирания; влажность (ГОСТ 16483.7, 16588); биоповреждения (ГОСТ 18610); прогибы; состояние узлов; наличие и состояние утеплителя, пароизоляции; протечки. Важно (5.3.4.5): расчётные сопротивления древесины, не поражённой гнилью, — как для новой; при поверхностном разрушении гнилью сечение уменьшают. Типовые дефекты: Д К03 20 гниль; Д К03 21 прогиб; Д К03 22 расстройство узлов; Д К03 23 отсутствие/утрата элемента наката. Типовые узлы (серия 2.140 6): [Узел 1]( /figures/series 01) и [Узел 2]( /figures/series 02) — цокольное перекрытие; остальные узлы, включая [АМ 1]( /figures/series 27), — в разделе «Иллюстрации» → «Серия 2.140 6». На листах: черепные бруски, щиты наката, гидроизоляция, продухи, утеплитель и пароизоляция. К 04. Балконы, лоджии, эркеры, крыльца, лестницы, козырьки Норма: ГОСТ 31937 2024, п. 5.3.6.1—5.3.6.4. К 04.1 Балконы, эркеры, лоджии Что устанавливают (5.3.6.1): расчётная схема и материал несущих конструкций; размеры: длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками; состояние несущих конструкций: трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит; состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, гидроизоляция; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия (5.3.6.2): для установления сечений несущих элементов и оценки заделки в стену; места — по расчётной схеме. Типовые дефекты: Д К04 01 разрушение плиты; Д К04 02 коррозия консольных балок; Д К04 03 разрушение заделки; Д К04 04 отсутствие/разрушение гидроизоляции; Д К04 05 разрушение ограждения; Д К04 06 трещины в месте примыкания эркера. К 04.2 Лестницы Что устанавливают (5.3.6.3): конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления. Обязательно: осмотру сверху и снизу — все марши и площадки в здании (5.3.6.3). Вскрытия (5.3.6.4): места заделки площадок в стены, опор маршей; для каменных по косоурам — заделка балок площадок; для бескосоурных консольных — глубина заделки ступеней; для деревянных — вскрытие заделки балок и зондирование. Типовые дефекты: Д К04 10 сквозная коррозия косоуров; Д К04 11 разрушение площадки; Д К04 12 трещины ступеней; Д К04 13 утрата марша; Д К04 14 отрыв узла крепления. К 05. Каркас: колонны, балки, ригели, связи Норма: п. 5.3.3; СП 16.13330.2017. Что устанавливают (5.3.3.1): фактические размеры сечений и габариты; отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; защитные и огнезащитные покрытия; характеристики стали и химсостав; пространственное положение; отсутствие элемента; смещения опорных узлов. Типовые дефекты: Д К05 01 коррозия с уменьшением сечения; Д К05 02 искривление; Д К05 03 дефекты сварных швов; Д К05 04 зазоры в болтовых соединениях; Д К05 05 изменение статической схемы; Д К05 06 трещины в основном металле. К 06. Крыша, кровля, стропила, водосток Норма: п. 5.3.6.5—5.3.6.11; СП 17.13330.2017. Что устанавливают: тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу; состояние кровли и водостоков; наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; деформации системы (прогибы, удлинение пролёта, углы наклона сечений и узлов ферм); смещения податливых соединений (сдвиги, обмятие во врубках); вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины и гидроизоляции между деревом и камнем; состояние раствора в карнизах; узлы опирания; ведомость дефектов; вскрытия при необходимости. Причины конденсата и наледей (5.3.6.6): разрушение венткоробов и шахт; отсутствие или разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов чердачных дверей и люков. Типовые дефекты: Д К06 01 протечки; Д К06 02 гниль стропил; Д К06 03 прогиб стропил; Д К06 04 разрушение кровельного покрытия; Д К06 05 засорение/разрушение водостока; Д К06 06 конденсат и наледи. К 07. Фасад: отделка, штукатурка, облицовка, утепление, швы Норма: п. 5.3.5; ГОСТ 34379 (светопрозрачные). Оценка (5.3.5.1): механическая безопасность, пожарная безопасность, долговечность, энергоэффективность. Визуальный контроль (5.3.5.4): плоскостность «поля» облицовки; трещины в штукатурном и лицевом слое; сколы, смещения, нарушение линий швов; каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия; целостность откосов, фартуков, отливов; подвижные элементы и зыбкость. Вскрытия (5.3.5.6—5.3.5.7): узлы крепления подконструкций и облицовки; анкеры; коррозия; заклёпочные и болтовые соединения; перекрытие деформационных швов; теплоизоляция; состояние облицовываемой конструкции. Места проб — поле стены, углы, цоколь, сопряжение с отмосткой, откосы, перемычки, парапеты, декоративные элементы, зоны крепления оборудования. Анкеры (5.3.5.10): несущая способность — по натурным испытаниям. Типовые дефекты: Д К07 01 отслоение штукатурки; Д К07 02 разрушение облицовки; Д К07 03 коррозия креплений; Д К07 04 выветривание кладки; Д К07 05 зыбкость облицовки; Д К07 06 промерзание/сверхнормативные теплопотери. К 08. Полы, проёмы, перегородки, заполнение проёмов Норма: п. 5.3.6 (элементы), п. 5.3.4.7—5.3.4.9 (деревянные перегородки). Что устанавливают: состояние полов и стяжек, уклоны; перегородки — материал, крепление, трещины; заполнение проёмов — перекосы, неплотности, состояние креплений; светопрозрачные конструкции — по ГОСТ 34379. Типовые дефекты: Д К08 01 просадка/разрушение пола; Д К08 02 трещины перегородок; Д К08 03 перекос оконных/дверных блоков; Д К08 04 разрушение откосов. К 09. Инженерные системы, влияющие на конструктив Норма: п. 5.4, 5.5, 5.7. Почему в конструктиве: протечки, конденсат, затопление подвалов — главные причины коррозии металла и гнили дерева (по архиву: недостаточная вентиляция подвала и систематическое затопление — типовые причины повреждений перекрытий). Что проверять: водостоки (5.4.8), отопление (5.4.2), ГВС (5.4.1), ХВС (5.4.3), канализацию (5.4.4), вентиляцию (5.4.5), мусороудаление (5.4.6), газоснабжение (5.4.7); электросети и связь (5.5); теплотехнику ограждений (5.7). См.: Д К03 01 (коррозия из за протечек), Д К09 01. К 10. Аварийные ситуации Норма: п. 4.5, 4.6; приложения В—Д. Признаки: исчерпание несущей способности; опасность обрушения; крены, угрожающие устойчивости; прогрессирующее обрушение; «сортамент определить невозможно». Действия по стандарту: 1. категория — аварийное; 2. эксплуатация не допускается (4.5); 3. письменное информирование заказчика, собственника, эксплуатирующей организации (4.6); 4. противоаварийные мероприятия; 5. обязательный мониторинг до приведения в работоспособное состояние (4.5). Мероприятия из практики архива: стоечные крепления из металла под аварийной зоной; ограждение опасной зоны; запрет эксплуатации помещений; немедленная разработка проекта усиления/замены. СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ» Элемент Обязательные измерения Инструмент К 01 фундамент размеры в плане, глубина заложения, прочность материала, УГВ рулетка, шурф, молоток Кашкарова/склерометр К 02 кладка геометрия, отклонение от вертикали, ширина трещин, прочность кирпича и раствора отвес, щупы, лупа, лабораторные испытания К 03 металл сечение (с учётом коррозии), пролёт, шаг, прогиб штангенциркуль, толщиномер, нивелир К 03 ж. б. защитный слой, диаметр и шаг арматуры, прочность бетона, ширина трещин магнитный/радиационный метод, склерометр К 03 дерево сечение, влажность, глубина гнили, прогиб влагомер, зондирование, линейка К 04 лестницы сечения косоуров, заделка, износ ступеней штангенциркуль, вскрытие К 04 балконы толщина плиты, сечения балок/подкосов, уклоны штангенциркуль, уклономер К 06 кровля уклоны, сечения стропил, влажность уклономер, влагомер К 07 фасад плоскостность, зыбкость, анкеры правило, простукивание, испытания анкеров "}, {"id": "defects", "file": "04_Дефекты/КАТАЛОГ_ДЕФЕКТОВ.md", "title": "КАТАЛОГ ДЕФЕКТОВ (Д-…)", "section": "04_Дефекты", "html": "<h1>КАТАЛОГ ДЕФЕКТОВ (Д-…)</h1><blockquote><p>Дефект → признаки → причины → категория состояния → норма → источник. Основа: ГОСТ 31937-2024, приложения В (ж.-б. и каменные), Г (стальные), Д (деревянные), пп. 5.2—5.3, плюс практика архива ТЗ. Категории: Н — нормативное, Р — работоспособное, ОР — ограниченно-работоспособное, А — аварийное.</p></blockquote><p><strong>Для капремонта:</strong> признаки износа — приложение А <a href=\"#/doc/sp547\">СП 547</a>; дефекты к устранению — приложение Г <a href=\"#/doc/sp368\">СП 368</a>.</p><hr><h2 id=\"s1\">К-01. Основания и фундаменты</h2><h3 id=\"s2\">Д-К01-01. Неравномерная осадка основания</h3><ul><li><strong>Признаки:</strong> перекос здания, трещины в стенах с характерным рисунком, отклонение от</li></ul><p>вертикали, расхождение швов, деформации в надфундаментных конструкциях.</p><ul><li><strong>Причины:</strong> слабые/неоднородные грунты, подтопление, утечки из сетей, дополнительная</li></ul><p>нагрузка, разуплотнение грунта.</p><ul><li><strong>Категория:</strong> ОР; при прогрессирующем развитии и исчерпании несущей способности — А.</li><li><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.2.14; приложение В (2.1, 2.3).</li><li><strong>Источник:</strong> архив ТЗ (178 файлов с «осадк»).</li></ul><h3 id=\"s3\">Д-К01-02. Разрушение тела фундамента</h3><ul><li><strong>Признаки:</strong> выветривание, выкрашивание, отколы, обнажение бутовой кладки, каверны,</li></ul><p>потеря сечения.</p><ul><li><strong>Причины:</strong> агрессивные воды, замачивание, замораживание, долгий срок эксплуатации.</li><li><strong>Категория:</strong> ОР → А при потере несущей способности.</li><li><strong>Норма:</strong> п. 5.2.13, 5.2.15.</li></ul><h3 id=\"s4\">Д-К01-03. Отсутствие или разрушение гидроизоляции</h3><ul><li><strong>Признаки:</strong> сырость, высолы, подтопление подвала, коррозия металла, гниль дерева.</li><li><strong>Категория:</strong> ОР (по совокупности), сама по себе — дефект условий эксплуатации.</li><li><strong>Норма:</strong> п. 5.2.3, 5.2.15.</li></ul><h3 id=\"s5\">Д-К01-04. Разуплотнение грунта</h3><ul><li><strong>Признаки:</strong> просадки полов, крены, локальные провалы.</li><li><strong>Диагностика:</strong> статическое/динамическое зондирование, геофизика (п. 5.2.6).</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s6\">Д-К01-05. Крен здания/фундамента</h3><ul><li><strong>Признаки:</strong> отклонение от вертикали, неравномерные осадки.</li><li><strong>Категория:</strong> ОР; при угрозе потери устойчивости — А (п. 3.1).</li><li><strong>Норма:</strong> п. 5.2.14; форма заключения, поз. 15 приложения А.</li></ul><hr><h2 id=\"s7\">К-02. Каменные (кирпичные) стены</h2><h3 id=\"s8\">Д-К02-01. Трещины вертикальные и наклонные</h3><ul><li><strong>Признаки:</strong> раскрытие, протяжённость, направление, пересечение рядов кладки.</li><li><strong>Причины:</strong> перегрузка, просадка, температурные деформации, недостаточное армирование.</li><li><strong>Порог:</strong> вертикальные трещины раскрытием <strong>0,1—0,5 мм</strong>, пересекающие два ряда кладки</li></ul><p>и более, при <strong>двух и более</strong> трещинах на 1 м вертикально нагруженной стены → ОР (приложение В, п. 2.10).</p><ul><li><strong>Норма:</strong> приложение В, пп. 2.6—2.14.</li></ul><h3 id=\"s9\">Д-К02-02. Выпучивание (деформация стены)</h3><ul><li><strong>Причины:</strong> боковое давление грунта и материалов, распорные конструкции, увеличение</li></ul><p>эксцентриситетов, большая гибкость из-за разрыва связей, смещение опор балок к краю стены, одностороннее оттаивание кладки, температурные деформации (приложение В, п. 2.2).</p><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s10\">Д-К02-03. Отклонение стены от вертикали</h3><ul><li><strong>Причины:</strong> неравномерные осадки, недостаточность или разрыв поперечных связей.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s11\">Д-К02-04. Отколы углов, пробоины, выбоины, борозды</h3><ul><li><strong>Причины:</strong> дефекты строительства, механические воздействия.</li><li><strong>Категория:</strong> ОР (при значительном снижении сечения — расчётом).</li></ul><h3 id=\"s12\">Д-К02-05. Увлажнение кладки, высолы, капиллярный подсос</h3><ul><li><strong>Причины:</strong> атмосферные осадки, конденсация, брызги, отсутствие гидроизоляции.</li><li><strong>Категория:</strong> ОР в сочетании с деструкцией; отдельно — фактор риска.</li></ul><h3 id=\"s13\">Д-К02-06…09. Трещины как диагностика причины (приложение В, пп. 2.6—2.9)</h3><div class=\"tablewrap\"><table><thead><tr><th>Рисунок трещин</th><th>Причина</th></tr></thead><tbody><tr><td>Параболические, ветви расходятся книзу от средней части здания</td><td>просадка грунта в средней части</td></tr><tr><td>Раскрытие увеличивается кверху; наклонные/параболические от краёв</td><td>просадка крайних частей или твёрдое включение под средней частью</td></tr><tr><td>Близкая к вертикальной, раскрытие увеличивается кверху</td><td>разлом из-за жёсткой опоры в грунте под трещиной</td></tr><tr><td>Близкая к вертикальной, одинаковое раскрытие по высоте со смещением части здания</td><td>просадка части здания</td></tr></tbody></table></div><ul><li><strong>Категория:</strong> ОР с обязательным расчётом.</li></ul><h3 id=\"s14\">Д-К02-10. Разрушение перемычек</h3><ul><li><strong>Признаки:</strong> горизонтальные и косые трещины по швам рядовых, клинчатых, арочных перемычек;</li></ul><p>вертикальные трещины в середине пролёта; выпадение камней; сквозная коррозия металлических перемычек.</p><ul><li><strong>Причины:</strong> перегрузка, низкая прочность материалов, недостаточное армирование, коррозия.</li><li><strong>Категория:</strong> ОР; при сквозной коррозии и выпадении камней — А.</li><li><strong>Норма:</strong> приложение В, п. 2.11; практика архива (перемычки из двутавров).</li></ul><h3 id=\"s15\">Д-К02-11. Трещины под опорами и опорными подушками</h3><ul><li><strong>Признаки:</strong> веерообразные трещины, скалывание и раздробление кладки под опорами балок,</li></ul><p>ферм, перемычек, козырьков.</p><ul><li><strong>Причины:</strong> перегрузка, недостаточная глубина опирания, недостаточная несущая способность</li></ul><p>подушки.</p><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s16\">Д-К02-12. Шелушение, выветривание, деструкция кладки</h3><ul><li><strong>Причины:</strong> агрессивные среды, высокий нагрев, пожар, попеременное замораживание-оттаивание,</li></ul><p>увлажнение-высыхание, биопоражения (приложение В, п. 2.15).</p><ul><li><strong>Категория:</strong> ОР.</li></ul><hr><h2 id=\"s17\">К-03. Перекрытия</h2><h3 id=\"s18\">Д-К03-01. Сквозная коррозия металлических балок</h3><ul><li><strong>Признаки:</strong> полное поражение сечения («до 100 %»), отслоение продуктов коррозии,</li></ul><p>провисание, потеря геометрии, обрушение участков.</p><ul><li><strong>Причины:</strong> длительный срок эксплуатации без противокоррозионной защиты, протечки,</li></ul><p>затопление подвала, недостаточная вентиляция.</p><ul><li><strong>Категория:</strong> <strong>А</strong> (исчерпание несущей способности).</li><li><strong>Норма:</strong> приложение Г; п. 5.3.3.12—5.3.3.13.</li><li><strong>Источник:</strong> практика обследований; последние экспертизы (объект исторической застройки).</li></ul><h3 id=\"s19\">Д-К03-02. Поверхностная коррозия металла</h3><ul><li><strong>Признаки:</strong> поражение без потери сечения насквозь, указание процента (например, «до 11 %»).</li><li><strong>Категория:</strong> ОР при снижении сечения; при незначительном — Р.</li><li><strong>Норма:</strong> приложение Г («разрушение защитных покрытий, коррозия металла» → ОР).</li></ul><h3 id=\"s20\">Д-К03-03. Прогиб балок перекрытия</h3><ul><li><strong>Признаки:</strong> видимое провисание, отклонение от горизонтали, зыбкость пола.</li><li><strong>Порог:</strong> относительные прогибы, превышающие для плит перекрытий и покрытий <strong>1/150</strong>,</li></ul><p>для преднапряжённых стропильных балок <strong>1/300</strong>, ферм <strong>1/700</strong> → основание для А (приложение В, п. 1.9).</p><ul><li><strong>Категория:</strong> ОР; при превышении порогов — А (с расчётом).</li></ul><h3 id=\"s21\">Д-К03-04. Разрушение заделки балки в стену</h3><ul><li><strong>Признаки:</strong> трещины у опоры, выпадение кладки, коррозия опорной части, смещение балки.</li><li><strong>Причины:</strong> протечки, коррозия, недостаточная глубина заделки, перегрузка.</li><li><strong>Категория:</strong> А при потере опирания; иначе ОР.</li></ul><h3 id=\"s22\">Д-К03-05. Обрушение участка перекрытия</h3><ul><li><strong>Признаки:</strong> падение балок и заполнения, провалы.</li><li><strong>Категория:</strong> <strong>А</strong>; немедленные противоаварийные меры (п. 4.5, 4.6).</li></ul><h3 id=\"s23\">Д-К03-06. Недостаточная площадка опирания</h3><ul><li><strong>Признаки:</strong> смещение балки к краю стены, опирание менее проектного.</li><li><strong>Норма:</strong> приложение В, п. 1.12 — «уменьшение площадок опирания по сравнению с проектными»</li></ul><p>→ А (обосновывается расчётом).</p><ul><li><strong>Категория:</strong> А (по расчёту).</li></ul><h3 id=\"s24\">Д-К03-07. Промерзание, протечки, конденсат</h3><ul><li><strong>Причины:</strong> разрушение кровли, гидроизоляции, вентиляции; недостаточное утепление.</li><li><strong>Следствие:</strong> коррозия металла, гниль дерева.</li><li><strong>Категория:</strong> ОР по совокупности.</li></ul><h3 id=\"s25\">Д-К03-10. Трещины в железобетоне</h3><ul><li><strong>Пороги (приложение В, п. 1.6):</strong> нормальные трещины в изгибаемых и растянутых элементах</li></ul><p>шириной более: <strong>А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм</strong> → ОР.</p><ul><li><strong>Опасные:</strong> наклонные со смещением участков бетона, трещины, пересекающие арматуру →</li></ul><p><strong>А</strong> (п. 1.8); трещины с разветвлёнными концами при перегрузке → А (п. 1.7).</p><ul><li><strong>Трещины вдоль арматуры:</strong> до 3 мм → ОР; <strong>на опорных участках — А</strong> (п. 1.4).</li></ul><h3 id=\"s26\">Д-К03-11. Сколы бетона в сжатой зоне</h3><ul><li><strong>Причина:</strong> механические воздействия.</li><li><strong>Категория:</strong> ОР (приложение В, п. 1.2).</li></ul><h3 id=\"s27\">Д-К03-12. Отслоение защитного слоя</h3><ul><li><strong>Причина:</strong> коррозия арматуры.</li><li><strong>Категория:</strong> ОР; <strong>на опорном участке — А</strong> (приложение В, п. 1.5).</li></ul><h3 id=\"s28\">Д-К03-13. Коррозия арматуры и закладных деталей</h3><ul><li><strong>Признаки:</strong> волосяные трещины вдоль арматуры, ржавые потёки, уменьшение сечения стержней.</li><li><strong>Оценка:</strong> площадь поражения, глубина, остаточное сечение (п. 5.3.1.18).</li><li><strong>Категория:</strong> ОР; при разрыве арматуры, выпучивании сжатой арматуры — А (пп. 1.10—1.13).</li></ul><h3 id=\"s29\">Д-К03-14. Выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение В, п. 1.11).</li></ul><h3 id=\"s30\">Д-К03-15. Разрыв или смещение поперечной арматуры в зоне наклонных трещин</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (п. 1.13).</li></ul><h3 id=\"s31\">Д-К03-16. Отрыв анкеров от пластин закладных деталей, расстройство стыков</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (п. 1.14).</li></ul><h3 id=\"s32\">Д-К03-20. Гниль деревянных элементов</h3><ul><li><strong>Признаки:</strong> размягчение, потеря сечения, грибок, запах, влажность выше нормы.</li><li><strong>Причины:</strong> протечки, конденсат, отсутствие гидроизоляции между деревом и камнем,</li></ul><p>недостаточная вентиляция.</p><ul><li><strong>Норма:</strong> п. 5.3.4.3 (ГОСТ 18610), 5.3.6.7; приложение Д.</li><li><strong>Категория:</strong> ОР; при потере сечения и целостности наката — А (приложение Д).</li></ul><h3 id=\"s33\">Д-К03-21. Прогиб деревянных балок</h3><ul><li><strong>Категория:</strong> ОР; при превышении предельного — А (обосновывается расчётом).</li></ul><h3 id=\"s34\">Д-К03-22. Расстройство узлов сопряжения дерева</h3><ul><li><strong>Признаки:</strong> сдвиги, обмятие во врубках, ослабление скруток, хомутов.</li><li><strong>Категория:</strong> ОР; при потере связи — А.</li></ul><h3 id=\"s35\">Д-К03-23. Отсутствие элемента наката, потеря целостности</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение Д, п. 1).</li></ul><h3 id=\"s36\">Д-К03-24. Увлажнение утеплителя, отсутствие пароизоляции</h3><ul><li><strong>Норма:</strong> п. 5.3.6.11.</li><li><strong>Следствие:</strong> промерзание, гниль, коррозия.</li><li><strong>Категория:</strong> ОР по совокупности.</li></ul><hr><h2 id=\"s37\">К-04. Балконы, лоджии, эркеры, лестницы</h2><h3 id=\"s38\">Д-К04-01. Разрушение балконной плиты</h3><ul><li><strong>Признаки:</strong> трещины, отколы бетона, обнажение и коррозия арматуры, провалы, разрушение</li></ul><p>ограждения.</p><ul><li><strong>Категория:</strong> ОР → А при потере сечения и опирания.</li></ul><h3 id=\"s39\">Д-К04-02. Коррозия консольных балок, подкосов, подвесок</h3><ul><li><strong>Категория:</strong> ОР; сквозная коррозия — А.</li></ul><h3 id=\"s40\">Д-К04-03. Разрушение заделки несущих элементов балкона в стену</h3><ul><li><strong>Признаки:</strong> трещины у примыкания, наклон плиты, выпадение кладки.</li><li><strong>Категория:</strong> А при потере заделки.</li></ul><h3 id=\"s41\">Д-К04-04. Отсутствие или разрушение гидроизоляции балкона</h3><ul><li><strong>Следствие:</strong> коррозия арматуры, протечки в нижележащие помещения.</li></ul><h3 id=\"s42\">Д-К04-05. Разрушение ограждения балкона/лоджии</h3><ul><li><strong>Категория:</strong> ОР (опасность для людей — приоритет).</li></ul><h3 id=\"s43\">Д-К04-06. Трещины в месте примыкания эркера к зданию</h3><ul><li><strong>Норма:</strong> п. 5.3.6.1 (обязательно проверять).</li><li><strong>Категория:</strong> ОР → А при раскрытии и потере связи.</li></ul><h3 id=\"s44\">Д-К04-10. Сквозная коррозия косоуров лестницы</h3><ul><li><strong>Признаки:</strong> полное поражение сечения, провисание марша, разрушение ступеней.</li><li><strong>Категория:</strong> <strong>А</strong>.</li><li><strong>Источник:</strong> последние экспертизы (объект культурного наследия; объект исторической застройки).</li></ul><h3 id=\"s45\">Д-К04-11. Разрушение лестничной площадки</h3><ul><li><strong>Признаки:</strong> коррозия балок, провал покрытия, уклон, обрушение.</li><li><strong>Категория:</strong> А при исчерпании несущей способности.</li></ul><h3 id=\"s46\">Д-К04-12. Трещины и износ ступеней</h3><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s47\">Д-К04-13. Утрата лестничного марша</h3><ul><li><strong>Признаки:</strong> физическое отсутствие марша, замена временной металлической лестницей.</li><li><strong>Категория:</strong> <strong>А</strong> (для утраченного элемента — фиксируется как утрата).</li></ul><h3 id=\"s48\">Д-К04-14. Отрыв элементов стальной лестницы, деформация узлов крепления</h3><ul><li><strong>Норма:</strong> п. 5.3.6.3.</li><li><strong>Категория:</strong> ОР → А при потере крепления.</li></ul><hr><h2 id=\"s49\">К-05. Стальной каркас</h2><h3 id=\"s50\">Д-К05-01. Коррозия с уменьшением сечения</h3><ul><li><strong>Измерения:</strong> не менее 3 наиболее повреждённых сечений, в каждом не менее 3 измерений</li></ul><p>(п. 5.3.3.13); назначать редуцированные сечения (5.3.3.12).</p><ul><li><strong>Категория:</strong> ОР; при критическом снижении — А (расчётом).</li></ul><h3 id=\"s51\">Д-К05-02. Искривления элементов, превышающие допустимые</h3><ul><li><strong>Категория:</strong> А (приложение Г; обосновывается расчётом).</li></ul><h3 id=\"s52\">Д-К05-03. Дефекты сварных швов (трещины и недопустимые дефекты)</h3><ul><li><strong>Норма:</strong> ГОСТ 23118-2019, подраздел 5.2.</li><li><strong>Категория:</strong> А для элементов группы 1 (приложение Г).</li></ul><h3 id=\"s53\">Д-К05-04. Зазоры в болтовых соединениях</h3><ul><li><strong>Фрикционные, группа 1</strong> → А; <strong>группы 2—4</strong> → ОР.</li><li><strong>Срезные</strong> → ОР.</li><li><strong>Фланцевые растянутые/сжато-изогнутые (группа 1)</strong> → А по результатам контроля зазоров.</li><li><strong>Фланцевые сжатые, группы 2—4</strong> → ОР (приложение Г).</li></ul><h3 id=\"s54\">Д-К05-05. Изменение статической схемы</h3><ul><li><strong>Причины:</strong> включение непредусмотренных элементов, заклинивание опор, выключение элементов</li></ul><p>из работы.</p><ul><li><strong>Категория:</strong> А (обосновывается расчётом по действительной схеме).</li></ul><h3 id=\"s55\">Д-К05-06. Хрупкие или усталостные трещины в основном металле</h3><ul><li><strong>Категория:</strong> <strong>А</strong> (приложение Г).</li></ul><h3 id=\"s56\">Д-К05-07. Выпучивание стенок замкнутых сечений</h3><ul><li><strong>Категория:</strong> ОР при отсутствии трещин и разрывов.</li></ul><h3 id=\"s57\">Д-К05-08. Местные погибы</h3><ul><li><strong>Категория:</strong> ОР, если не влияют на работу конструкции.</li></ul><h3 id=\"s58\">Д-К05-09. Разрушение защитных (в том числе огнезащитных) покрытий</h3><ul><li><strong>Категория:</strong> ОР; риск последующей коррозии.</li></ul><hr><h2 id=\"s59\">К-06. Кровля и стропила</h2><h3 id=\"s60\">Д-К06-01. Протечки кровли</h3><ul><li><strong>Причины:</strong> разрушение покрытия, засорение водостока, нарушение примыканий, конденсат.</li><li><strong>Следствие:</strong> коррозия металла, гниль дерева, промерзание.</li><li><strong>Норма:</strong> п. 5.3.6.5; СП 17.13330.2017.</li></ul><h3 id=\"s61\">Д-К06-02. Гниль стропил, обрешётки, мауэрлата</h3><ul><li><strong>Категория:</strong> ОР → А при потере сечения.</li><li><strong>Норма:</strong> приложение Д; п. 5.3.6.7.</li></ul><h3 id=\"s62\">Д-К06-03. Прогиб стропильной системы, деформации ферм</h3><ul><li><strong>Признаки:</strong> прогибы, удлинение пролёта, углы наклона сечений и узлов, смещения податливых</li></ul><p>соединений, трещины скалывания, складки сжатия (п. 5.3.6.5).</p><ul><li><strong>Категория:</strong> ОР → А при потере устойчивости.</li></ul><h3 id=\"s63\">Д-К06-04. Разрушение кровельного покрытия</h3><ul><li><strong>Категория:</strong> ОР; при массовых протечках — ОР по совокупности.</li></ul><h3 id=\"s64\">Д-К06-05. Засорение или разрушение водостока</h3><ul><li><strong>Норма:</strong> п. 5.4.8.</li><li><strong>Следствие:</strong> замачивание стен и перекрытий.</li></ul><h3 id=\"s65\">Д-К06-06. Конденсат и наледи на свесах и водостоках</h3><ul><li><strong>Причины (5.3.6.6):</strong> разрушение венткоробов и шахт; отсутствие/разрушение теплоизоляции</li></ul><p>трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов дверей и люков.</p><ul><li><strong>Категория:</strong> ОР по совокупности.</li></ul><hr><h2 id=\"s66\">К-07. Фасад</h2><h3 id=\"s67\">Д-К07-01. Отслоение штукатурки, разрушение отделочного слоя</h3><ul><li><strong>Признаки:</strong> трещины, «бухты», простукивание даёт глухой звук, отслоение.</li><li><strong>Категория:</strong> ОР; при угрозе падения — А для участка.</li></ul><h3 id=\"s68\">Д-К07-02. Разрушение облицовки (в том числе вентилируемого фасада)</h3><ul><li><strong>Признаки:</strong> сколы, смещения, нарушение линий швов, зыбкость, пустоты.</li><li><strong>Норма:</strong> п. 5.3.5.4, 5.3.5.6.</li><li><strong>Категория:</strong> ОР → А при угрозе обрушения.</li></ul><h3 id=\"s69\">Д-К07-03. Коррозия креплений и подконструкций</h3><ul><li><strong>Норма:</strong> п. 5.3.5.6.</li><li><strong>Категория:</strong> ОР; при потере анкеровки — А.</li></ul><h3 id=\"s70\">Д-К07-04. Выветривание, деструкция кладки фасада</h3><ul><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s71\">Д-К07-05. Зыбкость облицовки, подвижные элементы</h3><ul><li><strong>Норма:</strong> п. 5.3.5.4 («контроль наличия подвижных элементов с оценкой общей зыбкости»).</li><li><strong>Категория:</strong> А для участка (угроза падения).</li></ul><h3 id=\"s72\">Д-К07-06. Промерзание, сверхнормативные теплопотери, конденсат</h3><ul><li><strong>Норма:</strong> п. 5.7.</li><li><strong>Категория:</strong> ОР (энергоэффективность), не путать с механической безопасностью.</li></ul><hr><h2 id=\"s73\">К-08. Полы, проёмы, перегородки</h2><h3 id=\"s74\">Д-К08-01. Просадка и разрушение полов, стяжек</h3><ul><li><strong>Причины:</strong> просадка основания, протечки, коррозия балок.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s75\">Д-К08-02. Трещины перегородок</h3><ul><li><strong>Категория:</strong> ОР (эксплуатационный дефект).</li></ul><h3 id=\"s76\">Д-К08-03. Перекос оконных и дверных блоков</h3><ul><li><strong>Причины:</strong> осадка, деформации стен.</li><li><strong>Категория:</strong> ОР.</li></ul><h3 id=\"s77\">Д-К08-04. Разрушение откосов, отливов</h3><ul><li><strong>Следствие:</strong> замачивание стен.</li><li><strong>Категория:</strong> ОР.</li></ul><hr><h2 id=\"s78\">К-09. Инженерные системы</h2><h3 id=\"s79\">Д-К09-01. Затопление подвала, отсутствие вентиляции</h3><ul><li><strong>Причины:</strong> неисправность сетей, отсутствие водоотвода, засорение.</li><li><strong>Следствие:</strong> коррозия металла и гниль дерева — главные причины аварийных перекрытий</li></ul><p>в архиве.</p><ul><li><strong>Норма:</strong> п. 5.4, 5.4.8.</li><li><strong>Категория:</strong> фактор, усиливающий дефекты К-03.</li></ul><h3 id=\"s80\">Д-К09-02. Разрушение трубопроводов, протечки</h3><ul><li><strong>Норма:</strong> пп. 5.4.1—5.4.7.</li><li><strong>Категория:</strong> ОР системы.</li></ul><hr><h2 id=\"s81\">К-10. Аварийные ситуации</h2><h3 id=\"s82\">Д-К10-01. Прогрессирующее обрушение</h3><ul><li><strong>Признаки:</strong> цепное разрушение элементов, потеря устойчивости, обрушение участков.</li><li><strong>Норма:</strong> п. 4.3 (обследование после аварий), 4.5, 4.6.</li><li><strong>Действия:</strong> немедленное информирование, ограждение, противоаварийные мероприятия,</li></ul><p>мониторинг.</p><h3 id=\"s83\">Д-К10-02. Исчерпание несущей способности</h3><ul><li><strong>Признаки:</strong> «сортамент определить невозможно», сквозная коррозия 100 %, разрывы арматуры,</li></ul><p>выпучивание сжатой арматуры, наклонные трещины со смещением.</p><ul><li><strong>Категория:</strong> <strong>А</strong>.</li><li><strong>Норма:</strong> п. 3.1; приложения В—Д.</li></ul><hr><h2 id=\"s84\">БЫСТРАЯ ТАБЛИЦА «ДЕФЕКТ → КАТЕГОРИЯ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Дефект</th><th>Категория</th><th>Норма</th></tr></thead><tbody><tr><td>Наклонные трещины со смещением бетона</td><td>А</td><td>В, 1.8</td></tr><tr><td>Выпучивание сжатой арматуры</td><td>А</td><td>В, 1.11</td></tr><tr><td>Уменьшение площадок опирания</td><td>А</td><td>В, 1.12</td></tr><tr><td>Разрыв/смещение поперечной арматуры</td><td>А</td><td>В, 1.13</td></tr><tr><td>Отрыв анкеров, расстройство стыков</td><td>А</td><td>В, 1.14</td></tr><tr><td>Трещины вдоль арматуры &gt;
