<title>Expanding Horizons — База знаний</title>
<meta name="description" content="Expanding Horizons — база знаний по обследованию зданий: термины, дефекты, методики, критерии и шаблоны заключений по ГОСТ 31937-2024.">
<style>
:root{
  --paper:#f6f3ec; --panel:#fffdf8; --ink:#171a1c; --ink-2:#3d3f3e;
  --muted:#6f6b61; --line:#ddd6c8; --line-2:#ebe5d8;
  --rust:#a8431f; --rust-soft:#f3e2d9; --teal:#1f5e54; --teal-soft:#dfeae6;
  --amber:#8a6212; --amber-soft:#f5ead2;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:"Cascadia Mono",Consolas,"Courier New",monospace;
  --r:10px; --shadow:0 1px 2px rgba(23,26,28,.05),0 8px 24px rgba(23,26,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--ui);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:var(--teal); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--rust); outline-offset:2px; border-radius:4px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;z-index:200}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- header ---------- */
.top{
  position:sticky; top:0; z-index:40; background:rgba(246,243,236,.94);
  backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
}
.top-in{display:flex; align-items:center; gap:18px; padding:10px 20px; max-width:1500px; margin:0 auto}
.brand{display:flex; align-items:baseline; gap:10px; min-width:0}
.brand b{font-size:16px; letter-spacing:.01em; white-space:nowrap}
.brand span{font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap}
.burger{display:none; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:6px 9px}

.search{position:relative; flex:1; max-width:560px; margin-left:auto}
.search input{
  width:100%; padding:9px 36px 9px 34px; border:1px solid var(--line); border-radius:999px;
  background:var(--panel); color:var(--ink); font-size:14px;
}
.search input::placeholder{color:#98938a}
.search .ico{position:absolute; left:11px; top:9px; opacity:.5; font-size:13px}
.search kbd{
  position:absolute; right:8px; top:6px; font-family:var(--mono); font-size:10px;
  color:var(--muted); border:1px solid var(--line); border-radius:5px; padding:2px 5px; background:#fff
}
.top-actions{display:flex; gap:8px}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink-2);
  padding:8px 12px; border-radius:8px; font-size:13px; white-space:nowrap
}
.btn:hover{border-color:#c9c0ad; color:var(--ink)}
.btn-primary{background:var(--ink); border-color:var(--ink); color:#fff}
.btn-primary:hover{background:#000; color:#fff}


/* brand */
.brand{gap:10px}
.brand .mark{width:34px; height:34px; object-fit:contain; border-radius:8px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.08)}
.brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand-text b{font-size:15px; letter-spacing:.01em}
.brand-text span{font-family:var(--mono); font-size:10.5px; color:var(--muted)}

/* intro splash */
.splash{
  position:fixed; inset:0; z-index:300; background:#101519; color:#fff;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  opacity:1; transition:opacity .35s ease
}
.splash.hide{opacity:0; pointer-events:none}
.splash video{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:.55; filter:saturate(1.05)
}
.splash:after{content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 40%,rgba(10,14,18,.25),rgba(10,14,18,.88) 70%)}
.splash-in{position:relative; z-index:2; text-align:center; padding:32px; max-width:620px}
.splash img{height:150px; object-fit:contain; filter:drop-shadow(0 12px 30px rgba(0,0,0,.45))}
.splash h2{font-family:var(--serif); font-weight:400; font-size:clamp(26px,4vw,40px); margin:18px 0 6px; letter-spacing:-.01em}
.splash p{font-family:var(--mono); font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:#cfd6d9; margin:0 0 22px}
.splash .go{
  border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#fff;
  padding:11px 22px; border-radius:999px; font-size:14px; backdrop-filter:blur(4px)
}
.splash .go:hover{background:#fff; color:#111}
.splash .skip{position:absolute; right:18px; top:16px; z-index:3; background:none; border:0; color:#cfd6d9; font-size:12px; letter-spacing:.08em; text-transform:uppercase}
@media (max-width:600px){ .splash img{height:110px} }

/* ---------- layout ---------- */
.shell{display:grid; grid-template-columns:288px minmax(0,1fr); gap:0; max-width:1500px; margin:0 auto}
.side{
  border-right:1px solid var(--line); padding:18px 14px 40px; position:sticky; top:57px;
  height:calc(100vh - 57px); overflow:auto; background:linear-gradient(180deg,#faf7f0,#f6f3ec 240px)
}
.side h2{font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:18px 8px 8px; font-weight:600}
.side .sec{margin-bottom:2px}
.sec-head{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none;
  border:0; padding:8px; border-radius:8px; color:var(--ink-2); font-size:13.5px; font-weight:600
}
.sec-head:hover{background:#efe9db}
.sec-head .num{font-family:var(--mono); font-size:10.5px; color:var(--muted); min-width:18px}
.sec-head .cnt{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--muted)}
.sec-docs{list-style:none; margin:0 0 6px; padding:0 0 0 26px; display:none}
.sec.open .sec-docs{display:block}
.sec-docs li{margin:1px 0}
.doc-link{
  display:block; padding:5px 8px; border-radius:6px; color:var(--ink-2); font-size:13px;
  border-left:2px solid transparent; line-height:1.35
}
.doc-link:hover{background:#efe9db; text-decoration:none}
.doc-link.active{background:var(--panel); border-left-color:var(--rust); color:var(--ink); font-weight:600}
.doc-link small{display:block; color:var(--muted); font-size:10.5px; font-family:var(--mono); margin-top:1px}

.main{min-width:0; padding:30px 34px 70px; display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:36px}
.main.wide{grid-template-columns:minmax(0,1fr)}
.main.wide .content{max-width:none}
.content{min-width:0; max-width:820px}

/* ---------- dashboard ---------- */
.hero{
  border:1px solid var(--line); border-radius:16px; padding:30px 32px; background:
    linear-gradient(180deg,rgba(255,253,248,.96),rgba(255,253,248,.9)),
    repeating-linear-gradient(90deg,transparent 0 31px,#e7dfd0 31px 32px),
    repeating-linear-gradient(0deg,transparent 0 31px,#e7dfd0 31px 32px);
  box-shadow:var(--shadow); position:relative; overflow:hidden
}
.hero:after{content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border:1px solid #e6dece; border-radius:50%}
.hero .kicker{font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--rust)}
.hero h1{font-family:var(--serif); font-weight:400; font-size:clamp(28px,3.6vw,42px); line-height:1.12; margin:10px 0 10px; letter-spacing:-.01em}
.hero p{max-width:56ch; color:var(--ink-2); margin:0 0 18px}
.hero-actions{display:flex; gap:10px; flex-wrap:wrap}

.kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:12px; margin:22px 0 26px}
.kpi{border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:14px 16px}
.kpi b{display:block; font-family:var(--serif); font-size:30px; line-height:1; font-weight:400}
.kpi span{display:block; font-size:11.5px; color:var(--muted); margin-top:7px; letter-spacing:.02em}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.card{border:1px solid var(--line); background:var(--panel); border-radius:12px; padding:18px 20px}
.card h3{margin:0 0 12px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
.stack{list-style:none; margin:0; padding:0}
.stack li{display:flex; align-items:center; gap:10px; padding:7px 0; border-top:1px solid var(--line-2); font-size:13.5px}
.stack li:first-child{border-top:0}
.stack .code{font-family:var(--mono); font-size:10.5px; color:var(--muted); min-width:26px}
.stack .n{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted)}
.stack a{color:var(--ink-2)}
.stack a:hover{color:var(--ink)}

.bars{list-style:none; margin:0; padding:0}
.bars li{display:grid; grid-template-columns:158px 1fr 34px; align-items:center; gap:10px; padding:5px 0; font-size:13px; line-height:1.25}
.bars .track{display:block;height:7px; background:#eee7d8; border-radius:99px; overflow:hidden}
.bars .fill{display:block;height:100%; background:linear-gradient(90deg,var(--teal),#3d8478); border-radius:99px}
.bars .num{font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right}

.steps{counter-reset:step; list-style:none; margin:0; padding:0}
.steps li{counter-increment:step; position:relative; padding:0 0 16px 40px; border-left:1px solid var(--line); margin-left:11px}
.steps li:last-child{border-left-color:transparent; padding-bottom:0}
.steps li:before{
  content:counter(step); position:absolute; left:-12px; top:-2px; width:24px; height:24px; border-radius:50%;
  background:var(--panel); border:1px solid var(--line); font-family:var(--mono); font-size:11px;
  display:flex; align-items:center; justify-content:center; color:var(--muted)
}
.steps b{display:block; font-size:14px; margin-bottom:2px}
.steps span{font-size:13px; color:var(--muted)}

.note{
  border-left:3px solid var(--amber); background:var(--amber-soft); padding:12px 14px; border-radius:0 8px 8px 0;
  font-size:13.5px; color:#4a3d1c; margin:0
}

/* ---------- document ---------- */
.crumbs{font-size:12px; color:var(--muted); margin-bottom:12px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.crumbs .code{font-family:var(--mono); font-size:10.5px}
.meta{font-size:12px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; margin:0 0 18px}
.meta span{display:inline-flex; gap:5px; align-items:center}

.doc h1{font-family:var(--serif); font-weight:400; font-size:clamp(26px,3vw,36px); line-height:1.15; margin:0 0 14px; letter-spacing:-.01em}
.doc h2{
  font-size:19px; margin:34px 0 10px; padding-top:14px; border-top:1px solid var(--line);
  letter-spacing:-.005em; scroll-margin-top:80px
}
.doc h3{font-size:15.5px; margin:22px 0 6px; scroll-margin-top:80px}
.doc h4{font-size:14px; margin:18px 0 4px; color:var(--ink-2)}
.doc p{margin:0 0 12px; font-family:var(--serif); font-size:16.5px; line-height:1.68; color:#22262a}
.doc ul,.doc ol{margin:0 0 14px; padding-left:22px}
.doc li{font-family:var(--serif); font-size:16px; line-height:1.6; margin:4px 0}
.doc li>ul,.doc li>ol{margin:4px 0}
.doc blockquote{
  margin:16px 0; padding:12px 16px; border-left:3px solid var(--rust); background:#fbf3ee;
  border-radius:0 8px 8px 0; color:#4a2f22
}
.doc blockquote p{font-family:var(--ui); font-size:13.5px; line-height:1.55; margin:0 0 6px}
.doc blockquote p:last-child{margin:0}
.doc code{font-family:var(--mono); font-size:.86em; background:#eee7d8; padding:1px 5px; border-radius:4px}
.doc pre{background:#1d2224; color:#e9e4d8; padding:14px 16px; border-radius:10px; overflow:auto; font-size:12.5px; line-height:1.5}
.doc pre code{background:none; padding:0; color:inherit; font-size:inherit}
.doc hr{border:0; border-top:1px solid var(--line); margin:26px 0}
.doc strong{color:#111}
.doc a{border-bottom:1px solid rgba(31,94,84,.25)}
.tablewrap{overflow:auto; margin:14px 0 18px; border:1px solid var(--line); border-radius:10px; background:var(--panel)}
.doc table{border-collapse:collapse; width:100%; font-size:13px}
.doc th,.doc td{padding:8px 11px; border-bottom:1px solid var(--line-2); text-align:left; vertical-align:top}
.doc th{background:#f1ecdf; font-weight:600; font-size:11.5px; letter-spacing:.03em; text-transform:uppercase; color:#4b473f; position:sticky; top:0}
.doc tr:last-child td{border-bottom:0}
.doc tbody tr:hover td{background:#fbf7ee}

.toc{position:sticky; top:80px; align-self:start; font-size:12.5px; max-height:calc(100vh - 110px); overflow:auto}
.toc h4{margin:0 0 8px; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:600}
.toc ul{list-style:none; margin:0; padding:0; border-left:1px solid var(--line)}
.toc li a{display:block; padding:4px 0 4px 10px; margin-left:-1px; border-left:2px solid transparent; color:var(--muted); line-height:1.35}
.toc li a:hover{color:var(--ink); text-decoration:none; border-left-color:#c9c0ad}
.toc li.lvl3 a{padding-left:22px; font-size:11.5px}
.toc li a.on{color:var(--ink); border-left-color:var(--rust); font-weight:600}

/* search results */
.results{margin:6px 0 0}
.results .hit{border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:12px 14px; margin-bottom:10px}
.results .hit b{display:block; font-size:14px; margin-bottom:2px}
.results .hit small{font-family:var(--mono); font-size:10.5px; color:var(--muted); display:block; margin-bottom:6px}
.results .hit p{margin:0; font-family:var(--serif); font-size:13.5px; color:#3d3f3e}
.results mark{background:#f7dfa8; padding:0 2px; border-radius:2px}
.empty{border:1px dashed var(--line); border-radius:12px; padding:26px; color:var(--muted); text-align:center; font-size:14px}


/* objects view */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:6px 0 12px}
.filters select,.filters input{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); font-size:13px; color:var(--ink)}
.filters input{flex:1; min-width:180px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 16px}
.chip{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:5px 11px; font-size:12.5px; color:var(--ink-2)}
.chip:hover{border-color:#c9c0ad}
.chip.on{background:var(--ink); color:#fff; border-color:var(--ink)}
.objtable{width:100%; border-collapse:collapse; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.objtable th{background:#f1ecdf; text-align:left; font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:#4b473f; padding:8px 10px; border-bottom:1px solid var(--line-2)}
.objtable td{padding:7px 10px; border-bottom:1px solid var(--line-2); vertical-align:top}
.objtable tr:hover td{background:#fbf7ee}
.objtable td.num{text-align:right; font-family:var(--mono); font-size:11.5px; color:var(--muted)}
.objtable .types{color:var(--teal)}
.count{font-size:12.5px; color:var(--muted); margin:0 0 10px}
@media (max-width:900px){ .objtable th:nth-child(1),.objtable td:nth-child(1){display:none} }

/* mobile */
.scrim{display:none}
@media (max-width:1180px){
  .main{grid-template-columns:minmax(0,1fr)}
  .toc{display:none}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{
    position:fixed; z-index:60; left:0; top:0; bottom:0; width:290px; height:100vh;
    transform:translateX(-102%); transition:transform .22s ease; box-shadow:var(--shadow); padding-top:64px
  }
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block; position:fixed; inset:0; background:rgba(18,20,21,.35); z-index:55}
  .burger{display:inline-block}
  .main{padding:20px 18px 60px}
  .top-in{padding:9px 12px; gap:10px}
  .brand span{display:none}
  .search{max-width:none}
  .search kbd{display:none}
  .grid2{grid-template-columns:1fr}
  .hero{padding:22px 20px}
  .bars li{grid-template-columns:110px 1fr 30px}
  .btn-primary{display:none}
}
@media print{
  .top,.side,.toc,.crumbs,.meta,.scrim{display:none!important}
  .shell,.main{display:block; padding:0; max-width:none}
  .content{max-width:none}
  body{background:#fff; font-size:11pt}
  .doc h2{break-after:avoid}
  .tablewrap{overflow:visible; break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>

<script>
const DATA = {"docs": [{"id": "gost", "file": "01_Нормативная_база/ГОСТ_31937-2024.md", "title": "ГОСТ 31937-2024 — рабочая карточка", "section": "01_Нормативная_база", "html": "<h1>ГОСТ 31937-2024 — рабочая карточка</h1><blockquote><p><strong>Источник:</strong> <code>E:\\Экспертиза\\5_gost_31937_2024 (1).pdf</code> (69 с., текстовый слой есть). Текст извлечён: <code>Библиотека\\99_Служебное\\Извлечённое\\ГОСТ_31937-2024.txt</code>. Все ссылки на пункты — по нумерации стандарта (страницы указаны в скобках). Карточка — рабочий конспект, не замена тексту стандарта. При спорных формулировках сверяться с оригиналом.</p></blockquote><hr><h2 id=\"s1\">1. ПАСПОРТ ДОКУМЕНТА</h2><div class=\"tablewrap\"><table><thead><tr><th>Параметр</th><th>Значение</th></tr></thead><tbody><tr><td>Обозначение</td><td>ГОСТ 31937—2024</td></tr><tr><td>Наименование</td><td>Здания и сооружения. Правила обследования и мониторинга технического состояния</td></tr><tr><td>Статус</td><td>Межгосударственный стандарт, действует как национальный стандарт РФ</td></tr><tr><td>Введён</td><td>01.05.2024 (приказ Росстандарта от 10.04.2024 № 433-ст)</td></tr><tr><td>Взамен</td><td>ГОСТ 31937—2011</td></tr><tr><td>Разработан</td><td>АО «ЦНИИПромзданий»</td></tr><tr><td>Приложения</td><td>А—М, из них обязательные: А, Б, Е, Ж, И, К, Л, М; справочные: В, Г, Д</td></tr></tbody></table></div><h3 id=\"s2\">Структура</h3><ol><li>Область применения (с. 1)</li><li>Нормативные ссылки (с. 2)</li><li>Термины и определения (с. 4)</li><li>Общие положения (с. 7)</li><li>Обследование технического состояния (с. 9)</li><li>5.1 Этапы, состав работ (с. 9)</li><li>5.2 Основания и фундаменты (с. 14)</li><li>5.3 Конструкции (с. 17): 5.3.1 бетон/ж.-б.; 5.3.2 каменные; 5.3.3 стальные, сталежелезобетонные, алюминиевые; 5.3.4 деревянные; 5.3.5 фасадные; 5.3.6 элементы зданий (балконы, лоджии, эркеры, лестницы, кровли, чердаки, светопрозрачные); 5.3.7 огнезащитные покрытия</li><li>5.4 Системы инженерно-технического обеспечения (с. 30)</li><li>5.5 Электросети и средства связи (с. 36)</li><li>5.6 Звукоизоляция, шум, вибрация (с. 37)</li><li>5.7 Теплотехнические показатели (с. 38)</li><li>Мониторинг технического состояния (с. 40)</li><li>Охрана труда (с. 43)</li><li>Приложение А — форма заключения по обследованию (с. 44)</li><li>Приложение Б — форма заключения по комплексному обследованию (с. 45)</li><li>Приложение В — дефекты ж.-б. и каменных конструкций (с. 47)</li><li>Приложение Г — дефекты стальных конструкций (с. 51)</li><li>Приложение Д — дефекты деревянных конструкций (с. 54)</li><li>Приложение Е — форма паспорта здания (с. 55)</li><li>Приложения Ж, И, К, Л, М — формы мониторинга (с. 57—63)</li></ol><hr><h2 id=\"s3\">2. ОБЛАСТЬ ПРИМЕНЕНИЯ (раздел 1)</h2><p><strong>Что охватывает.</strong> Нормативная основа контроля технического состояния зданий (сооружений) и систем инженерно-технического обеспечения; исходные данные для проектирования реконструкции, капремонта, демонтажа.</p><p>Виды работ по стандарту:</p><ul><li>комплексное обследование для установления технического состояния и исходных данных</li></ul><p>для проектирования реконструкции/капремонта;</p><ul><li>обследование для оценки возможности дальнейшей безаварийной эксплуатации,</li></ul><p>необходимости восстановления и усиления;</p><ul><li>обследование объектов незавершённого строительства;</li><li>обследование для определения несущей способности конструкций и грунтов;</li><li>обследование для проекта демонтажа (сноса) и объёмов отходов;</li><li>энергетическое обследование;</li><li>обследование систем инженерно-технического обеспечения;</li><li>мониторинг несущих конструкций реконструируемых зданий;</li><li>общий мониторинг; мониторинг зон влияния; мониторинг ограниченно-работоспособных</li></ul><p>и аварийных объектов; мониторинг уникальных зданий.</p><p><strong>Что НЕ охватывает:</strong></p><ul><li>проектирование (стандарт не устанавливает требований к проектированию);</li><li>транспортные, гидротехнические и мелиоративные сооружения, магистральные</li></ul><p>трубопроводы, подземные сооружения, объекты горных работ;</p><ul><li><strong>судебно-строительную экспертизу</strong> — важная граница: заключение по ГОСТ 31937-2024</li></ul><p>≠ судебная экспертиза.</p><hr><h2 id=\"s4\">3. ТЕРМИНЫ (раздел 3) — ядро тезауруса</h2><div class=\"tablewrap\"><table><thead><tr><th>№</th><th>Термин</th><th>Определение (сжато)</th></tr></thead><tbody><tr><td>3.1</td><td>аварийное техническое состояние</td><td>Повреждения и деформации, свидетельствующие об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости</td></tr><tr><td>3.2</td><td>безопасность эксплуатации</td><td>Комплексное свойство объекта, не позволяющее перейти в аварийное состояние (проект + остаточный ресурс + изменения + антитеррор + нормы эксплуатации)</td></tr><tr><td>3.3</td><td>восстановление</td><td>Доведение эксплуатационных качеств конструкций из ограниченно-работоспособного состояния до первоначального уровня по нормам на момент проектирования восстановления</td></tr><tr><td>3.4</td><td>дефект (повреждение) системы ИТО</td><td>Несоответствие системы или её части параметру проекта/норм, ухудшающее состояние системы</td></tr><tr><td>3.5</td><td>дефект (повреждение) строительной конструкции</td><td>Отдельное несоответствие конструкции параметру проекта/норм, ухудшающее её состояние или здания</td></tr><tr><td>3.6</td><td>динамические параметры</td><td>Периоды и декременты собственных колебаний основного тона и обертонов, передаточные функции</td></tr><tr><td>3.7</td><td>заказчик</td><td>Собственник или лицо, определённое собственником ответственным за договор</td></tr><tr><td>3.8</td><td>категория технического состояния</td><td>Степень эксплуатационной пригодности и обеспечения механической безопасности, установленная по доле снижения несущей способности и эксплуатационных характеристик</td></tr><tr><td>3.9</td><td>комплексное обследование</td><td>Специальный вид инженерных изысканий: грунты + конструкции + инженерное обеспечение + теплотехника и акустика, кроме технологического оборудования</td></tr><tr><td>3.10</td><td>критерий оценки технического состояния</td><td>Установленное проектом/нормой количественное или качественное значение параметра, характеризующего переход в предельное состояние</td></tr><tr><td>3.11</td><td>механическая безопасность</td><td>Состояние конструкций и основания, при котором отсутствует недопустимый риск вреда жизни, здоровью, имуществу, среде вследствие разрушения или потери устойчивости</td></tr><tr><td>3.12</td><td>мониторинг ограниченно-работоспособных/аварийных</td><td>Наблюдение по программе за степенью и скоростью изменения параметров, экстренные меры против обрушения, до приведения в работоспособное состояние</td></tr><tr><td>3.13</td><td>мониторинг зоны влияния</td><td>Наблюдение за объектами в зоне влияния строительства и природно-техногенных воздействий</td></tr><tr><td>3.14</td><td>мониторинг уникальных</td><td>Наблюдение для раннего обнаружения негативных изменений НДС, крена; данные для мероприятий</td></tr><tr><td>3.15</td><td>нормативное техническое состояние</td><td>Параметры всех критериев соответствуют проектной документации и действующим нормам на момент обследования</td></tr><tr><td>3.16</td><td>обследование технического состояния</td><td>Специальный вид изысканий: определение фактических параметров, работоспособности, возможности эксплуатации/реконструкции/восстановления/усиления/ремонта/демонтажа; включает грунты, дефекты, фактическую несущую способность</td></tr><tr><td>3.17</td><td>общий мониторинг</td><td>Наблюдение за объектами со значительными изменениями НДС или крена, которым необходимо обследование; программа утверждается заказчиком</td></tr><tr><td>3.18</td><td>ограниченно-работоспособное</td><td>Есть крены, дефекты и повреждения, снизившие несущую способность, и/или достаточность несущей способности не подтверждается поверочными расчётами, но опасности внезапного разрушения, потери устойчивости или опрокидывания нет; эксплуатация возможна при контроле (мониторинге) либо после мероприятий</td></tr><tr><td>3.19</td><td>оценка технического состояния</td><td>Установление степени повреждения и категории на основе сопоставления фактических значений признаков с проектными/нормативными</td></tr><tr><td>3.20</td><td>поверочный расчёт</td><td>Расчёт существующей конструкции и/или грунтов по действующим нормам проектирования с введением фактических геометрии, прочности материалов и грунтов, нагрузок, уточнённой расчётной схемы с учётом дефектов</td></tr><tr><td>3.21</td><td>работоспособное</td><td>Некоторые контролируемые параметры не отвечают проекту/нормам, но нарушения не приводят к нарушению работоспособности; несущая способность и механическая безопасность обеспечиваются</td></tr><tr><td>3.22</td><td>система мониторинга ИТО</td><td>Технические и программные средства сбора и обработки информации о параметрах системы ИТО</td></tr><tr><td>3.23</td><td>система мониторинга несущих конструкций</td><td>Средства сбора и обработки информации о геодезических, динамических, деформационных параметрах и скорости их изменения</td></tr><tr><td>3.24</td><td>специализированная организация</td><td>Организация, имеющая право работ по обследованию и мониторингу по законодательству</td></tr><tr><td>3.25</td><td>текущее техническое состояние</td><td>Состояние на момент обследования или этапа мониторинга</td></tr><tr><td>3.26</td><td>текущие динамические параметры</td><td>Динамические параметры на момент обследования или этапа мониторинга</td></tr><tr><td>3.27</td><td>усиление</td><td>Мероприятия по повышению несущей способности и эксплуатационных свойств по сравнению с фактическим состоянием или проектом</td></tr><tr><td>3.28</td><td>физический износ здания</td><td>Ухудшение технических и эксплуатационных показателей, вызванное объективными причинами</td></tr></tbody></table></div><blockquote><p>Примечание: 3.1 и 3.18 — самые «цитируемые» определения в заключениях. Формулировки в выводах лучше давать близко к тексту, с указанием «согласно 3.18 ГОСТ 31937-2024».</p></blockquote><hr><h2 id=\"s5\">4. ОБЩИЕ ПОЛОЖЕНИЯ (раздел 4) — что важно для обоснований</h2><h3 id=\"s6\">4.1 Кто проводит</h3><p>Обследование и мониторинг проводят <strong>специализированные организации</strong> (4.1).</p><h3 id=\"s7\">4.2 Периодичность (сильный аргумент в заключениях)</h3><ul><li>первое обследование — <strong>не позднее чем через 2 года</strong> после ввода в эксплуатацию;</li><li>далее — <strong>не реже 1 раза в 10 лет</strong>;</li><li><strong>не реже 1 раза в 5 лет</strong> — для зданий или отдельных элементов, работающих</li></ul><p>в неблагоприятных условиях (агрессивные среды, вибрации, повышенная влажность, сейсмичность 7 баллов и более и др.);</p><ul><li><strong>рекомендуемый срок следующего обследования указывают в отчёте</strong> по результатам</li></ul><p>обследования (обязательный элемент отчёта);</p><ul><li>для уникальных зданий — постоянный режим мониторинга.</li></ul><h3 id=\"s8\">4.3 Основания для проведения обследования (готовый перечень для раздела «Основание»)</h3><ul><li>истечение расчётных сроков службы или сроков безаварийной эксплуатации по предыдущему</li></ul><p>заключению;</p><ul><li>разработка проекта реконструкции и капремонта;</li><li>обнаружение дефектов, повреждений, деформаций, влияющих на безопасность;</li><li>последствия пожаров, стихийных бедствий, аварий, угроза прогрессирующего обрушения;</li><li>попадание в зону влияния нового строительства, реконструкции, природно-техногенных</li></ul><p>воздействий;</p><ul><li>инициатива собственника;</li><li>решение о дальнейшей эксплуатации или сносе (демонтаже);</li><li>разработка проекта сноса (демонтажа);</li><li>изменение назначения здания;</li><li>предписание органов госстройнадзора.</li></ul><h3 id=\"s9\">4.4 Документная база</h3><p>Работы — по <strong>техническому заданию</strong> и, при необходимости, по <strong>программе работ</strong>, разработанной на его основе; программа согласовывается с заказчиком.</p><h3 id=\"s10\">4.5 Категории и режимы эксплуатации (ключевой пункт)</h3><p>Оценка — по результатам обследования и, при необходимости, поверочных расчётов. Четыре категории:</p><ol><li><strong>нормативное</strong>;</li><li><strong>работоспособное</strong>;</li><li><strong>ограниченно-работоспособное</strong>;</li><li><strong>аварийное</strong>.</li></ol><p>Режимы:</p><ul><li>нормативное и работоспособное → эксплуатация при фактических нагрузках и воздействиях</li></ul><p><strong>без ограничений</strong>;</p><ul><li>ограниченно-работоспособное → **контроль состояния, мероприятия по восстановлению или</li></ul><p>усилению конструкций и/или грунтового основания, последующий мониторинг** (при необходимости);</p><ul><li>аварийное → <strong>эксплуатация не допускается</strong>; разработать и выполнить</li></ul><p><strong>противоаварийные мероприятия</strong>; до приведения в работоспособное состояние — <strong>обязательный режим мониторинга</strong>.</p><h3 id=\"s11\">4.6 Информирование при аварийном состоянии</h3><p>При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — <strong>письменно</strong> информировать заказчика, а при возможности собственника, лиц, в хозяйственном ведении/оперативном управлении которых находится объект, эксплуатирующую организацию и иных ответственных за эксплуатацию.</p><h3 id=\"s12\">4.7—4.9 Особые случаи</h3><ul><li>4.7 демонтаж (снос) и объёмы отходов — детальное обследование допускается не выполнять,</li></ul><p>кроме обмеров;</p><ul><li>4.8 восстановление утраченной проектной документации — <strong>сплошное детальное</strong></li></ul><p>обследование;</p><ul><li>4.9 техническая документация может быть восстановлена по результатам обследований.</li></ul><h3 id=\"s13\">4.10 Метрология</h3><p>Средства измерений и испытаний — с метрологическим обеспечением по законодательству; новые типы — аттестованы и поверены, методика при необходимости согласуется в программе.</p><hr><h2 id=\"s14\">5. ЭТАПЫ ОБСЛЕДОВАНИЯ (5.1) — скелет любого заключения</h2><h3 id=\"s15\">5.1.2 Три этапа</h3><ol><li>подготовка к обследованию;</li><li>предварительное (визуальное) обследование;</li><li>детальное (инструментальное) обследование — при необходимости.</li></ol><p>Объём работ на каждом этапе — в ТЗ, при необходимости в программе.</p><h3 id=\"s16\">5.1.3 Цель комплексного обследования</h3><p>Определение технического состояния здания и элементов, <strong>количественная оценка фактических показателей качества</strong> грунтов, конструкций и систем инженерного обеспечения с учётом изменений во времени, для установления возможности дальнейшей эксплуатации или состава и объёма работ по капремонту/реконструкции.</p><h3 id=\"s17\">5.1.4 Критерий достаточности</h3><p>Информация должна быть достаточной для принятия <strong>обоснованного решения</strong> о возможности дальнейшей эксплуатации.</p><h3 id=\"s18\">5.1.5 Объекты обследования (перечень для ТЗ/программы)</h3><ul><li>грунты основания, полы по грунту, фундаменты, включая сваи, ростверки, фундаментные балки;</li><li>подземные воды, гидроизоляция подземной части;</li><li>стены, колонны, столбы, пилоны, фахверки;</li><li>перекрытия и покрытия (балки, арки, стропильные и подстропильные фермы, плиты, прогоны);</li><li>балконы, эркеры, лестницы;</li><li>подкрановые балки и фермы;</li><li>светопрозрачные конструкции (витражи, зенитные и светоаэрационные фонари);</li><li>связевые конструкции, элементы жёсткости;</li><li>стыки и узлы, сопряжения, способы соединения, размеры площадок опирания;</li><li>иные конструкции и элементы.</li></ul><p>Обследование может быть <strong>выборочным</strong> (часть конструкций) — по ТЗ/программе.</p><h3 id=\"s19\">5.1.6—5.1.7 Подготовка: что запрашивать у заказчика</h3><ul><li>инвентаризационные поэтажные планы, технический паспорт;</li><li>акты осмотров эксплуатирующей организации, ведомости дефектов;</li><li>акты, отчёты и заключения предыдущих обследований;</li><li>проектная и исполнительная документация;</li><li>сведения о перестройках, перепланировках, реконструкциях, капремонтах;</li><li>геоподоснова;</li><li>материалы инженерно-геологических изысканий;</li><li>согласованный протокол о порядке доступа к конструкциям и оборудованию;</li><li>документы о местах и мощности подводки электроэнергии, воды, тепла, газа, водоотведения.</li></ul><h3 id=\"s20\">5.1.8 Что устанавливают по документам</h3><p>Автор и год проекта, конструктивная схема, применённые конструкции, монтажные схемы, время возведения, геометрия, расчётная схема, проектные нагрузки, характеристики материалов, документы оценки соответствия и паспорта изделий, характеристики грунтов, замены и отклонения от проекта, характер внешних воздействий, данные об окружающей среде, места и мощность подводок, проявившиеся дефекты.</p><p>Программа работ включает: перечень конструкций и элементов; перечень инженерного оборудования, электросетей, средств связи; места и методы инструментальных измерений и испытаний; места вскрытий и отбора проб; необходимость инженерно-геологических изысканий; перечень поверочных расчётов.</p><h3 id=\"s21\">5.1.9 Визуальное обследование</h3><p>Сплошное визуальное обследование конструкций, систем, оборудования, средств связи; выявление дефектов по внешним признакам с измерениями и фиксацией; проверка характерных деформаций (прогибы, крены, неравномерные осадки). Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование.</p><h3 id=\"s22\">5.1.10 Результаты визуального обследования (что должно быть в отчёте)</h3><ul><li>схемы и ведомости дефектов с фиксацией мест, характера, параметров;</li><li>описания и фотографии дефектных участков;</li><li>результаты проверки деформаций (прогибы, крены, выгибы, перекосы, разломы);</li><li>выявленные аварийные участки;</li><li>уточнённая конструктивная схема с несущими конструкциями по этажам;</li><li>схема мест выработок, вскрытий, зондирования;</li><li>описание прилегающей территории, вертикальной планировки, отвода поверхностных вод;</li><li>оценка расположения в застройке с точки зрения подпора в дымовых, газовых,</li></ul><p>вентиляционных каналах;</p><ul><li>предварительная оценка технического состояния (по приложениям В—Д);</li><li>отчёт по визуальному обследованию.</li></ul><h3 id=\"s23\">5.1.11 Когда детальное обследование можно не проводить</h3><p>Если визуально установлено <strong>нормативное или работоспособное</strong> состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования достаточно для решения задач — детальное обследование <strong>допускается не проводить</strong>; отчёт по визуальному обследованию является окончательным.</p><p>Если визуально выявлено <strong>аварийное</strong> состояние — детальное обследование проводят <strong>при необходимости</strong>.</p><p>Если выявлены дефекты, снижающие прочность, устойчивость и жёсткость, свидетельствующие об <strong>ограниченно-работоспособном</strong> состоянии, и требуется оценка несущей способности (для проектирования, оценки влияния нового строительства и т. д.) — детальное обследование проводят.</p><blockquote><p>Примечание 5.1.11: для выявленных элементов усиления оценивать достаточность мероприятий по включению их в совместную работу.</p></blockquote><h3 id=\"s24\">5.1.12 Трещины → геология</h3><p>При характерных трещинах, перекосах, разломах стен, свидетельствующих о просадках основания, детальное обследование <strong>должно включать дополнительные инженерно-геологические изыскания</strong>; возможны не только восстановление и ремонт, но и усиление основания.</p><h3 id=\"s25\">5.1.13 Состав детального обследования</h3><ul><li>обмерные работы (геометрия зданий, конструкций, элементов, узлов);</li><li>инженерно-геологические изыскания (при необходимости);</li><li>инструментальное определение параметров дефектов и повреждений;</li><li>(далее по 5.1.13—5.1.16: определение прочности материалов, армирования, прогибов и т. д.;</li></ul><p>см. соответствующие подразделы 5.2—5.7).</p><hr><h2 id=\"s26\">6. ОСНОВАНИЯ И ФУНДАМЕНТЫ (5.2)</h2><h3 id=\"s27\">6.1 Состав работ (5.2.2)</h3><ul><li>изучение фондовых материалов изысканий на данном и соседних участках, планировки</li></ul><p>и благоустройства;</p><ul><li>изучение материалов по конструктивному решению фундаментов;</li><li>проходка шурфов вблизи фундаментов;</li><li>проведение или актуализация инженерно-геологических изысканий;</li><li>обследование свайных фундаментов, определение фактической длины и состояния свай.</li></ul><h3 id=\"s28\">6.2 Что устанавливают (5.2.3)</h3><ul><li>инженерно-геологическое строение участка;</li><li>тип фундаментов, форму в плане, размер, глубину заложения, ранее выполненные усиления</li></ul><p>и закрепления оснований;</p><ul><li>повреждения фундаментов с фотографированием и прочностью материалов;</li><li>пробы для лабораторных испытаний материалов фундаментов и грунтов из-под подошвы;</li><li>наличие и состояние гидроизоляции, уровень грунтовых вод, температуру и агрессивность</li></ul><p>подземных вод.</p><h3 id=\"s29\">6.3 Шурфы — нормативные параметры (готовые цифры для заключений)</h3><ul><li><strong>Глубина шурфа должна превышать глубину заложения подошвы на 0,15 м</strong> (5.2.7);</li><li>длина обнажаемого участка — достаточная для определения типа и оценки состояния (5.2.7);</li><li>количество шурфов — по величинам нагрузок на фундаменты (наружные/внутренние стены,</li></ul><p>загруженные и незагруженные, стены лестничных клеток, колонны каркаса) (5.2.6);</p><ul><li>при наличии трещин, выходящих на фундаменты, шурфы <strong>рекомендуется</strong> отрывать в таких</li></ul><p>местах; при деформациях стен и фундаментов — <strong>обязательно</strong> (5.2.6);</p><ul><li>при работах назначают дополнительные шурфы для определения границ фундаментов</li></ul><p>в аварийном или ограниченно-работоспособном состоянии (5.2.6);</p><ul><li>места шурфов согласовывать с собственником и службами, контролирующими подземные сети</li></ul><p>(5.2.6);</p><ul><li>после окончания — тщательная засыпка с послойным трамбованием, восстановление покрытия</li></ul><p>и отмостки, меры против попадания поверхностных вод; восстановительные работы обеспечивает заказчик (5.2.18).</p><h3 id=\"s30\">6.4 Критерии визуальной оценки фундаментов (5.2.14)</h3><ul><li>наличие неравномерной осадки;</li><li>характерные деформации и трещины в стенах и надфундаментных конструкциях;</li><li>сохранность тела фундаментов;</li><li>надёжность антикоррозионной защиты и гидроизоляции, соответствие условиям эксплуатации.</li></ul><h3 id=\"s31\">6.5 Что определяют инструментально (5.2.15)</h3><p>Прочность, водопроницаемость и др. показатели бетона; количество, площадь и класс арматуры; толщину защитного слоя; степень и глубину коррозии бетона (карбонизация, сульфатизация, хлориды); прочность кладки; степень коррозии стали и сварных швов; осадки, крены, прогибы, кривизну; морозостойкость (ММГ, признаки морозного разрушения); биоповреждение и глубину деструкции деревянных лежней и свай; характеристики грунтов, УГВ и химсостав воды.</p><h3 id=\"s32\">6.6 Сваи</h3><p>Длина свай — сейсмоакустическим методом (5.2.19); длина грунтоцементных свай — косвенными геофизическими методами с обязательной калибровкой по бурению контрольных скважин с отбором кернов.</p><hr><h2 id=\"s33\">7. БЕТОННЫЕ И ЖЕЛЕЗОБЕТОННЫЕ КОНСТРУКЦИИ (5.3.1)</h2><h3 id=\"s34\">7.1 Внешние признаки (5.3.1.1)</h3><p>Геометрия и сечения; сопоставление с проектом; соответствие фактической статической схемы расчётной; трещины, отколы, разрушения; расположение, характер и ширина раскрытия трещин; состояние защитных (в т. ч. огнезащитных) покрытий; прогибы и деформации; признаки нарушения сцепления арматуры с бетоном; разрыв арматуры; состояние анкеровки продольной и поперечной арматуры; степень коррозии бетона и арматуры.</p><h3 id=\"s35\">7.2 Трещины (5.3.1.3—5.3.1.4)</h3><ul><li>ширина раскрытия измеряется в местах максимального раскрытия **и на уровне растянутой</li></ul><p>арматуры**; если это невозможно (плиты) — только на поверхности в местах максимума;</p><ul><li>инструмент: <strong>калиброванные щупы или измерительная лупа</strong>;</li><li>предельная ширина — по нормам (в РФ СП 63.13330.2018);</li><li>трещины анализируют с точки зрения конструктивных особенностей и НДС.</li></ul><h3 id=\"s36\">7.3 Прочность бетона (5.3.1.5—5.3.1.8)</h3><ul><li>методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570;</li><li>предварительно — оперативный (экспертный) метод: молоток Физделя, ультразвуковое</li></ul><p>поверхностное прозвучивание и пр.;</p><ul><li>участки испытаний: в местах наименьшей прочности по экспертному методу; в зонах,</li></ul><p>определяющих несущую способность; в местах дефектов (пористость, коррозия, температурное растрескивание, изменение цвета);</p><ul><li><strong>число участков не менее: 3</strong> — прочность зоны или средняя прочность конструкции;</li></ul><p><strong>6</strong> — средняя прочность и коэффициент изменчивости; <strong>9</strong> — прочность бетона в группе однотипных конструкций;</p><ul><li>число однотипных конструкций, в которых оценивается прочность, — <strong>не менее трёх</strong>.</li></ul><h3 id=\"s37\">7.4 Армирование (5.3.1.10—5.3.1.13)</h3><ul><li>методы: магнитный (ГОСТ 22904), радиационный (ГОСТ 17625), контрольное вскрытие</li></ul><p>с обнажением арматуры, георадиолокация по аттестованной методике, ультразвук;</p><ul><li>число конструкций с определением диаметра, количества и расположения арматуры —</li></ul><p><strong>не менее трёх</strong>;</p><ul><li>прочность арматуры: образцы по ГОСТ 12004, <strong>не менее трёх стержней</strong> одного диаметра</li></ul><p>и профиля из однотипных конструкций; вырезать в сечениях, где несущая способность обеспечивается без вырезанных стержней;</p><ul><li>ориентировочно по рисунку профиля — <strong>не менее пяти участков</strong>;</li><li><strong>обязательно устанавливать годы проектирования и постройки</strong>: нормативные</li></ul><p>и расчётные сопротивления арматуры менялись по годам.</p><h3 id=\"s38\">7.5 Коррозия (5.3.1.14—5.3.1.19)</h3><ul><li>оценивают вид коррозии (сплошная, язвенная, точечная, щелевая), участки, причину;</li><li>признаки: площадь поражения, глубина поражений, площадь остаточного сечения;</li><li>обнажение рабочей арматуры — в местах наибольшего ослабления (отслоение защитного слоя,</li></ul><p>трещины и ржавые пятна вдоль стержней);</p><ul><li><strong>типовые зоны повышенного коррозионного износа</strong> (готовый чек-лист для обследования):</li></ul><p>наружные стены ниже уровня земли; балконы и элементы лоджий; пандусы въездов в подземные и многоэтажные гаражи; перекрытия над проездами; низ и базы колонн; участки колонн, проходящие через перекрытие (при мокрой уборке); плиты покрытия вдоль ендов, у воронок внутреннего водостока, наружного остекления и торцов фонарей; конструкции в помещениях с повышенной влажностью и возможными протечками; опорные узлы ферм у водоприёмных воронок; верхние пояса ферм у аэрационных фонарей и ветробойных щитов; верхние пояса подстропильных ферм вдоль ендов; опорные узлы ферм внутри кирпичных стен.</p><h3 id=\"s39\">7.6 Прогибы (5.3.1.20)</h3><p>Методы геометрического и гидростатического нивелирования; допускается тригонометрическое нивелирование электронными тахеометрами.</p><h3 id=\"s40\">7.7 Сборные панельные здания (5.3.1.25)</h3><p>При обследовании — обязательное выполнение (см. текст стандарта: проверка стыков, сварки, закладных; конкретика в 5.3.1.25).</p><hr><h2 id=\"s41\">8. КАМЕННЫЕ КОНСТРУКЦИИ (5.3.2)</h2><ul><li>Устанавливают материал, наличие и характер дефектов: отклонения от вертикали,</li></ul><p>неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки/штукатурки, выпадение кирпичей, капиллярный подсос (5.3.2.1).</p><ul><li>Для конструкции стен и характеристик материалов — <strong>выборочное контрольное зондирование</strong>,</li></ul><p>отбор проб из разных слоёв для влажности и объёмной массы; стены очищают от облицовки и штукатурки на площади, достаточной для установления типа кладки (5.3.2.1).</p><ul><li>Для поверочных расчётов устанавливают наличие связевых сеток, анкеровки стен, глубины</li></ul><p>опирания плит, балок, перемычек (5.3.2.1).</p><ul><li>Прочность кладки — лабораторные испытания образцов; для полнотелого силикатного кирпича</li></ul><p>и раствора допускается неразрушающий контроль по предварительно построенной градуировочной зависимости (ГОСТ 22690); места с пластинчатой деструкцией непригодны (5.3.2.2).</p><ul><li>При комплексном обследовании, если прочность стен решающая, — лабораторные испытания</li></ul><p>по ГОСТ 8462 (в РФ ГОСТ Р 58527-2019), ГОСТ 5802, ГОСТ 24992; керны бетона по ГОСТ 28570; бут — по ГОСТ 4001 (5.3.2.3).</p><ul><li>Расчётные сопротивления кладки — по нормам (в РФ СП 15.13330.2020) в зависимости от вида</li></ul><p>и прочности изделия и раствора (5.3.2.4).</p><ul><li>Пустоты, металлические конструкции и арматура в кладке — магнитные и геофизические методы</li></ul><p>или вскрытие (5.3.2.5).</p><hr><h2 id=\"s42\">9. СТАЛЬНЫЕ, СТАЛЕЖЕЛЕЗОБЕТОННЫЕ, АЛЮМИНИЕВЫЕ (5.3.3)</h2><h3 id=\"s43\">9.1 Факторы оценки (5.3.3.1)</h3><p>Фактические размеры сечений, габариты элементов и узлов (с учётом коррозии); отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; наличие и качество защитных (в т. ч. огнезащитных) покрытий; фактические физико-механические характеристики стали и химсостав; фактическое пространственное положение; отсутствие элемента; отклонения от проектного положения (смещение опорных узлов ферм, взаимное смещение поясов ферм и прогонов).</p><h3 id=\"s44\">9.2 Дефекты</h3><p>Дефектами считаются отклонения выше предельных, установленных НД и ГОСТ 23118 (5.3.3.3); критерии — приложение Г.</p><h3 id=\"s45\">9.3 Идентификация стали (5.3.3.4—5.3.3.11)</h3><ul><li>вид и объём исследований — по полноте исполнительной документации, определяет исполнитель</li></ul><p>в программе/ТЗ;</p><ul><li>пробы — на участках, не влияющих на механическую безопасность, иначе разгрузка или</li></ul><p>страховочные опоры;</p><ul><li>химсостав — фотоэлектрический или атомно-эмиссионный спектральный анализ</li></ul><p>(ГОСТ 18895 / в РФ ГОСТ Р 54153-2010);</p><ul><li>механические свойства — ГОСТ 1497 (растяжение), ГОСТ 9454 (ударная вязкость),</li></ul><p>ГОСТ 28870 (толщина проката);</p><ul><li>срезные болты — ГОСТ ISO 898-1, гайки — ГОСТ ISO 898-2, шайбы — ГОСТ 11371;</li></ul><p>болтокомплекты с контролируемым натяжением — ГОСТ 32484.1—32484.6;</p><ul><li><strong>запрет:</strong> определять предел текучести и предел прочности по косвенным характеристикам</li></ul><p>(например, по твёрдости) — <strong>не допускается</strong> (5.3.3.10);</p><ul><li><strong>запрет:</strong> применять портативные рентгенофлуоресцентные анализаторы там, где они не дают</li></ul><p>требуемой точности по углероду, сере, фосфору и др. нормируемым элементам (5.3.3.11).</p><h3 id=\"s46\">9.4 Коррозия — измерения (5.3.3.12—5.3.3.13)</h3><ul><li>назначают <strong>редуцированные сечения</strong> с учётом фактических коррозионных повреждений;</li><li>толщину измеряют <strong>не менее чем в трёх наиболее повреждённых сечениях</strong> по длине элемента,</li></ul><p>в каждом сечении — <strong>не менее трёх измерений</strong>.</p><h3 id=\"s47\">9.5 Болтовые соединения (5.3.3.14—5.3.3.15)</h3><p>Проверяют: соответствие метизов стандартам, класс прочности болтов и гаек, наличие и комплектность шайб, натяжение и меры против самоотвинчивания, ширину раскрытия зазоров, качество герметизации, срыв контактной поверхности, трещины. <strong>Не допускается</strong> контролировать натяжение болтов, покрытых коррозией или защитными покрытиями, а также подготовленных к монтажу и установленных более 10 сут назад.</p><h3 id=\"s48\">9.6 Ведомость элементов (5.3.3.16)</h3><p>По результатам — ведомость основных элементов с размерами сечений и сталями для расчётов.</p><hr><h2 id=\"s49\">10. ДЕРЕВЯННЫЕ КОНСТРУКЦИИ (5.3.4)</h2><h3 id=\"s50\">10.1 Что проверяют (5.3.4.1)</h3><p>Фактическую конструктивную схему; участки с видимыми дефектами, потерей устойчивости, прогибами, раскрытием трещин, биопоражениями, огневыми поражениями; участки с недопустимыми атмосферными, конденсационными и техническими увлажнениями; схему и параметры внешних воздействий и фактические нагрузки; расчётные схемы, пролёты, сечения, условия опирания и закрепления; состояние узлов сопряжения; прочностные и физико-механические характеристики; температурно-влажностный режим; наличие и состояние защитной (в т. ч. огнезащитной) обработки; места, недоступные для обработки; отсутствие элементов; <strong>отсутствие креплений стропил, ендов, стоек к стенам</strong> (скрутки, анкеры) против отрыва ветром; наличие ветровых связей, укосин и элементов пространственной жёсткости.</p><h3 id=\"s51\">10.2 Влажность и прочность (5.3.4.2—5.3.4.5)</h3><p>Влажность — ГОСТ 16483.7 и ГОСТ 16588; температура и влажность в вентилируемых полостях, на чердаках и в подвалах — термометры и психрометры; воздухообмен — анемометры; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610, защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль волокон — ГОСТ 16483.10, поперёк — 16483.11, статический изгиб — 16483.3, модуль упругости — 16483.9, смятие — 16483.2, скалывание вдоль — 16483.5, поперёк — 16483.12. <strong>Важно:</strong> расчётные сопротивления древесины, не поражённой гнилью, принимают как для новой древесины (нет данных об изменении прочности во времени); при поверхностном разрушении гнилью размеры сечения уменьшают (5.3.4.5).</p><h3 id=\"s52\">10.3 Клееные деревянные конструкции (КДК) (5.3.4.13—5.3.4.19)</h3><p>Характерные дефекты — трещины по древесине и расслоения по клеевым швам; фиксируют глубину, протяжённость, место; при первом обследовании в опорных сечениях — визуальный поиск сдвигов; жёсткие стыки большепролётных КДК — сплошному контролю; послойное измерение влажности.</p><hr><h2 id=\"s53\">11. ФАСАДНЫЕ КОНСТРУКЦИИ (5.3.5)</h2><h3 id=\"s54\">11.1 Оценка (5.3.5.1)</h3><p>По механической безопасности, пожарной безопасности, долговечности, энергоэффективности.</p><h3 id=\"s55\">11.2 Визуальный контроль (5.3.5.4)</h3><p>Плоскостность «поля» облицовки; трещины в штукатурном слое, лицевом слое кирпича и штучных элементов; расположение, сколы, смещения, нарушение линий швов; поверхностные повреждения облицовки и креплений (каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия); целостность откосов, фартуков, отливов и защита подоблицовочного пространства; подвижные элементы и общая зыбкость конструкции. Результат — ведомость дефектов с нанесением на чертежи фасадов.</p><h3 id=\"s56\">11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7)</h3><p>В подоблицовочном пространстве проверяют: состав и целостность узлов крепления подконструкций и облицовки; анкерные крепления; следы коррозии; заклёпочные и болтовые соединения; перекрытие деформационных швов облицовкой; состояние теплоизоляции; вид и состояние облицовываемой конструкции. Места отбора проб: по полю стены; на углах и в зонах изменения конфигурации; в уровне цоколя; в зоне сопряжения с отмосткой/тротуаром/газоном; по длине откосов проёмов; в зоне перемычек; на парапетах; по длине архитектурно-декоративных элементов и в зонах сопряжения разных материалов и секций; в зонах крепления навесного оборудования и пожарных лестниц.</p><h3 id=\"s57\">11.4 Анкеры (5.3.5.10)</h3><p>Несущая способность — по натурным испытаниям (в РФ ГОСТ Р 56731-2023, ГОСТ Р 58387-2019, ГОСТ Р 58430-2019).</p><hr><h2 id=\"s58\">12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли</h2><h3 id=\"s59\">12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2)</h3><p>Устанавливают: расчётную схему и материал несущих конструкций; основные размеры (длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками); состояние несущих конструкций (трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит); состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, состояние гидроизоляции; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия — для установления сечений несущих элементов и оценки состояния заделки их в стену; места вскрытий — по расчётной схеме работы балконов.</p><h3 id=\"s60\">12.2 Лестницы (5.3.6.3—5.3.6.4)</h3><p>Конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления к зданию. <strong>Осмотру сверху и снизу подвергают все лестничные марши и площадки в здании.</strong> Вскрытия: места заделки площадок в стены, опор маршей; для каменных лестниц по металлическим косоурам — места заделки балок площадок; для бескосоурных консольных каменных — глубина заделки ступеней в кладку и отсутствие трещин и зазоров; для деревянных — вскрытие мест заделки балок и зондирование древесины.</p><h3 id=\"s61\">12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11)</h3><p>Устанавливают тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу (в РФ СП 17.13330.2017), состояние кровли и водостоков, наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; основные деформации системы (прогибы, удлинение пролёта балочных покрытий, углы наклона сечений и узлов ферм), смещения податливых соединений (взаимные сдвиги, обмятие во врубках), вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины (биоповреждения), наличие гидроизоляции между деревянными и каменными конструкциями; состояние раствора в кладке неоштукатуренных карнизов, трещины в оштукатуренных карнизах; состояние узлов опирания; ведомость дефектов; вскрытия кровли при необходимости.</p><p><strong>Конденсат и наледи на свесах и водостоках</strong> — обследование чердака, причины: разрушение стенок венткоробов и шахт; разрушение или отсутствие теплоизоляции трубопроводов; недостаточная толщина теплоизоляции чердачного перекрытия (определяют расчётом); нарушение пароизоляции; выпуск вытяжных каналов канализации в чердак; отсутствие герметичности притворов чердачных дверей и люков.</p><p><strong>Чердачные перекрытия:</strong> проверяют толщину слоя, влажность и объёмную массу утеплителя (засыпки), наличие пароизоляции; для ж.-б. панелей и настилов — размеры трещин и прогибы; для металлических кровель — степень коррозии, ослабления сечений, прогибы. <strong>Светопрозрачные конструкции</strong> — по ГОСТ 34379.</p><hr><h2 id=\"s62\">13. МОНИТОРИНГ (раздел 6) — кратко</h2><ul><li>6.1.1 виды: общий; ограниченно-работоспособных и аварийных; зоны влияния; уникальных.</li><li>Программа мониторинга разрабатывается; система наблюдений должна обеспечивать</li></ul><p>достоверность; при длительных наблюдениях — сопоставимость условий и средств измерений.</p><ul><li>6.1.7 первый этап — как правило, обследование (фиксация начального состояния).</li><li>6.1.8 при данных об ухудшении — внеочередное обследование и решение о мерах.</li><li>6.3 — мониторинг ограниченно-работоспособных/аварийных: частота и состав — по программе;</li></ul><p>форма заключения — приложение Л.</p><ul><li>6.4 — зона влияния: наблюдения за деформациями земной поверхности и зданий; осадки</li></ul><p>оснований — по ГОСТ 24846; форма — приложение М.</p><ul><li>6.5 — уникальные: стационарные автоматизированные системы, ранняя диагностика;</li></ul><p>форма — приложения Ж, И, К.</p><hr><h2 id=\"s63\">14. ПРИЛОЖЕНИЯ — ПРАКТИЧЕСКОЕ ПРИМЕНЕНИЕ</h2><h3 id=\"s64\">14.1 Приложение А (обязательное) — форма заключения по обследованию</h3><p>16 позиций: адрес; время обследования; организация; статус объекта (памятник); тип проекта (типовой с серией / индивидуальный); проектная организация; строительная организация; год возведения; год и характер последнего капремонта или реконструкции; собственник; форма собственности; конструктивный тип (каркас, смешанный каркас, с несущими стенами и др.); число этажей; период основного тона собственных колебаний (для КС-3 / предельное значение); крен (вдоль продольной и поперечной осей / предельное значение); установленная категория технического состояния объекта и отдельных типов конструкций.</p><p>Приложение к заключению (материалы, обосновывающие выбор категории): фотографии объекта; описание окружающей местности; описание общего состояния по визуальному обследованию; описание конструкций, характеристик и состояния; чертежи с деталями и обмерами; ведомость дефектов; схемы с местами измерений и вскрытий; результаты измерений и оценка показателей для поверочных расчётов; действующие нагрузки и поверочные расчёты несущей способности конструкций и основания; планы обмеров и разрезы, планы и разрезы шурфов, скважин, чертежи вскрытий; геологические и гидрогеологические условия, строительные и мерзлотные характеристики грунтов; фотографии повреждений фасадов и конструкций; анализ причин дефектов и повреждений; рекомендации по проектированию мероприятий по восстановлению или усилению (при ограниченно-работоспособном или аварийном состоянии).</p><h3 id=\"s65\">14.2 Приложение Б (обязательное) — форма комплексного заключения</h3><p>15 позиций (как А, без статуса и формы собственности, без периода колебаний) + оценка технического состояния: лифтового оборудования; электросетей и средств связи; водостоков; систем горячего водоснабжения, отопления, холодного водоснабжения, канализации, вентиляции, мусороудаления, газоснабжения; звукоизоляции конструкций; теплотехнического состояния ограждающих конструкций. Приложения: 1) материалы по конструкциям; 2) материалы по системам ИТО, звукоизоляции, теплотехнике (схемы, фотографии, дефектные ведомости; схемы вводов и мощности; ведомость отклонений от проекта и норм; результаты акустических и теплотехнических измерений и расчёты).</p><h3 id=\"s66\">14.3 Приложения В, Г, Д — таблицы «дефект → категория → причина»</h3><p>Структура всех трёх таблиц одинакова: <strong>вид дефекта/повреждения | влияние на категорию технического состояния | возможные причины появления</strong>. Это готовый инструмент для предварительной (визуальной) оценки и для формулировок в заключении. Содержание перенесено в каталог дефектов: <code>Библиотека\\04_Дефекты\\КАТАЛОГ_ДЕФЕКТОВ.md</code>.</p><p>Ключевые пороги из приложения В (ж.-б.):</p><ul><li>нормальные трещины в изгибаемых и растянутых элементах шириной раскрытия более:</li></ul><p><strong>А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм</strong>;</p><ul><li>трещины вдоль арматурных стержней — <strong>не более 3 мм</strong>; при расположении на опорных</li></ul><p>участках состояние <strong>аварийное</strong>;</p><ul><li>относительные прогибы, превышающие: преднапряжённые стропильные фермы — <strong>1/700</strong>;</li></ul><p>преднапряжённые стропильные балки — <strong>1/300</strong>; плиты перекрытий и покрытий — <strong>1/150</strong>;</p><ul><li>наклонные трещины со смещением участков бетона и трещины, пересекающие арматуру —</li></ul><p><strong>аварийное</strong>;</p><ul><li>выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона сжатой</li></ul><p>зоны — <strong>аварийное</strong>;</p><ul><li>уменьшение площадок опирания против проекта — <strong>аварийное</strong> (обосновывается расчётом).</li></ul><p>Ключевые пороги из приложения В (каменные):</p><ul><li>вертикальные трещины раскрытием <strong>0,1—0,5 мм</strong>, пересекающие два ряда кладки и более,</li></ul><p>при <strong>двух и более</strong> трещинах на 1 м вертикально нагруженной стены → <strong>ограниченно-работоспособное</strong>;</p><ul><li>характер трещин как диагностический признак причины: параболические ветви, расходящиеся</li></ul><p>книзу от средней части здания → просадка грунта в средней части; раскрытие, увеличивающееся кверху, наклонные/параболические от краёв → просадка крайних частей или твёрдое включение под средней частью; близкая к вертикальной с увеличением кверху → разлом из-за жёсткой опоры в грунте; одинаковая по высоте со смещением части здания → просадка части здания.</p><p>Ключевые положения приложения Г (сталь):</p><ul><li>деформации, отклонения геометрии, отклонения от проектного положения, расцентровка</li></ul><p>в узлах, уменьшение сечения (вырезы, смятия, коррозия), изменение статической схемы, хрупкие и усталостные трещины в основном металле, недопустимые дефекты сварных швов, зазоры во фрикционных соединениях элементов группы 1, зазоры в растянутых сжато-изогнутых и изгибаемо-растянутых фланцевых соединениях, недопустимые дефекты кромок для группы 1 → <strong>аварийное</strong> (как правило, с обоснованием расчётами);</p><ul><li>зазоры во фрикционных соединениях групп 2—4, зазоры в срезных болтовых соединениях,</li></ul><p>зазоры в сжатых фланцевых соединениях, выпучивание стенок замкнутых сечений, местные погибы (если не влияют на работу), разрушение защитных покрытий и коррозия → <strong>ограниченно-работоспособное</strong>.</p><p>Ключевые положения приложения Д (дерево):</p><ul><li>отсутствие отдельного элемента наката, потеря целостности; отклонение от проектного</li></ul><p>положения; местное выпучивание простенков брусчатых стен; расстройство горизонтальных связей между брёвнами; осадка элементов сборно-щитовых и каркасных стен с перекосами и щелями; продольные трещины; прогиб элементов → <strong>аварийное</strong> (как правило, с обоснованием расчётами); причины: ошибки монтажа, гниль, уменьшение сечения, усушка, нарушения транспортирования, хранения, монтажа и эксплуатации.</p><hr><h2 id=\"s67\">15. ЧЕК-ЛИСТ ПРИМЕНЕНИЯ ГОСТ 31937-2024 В ЗАКЛЮЧЕНИИ</h2><ul><li>[ ] Определён вид обследования (конструкции / комплексное / визуальное / детальное /</li></ul><p>мониторинг) и это соответствует ТЗ (5.1.1, 5.1.2).</p><ul><li>[ ] Указаны основания обследования со ссылкой на 4.3 (или договор/предписание).</li><li>[ ] Указаны организация, ТЗ и программа работ, согласование с заказчиком (4.1, 4.4).</li><li>[ ] Приведён состав полученной документации (5.1.7) и её анализ (5.1.8).</li><li>[ ] Описан визуальный этап и его результаты по 5.1.10 (схемы, ведомости, фото).</li><li>[ ] Обосновано, почему детальное обследование выполнено или не выполнено (5.1.11).</li><li>[ ] По каждому элементу указаны параметры и методы по 5.2—5.3.7 с нормативными ссылками.</li><li>[ ] Соблюдены количественные требования (число участков, шурфов, образцов, сечений).</li><li>[ ] Применены средства измерений с поверкой (4.10).</li><li>[ ] Категории установлены по 4.5 и определениям 3.15, 3.18, 3.21, 3.1; при</li></ul><p>ограниченно-работоспособном/аварийном — указаны мероприятия и мониторинг (4.5).</p><ul><li>[ ] При аварийном состоянии — отражено письменное информирование (4.6).</li><li>[ ] Указан рекомендуемый срок следующего обследования (4.2).</li><li>[ ] Заключение оформлено по приложению А или Б, приложены материалы (14.1—14.2).</li><li>[ ] Оговорено, что стандарт не применяется к судебно-строительной экспертизе (раздел 1),</li></ul><p>если работа не судебная.</p><hr><h2 id=\"s68\">16. ССЫЛОЧНЫЕ НОРМЫ, КОТОРЫЕ ЧАЩЕ ВСЕГО НУЖНЫ (по примечаниям стандарта, РФ)</h2><div class=\"tablewrap\"><table><thead><tr><th>Область</th><th>Документ</th></tr></thead><tbody><tr><td>Каменные и армокаменные конструкции</td><td>СП 15.13330.2020</td></tr><tr><td>Стальные конструкции</td><td>СП 16.13330.2017</td></tr><tr><td>Бетонные и ж.-б. конструкции</td><td>СП 63.13330.2018</td></tr><tr><td>Деревянные конструкции</td><td>СП 64.13330.2017</td></tr><tr><td>Основания зданий</td><td>СП 22.13330.2016</td></tr><tr><td>Свайные фундаменты</td><td>СП 24.13330.2021</td></tr><tr><t 5.3.5.1)", 3], ["s55", "11.2 Визуальный контроль (5.3.5.4)", 3], ["s56", "11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7)", 3], ["s57", "11.4 Анкеры (5.3.5.10)", 3], ["s58", "12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли", 2], ["s59", "12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2)", 3], ["s60", "12.2 Лестницы (5.3.6.3—5.3.6.4)", 3], ["s61", "12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11)", 3], ["s62", "13. МОНИТОРИНГ (раздел 6) — кратко", 2], ["s63", "14. ПРИЛОЖЕНИЯ — ПРАКТИЧЕСКОЕ ПРИМЕНЕНИЕ", 2], ["s64", "14.1 Приложение А (обязательное) — форма заключения по обследованию", 3], ["s65", "14.2 Приложение Б (обязательное) — форма комплексного заключения", 3], ["s66", "14.3 Приложения В, Г, Д — таблицы «дефект → категория → причина»", 3], ["s67", "15. ЧЕК-ЛИСТ ПРИМЕНЕНИЯ ГОСТ 31937-2024 В ЗАКЛЮЧЕНИИ", 2], ["s68", "16. ССЫЛОЧНЫЕ НОРМЫ, КОТОРЫЕ ЧАЩЕ ВСЕГО НУЖНЫ (по примечаниям стандарта, РФ)", 2]], "chars": 43244, "plain": " ГОСТ 31937 2024 — рабочая карточка Источник: E:\\Экспертиза\\5 gost 31937 2024 (1).pdf (69 с., текстовый слой есть). Текст извлечён: Библиотека\\99 Служебное\\Извлечённое\\ГОСТ 31937 2024.txt . Все ссылки на пункты — по нумерации стандарта (страницы указаны в скобках). Карточка — рабочий конспект, не замена тексту стандарта. При спорных формулировках сверяться с оригиналом. 1. ПАСПОРТ ДОКУМЕНТА Параметр Значение Обозначение ГОСТ 31937—2024 Наименование Здания и сооружения. Правила обследования и мониторинга технического состояния Статус Межгосударственный стандарт, действует как национальный стандарт РФ Введён 01.05.2024 (приказ Росстандарта от 10.04.2024 № 433 ст) Взамен ГОСТ 31937—2011 Разработан АО «ЦНИИПромзданий» Приложения А—М, из них обязательные: А, Б, Е, Ж, И, К, Л, М; справочные: В, Г, Д Структура 1. Область применения (с. 1) 2. Нормативные ссылки (с. 2) 3. Термины и определения (с. 4) 4. Общие положения (с. 7) 5. Обследование технического состояния (с. 9) 5.1 Этапы, состав работ (с. 9) 5.2 Основания и фундаменты (с. 14) 5.3 Конструкции (с. 17): 5.3.1 бетон/ж. б.; 5.3.2 каменные; 5.3.3 стальные, сталежелезобетонные, алюминиевые; 5.3.4 деревянные; 5.3.5 фасадные; 5.3.6 элементы зданий (балконы, лоджии, эркеры, лестницы, кровли, чердаки, светопрозрачные); 5.3.7 огнезащитные покрытия 5.4 Системы инженерно технического обеспечения (с. 30) 5.5 Электросети и средства связи (с. 36) 5.6 Звукоизоляция, шум, вибрация (с. 37) 5.7 Теплотехнические показатели (с. 38) 6. Мониторинг технического состояния (с. 40) 7. Охрана труда (с. 43) Приложение А — форма заключения по обследованию (с. 44) Приложение Б — форма заключения по комплексному обследованию (с. 45) Приложение В — дефекты ж. б. и каменных конструкций (с. 47) Приложение Г — дефекты стальных конструкций (с. 51) Приложение Д — дефекты деревянных конструкций (с. 54) Приложение Е — форма паспорта здания (с. 55) Приложения Ж, И, К, Л, М — формы мониторинга (с. 57—63) 2. ОБЛАСТЬ ПРИМЕНЕНИЯ (раздел 1) Что охватывает. Нормативная основа контроля технического состояния зданий (сооружений) и систем инженерно технического обеспечения; исходные данные для проектирования реконструкции, капремонта, демонтажа. Виды работ по стандарту: комплексное обследование для установления технического состояния и исходных данных для проектирования реконструкции/капремонта; обследование для оценки возможности дальнейшей безаварийной эксплуатации, необходимости восстановления и усиления; обследование объектов незавершённого строительства; обследование для определения несущей способности конструкций и грунтов; обследование для проекта демонтажа (сноса) и объёмов отходов; энергетическое обследование; обследование систем инженерно технического обеспечения; мониторинг несущих конструкций реконструируемых зданий; общий мониторинг; мониторинг зон влияния; мониторинг ограниченно работоспособных и аварийных объектов; мониторинг уникальных зданий. Что НЕ охватывает: проектирование (стандарт не устанавливает требований к проектированию); транспортные, гидротехнические и мелиоративные сооружения, магистральные трубопроводы, подземные сооружения, объекты горных работ; судебно строительную экспертизу — важная граница: заключение по ГОСТ 31937 2024 ≠ судебная экспертиза. 3. ТЕРМИНЫ (раздел 3) — ядро тезауруса № Термин Определение (сжато) 3.1 аварийное техническое состояние Повреждения и деформации, свидетельствующие об исчерпании несущей способности и опасности обрушения, и/или крены, могущие вызвать потерю устойчивости 3.2 безопасность эксплуатации Комплексное свойство объекта, не позволяющее перейти в аварийное состояние (проект + остаточный ресурс + изменения + антитеррор + нормы эксплуатации) 3.3 восстановление Доведение эксплуатационных качеств конструкций из ограниченно работоспособного состояния до первоначального уровня по нормам на момент проектирования восстановления 3.4 дефект (повреждение) системы ИТО Несоответствие системы или её части параметру проекта/норм, ухудшающее состояние системы 3.5 дефект (повреждение) строительной конструкции Отдельное несоответствие конструкции параметру проекта/норм, ухудшающее её состояние или здания 3.6 динамические параметры Периоды и декременты собственных колебаний основного тона и обертонов, передаточные функции 3.7 заказчик Собственник или лицо, определённое собственником ответственным за договор 3.8 категория технического состояния Степень эксплуатационной пригодности и обеспечения механической безопасности, установленная по доле снижения несущей способности и эксплуатационных характеристик 3.9 комплексное обследование Специальный вид инженерных изысканий: грунты + конструкции + инженерное обеспечение + теплотехника и акустика, кроме технологического оборудования 3.10 критерий оценки технического состояния Установленное проектом/нормой количественное или качественное значение параметра, характеризующего переход в предельное состояние 3.11 механическая безопасность Состояние конструкций и основания, при котором отсутствует недопустимый риск вреда жизни, здоровью, имуществу, среде вследствие разрушения или потери устойчивости 3.12 мониторинг ограниченно работоспособных/аварийных Наблюдение по программе за степенью и скоростью изменения параметров, экстренные меры против обрушения, до приведения в работоспособное состояние 3.13 мониторинг зоны влияния Наблюдение за объектами в зоне влияния строительства и природно техногенных воздействий 3.14 мониторинг уникальных Наблюдение для раннего обнаружения негативных изменений НДС, крена; данные для мероприятий 3.15 нормативное техническое состояние Параметры всех критериев соответствуют проектной документации и действующим нормам на момент обследования 3.16 обследование технического состояния Специальный вид изысканий: определение фактических параметров, работоспособности, возможности эксплуатации/реконструкции/восстановления/усиления/ремонта/демонтажа; включает грунты, дефекты, фактическую несущую способность 3.17 общий мониторинг Наблюдение за объектами со значительными изменениями НДС или крена, которым необходимо обследование; программа утверждается заказчиком 3.18 ограниченно работоспособное Есть крены, дефекты и повреждения, снизившие несущую способность, и/или достаточность несущей способности не подтверждается поверочными расчётами, но опасности внезапного разрушения, потери устойчивости или опрокидывания нет; эксплуатация возможна при контроле (мониторинге) либо после мероприятий 3.19 оценка технического состояния Установление степени повреждения и категории на основе сопоставления фактических значений признаков с проектными/нормативными 3.20 поверочный расчёт Расчёт существующей конструкции и/или грунтов по действующим нормам проектирования с введением фактических геометрии, прочности материалов и грунтов, нагрузок, уточнённой расчётной схемы с учётом дефектов 3.21 работоспособное Некоторые контролируемые параметры не отвечают проекту/нормам, но нарушения не приводят к нарушению работоспособности; несущая способность и механическая безопасность обеспечиваются 3.22 система мониторинга ИТО Технические и программные средства сбора и обработки информации о параметрах системы ИТО 3.23 система мониторинга несущих конструкций Средства сбора и обработки информации о геодезических, динамических, деформационных параметрах и скорости их изменения 3.24 специализированная организация Организация, имеющая право работ по обследованию и мониторингу по законодательству 3.25 текущее техническое состояние Состояние на момент обследования или этапа мониторинга 3.26 текущие динамические параметры Динамические параметры на момент обследования или этапа мониторинга 3.27 усиление Мероприятия по повышению несущей способности и эксплуатационных свойств по сравнению с фактическим состоянием или проектом 3.28 физический износ здания Ухудшение технических и эксплуатационных показателей, вызванное объективными причинами Примечание: 3.1 и 3.18 — самые «цитируемые» определения в заключениях. Формулировки в выводах лучше давать близко к тексту, с указанием «согласно 3.18 ГОСТ 31937 2024». 4. ОБЩИЕ ПОЛОЖЕНИЯ (раздел 4) — что важно для обоснований 4.1 Кто проводит Обследование и мониторинг проводят специализированные организации (4.1). 4.2 Периодичность (сильный аргумент в заключениях) первое обследование — не позднее чем через 2 года после ввода в эксплуатацию; далее — не реже 1 раза в 10 лет ; не реже 1 раза в 5 лет — для зданий или отдельных элементов, работающих в неблагоприятных условиях (агрессивные среды, вибрации, повышенная влажность, сейсмичность 7 баллов и более и др.); рекомендуемый срок следующего обследования указывают в отчёте по результатам обследования (обязательный элемент отчёта); для уникальных зданий — постоянный режим мониторинга. 4.3 Основания для проведения обследования (готовый перечень для раздела «Основание») истечение расчётных сроков службы или сроков безаварийной эксплуатации по предыдущему заключению; разработка проекта реконструкции и капремонта; обнаружение дефектов, повреждений, деформаций, влияющих на безопасность; последствия пожаров, стихийных бедствий, аварий, угроза прогрессирующего обрушения; попадание в зону влияния нового строительства, реконструкции, природно техногенных воздействий; инициатива собственника; решение о дальнейшей эксплуатации или сносе (демонтаже); разработка проекта сноса (демонтажа); изменение назначения здания; предписание органов госстройнадзора. 4.4 Документная база Работы — по техническому заданию и, при необходимости, по программе работ , разработанной на его основе; программа согласовывается с заказчиком. 4.5 Категории и режимы эксплуатации (ключевой пункт) Оценка — по результатам обследования и, при необходимости, поверочных расчётов. Четыре категории: 1. нормативное ; 2. работоспособное ; 3. ограниченно работоспособное ; 4. аварийное . Режимы: нормативное и работоспособное → эксплуатация при фактических нагрузках и воздействиях без ограничений ; ограниченно работоспособное → контроль состояния, мероприятия по восстановлению или усилению конструкций и/или грунтового основания, последующий мониторинг (при необходимости); аварийное → эксплуатация не допускается ; разработать и выполнить противоаварийные мероприятия ; до приведения в работоспособное состояние — обязательный режим мониторинга . 4.6 Информирование при аварийном состоянии При выявлении дефектов, способных привести к резкому снижению несущей способности, обрушению, кренам, нарушению механической безопасности — письменно информировать заказчика, а при возможности собственника, лиц, в хозяйственном ведении/оперативном управлении которых находится объект, эксплуатирующую организацию и иных ответственных за эксплуатацию. 4.7—4.9 Особые случаи 4.7 демонтаж (снос) и объёмы отходов — детальное обследование допускается не выполнять, кроме обмеров; 4.8 восстановление утраченной проектной документации — сплошное детальное обследование; 4.9 техническая документация может быть восстановлена по результатам обследований. 4.10 Метрология Средства измерений и испытаний — с метрологическим обеспечением по законодательству; новые типы — аттестованы и поверены, методика при необходимости согласуется в программе. 5. ЭТАПЫ ОБСЛЕДОВАНИЯ (5.1) — скелет любого заключения 5.1.2 Три этапа 1. подготовка к обследованию; 2. предварительное (визуальное) обследование; 3. детальное (инструментальное) обследование — при необходимости. Объём работ на каждом этапе — в ТЗ, при необходимости в программе. 5.1.3 Цель комплексного обследования Определение технического состояния здания и элементов, количественная оценка фактических показателей качества грунтов, конструкций и систем инженерного обеспечения с учётом изменений во времени, для установления возможности дальнейшей эксплуатации или состава и объёма работ по капремонту/реконструкции. 5.1.4 Критерий достаточности Информация должна быть достаточной для принятия обоснованного решения о возможности дальнейшей эксплуатации. 5.1.5 Объекты обследования (перечень для ТЗ/программы) грунты основания, полы по грунту, фундаменты, включая сваи, ростверки, фундаментные балки; подземные воды, гидроизоляция подземной части; стены, колонны, столбы, пилоны, фахверки; перекрытия и покрытия (балки, арки, стропильные и подстропильные фермы, плиты, прогоны); балконы, эркеры, лестницы; подкрановые балки и фермы; светопрозрачные конструкции (витражи, зенитные и светоаэрационные фонари); связевые конструкции, элементы жёсткости; стыки и узлы, сопряжения, способы соединения, размеры площадок опирания; иные конструкции и элементы. Обследование может быть выборочным (часть конструкций) — по ТЗ/программе. 5.1.6—5.1.7 Подготовка: что запрашивать у заказчика инвентаризационные поэтажные планы, технический паспорт; акты осмотров эксплуатирующей организации, ведомости дефектов; акты, отчёты и заключения предыдущих обследований; проектная и исполнительная документация; сведения о перестройках, перепланировках, реконструкциях, капремонтах; геоподоснова; материалы инженерно геологических изысканий; согласованный протокол о порядке доступа к конструкциям и оборудованию; документы о местах и мощности подводки электроэнергии, в
