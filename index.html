оды, тепла, газа, водоотведения. 5.1.8 Что устанавливают по документам Автор и год проекта, конструктивная схема, применённые конструкции, монтажные схемы, время возведения, геометрия, расчётная схема, проектные нагрузки, характеристики материалов, документы оценки соответствия и паспорта изделий, характеристики грунтов, замены и отклонения от проекта, характер внешних воздействий, данные об окружающей среде, места и мощность подводок, проявившиеся дефекты. Программа работ включает: перечень конструкций и элементов; перечень инженерного оборудования, электросетей, средств связи; места и методы инструментальных измерений и испытаний; места вскрытий и отбора проб; необходимость инженерно геологических изысканий; перечень поверочных расчётов. 5.1.9 Визуальное обследование Сплошное визуальное обследование конструкций, систем, оборудования, средств связи; выявление дефектов по внешним признакам с измерениями и фиксацией; проверка характерных деформаций (прогибы, крены, неравномерные осадки). Допускается фотограмметрия, ортофотопланы, аэрофотосъёмка, лазерное сканирование. 5.1.10 Результаты визуального обследования (что должно быть в отчёте) схемы и ведомости дефектов с фиксацией мест, характера, параметров; описания и фотографии дефектных участков; результаты проверки деформаций (прогибы, крены, выгибы, перекосы, разломы); выявленные аварийные участки; уточнённая конструктивная схема с несущими конструкциями по этажам; схема мест выработок, вскрытий, зондирования; описание прилегающей территории, вертикальной планировки, отвода поверхностных вод; оценка расположения в застройке с точки зрения подпора в дымовых, газовых, вентиляционных каналах; предварительная оценка технического состояния (по приложениям В—Д); отчёт по визуальному обследованию. 5.1.11 Когда детальное обследование можно не проводить Если визуально установлено нормативное или работоспособное состояние, картина дефектов позволяет выявить причины и достаточна для оценки, и результатов визуального обследования достаточно для решения задач — детальное обследование допускается не проводить ; отчёт по визуальному обследованию является окончательным. Если визуально выявлено аварийное состояние — детальное обследование проводят при необходимости . Если выявлены дефекты, снижающие прочность, устойчивость и жёсткость, свидетельствующие об ограниченно работоспособном состоянии, и требуется оценка несущей способности (для проектирования, оценки влияния нового строительства и т. д.) — детальное обследование проводят. Примечание 5.1.11: для выявленных элементов усиления оценивать достаточность мероприятий по включению их в совместную работу. 5.1.12 Трещины → геология При характерных трещинах, перекосах, разломах стен, свидетельствующих о просадках основания, детальное обследование должно включать дополнительные инженерно геологические изыскания ; возможны не только восстановление и ремонт, но и усиление основания. 5.1.13 Состав детального обследования обмерные работы (геометрия зданий, конструкций, элементов, узлов); инженерно геологические изыскания (при необходимости); инструментальное определение параметров дефектов и повреждений; (далее по 5.1.13—5.1.16: определение прочности материалов, армирования, прогибов и т. д.; см. соответствующие подразделы 5.2—5.7). 6. ОСНОВАНИЯ И ФУНДАМЕНТЫ (5.2) 6.1 Состав работ (5.2.2) изучение фондовых материалов изысканий на данном и соседних участках, планировки и благоустройства; изучение материалов по конструктивному решению фундаментов; проходка шурфов вблизи фундаментов; проведение или актуализация инженерно геологических изысканий; обследование свайных фундаментов, определение фактической длины и состояния свай. 6.2 Что устанавливают (5.2.3) инженерно геологическое строение участка; тип фундаментов, форму в плане, размер, глубину заложения, ранее выполненные усиления и закрепления оснований; повреждения фундаментов с фотографированием и прочностью материалов; пробы для лабораторных испытаний материалов фундаментов и грунтов из под подошвы; наличие и состояние гидроизоляции, уровень грунтовых вод, температуру и агрессивность подземных вод. 6.3 Шурфы — нормативные параметры (готовые цифры для заключений) Глубина шурфа должна превышать глубину заложения подошвы на 0,15 м (5.2.7); длина обнажаемого участка — достаточная для определения типа и оценки состояния (5.2.7); количество шурфов — по величинам нагрузок на фундаменты (наружные/внутренние стены, загруженные и незагруженные, стены лестничных клеток, колонны каркаса) (5.2.6); при наличии трещин, выходящих на фундаменты, шурфы рекомендуется отрывать в таких местах; при деформациях стен и фундаментов — обязательно (5.2.6); при работах назначают дополнительные шурфы для определения границ фундаментов в аварийном или ограниченно работоспособном состоянии (5.2.6); места шурфов согласовывать с собственником и службами, контролирующими подземные сети (5.2.6); после окончания — тщательная засыпка с послойным трамбованием, восстановление покрытия и отмостки, меры против попадания поверхностных вод; восстановительные работы обеспечивает заказчик (5.2.18). 6.4 Критерии визуальной оценки фундаментов (5.2.14) наличие неравномерной осадки; характерные деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции, соответствие условиям эксплуатации. 6.5 Что определяют инструментально (5.2.15) Прочность, водопроницаемость и др. показатели бетона; количество, площадь и класс арматуры; толщину защитного слоя; степень и глубину коррозии бетона (карбонизация, сульфатизация, хлориды); прочность кладки; степень коррозии стали и сварных швов; осадки, крены, прогибы, кривизну; морозостойкость (ММГ, признаки морозного разрушения); биоповреждение и глубину деструкции деревянных лежней и свай; характеристики грунтов, УГВ и химсостав воды. 6.6 Сваи Длина свай — сейсмоакустическим методом (5.2.19); длина грунтоцементных свай — косвенными геофизическими методами с обязательной калибровкой по бурению контрольных скважин с отбором кернов. 7. БЕТОННЫЕ И ЖЕЛЕЗОБЕТОННЫЕ КОНСТРУКЦИИ (5.3.1) 7.1 Внешние признаки (5.3.1.1) Геометрия и сечения; сопоставление с проектом; соответствие фактической статической схемы расчётной; трещины, отколы, разрушения; расположение, характер и ширина раскрытия трещин; состояние защитных (в т. ч. огнезащитных) покрытий; прогибы и деформации; признаки нарушения сцепления арматуры с бетоном; разрыв арматуры; состояние анкеровки продольной и поперечной арматуры; степень коррозии бетона и арматуры. 7.2 Трещины (5.3.1.3—5.3.1.4) ширина раскрытия измеряется в местах максимального раскрытия и на уровне растянутой арматуры ; если это невозможно (плиты) — только на поверхности в местах максимума; инструмент: калиброванные щупы или измерительная лупа ; предельная ширина — по нормам (в РФ СП 63.13330.2018); трещины анализируют с точки зрения конструктивных особенностей и НДС. 7.3 Прочность бетона (5.3.1.5—5.3.1.8) методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570; предварительно — оперативный (экспертный) метод: молоток Физделя, ультразвуковое поверхностное прозвучивание и пр.; участки испытаний: в местах наименьшей прочности по экспертному методу; в зонах, определяющих несущую способность; в местах дефектов (пористость, коррозия, температурное растрескивание, изменение цвета); число участков не менее: 3 — прочность зоны или средняя прочность конструкции; 6 — средняя прочность и коэффициент изменчивости; 9 — прочность бетона в группе однотипных конструкций; число однотипных конструкций, в которых оценивается прочность, — не менее трёх . 7.4 Армирование (5.3.1.10—5.3.1.13) методы: магнитный (ГОСТ 22904), радиационный (ГОСТ 17625), контрольное вскрытие с обнажением арматуры, георадиолокация по аттестованной методике, ультразвук; число конструкций с определением диаметра, количества и расположения арматуры — не менее трёх ; прочность арматуры: образцы по ГОСТ 12004, не менее трёх стержней одного диаметра и профиля из однотипных конструкций; вырезать в сечениях, где несущая способность обеспечивается без вырезанных стержней; ориентировочно по рисунку профиля — не менее пяти участков ; обязательно устанавливать годы проектирования и постройки : нормативные и расчётные сопротивления арматуры менялись по годам. 7.5 Коррозия (5.3.1.14—5.3.1.19) оценивают вид коррозии (сплошная, язвенная, точечная, щелевая), участки, причину; признаки: площадь поражения, глубина поражений, площадь остаточного сечения; обнажение рабочей арматуры — в местах наибольшего ослабления (отслоение защитного слоя, трещины и ржавые пятна вдоль стержней); типовые зоны повышенного коррозионного износа (готовый чек лист для обследования): наружные стены ниже уровня земли; балконы и элементы лоджий; пандусы въездов в подземные и многоэтажные гаражи; перекрытия над проездами; низ и базы колонн; участки колонн, проходящие через перекрытие (при мокрой уборке); плиты покрытия вдоль ендов, у воронок внутреннего водостока, наружного остекления и торцов фонарей; конструкции в помещениях с повышенной влажностью и возможными протечками; опорные узлы ферм у водоприёмных воронок; верхние пояса ферм у аэрационных фонарей и ветробойных щитов; верхние пояса подстропильных ферм вдоль ендов; опорные узлы ферм внутри кирпичных стен. 7.6 Прогибы (5.3.1.20) Методы геометрического и гидростатического нивелирования; допускается тригонометрическое нивелирование электронными тахеометрами. 7.7 Сборные панельные здания (5.3.1.25) При обследовании — обязательное выполнение (см. текст стандарта: проверка стыков, сварки, закладных; конкретика в 5.3.1.25). 8. КАМЕННЫЕ КОНСТРУКЦИИ (5.3.2) Устанавливают материал, наличие и характер дефектов: отклонения от вертикали, неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки/штукатурки, выпадение кирпичей, капиллярный подсос (5.3.2.1). Для конструкции стен и характеристик материалов — выборочное контрольное зондирование , отбор проб из разных слоёв для влажности и объёмной массы; стены очищают от облицовки и штукатурки на площади, достаточной для установления типа кладки (5.3.2.1). Для поверочных расчётов устанавливают наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек (5.3.2.1). Прочность кладки — лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора допускается неразрушающий контроль по предварительно построенной градуировочной зависимости (ГОСТ 22690); места с пластинчатой деструкцией непригодны (5.3.2.2). При комплексном обследовании, если прочность стен решающая, — лабораторные испытания по ГОСТ 8462 (в РФ ГОСТ Р 58527 2019), ГОСТ 5802, ГОСТ 24992; керны бетона по ГОСТ 28570; бут — по ГОСТ 4001 (5.3.2.3). Расчётные сопротивления кладки — по нормам (в РФ СП 15.13330.2020) в зависимости от вида и прочности изделия и раствора (5.3.2.4). Пустоты, металлические конструкции и арматура в кладке — магнитные и геофизические методы или вскрытие (5.3.2.5). 9. СТАЛЬНЫЕ, СТАЛЕЖЕЛЕЗОБЕТОННЫЕ, АЛЮМИНИЕВЫЕ (5.3.3) 9.1 Факторы оценки (5.3.3.1) Фактические размеры сечений, габариты элементов и узлов (с учётом коррозии); отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; наличие и качество защитных (в т. ч. огнезащитных) покрытий; фактические физико механические характеристики стали и химсостав; фактическое пространственное положение; отсутствие элемента; отклонения от проектного положения (смещение опорных узлов ферм, взаимное смещение поясов ферм и прогонов). 9.2 Дефекты Дефектами считаются отклонения выше предельных, установленных НД и ГОСТ 23118 (5.3.3.3); критерии — приложение Г. 9.3 Идентификация стали (5.3.3.4—5.3.3.11) вид и объём исследований — по полноте исполнительной документации, определяет исполнитель в программе/ТЗ; пробы — на участках, не влияющих на механическую безопасность, иначе разгрузка или страховочные опоры; химсостав — фотоэлектрический или атомно эмиссионный спектральный анализ (ГОСТ 18895 / в РФ ГОСТ Р 54153 2010); механические свойства — ГОСТ 1497 (растяжение), ГОСТ 9454 (ударная вязкость), ГОСТ 28870 (толщина проката); срезные болты — ГОСТ ISO 898 1, гайки — ГОСТ ISO 898 2, шайбы — ГОСТ 11371; болтокомплекты с контролируемым натяжением — ГОСТ 32484.1—32484.6; запрет: определять предел текучести и предел прочности по косвенным характеристикам (например, по твёрдости) — не допускается (5.3.3.10); запрет: применять портативные рентгенофлуоресцентные анализаторы там, где они не дают требуемой точности по углероду, сере, фосфору и др. нормируемым элементам (5.3.3.11). 9.4 Коррозия — измерения (5.3.3.12—5.3.3.13) назначают редуцированные сечения с учётом фактических коррозионных повреждений; толщину измеряют не менее чем в трёх наиболее повреждённых сечениях по длине элемента, в каждом сечении — не менее трёх измерений . 9.5 Болтовые соединения (5.3.3.14—5.3.3.15) Проверяют: соответствие метизов стандартам, класс прочности болтов и гаек, наличие и комплектность шайб, натяжение и меры против самоотвинчивания, ширину раскрытия зазоров, качество герметизации, срыв контактной поверхности, трещины. Не допускается контролировать натяжение болтов, покрытых коррозией или защитными покрытиями, а также подготовленных к монтажу и установленных более 10 сут назад. 9.6 Ведомость элементов (5.3.3.16) По результатам — ведомость основных элементов с размерами сечений и сталями для расчётов. 10. ДЕРЕВЯННЫЕ КОНСТРУКЦИИ (5.3.4) 10.1 Что проверяют (5.3.4.1) Фактическую конструктивную схему; участки с видимыми дефектами, потерей устойчивости, прогибами, раскрытием трещин, биопоражениями, огневыми поражениями; участки с недопустимыми атмосферными, конденсационными и техническими увлажнениями; схему и параметры внешних воздействий и фактические нагрузки; расчётные схемы, пролёты, сечения, условия опирания и закрепления; состояние узлов сопряжения; прочностные и физико механические характеристики; температурно влажностный режим; наличие и состояние защитной (в т. ч. огнезащитной) обработки; места, недоступные для обработки; отсутствие элементов; отсутствие креплений стропил, ендов, стоек к стенам (скрутки, анкеры) против отрыва ветром; наличие ветровых связей, укосин и элементов пространственной жёсткости. 10.2 Влажность и прочность (5.3.4.2—5.3.4.5) Влажность — ГОСТ 16483.7 и ГОСТ 16588; температура и влажность в вентилируемых полостях, на чердаках и в подвалах — термометры и психрометры; воздухообмен — анемометры; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610, защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль волокон — ГОСТ 16483.10, поперёк — 16483.11, статический изгиб — 16483.3, модуль упругости — 16483.9, смятие — 16483.2, скалывание вдоль — 16483.5, поперёк — 16483.12. Важно: расчётные сопротивления древесины, не поражённой гнилью, принимают как для новой древесины (нет данных об изменении прочности во времени); при поверхностном разрушении гнилью размеры сечения уменьшают (5.3.4.5). 10.3 Клееные деревянные конструкции (КДК) (5.3.4.13—5.3.4.19) Характерные дефекты — трещины по древесине и расслоения по клеевым швам; фиксируют глубину, протяжённость, место; при первом обследовании в опорных сечениях — визуальный поиск сдвигов; жёсткие стыки большепролётных КДК — сплошному контролю; послойное измерение влажности. 11. ФАСАДНЫЕ КОНСТРУКЦИИ (5.3.5) 11.1 Оценка (5.3.5.1) По механической безопасности, пожарной безопасности, долговечности, энергоэффективности. 11.2 Визуальный контроль (5.3.5.4) Плоскостность «поля» облицовки; трещины в штукатурном слое, лицевом слое кирпича и штучных элементов; расположение, сколы, смещения, нарушение линий швов; поверхностные повреждения облицовки и креплений (каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия); целостность откосов, фартуков, отливов и защита подоблицовочного пространства; подвижные элементы и общая зыбкость конструкции. Результат — ведомость дефектов с нанесением на чертежи фасадов. 11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7) В подоблицовочном пространстве проверяют: состав и целостность узлов крепления подконструкций и облицовки; анкерные крепления; следы коррозии; заклёпочные и болтовые соединения; перекрытие деформационных швов облицовкой; состояние теплоизоляции; вид и состояние облицовываемой конструкции. Места отбора проб: по полю стены; на углах и в зонах изменения конфигурации; в уровне цоколя; в зоне сопряжения с отмосткой/тротуаром/газоном; по длине откосов проёмов; в зоне перемычек; на парапетах; по длине архитектурно декоративных элементов и в зонах сопряжения разных материалов и секций; в зонах крепления навесного оборудования и пожарных лестниц. 11.4 Анкеры (5.3.5.10) Несущая способность — по натурным испытаниям (в РФ ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019). 12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли 12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2) Устанавливают: расчётную схему и материал несущих конструкций; основные размеры (длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками); состояние несущих конструкций (трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит); состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, состояние гидроизоляции; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия — для установления сечений несущих элементов и оценки состояния заделки их в стену; места вскрытий — по расчётной схеме работы балконов. 12.2 Лестницы (5.3.6.3—5.3.6.4) Конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления к зданию. Осмотру сверху и снизу подвергают все лестничные марши и площадки в здании. Вскрытия: места заделки площадок в стены, опор маршей; для каменных лестниц по металлическим косоурам — места заделки балок площадок; для бескосоурных консольных каменных — глубина заделки ступеней в кладку и отсутствие трещин и зазоров; для деревянных — вскрытие мест заделки балок и зондирование древесины. 12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11) Устанавливают тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу (в РФ СП 17.13330.2017), состояние кровли и водостоков, наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; основные деформации системы (прогибы, удлинение пролёта балочных покрытий, углы наклона сечений и узлов ферм), смещения податливых соединений (взаимные сдвиги, обмятие во врубках), вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины (биоповреждения), наличие гидроизоляции между деревянными и каменными конструкциями; состояние раствора в кладке неоштукатуренных карнизов, трещины в оштукатуренных карнизах; состояние узлов опирания; ведомость дефектов; вскрытия кровли при необходимости. Конденсат и наледи на свесах и водостоках — обследование чердака, причины: разрушение стенок венткоробов и шахт; разрушение или отсутствие теплоизоляции трубопроводов; недостаточная толщина теплоизоляции чердачного перекрытия (определяют расчётом); нарушение пароизоляции; выпуск вытяжных каналов канализации в чердак; отсутствие герметичности притворов чердачных дверей и люков. Чердачные перекрытия: проверяют толщину слоя, влажность и объёмную массу утеплителя (засыпки), наличие пароизоляции; для ж. б. панелей и настилов — размеры трещин и прогибы; для металлических кровель — степень коррозии, ослабления сечений, прогибы. Светопрозрачные конструкции — по ГОСТ 34379. 13. МОНИТОРИНГ (раздел 6) — кратко 6.1.1 виды: общий; ограниченно работоспособных и аварийных; зоны влияния; уникальных. Программа мониторинга разрабатывается; система наблюдений должна обеспечивать достоверность; при длительных наблюдениях — сопоставимость условий и средств измерений. 6.1.7 первый этап — как правило, обследование (фиксация начального состояния). 6.1.8 при данных об ухудшении — внеочередное обследование и решение о мерах. 6.3 — мониторинг ограниченно работоспособных/аварийных: частота и состав — по программе; форма заключения — приложение Л. 6.4 — зона влияния: наблюдения за деформациями земной поверхности и зданий; осадки оснований — по ГОСТ 24846; форма — приложение М. 6.5 — уникальные: стационарные автоматизированные системы, ранняя диагностика; форма — приложения Ж, И, К. 14. ПРИЛОЖЕНИЯ — ПРАКТИЧЕСКОЕ ПРИМЕНЕНИЕ 14.1 Приложение А (обязательное) — форма заключения по обследованию 16 позиций: адрес; время обследования; организация; статус объекта (памятник); тип проекта (типовой с серией / индивидуальный); проектная организация; строительная организация; год возведения; год и характер последнего капремонта или реконструкции; собственник; форма собственности; конструктивный тип (каркас, смешанный каркас, с несущими стенами и др.); число этажей; период основного тона собственных колебаний (для КС 3 / предельное значение); крен (вдоль продольной и поперечной осей / предельное значение); установленная категория технического состояния объекта и отдельных типов конструкций. Приложение к заключению (материалы, обосновывающие выбор категории): фотографии объекта; описание окружающей местности; описание общего состояния по визуальному обследованию; описание конструкций, характеристик и состояния; чертежи с деталями и обмерами; ведомость дефектов; схемы с местами измерений и вскрытий; результаты измерений и оценка показателей для поверочных расчётов; действующие нагрузки и поверочные расчёты несущей способности конструкций и основания; планы обмеров и разрезы, планы и разрезы шурфов, скважин, чертежи вскрытий; геологические и гидрогеологические условия, строительные и мерзлотные характеристики грунтов; фотографии повреждений фасадов и конструкций; анализ причин дефектов и повреждений; рекомендации по проектированию мероприятий по восстановлению или усилению (при ограниченно работоспособном или аварийном состоянии). 14.2 Приложение Б (обязательное) — форма комплексного заключения 15 позиций (как А, без статуса и формы собственности, без периода колебаний) + оценка технического состояния: лифтового оборудования; электросетей и средств связи; водостоков; систем горячего водоснабжения, отопления, холодного водоснабжения, канализации, вентиляции, мусороудаления, газоснабжения; звукоизоляции конструкций; теплотехнического состояния ограждающих конструкций. Приложения: 1) материалы по конструкциям; 2) материалы по системам ИТО, звукоизоляции, теплотехнике (схемы, фотографии, дефектные ведомости; схемы вводов и мощности; ведомость отклонений от проекта и норм; результаты акустических и теплотехнических измерений и расчёты). 14.3 Приложения В, Г, Д — таблицы «дефект → категория → причина» Структура всех трёх таблиц одинакова: вид дефекта/повреждения влияние на категорию технического состояния возможные причины появления . Это готовый инструмент для предварительной (визуальной) оценки и для формулировок в заключении. Содержание перенесено в каталог дефектов: Библиотека\\04 Дефекты\\КАТАЛОГ ДЕФЕКТОВ.md . Ключевые пороги из приложения В (ж. б.): нормальные трещины в изгибаемых и растянутых элементах шириной раскрытия более: А240 — 0,5 мм; А300, А400, А500, А600 — 0,4 мм; в остальных случаях — 0,3 мм ; трещины вдоль арматурных стержней — не более 3 мм ; при расположении на опорных участках состояние аварийное ; относительные прогибы, превышающие: преднапряжённые стропильные фермы — 1/700 ; преднапряжённые стропильные балки — 1/300 ; плиты перекрытий и покрытий — 1/150 ; наклонные трещины со смещением участков бетона и трещины, пересекающие арматуру — аварийное ; выпучивание сжатой арматуры, продольные трещины в сжатой зоне, шелушение бетона сжатой зоны — аварийное ; уменьшение площадок опирания против проекта — аварийное (обосновывается расчётом). Ключевые пороги из приложения В (каменные): вертикальные трещины раскрытием 0,1—0,5 мм , пересекающие два ряда кладки и более, при двух и более трещинах на 1 м вертикально нагруженной стены → ограниченно работоспособное ; характер трещин как диагностический признак причины: параболические ветви, расходящиеся книзу от средней части здания → просадка грунта в средней части; раскрытие, увеличивающееся кверху, наклонные/параболические от краёв → просадка крайних частей или твёрдое включение под средней частью; близкая к вертикальной с увеличением кверху → разлом из за жёсткой опоры в грунте; одинаковая по высоте со смещением части здания → просадка части здания. Ключевые положения приложения Г (сталь): деформации, отклонения геометрии, отклонения от проектного положения, расцентровка в узлах, уменьшение сечения (вырезы, смятия, коррозия), изменение статической схемы, хрупкие и усталостные трещины в основном металле, недопустимые дефекты сварных швов, зазоры во фрикционных соединениях элементов группы 1, зазоры в растянутых сжато изогнутых и изгибаемо растянутых фланцевых соединениях, недопустимые дефекты кромок для группы 1 → аварийное (как правило, с обоснованием расчётами); зазоры во фрикционных соединениях групп 2—4, зазоры в срезных болтовых соединениях, зазоры в сжатых фланцевых соединениях, выпучивание стенок замкнутых сечений, местные погибы (если не влияют на работу), разрушение защитных покрытий и коррозия → ограниченно работоспособное . Ключевые положения приложения Д (дерево): отсутствие отдельного элемента наката, потеря целостности; отклонение от проектного положения; местное выпучивание простенков брусчатых стен; расстройство горизонтальных связей между брёвнами; осадка элементов сборно щитовых и каркасных стен с перекосами и щелями; продольные трещины; прогиб элементов → аварийное (как правило, с обоснованием расчётами); причины: ошибки монтажа, гниль, уменьшение сечения, усушка, нарушения транспортирования, хранения, монтажа и эксплуатации. 15. ЧЕК ЛИСТ ПРИМЕНЕНИЯ ГОСТ 31937 2024 В ЗАКЛЮЧЕНИИ [ ] Определён вид обследования (конструкции / комплексное / визуальное / детальное / мониторинг) и это соответствует ТЗ (5.1.1, 5.1.2). [ ] Указаны основания обследования со ссылкой на 4.3 (или договор/предписание). [ ] Указаны организация, ТЗ и программа работ, согласование с заказчиком (4.1, 4.4). [ ] Приведён состав полученной документации (5.1.7) и её анализ (5.1.8). [ ] Описан визуальный этап и его результаты по 5.1.10 (схемы, ведомости, фото). [ ] Обосновано, почему детальное обследование выполнено или не выполнено (5.1.11). [ ] По каждому элементу указаны параметры и методы по 5.2—5.3.7 с нормативными ссылками. [ ] Соблюдены количественные требования (число участков, шурфов, образцов, сечений). [ ] Применены средства измерений с поверкой (4.10). [ ] Категории установлены по 4.5 и определениям 3.15, 3.18, 3.21, 3.1; при ограниченно работоспособном/аварийном — указаны мероприятия и мониторинг (4.5). [ ] При аварийном состоянии — отражено письменное информирование (4.6). [ ] Указан рекомендуемый срок следующего обследования (4.2). [ ] Заключение оформлено по приложению А или Б, приложены материалы (14.1—14.2). [ ] Оговорено, что стандарт не применяется к судебно строительной экспертизе (раздел 1), если работа не судебная. 16. ССЫЛОЧНЫЕ НОРМЫ, КОТОРЫЕ ЧАЩЕ ВСЕГО НУЖНЫ (по примечаниям стандарта, РФ) Область Документ Каменные и армокаменные конструкции СП 15.13330.2020 Стальные конструкции СП 16.13330.2017 Бетонные и ж. б. конструкции СП 63.13330.2018 Деревянные конструкции СП 64.13330.2017 Основания зданий СП 22.13330.2016 Свайные фундаменты СП 24.13330.2021 Инженерно геологические изыскания СП 446.1325800.2019 Сваи/земляные сооружения СП 45.13330.2017 Несущие и ограждающие конструкции (изготовление/монтаж) СП 70.13330.2012 Кровли СП 17.13330.2017 Алюминиевые конструкции СП 128.13330.2016 Сталежелезобетонные СП 266.1325800.2016 Тонкостенные холодногнутые профили СП 260.1325800.2016 Вечномерзлые грунты СП 25.13330.2020 Светопрозрачные конструкции ГОСТ 34379 Параметры основного тона колебаний ГОСТ 34081 Наблюдения за деформациями оснований ГОСТ 24846 Вибрация зданий ГОСТ Р 52892 2007 Анкеры (испытания) ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019 Безопасность труда при обследовании ВСН 48 86(р), СНиП 12 03 2001, СНиП 12 04 2002 Список не исчерпывающий: полный перечень — раздел 2 стандарта и примечания по тексту. "}, {"id": "terms", "file": "02_Термины/ТЕЗАУРУС.md", "title": "ТЕЗАУРУС", "section": "02_Термины", "html": "<h1>ТЕЗАУРУС</h1><blockquote><p>Единый словарь терминов для заключений. Основа — ГОСТ 31937-2024 (раздел 3), дополнено терминами практики из архива ТЗ и последних экспертиз. Формулировки государственного стандарта приводятся как нормативные; практические — как рабочие. Связанные разделы: <code>06_Оценка_состояния</code>, <code>04_Дефекты</code>, <code>03_Конструктив</code>.</p></blockquote><hr><h2 id=\"s1\">1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937-2024, раздел 3)</h2><h3 id=\"s2\">Т-001. Аварийное техническое состояние</h3><ul><li><strong>Определение:</strong> категория технического состояния строительной конструкции или здания</li></ul><p>(сооружения) в целом, включая состояние грунтов основания, характеризующаяся повреждениями и деформациями, свидетельствующими об исчерпании несущей способности и опасности обрушения, и/или характеризующаяся кренами, которые могут вызвать потерю устойчивости объекта.</p><ul><li><strong>Норма:</strong> ГОСТ 31937-2024, п. 3.1.</li><li><strong>Практика:</strong> эксплуатация не допускается; противоаварийные мероприятия; обязательный мониторинг</li></ul><p>до приведения в работоспособное состояние (п. 4.5).</p><ul><li><strong>Связано:</strong> О-01, Ш-ВЫВ.</li></ul><h3 id=\"s3\">Т-002. Безопасность эксплуатации здания (сооружения)</h3><ul><li><strong>Определение:</strong> комплексное свойство объекта, не позволяющее ему перейти в аварийное</li></ul><p>состояние; определяется проектным решением и степенью его реального воплощения, текущим остаточным ресурсом и техническим состоянием, степенью изменения объекта и окружающей среды, совокупностью антитеррористических мероприятий и нормативами по эксплуатации.</p><ul><li><strong>Норма:</strong> п. 3.2.</li></ul><h3 id=\"s4\">Т-003. Восстановление</h3><ul><li><strong>Определение:</strong> комплекс мероприятий, обеспечивающих доведение эксплуатационных качеств</li></ul><p>конструкций, пришедших в ограниченно-работоспособное состояние, до уровня их первоначального состояния, определяемого требованиями нормативных документов на момент проектирования восстановления объекта.</p><ul><li><strong>Норма:</strong> п. 3.3. <strong>Отличие от усиления:</strong> восстановление — до исходного уровня,</li></ul><p>усиление — выше исходного.</p><ul><li><strong>Связано:</strong> Т-014 (усиление).</li></ul><h3 id=\"s5\">Т-004. Дефект (повреждение) системы инженерно-технического обеспечения</h3><ul><li><strong>Определение:</strong> отдельное несоответствие системы или её части какому-либо параметру,</li></ul><p>установленному проектом или нормами, приводящее к ухудшению технического состояния системы.</p><ul><li><strong>Норма:</strong> п. 3.4.</li></ul><h3 id=\"s6\">Т-005. Дефект (повреждение) строительной конструкции</h3><ul><li><strong>Определение:</strong> отдельное несоответствие строительной конструкции какому-либо параметру,</li></ul><p>установленному проектом или нормами, приводящее к ухудшению технического состояния конструкции или здания (сооружения).</p><ul><li><strong>Норма:</strong> п. 3.5.</li><li><strong>Практика:</strong> «дефект» и «повреждение» в стандарте используются как синонимы; в заключении</li></ul><p>допустимо писать «дефекты (повреждения)».</p><h3 id=\"s7\">Т-006. Динамические параметры зданий (сооружений)</h3><ul><li><strong>Определение:</strong> параметры, характеризующие динамические свойства: периоды и декременты</li></ul><p>собственных колебаний основного тона и обертонов, передаточные функции объектов, их частей и элементов.</p><ul><li><strong>Норма:</strong> п. 3.6.</li></ul><h3 id=\"s8\">Т-007. Заказчик</h3><ul><li><strong>Определение:</strong> собственник здания (сооружения) или иное лицо, определённое собственником</li></ul><p>ответственным за заключение договора со специализированной организацией.</p><ul><li><strong>Норма:</strong> п. 3.7.</li></ul><h3 id=\"s9\">Т-008. Категория технического состояния</h3><ul><li><strong>Определение:</strong> степень эксплуатационной пригодности и обеспечения механической безопасности</li></ul><p>строительной конструкции или здания (сооружения) в целом, а также грунтов их основания, установленная в зависимости от доли снижения несущей способности и эксплуатационных характеристик.</p><ul><li><strong>Норма:</strong> п. 3.8.</li><li><strong>Связано:</strong> КРИТЕРИИ_ОЦЕНКИ.</li></ul><h3 id=\"s10\">Т-009. Комплексное обследование технического состояния</h3><ul><li><strong>Определение:</strong> специальный вид инженерных изысканий: комплекс мероприятий по определению</li></ul><p>и оценке фактических значений контролируемых параметров грунтов основания, строительных конструкций, инженерного обеспечения, характеризующих функциональную работоспособность объекта и определяющих возможность дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта; включает обследование конструкций, теплотехнических и акустических свойств, систем инженерного обеспечения, за исключением технологического оборудования.</p><ul><li><strong>Норма:</strong> п. 3.9.</li></ul><h3 id=\"s11\">Т-010. Критерий оценки технического состояния</h3><ul><li><strong>Определение:</strong> установленное проектом или нормативным документом количественное или</li></ul><p>качественное значение параметра, характеризующего переход в предельное состояние и другие нормируемые характеристики конструкции, свойств материалов, грунтов основания и систем инженерно-технического обеспечения.</p><ul><li><strong>Норма:</strong> п. 3.10.</li></ul><h3 id=\"s12\">Т-011. Механическая безопасность здания (сооружения)</h3><ul><li><strong>Определение:</strong> состояние строительных конструкций и основания, при котором отсутствует</li></ul><p>недопустимый риск, связанный с причинением вреда жизни или здоровью граждан, имуществу, окружающей среде, жизни и здоровью животных и растений вследствие разрушения или потери устойчивости здания (сооружения) или его части.</p><ul><li><strong>Норма:</strong> п. 3.11. <strong>Связано:</strong> 384-ФЗ.</li></ul><h3 id=\"s13\">Т-012. Мониторинг технического состояния (виды)</h3><ul><li><strong>3.12</strong> — ограниченно-работоспособных и аварийных: наблюдение и контроль по программе</li></ul><p>за степенью и скоростью изменения параметров, экстренные меры против обрушения или опрокидывания, до приведения в работоспособное состояние.</p><ul><li><strong>3.13</strong> — зоны влияния строительства и природно-техногенных воздействий.</li><li><strong>3.14</strong> — уникальных зданий: раннее обнаружение негативных изменений НДС, крена.</li><li><strong>3.17</strong> — общий мониторинг: для объектов со значительными изменениями НДС или крена.</li><li><strong>Норма:</strong> пп. 3.12—3.14, 3.17; раздел 6.</li></ul><h3 id=\"s14\">Т-013. Нормативное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой количественные и качественные значения параметров</li></ul><p>всех критериев оценки соответствуют установленным в проектной документации значениям и действующим нормам на момент обследования.</p><ul><li><strong>Норма:</strong> п. 3.15.</li></ul><h3 id=\"s15\">Т-014. Обследование технического состояния здания (сооружения)</h3><ul><li><strong>Определение:</strong> специальный вид инженерных изысканий: комплекс мероприятий по определению</li></ul><p>и оценке фактических значений контролируемых параметров, характеризующих работоспособность объекта и определяющих возможность его дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта, демонтажа (сноса); включает обследование грунтов основания и строительных конструкций на предмет выявления изменения свойств грунтов, деформационных повреждений, дефектов несущих и ограждающих конструкций и определения их фактической несущей способности.</p><ul><li><strong>Норма:</strong> п. 3.16.</li></ul><h3 id=\"s16\">Т-015. Ограниченно-работоспособное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой имеются крены, дефекты и повреждения, приведшие</li></ul><p>к снижению несущей способности, и/или достаточность несущей способности не подтверждается поверочными расчётами, но отсутствует опасность внезапного разрушения, потери устойчивости или опрокидывания; функционирование конструкций и эксплуатация возможны либо при контроле (мониторинге), либо при проведении мероприятий по обеспечению механической безопасности, восстановлению или усилению конструкций и/или грунтов основания и последующем мониторинге (при необходимости).</p><ul><li><strong>Норма:</strong> п. 3.18.</li><li><strong>Практическое правило:</strong> ставить эту категорию только при наличии дефектов, снизивших</li></ul><p>несущую способность, либо при неподтверждённой расчётом несущей способности. Если дефектов нет — «работоспособное».</p><h3 id=\"s17\">Т-016. Оценка технического состояния</h3><ul><li><strong>Определение:</strong> установление степени повреждения и категории технического состояния</li></ul><p>конструкций или зданий (сооружений) в целом, включая грунты основания, на основе сопоставления фактических значений количественно оцениваемых признаков со значениями этих же признаков, установленных проектом или нормативным документом.</p><ul><li><strong>Норма:</strong> п. 3.19.</li></ul><h3 id=\"s18\">Т-017. Поверочный расчёт</h3><ul><li><strong>Определение:</strong> расчёт существующей конструкции и/или грунтов основания по действующим</li></ul><p>нормам проектирования с введением в расчёт полученных при обследовании геометрических параметров, прочности материалов и грунтов, действующих нагрузок, уточнённой расчётной схемы с учётом имеющихся дефектов и повреждений.</p><ul><li><strong>Норма:</strong> п. 3.20.</li></ul><h3 id=\"s19\">Т-018. Работоспособное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой некоторые из оцениваемых контролируемых параметров</li></ul><p>не отвечают требованиям проекта или норм, но нарушения в конкретных условиях эксплуатации не приводят к нарушению работоспособности; необходимая несущая способность конструкций и грунтов основания с учётом влияния дефектов и механическая безопасность обеспечиваются.</p><ul><li><strong>Норма:</strong> п. 3.21.</li></ul><h3 id=\"s20\">Т-019. Система мониторинга инженерно-технического обеспечения / несущих конструкций</h3><ul><li><strong>3.22</strong> — технические и программные средства сбора и обработки информации о параметрах</li></ul><p>работы системы ИТО, контроль дестабилизирующих факторов и передача сообщений об аварийных ситуациях.</p><ul><li><strong>3.23</strong> — средства сбора и обработки информации о геодезических, динамических,</li></ul><p>деформационных и других параметрах конструкций и скорости их изменения.</p><ul><li><strong>Норма:</strong> пп. 3.22—3.23.</li></ul><h3 id=\"s21\">Т-020. Специализированная организация</h3><ul><li><strong>Определение:</strong> организация, имеющая право выполнения работ по обследованию и мониторингу</li></ul><p>зданий (сооружений) в соответствии с требованиями действующего национального законодательства.</p><ul><li><strong>Норма:</strong> п. 3.24.</li></ul><h3 id=\"s22\">Т-021. Текущее техническое состояние / текущие динамические параметры</h3><ul><li><strong>Определение:</strong> состояние (динамические параметры) на момент обследования или проводимого</li></ul><p>этапа мониторинга.</p><ul><li><strong>Норма:</strong> пп. 3.25—3.26.</li></ul><h3 id=\"s23\">Т-022. Усиление</h3><ul><li><strong>Определение:</strong> комплекс мероприятий, обеспечивающих повышение несущей способности</li></ul><p>и эксплуатационных свойств конструкции или здания в целом, включая грунты основания, по сравнению с фактическим состоянием или проектными показателями.</p><ul><li><strong>Норма:</strong> п. 3.27. <strong>Связано:</strong> Т-003, О-05.</li></ul><h3 id=\"s24\">Т-023. Физический износ здания</h3><ul><li><strong>Определение:</strong> ухудшение технических и связанных с ними эксплуатационных показателей</li></ul><p>здания, вызванное объективными причинами.</p><ul><li><strong>Норма:</strong> п. 3.28.</li></ul><hr><h2 id=\"s25\">2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ)</h2><h3 id=\"s26\">Т-101. Надподвальное перекрытие</h3><ul><li><strong>Смысл:</strong> перекрытие над подвалом/техподпольем, отделяющее подвал от первого этажа.</li><li><strong>Практика:</strong> в архивных заключениях пишется ошибочно раздельно — «над подвальное</li></ul><p>перекрытие». Правильно: <strong>надподвальное</strong>.</p><ul><li><strong>Связано:</strong> К-03, Д-К03.</li></ul><h3 id=\"s27\">Т-102. Чердачное перекрытие</h3><ul><li><strong>Смысл:</strong> перекрытие над верхним этажом, отделяющее его от чердака.</li><li><strong>Связано:</strong> К-03.</li></ul><h3 id=\"s28\">Т-103. Межбалочное заполнение</h3><ul><li><strong>Смысл:</strong> заполнение между металлическими/деревянными балками: бетон на кирпичном бое,</li></ul><p>сводики, деревянные щиты, монолитный бетон.</p><ul><li><strong>Практика:</strong> от типа заполнения зависит нагрузка и характер разрушения; при сквозной</li></ul><p>коррозии балок заполнение часто сохраняется и представляет опасность обрушения.</p><ul><li><strong>Связано:</strong> К-03.</li></ul><h3 id=\"s29\">Т-104. Сквозная коррозия</h3><ul><li><strong>Смысл:</strong> коррозия, поразившая сечение элемента насквозь, с потерей несущей способности</li></ul><p>(в заключениях — «до 100 %»).</p><ul><li><strong>Практика:</strong> при сквозной коррозии сортамент определить невозможно; поверочный расчёт</li></ul><p>не выполняется, состояние аварийное.</p><ul><li><strong>Связано:</strong> Д-К05, Д-К03.</li></ul><h3 id=\"s30\">Т-105. Поверхностная коррозия</h3><ul><li><strong>Смысл:</strong> коррозия без потери сечения насквозь, с поверхностным поражением.</li><li><strong>Практика:</strong> в архивных заключениях указывают процент поражения (например, «до 11 %»).</li></ul><h3 id=\"s31\">Т-106. Сортамент</h3><ul><li><strong>Смысл:</strong> типоразмер прокатного профиля (двутавр № 10 по ОСТ 16-1926, 20Б1 и т. п.).</li><li><strong>Практика:</strong> в исторической застройке — профили по ОСТ 16-1926 и старым ГОСТ; при</li></ul><p>невозможности идентификации писать «сортамент определить невозможно».</p><ul><li><strong>Связано:</strong> СПРАВОЧНИК.</li></ul><h3 id=\"s32\">Т-107. Косоур</h3><ul><li><strong>Смысл:</strong> наклонная несущая балка лестницы, на которую опираются ступени/площадки.</li><li><strong>Связано:</strong> К-04.</li></ul><h3 id=\"s33\">Т-108. Перемычка</h3><ul><li><strong>Смысл:</strong> конструкция над проёмом, перекрывающая его и передающая нагрузку на стены.</li></ul><p>В исторической застройке — металлические двутавровые балки, клинчатые и арочные кирпичные перемычки.</p><ul><li><strong>Связано:</strong> К-02, Д-К02.</li></ul><h3 id=\"s34\">Т-109. Дефектная ведомость</h3><ul><li><strong>Смысл:</strong> таблица выявленных дефектов с локализацией, параметрами, причиной и ссылкой</li></ul><p>на фото. Обязательное приложение к заключению (приложение А/Б ГОСТ 31937-2024).</p><ul><li><strong>Связано:</strong> Ш-РЕЗ.</li></ul><h3 id=\"s35\">Т-110. Шифр</h3><ul><li><strong>Смысл:</strong> обозначение работы, например <code>06/1-08-2026-АВР</code>; в содержании —</li></ul><p><code>.../С</code>, <code>.../ТЗ</code>.</p><ul><li><strong>Связано:</strong> Ш-ТЗ.</li></ul><h3 id=\"s36\">Т-111. ОКН (объект культурного наследия)</h3><ul><li><strong>Смысл:</strong> объект, включённый в реестр (или выявленный), с особым режимом работ;</li></ul><p>ссылки — ГОСТ Р 55567-2013 и задание КГИОП.</p><ul><li><strong>Связано:</strong> О-07, Ш-ОП.</li></ul><h3 id=\"s37\">Т-112. Крен</h3><ul><li><strong>Смысл:</strong> отклонение здания или конструкции от вертикали; нормируется и измеряется</li></ul><p>геодезически; в форме заключения ГОСТ — «крен вдоль продольной и поперечной осей / предельное значение».</p><ul><li><strong>Связано:</strong> Д-К01, КРИТЕРИИ.</li></ul><h3 id=\"s38\">Т-113. Прогиб</h3><ul><li><strong>Смысл:</strong> вертикальное перемещение элемента под нагрузкой; нормируется в долях пролёта</li></ul><p>(например, 1/150 для плит, 1/300 и 1/700 для преднапряжённых балок и ферм).</p><ul><li><strong>Связано:</strong> Д-К03, КРИТЕРИИ.</li></ul><h3 id=\"s39\">Т-114. Рабочая арматура / анкеровка</h3><ul><li><strong>Смысл:</strong> продольная арматура, воспринимающая растягивающие усилия; анкеровка — заделка</li></ul><p>арматуры в бетоне/узле.</p><ul><li><strong>Связано:</strong> К-03, МЕТОДИКИ.</li></ul><h3 id=\"s40\">Т-115. Вскрытие (контрольное)</h3><ul><li><strong>Смысл:</strong> локальное удаление отделочных слоёв/бетона для измерения сечений, армирования,</li></ul><p>состояния узлов; обязательный элемент детального обследования.</p><ul><li><strong>Связано:</strong> МЕТОДИКИ.</li></ul><hr><h2 id=\"s41\">3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ</h2><div class=\"tablewrap\"><table><thead><tr><th>Неверно</th><th>Верно</th><th>Норма</th></tr></thead><tbody><tr><td>«над подвальное перекрытие»</td><td>надподвальное перекрытие</td><td>практика</td></tr><tr><td>«ГОСТ 31937» без года</td><td>ГОСТ 31937-2024</td><td>п. 1</td></tr><tr><td>«ГОСТ Р 31937-2011»</td><td>ГОСТ 31937-2011 (межгосударственный)</td><td>обозначение</td></tr><tr><td>«ограниченно работоспособное»</td><td>ограниченно-работоспособное</td><td>п. 3.18</td></tr><tr><td>«аварийное состояние» как «плохое»</td><td>аварийное = исчерпание несущей способности</td><td>п. 3.1</td></tr><tr><td>«износ» = «категория состояния»</td><td>физический износ ≠ категория</td><td>п. 3.28</td></tr><tr><td>«обследование» = «экспертиза»</td><td>обследование — изыскания; судебная экспертиза — вне ГОСТ</td><td>раздел 1</td></tr><tr><td>«усиление» = «восстановление»</td><td>усиление повышает, восстановление возвращает</td><td>пп. 3.3, 3.27</td></tr></tbody></table></div><hr><h2 id=\"s42\">4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок)</h2><div class=\"tablewrap\"><table><thead><tr><th>Русский</th><th>English</th></tr></thead><tbody><tr><td>обследование технического состояния</td><td>technical inspection / condition survey</td></tr><tr><td>техническое заключение</td><td>technical report / expert opinion</td></tr><tr><td>аварийное состояние</td><td>emergency (unsafe) condition</td></tr><tr><td>ограниченно-работоспособное</td><td>limited serviceable condition</td></tr><tr><td>работоспособное</td><td>serviceable condition</td></tr><tr><td>нормативное</td><td>normal (design-compliant) condition</td></tr><tr><td>несущая способность</td><td>load-bearing capacity</td></tr><tr><td>дефект / повреждение</td><td>defect / damage</td></tr><tr><td>поверочный расчёт</td><td>verification (checking) calculation</td></tr><tr><td>мониторинг</td><td>monitoring</td></tr><tr><td>усиление</td><td>strengthening</td></tr><tr><td>восстановление</td><td>restoration / rehabilitation</td></tr></tbody></table></div>", "toc": [["s1", "1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937-2024, раздел 3)", 2], ["s2", "Т-001. Аварийное техническое состояние", 3], ["s3", "Т-002. Безопасность эксплуатации здания (сооружения)", 3], ["s4", "Т-003. Восстановление", 3], ["s5", "Т-004. Дефект (повреждение) системы инженерно-технического обеспечения", 3], ["s6", "Т-005. Дефект (повреждение) строительной конструкции", 3], ["s7", "Т-006. Динамические параметры зданий (сооружений)", 3], ["s8", "Т-007. Заказчик", 3], ["s9", "Т-008. Категория технического состояния", 3], ["s10", "Т-009. Комплексное обследование технического состояния", 3], ["s11", "Т-010. Критерий оценки технического состояния", 3], ["s12", "Т-011. Механическая безопасность здания (сооружения)", 3], ["s13", "Т-012. Мониторинг технического состояния (виды)", 3], ["s14", "Т-013. Нормативное техническое состояние", 3], ["s15", "Т-014. Обследование технического состояния здания (сооружения)", 3], ["s16", "Т-015. Ограниченно-работоспособное техническое состояние", 3], ["s17", "Т-016. Оценка технического состояния", 3], ["s18", "Т-017. Поверочный расчёт", 3], ["s19", "Т-018. Работоспособное техническое состояние", 3], ["s20", "Т-019. Система мониторинга инженерно-технического обеспечения / несущих конструкций", 3], ["s21", "Т-020. Специализированная организация", 3], ["s22", "Т-021. Текущее техническое состояние / текущие динамические параметры", 3], ["s23", "Т-022. Усиление", 3], ["s24", "Т-023. Физический износ здания", 3], ["s25", "2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ)", 2], ["s26", "Т-101. Надподвальное перекрытие", 3], ["s27", "Т-102. Чердачное перекрытие", 3], ["s28", "Т-103. Межбалочное заполнение", 3], ["s29", "Т-104. Сквозная коррозия", 3], ["s30", "Т-105. Поверхностная коррозия", 3], ["s31", "Т-106. Сортамент", 3], ["s32", "Т-107. Косоур", 3], ["s33", "Т-108. Перемычка", 3], ["s34", "Т-109. Дефектная ведомость", 3], ["s35", "Т-110. Шифр", 3], ["s36", "Т-111. ОКН (объект культурного наследия)", 3], ["s37", "Т-112. Крен", 3], ["s38", "Т-113. Прогиб", 3], ["s39", "Т-114. Рабочая арматура / анкеровка", 3], ["s40", "Т-115. Вскрытие (контрольное)", 3], ["s41", "3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ", 2], ["s42", "4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок)", 2]], "chars": 14891, "plain": " ТЕЗАУРУС Единый словарь терминов для заключений. Основа — ГОСТ 31937 2024 (раздел 3), дополнено терминами практики из архива ТЗ и последних экспертиз. Формулировки государственного стандарта приводятся как нормативные; практические — как рабочие. Связанные разделы: 06 Оценка состояния , 04 Дефекты , 03 Конструктив . 1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937 2024, раздел 3) Т 001. Аварийное техническое состояние Определение: категория технического состояния строительной конструкции или здания (сооружения) в целом, включая состояние грунтов основания, характеризующаяся повреждениями и деформациями, свидетельствующими об исчерпании несущей способности и опасности обрушения, и/или характеризующаяся кренами, которые могут вызвать потерю устойчивости объекта. Норма: ГОСТ 31937 2024, п. 3.1. Практика: эксплуатация не допускается; противоаварийные мероприятия; обязательный мониторинг до приведения в работоспособное состояние (п. 4.5). Связано: О 01, Ш ВЫВ. Т 002. Безопасность эксплуатации здания (сооружения) Определение: комплексное свойство объекта, не позволяющее ему перейти в аварийное состояние; определяется проектным решением и степенью его реального воплощения, текущим остаточным ресурсом и техническим состоянием, степенью изменения объекта и окружающей среды, совокупностью антитеррористических мероприятий и нормативами по эксплуатации. Норма: п. 3.2. Т 003. Восстановление Определение: комплекс мероприятий, обеспечивающих доведение эксплуатационных качеств конструкций, пришедших в ограниченно работоспособное состояние, до уровня их первоначального состояния, определяемого требованиями нормативных документов на момент проектирования восстановления объекта. Норма: п. 3.3. Отличие от усиления: восстановление — до исходного уровня, усиление — выше исходного. Связано: Т 014 (усиление). Т 004. Дефект (повреждение) системы инженерно технического обеспечения Определение: отдельное несоответствие системы или её части какому либо параметру, установленному проектом или нормами, приводящее к ухудшению технического состояния системы. Норма: п. 3.4. Т 005. Дефект (повреждение) строительной конструкции Определение: отдельное несоответствие строительной конструкции какому либо параметру, установленному проектом или нормами, приводящее к ухудшению технического состояния конструкции или здания (сооружения). Норма: п. 3.5. Практика: «дефект» и «повреждение» в стандарте используются как синонимы; в заключении допустимо писать «дефекты (повреждения)». Т 006. Динамические параметры зданий (сооружений) Определение: параметры, характеризующие динамические свойства: периоды и декременты собственных колебаний основного тона и обертонов, передаточные функции объектов, их частей и элементов. Норма: п. 3.6. Т 007. Заказчик Определение: собственник здания (сооружения) или иное лицо, определённое собственником ответственным за заключение договора со специализированной организацией. Норма: п. 3.7. Т 008. Категория технического состояния Определение: степень эксплуатационной пригодности и обеспечения механической безопасности строительной конструкции или здания (сооружения) в целом, а также грунтов их основания, установленная в зависимости от доли снижения несущей способности и эксплуатационных характеристик. Норма: п. 3.8. Связано: КРИТЕРИИ ОЦЕНКИ. Т 009. Комплексное обследование технического состояния Определение: специальный вид инженерных изысканий: комплекс мероприятий по определению и оценке фактических значений контролируемых параметров грунтов основания, строительных конструкций, инженерного обеспечения, характеризующих функциональную работоспособность объекта и определяющих возможность дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта; включает обследование конструкций, теплотехнических и акустических свойств, систем инженерного обеспечения, за исключением технологического оборудования. Норма: п. 3.9. Т 010. Критерий оценки технического состояния Определение: установленное проектом или нормативным документом количественное или качественное значение параметра, характеризующего переход в предельное состояние и другие нормируемые характеристики конструкции, свойств материалов, грунтов основания и систем инженерно технического обеспечения. Норма: п. 3.10. Т 011. Механическая безопасность здания (сооружения) Определение: состояние строительных конструкций и основания, при котором отсутствует недопустимый риск, связанный с причинением вреда жизни или здоровью граждан, имуществу, окружающей среде, жизни и здоровью животных и растений вследствие разрушения или потери устойчивости здания (сооружения) или его части. Норма: п. 3.11. Связано: 384 ФЗ. Т 012. Мониторинг технического состояния (виды) 3.12 — ограниченно работоспособных и аварийных: наблюдение и контроль по программе за степенью и скоростью изменения параметров, экстренные меры против обрушения или опрокидывания, до приведения в работоспособное состояние. 3.13 — зоны влияния строительства и природно техногенных воздействий. 3.14 — уникальных зданий: раннее обнаружение негативных изменений НДС, крена. 3.17 — общий мониторинг: для объектов со значительными изменениями НДС или крена. Норма: пп. 3.12—3.14, 3.17; раздел 6. Т 013. Нормативное техническое состояние Определение: категория, при которой количественные и качественные значения параметров всех критериев оценки соответствуют установленным в проектной документации значениям и действующим нормам на момент обследования. Норма: п. 3.15. Т 014. Обследование технического состояния здания (сооружения) Определение: специальный вид инженерных изысканий: комплекс мероприятий по определению и оценке фактических значений контролируемых параметров, характеризующих работоспособность объекта и определяющих возможность его дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта, демонтажа (сноса); включает обследование грунтов основания и строительных конструкций на предмет выявления изменения свойств грунтов, деформационных повреждений, дефектов несущих и ограждающих конструкций и определения их фактической несущей способности. Норма: п. 3.16. Т 015. Ограниченно работоспособное техническое состояние Определение: категория, при которой имеются крены, дефекты и повреждения, приведшие к снижению несущей способности, и/или достаточность несущей способности не подтверждается поверочными расчётами, но отсутствует опасность внезапного разрушения, потери устойчивости или опрокидывания; функционирование конструкций и эксплуатация возможны либо при контроле (мониторинге), либо при проведении мероприятий по обеспечению механической безопасности, восстановлению или усилению конструкций и/или грунтов основания и последующем мониторинге (при необходимости). Норма: п. 3.18. Практическое правило: ставить эту категорию только при наличии дефектов, снизивших несущую способность, либо при неподтверждённой расчётом несущей способности. Если дефектов нет — «работоспособное». Т 016. Оценка технического состояния Определение: установление степени повреждения и категории технического состояния конструкций или зданий (сооружений) в целом, включая грунты основания, на основе сопоставления фактических значений количественно оцениваемых признаков со значениями этих же признаков, установленных проектом или нормативным документом. Норма: п. 3.19. Т 017. Поверочный расчёт Определение: расчёт существующей конструкции и/или грунтов основания по действующим нормам проектирования с введением в расчёт полученных при обследовании геометрических параметров, прочности материалов и грунтов, действующих нагрузок, уточнённой расчётной схемы с учётом имеющихся дефектов и повреждений. Норма: п. 3.20. Т 018. Работоспособное техническое состояние Определение: категория, при которой некоторые из оцениваемых контролируемых параметров не отвечают требованиям проекта или норм, но нарушения в конкретных условиях эксплуатации не приводят к нарушению работоспособности; необходимая несущая способность конструкций и грунтов основания с учётом влияния дефектов и механическая безопасность обеспечиваются. Норма: п. 3.21. Т 019. Система мониторинга инженерно технического обеспечения / несущих конструкций 3.22 — технические и программные средства сбора и обработки информации о параметрах работы системы ИТО, контроль дестабилизирующих факторов и передача сообщений об аварийных ситуациях. 3.23 — средства сбора и обработки информации о геодезических, динамических, деформационных и других параметрах конструкций и скорости их изменения. Норма: пп. 3.22—3.23. Т 020. Специализированная организация Определение: организация, имеющая право выполнения работ по обследованию и мониторингу зданий (сооружений) в соответствии с требованиями действующего национального законодательства. Норма: п. 3.24. Т 021. Текущее техническое состояние / текущие динамические параметры Определение: состояние (динамические параметры) на момент обследования или проводимого этапа мониторинга. Норма: пп. 3.25—3.26. Т 022. Усиление Определение: комплекс мероприятий, обеспечивающих повышение несущей способности и эксплуатационных свойств конструкции или здания в целом, включая грунты основания, по сравнению с фактическим состоянием или проектными показателями. Норма: п. 3.27. Связано: Т 003, О 05. Т 023. Физический износ здания Определение: ухудшение технических и связанных с ними эксплуатационных показателей здания, вызванное объективными причинами. Норма: п. 3.28. 2. ПРАКТИЧЕСКИЕ ТЕРМИНЫ АРХИВА (рабочие, не из ГОСТ) Т 101. Надподвальное перекрытие Смысл: перекрытие над подвалом/техподпольем, отделяющее подвал от первого этажа. Практика: в архивных заключениях пишется ошибочно раздельно — «над подвальное перекрытие». Правильно: надподвальное . Связано: К 03, Д К03. Т 102. Чердачное перекрытие Смысл: перекрытие над верхним этажом, отделяющее его от чердака. Связано: К 03. Т 103. Межбалочное заполнение Смысл: заполнение между металлическими/деревянными балками: бетон на кирпичном бое, сводики, деревянные щиты, монолитный бетон. Практика: от типа заполнения зависит нагрузка и характер разрушения; при сквозной коррозии балок заполнение часто сохраняется и представляет опасность обрушения. Связано: К 03. Т 104. Сквозная коррозия Смысл: коррозия, поразившая сечение элемента насквозь, с потерей несущей способности (в заключениях — «до 100 %»). Практика: при сквозной коррозии сортамент определить невозможно; поверочный расчёт не выполняется, состояние аварийное. Связано: Д К05, Д К03. Т 105. Поверхностная коррозия Смысл: коррозия без потери сечения насквозь, с поверхностным поражением. Практика: в архивных заключениях указывают процент поражения (например, «до 11 %»). Т 106. Сортамент Смысл: типоразмер прокатного профиля (двутавр № 10 по ОСТ 16 1926, 20Б1 и т. п.). Практика: в исторической застройке — профили по ОСТ 16 1926 и старым ГОСТ; при невозможности идентификации писать «сортамент определить невозможно». Связано: СПРАВОЧНИК. Т 107. Косоур Смысл: наклонная несущая балка лестницы, на которую опираются ступени/площадки. Связано: К 04. Т 108. Перемычка Смысл: конструкция над проёмом, перекрывающая его и передающая нагрузку на стены. В исторической застройке — металлические двутавровые балки, клинчатые и арочные кирпичные перемычки. Связано: К 02, Д К02. Т 109. Дефектная ведомость Смысл: таблица выявленных дефектов с локализацией, параметрами, причиной и ссылкой на фото. Обязательное приложение к заключению (приложение А/Б ГОСТ 31937 2024). Связано: Ш РЕЗ. Т 110. Шифр Смысл: обозначение работы, например 06/1 08 2026 АВР ; в содержании — .../С , .../ТЗ . Связано: Ш ТЗ. Т 111. ОКН (объект культурного наследия) Смысл: объект, включённый в реестр (или выявленный), с особым режимом работ; ссылки — ГОСТ Р 55567 2013 и задание КГИОП. Связано: О 07, Ш ОП. Т 112. Крен Смысл: отклонение здания или конструкции от вертикали; нормируется и измеряется геодезически; в форме заключения ГОСТ — «крен вдоль продольной и поперечной осей / предельное значение». Связано: Д К01, КРИТЕРИИ. Т 113. Прогиб Смысл: вертикальное перемещение элемента под нагрузкой; нормируется в долях пролёта (например, 1/150 для плит, 1/300 и 1/700 для преднапряжённых балок и ферм). Связано: Д К03, КРИТЕРИИ. Т 114. Рабочая арматура / анкеровка Смысл: продольная арматура, воспринимающая растягивающие усилия; анкеровка — заделка арматуры в бетоне/узле. Связано: К 03, МЕТОДИКИ. Т 115. Вскрытие (контрольное) Смысл: локальное удаление отделочных слоёв/бетона для измерения сечений, армирования, состояния узлов; обязательный элемент детального обследования. Связано: МЕТОДИКИ. 3. ТЕРМИНОЛОГИЧЕСКИЕ ПАРЫ, КОТОРЫЕ ПУТАЮТ Неверно Верно Норма «над подвальное перекрытие» надподвальное перекрытие практика «ГОСТ 31937» без года ГОСТ 31937 2024 п. 1 «ГОСТ Р 31937 2011» ГОСТ 31937 2011 (межгосударственный) обозначение «ограниченно работоспособное» ограниченно работоспособное п. 3.18 «аварийное состояние» как «плохое» аварийное = исчерпание несущей способности п. 3.1 «износ» = «категория состояния» физический износ ≠ категория п. 3.28 «обследование» = «экспертиза» обследование — изыскания; судебная экспертиза — вне ГОСТ раздел 1 «усиление» = «восстановление» усиление повышает, восстановление возвращает пп. 3.3, 3.27 4. АНГЛИЙСКИЕ СООТВЕТСТВИЯ (для переводов и ссылок) Русский English обследование технического состояния technical inspection / condition survey техническое заключение technical report / expert opinion аварийное состояние emergency (unsafe) condition ограниченно работоспособное limited serviceable condition работоспособное serviceable condition нормативное normal (design compliant) condition несущая способность load bearing capacity дефект / повреждение defect / damage поверочный расчёт verification (checking) calculation мониторинг monitoring усиление strengthening восстановление restoration / rehabilitation "}, {"id": "construct", "file": "03_Конструктив/ИНДЕКС_КОНСТРУКТИВА.md", "title": "ИНДЕКС КОНСТРУКТИВА (К-01…К-10)", "section": "03_Конструктив", "html": "<h1>ИНДЕКС КОНСТРУКТИВА (К-01…К-10)</h1><blockquote><p>Что обследовать по каждому элементу: состав работ, параметры, типовые дефекты, ссылки на норму. Основа — ГОСТ 31937-2024, разделы 5.2—5.7, и практика архива ТЗ (~700 прочитанных отчётов; перекрытия — 627, кирпичные стены — 551, металл — 515). Дефекты — в <code>04_Дефекты</code>, методики — в <code>05_Методики</code>, критерии — в <code>06_Оценка</code>.</p></blockquote><hr><h2 id=\"s1\">К-01. Основания и фундаменты, грунты, осадки</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.2; СП 22.13330.2016; СП 24.13330.2021; СП 446.1325800.2019.</p><p><strong>Состав работ (5.2.2):</strong></p><ul><li>изучение фондовых изысканий на участке и соседних, планировки и благоустройства;</li><li>изучение материалов по конструктивному решению фундаментов;</li><li>проходка шурфов вблизи фундаментов;</li><li>проведение или актуализация инженерно-геологических изысканий;</li><li>обследование свайных фундаментов, определение фактической длины и состояния свай.</li></ul><p><strong>Что устанавливают (5.2.3):</strong></p><ul><li>геологическое строение участка;</li><li>тип фундаментов, форма в плане, размер, глубина заложения, ранее выполненные усиления;</li><li>повреждения фундаментов, прочность материалов;</li><li>пробы материалов фундаментов и грунтов из-под подошвы;</li><li>наличие и состояние гидроизоляции, УГВ, температура и агрессивность вод.</li></ul><p><strong>Ключевые цифры:</strong></p><ul><li>глубина шурфа — <strong>на 0,15 м ниже подошвы</strong> (5.2.7);</li><li>число шурфов — по величинам нагрузок на фундаменты (5.2.6);</li><li>при деформациях стен и фундаментов шурфы <strong>обязательны</strong> (5.2.6);</li><li>после работ — засыпка с трамбованием, восстановление покрытия и отмостки (5.2.18).</li></ul><p><strong>Критерии визуальной оценки (5.2.14):</strong> неравномерная осадка; деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции.</p><p><strong>Типовые дефекты:</strong> Д-К01-01 неравномерная осадка; Д-К01-02 разрушение тела фундамента; Д-К01-03 отсутствие/разрушение гидроизоляции; Д-К01-04 разуплотнение грунта; Д-К01-05 крен.</p><p><strong>Признак в заключении:</strong> «Неравномерная осадка … подтверждается …»; трещины в стенах с раскрытием кверху/книзу — диагностический признак (см. Д-К02-06…Д-К02-09).</p><hr><h2 id=\"s2\">К-02. Стены несущие (каменные, панельные, монолитные)</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, пп. 5.3.2, 5.3.1; СП 15.13330.2020; СП 63.13330.2018.</p><h3 id=\"s3\">К-02.1 Каменные (кирпичные) стены — основа архива</h3><p><strong>Что устанавливают (5.3.2.1):</strong></p><ul><li>материал конструкций;</li><li>дефекты и деформации: отклонения от вертикали, неравномерные осадки, выпучивания,</li></ul><p>выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки и штукатурки, выпадение кирпичей, капиллярный подсос;</p><ul><li>выборочное контрольное зондирование кладки, отбор проб из разных слоёв (влажность,</li></ul><p>объёмная масса);</p><ul><li>наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек.</li></ul><p><strong>Прочность (5.3.2.2—5.3.2.4):</strong> лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора — неразрушающий контроль по градуировочной зависимости (ГОСТ 22690); керны бетона — ГОСТ 28570; бут — ГОСТ 4001; расчётные сопротивления — по СП 15.13330.2020.</p><p><strong>Типовые дефекты:</strong> Д-К02-01 трещины вертикальные/наклонные; Д-К02-02 выпучивание; Д-К02-03 отклонение от вертикали; Д-К02-04 отколы, пробоины; Д-К02-05 увлажнение, высолы; Д-К02-06…09 трещины как признак просадки; Д-К02-10 разрушение перемычек.</p><h3 id=\"s4\">К-02.2 Панельные и монолитные стены</h3><p><strong>Норма:</strong> п. 5.3.1 (ж.-б.), для панельных — обязательная проверка стыков, сварки, закладных (5.3.1.25). <strong>Типовые дефекты:</strong> раскрытие трещин по швам, коррозия закладных, разрушение герметизации, отклонения от вертикали.</p><hr><h2 id=\"s5\">К-03. Перекрытия и покрытия</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, пп. 5.3.1 (ж.-б.), 5.3.3 (сталь), 5.3.4 (дерево); СП 63.13330.2018, СП 16.13330.2017, СП 64.13330.2017, СП 20.13330.2016.</p><h3 id=\"s6\">К-03.1 По металлическим балкам (доминирующий тип в архиве)</h3><p><strong>Что устанавливают:</strong></p><ul><li>схема: пролёт в свету, шаг балок, опирание (на кирпичную стену, на перемычку, заделка);</li><li>сечение и сортамент (двутавр, швеллер; ОСТ 16-1926, старые ГОСТ);</li><li>межбалочное заполнение (бетон на кирпичном бое, сводики, деревянные щиты);</li><li>покрытие (стяжка, плитка, асфальтобетон, дощатый настил);</li><li>состояние балок: коррозия (поверхностная/сквозная), прогиб, деформации, состояние</li></ul><p>опорных узлов и заделки.</p><p><strong>Ключевые нормы (5.3.3):</strong> толщину корродированных элементов измерять <strong>не менее чем в трёх наиболее повреждённых сечениях</strong>, в каждом — <strong>не менее трёх измерений</strong> (5.3.3.13); назначать редуцированные сечения (5.3.3.12).</p><p><strong>Типовые дефекты:</strong> Д-К03-01 сквозная коррозия балок; Д-К03-02 прогиб; Д-К03-03 разрушение заделки в стену; Д-К03-04 коррозия перемычек; Д-К03-05 обрушение участка; Д-К03-06 промерзание/протечки; Д-К03-07 недостаточная площадка опирания.</p><p><strong>Диагностический признак аварийности:</strong> «сортамент определить невозможно ввиду полного разрушения конструкций» + «исчерпание несущей способности» → аварийное.</p><h3 id=\"s7\">К-03.2 Железобетонные (сборные и монолитные)</h3><p><strong>Что устанавливают (5.3.1.1, 5.3.1.21):</strong> геометрия и сечения; сопоставление с проектом; соответствие статической схемы; трещины, отколы, разрушения; ширина раскрытия; защитный слой; прогибы; сцепление арматуры с бетоном; разрыв арматуры; анкеровка; коррозия бетона и арматуры.</p><p><strong>Число участков (5.3.1.8):</strong> 3 — зона/средняя прочность; 6 — средняя прочность и коэффициент изменчивости; 9 — группа однотипных конструкций; конструкций — не менее трёх.</p><p><strong>Типовые дефекты:</strong> Д-К03-10 трещины (нормальные, наклонные); Д-К03-11 сколы в сжатой зоне; Д-К03-12 отслоение защитного слоя; Д-К03-13 коррозия арматуры; Д-К03-14 прогиб сверх нормативного.</p><h3 id=\"s8\">К-03.3 Деревянные перекрытия</h3><p><strong>Норма:</strong> п. 5.3.4; СП 64.13330.2017. <strong>Что устанавливают (5.3.4.1, 5.3.6.11):</strong> схема, сечения, пролёты, условия опирания; влажность (ГОСТ 16483.7, 16588); биоповреждения (ГОСТ 18610); прогибы; состояние узлов; наличие и состояние утеплителя, пароизоляции; протечки. <strong>Важно (5.3.4.5):</strong> расчётные сопротивления древесины, не поражённой гнилью, — как для новой; при поверхностном разрушении гнилью сечение уменьшают. <strong>Типовые дефекты:</strong> Д-К03-20 гниль; Д-К03-21 прогиб; Д-К03-22 расстройство узлов; Д-К03-23 отсутствие/утрата элемента наката.</p><hr><h2 id=\"s9\">К-04. Балконы, лоджии, эркеры, крыльца, лестницы, козырьки</h2><p><strong>Норма:</strong> ГОСТ 31937-2024, п. 5.3.6.1—5.3.6.4.</p><h3 id=\"s10\">К-04.1 Балконы, эркеры, лоджии</h3><p><strong>Что устанавливают (5.3.6.1):</strong></p><ul><li>расчётная схема и материал несущих конструкций;</li><li>размеры: длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов,</li></ul><p>бортовых балок, расстояния между несущими балками;</p><ul><li>состояние несущих конструкций: трещины на плитах, прогибы, коррозия стальных балок</li></ul><p>и арматуры, сохранность покрытий и стяжек, уклоны плит;</p><ul><li>состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий,</li></ul><p>трещины в местах примыкания эркеров, гидроизоляция;</p><ul><li>состояние стоек, консолей, подкосов, кронштейнов, подвесок.</li></ul><p><strong>Вскрытия (5.3.6.2):</strong> для установления сечений несущих элементов и оценки заделки в стену; места — по расчётной схеме.</p><p><strong>Типовые дефекты:</strong> Д-К04-01 разрушение плиты; Д-К04-02 коррозия консольных балок; Д-К04-03 разрушение заделки; Д-К04-04 отсутствие/разрушение гидроизоляции; Д-К04-05 разрушение ограждения; Д-К04-06 трещины в месте примыкания эркера.</p><h3 id=\"s11\">К-04.2 Лестницы</h3><p><strong>Что устанавливают (5.3.6.3):</strong></p><ul><li>конструкция и материалы;</li><li>состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций</li></ul><p>в стены, креплений решёток;</p><ul><li>деформации несущих конструкций;</li><li>трещины и повреждения площадок, балок, маршей, ступеней;</li><li>коррозионный износ ступеней;</li><li>участки отрыва элементов в стальных лестницах и деформации узлов крепления.</li></ul><p><strong>Обязательно:</strong> осмотру сверху и снизу — <strong>все</strong> марши и площадки в здании (5.3.6.3). <strong>Вскрытия (5.3.6.4):</strong> места заделки площадок в стены, опор маршей; для каменных по косоурам — заделка балок площадок; для бескосоурных консольных — глубина заделки ступеней; для деревянных — вскрытие заделки балок и зондирование.</p><p><strong>Типовые дефекты:</strong> Д-К04-10 сквозная коррозия косоуров; Д-К04-11 разрушение площадки; Д-К04-12 трещины ступеней; Д-К04-13 утрата марша; Д-К04-14 отрыв узла крепления.</p><hr><h2 id=\"s12\">К-05. Каркас: колонны, балки, ригели, связи</h2><p><strong>Норма:</strong> п. 5.3.3; СП 16.13330.2017. <strong>Что устанавливают (5.3.3.1):</strong> фактические размеры сечений и габариты; отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; защитные и огнезащитные покрытия; характеристики стали и химсостав; пространственное положение; отсутствие элемента; смещения опорных узлов. <strong>Типовые дефекты:</strong> Д-К05-01 коррозия с уменьшением сечения; Д-К05-02 искривление; Д-К05-03 дефекты сварных швов; Д-К05-04 зазоры в болтовых соединениях; Д-К05-05 изменение статической схемы; Д-К05-06 трещины в основном металле.</p><hr><h2 id=\"s13\">К-06. Крыша, кровля, стропила, водосток</h2><p><strong>Норма:</strong> п. 5.3.6.5—5.3.6.11; СП 17.13330.2017. <strong>Что устанавливают:</strong> тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу; состояние кровли и водостоков; наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; деформации системы (прогибы, удлинение пролёта, углы наклона сечений и узлов ферм); смещения податливых соединений (сдвиги, обмятие во врубках); вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины и гидроизоляции между деревом и камнем; состояние раствора в карнизах; узлы опирания; ведомость дефектов; вскрытия при необходимости.</p><p><strong>Причины конденсата и наледей (5.3.6.6):</strong> разрушение венткоробов и шахт; отсутствие или разрушение теплоизоляции трубопроводов; недостаточная толщина утепления чердачного перекрытия; нарушение пароизоляции; выпуск вытяжных каналов в чердак; негерметичность притворов чердачных дверей и люков.</p><p><strong>Типовые дефекты:</strong> Д-К06-01 протечки; Д-К06-02 гниль стропил; Д-К06-03 прогиб стропил; Д-К06-04 разрушение кровельного покрытия; Д-К06-05 засорение/разрушение водостока; Д-К06-06 конденсат и наледи.</p><hr><h2 id=\"s14\">К-07. Фасад: отделка, штукатурка, облицовка, утепление, швы</h2><p><strong>Норма:</strong> п. 5.3.5; ГОСТ 34379 (светопрозрачные). <strong>Оценка (5.3.5.1):</strong> механическая безопасность, пожарная безопасность, долговечность, энергоэффективность. <strong>Визуальный контроль (5.3.5.4):</strong> плоскостность «поля» облицовки; трещины в штукатурном и лицевом слое; сколы, смещения, нарушение линий швов; каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия; целостность откосов, фартуков, отливов; подвижные элементы и зыбкость. <strong>Вскрытия (5.3.5.6—5.3.5.7):</strong> узлы крепления подконструкций и облицовки; анкеры; коррозия; заклёпочные и болтовые соединения; перекрытие деформационных швов; теплоизоляция; состояние облицовываемой конструкции. Места проб — поле стены, углы, цоколь, сопряжение с отмосткой, откосы, перемычки, парапеты, декоративные элементы, зоны крепления оборудования. <strong>Анкеры (5.3.5.10):</strong> несущая способность — по натурным испытаниям. <strong>Типовые дефекты:</strong> Д-К07-01 отслоение штукатурки; Д-К07-02 разрушение облицовки; Д-К07-03 коррозия креплений; Д-К07-04 выветривание кладки; Д-К07-05 зыбкость облицовки; Д-К07-06 промерзание/сверхнормативные теплопотери.</p><hr><h2 id=\"s15\">К-08. Полы, проёмы, перегородки, заполнение проёмов</h2><p><strong>Норма:</strong> п. 5.3.6 (элементы), п. 5.3.4.7—5.3.4.9 (деревянные перегородки). <strong>Что устанавливают:</strong> состояние полов и стяжек, уклоны; перегородки — материал, крепление, трещины; заполнение проёмов — перекосы, неплотности, состояние креплений; светопрозрачные конструкции — по ГОСТ 34379. <strong>Типовые дефекты:</strong> Д-К08-01 просадка/разрушение пола; Д-К08-02 трещины перегородок; Д-К08-03 перекос оконных/дверных блоков; Д-К08-04 разрушение откосов.</p><hr><h2 id=\"s16\">К-09. Инженерные системы, влияющие на конструктив</h2><p><strong>Норма:</strong> п. 5.4, 5.5, 5.7. <strong>Почему в конструктиве:</strong> протечки, конденсат, затопление подвалов — главные причины коррозии металла и гнили дерева (по архиву: недостаточная вентиляция подвала и систематическое затопление — типовые причины повреждений перекрытий). <strong>Что проверять:</strong> водостоки (5.4.8), отопление (5.4.2), ГВС (5.4.1), ХВС (5.4.3), канализацию (5.4.4), вентиляцию (5.4.5), мусороудаление (5.4.6), газоснабжение (5.4.7); электросети и связь (5.5); теплотехнику ограждений (5.7). <strong>Связано:</strong> Д-К03-01 (коррозия из-за протечек), Д-К09-01.</p><hr><h2 id=\"s17\">К-10. Аварийные ситуации</h2><p><strong>Норма:</strong> п. 4.5, 4.6; приложения В—Д. <strong>Признаки:</strong> исчерпание несущей способности; опасность обрушения; крены, угрожающие устойчивости; прогрессирующее обрушение; «сортамент определить невозможно». <strong>Действия по стандарту:</strong></p><ol><li>категория — аварийное;</li><li>эксплуатация не допускается (4.5);</li><li>письменное информирование заказчика, собственника, эксплуатирующей организации (4.6);</li><li>противоаварийные мероприятия;</li><li>обязательный мониторинг до приведения в работоспособное состояние (4.5).</li></ol><p><strong>Мероприятия из практики архива:</strong> стоечные крепления из металла под аварийной зоной; ограждение опасной зоны; запрет эксплуатации помещений; немедленная разработка проекта усиления/замены.</p><hr><h2 id=\"s18\">СВОДНАЯ МАТРИЦА «ЭЛЕМЕНТ → ЧТО МЕРИТЬ»</h2><div class=\"tablewrap\"><table><thead><tr><th>Элемент</th><th>Обязательные измерения</th><th>Инструмент</th></tr></thead><tbody><tr><td>К-01 фундамент</td><td>размеры в плане, глубина заложения, прочность материала, УГВ</td><td>рулетка, шурф, молоток Кашкарова/склерометр</td></tr><tr><td>К-02 кладка</td><td>геометрия, отклонение от вертикали, ширина трещин, прочность кирпича и раствора</td><td>отвес, щупы, лупа, лабораторные испытания</td></tr><tr><td>К-03 металл</td><td>сечение (с учётом коррозии), пролёт, шаг, прогиб</td><td>штангенциркуль, толщиномер, нивелир</td></tr><tr><td>К-03 ж.-б.</td><td>защитный слой, диаметр и шаг арматуры, прочность бетона, ширина трещин</td><td>магнитный/радиационный метод, склерометр</td></tr><tr><td>К-03 дерево</td><td>сечение, влажность, глубина гнили, прогиб</td><td>влагомер, зондирование, линейка</td></tr><tr><td>К-04 лестницы</td><td>сечения косоуров, заделка, износ ступеней</td><td>штангенциркуль, вскрытие</td></tr><tr><td>К-04 балконы</td><td>толщина плиты, сечения балок/подкосов, уклоны</td><td>штангенциркуль, уклономер</td></tr><tr><td>К-06 кровля</td><td>уклоны, сечения стропил, влажность</td><td>уклономер, влагомер</td></tr><tr><td>К-07 фасад</td><td>плоскостность, зыбкость, анкеры</td><td>правило, простукивание, испытания анкеров</td></tr></tbody></table></div>", "toc": [["s1", "К-01. Основания и фундаменты, грунты, осадки", 2], ["s2", "К-02. Стены несущие (каменные, панельные, монолитные)", 2], ["s3", "К-02.1 Каменные (кирпичные) стены — основа архива", 3], ["s4", "К-02.2 Панельные и монолитные стены", 3], ["s5", "К-03. Перекрытия и покрытия", 2], ["s6", "К-03.1 По металлическим балкам (доминирующий тип в архиве)", 3], ["s7", "К-03.2 Железобетонные (сборные и монолитные)", 3], ["s8", "К-03.3 Деревянные перекрытия", 3], ["s9", "К-04. Балконы, лоджии, эркеры, крыльца, лестницы,
