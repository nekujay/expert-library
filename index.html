ечаниям стандарта, РФ) Область Документ Каменные и армокаменные конструкции СП 15.13330.2020 Стальные конструкции СП 16.13330.2017 Бетонные и ж. б. конструкции СП 63.13330.2018 Деревянные конструкции СП 64.13330.2017 Основания зданий СП 22.13330.2016 Свайные фундаменты СП 24.13330.2021 Инженерно геологические изыскания СП 446.1325800.2019 Сваи/земляные сооружения СП 45.13330.2017 Несущие и ограждающие конструкции (изготовление/монтаж) СП 70.13330.2012 Кровли СП 17.13330.2017 Алюминиевые конструкции СП 128.13330.2016 Сталежелезобетонные СП 266.1325800.2016 Тонкостенные холодногнутые профили СП 260.1325800.2016 Вечномерзлые грунты СП 25.13330.2020 Светопрозрачные конструкции ГОСТ 34379 Параметры основного тона колебаний ГОСТ 34081 Наблюдения за деформациями оснований ГОСТ 24846 Вибрация зданий ГОСТ Р 52892 2007 Анкеры (испытания) ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019 Безопасность труда при обследовании ВСН 48 86(р), СНиП 12 03 2001, СНиП 12 04 2002 Список не исчерпывающий: полный перечень — раздел 2 стандарта и примечания по тексту. "}, {"id": "gost-elements", "file": "01_Нормативная_база/ГОСТ_31937-2024_КОНСТРУКЦИИ.md", "title": "ГОСТ 31937-2024: ТРЕБОВАНИЯ К КОНСТРУКЦИЯМ", "section": "01_Нормативная_база", "html": "<h1>ГОСТ 31937-2024: ТРЕБОВАНИЯ К КОНСТРУКЦИЯМ</h1><blockquote><p>Разделы 5.2—5.3.6 стандарта: что устанавливают при обследовании фундаментов, железобетона, каменных, стальных, деревянных и фасадных конструкций, балконов, лестниц и крыш. Общая часть стандарта — <a href=\"#/doc/gost\">ГОСТ 31937-2024</a>.</p></blockquote><h2 id=\"s1\">6. ОСНОВАНИЯ И ФУНДАМЕНТЫ (5.2)</h2><h3 id=\"s2\">6.1 Состав работ (5.2.2)</h3><ul><li>изучение фондовых материалов изысканий на данном и соседних участках, планировки</li></ul><p>и благоустройства;</p><ul><li>изучение материалов по конструктивному решению фундаментов;</li><li>проходка шурфов вблизи фундаментов;</li><li>проведение или актуализация инженерно-геологических изысканий;</li><li>обследование свайных фундаментов, определение фактической длины и состояния свай.</li></ul><h3 id=\"s3\">6.2 Что устанавливают (5.2.3)</h3><ul><li>инженерно-геологическое строение участка;</li><li>тип фундаментов, форму в плане, размер, глубину заложения, ранее выполненные усиления</li></ul><p>и закрепления оснований;</p><ul><li>повреждения фундаментов с фотографированием и прочностью материалов;</li><li>пробы для лабораторных испытаний материалов фундаментов и грунтов из-под подошвы;</li><li>наличие и состояние гидроизоляции, уровень грунтовых вод, температуру и агрессивность</li></ul><p>подземных вод.</p><h3 id=\"s4\">6.3 Шурфы — нормативные параметры (готовые цифры для заключений)</h3><ul><li><strong>Глубина шурфа должна превышать глубину заложения подошвы на 0,15 м</strong> (5.2.7);</li><li>длина обнажаемого участка — достаточная для определения типа и оценки состояния (5.2.7);</li><li>количество шурфов — по величинам нагрузок на фундаменты (наружные/внутренние стены,</li></ul><p>загруженные и незагруженные, стены лестничных клеток, колонны каркаса) (5.2.6);</p><ul><li>при наличии трещин, выходящих на фундаменты, шурфы <strong>рекомендуется</strong> отрывать в таких</li></ul><p>местах; при деформациях стен и фундаментов — <strong>обязательно</strong> (5.2.6);</p><ul><li>при работах назначают дополнительные шурфы для определения границ фундаментов</li></ul><p>в аварийном или ограниченно-работоспособном состоянии (5.2.6);</p><ul><li>места шурфов согласовывать с собственником и службами, контролирующими подземные сети</li></ul><p>(5.2.6);</p><ul><li>после окончания — тщательная засыпка с послойным трамбованием, восстановление покрытия</li></ul><p>и отмостки, меры против попадания поверхностных вод; восстановительные работы обеспечивает заказчик (5.2.18).</p><h3 id=\"s5\">6.4 Критерии визуальной оценки фундаментов (5.2.14)</h3><ul><li>наличие неравномерной осадки;</li><li>характерные деформации и трещины в стенах и надфундаментных конструкциях;</li><li>сохранность тела фундаментов;</li><li>надёжность антикоррозионной защиты и гидроизоляции, соответствие условиям эксплуатации.</li></ul><h3 id=\"s6\">6.5 Что определяют инструментально (5.2.15)</h3><p>Прочность, водопроницаемость и др. показатели бетона; количество, площадь и класс арматуры; толщину защитного слоя; степень и глубину коррозии бетона (карбонизация, сульфатизация, хлориды); прочность кладки; степень коррозии стали и сварных швов; осадки, крены, прогибы, кривизну; морозостойкость (ММГ, признаки морозного разрушения); биоповреждение и глубину деструкции деревянных лежней и свай; характеристики грунтов, УГВ и химсостав воды.</p><h3 id=\"s7\">6.6 Сваи</h3><p>Длина свай — сейсмоакустическим методом (5.2.19); длина грунтоцементных свай — косвенными геофизическими методами с обязательной калибровкой по бурению контрольных скважин с отбором кернов.</p><hr><h2 id=\"s8\">7. БЕТОННЫЕ И ЖЕЛЕЗОБЕТОННЫЕ КОНСТРУКЦИИ (5.3.1)</h2><h3 id=\"s9\">7.1 Внешние признаки (5.3.1.1)</h3><p>Геометрия и сечения; сопоставление с проектом; соответствие фактической статической схемы расчётной; трещины, отколы, разрушения; расположение, характер и ширина раскрытия трещин; состояние защитных (в т. ч. огнезащитных) покрытий; прогибы и деформации; признаки нарушения сцепления арматуры с бетоном; разрыв арматуры; состояние анкеровки продольной и поперечной арматуры; степень коррозии бетона и арматуры.</p><h3 id=\"s10\">7.2 Трещины (5.3.1.3—5.3.1.4)</h3><ul><li>ширина раскрытия измеряется в местах максимального раскрытия **и на уровне растянутой</li></ul><p>арматуры**; если это невозможно (плиты) — только на поверхности в местах максимума;</p><ul><li>инструмент: <strong>калиброванные щупы или измерительная лупа</strong>;</li><li>предельная ширина — по нормам (в РФ СП 63.13330.2018);</li><li>трещины анализируют с точки зрения конструктивных особенностей и НДС.</li></ul><h3 id=\"s11\">7.3 Прочность бетона (5.3.1.5—5.3.1.8)</h3><ul><li>методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570;</li><li>предварительно — оперативный (экспертный) метод: молоток Физделя, ультразвуковое</li></ul><p>поверхностное прозвучивание и пр.;</p><ul><li>участки испытаний: в местах наименьшей прочности по экспертному методу; в зонах,</li></ul><p>определяющих несущую способность; в местах дефектов (пористость, коррозия, температурное растрескивание, изменение цвета);</p><ul><li><strong>число участков не менее: 3</strong> — прочность зоны или средняя прочность конструкции;</li></ul><p><strong>6</strong> — средняя прочность и коэффициент изменчивости; <strong>9</strong> — прочность бетона в группе однотипных конструкций;</p><ul><li>число однотипных конструкций, в которых оценивается прочность, — <strong>не менее трёх</strong>.</li></ul><h3 id=\"s12\">7.4 Армирование (5.3.1.10—5.3.1.13)</h3><ul><li>методы: магнитный (ГОСТ 22904), радиационный (ГОСТ 17625), контрольное вскрытие</li></ul><p>с обнажением арматуры, георадиолокация по аттестованной методике, ультразвук;</p><ul><li>число конструкций с определением диаметра, количества и расположения арматуры —</li></ul><p><strong>не менее трёх</strong>;</p><ul><li>прочность арматуры: образцы по ГОСТ 12004, <strong>не менее трёх стержней</strong> одного диаметра</li></ul><p>и профиля из однотипных конструкций; вырезать в сечениях, где несущая способность обеспечивается без вырезанных стержней;</p><ul><li>ориентировочно по рисунку профиля — <strong>не менее пяти участков</strong>;</li><li><strong>обязательно устанавливать годы проектирования и постройки</strong>: нормативные</li></ul><p>и расчётные сопротивления арматуры менялись по годам.</p><h3 id=\"s13\">7.5 Коррозия (5.3.1.14—5.3.1.19)</h3><ul><li>оценивают вид коррозии (сплошная, язвенная, точечная, щелевая), участки, причину;</li><li>признаки: площадь поражения, глубина поражений, площадь остаточного сечения;</li><li>обнажение рабочей арматуры — в местах наибольшего ослабления (отслоение защитного слоя,</li></ul><p>трещины и ржавые пятна вдоль стержней);</p><ul><li><strong>типовые зоны повышенного коррозионного износа</strong> (готовый чек-лист для обследования):</li></ul><p>наружные стены ниже уровня земли; балконы и элементы лоджий; пандусы въездов в подземные и многоэтажные гаражи; перекрытия над проездами; низ и базы колонн; участки колонн, проходящие через перекрытие (при мокрой уборке); плиты покрытия вдоль ендов, у воронок внутреннего водостока, наружного остекления и торцов фонарей; конструкции в помещениях с повышенной влажностью и возможными протечками; опорные узлы ферм у водоприёмных воронок; верхние пояса ферм у аэрационных фонарей и ветробойных щитов; верхние пояса подстропильных ферм вдоль ендов; опорные узлы ферм внутри кирпичных стен.</p><h3 id=\"s14\">7.6 Прогибы (5.3.1.20)</h3><p>Методы геометрического и гидростатического нивелирования; допускается тригонометрическое нивелирование электронными тахеометрами.</p><h3 id=\"s15\">7.7 Сборные панельные здания (5.3.1.25)</h3><p>При обследовании — обязательное выполнение (см. текст стандарта: проверка стыков, сварки, закладных; конкретика в 5.3.1.25).</p><hr><h2 id=\"s16\">8. КАМЕННЫЕ КОНСТРУКЦИИ (5.3.2)</h2><ul><li>Устанавливают материал, наличие и характер дефектов: отклонения от вертикали,</li></ul><p>неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки/штукатурки, выпадение кирпичей, капиллярный подсос (5.3.2.1).</p><ul><li>Для конструкции стен и характеристик материалов — <strong>выборочное контрольное зондирование</strong>,</li></ul><p>отбор проб из разных слоёв для влажности и объёмной массы; стены очищают от облицовки и штукатурки на площади, достаточной для установления типа кладки (5.3.2.1).</p><ul><li>Для поверочных расчётов устанавливают наличие связевых сеток, анкеровки стен, глубины</li></ul><p>опирания плит, балок, перемычек (5.3.2.1).</p><ul><li>Прочность кладки — лабораторные испытания образцов; для полнотелого силикатного кирпича</li></ul><p>и раствора допускается неразрушающий контроль по предварительно построенной градуировочной зависимости (ГОСТ 22690); места с пластинчатой деструкцией непригодны (5.3.2.2).</p><ul><li>При комплексном обследовании, если прочность стен решающая, — лабораторные испытания</li></ul><p>по ГОСТ 8462 (в РФ ГОСТ Р 58527-2019), ГОСТ 5802, ГОСТ 24992; керны бетона по ГОСТ 28570; бут — по ГОСТ 4001 (5.3.2.3).</p><ul><li>Расчётные сопротивления кладки — по нормам (в РФ СП 15.13330.2020) в зависимости от вида</li></ul><p>и прочности изделия и раствора (5.3.2.4).</p><ul><li>Пустоты, металлические конструкции и арматура в кладке — магнитные и геофизические методы</li></ul><p>или вскрытие (5.3.2.5).</p><hr><h2 id=\"s17\">9. СТАЛЬНЫЕ, СТАЛЕЖЕЛЕЗОБЕТОННЫЕ, АЛЮМИНИЕВЫЕ (5.3.3)</h2><h3 id=\"s18\">9.1 Факторы оценки (5.3.3.1)</h3><p>Фактические размеры сечений, габариты элементов и узлов (с учётом коррозии); отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; наличие и качество защитных (в т. ч. огнезащитных) покрытий; фактические физико-механические характеристики стали и химсостав; фактическое пространственное положение; отсутствие элемента; отклонения от проектного положения (смещение опорных узлов ферм, взаимное смещение поясов ферм и прогонов).</p><h3 id=\"s19\">9.2 Дефекты</h3><p>Дефектами считаются отклонения выше предельных, установленных НД и ГОСТ 23118 (5.3.3.3); критерии — приложение Г.</p><h3 id=\"s20\">9.3 Идентификация стали (5.3.3.4—5.3.3.11)</h3><ul><li>вид и объём исследований — по полноте исполнительной документации, определяет исполнитель</li></ul><p>в программе/ТЗ;</p><ul><li>пробы — на участках, не влияющих на механическую безопасность, иначе разгрузка или</li></ul><p>страховочные опоры;</p><ul><li>химсостав — фотоэлектрический или атомно-эмиссионный спектральный анализ</li></ul><p>(ГОСТ 18895 / в РФ ГОСТ Р 54153-2010);</p><ul><li>механические свойства — ГОСТ 1497 (растяжение), ГОСТ 9454 (ударная вязкость),</li></ul><p>ГОСТ 28870 (толщина проката);</p><ul><li>срезные болты — ГОСТ ISO 898-1, гайки — ГОСТ ISO 898-2, шайбы — ГОСТ 11371;</li></ul><p>болтокомплекты с контролируемым натяжением — ГОСТ 32484.1—32484.6;</p><ul><li><strong>запрет:</strong> определять предел текучести и предел прочности по косвенным характеристикам</li></ul><p>(например, по твёрдости) — <strong>не допускается</strong> (5.3.3.10);</p><ul><li><strong>запрет:</strong> применять портативные рентгенофлуоресцентные анализаторы там, где они не дают</li></ul><p>требуемой точности по углероду, сере, фосфору и др. нормируемым элементам (5.3.3.11).</p><h3 id=\"s21\">9.4 Коррозия — измерения (5.3.3.12—5.3.3.13)</h3><ul><li>назначают <strong>редуцированные сечения</strong> с учётом фактических коррозионных повреждений;</li><li>толщину измеряют <strong>не менее чем в трёх наиболее повреждённых сечениях</strong> по длине элемента,</li></ul><p>в каждом сечении — <strong>не менее трёх измерений</strong>.</p><h3 id=\"s22\">9.5 Болтовые соединения (5.3.3.14—5.3.3.15)</h3><p>Проверяют: соответствие метизов стандартам, класс прочности болтов и гаек, наличие и комплектность шайб, натяжение и меры против самоотвинчивания, ширину раскрытия зазоров, качество герметизации, срыв контактной поверхности, трещины. <strong>Не допускается</strong> контролировать натяжение болтов, покрытых коррозией или защитными покрытиями, а также подготовленных к монтажу и установленных более 10 сут назад.</p><h3 id=\"s23\">9.6 Ведомость элементов (5.3.3.16)</h3><p>По результатам — ведомость основных элементов с размерами сечений и сталями для расчётов.</p><hr><h2 id=\"s24\">10. ДЕРЕВЯННЫЕ КОНСТРУКЦИИ (5.3.4)</h2><h3 id=\"s25\">10.1 Что проверяют (5.3.4.1)</h3><p>Фактическую конструктивную схему; участки с видимыми дефектами, потерей устойчивости, прогибами, раскрытием трещин, биопоражениями, огневыми поражениями; участки с недопустимыми атмосферными, конденсационными и техническими увлажнениями; схему и параметры внешних воздействий и фактические нагрузки; расчётные схемы, пролёты, сечения, условия опирания и закрепления; состояние узлов сопряжения; прочностные и физико-механические характеристики; температурно-влажностный режим; наличие и состояние защитной (в т. ч. огнезащитной) обработки; места, недоступные для обработки; отсутствие элементов; <strong>отсутствие креплений стропил, ендов, стоек к стенам</strong> (скрутки, анкеры) против отрыва ветром; наличие ветровых связей, укосин и элементов пространственной жёсткости.</p><h3 id=\"s26\">10.2 Влажность и прочность (5.3.4.2—5.3.4.5)</h3><p>Влажность — ГОСТ 16483.7 и ГОСТ 16588; температура и влажность в вентилируемых полостях, на чердаках и в подвалах — термометры и психрометры; воздухообмен — анемометры; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610, защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль волокон — ГОСТ 16483.10, поперёк — 16483.11, статический изгиб — 16483.3, модуль упругости — 16483.9, смятие — 16483.2, скалывание вдоль — 16483.5, поперёк — 16483.12. <strong>Важно:</strong> расчётные сопротивления древесины, не поражённой гнилью, принимают как для новой древесины (нет данных об изменении прочности во времени); при поверхностном разрушении гнилью размеры сечения уменьшают (5.3.4.5).</p><h3 id=\"s27\">10.3 Клееные деревянные конструкции (КДК) (5.3.4.13—5.3.4.19)</h3><p>Характерные дефекты — трещины по древесине и расслоения по клеевым швам; фиксируют глубину, протяжённость, место; при первом обследовании в опорных сечениях — визуальный поиск сдвигов; жёсткие стыки большепролётных КДК — сплошному контролю; послойное измерение влажности.</p><hr><h2 id=\"s28\">11. ФАСАДНЫЕ КОНСТРУКЦИИ (5.3.5)</h2><h3 id=\"s29\">11.1 Оценка (5.3.5.1)</h3><p>По механической безопасности, пожарной безопасности, долговечности, энергоэффективности.</p><h3 id=\"s30\">11.2 Визуальный контроль (5.3.5.4)</h3><p>Плоскостность «поля» облицовки; трещины в штукатурном слое, лицевом слое кирпича и штучных элементов; расположение, сколы, смещения, нарушение линий швов; поверхностные повреждения облицовки и креплений (каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия); целостность откосов, фартуков, отливов и защита подоблицовочного пространства; подвижные элементы и общая зыбкость конструкции. Результат — ведомость дефектов с нанесением на чертежи фасадов.</p><h3 id=\"s31\">11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7)</h3><p>В подоблицовочном пространстве проверяют: состав и целостность узлов крепления подконструкций и облицовки; анкерные крепления; следы коррозии; заклёпочные и болтовые соединения; перекрытие деформационных швов облицовкой; состояние теплоизоляции; вид и состояние облицовываемой конструкции. Места отбора проб: по полю стены; на углах и в зонах изменения конфигурации; в уровне цоколя; в зоне сопряжения с отмосткой/тротуаром/газоном; по длине откосов проёмов; в зоне перемычек; на парапетах; по длине архитектурно-декоративных элементов и в зонах сопряжения разных материалов и секций; в зонах крепления навесного оборудования и пожарных лестниц.</p><h3 id=\"s32\">11.4 Анкеры (5.3.5.10)</h3><p>Несущая способность — по натурным испытаниям (в РФ ГОСТ Р 56731-2023, ГОСТ Р 58387-2019, ГОСТ Р 58430-2019).</p><hr><h2 id=\"s33\">12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли</h2><h3 id=\"s34\">12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2)</h3><p>Устанавливают: расчётную схему и материал несущих конструкций; основные размеры (длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками); состояние несущих конструкций (трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит); состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, состояние гидроизоляции; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия — для установления сечений несущих элементов и оценки состояния заделки их в стену; места вскрытий — по расчётной схеме работы балконов.</p><h3 id=\"s35\">12.2 Лестницы (5.3.6.3—5.3.6.4)</h3><p>Конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления к зданию. <strong>Осмотру сверху и снизу подвергают все лестничные марши и площадки в здании.</strong> Вскрытия: места заделки площадок в стены, опор маршей; для каменных лестниц по металлическим косоурам — места заделки балок площадок; для бескосоурных консольных каменных — глубина заделки ступеней в кладку и отсутствие трещин и зазоров; для деревянных — вскрытие мест заделки балок и зондирование древесины.</p><h3 id=\"s36\">12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11)</h3><p>Устанавливают тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу (в РФ СП 17.13330.2017), состояние кровли и водостоков, наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; основные деформации системы (прогибы, удлинение пролёта балочных покрытий, углы наклона сечений и узлов ферм), смещения податливых соединений (взаимные сдвиги, обмятие во врубках), вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины (биоповреждения), наличие гидроизоляции между деревянными и каменными конструкциями; состояние раствора в кладке неоштукатуренных карнизов, трещины в оштукатуренных карнизах; состояние узлов опирания; ведомость дефектов; вскрытия кровли при необходимости.</p><p><strong>Конденсат и наледи на свесах и водостоках</strong> — обследование чердака, причины: разрушение стенок венткоробов и шахт; разрушение или отсутствие теплоизоляции трубопроводов; недостаточная толщина теплоизоляции чердачного перекрытия (определяют расчётом); нарушение пароизоляции; выпуск вытяжных каналов канализации в чердак; отсутствие герметичности притворов чердачных дверей и люков.</p><p><strong>Чердачные перекрытия:</strong> проверяют толщину слоя, влажность и объёмную массу утеплителя (засыпки), наличие пароизоляции; для ж.-б. панелей и настилов — размеры трещин и прогибы; для металлических кровель — степень коррозии, ослабления сечений, прогибы. <strong>Светопрозрачные конструкции</strong> — по ГОСТ 34379.</p><hr>", "toc": [["s1", "6. ОСНОВАНИЯ И ФУНДАМЕНТЫ (5.2)", 2], ["s2", "6.1 Состав работ (5.2.2)", 3], ["s3", "6.2 Что устанавливают (5.2.3)", 3], ["s4", "6.3 Шурфы — нормативные параметры (готовые цифры для заключений)", 3], ["s5", "6.4 Критерии визуальной оценки фундаментов (5.2.14)", 3], ["s6", "6.5 Что определяют инструментально (5.2.15)", 3], ["s7", "6.6 Сваи", 3], ["s8", "7. БЕТОННЫЕ И ЖЕЛЕЗОБЕТОННЫЕ КОНСТРУКЦИИ (5.3.1)", 2], ["s9", "7.1 Внешние признаки (5.3.1.1)", 3], ["s10", "7.2 Трещины (5.3.1.3—5.3.1.4)", 3], ["s11", "7.3 Прочность бетона (5.3.1.5—5.3.1.8)", 3], ["s12", "7.4 Армирование (5.3.1.10—5.3.1.13)", 3], ["s13", "7.5 Коррозия (5.3.1.14—5.3.1.19)", 3], ["s14", "7.6 Прогибы (5.3.1.20)", 3], ["s15", "7.7 Сборные панельные здания (5.3.1.25)", 3], ["s16", "8. КАМЕННЫЕ КОНСТРУКЦИИ (5.3.2)", 2], ["s17", "9. СТАЛЬНЫЕ, СТАЛЕЖЕЛЕЗОБЕТОННЫЕ, АЛЮМИНИЕВЫЕ (5.3.3)", 2], ["s18", "9.1 Факторы оценки (5.3.3.1)", 3], ["s19", "9.2 Дефекты", 3], ["s20", "9.3 Идентификация стали (5.3.3.4—5.3.3.11)", 3], ["s21", "9.4 Коррозия — измерения (5.3.3.12—5.3.3.13)", 3], ["s22", "9.5 Болтовые соединения (5.3.3.14—5.3.3.15)", 3], ["s23", "9.6 Ведомость элементов (5.3.3.16)", 3], ["s24", "10. ДЕРЕВЯННЫЕ КОНСТРУКЦИИ (5.3.4)", 2], ["s25", "10.1 Что проверяют (5.3.4.1)", 3], ["s26", "10.2 Влажность и прочность (5.3.4.2—5.3.4.5)", 3], ["s27", "10.3 Клееные деревянные конструкции (КДК) (5.3.4.13—5.3.4.19)", 3], ["s28", "11. ФАСАДНЫЕ КОНСТРУКЦИИ (5.3.5)", 2], ["s29", "11.1 Оценка (5.3.5.1)", 3], ["s30", "11.2 Визуальный контроль (5.3.5.4)", 3], ["s31", "11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7)", 3], ["s32", "11.4 Анкеры (5.3.5.10)", 3], ["s33", "12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли", 2], ["s34", "12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2)", 3], ["s35", "12.2 Лестницы (5.3.6.3—5.3.6.4)", 3], ["s36", "12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11)", 3]], "chars": 17378, "plain": " ГОСТ 31937 2024: ТРЕБОВАНИЯ К КОНСТРУКЦИЯМ Разделы 5.2—5.3.6 стандарта: что устанавливают при обследовании фундаментов, железобетона, каменных, стальных, деревянных и фасадных конструкций, балконов, лестниц и крыш. Общая часть стандарта — [ГОСТ 31937 2024]( /doc/gost). 6. ОСНОВАНИЯ И ФУНДАМЕНТЫ (5.2) 6.1 Состав работ (5.2.2) изучение фондовых материалов изысканий на данном и соседних участках, планировки и благоустройства; изучение материалов по конструктивному решению фундаментов; проходка шурфов вблизи фундаментов; проведение или актуализация инженерно геологических изысканий; обследование свайных фундаментов, определение фактической длины и состояния свай. 6.2 Что устанавливают (5.2.3) инженерно геологическое строение участка; тип фундаментов, форму в плане, размер, глубину заложения, ранее выполненные усиления и закрепления оснований; повреждения фундаментов с фотографированием и прочностью материалов; пробы для лабораторных испытаний материалов фундаментов и грунтов из под подошвы; наличие и состояние гидроизоляции, уровень грунтовых вод, температуру и агрессивность подземных вод. 6.3 Шурфы — нормативные параметры (готовые цифры для заключений) Глубина шурфа должна превышать глубину заложения подошвы на 0,15 м (5.2.7); длина обнажаемого участка — достаточная для определения типа и оценки состояния (5.2.7); количество шурфов — по величинам нагрузок на фундаменты (наружные/внутренние стены, загруженные и незагруженные, стены лестничных клеток, колонны каркаса) (5.2.6); при наличии трещин, выходящих на фундаменты, шурфы рекомендуется отрывать в таких местах; при деформациях стен и фундаментов — обязательно (5.2.6); при работах назначают дополнительные шурфы для определения границ фундаментов в аварийном или ограниченно работоспособном состоянии (5.2.6); места шурфов согласовывать с собственником и службами, контролирующими подземные сети (5.2.6); после окончания — тщательная засыпка с послойным трамбованием, восстановление покрытия и отмостки, меры против попадания поверхностных вод; восстановительные работы обеспечивает заказчик (5.2.18). 6.4 Критерии визуальной оценки фундаментов (5.2.14) наличие неравномерной осадки; характерные деформации и трещины в стенах и надфундаментных конструкциях; сохранность тела фундаментов; надёжность антикоррозионной защиты и гидроизоляции, соответствие условиям эксплуатации. 6.5 Что определяют инструментально (5.2.15) Прочность, водопроницаемость и др. показатели бетона; количество, площадь и класс арматуры; толщину защитного слоя; степень и глубину коррозии бетона (карбонизация, сульфатизация, хлориды); прочность кладки; степень коррозии стали и сварных швов; осадки, крены, прогибы, кривизну; морозостойкость (ММГ, признаки морозного разрушения); биоповреждение и глубину деструкции деревянных лежней и свай; характеристики грунтов, УГВ и химсостав воды. 6.6 Сваи Длина свай — сейсмоакустическим методом (5.2.19); длина грунтоцементных свай — косвенными геофизическими методами с обязательной калибровкой по бурению контрольных скважин с отбором кернов. 7. БЕТОННЫЕ И ЖЕЛЕЗОБЕТОННЫЕ КОНСТРУКЦИИ (5.3.1) 7.1 Внешние признаки (5.3.1.1) Геометрия и сечения; сопоставление с проектом; соответствие фактической статической схемы расчётной; трещины, отколы, разрушения; расположение, характер и ширина раскрытия трещин; состояние защитных (в т. ч. огнезащитных) покрытий; прогибы и деформации; признаки нарушения сцепления арматуры с бетоном; разрыв арматуры; состояние анкеровки продольной и поперечной арматуры; степень коррозии бетона и арматуры. 7.2 Трещины (5.3.1.3—5.3.1.4) ширина раскрытия измеряется в местах максимального раскрытия и на уровне растянутой арматуры ; если это невозможно (плиты) — только на поверхности в местах максимума; инструмент: калиброванные щупы или измерительная лупа ; предельная ширина — по нормам (в РФ СП 63.13330.2018); трещины анализируют с точки зрения конструктивных особенностей и НДС. 7.3 Прочность бетона (5.3.1.5—5.3.1.8) методы: разрушающие и неразрушающие по ГОСТ 10180, 18105, 22690, 17624, 28570; предварительно — оперативный (экспертный) метод: молоток Физделя, ультразвуковое поверхностное прозвучивание и пр.; участки испытаний: в местах наименьшей прочности по экспертному методу; в зонах, определяющих несущую способность; в местах дефектов (пористость, коррозия, температурное растрескивание, изменение цвета); число участков не менее: 3 — прочность зоны или средняя прочность конструкции; 6 — средняя прочность и коэффициент изменчивости; 9 — прочность бетона в группе однотипных конструкций; число однотипных конструкций, в которых оценивается прочность, — не менее трёх . 7.4 Армирование (5.3.1.10—5.3.1.13) методы: магнитный (ГОСТ 22904), радиационный (ГОСТ 17625), контрольное вскрытие с обнажением арматуры, георадиолокация по аттестованной методике, ультразвук; число конструкций с определением диаметра, количества и расположения арматуры — не менее трёх ; прочность арматуры: образцы по ГОСТ 12004, не менее трёх стержней одного диаметра и профиля из однотипных конструкций; вырезать в сечениях, где несущая способность обеспечивается без вырезанных стержней; ориентировочно по рисунку профиля — не менее пяти участков ; обязательно устанавливать годы проектирования и постройки : нормативные и расчётные сопротивления арматуры менялись по годам. 7.5 Коррозия (5.3.1.14—5.3.1.19) оценивают вид коррозии (сплошная, язвенная, точечная, щелевая), участки, причину; признаки: площадь поражения, глубина поражений, площадь остаточного сечения; обнажение рабочей арматуры — в местах наибольшего ослабления (отслоение защитного слоя, трещины и ржавые пятна вдоль стержней); типовые зоны повышенного коррозионного износа (готовый чек лист для обследования): наружные стены ниже уровня земли; балконы и элементы лоджий; пандусы въездов в подземные и многоэтажные гаражи; перекрытия над проездами; низ и базы колонн; участки колонн, проходящие через перекрытие (при мокрой уборке); плиты покрытия вдоль ендов, у воронок внутреннего водостока, наружного остекления и торцов фонарей; конструкции в помещениях с повышенной влажностью и возможными протечками; опорные узлы ферм у водоприёмных воронок; верхние пояса ферм у аэрационных фонарей и ветробойных щитов; верхние пояса подстропильных ферм вдоль ендов; опорные узлы ферм внутри кирпичных стен. 7.6 Прогибы (5.3.1.20) Методы геометрического и гидростатического нивелирования; допускается тригонометрическое нивелирование электронными тахеометрами. 7.7 Сборные панельные здания (5.3.1.25) При обследовании — обязательное выполнение (см. текст стандарта: проверка стыков, сварки, закладных; конкретика в 5.3.1.25). 8. КАМЕННЫЕ КОНСТРУКЦИИ (5.3.2) Устанавливают материал, наличие и характер дефектов: отклонения от вертикали, неравномерные осадки, выпучивания, выпоры, искривления, расслоения, трещины, участки деструкции, отслоение облицовки/штукатурки, выпадение кирпичей, капиллярный подсос (5.3.2.1). Для конструкции стен и характеристик материалов — выборочное контрольное зондирование , отбор проб из разных слоёв для влажности и объёмной массы; стены очищают от облицовки и штукатурки на площади, достаточной для установления типа кладки (5.3.2.1). Для поверочных расчётов устанавливают наличие связевых сеток, анкеровки стен, глубины опирания плит, балок, перемычек (5.3.2.1). Прочность кладки — лабораторные испытания образцов; для полнотелого силикатного кирпича и раствора допускается неразрушающий контроль по предварительно построенной градуировочной зависимости (ГОСТ 22690); места с пластинчатой деструкцией непригодны (5.3.2.2). При комплексном обследовании, если прочность стен решающая, — лабораторные испытания по ГОСТ 8462 (в РФ ГОСТ Р 58527 2019), ГОСТ 5802, ГОСТ 24992; керны бетона по ГОСТ 28570; бут — по ГОСТ 4001 (5.3.2.3). Расчётные сопротивления кладки — по нормам (в РФ СП 15.13330.2020) в зависимости от вида и прочности изделия и раствора (5.3.2.4). Пустоты, металлические конструкции и арматура в кладке — магнитные и геофизические методы или вскрытие (5.3.2.5). 9. СТАЛЬНЫЕ, СТАЛЕЖЕЛЕЗОБЕТОННЫЕ, АЛЮМИНИЕВЫЕ (5.3.3) 9.1 Факторы оценки (5.3.3.1) Фактические размеры сечений, габариты элементов и узлов (с учётом коррозии); отклонения от проекта; дефекты и механические повреждения; состояние сварных, заклёпочных, болтовых соединений; прогибы и деформации; наличие и качество защитных (в т. ч. огнезащитных) покрытий; фактические физико механические характеристики стали и химсостав; фактическое пространственное положение; отсутствие элемента; отклонения от проектного положения (смещение опорных узлов ферм, взаимное смещение поясов ферм и прогонов). 9.2 Дефекты Дефектами считаются отклонения выше предельных, установленных НД и ГОСТ 23118 (5.3.3.3); критерии — приложение Г. 9.3 Идентификация стали (5.3.3.4—5.3.3.11) вид и объём исследований — по полноте исполнительной документации, определяет исполнитель в программе/ТЗ; пробы — на участках, не влияющих на механическую безопасность, иначе разгрузка или страховочные опоры; химсостав — фотоэлектрический или атомно эмиссионный спектральный анализ (ГОСТ 18895 / в РФ ГОСТ Р 54153 2010); механические свойства — ГОСТ 1497 (растяжение), ГОСТ 9454 (ударная вязкость), ГОСТ 28870 (толщина проката); срезные болты — ГОСТ ISO 898 1, гайки — ГОСТ ISO 898 2, шайбы — ГОСТ 11371; болтокомплекты с контролируемым натяжением — ГОСТ 32484.1—32484.6; запрет: определять предел текучести и предел прочности по косвенным характеристикам (например, по твёрдости) — не допускается (5.3.3.10); запрет: применять портативные рентгенофлуоресцентные анализаторы там, где они не дают требуемой точности по углероду, сере, фосфору и др. нормируемым элементам (5.3.3.11). 9.4 Коррозия — измерения (5.3.3.12—5.3.3.13) назначают редуцированные сечения с учётом фактических коррозионных повреждений; толщину измеряют не менее чем в трёх наиболее повреждённых сечениях по длине элемента, в каждом сечении — не менее трёх измерений . 9.5 Болтовые соединения (5.3.3.14—5.3.3.15) Проверяют: соответствие метизов стандартам, класс прочности болтов и гаек, наличие и комплектность шайб, натяжение и меры против самоотвинчивания, ширину раскрытия зазоров, качество герметизации, срыв контактной поверхности, трещины. Не допускается контролировать натяжение болтов, покрытых коррозией или защитными покрытиями, а также подготовленных к монтажу и установленных более 10 сут назад. 9.6 Ведомость элементов (5.3.3.16) По результатам — ведомость основных элементов с размерами сечений и сталями для расчётов. 10. ДЕРЕВЯННЫЕ КОНСТРУКЦИИ (5.3.4) 10.1 Что проверяют (5.3.4.1) Фактическую конструктивную схему; участки с видимыми дефектами, потерей устойчивости, прогибами, раскрытием трещин, биопоражениями, огневыми поражениями; участки с недопустимыми атмосферными, конденсационными и техническими увлажнениями; схему и параметры внешних воздействий и фактические нагрузки; расчётные схемы, пролёты, сечения, условия опирания и закрепления; состояние узлов сопряжения; прочностные и физико механические характеристики; температурно влажностный режим; наличие и состояние защитной (в т. ч. огнезащитной) обработки; места, недоступные для обработки; отсутствие элементов; отсутствие креплений стропил, ендов, стоек к стенам (скрутки, анкеры) против отрыва ветром; наличие ветровых связей, укосин и элементов пространственной жёсткости. 10.2 Влажность и прочность (5.3.4.2—5.3.4.5) Влажность — ГОСТ 16483.7 и ГОСТ 16588; температура и влажность в вентилируемых полостях, на чердаках и в подвалах — термометры и психрометры; воздухообмен — анемометры; плотность — ГОСТ 16483.1. Биостойкость — ГОСТ 18610, защищённость — ГОСТ 20022.0. Прочность: сжатие вдоль волокон — ГОСТ 16483.10, поперёк — 16483.11, статический изгиб — 16483.3, модуль упругости — 16483.9, смятие — 16483.2, скалывание вдоль — 16483.5, поперёк — 16483.12. Важно: расчётные сопротивления древесины, не поражённой гнилью, принимают как для новой древесины (нет данных об изменении прочности во времени); при поверхностном разрушении гнилью размеры сечения уменьшают (5.3.4.5). 10.3 Клееные деревянные конструкции (КДК) (5.3.4.13—5.3.4.19) Характерные дефекты — трещины по древесине и расслоения по клеевым швам; фиксируют глубину, протяжённость, место; при первом обследовании в опорных сечениях — визуальный поиск сдвигов; жёсткие стыки большепролётных КДК — сплошному контролю; послойное измерение влажности. 11. ФАСАДНЫЕ КОНСТРУКЦИИ (5.3.5) 11.1 Оценка (5.3.5.1) По механической безопасности, пожарной безопасности, долговечности, энергоэффективности. 11.2 Визуальный контроль (5.3.5.4) Плоскостность «поля» облицовки; трещины в штукатурном слое, лицевом слое кирпича и штучных элементов; расположение, сколы, смещения, нарушение линий швов; поверхностные повреждения облицовки и креплений (каверны, раковины, пустоты, растрескивания, следы намокания и протечек, высолы, коррозия); целостность откосов, фартуков, отливов и защита подоблицовочного пространства; подвижные элементы и общая зыбкость конструкции. Результат — ведомость дефектов с нанесением на чертежи фасадов. 11.3 Вскрытия и пробы (5.3.5.6—5.3.5.7) В подоблицовочном пространстве проверяют: состав и целостность узлов крепления подконструкций и облицовки; анкерные крепления; следы коррозии; заклёпочные и болтовые соединения; перекрытие деформационных швов облицовкой; состояние теплоизоляции; вид и состояние облицовываемой конструкции. Места отбора проб: по полю стены; на углах и в зонах изменения конфигурации; в уровне цоколя; в зоне сопряжения с отмосткой/тротуаром/газоном; по длине откосов проёмов; в зоне перемычек; на парапетах; по длине архитектурно декоративных элементов и в зонах сопряжения разных материалов и секций; в зонах крепления навесного оборудования и пожарных лестниц. 11.4 Анкеры (5.3.5.10) Несущая способность — по натурным испытаниям (в РФ ГОСТ Р 56731 2023, ГОСТ Р 58387 2019, ГОСТ Р 58430 2019). 12. ЭЛЕМЕНТЫ ЗДАНИЙ (5.3.6) — балконы, лестницы, кровли 12.1 Балконы, эркеры, лоджии (5.3.6.1—5.3.6.2) Устанавливают: расчётную схему и материал несущих конструкций; основные размеры (длина, ширина, толщина плит, длина и сечения балок, подвесок, подкосов, бортовых балок, расстояния между несущими балками); состояние несущих конструкций (трещины на плитах, прогибы, коррозия стальных балок и арматуры, сохранность покрытий и стяжек, уклоны плит); состояние опорных балок и подкосов, стен под опорными частями эркеров и лоджий, трещины в местах примыкания эркеров, состояние гидроизоляции; состояние стоек, консолей, подкосов, кронштейнов, подвесок. Вскрытия — для установления сечений несущих элементов и оценки состояния заделки их в стену; места вскрытий — по расчётной схеме работы балконов. 12.2 Лестницы (5.3.6.3—5.3.6.4) Конструкция и материалы; состояние участков после реконструкции, сопряжений, мест заделки несущих конструкций в стены, креплений решёток; деформации несущих конструкций; трещины и повреждения площадок, балок, маршей, ступеней; коррозионный износ ступеней; участки отрыва элементов в стальных лестницах и деформации узлов крепления к зданию. Осмотру сверху и снизу подвергают все лестничные марши и площадки в здании. Вскрытия: места заделки площадок в стены, опор маршей; для каменных лестниц по металлическим косоурам — места заделки балок площадок; для бескосоурных консольных каменных — глубина заделки ступеней в кладку и отсутствие трещин и зазоров; для деревянных — вскрытие мест заделки балок и зондирование древесины. 12.3 Кровли, стропила, фермы (5.3.6.5—5.3.6.11) Устанавливают тип несущих систем (настилы, обрешётки, прогоны); тип кровли и соответствие уклонов материалу (в РФ СП 17.13330.2017), состояние кровли и водостоков, наличие вентиляционных каналов, аэраторов, продухов и их соотношение с площадью крыши; основные деформации системы (прогибы, удлинение пролёта балочных покрытий, углы наклона сечений и узлов ферм), смещения податливых соединений (взаимные сдвиги, обмятие во врубках), вторичные деформации (трещины скалывания, складки сжатия); места протечек; состояние древесины (биоповреждения), наличие гидроизоляции между деревянными и каменными конструкциями; состояние раствора в кладке неоштукатуренных карнизов, трещины в оштукатуренных карнизах; состояние узлов опирания; ведомость дефектов; вскрытия кровли при необходимости. Конденсат и наледи на свесах и водостоках — обследование чердака, причины: разрушение стенок венткоробов и шахт; разрушение или отсутствие теплоизоляции трубопроводов; недостаточная толщина теплоизоляции чердачного перекрытия (определяют расчётом); нарушение пароизоляции; выпуск вытяжных каналов канализации в чердак; отсутствие герметичности притворов чердачных дверей и люков. Чердачные перекрытия: проверяют толщину слоя, влажность и объёмную массу утеплителя (засыпки), наличие пароизоляции; для ж. б. панелей и настилов — размеры трещин и прогибы; для металлических кровель — степень коррозии, ослабления сечений, прогибы. Светопрозрачные конструкции — по ГОСТ 34379. "}, {"id": "norms", "file": "01_Нормативная_база/НОРМАТИВЫ.md", "title": "НОРМАТИВНАЯ БАЗА", "section": "01_Нормативная_база", "html": "<h1>НОРМАТИВНАЯ БАЗА</h1><blockquote><p>Три документа, на которых держится библиотека. Каждый отвечает на свой вопрос: ГОСТ 31937 — «в каком состоянии конструкция», СП 547 — «нужен ли капитальный ремонт», СП 368 — «как его запроектировать».</p></blockquote><h2 id=\"s1\">1. ДОКУМЕНТЫ</h2><div class=\"tablewrap\"><table><thead><tr><th>Документ</th><th>Наименование</th><th>Отвечает на вопрос</th><th>Введён</th></tr></thead><tbody><tr><td><a href=\"#/doc/gost\">ГОСТ 31937-2024</a></td><td>Здания и сооружения. Правила обследования и мониторинга технического состояния</td><td>какое состояние у конструкции и что с ней делать</td><td>действует</td></tr><tr><td><a href=\"#/doc/gost-elements\">ГОСТ 31937-2024: конструкции</a></td><td>Разделы 5.2—5.3.6: требования по элементам</td><td>что именно устанавливать по фундаментам, стенам, перекрытиям, фасадам</td><td>—</td></tr><tr><td><a href=\"#/doc/sp547\">СП 547.1325800.2025</a></td><td>Здания жилые многоквартирные. Правила установления необходимости проведения капитального ремонта</td><td>нужен ли капитальный ремонт и в какой срок</td><td>23.10.2025</td></tr><tr><td><a href=\"#/doc/sp368\">СП 368.1325800.2017</a></td><td>Здания жилые. Правила проектирования капитального ремонта (с Изм. № 1)</td><td>как запроектировать ремонт и что включить в проект</td><td>26.05.2018</td></tr></tbody></table></div><h2 id=\"s2\">2. КАК ЧИТАТЬ</h2><ol><li><strong>Сначала состояние.</strong> Обследование и категории — по ГОСТ 31937. Без категории</li></ol><p>нельзя ни проектировать ремонт, ни обосновывать решения.</p><ol><li><strong>Потом необходимость ремонта.</strong> СП 547 переводит физический износ в категорию</li></ol><p>необходимости капремонта (1—4) и назначает срок.</p><ol><li><strong>Затем проект.</strong> СП 368 определяет состав работ, технические решения и</li></ol><p>комплект документации.</p><p>Если объект не жилой многоквартирный дом, СП 547 и СП 368 не применяются — остаётся ГОСТ 31937 и профильные СП по конструкциям.</p><h2 id=\"s3\">3. ЧТО ГДЕ ИСКАТЬ</h2><div class=\"tablewrap\"><table><thead><tr><th>Вопрос</th><th>Документ</th><th>Раздел библиотеки</th></tr></thead><tbody><tr><td>Как провести обследование и оформить результат</td><td>ГОСТ 31937-2024</td><td><a href=\"#/doc/methods\">Методики</a>, <a href=\"#/doc/templates\">Шаблоны</a></td></tr><tr><td>Какая категория состояния у конструкции</td><td>ГОСТ 31937-2024, п. 5.1.6—5.1.7</td><td><a href=\"#/doc/criteria\">Критерии</a></td></tr><tr><td>Что проверять по конкретному элементу</td><td>ГОСТ 31937-2024: конструкции</td><td><a href=\"#/doc/construct\">Конструктив</a></td></tr><tr><td>Какой дефект и как его описать</td><td>ГОСТ 31937-2024, приложения В—Д</td><td><a href=\"#/doc/defects\">Каталог дефектов</a></td></tr><tr><td>Нужен ли капитальный ремонт</td><td>СП 547.1325800.2025</td><td><a href=\"#/doc/criteria\">Критерии</a></td></tr><tr><td>Что войдёт в проект капремонта</td><td>СП 368.1325800.2017</td><td><a href=\"#/doc/templates\">Шаблоны</a></td></tr></tbody></table></div><h2 id=\"s4\">4. СМЕЖНЫЕ НОРМЫ</h2><p>Применяются по ссылкам документов и по виду конструкций:</p><ul><li><strong>384-ФЗ</strong> «Технический регламент о безопасности зданий и сооружений».</li><li><strong>СП 15.13330</strong> — каменные и армокаменные конструкции.</li><li><strong>СП 16.13330</strong> — стальные конструкции.</li><li><strong>СП 63.13330</strong> — бетонные и железобетонные конструкции.</li><li><strong>СП 64.13330</strong> — деревянные конструкции.</li><li><strong>СП 20.13330</strong> — нагрузки и воздействия.</li><li><strong>СП 22.13330</strong> — основания и фундаменты.</li><li><strong>СП 454.1325800</strong> — обследование зданий и сооружений (альтернатива ГОСТ 31937</li></ul><p>по выбору заказчика).</p><h2 id=\"s5\">5. СТАТУС</h2><p>Библиотека фиксирует требования на дату подготовки карточек. Перед применением в заключении проверяют действующую редакцию документа и наличие изменений.</p>", "toc": [["s1", "1. ДОКУМЕНТЫ", 2], ["s2", "2. КАК ЧИТАТЬ", 2], ["s3", "3. ЧТО ГДЕ ИСКАТЬ", 2], ["s4", "4. СМЕЖНЫЕ НОРМЫ", 2], ["s5", "5. СТАТУС", 2]], "chars": 2983, "plain": " НОРМАТИВНАЯ БАЗА Три документа, на которых держится библиотека. Каждый отвечает на свой вопрос: ГОСТ 31937 — «в каком состоянии конструкция», СП 547 — «нужен ли капитальный ремонт», СП 368 — «как его запроектировать». 1. ДОКУМЕНТЫ Документ Наименование Отвечает на вопрос Введён [ГОСТ 31937 2024]( /doc/gost) Здания и сооружения. Правила обследования и мониторинга технического состояния какое состояние у конструкции и что с ней делать действует [ГОСТ 31937 2024: конструкции]( /doc/gost elements) Разделы 5.2—5.3.6: требования по элементам что именно устанавливать по фундаментам, стенам, перекрытиям, фасадам — [СП 547.1325800.2025]( /doc/sp547) Здания жилые многоквартирные. Правила установления необходимости проведения капитального ремонта нужен ли капитальный ремонт и в какой срок 23.10.2025 [СП 368.1325800.2017]( /doc/sp368) Здания жилые. Правила проектирования капитального ремонта (с Изм. № 1) как запроектировать ремонт и что включить в проект 26.05.2018 2. КАК ЧИТАТЬ 1. Сначала состояние. Обследование и категории — по ГОСТ 31937. Без категории нельзя ни проектировать ремонт, ни обосновывать решения. 2. Потом необходимость ремонта. СП 547 переводит физический износ в категорию необходимости капремонта (1—4) и назначает срок. 3. Затем проект. СП 368 определяет состав работ, технические решения и комплект документации. Если объект не жилой многоквартирный дом, СП 547 и СП 368 не применяются — остаётся ГОСТ 31937 и профильные СП по конструкциям. 3. ЧТО ГДЕ ИСКАТЬ Вопрос Документ Раздел библиотеки Как провести обследование и оформить результат ГОСТ 31937 2024 [Методики]( /doc/methods), [Шаблоны]( /doc/templates) Какая категория состояния у конструкции ГОСТ 31937 2024, п. 5.1.6—5.1.7 [Критерии]( /doc/criteria) Что проверять по конкретному элементу ГОСТ 31937 2024: конструкции [Конструктив]( /doc/construct) Какой дефект и как его описать ГОСТ 31937 2024, приложения В—Д [Каталог дефектов]( /doc/defects) Нужен ли капитальный ремонт СП 547.1325800.2025 [Критерии]( /doc/criteria) Что войдёт в проект капремонта СП 368.1325800.2017 [Шаблоны]( /doc/templates) 4. СМЕЖНЫЕ НОРМЫ Применяются по ссылкам документов и по виду конструкций: 384 ФЗ «Технический регламент о безопасности зданий и сооружений». СП 15.13330 — каменные и армокаменные конструкции. СП 16.13330 — стальные конструкции. СП 63.13330 — бетонные и железобетонные конструкции. СП 64.13330 — деревянные конструкции. СП 20.13330 — нагрузки и воздействия. СП 22.13330 — основания и фундаменты. СП 454.1325800 — обследование зданий и сооружений (альтернатива ГОСТ 31937 по выбору заказчика). 5. СТАТУС Библиотека фиксирует требования на дату подготовки карточек. Перед применением в заключении проверяют действующую редакцию документа и наличие изменений. "}, {"id": "sp368", "file": "01_Нормативная_база/СП_368.1325800.2017.md", "title": "СП 368.1325800.2017. ПРОЕКТИРОВАНИЕ КАПИТАЛЬНОГО РЕМОНТА", "section": "01_Нормативная_база", "html": "<h1>СП 368.1325800.2017. ПРОЕКТИРОВАНИЕ КАПИТАЛЬНОГО РЕМОНТА</h1><blockquote><p>Свод правил «Здания жилые. Правила проектирования капитального ремонта» (с Изменением № 1)<sup class=\"fnref\"><a href=\"#fn-1\" id=\"fnref-1\">1</a></sup>. Дата введения — 26.05.2018. 39 с.</p></blockquote><h2 id=\"s1\">1. ЗАЧЕМ НУЖЕН</h2><p>СП 368 — про <strong>проектирование капитального ремонта</strong>: какие элементы ремонтируют, по каким критериям включают работы в перечень, какие технические решения и какой комплект документации нужен.</p><p>Пара к СП 547: СП 547 решает, <strong>нужен ли</strong> ремонт, СП 368 — <strong>как его запроектировать</strong>.</p><h2 id=\"s2\">2. ОБЛАСТЬ РАБОТ (п. 4.1)</h2><p>Капитальный ремонт распространяется на общее имущество:</p><ul><li>системы электро-, тепло-, газо-, водоснабжения и водоотведения;</li><li>лифты, лифтовые шахты, машинные и блочные помещения;</li><li>крыши;</li><li>подвальные помещения;</li><li>фасады;</li><li>фундаменты.</li></ul><h2 id=\"s3\">3. КОГДА РАБОТЫ ВКЛЮЧАЮТ В ПЕРЕЧЕНЬ (п. 4.3—4.6)</h2><p>Необходимость капремонта определяют на основании: 1) оценки физического износа здания и его элементов (п. 4.5); 2) результатов обследования технического состояния по <strong>ГОСТ 31937</strong> или <strong>СП 454.1325800</strong><sup class=\"fnref\"><a href=\"#fn-2\" id=\"fnref-2\">2</a></sup> (п. 4.4, 4.6).</p><p>В перечень работ включают восстановление или замену:</p><ul><li>элементов, у которых <strong>более 30 % объёма имеет износ 45 % и более</strong>;</li><li>отдельных несущих конструкций, для которых установлена опасность нарушения</li></ul><p>предельно допустимых характеристик надёжности и безопасности, то есть <strong>ограниченно-работоспособное или аварийное</strong> состояние.</p><p>Если проектной документации нет — сроки службы принимают по таблице А.2 приложения А (п. 4.3).</p><p>Виды капремонта (п. 4.7): <strong>комплексный</strong> (здание или секция целиком) и <strong>выборочный</strong> (отдельные элементы). Выбор — заданием на проектирование с учётом таблицы А.3.</p><h2 id=\"s4\">4. ТЕХНИЧЕСКИЕ РЕШЕНИЯ (раздел 5)</h2><ul><li>Решения выбирают по виду ремонта и фактическому состоянию, с учётом доступа</li></ul><p>к конструкциям (п. 5.1—5.2).</p><ul><li>Перечень работ — по приложению Б, корректируется под архитектуру, конструктив,</li></ul><p>инженерное обустройство и износ (п. 5.3).</p><ul><li>Применяются современные материалы и технологии независимо от года постройки</li></ul><p>(п. 5.4); работы — по технологическим картам и ППР (п. 5.5).</p><ul><li>Примеры техпроцессов — приложение В; перечень дефектов к устранению —</li></ul><p>приложение Г (п. 5.6).</p><ul><li>Проектирование ведут по профильным СП:<ul><li>бетон и железобетон — СП 63.13330, усиление — СП 349.1325800 (п. 5.7);</li><li>камень и армокамень — СП 15.13330, усиление — СП 427.1325800,</li></ul></li></ul><p>лицевой кирпичный слой — СП 327.1325800 (п. 5.8);</p><ul><li>стальные конструкции — СП 16.13330 и соответствующие СП по усилению (п. 5.9).</li></ul><h2 id=\"s5\">5. ДОКУМЕНТАЦИЯ (раздел 6)</h2><p>Проектную документацию готовят с учётом СП 48.13330 по заданию заказчика. В составе — разделы: изменения проектных решений (утепление, замена систем), восстановление несущих конструкций, восстановление или замена элементов без изменения решений, доступная среда, общедомовые приборы учёта, слаботочные системы, АСУПР; смета (раздел 6).</p><p>Требования к комплекту чертежей: фундаменты (6.1), фасады (6.2), крыши (6.3); пояснительная записка по инженерному оборудованию — раздел 7 (водоснабжение, канализация, лифты, мусороудаление).</p><h2 id=\"s6\">6. ТОЧКИ СОПРИКОСНОВЕНИЯ</h2><div class=\"tablewrap\"><table><thead><tr><th>СП 368.1325800.2017</th><th>СП 547.1325800.2025</th><th>ГОСТ 31937-2024</th><th>Раздел библиотеки</th></tr></thead><tbody><tr><td>п. 4.4 — обследование по ГОСТ 31937 или СП 454</td><td>п. 4.6 — оценка по ГОСТ</td><td>п. 5.1 — этапы обследования</td><td><a href=\"#/doc/gost\">ГОСТ</a></td></tr><tr><td>п. 4.4 — ограниченно-работоспособное/аварийное</td><td>п. 6.1 — 3—4-я категория</td><td>п. 5.1.6—5.1.7 — категории</td><td><a href=\"#/doc/criteria\">Критерии</a></td></tr><tr><td>п. 4.4 — 30 % объёма с износом ≥ 45 %</td><td>п. 6.1 — износ 31—50 %, 51—65 %</td><td>—</td><td><a href=\"#/doc/criteria\">Критерии</a></td></tr><tr><td>приложение Г — дефекты к устранению</td><td>приложение А — признаки износа</td><td>приложения В—Д — дефекты</td><td><a href=\"#/doc/defects\">Каталог дефектов</a></td></tr><tr><td>п. 5.7—5.9 — усиление конструкций</td><td>—</td><td>п. 5.2—5.7 — обследование элементов</td><td><a href=\"#/doc/construct\">Конструктив</a></td></tr><tr><td>раздел 6 — комплект чертежей</td><td>приложение Б — форма заключения</td><td>приложение А/Б — формы</td><td><a href=\"#/doc/templates\">Шаблоны</a></td></tr></tbody></table></div><p>Ключевая связка: <strong>СП 547 → заключение о необходимости → СП 368 → проект</strong>. Если в заключении по СП 547 категория 3 или 4, дальше включается СП 368 и обследование по ГОСТ 31937.</p><h2 id=\"s7\">7. ЧЕК-ЛИСТ ПО СП 368</h2><ol><li>Определён вид капремонта: комплексный или выборочный? (п. 4.7)</li><li>Есть оценка износа и обследование по ГОСТ 31937/СП 454? (п. 4.4)</li><li>В перечень включены элементы с износом ≥ 45 % на площади &gt; 30 %? (п. 4.4)</li><li>Учтены ограниченно-работоспособные и аварийные конструкции? (п. 4.4)</li><li>Технические решения привязаны к СП 63/15/16 и СП по усилению? (п. 5.7—5.9)</li><li>Есть технологические карты и ППР? (п. 5.5)</li><li>Комплект чертежей: фундаменты, фасад, крыша? (6.1—6.3)</li><li>Есть смета и разделы по инженерным системам? (раздел 6—7)</li></ol>", "toc": [["s1", "1. ЗАЧЕМ НУЖЕН", 2], ["s2", "2. ОБЛАСТЬ РАБОТ (п. 4.1)", 2], ["s3", "3. КОГДА РАБОТЫ ВКЛЮЧАЮТ В ПЕРЕЧЕНЬ (п. 4.3—4.6)", 2], ["s4", "4. ТЕХНИЧЕСКИЕ РЕШЕНИЯ (раздел 5)", 2], ["s5", "5. ДОКУМЕНТАЦИЯ (раздел 6)", 2], ["s6", "6. ТОЧКИ СОПРИКОСНОВЕНИЯ", 2], ["s7", "7. ЧЕК-ЛИСТ ПО СП 368", 2]], "chars": 4634, "plain": " СП 368.1325800.2017. ПРОЕКТИРОВАНИЕ КАПИТАЛЬНОГО РЕМОНТА Свод правил «Здания жилые. Правила проектирования капитального ремонта» (с Изменением № 1)[^1]. Дата введения — 26.05.2018. 39 с. 1. ЗАЧЕМ НУЖЕН СП 368 — про проектирование капитального ремонта : какие элементы ремонтируют, по каким критериям включают работы в перечень, какие технические решения и какой комплект документации нужен. Пара к СП 547: СП 547 решает, нужен ли ремонт, СП 368 — как его запроектировать . 2. ОБЛАСТЬ РАБОТ (п. 4.1) Капитальный ремонт распространяется на общее имущество: системы электро , тепло , газо , водоснабжения и водоотведения; лифты, лифтовые шахты, машинные и блочные помещения; крыши; подвальные помещения; фасады; фундаменты. 3. КОГДА РАБОТЫ ВКЛЮЧАЮТ В ПЕРЕЧЕНЬ (п. 4.3—4.6) Необходимость капремонта определяют на основании: 1) оценки физического износа здания и его элементов (п. 4.5); 2) результатов обследования технического состояния по ГОСТ 31937 или СП 454.1325800 [^2] (п. 4.4, 4.6). В перечень работ включают восстановление или замену: элементов, у которых более 30 % объёма имеет износ 45 % и более ; отдельных несущих конструкций, для которых установлена опасность нарушения предельно допустимых характеристик надёжности и безопасности, то есть ограниченно работоспособное или аварийное состояние. Если проектной документации нет — сроки службы принимают по таблице А.2 приложения А (п. 4.3). Виды капремонта (п. 4.7): комплексный (здание или секция целиком) и выборочный (отдельные элементы). Выбор — заданием на проектирование с учётом таблицы А.3. 4. ТЕХНИЧЕСКИЕ РЕШЕНИЯ (раздел 5) Решения выбирают по виду ремонта и фактическому состоянию, с учётом доступа к конструкциям (п. 5.1—5.2). Перечень работ — по приложению Б, корректируется под архитектуру, конструктив, инженерное обустройство и износ (п. 5.3). Применяются современные материалы и технологии независимо от года постройки (п. 5.4); работы — по технологическим картам и ППР (п. 5.5). Примеры техпроцессов — приложение В; перечень дефектов к устранению — приложение Г (п. 5.6). Проектирование ведут по профильным СП: бетон и железобетон — СП 63.13330, усиление — СП 349.1325800 (п. 5.7); камень и армокамень — СП 15.13330, усиление — СП 427.1325800, лицевой кирпичный слой — СП 327.1325800 (п. 5.8); стальные конструкции — СП 16.13330 и соответствующие СП по усилению (п. 5.9). 5. ДОКУМЕНТАЦИЯ (раздел 6) Проектную документацию готовят с учётом СП 48.13330 по заданию заказчика. В составе — разделы: изменения проектных решений (утепление, замена систем), восстановление несущих конструкций, восстановление или замена элементов без изменения решений, доступная среда, общедомовые приборы учёта, слаботочные системы, АСУПР; смета (раздел 6). Требования к комплекту чертежей: фундаменты (6.1), фасады (6.2), крыши (6.3); пояснительная записка по инженерному оборудованию — раздел 7 (водоснабжение, канализация, лифты, мусороудаление). 6. ТОЧКИ СОПРИКОСНОВЕНИЯ СП 368.1325800.2017 СП 547.1325800.2025 ГОСТ 31937 2024 Раздел библиотеки п. 4.4 — обследование по ГОСТ 31937 или СП 454 п. 4.6 — оценка по ГОСТ п. 5.1 — этапы обследования [ГОСТ]( /doc/gost) п. 4.4 — ограниченно работоспособное/аварийное п. 6.1 — 3—4 я категория п. 5.1.6—5.1.7 — категории [Критерии]( /doc/criteria) п. 4.4 — 30 % объёма с износом ≥ 45 % п. 6.1 — износ 31—50 %, 51—65 % — [Критерии]( /doc/criteria) приложение Г — дефекты к устранению приложение А — признаки износа приложения В—Д — дефекты [Каталог дефектов]( /doc/defects) п. 5.7—5.9 — усиление конструкций — п. 5.2—5.7 — обследование элементов [Конструктив]( /doc/construct) раздел 6 — комплект чертежей приложение Б — форма заключения приложение А/Б — формы [Шаблоны]( /doc/templates) Ключевая связка: СП 547 → заключение о необходимости → СП 368 → проект . Если в заключении по СП 547 категория 3 или 4, дальше включается СП 368 и обследование по ГОСТ 31937. 7. ЧЕК ЛИСТ ПО СП 368 1. Определён вид капремонта: комплексный или выборочный? (п. 4.7) 2. Есть оценка износа и обследование по ГОСТ 31937/СП 454? (п. 4.4) 3. В перечень включены элементы с износом ≥ 45 % на площади 30 %? (п. 4.4) 4. Учтены ограниченно работоспособные и аварийные конструкции? (п. 4.4) 5. Технические решения привязаны к СП 63/15/16 и СП по усилению? (п. 5.7—5.9) 6. Есть технологические карты и ППР? (п. 5.5) 7. Комплект чертежей: фундаменты, фасад, крыша? (6.1—6.3) 8. Есть смета и разделы по инженерным системам? (раздел 6—7) "}, {"id": "sp547", "file": "01_Нормативная_база/СП_547.1325800.2025.md", "title": "СП 547.1325800.2025. НЕОБХОДИМОСТЬ КАПИТАЛЬНОГО РЕМОНТА МКД", "section": "01_Нормативная_база", "html": "<h1>СП 547.1325800.2025. НЕОБХОДИМОСТЬ КАПИТАЛЬНОГО РЕМОНТА МКД</h1><blockquote><p>Свод правил «Здания жилые многоквартирные. Правила установления необходимости проведения капитального ремонта». Утверждён Минстроем России, введён впервые, дата введения — 23.10.2025<sup class=\"fnref\"><a href=\"#fn-1\" id=\"fnref-1\">1</a></sup>. 101 с.</p></blockquote><h2 id=\"s1\">1. ЗАЧЕМ НУЖЕН</h2><p>СП устанавливает, <strong>нужен ли капитальный ремонт общего имущества многоквартирного дома</strong>, по результатам обследования технического состояния — для формирования и изменения региональных программ капремонта (п. 1.1).</p><p>Не распространяется на (п. 1.2):</p><ul><li>ремонт, замену и модернизацию лифтов, лифтовых шахт, машинных и блочных помещений;</li><li>ремонт внутридомовых систем газоснабжения.</li></ul><p>Важно: это <strong>не обследование по ГОСТ 31937 и не оценка категории технического состояния</strong>. Здесь другая шкала — физический износ в процентах и четыре категории необходимости капремонта.</p><h2 id=\"s2\">2. КАК УСТРОЕН</h2><div class=\"tablewrap\"><table><thead><tr><th>Раздел</th><th>Содержание</th></tr></thead><tbody><tr><td>4</td><td>Общие положения: кто проводит, что обследуют, когда работы не выполняются</td></tr><tr><td>5</td><td>Порядок визуального обследования: подготовка, схемы, подвал, чердак, инженерные системы, фотофиксация</td></tr><tr><td>6</td><td>Определение необходимости капремонта: категории, формулы, сроки, заключение</td></tr><tr><td>Приложение А</td><td>Таблицы А.1—А.56 признаков физического износа по элементам</td></tr><tr><td>Приложение Б</td><td>Форма заключения о необходимости капремонта</td></tr></tbody></table></div><h2 id=\"s3\">3. КАТЕГОРИИ И СРОКИ (п. 6.1, 6.11)</h2><div class=\"tablewrap\"><table><thead><tr><th>Категория</th><th>Физический износ элемента</th><th>Решение</th><th>Срок капремонта</th></tr></thead><tbody><tr><td>1-я</td><td>0—30 %</td><td>не требуется</td><td>оценку можно повторить не ранее чем через 5 лет</td></tr><tr><td>2-я</td><td>31—50 %</td><td>требуется</td><td>в течение 5 лет с даты заключения</td></tr><tr><td>3-я</td><td>51—65 %</td><td>требуется в приоритетном порядке</td><td>в течение 3 лет</td></tr><tr><td>4-я</td><td>более 65 %<sup class=\"fnref\"><a href=\"#fn-2\" id=\"fnref-2\">2</a></sup></td><td>нужно инструментальное обследование по ГОСТ 31937</td><td>по итогам обследования</td></tr></tbody></table></div><p>Отдельно (п. 6.4): при износе <strong>61—80 %</strong> и при критических признаках из таблицы А.30 (пункты 3, 11, 13, 16) в заключении прямо указывают необходимость инструментального обследования по ГОСТ 31937.</p><h2 id=\"s4\">4. КЛЮЧЕВЫЕ ПРАВИЛА</h2><ul><li>Обследование выполняет <strong>специализированная организация</strong> (п. 4.2); объём —</li></ul><p>по техническому заданию (п. 4.3, 5.1).</p><ul><li>Охрана труда при работах — по ГОСТ 31937 (п. 4.5).</li><li>По согласованию с заказчиком оценку можно выполнить **по результатам</li></ul><p>обследования по ГОСТ 31937** (п. 4.6) — это законный путь, если обследование уже делалось.</p><ul><li>Работы не выполняют, если дом признан аварийным и подлежащим сносу или</li></ul><p>реконструкции, либо не является многоквартирным (п. 4.7).</p><ul><li>Износ элемента с участками разной степени считается по формуле (6.1):</li></ul><p><code>Fк = Σ(Fi · Pi) / Pк</code>, значения округляют до целых (п. 6.5)<sup class=\"fnref\"><a href=\"#fn-3\" id=\"fnref-3\">3</a></sup>.</p><ul><li>Для крыши площадь элемента — сумма площадей кровли, несущей конструкции и</li></ul><p>чердачного перекрытия (п. 6.8); для фасада с балконами износ считается отдельно, затем сводится по формуле (п. 6.9).</p><ul><li>Остаточный срок службы: <code>Тостаточный = Тнормативный − Тфактический</code> (п. 6.14),</li></ul><p>где нормативный срок — по сроку экономической жизни здания.</p><ul><li>Критические признаки в приложении А отмечены знаком «*»: заключение должно</li></ul><p>содержать восстановление эксплуатационной функции и (или) меры безопасности, при необходимости — мониторинг (п. 6.2).</p><ul><li>Для автоматизации оценки допускается применение программных средств (п. 5.11).</li></ul><h2 id=\"s5\">5. ТОЧКИ СОПРИКОСНОВЕНИЯ С ГОСТ 31937-2024</h2><div class=\"tablewrap\"><table><thead><tr><th>СП 547.1325800.2025</th><th>ГОСТ 31937-2024</th><th>Раздел библиотеки</th><th>Что это значит на практике</th></tr></thead><tbody><tr><td>п. 4.6 — оценка по результатам обследования по ГОСТ</td><td>п. 5.1 — этапы обследования</td><td><a href=\"#/doc/gost\">ГОСТ</a></td><td>если есть отчёт по ГОСТ, отдельное визуальное обследование можно не делать</td></tr><tr><td>п. 6.1, 4-я категория — инструментальное обследование</td><td>п. 5.2—5.7 — обследование элементов, приборы</td><td><a href=\"#/doc/methods\">Методики</a></td><td>переход от «износа» к «категории состояния»</td></tr><tr><td>п. 6.4 — износ 61—80 % и критические признаки</td><td>п. 5.1.6—5.1.7 — оценка категорий</td><td><a href=\"#/doc/criteria\">Критерии</a></td><td>порог, после которого нужен ГОСТ, а не только таблицы износа</td></tr><tr><td>п. 5 — визуальное обследование, фотофиксация</td><td>п. 5.1.4—5.1.5 — состав работ, обмеры</td><td><a href=\"#/doc/methods\">Методики</a></td><td>состав и оформление результатов</td></tr><tr><td>приложение А — признаки износа по элементам</td><td>приложения В—Д — дефекты конструкций</td><td><a href=\"#/doc/defects\">Каталог дефектов</a></td><td>одна и та же трещина: признак износа и дефект</td></tr><tr><td>приложение Б — форма заключения</td><td>приложение А/Б — формы заключения</td><td><a href=\"#/doc/templates\">Шаблоны</a></td><td>разные формы: не подменять одну другой</td></tr></tbody></table></div><p>Смысловая граница: СП 547 отвечает на вопрос «<strong>когда ремонтировать</strong>», ГОСТ 31937 — «<strong>в каком состоянии конструкция и можно ли её эксплуатировать</strong>».</p><h2 id=\"s6\">6. ЧЕК-ЛИСТ ПО СП 547</h2><ol><li>Дом многоквартирный, не признан аварийным? (п. 4.7)</li><li>Есть ТЗ и определён объём обследования? (п. 4.3, 5.1)</li><li>Составлены схемы, выполнена фотофиксация дефектов? (п. 5.3, 5.9)</li><li>Осмотрены подвал, чердак, инженерные системы? (п. 5.6—5.8)</li><li>Износ определён по таблицам приложения А, критические признаки отмечены? (п. 6.2)</li><li>При износе &gt; 65 % (или 61—80 %, или критических признаках) назначено</li></ol><p>обследование по ГОСТ 31937? (п. 6.1, 6.4)</p><ol><li>Указана категория 1—4 и срок капремонта? (п. 6.11)</li><li>Посчитан остаточный срок службы? (п. 6.14)</li><li>Заключение оформлено по приложению Б? (п. 6.12)</li></ol>", "toc": [["s1", "1. ЗАЧЕМ НУЖЕН", 2], ["s2", "2. КАК УСТРОЕН", 2], ["s3", "3. КАТЕГОРИИ И СРОКИ (п. 6.1, 6.11)", 2], ["s4", "4. КЛЮЧЕВЫЕ ПРАВИЛА", 2], ["s5", "5. ТОЧКИ СОПРИКОСНОВЕНИЯ С ГОСТ 31937-2024", 2], ["s6", "6. ЧЕК-ЛИСТ ПО СП 547", 2]], "chars": 5163, "plain": " СП 547.1325800.2025. НЕОБХОДИМОСТЬ КАПИТАЛЬНОГО РЕМОНТА МКД Свод правил «Здания жилые многоквартирные. Правила установления необходимости проведения капитального ремонта». Утверждён Минстроем России, введён впервые, дата введения — 23.10.2025[^1]. 101 с. 1. ЗАЧЕМ НУЖЕН СП устанавливает, нужен ли капитальный ремонт общего имущества многоквартирного дома , по результатам обследования технического состояния — для формирования и изменения региональных программ капремонта (п. 1.1). Не распространяется на (п. 1.2): ремонт, замену и модернизацию лифтов, лифтовых шахт, машинных и блочных помещений; ремонт внутридомовых систем газоснабжения. Важно: это не обследование по ГОСТ 31937 и не оценка категории технического состояния . Здесь другая шкала — физический износ в процентах и четыре категории необходимости капремонта. 2. КАК УСТРОЕН Раздел Содержание 4 Общие положения: кто проводит, что обследуют, когда работы не выполняются 5 Порядок визуального обследования: подготовка, схемы, подвал, чердак, инженерные системы, фотофиксация 6 Определение необходимости капремонта: категории, формулы, сроки, заключение Приложение А Таблицы А.1—А.56 признаков физического износа по элементам Приложение Б Форма заключения о необходимости капремонта 3. КАТЕГОРИИ И СРОКИ (п. 6.1, 6.11) Категория Физический износ элемента Решение Срок капремонта 1 я 0—30 % не требуется оценку можно повторить не ранее чем через 5 лет 2 я 31—50 % требуется в течение 5 лет с даты заключения 3 я 51—65 % требуется в приоритетном порядке в течение 3 лет 4 я более 65 %[^2] нужно инструментальное обследование по ГОСТ 31937 по итогам обследования Отдельно (п. 6.4): при износе 61—80 % и при критических признаках из таблицы А.30 (пункты 3, 11, 13, 16) в заключении прямо указывают необходимость инструментального обследования по ГОСТ 31937. 4. КЛЮЧЕВЫЕ ПРАВИЛА Обследование выполняет специализированная организация (п. 4.2); объём — по техническому заданию (п. 4.3, 5.1). Охрана труда при работах — по ГОСТ 31937 (п. 4.5). По согласованию с заказчиком оценку можно выполнить по результатам обследования по ГОСТ 31937 (п. 4.6) — это законный путь, если обследование уже делалось. Работы не выполняют, если дом признан аварийным и подлежащим сносу или реконструкции, либо не является многоквартирным (п. 4.7). Износ элемента с участками разной степени считается по формуле (6.1): Fк = Σ(Fi · Pi) / Pк , значения округляют до целых (п. 6.5)[^3]. Для крыши площадь элемента — сумма площадей кровли, несущей конструкции и чердачного перекрытия (п. 6.8); для фасада с балконами износ считается отдельно, затем сводится по формуле (п. 6.9). Остаточный срок службы: Тостаточный = Тнормативный − Тфактический (п. 6.14), где нормативный срок — по сроку экономической жизни здания. Критические признаки в приложении А отмечены знаком « »: заключение должно содержать восстановление эксплуатационной функции и (или) меры безопасности, при необходимости — мониторинг (п. 6.2). Для автоматизации оценки допускается применение программных средств (п. 5.11). 5. ТОЧКИ СОПРИКОСНОВЕНИЯ С ГОСТ 31937 2024 СП 547.1325800.2025 ГОСТ 31937 2024 Раздел библиотеки Что это значит на практике п. 4.6 — оценка по результатам обследования по ГОСТ п. 5.1 — этапы обследования [ГОСТ]( /doc/gost) если есть отчёт по ГОСТ, отдельное визуальное обследование можно не делать п. 6.1, 4 я категория — инструментальное обследование п. 5.2—5.7 — обследование элементов, приборы [Методики]( /doc/methods) переход от «износа» к «категории состояния» п. 6.4 — износ 61—80 % и критические признаки п. 5.1.6—5.1.7 — оценка категорий [Критерии]( /doc/criteria) порог, после которого нужен ГОСТ, а не только таблицы износа п. 5 — визуальное обследование, фотофиксация п. 5.1.4—5.1.5 — состав работ, обмеры [Методики]( /doc/methods) состав и оформление результатов приложение А — признаки износа по элементам приложения В—Д — дефекты конструкций [Каталог дефектов]( /doc/defects) одна и та же трещина: признак износа и дефект приложение Б — форма заключения приложение А/Б — формы заключения [Шаблоны]( /doc/templates) разные формы: не подменять одну другой Смысловая граница: СП 547 отвечает на вопрос « когда ремонтировать », ГОСТ 31937 — « в каком состоянии конструкция и можно ли её эксплуатировать ». 6. ЧЕК ЛИСТ ПО СП 547 1. Дом многоквартирный, не признан аварийным? (п. 4.7) 2. Есть ТЗ и определён объём обследования? (п. 4.3, 5.1) 3. Составлены схемы, выполнена фотофиксация дефектов? (п. 5.3, 5.9) 4. Осмотрены подвал, чердак, инженерные системы? (п. 5.6—5.8) 5. Износ определён по таблицам приложения А, критические признаки отмечены? (п. 6.2) 6. При износе 65 % (или 61—80 %, или критических признаках) назначено обследование по ГОСТ 31937? (п. 6.1, 6.4) 7. Указана категория 1—4 и срок капремонта? (п. 6.11) 8. Посчитан остаточный срок службы? (п. 6.14) 9. Заключение оформлено по приложению Б? (п. 6.12) "}, {"id": "terms", "file": "02_Термины/ТЕЗАУРУС.md", "title": "ТЕЗАУРУС", "section": "02_Термины", "html": "<h1>ТЕЗАУРУС</h1><blockquote><p>Единый словарь терминов для заключений. Основа — ГОСТ 31937-2024 (раздел 3), дополнено терминами практики из архива ТЗ и последних экспертиз. Формулировки государственного стандарта приводятся как нормативные; практические — как рабочие. Связанные разделы: <code>06_Оценка_состояния</code>, <code>04_Дефекты</code>, <code>03_Конструктив</code>.</p></blockquote><hr><h2 id=\"s1\">1. НОРМАТИВНЫЕ ТЕРМИНЫ (ГОСТ 31937-2024, раздел 3)</h2><h3 id=\"s2\">Т-001. Аварийное техническое состояние</h3><ul><li><strong>Определение:</strong> категория технического состояния строительной конструкции или здания</li></ul><p>(сооружения) в целом, включая состояние грунтов основания, характеризующаяся повреждениями и деформациями, свидетельствующими об исчерпании несущей способности и опасности обрушения, и/или характеризующаяся кренами, которые могут вызвать потерю устойчивости объекта.</p><ul><li><strong>Норма:</strong> ГОСТ 31937-2024, п. 3.1.</li><li><strong>Практика:</strong> эксплуатация не допускается; противоаварийные мероприятия; обязательный мониторинг</li></ul><p>до приведения в работоспособное состояние (п. 4.5).</p><ul><li><strong>См.:</strong> О-01, Ш-ВЫВ.</li></ul><h3 id=\"s3\">Т-002. Безопасность эксплуатации здания (сооружения)</h3><ul><li><strong>Определение:</strong> комплексное свойство объекта, не позволяющее ему перейти в аварийное</li></ul><p>состояние; определяется проектным решением и степенью его реального воплощения, текущим остаточным ресурсом и техническим состоянием, степенью изменения объекта и окружающей среды, совокупностью антитеррористических мероприятий и нормативами по эксплуатации.</p><ul><li><strong>Норма:</strong> п. 3.2.</li></ul><h3 id=\"s4\">Т-003. Восстановление</h3><ul><li><strong>Определение:</strong> комплекс мероприятий, обеспечивающих доведение эксплуатационных качеств</li></ul><p>конструкций, пришедших в ограниченно-работоспособное состояние, до уровня их первоначального состояния, определяемого требованиями нормативных документов на момент проектирования восстановления объекта.</p><ul><li><strong>Норма:</strong> п. 3.3. <strong>Отличие от усиления:</strong> восстановление — до исходного уровня,</li></ul><p>усиление — выше исходного.</p><ul><li><strong>См.:</strong> Т-014 (усиление).</li></ul><h3 id=\"s5\">Т-004. Дефект (повреждение) системы инженерно-технического обеспечения</h3><ul><li><strong>Определение:</strong> отдельное несоответствие системы или её части какому-либо параметру,</li></ul><p>установленному проектом или нормами, приводящее к ухудшению технического состояния системы.</p><ul><li><strong>Норма:</strong> п. 3.4.</li></ul><h3 id=\"s6\">Т-005. Дефект (повреждение) строительной конструкции</h3><ul><li><strong>Определение:</strong> отдельное несоответствие строительной конструкции какому-либо параметру,</li></ul><p>установленному проектом или нормами, приводящее к ухудшению технического состояния конструкции или здания (сооружения).</p><ul><li><strong>Норма:</strong> п. 3.5.</li><li><strong>Практика:</strong> «дефект» и «повреждение» в стандарте используются как синонимы; в заключении</li></ul><p>допустимо писать «дефекты (повреждения)».</p><h3 id=\"s7\">Т-006. Динамические параметры зданий (сооружений)</h3><ul><li><strong>Определение:</strong> параметры, характеризующие динамические свойства: периоды и декременты</li></ul><p>собственных колебаний основного тона и обертонов, передаточные функции объектов, их частей и элементов.</p><ul><li><strong>Норма:</strong> п. 3.6.</li></ul><h3 id=\"s8\">Т-007. Заказчик</h3><ul><li><strong>Определение:</strong> собственник здания (сооружения) или иное лицо, определённое собственником</li></ul><p>ответственным за заключение договора со специализированной организацией.</p><ul><li><strong>Норма:</strong> п. 3.7.</li></ul><h3 id=\"s9\">Т-008. Категория технического состояния</h3><ul><li><strong>Определение:</strong> степень эксплуатационной пригодности и обеспечения механической безопасности</li></ul><p>строительной конструкции или здания (сооружения) в целом, а также грунтов их основания, установленная в зависимости от доли снижения несущей способности и эксплуатационных характеристик.</p><ul><li><strong>Норма:</strong> п. 3.8.</li><li><strong>См.:</strong> КРИТЕРИИ_ОЦЕНКИ.</li></ul><h3 id=\"s10\">Т-009. Комплексное обследование технического состояния</h3><ul><li><strong>Определение:</strong> специальный вид инженерных изысканий: комплекс мероприятий по определению</li></ul><p>и оценке фактических значений контролируемых параметров грунтов основания, строительных конструкций, инженерного обеспечения, характеризующих функциональную работоспособность объекта и определяющих возможность дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта; включает обследование конструкций, теплотехнических и акустических свойств, систем инженерного обеспечения, за исключением технологического оборудования.</p><ul><li><strong>Норма:</strong> п. 3.9.</li></ul><h3 id=\"s11\">Т-010. Критерий оценки технического состояния</h3><ul><li><strong>Определение:</strong> установленное проектом или нормативным документом количественное или</li></ul><p>качественное значение параметра, характеризующего переход в предельное состояние и другие нормируемые характеристики конструкции, свойств материалов, грунтов основания и систем инженерно-технического обеспечения.</p><ul><li><strong>Норма:</strong> п. 3.10.</li></ul><h3 id=\"s12\">Т-011. Механическая безопасность здания (сооружения)</h3><ul><li><strong>Определение:</strong> состояние строительных конструкций и основания, при котором отсутствует</li></ul><p>недопустимый риск, связанный с причинением вреда жизни или здоровью граждан, имуществу, окружающей среде, жизни и здоровью животных и растений вследствие разрушения или потери устойчивости здания (сооружения) или его части.</p><ul><li><strong>Норма:</strong> п. 3.11. <strong>См.:</strong> 384-ФЗ.</li></ul><h3 id=\"s13\">Т-012. Мониторинг технического состояния (виды)</h3><ul><li><strong>3.12</strong> — ограниченно-работоспособных и аварийных: наблюдение и контроль по программе</li></ul><p>за степенью и скоростью изменения параметров, экстренные меры против обрушения или опрокидывания, до приведения в работоспособное состояние.</p><ul><li><strong>3.13</strong> — зоны влияния строительства и природно-техногенных воздействий.</li><li><strong>3.14</strong> — уникальных зданий: раннее обнаружение негативных изменений НДС, крена.</li><li><strong>3.17</strong> — общий мониторинг: для объектов со значительными изменениями НДС или крена.</li><li><strong>Норма:</strong> пп. 3.12—3.14, 3.17; раздел 6.</li></ul><h3 id=\"s14\">Т-013. Нормативное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой количественные и качественные значения параметров</li></ul><p>всех критериев оценки соответствуют установленным в проектной документации значениям и действующим нормам на момент обследования.</p><ul><li><strong>Норма:</strong> п. 3.15.</li></ul><h3 id=\"s15\">Т-014. Обследование технического состояния здания (сооружения)</h3><ul><li><strong>Определение:</strong> специальный вид инженерных изысканий: комплекс мероприятий по определению</li></ul><p>и оценке фактических значений контролируемых параметров, характеризующих работоспособность объекта и определяющих возможность его дальнейшей эксплуатации, реконструкции или необходимость восстановления, усиления, ремонта, демонтажа (сноса); включает обследование грунтов основания и строительных конструкций на предмет выявления изменения свойств грунтов, деформационных повреждений, дефектов несущих и ограждающих конструкций и определения их фактической несущей способности.</p><ul><li><strong>Норма:</strong> п. 3.16.</li></ul><h3 id=\"s16\">Т-015. Ограниченно-работоспособное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой имеются крены, дефекты и повреждения, приведшие</li></ul><p>к снижению несущей способности, и/или достаточность несущей способности не подтверждается поверочными расчётами, но отсутствует опасность внезапного разрушения, потери устойчивости или опрокидывания; функционирование конструкций и эксплуатация возможны либо при контроле (мониторинге), либо при проведении мероприятий по обеспечению механической безопасности, восстановлению или усилению конструкций и/или грунтов основания и последующем мониторинге (при необходимости).</p><ul><li><strong>Норма:</strong> п. 3.18.</li><li><strong>Практическое правило:</strong> ставить эту категорию только при наличии дефектов, снизивших</li></ul><p>несущую способность, либо при неподтверждённой расчётом несущей способности. Если дефектов нет — «работоспособное».</p><h3 id=\"s17\">Т-016. Оценка технического состояния</h3><ul><li><strong>Определение:</strong> установление степени повреждения и категории технического состояния</li></ul><p>конструкций или зданий (сооружений) в целом, включая грунты основания, на основе сопоставления фактических значений количественно оцениваемых признаков со значениями этих же признаков, установленных проектом или нормативным документом.</p><ul><li><strong>Норма:</strong> п. 3.19.</li></ul><h3 id=\"s18\">Т-017. Поверочный расчёт</h3><ul><li><strong>Определение:</strong> расчёт существующей конструкции и/или грунтов основания по действующим</li></ul><p>нормам проектирования с введением в расчёт полученных при обследовании геометрических параметров, прочности материалов и грунтов, действующих нагрузок, уточнённой расчётной схемы с учётом имеющихся дефектов и повреждений.</p><ul><li><strong>Норма:</strong> п. 3.20.</li></ul><h3 id=\"s19\">Т-018. Работоспособное техническое состояние</h3><ul><li><strong>Определение:</strong> категория, при которой некоторые из оцениваемых контролируемых параметров</li></ul><p>не отвечают требованиям проекта или норм, но нарушения в конкретных условиях эксплуатации не приводят к нарушению работоспособности; необходимая несущая способность конструкций и грунтов основания с учётом влияния дефектов и механическая безопасность обеспечиваются.</p><ul><li><strong>Норма:</strong> п. 3.21.</li></ul><h3 id=\"s20\">Т-019. Система мониторинга инженерно-технического обеспечения / несущих конструкций</h3><ul><li><strong>3.22</strong> — технические и программные средства сбора и обработки информации о параметрах</li></ul><p>работы системы ИТО, контроль дестабилизирующих факторов и передача сообщений об аварийных ситуациях.</p><ul><li><strong>3.23</strong> — средства сбора и обработки информации о геодезических, динамических,</li></ul><p>деформационных и других параметрах конструкций и скорости их изменения.</p><ul><li><strong>Норма:</strong> пп. 3.22—3.23.</li></ul><h3 id=\"s21\">Т-020. Специализированная организация</h3><ul><li><strong>Определение:</strong> организация, имеющая право выполнения работ по обследованию и мониторингу</li></ul><p>зданий (сооружений) в соответствии с требованиями действующего национального законодательства.</p><ul><li><strong>Норма:</strong> п. 3.24.</li></ul><h3 id=\"s22\">Т-021. Текущее техническое состояние / текущие динамические параметры</h3><ul><li><strong>Определение:</strong> состояние (динамические параметры) на момент обследования или проводимого</li></ul><p>этапа мониторинга.</p><ul><li><strong>Норма:</strong> пп. 3.25—3.26.
